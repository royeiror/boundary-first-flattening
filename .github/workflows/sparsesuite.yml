name: Build SuiteSparse for Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['.github/workflows/build_suitesparse.yml']

env:
  BUILD_TYPE: 'Release'

jobs:
  build-suite:
    runs-on: windows-latest
    
    steps:
    # ========== PHASE 1: Checkout (minimal) ==========
    - name: Phase 1 - Checkout Repository
      id: checkout
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
          .github/workflows/build_suitesparse.yml
        sparse-checkout-cone-mode: false
        
    # ========== PHASE 2: Setup Isolated Environment ==========
    - name: Phase 2 - Create Isolated Workspace
      id: setup
      shell: powershell
      run: |
        Write-Host "=== PHASE 2: Setting up isolated workspace ==="
        
        # Create a completely isolated directory outside of the repo
        $suiteWorkspace = "C:\suite_isolated"
        New-Item -ItemType Directory -Force -Path $suiteWorkspace | Out-Null
        Set-Location $suiteWorkspace
        
        Write-Host "Created isolated workspace at: $suiteWorkspace"
        Write-Host "Current directory: $(Get-Location)"
        
        # Store for other steps
        echo "SUITE_WORKSPACE=$suiteWorkspace" | Out-File -FilePath $env:GITHUB_ENV -Append
        
    # ========== PHASE 3: Clone and Verify Repository ==========
    - name: Phase 3 - Clone Build Repository
      id: clone
      shell: powershell
      run: |
        Write-Host "=== PHASE 3: Cloning SuiteSparse build repository ==="
        
        Set-Location $env:SUITE_WORKSPACE
        Write-Host "In workspace: $(Get-Location)"
        
        # Clean any previous clone
        if (Test-Path "suitesparse-build") {
          Write-Host "Removing previous build directory..."
          Remove-Item -Path "suitesparse-build" -Recurse -Force
        }
        
        # Clone the build repository
        Write-Host "Cloning jlblancoc/suitesparse-metis-for-windows..."
        git clone https://github.com/jlblancoc/suitesparse-metis-for-windows.git suitesparse-build
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Failed to clone repository"
          exit 1
        }
        
        Set-Location suitesparse-build
        Write-Host "Successfully cloned to: $(Get-Location)"
        
        # Verify repository structure
        Write-Host "Repository contents:"
        Get-ChildItem
        
        if (-not (Test-Path "CMakeLists.txt")) {
          Write-Error "CMakeLists.txt not found in cloned repository!"
          exit 1
        }
        
        Write-Host "✓ Found CMakeLists.txt"
        Write-Host "✓ Repository ready for building"
        
    # ========== PHASE 4: Install CMake ==========
    - name: Phase 4 - Install CMake
      id: install_cmake
      uses: jwlawson/actions-setup-cmake@v1.14
      with:
        cmake-version: '3.25.x'
        
    # ========== PHASE 5: Configure CMake Build ==========
    - name: Phase 5 - Configure CMake Build
      id: configure
      shell: powershell
      run: |
        Write-Host "=== PHASE 5: Configuring SuiteSparse build ==="
        
        Write-Host "Current directory: $(Get-Location)"
        Write-Host "Checking directory contents..."
        Get-ChildItem
        
        # Create build directory
        New-Item -ItemType Directory -Force -Path "build" | Out-Null
        Set-Location build
        Write-Host "Changed to build directory: $(Get-Location)"
        
        # Configure CMake to BUILD SuiteSparse
        # This repository should download and build SuiteSparse from source
        $cmakeArgs = @(
          "..",
          "-G", "Visual Studio 17 2022",
          "-A", "x64",
          "-DCMAKE_BUILD_TYPE:STRING=$env:BUILD_TYPE",
          "-DCMAKE_INSTALL_PREFIX:STRING=$env:SUITE_WORKSPACE\suite-install",
          "-DHAVE_COMPLEX:BOOL=OFF",
          "-DBUILD_METIS:BOOL=ON",
          "-DDOWNLOAD_SUITESPARSE:BOOL=ON",
          "-DDOWNLOAD_METIS:BOOL=ON"
        )
        
        Write-Host "Configuring CMake with command:"
        Write-Host "cmake $($cmakeArgs -join ' ')"
        Write-Host ""
        Write-Host "Note: This should DOWNLOAD and BUILD SuiteSparse, not find existing installation"
        
        # Run CMake configuration
        & cmake @cmakeArgs
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "CMake configuration failed"
          
          # Show CMake error log if it exists
          $errorLog = "CMakeFiles\CMakeError.log"
          if (Test-Path $errorLog) {
            Write-Host "CMake error log:"
            Get-Content $errorLog | Select-Object -First 100
          }
          exit 1
        }
        
        Write-Host "✓ CMake configuration successful"
        
    # ========== PHASE 6: Build SuiteSparse ==========
    - name: Phase 6 - Build SuiteSparse
      id: build
      shell: powershell
      run: |
        Write-Host "=== PHASE 6: Building SuiteSparse ==="
        
        Write-Host "Building with: cmake --build . --config $env:BUILD_TYPE"
        
        # Build the project
        & cmake --build . --config $env:BUILD_TYPE
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Build failed"
          exit 1
        }
        
        Write-Host "✓ Build completed"
        
        # Show what was built
        Write-Host "Built libraries:"
        Get-ChildItem -Path . -Recurse -Filter "*.lib" -File | 
          Select-Object -First 10 Name, @{Name='SizeKB';Expression={[math]::Round($_.Length/1KB,2)}}
        
    # ========== PHASE 7: Install Libraries ==========
    - name: Phase 7 - Install Libraries
      id: install
      shell: powershell
      run: |
        Write-Host "=== PHASE 7: Installing libraries ==="
        
        Write-Host "Running install target..."
        & cmake --build . --config $env:BUILD_TYPE --target INSTALL
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Install target failed"
          
          # Fallback: manual copy
          Write-Host "Creating manual installation..."
          $installPath = "$env:SUITE_WORKSPACE\suite-install"
          New-Item -ItemType Directory -Force -Path $installPath | Out-Null
          New-Item -ItemType Directory -Force -Path "$installPath\lib" | Out-Null
          
          # Copy all built files
          Get-ChildItem -Path . -Recurse -Filter "*.lib" -File | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination "$installPath\lib\" -Force
          }
          
          Get-ChildItem -Path . -Recurse -Filter "*.dll" -File | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination "$installPath\lib\" -Force
          }
          
          Write-Host "Manual copy completed"
        }
        
        Write-Host "✓ Installation completed"
        
        # Verify installation
        $installPath = "$env:SUITE_WORKSPACE\suite-install"
        if (Test-Path $installPath) {
          $fileCount = (Get-ChildItem -Path $installPath -Recurse -File | Measure-Object).Count
          Write-Host "Total files installed: $fileCount"
        }
        
    # ========== PHASE 8: Copy Binaries to Workspace ==========
    - name: Phase 8 - Copy to GitHub Workspace
      id: copy-back
      shell: powershell
      run: |
        Write-Host "=== PHASE 8: Copying binaries to GitHub workspace ==="
        
        # Return to GitHub workspace
        Set-Location $env:GITHUB_WORKSPACE
        Write-Host "In GitHub workspace: $(Get-Location)"
        
        # Create directory for SuiteSparse binaries
        $binDir = "suitesparse-binaries"
        New-Item -ItemType Directory -Force -Path $binDir | Out-Null
        
        # Copy from installation
        $sourcePath = "$env:SUITE_WORKSPACE\suite-install"
        if (Test-Path $sourcePath) {
          Write-Host "Copying from: $sourcePath"
          Write-Host "Copying to: $binDir"
          
          Copy-Item -Path "$sourcePath\*" -Destination $binDir -Recurse -Force
          
          Write-Host "✓ Binaries copied to workspace"
          Write-Host "Contents:"
          Get-ChildItem -Path $binDir -Recurse -File | 
            Select-Object -First 20 Name, @{Name='SizeKB';Expression={[math]::Round($_.Length/1KB,2)}}
        } else {
          Write-Error "Installation not found at: $sourcePath"
          exit 1
        }
        
    # ========== PHASE 9: Create Archive ==========
    - name: Phase 9 - Create Archive
      id: archive
      shell: powershell
      run: |
        Write-Host "=== PHASE 9: Creating archive ==="
        
        Set-Location $env:GITHUB_WORKSPACE
        
        $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
        $archiveName = "suitesparse-windows-x64-$env:BUILD_TYPE-$timestamp.zip"
        
        Write-Host "Creating archive: $archiveName"
        
        Compress-Archive -Path "suitesparse-binaries\*" -DestinationPath $archiveName -CompressionLevel Optimal
        
        if (Test-Path $archiveName) {
          $sizeMB = (Get-Item $archiveName).Length / 1MB
          Write-Host "✓ Archive created: $archiveName ($([math]::Round($sizeMB,2)) MB)"
          echo "ARCHIVE_NAME=$archiveName" | Out-File -FilePath $env:GITHUB_ENV -Append
        else {
          Write-Error "Failed to create archive"
          exit 1
        }
        
    # ========== PHASE 10: Upload Artifacts ==========
    - name: Phase 10 - Upload Artifacts
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: suitesparse-windows-binaries
        path: |
          ${{ github.workspace }}/*.zip
          ${{ github.workspace }}/suitesparse-binaries
        retention-days: 30
        
    # ========== PHASE 11: Commit to Repository ==========
    - name: Phase 11 - Commit to Repository
      id: commit
      if: github.event_name == 'workflow_dispatch'
      shell: powershell
      run: |
        Write-Host "=== PHASE 11: Committing to repository (optional) ==="
        
        # Configure git
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # Create organized directory for binaries
        $commitDir = "prebuilt/windows/suitesparse/x64/$env:BUILD_TYPE"
        New-Item -ItemType Directory -Force -Path $commitDir | Out-Null
        
        # Copy binaries
        $source = "suitesparse-binaries"
        if (Test-Path $source) {
          Copy-Item -Path "$source\*" -Destination $commitDir -Recurse -Force
          Write-Host "Copied binaries to: $commitDir"
        }
        
        # Check if there are changes
        $status = git status --porcelain
        if ([string]::IsNullOrEmpty($status)) {
          Write-Host "No changes to commit"
          exit 0
        }
        
        # Add and commit
        git add $commitDir
        
        git commit -m "Add SuiteSparse Windows binaries
        
        Platform: Windows x64
        Build type: $env:BUILD_TYPE
        Source: jlblancoc/suitesparse-metis-for-windows
        Build date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')
        Workflow run: #${{ github.run_number }}"
        
        git push
        Write-Host "✓ Binaries committed to repository"
