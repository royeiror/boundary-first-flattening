name: Build SuiteSparse for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly build

env:
  BUILD_TYPE: 'Release'
  INSTALL_PREFIX: 'suitesparse_install'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    # ========== PHASE 1: Clone and Setup ==========
    - name: Phase 1 - Clone suitesparse-metis-for-windows
      id: clone_repo
      shell: powershell
      run: |
        Write-Host "Cloning suitesparse-metis-for-windows repository..."
        
        # Clone the repository that has the build scripts
        git clone https://github.com/jlblancoc/suitesparse-metis-for-windows.git suitesparse-build
        Set-Location suitesparse-build
        
        Write-Host "Repository cloned successfully"
        Write-Host "Current directory: $(Get-Location)"
        
        # Show directory structure
        Write-Host "Repository structure:"
        Get-ChildItem | Select-Object Name
        
    # ========== PHASE 2: Install Dependencies ==========
    - name: Phase 2 - Install CMake
      id: install_cmake
      uses: jwlawson/actions-setup-cmake@v1.14
      with:
        cmake-version: '3.25.x'
        
    - name: Phase 2 - Check CMake version
      id: check_cmake
      shell: powershell
      run: |
        Write-Host "CMake version:"
        cmake --version
        
    # ========== PHASE 3: Configure CMake ==========
    - name: Phase 3 - Configure CMake
      id: configure_cmake
      shell: powershell
      run: |
        Write-Host "Configuring CMake..."
        Write-Host "Current directory: $(Get-Location)"
        
        # Create build directory
        New-Item -ItemType Directory -Force -Path build | Out-Null
        Set-Location build
        
        # Configure with the settings from the README
        $cmakeArgs = @(
          "..",
          "-G", "Visual Studio 17 2022",
          "-A", "x64",
          "-DCMAKE_BUILD_TYPE:STRING=$env:BUILD_TYPE",
          "-DCMAKE_INSTALL_PREFIX:STRING=../$env:INSTALL_PREFIX",
          "-DHAVE_COMPLEX:BOOL=OFF",
          "-DBUILD_METIS:BOOL=ON"
        )
        
        Write-Host "Running CMake configuration..."
        Write-Host "Command: cmake $($cmakeArgs -join ' ')"
        
        & cmake @cmakeArgs
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "CMake configuration failed!"
          
          # Try without Visual Studio generator
          Write-Host "Trying with Ninja generator..."
          $cmakeArgs[1] = "Ninja"
          $cmakeArgs[2] = ""
          $cmakeArgs[3] = ""
          
          # Clean build directory
          Remove-Item -Path .\* -Recurse -Force -ErrorAction SilentlyContinue
          
          & cmake @cmakeArgs
          
          if ($LASTEXITCODE -ne 0) {
            Write-Error "CMake configuration with Ninja also failed!"
            exit 1
          }
        }
        
        Write-Host "CMake configuration successful"
        
    # ========== PHASE 4: Build SuiteSparse ==========
    - name: Phase 4 - Build SuiteSparse
      id: build_suitesparse
      shell: powershell
      run: |
        Write-Host "Building SuiteSparse..."
        
        # Check which generator was used
        $cacheFile = "CMakeCache.txt"
        if (Test-Path $cacheFile) {
          $generator = Select-String -Path $cacheFile -Pattern "CMAKE_GENERATOR:" | Select-Object -First 1
          if ($generator) {
            Write-Host "Using generator: $($generator.Line)"
          }
        }
        
        # Build based on generator
        $buildCmd = "cmake --build . --config $env:BUILD_TYPE"
        
        # Add parallel build for Ninja
        if (Test-Path "build.ninja") {
          $buildCmd = "$buildCmd --parallel 4"
        }
        
        Write-Host "Running: $buildCmd"
        Invoke-Expression $buildCmd
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Build failed!"
          
          # Try building specific target
          Write-Host "Trying to build INSTALL target directly..."
          & cmake --build . --config $env:BUILD_TYPE --target INSTALL
          
          if ($LASTEXITCODE -ne 0) {
            Write-Error "INSTALL target also failed!"
            exit 1
          }
        }
        
        Write-Host "Build completed successfully"
        
    # ========== PHASE 5: Install Libraries ==========
    - name: Phase 5 - Install Libraries
      id: install_libraries
      shell: powershell
      run: |
        Write-Host "Installing libraries..."
        
        # Run install if not already done
        & cmake --build . --config $env:BUILD_TYPE --target INSTALL
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Install failed!"
          exit 1
        }
        
        Write-Host "Installation completed"
        
        # Verify installation
        $installPath = "../$env:INSTALL_PREFIX"
        if (Test-Path $installPath) {
          Write-Host "Installation directory contents:"
          
          # Check for key files
          $configFile = Join-Path $installPath "SuiteSparseConfig.cmake"
          if (Test-Path $configFile) {
            Write-Host "✓ Found SuiteSparseConfig.cmake"
          } else {
            Write-Host "✗ SuiteSparseConfig.cmake not found"
          }
          
          # Count files
          $libs = Get-ChildItem -Path $installPath -Recurse -Filter "*.lib" -File -ErrorAction SilentlyContinue
          $dlls = Get-ChildItem -Path $installPath -Recurse -Filter "*.dll" -File -ErrorAction SilentlyContinue
          $headers = Get-ChildItem -Path $installPath -Recurse -Filter "*.h" -File -ErrorAction SilentlyContinue
          
          Write-Host "Total files installed:"
          Write-Host "  Libraries (.lib): $($libs.Count)"
          Write-Host "  DLLs (.dll): $($dlls.Count)"
          Write-Host "  Headers (.h): $($headers.Count)"
          
          # List important libraries
          Write-Host "Key libraries found:"
          $importantLibs = @("*cholmod*", "*umfpack*", "*spqr*", "*amd*", "*metis*")
          foreach ($pattern in $importantLibs) {
            $found = Get-ChildItem -Path $installPath -Recurse -Filter $pattern -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) {
              Write-Host "  ✓ $($found.Name)"
            }
          }
        }
        
    # ========== PHASE 6: Package Artifacts ==========
    - name: Phase 6 - Package Built Libraries
      id: package_artifacts
      shell: powershell
      run: |
        Write-Host "Packaging built libraries..."
        
        $installPath = "../$env:INSTALL_PREFIX"
        
        if (-not (Test-Path $installPath)) {
          Write-Error "Installation path does not exist!"
          exit 1
        }
        
        $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
        $archiveName = "suitesparse-windows-x64-$env:BUILD_TYPE-$timestamp"
        
        Write-Host "Creating archive: $archiveName.zip"
        
        # Create archive from install directory
        Compress-Archive -Path "$installPath\*" -DestinationPath "$archiveName.zip" -CompressionLevel Optimal
        
        if (Test-Path "$archiveName.zip") {
          $archiveSize = (Get-Item "$archiveName.zip").Length / 1MB
          Write-Host "✓ Created archive: $archiveName.zip ({0:N2} MB)" -f $archiveSize
          
          # Set output
          echo "ARCHIVE_NAME=$archiveName.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "INSTALL_PATH=$installPath" | Out-File -FilePath $env:GITHUB_ENV -Append
        } else {
          Write-Error "Failed to create archive!"
          exit 1
        }
        
    # ========== PHASE 7: Upload Artifacts ==========
    - name: Phase 7 - Upload Build Artifacts
      id: upload_artifacts
      uses: actions/upload-artifact@v4
      with:
        name: suitesparse-windows-binaries
        path: |
          suitesparse-build/${{ env.ARCHIVE_NAME }}
          suitesparse-build/${{ env.INSTALL_PREFIX }}
        retention-days: 30
        
    # ========== PHASE 8: Commit to Repository (Optional) ==========
    - name: Phase 8 - Commit to Main Repository
      id: commit_to_repo
      if: github.event_name == 'workflow_dispatch'
      shell: powershell
      run: |
        Write-Host "Committing built files to repository..."
        
        # Go back to original repository root
        Set-Location $env:GITHUB_WORKSPACE
        
        # Configure git
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # Create artifacts directory
        $artifactsDir = "suitesparse_binaries/windows"
        New-Item -ItemType Directory -Force -Path $artifactsDir | Out-Null
        
        # Copy the built files
        $sourcePath = "suitesparse-build/$env:INSTALL_PREFIX"
        $targetDir = "$artifactsDir/$env:BUILD_TYPE/$(Get-Date -Format 'yyyy-MM-dd')"
        New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
        
        Copy-Item -Path "$sourcePath\*" -Destination $targetDir -Recurse -Force
        
        # Copy the archive
        if (Test-Path "suitesparse-build/$env:ARCHIVE_NAME") {
          Copy-Item -Path "suitesparse-build/$env:ARCHIVE_NAME" -Destination $targetDir -Force
        }
        
        # Add and commit
        git add $artifactsDir
        
        # Check if there are changes
        $status = git status --porcelain
        if ([string]::IsNullOrEmpty($status)) {
          Write-Host "No changes to commit"
          exit 0
        }
        
        git commit -m "Add SuiteSparse Windows binaries ($env:BUILD_TYPE)
        
        Built from: jlblancoc/suitesparse-metis-for-windows
        Build date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')
        Build type: $env:BUILD_TYPE"
        
        git push
        
        Write-Host "✓ Binaries committed to repository"
