name: Build SuiteSparse for Windows

on:
  workflow_dispatch: # Manual trigger for control
  push:
    branches: [ main, master ]
    paths:
      - 'build_suitesparse.yml'
      - '.github/workflows/build_suitesparse.yml'
      - 'CMakeLists.txt'
      - '**/*.cmake'
  pull_request:
    branches: [ main, master ]

env:
  BUILD_TYPE: 'Release'
  INSTALL_PREFIX: 'build/install'
  
jobs:
  build:
    runs-on: windows-latest
    
    steps:
    # ========== PHASE 1: Setup and Source Preparation ==========
    - name: Phase 1 - Checkout Repository
      id: checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive
        
    - name: Phase 1 - Validate Workspace Structure
      id: validate_structure
      shell: powershell
      run: |
        Write-Host "Validating workspace structure..."
        if (-not (Test-Path "CMakeLists.txt")) {
          Write-Error "CMakeLists.txt not found! This repository might not have the correct structure."
          exit 1
        }
        Write-Host "✓ CMakeLists.txt found"
        
        # Create necessary directories
        New-Item -ItemType Directory -Force -Path build | Out-Null
        Write-Host "✓ Created build directory"
        
        # Set environment variable for the source path
        $SP_ROOT = (Get-Location).Path
        echo "SP_ROOT=$SP_ROOT" >> $env:GITHUB_ENV
        Write-Host "✓ Set SP_ROOT to: $SP_ROOT"
        
    # ========== PHASE 2: Install Dependencies ==========
    - name: Phase 2 - Install CMake
      id: install_cmake
      uses: jwlawson/actions-setup-cmake@v1.14
      with:
        cmake-version: '3.25.x'
        
    - name: Phase 2 - Install Build Tools
      id: install_tools
      shell: powershell
      run: |
        Write-Host "Installing build tools..."
        
        # Check for Visual Studio (comes with windows-latest runner)
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
        if ($vsPath) {
          Write-Host "✓ Visual Studio found at: $vsPath"
        } else {
          Write-Error "Visual Studio not found!"
          exit 1
        }
        
        Write-Host "✓ Build tools are available"
        
    # ========== PHASE 3: Configure with CMake ==========
    - name: Phase 3 - Configure CMake
      id: configure_cmake
      shell: powershell
      run: |
        Write-Host "Configuring CMake..."
        
        # Change to build directory
        Set-Location build
        
        # Run CMake configuration with specific settings for Windows
        # Using Ninja generator for faster builds (comes with windows-latest)
        cmake .. `
          -G "Ninja" `
          -DCMAKE_BUILD_TYPE:STRING=$env:BUILD_TYPE `
          -DCMAKE_INSTALL_PREFIX:STRING="../$env:INSTALL_PREFIX" `
          -DCMAKE_POLICY_DEFAULT_CMP0022:STRING=NEW `
          -DCMAKE_MAKE_PROGRAM:STRING=ninja `
          -DHAVE_COMPLEX:BOOL=OFF `
          -A x64
        
        # Check if configuration succeeded
        if ($LASTEXITCODE -ne 0) {
          Write-Error "CMake configuration failed!"
          exit 1
        }
        
        Write-Host "✓ CMake configuration completed"
        
        # List generated files for debugging
        Write-Host "Generated files in build directory:"
        Get-ChildItem -File | Select-Object -First 10 Name
        
    # ========== PHASE 4: Build SuiteSparse ==========
    - name: Phase 4 - Build SuiteSparse
      id: build_suitesparse
      shell: powershell
      run: |
        Write-Host "Building SuiteSparse..."
        
        # Build with Ninja
        cmake --build . --config $env:BUILD_TYPE --target ALL_BUILD
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Build failed!"
          exit 1
        }
        
        Write-Host "✓ SuiteSparse build completed"
        
    # ========== PHASE 5: Install Libraries ==========
    - name: Phase 5 - Install Libraries
      id: install_libraries
      shell: powershell
      run: |
        Write-Host "Installing libraries..."
        
        # Run install target
        cmake --build . --config $env:BUILD_TYPE --target INSTALL
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Install failed!"
          exit 1
        }
        
        Write-Host "✓ Installation completed"
        
        # Show installed files structure
        Write-Host "Installed files structure:"
        $installPath = "../$env:INSTALL_PREFIX"
        if (Test-Path $installPath) {
          Get-ChildItem -Path $installPath -Recurse | 
            Where-Object { $_.PSIsContainer -eq $false } | 
            Select-Object -First 20 FullName
        }
        
    # ========== PHASE 6: Package and Upload Artifacts ==========
    - name: Phase 6 - Package Built Libraries
      id: package_artifacts
      shell: powershell
      run: |
        Write-Host "Packaging built libraries..."
        
        $installPath = "../$env:INSTALL_PREFIX"
        
        # Create a timestamp for the archive
        $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
        $archiveName = "suitesparse-windows-$env:BUILD_TYPE-$timestamp"
        
        # Create zip archive of the installed files
        Compress-Archive -Path "$installPath/*" -DestinationPath "$archiveName.zip" -CompressionLevel Optimal
        
        # Set output variables
        echo "ARCHIVE_NAME=$archiveName.zip" >> $env:GITHUB_ENV
        echo "INSTALL_PATH=$installPath" >> $env:GITHUB_ENV
        
        Write-Host "✓ Created archive: $archiveName.zip"
        
    - name: Phase 6 - Upload Build Artifacts
      id: upload_artifacts
      uses: actions/upload-artifact@v4
      with:
        name: suitesparse-windows-build
        path: |
          build/${{ env.ARCHIVE_NAME }}
          build/CMakeCache.txt
          build/CMakeFiles/CMakeOutput.log
        retention-days: 7
        
    # ========== PHASE 7: Commit to Repository ==========
    - name: Phase 7 - Commit Built Files to Repo
      id: commit_to_repo
      shell: powershell
      run: |
        Write-Host "Committing built files to repository..."
        
        # Configure git
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # Create a branch for the build artifacts
        $branchName = "build/artifacts/windows-${{ github.run_number }}"
        git checkout -b $branchName
        
        # Copy the installed files to a specific directory in the repo
        $artifactsDir = "built_artifacts/windows/${{ github.run_number }}"
        New-Item -ItemType Directory -Force -Path $artifactsDir | Out-Null
        
        # Copy all installed files
        Copy-Item -Path "${{ env.INSTALL_PATH }}/*" -Destination $artifactsDir -Recurse -Force
        
        # Also copy the archive
        Copy-Item -Path "build/${{ env.ARCHIVE_NAME }}" -Destination "$artifactsDir/" -Force
        
        # Add and commit
        git add $artifactsDir
        git commit -m "Add Windows build artifacts - Run ${{ github.run_number }} (${{ env.BUILD_TYPE }})
        
        Built on: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')
        Commit: ${{ github.sha }}
        Runner: ${{ runner.os }}"
        
        # Push to repository
        git push origin $branchName
        
        Write-Host "✓ Build artifacts committed to branch: $branchName"
        
        # Set output for potential pull request creation
        echo "ARTIFACTS_BRANCH=$branchName" >> $env:GITHUB_ENV
        echo "ARTIFACTS_PATH=$artifactsDir" >> $env:GITHUB_ENV
