name: Build SuiteSparse for Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['.github/workflows/build_suitesparse.yml']

env:
  BUILD_TYPE: 'Release'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    # ========== PHASE 1: Checkout and Setup ==========
    - name: Phase 1 - Checkout Repository
      id: checkout
      uses: actions/checkout@v4
      
    - name: Phase 1 - Create Workspace
      id: workspace
      shell: powershell
      run: |
        Write-Host "Creating workspace directory..."
        New-Item -ItemType Directory -Force -Path "suitesparse_build" | Out-Null
        Set-Location "suitesparse_build"
        Write-Host "Workspace: $(Get-Location)"
        
    # ========== PHASE 2: Clone Build Repository ==========
    - name: Phase 2 - Clone Build Repository
      id: clone
      shell: powershell
      run: |
        Write-Host "Cloning suitesparse-metis-for-windows..."
        git clone https://github.com/jlblancoc/suitesparse-metis-for-windows.git src
        Set-Location src
        Write-Host "In repository: $(Get-Location)"
        Write-Host "Repository contents:"
        Get-ChildItem
        
    # ========== PHASE 3: Install CMake ==========
    - name: Phase 3 - Install CMake
      id: install_cmake
      uses: jwlawson/actions-setup-cmake@v1.14
      with:
        cmake-version: '3.25.x'
        
    # ========== PHASE 4: Configure CMake ==========
    - name: Phase 4 - Configure CMake
      id: configure
      shell: powershell
      run: |
        Write-Host "Configuring CMake..."
        Write-Host "Current directory: $(Get-Location)"
        
        # Create build directory
        New-Item -ItemType Directory -Force -Path "build" | Out-Null
        Set-Location build
        
        Write-Host "Build directory: $(Get-Location)"
        Write-Host "Parent directory (source):"
        Get-ChildItem .. | Select-Object Name
        
        # Configure CMake - point to the cloned repository root (which is now ../)
        $cmakeArgs = @(
          "..",
          "-G", "Visual Studio 17 2022",
          "-A", "x64",
          "-DCMAKE_BUILD_TYPE:STRING=$env:BUILD_TYPE",
          "-DCMAKE_INSTALL_PREFIX:STRING=../../../install",  # Go up to workspace root
          "-DHAVE_COMPLEX:BOOL=OFF",
          "-DBUILD_METIS:BOOL=ON"
        )
        
        Write-Host "CMake command: cmake $($cmakeArgs -join ' ')"
        
        # Run CMake
        & cmake @cmakeArgs
        
        if ($LASTEXITCODE -ne 0) {
          Write-Host "Visual Studio generator failed, trying Ninja..."
          
          # Clean and try with Ninja
          Get-ChildItem | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          
          $cmakeArgs = @(
            "..",
            "-G", "Ninja",
            "-DCMAKE_BUILD_TYPE:STRING=$env:BUILD_TYPE",
            "-DCMAKE_INSTALL_PREFIX:STRING=../../../install",
            "-DHAVE_COMPLEX:BOOL=OFF",
            "-DBUILD_METIS:BOOL=ON"
          )
          
          & cmake @cmakeArgs
          
          if ($LASTEXITCODE -ne 0) {
            Write-Error "CMake configuration failed with both generators"
            exit 1
          }
        }
        
        Write-Host "CMake configuration successful"
        
    # ========== PHASE 5: Build SuiteSparse ==========
    - name: Phase 5 - Build SuiteSparse
      id: build
      shell: powershell
      run: |
        Write-Host "Building SuiteSparse..."
        Write-Host "Current directory: $(Get-Location)"
        
        # Check which generator was used
        if (Test-Path "CMakeCache.txt") {
          $generator = Select-String -Path "CMakeCache.txt" -Pattern "CMAKE_GENERATOR:" | Select-Object -First 1
          if ($generator) {
            Write-Host "Generator: $($generator.Line)"
          }
        }
        
        # Build command
        $buildCmd = "cmake --build . --config $env:BUILD_TYPE"
        
        # Add parallel for Ninja
        if (Test-Path "build.ninja") {
          $buildCmd = "$buildCmd --parallel 4"
          Write-Host "Using Ninja with parallel build"
        }
        
        Write-Host "Running: $buildCmd"
        & cmake --build . --config $env:BUILD_TYPE
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Build failed"
          exit 1
        }
        
        Write-Host "Build completed"
        
        # List built files
        Write-Host "Built libraries:"
        Get-ChildItem -Path . -Recurse -Filter "*.lib" -File | 
          Select-Object -First 10 Name, Directory
        
    # ========== PHASE 6: Install Libraries ==========
    - name: Phase 6 - Install Libraries
      id: install
      shell: powershell
      run: |
        Write-Host "Installing libraries..."
        
        & cmake --build . --config $env:BUILD_TYPE --target INSTALL
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Install target failed"
          Write-Host "Trying manual copy..."
          
          # Create install directory
          $installDir = "../../../install"
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          
          # Copy libraries
          $libs = Get-ChildItem -Path . -Recurse -Filter "*.lib" -File
          foreach ($lib in $libs) {
            $dest = Join-Path $installDir (Split-Path $lib.DirectoryName -Leaf)
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Copy-Item -Path $lib.FullName -Destination $dest -Force
          }
          
          Write-Host "Copied $($libs.Count) libraries"
        }
        
        Write-Host "Installation completed"
        
    # ========== PHASE 7: Package Artifacts ==========
    - name: Phase 7 - Package Artifacts
      id: package
      shell: powershell
      run: |
        Write-Host "Packaging artifacts..."
        
        # Go to workspace root
        Set-Location $env:GITHUB_WORKSPACE
        
        $installPath = "suitesparse_build/install"
        if (-not (Test-Path $installPath)) {
          Write-Error "Installation not found at: $installPath"
          exit 1
        }
        
        $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
        $archiveName = "suitesparse-windows-x64-$env:BUILD_TYPE-$timestamp.zip"
        
        Write-Host "Creating archive: $archiveName"
        
        Compress-Archive -Path "$installPath\*" -DestinationPath "suitesparse_build/$archiveName" -CompressionLevel Optimal
        
        if (Test-Path "suitesparse_build/$archiveName") {
          $size = (Get-Item "suitesparse_build/$archiveName").Length / 1MB
          Write-Host "Archive created: $archiveName ($([math]::Round($size,2)) MB)"
          echo "ARCHIVE_NAME=$archiveName" | Out-File -FilePath $env:GITHUB_ENV -Append
        else {
          Write-Error "Failed to create archive"
          exit 1
        }
        
    # ========== PHASE 8: Upload Artifacts ==========
    - name: Phase 8 - Upload Artifacts
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: suitesparse-windows-binaries
        path: |
          suitesparse_build/*.zip
          suitesparse_build/install
        retention-days: 30
        
    # ========== PHASE 9: Commit to Repo ==========
    - name: Phase 9 - Commit to Repository
      id: commit
      if: github.event_name == 'workflow_dispatch'
      shell: powershell
      run: |
        Write-Host "Committing binaries to repository..."
        
        Set-Location $env:GITHUB_WORKSPACE
        
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # Create target directory
        $targetDir = "binaries/suitesparse/windows/x64/$env:BUILD_TYPE"
        New-Item -ItemType Directory -Force -Path $targetDir -ErrorAction SilentlyContinue | Out-Null
        
        # Copy files
        $source = "suitesparse_build/install"
        if (Test-Path $source) {
          Copy-Item -Path "$source\*" -Destination $targetDir -Recurse -Force
          Write-Host "Copied files to $targetDir"
        }
        
        # Check for changes
        $status = git status --porcelain
        if ([string]::IsNullOrEmpty($status)) {
          Write-Host "No changes to commit"
          exit 0
        }
        
        git add $targetDir
        git commit -m "Add SuiteSparse Windows binaries ($env:BUILD_TYPE)
        
        Built from: jlblancoc/suitesparse-metis-for-windows
        Date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')
        Workflow: #${{ github.run_number }}"
        
        git push
        Write-Host "Binaries committed"
