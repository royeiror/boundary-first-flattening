name: Build SuiteSparse for Windows

on:
  workflow_dispatch: # Manual trigger for control
  push:
    branches: [ main, master ]
    paths:
      - 'build_suitesparse.yml'
      - '.github/workflows/build_suitesparse.yml'
      - 'CMakeLists.txt'
      - '**/*.cmake'
  pull_request:
    branches: [ main, master ]

env:
  BUILD_TYPE: 'Release'
  INSTALL_PREFIX: 'build/install'
  
jobs:
  build:
    runs-on: windows-latest
    
    steps:
    # ========== PHASE 1: Setup and Source Preparation ==========
    - name: Phase 1 - Checkout Repository
      id: checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive
        
    - name: Phase 1 - Validate Workspace Structure
      id: validate_structure
      shell: powershell
      run: |
        Write-Host "Validating workspace structure..."
        
        # Check for essential files
        if (-not (Test-Path "CMakeLists.txt")) {
          Write-Error "CMakeLists.txt not found! This repository might not have the correct structure."
          exit 1
        }
        Write-Host "CMakeLists.txt found"
        
        # Create necessary directories
        New-Item -ItemType Directory -Force -Path build | Out-Null
        Write-Host "Created build directory"
        
        # Set environment variable for the source path
        $SP_ROOT = (Get-Location).Path
        echo "SP_ROOT=$SP_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
        Write-Host "Set SP_ROOT to: $SP_ROOT"
        
    # ========== PHASE 2: Install Dependencies ==========
    - name: Phase 2 - Install CMake
      id: install_cmake
      uses: jwlawson/actions-setup-cmake@v1.14
      with:
        cmake-version: '3.25.x'
        
    - name: Phase 2 - Install Build Tools
      id: install_tools
      shell: powershell
      run: |
        Write-Host "Installing build tools..."
        
        # Check for Visual Studio
        if (Test-Path "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe") {
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          if ($vsPath) {
            Write-Host "Visual Studio found at: $vsPath"
          } else {
            Write-Error "Visual Studio installation not found by vswhere!"
            exit 1
          }
        } else {
          Write-Host "vswhere.exe not found, checking for alternative VS installation..."
          # Windows-latest runner should have VS installed
          Write-Host "Assuming Visual Studio is available on windows-latest runner"
        }
        
        Write-Host "Build tools are available"
        
    # ========== PHASE 3: Configure with CMake ==========
    - name: Phase 3 - Configure CMake
      id: configure_cmake
      shell: powershell
      run: |
        Write-Host "Configuring CMake..."
        
        # Change to build directory
        Set-Location build
        
        # Run CMake configuration
        # Note: Using Visual Studio generator since SuiteSparse may need specific VS settings
        $cmakeCmd = "cmake .. "
        $cmakeCmd += "-G `"Visual Studio 17 2022`" "
        $cmakeCmd += "-A `"x64`" "
        $cmakeCmd += "-DCMAKE_BUILD_TYPE:STRING=$env:BUILD_TYPE "
        $cmakeCmd += "-DCMAKE_INSTALL_PREFIX:STRING=`"../$env:INSTALL_PREFIX`" "
        $cmakeCmd += "-DHAVE_COMPLEX:BOOL=OFF "
        $cmakeCmd += "-DCMAKE_POLICY_DEFAULT_CMP0022:STRING=NEW"
        
        Write-Host "Running: $cmakeCmd"
        Invoke-Expression $cmakeCmd
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "CMake configuration failed!"
          exit 1
        }
        
        Write-Host "CMake configuration completed"
        
    # ========== PHASE 4: Build SuiteSparse ==========
    - name: Phase 4 - Build SuiteSparse
      id: build_suitesparse
      shell: powershell
      run: |
        Write-Host "Building SuiteSparse..."
        Write-Host "Build type: $env:BUILD_TYPE"
        
        # Build with MSBuild (Visual Studio)
        $buildCmd = "cmake --build . --config $env:BUILD_TYPE"
        Write-Host "Running: $buildCmd"
        Invoke-Expression $buildCmd
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Build failed!"
          exit 1
        }
        
        Write-Host "SuiteSparse build completed"
        
        # List important built files
        Write-Host "Looking for built libraries..."
        Get-ChildItem -Path . -Recurse -Filter "*.lib" -File | Select-Object -First 10 FullName
        Get-ChildItem -Path . -Recurse -Filter "*.dll" -File | Select-Object -First 10 FullName
        
    # ========== PHASE 5: Install Libraries ==========
    - name: Phase 5 - Install Libraries
      id: install_libraries
      shell: powershell
      run: |
        Write-Host "Installing libraries..."
        
        # Run install target
        $installCmd = "cmake --build . --config $env:BUILD_TYPE --target INSTALL"
        Write-Host "Running: $installCmd"
        Invoke-Expression $installCmd
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Install failed!"
          exit 1
        }
        
        Write-Host "Installation completed"
        
        # Verify installation
        $installPath = "../$env:INSTALL_PREFIX"
        if (Test-Path $installPath) {
          Write-Host "Installation directory contents:"
          Get-ChildItem -Path $installPath -Recurse | 
            Where-Object { $_.PSIsContainer -eq $false } | 
            Select-Object -First 30 FullName, Length
          
          # Check for essential files
          $configFile = Join-Path $installPath "SuiteSparseConfig.cmake"
          if (Test-Path $configFile) {
            Write-Host "Found SuiteSparseConfig.cmake"
          } else {
            Write-Warning "SuiteSparseConfig.cmake not found!"
          }
        } else {
          Write-Error "Installation directory not created!"
          exit 1
        }
        
    # ========== PHASE 6: Package and Upload Artifacts ==========
    - name: Phase 6 - Package Built Libraries
      id: package_artifacts
      shell: powershell
      run: |
        Write-Host "Packaging built libraries..."
        
        $installPath = "../$env:INSTALL_PREFIX"
        
        # Verify installation exists
        if (-not (Test-Path $installPath)) {
          Write-Error "Installation path does not exist: $installPath"
          exit 1
        }
        
        # Create a timestamp for the archive
        $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
        $archiveName = "suitesparse-windows-$env:BUILD_TYPE-$timestamp"
        
        # Create zip archive
        Write-Host "Creating archive: $archiveName.zip"
        $sourcePath = Resolve-Path $installPath
        Compress-Archive -Path "$sourcePath\*" -DestinationPath "$archiveName.zip" -CompressionLevel Optimal
        
        # Verify archive was created
        if (Test-Path "$archiveName.zip") {
          $archiveSize = (Get-Item "$archiveName.zip").Length / 1MB
          Write-Host "Created archive: $archiveName.zip (Size: {0:N2} MB)" -f $archiveSize
          
          # Set output variables
          echo "ARCHIVE_NAME=$archiveName.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "INSTALL_PATH=$installPath" | Out-File -FilePath $env:GITHUB_ENV -Append
        } else {
          Write-Error "Failed to create archive!"
          exit 1
        }
        
    - name: Phase 6 - Upload Build Artifacts
      id: upload_artifacts
      uses: actions/upload-artifact@v4
      with:
        name: suitesparse-windows-${{ env.BUILD_TYPE }}-${{ github.run_number }}
        path: |
          build/*.zip
          build/CMakeCache.txt
          ${{ env.INSTALL_PREFIX }}
        retention-days: 7
        
    # ========== PHASE 7: Commit to Repository (Optional) ==========
    - name: Phase 7 - Commit Built Files to Repo (Optional)
      id: commit_to_repo
      if: success() && github.event_name == 'workflow_dispatch'  # Only on manual runs
      shell: powershell
      run: |
        Write-Host "Preparing to commit built files to repository..."
        
        # Configure git
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # Check if there are changes to commit
        $artifactsDir = "built_artifacts"
        New-Item -ItemType Directory -Force -Path $artifactsDir | Out-Null
        
        # Copy the installed files
        $installPath = "$env:INSTALL_PREFIX"
        $targetDir = "$artifactsDir/windows/$env:BUILD_TYPE/${{ github.run_number }}"
        New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
        
        Copy-Item -Path "$installPath\*" -Destination $targetDir -Recurse -Force
        
        # Also copy the archive if it exists
        if (Test-Path "build\$env:ARCHIVE_NAME") {
          Copy-Item -Path "build\$env:ARCHIVE_NAME" -Destination $targetDir -Force
        }
        
        # Check if there are any files to commit
        $filesToCommit = Get-ChildItem -Path $artifactsDir -Recurse -File
        if ($filesToCommit.Count -eq 0) {
          Write-Host "No files to commit"
          exit 0
        }
        
        Write-Host "Files to commit:"
        $filesToCommit | ForEach-Object { Write-Host "  $($_.FullName)" }
        
        # Create a branch for the artifacts
        $branchName = "build/artifacts/windows-${{ github.run_number }}"
        git checkout -b $branchName
        
        # Add and commit
        git add $artifactsDir
        git commit -m "Add Windows build artifacts - Run ${{ github.run_number }} ($env:BUILD_TYPE)
        
        Built on: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')
        Source commit: ${{ github.sha }}
        Build type: $env:BUILD_TYPE"
        
        # Push to repository
        Write-Host "Pushing to branch: $branchName"
        git push origin $branchName
        
        Write-Host "Build artifacts committed to branch: $branchName"
        
        # Create output for potential use
        echo "ARTIFACTS_BRANCH=$branchName" | Out-File -FilePath $env:GITHUB_ENV -Append
        echo "ARTIFACTS_PATH=$targetDir" | Out-File -FilePath $env:GITHUB_ENV -Append
