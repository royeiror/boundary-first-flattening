name: Build SuiteSparse for Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['.github/workflows/build_suitesparse.yml']

env:
  BUILD_TYPE: 'Release'

jobs:
  build-suite:
    runs-on: windows-latest
    
    steps:
    # ========== PHASE 1: Setup Isolation ==========
    - name: Phase 1 - Create Isolated Workspace
      id: setup
      shell: powershell
      run: |
        Write-Host "Creating isolated workspace for SuiteSparse build..."
        
        # Create a completely separate workspace
        $workspaceRoot = "C:\suite_workspace"
        New-Item -ItemType Directory -Force -Path $workspaceRoot | Out-Null
        Set-Location $workspaceRoot
        
        Write-Host "Workspace: $workspaceRoot"
        Write-Host "Isolated from main repository"
        
        # Store workspace path for later steps
        echo "WORKSPACE_ROOT=$workspaceRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
        
    # ========== PHASE 2: Clone Build Repository ==========
    - name: Phase 2 - Clone SuiteSparse Build Repository
      id: clone
      shell: powershell
      run: |
        Write-Host "Cloning suitesparse-metis-for-windows repository..."
        
        Set-Location $env:WORKSPACE_ROOT
        
        # Remove any existing clone
        if (Test-Path "suitesparse-build") {
          Remove-Item -Path "suitesparse-build" -Recurse -Force
        }
        
        # Clone the repository
        git clone https://github.com/jlblancoc/suitesparse-metis-for-windows.git suitesparse-build
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Failed to clone repository"
          exit 1
        }
        
        Set-Location suitesparse-build
        Write-Host "In build repository: $(Get-Location)"
        Write-Host "Repository structure:"
        Get-ChildItem
        
    # ========== PHASE 3: Install CMake ==========
    - name: Phase 3 - Install CMake
      id: install_cmake
      uses: jwlawson/actions-setup-cmake@v1.14
      with:
        cmake-version: '3.25.x'
        
    # ========== PHASE 4: Configure CMake ==========
    - name: Phase 4 - Configure CMake
      id: configure
      shell: powershell
      run: |
        Write-Host "Configuring SuiteSparse build..."
        Write-Host "Current directory: $(Get-Location)"
        
        # Verify we're in the right place
        if (-not (Test-Path "CMakeLists.txt")) {
          Write-Error "Not in suitesparse-metis-for-windows repository!"
          Write-Host "Files in current directory:"
          Get-ChildItem
          exit 1
        }
        
        Write-Host "Found SuiteSparse build CMakeLists.txt"
        
        # Create build directory
        New-Item -ItemType Directory -Force -Path "build" | Out-Null
        Set-Location build
        
        Write-Host "Build directory: $(Get-Location)"
        
        # Configure with the correct settings from the README
        # The key is that this repository should BUILD SuiteSparse, not FIND it
        $cmakeArgs = @(
          "..",
          "-G", "Visual Studio 17 2022",
          "-A", "x64",
          "-DCMAKE_BUILD_TYPE:STRING=$env:BUILD_TYPE",
          "-DCMAKE_INSTALL_PREFIX:STRING=$env:WORKSPACE_ROOT\suitesparse-install",
          "-DHAVE_COMPLEX:BOOL=OFF",
          "-DBUILD_METIS:BOOL=ON",
          "-DDOWNLOAD_SUITESPARSE:BOOL=ON",  # Let CMake download SuiteSparse sources
          "-DDOWNLOAD_METIS:BOOL=ON"        # Let CMake download METIS sources
        )
        
        Write-Host "Configuring CMake to BUILD SuiteSparse (not find it)"
        Write-Host "Command: cmake $($cmakeArgs -join ' ')"
        
        & cmake @cmakeArgs
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "CMake configuration failed"
          
          # Show CMakeCache for debugging
          if (Test-Path "CMakeCache.txt") {
            Write-Host "CMakeCache contents (first 50 lines):"
            Get-Content "CMakeCache.txt" | Select-Object -First 50
          }
          exit 1
        }
        
        Write-Host "CMake configuration successful"
        
    # ========== PHASE 5: Build SuiteSparse ==========
    - name: Phase 5 - Build SuiteSparse
      id: build
      shell: powershell
      run: |
        Write-Host "Building SuiteSparse..."
        
        & cmake --build . --config $env:BUILD_TYPE --parallel 4
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Build failed"
          
          # Try without parallel
          Write-Host "Trying without parallel build..."
          & cmake --build . --config $env:BUILD_TYPE
          
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Build still failed"
            exit 1
          }
        }
        
        Write-Host "Build completed successfully"
        
        # Show what was built
        Write-Host "Built files:"
        Get-ChildItem -Path . -Recurse -Filter "*.lib" -File | 
          Select-Object -First 10 Name, @{Name='SizeKB';Expression={[math]::Round($_.Length/1KB,2)}}
        
    # ========== PHASE 6: Install Libraries ==========
    - name: Phase 6 - Install Libraries
      id: install
      shell: powershell
      run: |
        Write-Host "Installing libraries..."
        
        & cmake --build . --config $env:BUILD_TYPE --target INSTALL
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Install target failed"
          
          # Manual installation fallback
          Write-Host "Creating manual installation..."
          $installPath = "$env:WORKSPACE_ROOT\suitesparse-install"
          New-Item -ItemType Directory -Force -Path $installPath | Out-Null
          
          # Copy all built libraries
          $libs = Get-ChildItem -Path . -Recurse -Filter "*.lib" -File
          $dlls = Get-ChildItem -Path . -Recurse -Filter "*.dll" -File
          
          foreach ($file in ($libs + $dlls)) {
            $destDir = Join-Path $installPath "lib"
            New-Item -ItemType Directory -Force -Path $destDir -ErrorAction SilentlyContinue | Out-Null
            Copy-Item -Path $file.FullName -Destination $destDir -Force
          }
          
          Write-Host "Manually installed $($libs.Count) .lib files and $($dlls.Count) .dll files"
        }
        
        Write-Host "Installation completed"
        
        # Verify installation
        $installPath = "$env:WORKSPACE_ROOT\suitesparse-install"
        if (Test-Path $installPath) {
          Write-Host "Installation location: $installPath"
          $fileCount = (Get-ChildItem -Path $installPath -Recurse -File | Measure-Object).Count
          Write-Host "Total files installed: $fileCount"
        }
        
    # ========== PHASE 7: Copy Back to Repository ==========
    - name: Phase 7 - Copy to Repository Workspace
      id: copy-back
      shell: powershell
      run: |
        Write-Host "Copying built binaries to repository workspace..."
        
        # Go back to GitHub workspace
        Set-Location $env:GITHUB_WORKSPACE
        
        # Create directory for SuiteSparse binaries
        $targetDir = "suitesparse-binaries"
        New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
        
        # Copy from installation
        $sourcePath = "$env:WORKSPACE_ROOT\suitesparse-install"
        if (Test-Path $sourcePath) {
          Copy-Item -Path "$sourcePath\*" -Destination $targetDir -Recurse -Force
          Write-Host "Copied binaries to: $targetDir"
          
          # List what was copied
          Write-Host "Contents of $targetDir:"
          Get-ChildItem -Path $targetDir -Recurse -File | 
            Select-Object -First 20 Name, @{Name='SizeKB';Expression={[math]::Round($_.Length/1KB,2)}}
        } else {
          Write-Error "Installation not found at: $sourcePath"
          exit 1
        }
        
    # ========== PHASE 8: Package Artifacts ==========
    - name: Phase 8 - Package Artifacts
      id: package
      shell: powershell
      run: |
        Write-Host "Packaging artifacts..."
        
        Set-Location $env:GITHUB_WORKSPACE
        
        $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
        $archiveName = "suitesparse-windows-x64-$env:BUILD_TYPE-$timestamp.zip"
        
        Write-Host "Creating archive: $archiveName"
        
        Compress-Archive -Path "suitesparse-binaries\*" -DestinationPath $archiveName -CompressionLevel Optimal
        
        if (Test-Path $archiveName) {
          $sizeMB = (Get-Item $archiveName).Length / 1MB
          Write-Host "Archive created: $archiveName ($([math]::Round($sizeMB,2)) MB)"
          echo "ARCHIVE_NAME=$archiveName" | Out-File -FilePath $env:GITHUB_ENV -Append
        else {
          Write-Error "Failed to create archive"
          exit 1
        }
        
    # ========== PHASE 9: Upload Artifacts ==========
    - name: Phase 9 - Upload Artifacts
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: suitesparse-windows-binaries
        path: |
          ${{ github.workspace }}/*.zip
          ${{ github.workspace }}/suitesparse-binaries
        retention-days: 30
        
    # ========== PHASE 10: Commit to Repo (Optional) ==========
    - name: Phase 10 - Commit to Repository
      id: commit
      if: github.event_name == 'workflow_dispatch'
      shell: powershell
      run: |
        Write-Host "Committing binaries to repository..."
        
        # Configure git
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # Create organized directory structure
        $commitDir = "prebuilt/suitesparse/windows/x64/$env:BUILD_TYPE"
        New-Item -ItemType Directory -Force -Path $commitDir | Out-Null
        
        # Copy binaries
        $source = "suitesparse-binaries"
        if (Test-Path $source) {
          Copy-Item -Path "$source\*" -Destination $commitDir -Recurse -Force
          Write-Host "Copied to: $commitDir"
        }
        
        # Copy archive
        if (Test-Path $env:ARCHIVE_NAME) {
          Copy-Item -Path $env:ARCHIVE_NAME -Destination $commitDir -Force
        }
        
        # Check for changes
        $status = git status --porcelain
        if ([string]::IsNullOrEmpty($status)) {
          Write-Host "No changes to commit"
          exit 0
        }
        
        # Add and commit
        git add $commitDir
        git commit -m "Add SuiteSparse Windows prebuilt binaries
        
        Architecture: x64
        Build type: $env:BUILD_TYPE
        Source: jlblancoc/suitesparse-metis-for-windows
        Build date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
        
        git push
        Write-Host "Binaries committed to repository"
