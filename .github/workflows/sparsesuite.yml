name: Build SuiteSparse for Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['.github/workflows/build_suitesparse.yml']

env:
  BUILD_TYPE: 'Release'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    # ========== PHASE 1: Checkout and Setup ==========
    - name: Phase 1 - Checkout Repository
      id: checkout
      uses: actions/checkout@v4
      
    - name: Phase 1 - Create Build Directory
      id: workspace
      shell: powershell
      run: |
        Write-Host "Creating build workspace..."
        # Use a unique directory name
        New-Item -ItemType Directory -Force -Path "suitesparse_workspace" | Out-Null
        Set-Location "suitesparse_workspace"
        Write-Host "Workspace: $(Get-Location)"
        
    # ========== PHASE 2: Clone Build Repository ==========
    - name: Phase 2 - Clone Build Repository
      id: clone
      shell: powershell
      run: |
        Write-Host "Cloning suitesparse-metis-for-windows..."
        
        # Remove any existing directory first
        if (Test-Path "suitesparse_src") {
          Remove-Item -Path "suitesparse_src" -Recurse -Force -ErrorAction SilentlyContinue
        }
        
        # Clone to a unique name
        git clone https://github.com/jlblancoc/suitesparse-metis-for-windows.git suitesparse_src
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Failed to clone repository"
          exit 1
        }
        
        Set-Location suitesparse_src
        Write-Host "In repository: $(Get-Location)"
        Write-Host "Repository structure:"
        Get-ChildItem
        
    # ========== PHASE 3: Install CMake ==========
    - name: Phase 3 - Install CMake
      id: install_cmake
      uses: jwlawson/actions-setup-cmake@v1.14
      with:
        cmake-version: '3.25.x'
        
    - name: Phase 3 - Verify CMake
      id: verify_cmake
      shell: powershell
      run: |
        Write-Host "CMake version:"
        cmake --version
        
    # ========== PHASE 4: Configure CMake ==========
    - name: Phase 4 - Configure CMake
      id: configure
      shell: powershell
      run: |
        Write-Host "Configuring CMake..."
        Write-Host "Current directory: $(Get-Location)"
        
        # Check for CMakeLists.txt
        if (-not (Test-Path "CMakeLists.txt")) {
          Write-Error "CMakeLists.txt not found!"
          Write-Host "Available files:"
          Get-ChildItem
          exit 1
        }
        
        Write-Host "Found CMakeLists.txt"
        
        # Create build directory
        New-Item -ItemType Directory -Force -Path "build" | Out-Null
        Set-Location build
        
        Write-Host "Build directory: $(Get-Location)"
        
        # Configure CMake - try Visual Studio first
        Write-Host "Configuring with Visual Studio 2022..."
        
        $cmakeArgs = @(
          "..",
          "-G", "Visual Studio 17 2022",
          "-A", "x64",
          "-DCMAKE_BUILD_TYPE:STRING=$env:BUILD_TYPE",
          "-DCMAKE_INSTALL_PREFIX:STRING=../../suitesparse_install",
          "-DHAVE_COMPLEX:BOOL=OFF",
          "-DBUILD_METIS:BOOL=ON"
        )
        
        Write-Host "Running: cmake $($cmakeArgs -join ' ')"
        
        & cmake @cmakeArgs
        
        if ($LASTEXITCODE -ne 0) {
          Write-Host "Visual Studio generator failed, trying Ninja..."
          
          # Clean build directory
          Get-ChildItem | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          
          $cmakeArgs = @(
            "..",
            "-G", "Ninja",
            "-DCMAKE_BUILD_TYPE:STRING=$env:BUILD_TYPE",
            "-DCMAKE_INSTALL_PREFIX:STRING=../../suitesparse_install",
            "-DHAVE_COMPLEX:BOOL=OFF",
            "-DBUILD_METIS:BOOL=ON"
          )
          
          & cmake @cmakeArgs
          
          if ($LASTEXITCODE -ne 0) {
            Write-Error "CMake configuration failed"
            Write-Host "Trying without METIS..."
            
            Get-ChildItem | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
            
            $cmakeArgs = @(
              "..",
              "-G", "Ninja",
              "-DCMAKE_BUILD_TYPE:STRING=$env:BUILD_TYPE",
              "-DCMAKE_INSTALL_PREFIX:STRING=../../suitesparse_install",
              "-DHAVE_COMPLEX:BOOL=OFF",
              "-DBUILD_METIS:BOOL=OFF"
            )
            
            & cmake @cmakeArgs
            
            if ($LASTEXITCODE -ne 0) {
              Write-Error "All CMake configurations failed"
              exit 1
            }
          }
        }
        
        Write-Host "CMake configuration successful"
        
    # ========== PHASE 5: Build SuiteSparse ==========
    - name: Phase 5 - Build SuiteSparse
      id: build_step
      shell: powershell
      run: |
        Write-Host "Building SuiteSparse..."
        
        # Determine build command based on generator
        $buildCmd = "cmake --build . --config $env:BUILD_TYPE"
        
        if (Test-Path "build.ninja") {
          $buildCmd = "$buildCmd --parallel 4"
          Write-Host "Using Ninja generator with parallel build"
        } else {
          Write-Host "Using Visual Studio generator"
        }
        
        Write-Host "Running: $buildCmd"
        & cmake --build . --config $env:BUILD_TYPE
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Build failed"
          
          # Try building the main target
          Write-Host "Trying to build SuiteSparseProject target..."
          & cmake --build . --config $env:BUILD_TYPE --target SuiteSparseProject
          
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Build still failed"
            exit 1
          }
        }
        
        Write-Host "Build completed"
        
        # List built files
        Write-Host "Built libraries found:"
        $libs = Get-ChildItem -Path . -Recurse -Filter "*.lib" -File
        if ($libs.Count -gt 0) {
          $libs | Select-Object -First 10 Name, @{Name='SizeKB';Expression={[math]::Round($_.Length/1KB,2)}}
        } else {
          Write-Host "No .lib files found"
        }
        
    # ========== PHASE 6: Install Libraries ==========
    - name: Phase 6 - Install Libraries
      id: install
      shell: powershell
      run: |
        Write-Host "Installing libraries..."
        
        & cmake --build . --config $env:BUILD_TYPE --target INSTALL
        
        if ($LASTEXITCODE -ne 0) {
          Write-Host "Install target failed, copying manually..."
          
          $installPath = "../../suitesparse_install"
          New-Item -ItemType Directory -Force -Path $installPath | Out-Null
          
          # Copy all built files
          $libFiles = Get-ChildItem -Path . -Recurse -Filter "*.lib" -File
          $dllFiles = Get-ChildItem -Path . -Recurse -Filter "*.dll" -File
          
          foreach ($file in ($libFiles + $dllFiles)) {
            $destDir = Join-Path $installPath "lib"
            New-Item -ItemType Directory -Force -Path $destDir | Out-Null
            Copy-Item -Path $file.FullName -Destination $destDir -Force
          }
          
          Write-Host "Manually copied $($libFiles.Count) .lib files and $($dllFiles.Count) .dll files"
        }
        
        Write-Host "Installation completed"
        
        # Verify installation
        $installPath = "../../suitesparse_install"
        if (Test-Path $installPath) {
          Write-Host "Installation location: $installPath"
          $totalFiles = (Get-ChildItem -Path $installPath -Recurse -File | Measure-Object).Count
          Write-Host "Total files installed: $totalFiles"
        }
        
    # ========== PHASE 7: Package Artifacts ==========
    - name: Phase 7 - Package Artifacts
      id: package
      shell: powershell
      run: |
        Write-Host "Packaging artifacts..."
        
        # Go to workspace root
        Set-Location $env:GITHUB_WORKSPACE
        
        $installPath = "suitesparse_workspace/suitesparse_install"
        if (-not (Test-Path $installPath)) {
          Write-Error "Installation not found: $installPath"
          exit 1
        }
        
        $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
        $archiveName = "suitesparse-windows-x64-$env:BUILD_TYPE-$timestamp.zip"
        
        Write-Host "Creating archive: $archiveName"
        
        # Create archive in workspace root
        Compress-Archive -Path "$installPath\*" -DestinationPath "suitesparse_workspace/$archiveName" -CompressionLevel Optimal
        
        if (Test-Path "suitesparse_workspace/$archiveName") {
          $sizeMB = (Get-Item "suitesparse_workspace/$archiveName").Length / 1MB
          Write-Host "Archive created: $archiveName ($([math]::Round($sizeMB,2)) MB)"
          echo "ARCHIVE_NAME=$archiveName" | Out-File -FilePath $env:GITHUB_ENV -Append
        else {
          Write-Error "Archive creation failed"
          exit 1
        }
        
    # ========== PHASE 8: Upload Artifacts ==========
    - name: Phase 8 - Upload Artifacts
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: suitesparse-windows-binaries
        path: |
          suitesparse_workspace/*.zip
          suitesparse_workspace/suitesparse_install
        retention-days: 30
        
    # ========== PHASE 9: Commit to Repo (Optional) ==========
    - name: Phase 9 - Commit to Repository
      id: commit
      if: github.event_name == 'workflow_dispatch'
      shell: powershell
      run: |
        Write-Host "Committing binaries to repository..."
        
        Set-Location $env:GITHUB_WORKSPACE
        
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # Create directory for binaries
        $binDir = "prebuilt/suitesparse/windows/x64/$env:BUILD_TYPE"
        New-Item -ItemType Directory -Force -Path $binDir | Out-Null
        
        # Copy from installation
        $source = "suitesparse_workspace/suitesparse_install"
        if (Test-Path $source) {
          Copy-Item -Path "$source\*" -Destination $binDir -Recurse -Force
          Write-Host "Copied binaries to $binDir"
        }
        
        # Check if there are changes
        $status = git status --porcelain
        if ([string]::IsNullOrEmpty($status)) {
          Write-Host "No changes to commit"
          exit 0
        }
        
        # Add and commit
        git add $binDir
        git commit -m "Add prebuilt SuiteSparse Windows binaries
        
        Architecture: x64
        Build type: $env:BUILD_TYPE
        Date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')
        Source: jlblancoc/suitesparse-metis-for-windows"
        
        git push
        Write-Host "Binaries committed to repository"
