name: Build SuiteSparse for Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['.github/workflows/build_suitesparse.yml']

env:
  BUILD_TYPE: 'Release'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    # ========== PHASE 1: Initial Setup ==========
    - name: Phase 1 - Setup Workspace
      id: setup
      shell: powershell
      run: |
        Write-Host "Setting up workspace..."
        Write-Host "Workspace: $env:GITHUB_WORKSPACE"
        
        New-Item -ItemType Directory -Force -Path "suite_build" | Out-Null
        Set-Location "suite_build"
        Write-Host "Working directory: $(Get-Location)"
        
    # ========== PHASE 2: Clone Repository ==========
    - name: Phase 2 - Clone suitesparse-metis-for-windows
      id: clone_repo
      shell: powershell
      run: |
        Write-Host "Cloning suitesparse-metis-for-windows repository..."
        
        git clone https://github.com/jlblancoc/suitesparse-metis-for-windows.git src
        Set-Location src
        
        Write-Host "Repository cloned to: $(Get-Location)"
        Write-Host "Directory contents:"
        Get-ChildItem
        
    # ========== PHASE 3: Install Dependencies ==========
    - name: Phase 3 - Install CMake
      id: install_cmake
      uses: jwlawson/actions-setup-cmake@v1.14
      with:
        cmake-version: '3.25.x'
        
    # ========== PHASE 4: Configure CMake ==========
    - name: Phase 4 - Configure CMake
      id: configure_cmake
      shell: powershell
      run: |
        Write-Host "Configuring CMake..."
        Write-Host "Current directory: $(Get-Location)"
        
        New-Item -ItemType Directory -Force -Path "build" | Out-Null
        Set-Location build
        
        Write-Host "Build directory: $(Get-Location)"
        
        # Configure CMake
        $cmakeArgs = @(
          "..",
          "-G", "Visual Studio 17 2022",
          "-A", "x64",
          "-DCMAKE_BUILD_TYPE:STRING=$env:BUILD_TYPE",
          "-DCMAKE_INSTALL_PREFIX:STRING=../../install",
          "-DHAVE_COMPLEX:BOOL=OFF",
          "-DBUILD_METIS:BOOL=ON"
        )
        
        Write-Host "Running CMake with: $($cmakeArgs -join ' ')"
        
        & cmake @cmakeArgs
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "CMake configuration failed"
          Write-Host "Trying alternative configuration..."
          
          # Clean and try again
          Remove-Item -Path .\* -Recurse -Force -ErrorAction SilentlyContinue
          
          $cmakeArgs2 = @(
            "..",
            "-G", "Ninja",
            "-DCMAKE_BUILD_TYPE:STRING=$env:BUILD_TYPE",
            "-DCMAKE_INSTALL_PREFIX:STRING=../../install",
            "-DHAVE_COMPLEX:BOOL=OFF",
            "-DBUILD_METIS:BOOL=OFF"  # Try without METIS first
          )
          
          & cmake @cmakeArgs2
          
          if ($LASTEXITCODE -ne 0) {
            Write-Error "CMake configuration still failed"
            exit 1
          }
        }
        
        Write-Host "CMake configuration successful"
        
    # ========== PHASE 5: Build SuiteSparse ==========
    - name: Phase 5 - Build SuiteSparse
      id: build_suitesparse
      shell: powershell
      run: |
        Write-Host "Building SuiteSparse..."
        Write-Host "Current directory: $(Get-Location)"
        
        # Check what build system was configured
        if (Test-Path "CMakeCache.txt") {
          $cache = Get-Content "CMakeCache.txt" -Raw
          if ($cache -match "CMAKE_GENERATOR:INTERNAL=(.*)") {
            Write-Host "Using generator: $($matches[1])"
          }
        }
        
        # Build command
        $buildCmd = "cmake --build . --config $env:BUILD_TYPE"
        
        # Check if we have ninja build files
        if (Test-Path "build.ninja") {
          $buildCmd = "$buildCmd --parallel 4"
        }
        
        Write-Host "Running: $buildCmd"
        
        & cmake --build . --config $env:BUILD_TYPE
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Build failed"
          
          # Try building specific targets
          Write-Host "Trying to build key libraries individually..."
          
          $targets = @("SuiteSparseProject", "cholmod", "umfpack", "amd", "spqr")
          foreach ($target in $targets) {
            Write-Host "Building target: $target"
            & cmake --build . --config $env:BUILD_TYPE --target $target
          }
          
          # Check if we built anything
          $libs = Get-ChildItem -Path . -Recurse -Filter "*.lib" -File
          if ($libs.Count -eq 0) {
            Write-Error "No libraries were built"
            exit 1
          }
        }
        
        Write-Host "Build completed"
        
        # Show built files
        Write-Host "Built libraries found:"
        Get-ChildItem -Path . -Recurse -Filter "*.lib" -File | 
          Select-Object -First 10 Name, @{Name='SizeKB';Expression={[math]::Round($_.Length/1KB,2)}} | Format-Table
        
    # ========== PHASE 6: Install Libraries ==========
    - name: Phase 6 - Install Libraries
      id: install_libraries
      shell: powershell
      run: |
        Write-Host "Installing libraries..."
        
        & cmake --build . --config $env:BUILD_TYPE --target INSTALL
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Install target failed"
          
          # Manual copy as fallback
          Write-Host "Attempting manual copy of libraries..."
          $installPath = "../../install"
          New-Item -ItemType Directory -Force -Path $installPath | Out-Null
          
          # Copy all libraries and DLLs
          $libs = Get-ChildItem -Path . -Recurse -Filter "*.lib" -File
          $dlls = Get-ChildItem -Path . -Recurse -Filter "*.dll" -File
          
          foreach ($file in ($libs + $dlls)) {
            $destDir = Join-Path $installPath (Split-Path $file.DirectoryName -Leaf)
            New-Item -ItemType Directory -Force -Path $destDir | Out-Null
            Copy-Item -Path $file.FullName -Destination $destDir -Force
          }
          
          Write-Host "Manually copied $($libs.Count) libraries and $($dlls.Count) DLLs"
        }
        
        Write-Host "Installation completed"
        
        # Verify
        $installPath = "../../install"
        if (Test-Path $installPath) {
          Write-Host "Installation contents:"
          $totalFiles = (Get-ChildItem -Path $installPath -Recurse -File | Measure-Object).Count
          Write-Host "Total files installed: $totalFiles"
        }
        
    # ========== PHASE 7: Package Artifacts ==========
    - name: Phase 7 - Package Built Libraries
      id: package_artifacts
      shell: powershell
      run: |
        Write-Host "Packaging built libraries..."
        
        Set-Location $env:GITHUB_WORKSPACE
        Set-Location suite_build
        
        $installPath = "install"
        if (-not (Test-Path $installPath)) {
          Write-Error "Installation path not found"
          exit 1
        }
        
        $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
        $archiveName = "suitesparse-windows-x64-$env:BUILD_TYPE-$timestamp.zip"
        
        Write-Host "Creating archive: $archiveName"
        
        Compress-Archive -Path "$installPath\*" -DestinationPath $archiveName -CompressionLevel Optimal
        
        if (Test-Path $archiveName) {
          $archiveSize = (Get-Item $archiveName).Length / 1MB
          Write-Host "Archive created: $archiveName ($([math]::Round($archiveSize,2)) MB)"
          
          echo "ARCHIVE_NAME=$archiveName" | Out-File -FilePath $env:GITHUB_ENV -Append
        else {
          Write-Error "Archive creation failed"
          exit 1
        }
        
    # ========== PHASE 8: Upload Artifacts ==========
    - name: Phase 8 - Upload Build Artifacts
      id: upload_artifacts
      uses: actions/upload-artifact@v4
      with:
        name: suitesparse-windows-${{ env.BUILD_TYPE }}
        path: |
          ${{ github.workspace }}/suite_build/*.zip
          ${{ github.workspace }}/suite_build/install
        retention-days: 30
        
    # ========== PHASE 9: Commit to Repository ==========
    - name: Phase 9 - Commit to Repository
      id: commit_to_repo
      if: github.event_name == 'workflow_dispatch'
      shell: powershell
      run: |
        Write-Host "Committing built files to repository..."
        
        Set-Location $env:GITHUB_WORKSPACE
        
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        $artifactsDir = "suitesparse_binaries/windows"
        New-Item -ItemType Directory -Force -Path $artifactsDir | Out-Null
        
        $sourceDir = "suite_build/install"
        if (Test-Path $sourceDir) {
          Copy-Item -Path "$sourceDir\*" -Destination $artifactsDir -Recurse -Force
          Write-Host "Copied built files"
        }
        
        $changes = git status --porcelain
        if ([string]::IsNullOrEmpty($changes)) {
          Write-Host "No changes to commit"
          exit 0
        }
        
        git add $artifactsDir
        git commit -m "Add SuiteSparse Windows binaries
        
        Build type: $env:BUILD_TYPE
        Date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')
        Workflow run: #${{ github.run_number }}"
        
        git push
        Write-Host "Files committed to repository"
