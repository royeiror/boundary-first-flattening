name: Build SuiteSparse for Windows

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:  # Allow manual triggers

env:
  BUILD_DIR: ${{ github.workspace }}/build
  INSTALL_DIR: ${{ github.workspace }}/install
  REPO_DIR: ${{ github.workspace }}/suitesparse-metis-for-windows

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        path: suitesparse-metis-for-windows
      
    - name: Checkout for artifact storage
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
          !*
          SuiteSparse
          SuiteSparse/**
          lib
          lib/**
          include
          include/**
        path: output-repo
    
    - name: Setup Phase - Create directories
      shell: powershell
      run: |
        Write-Host "=== SETUP PHASE ==="
        New-Item -ItemType Directory -Force -Path ${{ env.BUILD_DIR }}
        New-Item -ItemType Directory -Force -Path ${{ env.INSTALL_DIR }}
        Write-Host "Directories created successfully"
        
    - name: Setup Phase - Install dependencies
      shell: powershell
      run: |
        Write-Host "=== INSTALLING DEPENDENCIES ==="
        choco install -y cmake --installargs 'ADD_CMAKE_TO_PATH=System'
        choco install -y visualstudio2022buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --includeOptional"
        Write-Host "Dependencies installed"
        
    - name: Build Phase 1 - METIS/GraphBLAS dependencies
      shell: cmd
      run: |
        echo === BUILD PHASE 1: METIS/GraphBLAS ===
        cd "%REPO_DIR%"
        
        echo Building GraphBLAS...
        cd GraphBLAS
        if not exist build mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_INSTALL_PREFIX="%INSTALL_DIR%" -DCMAKE_BUILD_TYPE=Release
        cmake --build . --config Release --target install
        if %errorlevel% neq 0 exit /b %errorlevel%
        cd ..\..
        
        echo Building METIS...
        cd metis
        if not exist build mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_INSTALL_PREFIX="%INSTALL_DIR%" -DCMAKE_BUILD_TYPE=Release -DGKLIB_PATH="..\GKlib"
        cmake --build . --config Release --target install
        if %errorlevel% neq 0 exit /b %errorlevel%
        cd ..\..
        
        echo "Phase 1 completed successfully"
        
    - name: Build Phase 2 - SuiteSparse Core Libraries
      shell: cmd
      run: |
        echo === BUILD PHASE 2: SuiteSparse Core ===
        cd "%REPO_DIR%"
        
        echo Building SuiteSparse_config...
        cd SuiteSparse_config
        if not exist build mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 ^
          -DCMAKE_INSTALL_PREFIX="%INSTALL_DIR%" ^
          -DCMAKE_BUILD_TYPE=Release
        cmake --build . --config Release --target install
        if %errorlevel% neq 0 exit /b %errorlevel%
        cd ..\..
        
        echo Building AMD...
        cd AMD
        if not exist build mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 ^
          -DCMAKE_INSTALL_PREFIX="%INSTALL_DIR%" ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DSUITESPARSE_CONFIG_DIR="%INSTALL_DIR%"
        cmake --build . --config Release --target install
        if %errorlevel% neq 0 exit /b %errorlevel%
        cd ..\..
        
        echo Building COLAMD...
        cd COLAMD
        if not exist build mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 ^
          -DCMAKE_INSTALL_PREFIX="%INSTALL_DIR%" ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DSUITESPARSE_CONFIG_DIR="%INSTALL_DIR%"
        cmake --build . --config Release --target install
        if %errorlevel% neq 0 exit /b %errorlevel%
        cd ..\..
        
        echo "Phase 2 completed successfully"
        
    - name: Build Phase 3 - SuiteSparse Advanced Libraries
      shell: cmd
      run: |
        echo === BUILD PHASE 3: Advanced Libraries ===
        cd "%REPO_DIR%"
        
        echo Building BTF...
        cd BTF
        if not exist build mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 ^
          -DCMAKE_INSTALL_PREFIX="%INSTALL_DIR%" ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DSUITESPARSE_CONFIG_DIR="%INSTALL_DIR%"
        cmake --build . --config Release --target install
        if %errorlevel% neq 0 exit /b %errorlevel%
        cd ..\..
        
        echo Building KLU...
        cd KLU
        if not exist build mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 ^
          -DCMAKE_INSTALL_PREFIX="%INSTALL_DIR%" ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DSUITESPARSE_CONFIG_DIR="%INSTALL_DIR%"
        cmake --build . --config Release --target install
        if %errorlevel% neq 0 exit /b %errorlevel%
        cd ..\..
        
        echo Building LDL...
        cd LDL
        if not exist build mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 ^
          -DCMAKE_INSTALL_PREFIX="%INSTALL_DIR%" ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DSUITESPARSE_CONFIG_DIR="%INSTALL_DIR%"
        cmake --build . --config Release --target install
        if %errorlevel% neq 0 exit /b %errorlevel%
        cd ..\..
        
        echo "Phase 3 completed successfully"
        
    - name: Build Phase 4 - CHOLMOD and Complex Libraries
      shell: cmd
      run: |
        echo === BUILD PHASE 4: CHOLMOD and Complex ===
        cd "%REPO_DIR%"
        
        echo Building CCOLAMD...
        cd CCOLAMD
        if not exist build mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 ^
          -DCMAKE_INSTALL_PREFIX="%INSTALL_DIR%" ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DSUITESPARSE_CONFIG_DIR="%INSTALL_DIR%"
        cmake --build . --config Release --target install
        if %errorlevel% neq 0 exit /b %errorlevel%
        cd ..\..
        
        echo Building CAMD...
        cd CAMD
        if not exist build mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 ^
          -DCMAKE_INSTALL_PREFIX="%INSTALL_DIR%" ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DSUITESPARSE_CONFIG_DIR="%INSTALL_DIR%"
        cmake --build . --config Release --target install
        if %errorlevel% neq 0 exit /b %errorlevel%
        cd ..\..
        
        echo Building CHOLMOD...
        cd CHOLMOD
        if not exist build mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 ^
          -DCMAKE_INSTALL_PREFIX="%INSTALL_DIR%" ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DSUITESPARSE_CONFIG_DIR="%INSTALL_DIR%" ^
          -DCMAKE_PREFIX_PATH="%INSTALL_DIR%"
        cmake --build . --config Release --target install
        if %errorlevel% neq 0 exit /b %errorlevel%
        cd ..\..
        
        echo "Phase 4 completed successfully"
        
    - name: Build Phase 5 - UMFPACK and Other Libraries
      shell: cmd
      run: |
        echo === BUILD PHASE 5: UMFPACK and Others ===
        cd "%REPO_DIR%"
        
        echo Building UMFPACK...
        cd UMFPACK
        if not exist build mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 ^
          -DCMAKE_INSTALL_PREFIX="%INSTALL_DIR%" ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DSUITESPARSE_CONFIG_DIR="%INSTALL_DIR%" ^
          -DCMAKE_PREFIX_PATH="%INSTALL_DIR%"
        cmake --build . --config Release --target install
        if %errorlevel% neq 0 exit /b %errorlevel%
        cd ..\..
        
        echo Building RBio...
        cd RBio
        if not exist build mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 ^
          -DCMAKE_INSTALL_PREFIX="%INSTALL_DIR%" ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DSUITESPARSE_CONFIG_DIR="%INSTALL_DIR%"
        cmake --build . --config Release --target install
        if %errorlevel% neq 0 exit /b %errorlevel%
        cd ..\..
        
        echo Building SPQR...
        cd SPQR
        if not exist build mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 ^
          -DCMAKE_INSTALL_PREFIX="%INSTALL_DIR%" ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DSUITESPARSE_CONFIG_DIR="%INSTALL_DIR%" ^
          -DCMAKE_PREFIX_PATH="%INSTALL_DIR%"
        cmake --build . --config Release --target install
        if %errorlevel% neq 0 exit /b %errorlevel%
        cd ..\..
        
        echo "Phase 5 completed successfully"
        
    - name: Packaging Phase - Organize built files
      shell: powershell
      run: |
        Write-Host "=== PACKAGING PHASE ==="
        
        # Create directory structure
        $libDir = "${{ github.workspace }}/output-repo/lib"
        $includeDir = "${{ github.workspace }}/output-repo/include"
        $suiteSparseDir = "${{ github.workspace }}/output-repo/SuiteSparse"
        
        New-Item -ItemType Directory -Force -Path $libDir
        New-Item -ItemType Directory -Force -Path $includeDir
        New-Item -ItemType Directory -Force -Path $suiteSparseDir
        
        # Copy libraries
        Write-Host "Copying libraries..."
        Copy-Item -Path "${{ env.INSTALL_DIR }}/lib/*.lib" -Destination $libDir -Force
        Copy-Item -Path "${{ env.INSTALL_DIR }}/lib/*.dll" -Destination $libDir -Force 2>$null
        
        # Copy headers
        Write-Host "Copying headers..."
        Copy-Item -Path "${{ env.INSTALL_DIR }}/include/*" -Destination $includeDir -Recurse -Force
        
        # Copy SuiteSparse components
        Write-Host "Copying SuiteSparse components..."
        $components = @(
            "AMD", "BTF", "CAMD", "CCOLAMD", "CHOLMOD", 
            "COLAMD", "KLU", "LDL", "RBio", "SPQR", 
            "UMFPACK", "SuiteSparse_config", "GraphBLAS", "metis"
        )
        
        foreach ($comp in $components) {
            $sourcePath = "${{ env.REPO_DIR }}/$comp"
            $destPath = "$suiteSparseDir/$comp"
            if (Test-Path $sourcePath) {
                New-Item -ItemType Directory -Force -Path $destPath
                # Copy source files (excluding build directories)
                Get-ChildItem -Path $sourcePath -Exclude "build", "*.build*" | 
                    Copy-Item -Destination $destPath -Recurse -Force
            }
        }
        
        # Create a README file
        $readmeContent = '# SuiteSparse for Windows

This directory contains pre-built SuiteSparse libraries for Windows x64.

## Contents

- `lib/` - Compiled libraries (.lib) and DLLs
- `include/` - Header files
- `SuiteSparse/` - Source code for all components

## Built Components

1. GraphBLAS
2. METIS
3. SuiteSparse_config
4. AMD
5. COLAMD
6. BTF
7. KLU
8. LDL
9. CCOLAMD
10. CAMD
11. CHOLMOD
12. UMFPACK
13. RBio
14. SPQR

## Build Information

- Built on: ' + (Get-Date -Format "yyyy-MM-dd") + '
- Build System: Visual Studio 2022
- Architecture: x64
- Configuration: Release

## Usage

Add the `lib/` directory to your library path and `include/` to your include path.'
        
        $readmeContent | Out-File -FilePath "${{ github.workspace }}/output-repo/README.md" -Encoding UTF8
        
        Write-Host "Packaging completed"
        
    - name: Commit and Push Phase
      shell: powershell
      run: |
        Write-Host "=== COMMIT AND PUSH PHASE ==="
        
        cd "${{ github.workspace }}/output-repo"
        
        # Configure git
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Add all files
        git add -A
        
        # Check if there are changes
        $status = git status --porcelain
        if ($status) {
            Write-Host "Changes detected, committing..."
            git commit -m "Build SuiteSparse for Windows - $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
            
            # Push to repository
            Write-Host "Pushing to repository..."
            git push
        } else {
            Write-Host "No changes to commit"
        }
        
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SuiteSparse-Windows-Build
        path: |
          ${{ github.workspace }}/install/
          ${{ github.workspace }}/output-repo/
        retention-days: 7
