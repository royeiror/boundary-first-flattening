name: Build BFF for Windows

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout BFF Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2
    
    - name: Install CMake
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: '3.27.0'
    
    - name: Create Build Directory Structure
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\build"
        New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\suitesparse-build"
    
    - name: Clone SuiteSparse-METIS for Windows
      shell: powershell
      run: |
        cd "${{ github.workspace }}"
        git clone https://github.com/jlblancoc/suitesparse-metis-for-windows.git suitesparse-metis
        cd suitesparse-metis
        Write-Host "SuiteSparse-METIS cloned successfully"
    
    - name: Patch CMake Version Requirements
      shell: powershell
      run: |
        Write-Host "Checking and patching CMake version requirements..."
        
        $cmakeFiles = Get-ChildItem -Path "${{ github.workspace }}\suitesparse-metis" -Filter "CMakeLists.txt" -Recurse
        foreach ($file in $cmakeFiles) {
          $content = Get-Content $file.FullName -Raw
          if ($content -match 'cmake_minimum_required\s*\(\s*VERSION\s+(\d+\.\d+)') {
            $version = [double]$matches[1]
            if ($version -lt 3.5) {
              Write-Host "Patching $($file.FullName) - upgrading minimum version from $version to 3.5"
              $content = $content -replace 'cmake_minimum_required\s*\(\s*VERSION\s+\d+\.\d+', 'cmake_minimum_required(VERSION 3.5'
              Set-Content -Path $file.FullName -Value $content -NoNewline
            }
          }
        }
        
        Write-Host "CMake version requirements patched successfully"
    
    - name: Configure SuiteSparse
      shell: powershell
      run: |
        cd "${{ github.workspace }}\suitesparse-build"
        cmake -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}\suitesparse-install" `
          -DCMAKE_BUILD_TYPE=Release `
          -DBUILD_METIS=OFF `
          -DHAVE_COMPLEX=OFF `
          "${{ github.workspace }}\suitesparse-metis"
    
    - name: Build SuiteSparse
      shell: powershell
      run: |
        cd "${{ github.workspace }}\suitesparse-build"
        cmake --build . --config Release --target install -j 4
        Write-Host "SuiteSparse built and installed successfully"
    
    - name: Verify SuiteSparse Installation
      shell: powershell
      run: |
        $installPath = "${{ github.workspace }}\suitesparse-install"
        Write-Host "Checking SuiteSparse installation at: $installPath"
        
        if (Test-Path "$installPath\lib") {
          Write-Host "Library directory exists"
          Write-Host "`nAll .lib files:"
          Get-ChildItem "$installPath\lib" -Recurse -Filter "*.lib" | ForEach-Object {
            Write-Host "  $($_.FullName)"
          }
          Write-Host "`nAll .dll files:"
          Get-ChildItem "$installPath\lib" -Recurse -Filter "*.dll" | ForEach-Object {
            Write-Host "  $($_.FullName)"
          }
        } else {
          Write-Error "Library directory not found!"
          exit 1
        }
        
        if (Test-Path "$installPath\include") {
          Write-Host "`nInclude directory exists"
        } else {
          Write-Error "Include directory not found!"
          exit 1
        }
    
    - name: Map SuiteSparse Library Names
      shell: powershell
      run: |
        $installPath = "${{ github.workspace }}\suitesparse-install\lib"
        
        Write-Host "Mapping actual library file names..."
        $libMapping = @{}
        
        $expectedLibs = @('amd', 'btf', 'camd', 'ccolamd', 'cholmod', 'colamd', 'cxsparse', 'klu', 'ldl', 'spqr', 'suitesparseconfig', 'umfpack', 'libblas', 'liblapack')
        
        foreach ($lib in $expectedLibs) {
          $found = $false
          $patterns = @("$lib.lib", "lib$lib.lib", "$lib*.lib")
          
          foreach ($pattern in $patterns) {
            $files = Get-ChildItem -Path $installPath -Filter $pattern -Recurse -ErrorAction SilentlyContinue
            if ($files) {
              $libMapping[$lib] = $files[0].FullName
              Write-Host "  $lib -> $($files[0].Name)"
              $found = $true
              break
            }
          }
          
          if (-not $found) {
            Write-Warning "  $lib -> NOT FOUND"
          }
        }
        
        $libMapping | ConvertTo-Json | Out-File "${{ github.workspace }}\lib-mapping.json"
    
    - name: Configure BFF
      shell: powershell
      run: |
        Remove-Item "${{ github.workspace }}\build\CMakeCache.txt" -ErrorAction SilentlyContinue
        Remove-Item "${{ github.workspace }}\build\CMakeFiles" -Recurse -Force -ErrorAction SilentlyContinue
        
        cd "${{ github.workspace }}\build"
        
        $suiteSparsePath = "${{ github.workspace }}\suitesparse-install"
        $openblasInclude = "${{ github.workspace }}\deps\openblas-windows\include"
        $openblasLib = "${{ github.workspace }}\deps\openblas-windows\lib"
        $libPath = "$suiteSparsePath\lib"
        
        function Find-Library {
          param($name)
          $patterns = @("$name.lib", "lib$name.lib")
          foreach ($pattern in $patterns) {
            $found = Get-ChildItem -Path $libPath -Filter $pattern -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) {
              return $found.FullName
            }
          }
          Write-Warning "Library not found: $name"
          return "$libPath\$name.lib"
        }
        
        $cholmodLib = Find-Library "cholmod"
        $amdLib = Find-Library "amd"
        $btfLib = Find-Library "btf"
        $camdLib = Find-Library "camd"
        $ccolamdLib = Find-Library "ccolamd"
        $colamdLib = Find-Library "colamd"
        $cxsparseLib = Find-Library "cxsparse"
        $kluLib = Find-Library "klu"
        $ldlLib = Find-Library "ldl"
        $spqrLib = Find-Library "spqr"
        $suitesparseconfigLib = Find-Library "suitesparseconfig"
        $umfpackLib = Find-Library "umfpack"
        $blasLib = Find-Library "blas"
        if (-not (Test-Path $blasLib)) {
          $blasLib = Find-Library "libblas"
        }
        $lapackLib = Find-Library "lapack"
        if (-not (Test-Path $lapackLib)) {
          $lapackLib = Find-Library "liblapack"
        }
        
        Write-Host "Using libraries:"
        Write-Host "  CHOLMOD: $cholmodLib (exists: $(Test-Path $cholmodLib))"
        Write-Host "  AMD: $amdLib (exists: $(Test-Path $amdLib))"
        Write-Host "  BLAS: $blasLib (exists: $(Test-Path $blasLib))"
        Write-Host "  LAPACK: $lapackLib (exists: $(Test-Path $lapackLib))"
        
        cmake -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_PREFIX_PATH="$suiteSparsePath" `
          -DCMAKE_CXX_FLAGS="/I`"$openblasInclude`"" `
          -DCMAKE_C_FLAGS="/I`"$openblasInclude`"" `
          -DSuiteSparse_DIR="$suiteSparsePath\lib\cmake\SuiteSparse" `
          -DSuiteSparse_CHOLMOD_DIR="$libPath" `
          -DSuiteSparse_CHOLMOD_INCLUDE_DIR="$suiteSparsePath\include\suitesparse" `
          -DSuiteSparse_CHOLMOD_LIBRARY_DEBUG="$cholmodLib" `
          -DSuiteSparse_CHOLMOD_LIBRARY_RELEASE="$cholmodLib" `
          -DSuiteSparse_AMD_DIR="$libPath" `
          -DSuiteSparse_AMD_INCLUDE_DIR="$suiteSparsePath\include\suitesparse" `
          -DSuiteSparse_AMD_LIBRARY_DEBUG="$amdLib" `
          -DSuiteSparse_AMD_LIBRARY_RELEASE="$amdLib" `
          -DSuiteSparse_BTF_DIR="$libPath" `
          -DSuiteSparse_BTF_INCLUDE_DIR="$suiteSparsePath\include\suitesparse" `
          -DSuiteSparse_BTF_LIBRARY_DEBUG="$btfLib" `
          -DSuiteSparse_BTF_LIBRARY_RELEASE="$btfLib" `
          -DSuiteSparse_CAMD_DIR="$libPath" `
          -DSuiteSparse_CAMD_INCLUDE_DIR="$suiteSparsePath\include\suitesparse" `
          -DSuiteSparse_CAMD_LIBRARY_DEBUG="$camdLib" `
          -DSuiteSparse_CAMD_LIBRARY_RELEASE="$camdLib" `
          -DSuiteSparse_CCOLAMD_DIR="$libPath" `
          -DSuiteSparse_CCOLAMD_INCLUDE_DIR="$suiteSparsePath\include\suitesparse" `
          -DSuiteSparse_CCOLAMD_LIBRARY_DEBUG="$ccolamdLib" `
          -DSuiteSparse_CCOLAMD_LIBRARY_RELEASE="$ccolamdLib" `
          -DSuiteSparse_COLAMD_DIR="$libPath" `
          -DSuiteSparse_COLAMD_INCLUDE_DIR="$suiteSparsePath\include\suitesparse" `
          -DSuiteSparse_COLAMD_LIBRARY_DEBUG="$colamdLib" `
          -DSuiteSparse_COLAMD_LIBRARY_RELEASE="$colamdLib" `
          -DSuiteSparse_CXSPARSE_DIR="$libPath" `
          -DSuiteSparse_CXSPARSE_INCLUDE_DIR="$suiteSparsePath\include\suitesparse" `
          -DSuiteSparse_CXSPARSE_LIBRARY_DEBUG="$cxsparseLib" `
          -DSuiteSparse_CXSPARSE_LIBRARY_RELEASE="$cxsparseLib" `
          -DSuiteSparse_KLU_DIR="$libPath" `
          -DSuiteSparse_KLU_INCLUDE_DIR="$suiteSparsePath\include\suitesparse" `
          -DSuiteSparse_KLU_LIBRARY_DEBUG="$kluLib" `
          -DSuiteSparse_KLU_LIBRARY_RELEASE="$kluLib" `
          -DSuiteSparse_LDL_DIR="$libPath" `
          -DSuiteSparse_LDL_INCLUDE_DIR="$suiteSparsePath\include\suitesparse" `
          -DSuiteSparse_LDL_LIBRARY_DEBUG="$ldlLib" `
          -DSuiteSparse_LDL_LIBRARY_RELEASE="$ldlLib" `
          -DSuiteSparse_SPQR_DIR="$libPath" `
          -DSuiteSparse_SPQR_INCLUDE_DIR="$suiteSparsePath\include\suitesparse" `
          -DSuiteSparse_SPQR_LIBRARY_DEBUG="$spqrLib" `
          -DSuiteSparse_SPQR_LIBRARY_RELEASE="$spqrLib" `
          -DSuiteSparse_SUITESPARSECONFIG_DIR="$libPath" `
          -DSuiteSparse_SUITESPARSECONFIG_INCLUDE_DIR="$suiteSparsePath\include\suitesparse" `
          -DSuiteSparse_SUITESPARSECONFIG_LIBRARY_DEBUG="$suitesparseconfigLib" `
          -DSuiteSparse_SUITESPARSECONFIG_LIBRARY_RELEASE="$suitesparseconfigLib" `
          -DSuiteSparse_UMFPACK_DIR="$libPath" `
          -DSuiteSparse_UMFPACK_INCLUDE_DIR="$suiteSparsePath\include\suitesparse" `
          -DSuiteSparse_UMFPACK_LIBRARY_DEBUG="$umfpackLib" `
          -DSuiteSparse_UMFPACK_LIBRARY_RELEASE="$umfpackLib" `
          -DSuiteSparse_BLAS_LIBRARY="$blasLib" `
          -DSuiteSparse_LAPACK_LIBRARY="$lapackLib" `
          ..
    
    - name: Build BFF Static Library
      shell: powershell
      run: |
        cd "${{ github.workspace }}\build"
        cmake --build . --config Release --target bff -j 4
        Write-Host "BFF static library built successfully"
    
    - name: Configure BFF Library as Static
      shell: powershell
      run: |
        $vcxprojPath = Get-ChildItem -Path "${{ github.workspace }}\build" -Recurse -Filter "bff.vcxproj" | Select-Object -First 1
        if ($vcxprojPath) {
          Write-Host "Found bff.vcxproj at: $($vcxprojPath.FullName)"
          
          [xml]$project = Get-Content $vcxprojPath.FullName
          
          $propertyGroups = $project.Project.PropertyGroup | Where-Object { $_.Label -eq "Configuration" }
          foreach ($pg in $propertyGroups) {
            if ($pg.ConfigurationType) {
              $pg.ConfigurationType = "StaticLibrary"
              Write-Host "Set ConfigurationType to StaticLibrary for configuration"
            }
            if ($pg.TargetExt) {
              $pg.TargetExt = ".lib"
            } else {
              $targetExtNode = $project.CreateElement("TargetExt", $project.Project.xmlns)
              $targetExtNode.InnerText = ".lib"
              $pg.AppendChild($targetExtNode) | Out-Null
            }
          }
          
          $project.Save($vcxprojPath.FullName)
          Write-Host "Modified bff.vcxproj to build as static library"
        } else {
          Write-Warning "Could not find bff.vcxproj file"
        }
    
    - name: Rebuild BFF Static Library
      shell: powershell
      run: |
        cd "${{ github.workspace }}\build"
        cmake --build . --config Release --target bff -j 4
    
    - name: Add OpenBLAS Include Paths to Command-Line and Viewer
      shell: powershell
      run: |
        $openblasInclude = "${{ github.workspace }}\deps\openblas-windows\include"
        $openblasLib = "${{ github.workspace }}\deps\openblas-windows\lib"
        
        $targets = @("bff-command-line", "bff-viewer")
        
        foreach ($target in $targets) {
          $vcxprojPath = Get-ChildItem -Path "${{ github.workspace }}\build" -Recurse -Filter "$target.vcxproj" | Select-Object -First 1
          
          if ($vcxprojPath) {
            Write-Host "Configuring $target at: $($vcxprojPath.FullName)"
            
            [xml]$project = Get-Content $vcxprojPath.FullName
            
            $itemDefGroups = $project.Project.ItemDefinitionGroup | Where-Object { $_.Condition -like "*Release*" }
            
            foreach ($idg in $itemDefGroups) {
              if (-not $idg.ClCompile) {
                $clCompile = $project.CreateElement("ClCompile", $project.Project.xmlns)
                $idg.AppendChild($clCompile) | Out-Null
              }
              
              if (-not $idg.ClCompile.AdditionalIncludeDirectories) {
                $addIncNode = $project.CreateElement("AdditionalIncludeDirectories", $project.Project.xmlns)
                $idg.ClCompile.AppendChild($addIncNode) | Out-Null
              }
              
              $currentIncludes = $idg.ClCompile.AdditionalIncludeDirectories
              if ($currentIncludes -notlike "*openblas*") {
                $idg.ClCompile.AdditionalIncludeDirectories = "$openblasInclude;$currentIncludes"
              }
              
              if (-not $idg.Link) {
                $link = $project.CreateElement("Link", $project.Project.xmlns)
                $idg.AppendChild($link) | Out-Null
              }
              
              if (-not $idg.Link.AdditionalLibraryDirectories) {
                $addLibNode = $project.CreateElement("AdditionalLibraryDirectories", $project.Project.xmlns)
                $idg.Link.AppendChild($addLibNode) | Out-Null
              }
              
              $currentLibDirs = $idg.Link.AdditionalLibraryDirectories
              if ($currentLibDirs -notlike "*openblas*") {
                $idg.Link.AdditionalLibraryDirectories = "$openblasLib;$currentLibDirs"
              }
              
              if (-not $idg.Link.AdditionalDependencies) {
                $addDepNode = $project.CreateElement("AdditionalDependencies", $project.Project.xmlns)
                $idg.Link.AppendChild($addDepNode) | Out-Null
              }
              
              $currentDeps = $idg.Link.AdditionalDependencies
              $newDeps = @("$openblasLib\libopenblas.lib", "$openblasLib\libopenblas.dll.a")
              foreach ($dep in $newDeps) {
                if ($currentDeps -notlike "*$dep*") {
                  $idg.Link.AdditionalDependencies = "$dep;$currentDeps"
                }
              }
            }
            
            $project.Save($vcxprojPath.FullName)
            Write-Host "Successfully configured $target with OpenBLAS paths"
          } else {
            Write-Warning "Could not find $target.vcxproj"
          }
        }
    
    - name: Build BFF Command-Line
      shell: powershell
      run: |
        cd "${{ github.workspace }}\build"
        cmake --build . --config Release --target bff-command-line -j 4
        Write-Host "BFF command-line built successfully"
    
    - name: Build BFF Viewer (GUI)
      shell: powershell
      run: |
        cd "${{ github.workspace }}\build"
        cmake --build . --config Release --target bff-viewer -j 4
        Write-Host "BFF viewer (GUI) built successfully"
    
    - name: Collect Build Artifacts
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\artifacts"
        
        $buildPath = "${{ github.workspace }}\build"
        $suiteSparsePath = "${{ github.workspace }}\suitesparse-install"
        $openblasPath = "${{ github.workspace }}\deps\openblas-windows"
        $artifactsPath = "${{ github.workspace }}\artifacts"
        
        Write-Host "Searching for executables..."
        $cmdExe = Get-ChildItem -Path $buildPath -Recurse -Filter "bff-command-line.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
        $viewerExe = Get-ChildItem -Path $buildPath -Recurse -Filter "bff-viewer.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
        
        if ($cmdExe) {
          Write-Host "Found bff-command-line.exe at: $($cmdExe.FullName)"
          Copy-Item $cmdExe.FullName "$artifactsPath\bff-command-line.exe"
        } else {
          Write-Warning "bff-command-line.exe not found!"
        }
        
        if ($viewerExe) {
          Write-Host "Found bff-viewer.exe at: $($viewerExe.FullName)"
          Copy-Item $viewerExe.FullName "$artifactsPath\bff-viewer.exe"
        } else {
          Write-Warning "bff-viewer.exe not found!"
        }
        
        Write-Host "Copying required DLLs..."
        
        if (Test-Path "$suiteSparsePath\lib\lapack_blas_windows") {
          Get-ChildItem "$suiteSparsePath\lib\lapack_blas_windows" -Filter "*.dll" | ForEach-Object {
            Copy-Item $_.FullName "$artifactsPath\"
            Write-Host "Copied: $($_.Name)"
          }
        }
        
        if (Test-Path "$suiteSparsePath\lib") {
          Get-ChildItem "$suiteSparsePath\lib" -Filter "*.dll" -Recurse | ForEach-Object {
            Copy-Item $_.FullName "$artifactsPath\" -ErrorAction SilentlyContinue
            Write-Host "Copied: $($_.Name)"
          }
        }
        
        if (Test-Path "$openblasPath\bin") {
          Get-ChildItem "$openblasPath\bin" -Filter "*.dll" | ForEach-Object {
            Copy-Item $_.FullName "$artifactsPath\"
            Write-Host "Copied OpenBLAS: $($_.Name)"
          }
        }
        
        Write-Host "`nArtifacts collected:"
        Get-ChildItem "$artifactsPath" | ForEach-Object { Write-Host "  $($_.Name)" }
    
    - name: Create README for Artifacts
      shell: powershell
      run: |
        $readme = "# Boundary First Flattening (BFF) - Windows Build`n`n"
        $readme += "This package contains the Windows x64 build of BFF (Boundary First Flattening).`n`n"
        $readme += "## Contents`n`n"
        $readme += "- bff-command-line.exe: Command-line interface for BFF`n"
        $readme += "- bff-viewer.exe: GUI application for BFF`n"
        $readme += "- *.dll: Required runtime libraries (BLAS, LAPACK, SuiteSparse)`n`n"
        $readme += "## Usage`n`n"
        $readme += "### Command-Line Interface`n"
        $readme += "bff-command-line.exe input.obj output.obj`n`n"
        $readme += "Optional flags:`n"
        $readme += "- --nCones=N: Use N cone singularities to reduce area distortion`n"
        $readme += "- --normalizeUVs: Scale UVs to [0,1] x [0,1] range`n"
        $readme += "- --writeOnlyUVs: Write UVs using vertex 'v' flag instead of 'vt'`n"
        $readme += "- --scaling=X: Multiplicative scale factor for UV islands`n"
        $readme += "- --mapToSphere: Map to unit sphere (for genus-0 surfaces)`n"
        $readme += "- --flattenToDisk: Map to unit circular disk`n`n"
        $readme += "### GUI Application`n"
        $readme += "Simply double-click bff-viewer.exe and use the GUI to load and flatten meshes.`n`n"
        $readme += "## System Requirements`n`n"
        $readme += "- Windows 10 or later (x64)`n"
        $readme += "- OpenGL 4.1 or higher (for GUI)`n`n"
        $readme += "## Built From`n`n"
        $readme += "Repository: https://github.com/GeometryCollective/boundary-first-flattening`n"
        $readme += "Build Date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')`n"
        $readme += "Commit: ${{ github.sha }}`n`n"
        $readme += "## License`n`n"
        $readme += "MIT License - See https://github.com/GeometryCollective/boundary-first-flattening/blob/master/LICENSE`n"
        
        Set-Content -Path "${{ github.workspace }}\artifacts\README.txt" -Value $readme
        Write-Host "README created successfully"
    
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BFF-Windows-x64
        path: ${{ github.workspace }}/artifacts
        retention-days: 90
    
    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ github.workspace }}/artifacts/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
