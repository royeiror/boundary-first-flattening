name: Windows Build BFF v1.6

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  BUILD_DIR: "C:\\build"
  INSTALL_DIR: "C:\\suitesparse-deps"
  OPENBLAS_DIR: "C:\\openblas-install"
  CMAKE_GENERATOR: "Visual Studio 17 2022"
  CMAKE_ARCH: "x64"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 180
    
    steps:
    - name: Checkout BFF repository
      uses: actions/checkout@v4
      with:
        repository: GeometryCollective/boundary-first-flattening
        ref: v1.6
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install build tools
      shell: powershell
      run: |
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
        choco install wget -y
        choco install 7zip -y
        choco install git -y
        choco install ninja -y
        
    - name: Download pre-built OpenBLAS
      shell: powershell
      run: |
        Write-Host "Downloading pre-built OpenBLAS..."
        mkdir -Force $env:OPENBLAS_DIR
        wget https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.28/OpenBLAS-0.3.28-x64.zip -OutFile openblas.zip
        7z x openblas.zip -o"$env:OPENBLAS_DIR"
        
    - name: Build SuiteSparse from source (properly)
      shell: powershell
      run: |
        Write-Host "Building SuiteSparse from source following suitesparse-metis-for-windows instructions..."
        
        # Clean up
        Remove-Item -Recurse -Force $env:INSTALL_DIR -ErrorAction SilentlyContinue
        
        # Create directories
        New-Item -ItemType Directory -Force -Path "$env:INSTALL_DIR\lib"
        New-Item -ItemType Directory -Force -Path "$env:INSTALL_DIR\include"
        
        # Clone SuiteSparse-metis-for-windows (has CMake support)
        Write-Host "Cloning suitesparse-metis-for-windows..."
        git clone https://github.com/jlblancoc/suitesparse-metis-for-windows.git
        cd suitesparse-metis-for-windows
        
        # Create build directory
        mkdir build
        cd build
        
        # Configure with CMake
        Write-Host "Configuring SuiteSparse with CMake..."
        cmake .. -G "$env:CMAKE_GENERATOR" -A $env:CMAKE_ARCH `
            -DCMAKE_INSTALL_PREFIX="$env:INSTALL_DIR" `
            -DBUILD_METIS=ON `
            -DBLAS_LIBRARIES="$env:OPENBLAS_DIR\lib\libopenblas.lib" `
            -DLAPACK_LIBRARIES="$env:OPENBLAS_DIR\lib\libopenblas.lib"
        
        # Build and install
        Write-Host "Building SuiteSparse..."
        cmake --build . --config Release --target install --parallel 4
        
        # Verify build
        Write-Host "SuiteSparse build complete!"
        Write-Host "Installed libraries:"
        Get-ChildItem "$env:INSTALL_DIR\lib" -Filter "*.lib"
        
    - name: Verify SuiteSparse build
      shell: powershell
      run: |
        Write-Host "=== Verifying SuiteSparse build ==="
        
        if (Test-Path "$env:INSTALL_DIR\lib") {
            Write-Host "Found libraries:"
            Get-ChildItem "$env:INSTALL_DIR\lib" -Filter "*.lib" | ForEach-Object {
                Write-Host "  - $($_.Name)"
            }
        } else {
            Write-Host "ERROR: No libraries found in $env:INSTALL_DIR\lib"
        }
        
        if (Test-Path "$env:INSTALL_DIR\include") {
            Write-Host "Found include directories:"
            Get-ChildItem "$env:INSTALL_DIR\include" -Directory | ForEach-Object {
                Write-Host "  - $($_.Name)"
            }
        }
        
    - name: Patch BFF for Windows build
      shell: powershell
      run: |
        Write-Host "Patching BFF for Windows build..."
        
        # Create a simple CMakeLists.txt patch using array joining
        $patchLines = @(
            '# Override SuiteSparse find for Windows',
            'if(WIN32)',
            '    message(STATUS "Using manually configured SuiteSparse for Windows")',
            '',
            '    # Include directories',
            '    include_directories(',
            '        "${CMAKE_SOURCE_DIR}/suitesparse-deps/include"',
            '        "${CMAKE_SOURCE_DIR}/suitesparse-deps/include/suitesparse"',
            '    )',
            '',
            '    # Find all SuiteSparse libraries',
            '    set(SUITESPARSE_LIBS)',
            '',
            '    # List of expected libraries',
            '    set(EXPECTED_LIBS',
            '        suitesparseconfig',
            '        amd',
            '        camd',
            '        ccolamd',
            '        colamd',
            '        cholmod',
            '        metis',
            '    )',
            '',
            '    foreach(lib ${EXPECTED_LIBS})',
            '        set(lib_path "${CMAKE_SOURCE_DIR}/suitesparse-deps/lib/${lib}.lib")',
            '        if(EXISTS ${lib_path})',
            '            list(APPEND SUITESPARSE_LIBS ${lib_path})',
            '            message(STATUS "Found ${lib}: ${lib_path}")',
            '        else()',
            '            message(STATUS "Warning: ${lib}.lib not found at ${lib_path}")',
            '        endif()',
            '    endforeach()',
            '',
            '    # Add OpenBLAS',
            '    set(OPENBLAS_PATH "${CMAKE_SOURCE_DIR}/suitesparse-deps/lib/libopenblas.lib")',
            '    if(EXISTS ${OPENBLAS_PATH})',
            '        list(APPEND SUITESPARSE_LIBS ${OPENBLAS_PATH})',
            '        message(STATUS "Found OpenBLAS: ${OPENBLAS_PATH}")',
            '        set(BLAS_LIBRARIES ${OPENBLAS_PATH})',
            '        set(LAPACK_LIBRARIES ${OPENBLAS_PATH})',
            '    else()',
            '        message(FATAL_ERROR "OpenBLAS not found: ${OPENBLAS_PATH}")',
            '    endif()',
            '',
            '    # Create a target that links all SuiteSparse libraries',
            '    add_library(SuiteSparse::SuiteSparse INTERFACE IMPORTED)',
            '    target_link_libraries(SuiteSparse::SuiteSparse INTERFACE ${SUITESPARSE_LIBS})',
            '    target_include_directories(SuiteSparse::SuiteSparse INTERFACE',
            '        "${CMAKE_SOURCE_DIR}/suitesparse-deps/include"',
            '        "${CMAKE_SOURCE_DIR}/suitesparse-deps/include/suitesparse"',
            '    )',
            '',
            '    set(SuiteSparse_FOUND TRUE)',
            '    set(SuiteSparse_LIBRARIES ${SUITESPARSE_LIBS})',
            '    set(SuiteSparse_INCLUDE_DIRS',
            '        "${CMAKE_SOURCE_DIR}/suitesparse-deps/include"',
            '        "${CMAKE_SOURCE_DIR}/suitesparse-deps/include/suitesparse"',
            '    )',
            'endif()'
        )
        
        $patchContent = $patchLines -join "`n"
        $patchContent | Out-File -FilePath "SuiteSparsePatch.cmake" -Encoding UTF8
        
        # Read original CMakeLists.txt
        $cmakeContent = Get-Content "CMakeLists.txt" -Raw
        
        # Create the replacement text using array joining
        $replacementLines = @(
            '# find_package(SuiteSparse REQUIRED) - Replaced with manual configuration for Windows',
            'if(WIN32)',
            '    include("${CMAKE_SOURCE_DIR}/SuiteSparsePatch.cmake")',
            'else()',
            '    find_package(SuiteSparse REQUIRED)',
            'endif()'
        )
        
        $replacementText = $replacementLines -join "`n"
        
        # Replace find_package(SuiteSparse) with our patch
        $cmakeContent = $cmakeContent -replace 'find_package\s*\(\s*SuiteSparse\s+REQUIRED\s*\)', $replacementText
        
        # Write modified CMakeLists.txt
        $cmakeContent | Out-File -FilePath "CMakeLists.txt" -Encoding UTF8
        
        Write-Host "BFF patched successfully!"
        
    - name: Build BFF
      shell: powershell
      run: |
        Write-Host "Configuring BFF..."
        
        # Create build directory
        New-Item -ItemType Directory -Force -Path "build"
        cd build
        
        # Debug: Show what's in the install directory
        Write-Host "Checking SuiteSparse installation..."
        if (Test-Path "..\suitesparse-deps\lib") {
            Write-Host "Libraries found:"
            Get-ChildItem "..\suitesparse-deps\lib" -Filter "*.lib" | ForEach-Object {
                Write-Host "  - $($_.Name)"
            }
        }
        
        # Configure with CMake - use explicit paths
        Write-Host "Running CMake configuration..."
        
        # Copy OpenBLAS to suitesparse-deps if not already there
        if (Test-Path "..\openblas-install\lib\libopenblas.lib") {
            Copy-Item "..\openblas-install\lib\libopenblas.lib" "..\suitesparse-deps\lib\" -Force
        }
        if (Test-Path "..\openblas-install\bin\libopenblas.dll") {
            Copy-Item "..\openblas-install\bin\libopenblas.dll" "..\suitesparse-deps\lib\" -Force
        }
        
        # Configure CMake
        cmake .. -G "$env:CMAKE_GENERATOR" -A $env:CMAKE_ARCH `
            -DCMAKE_BUILD_TYPE=Release `
            -DBLAS_LIBRARIES="$pwd\..\suitesparse-deps\lib\libopenblas.lib" `
            -DLAPACK_LIBRARIES="$pwd\..\suitesparse-deps\lib\libopenblas.lib"
        
        if ($LASTEXITCODE -eq 0) {
            Write-Host "Building BFF..."
            cmake --build . --config Release --parallel 4
        } else {
            Write-Host "CMake configuration failed with exit code: $LASTEXITCODE"
            exit $LASTEXITCODE
        }
        
    - name: Find and package binaries
      shell: powershell
      run: |
        Write-Host "Searching for built binaries..."
        
        # Create package directory
        New-Item -ItemType Directory -Force -Path "bff-package"
        
        # Find and copy executables
        $foundExe = $false
        $searchPaths = @("build\Release", "build", ".")
        
        foreach ($path in $searchPaths) {
            if (Test-Path $path) {
                $exeFiles = Get-ChildItem -Path $path -Recurse -Filter "*.exe" -File | Where-Object {
                    $_.Name -match "bff" -or $_.Name -match "viewer" -or $_.Name -match "gui"
                }
                
                foreach ($exe in $exeFiles) {
                    Write-Host "Found: $($exe.FullName)"
                    Copy-Item -Path $exe.FullName -Destination "bff-package"
                    $foundExe = $true
                }
            }
        }
        
        if (-not $foundExe) {
            Write-Host "WARNING: No executables found matching bff, viewer, or gui"
            # Copy any executables
            Get-ChildItem -Path "." -Recurse -Filter "*.exe" -File | ForEach-Object {
                Write-Host "Found any executable: $($_.FullName)"
                Copy-Item -Path $_.FullName -Destination "bff-package"
            }
        }
        
        # Copy DLLs
        if (Test-Path "build\Release") {
            Get-ChildItem -Path "build\Release" -Filter "*.dll" -File | ForEach-Object {
                Write-Host "Found DLL: $($_.Name)"
                Copy-Item -Path $_.FullName -Destination "bff-package"
            }
        }
        
        # Copy dependency DLLs
        if (Test-Path "suitesparse-deps\lib\*.dll") {
            Copy-Item "suitesparse-deps\lib\*.dll" "bff-package\" -ErrorAction SilentlyContinue
        }
        
        # Create a README file
        $readmeLines = @(
            "BFF (Boundary First Flattening) Windows Build",
            "=============================================",
            "Build Date: $(Get-Date -Format 'yyyy-MM-dd')",
            "Version: 1.6",
            "",
            "This package contains the Windows binaries for BFF.",
            "To run the application, execute the .exe file in this folder.",
            "",
            "Dependencies included:",
            "- OpenBLAS",
            "- SuiteSparse libraries (built from source)",
            "- Required runtime DLLs"
        )
        
        $readmeContent = $readmeLines -join "`n"
        $readmeContent | Out-File -FilePath "bff-package\README.txt" -Encoding UTF8
        
        Write-Host "=== Package Contents ==="
        Get-ChildItem -Path "bff-package"
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bff-windows-binaries
        path: bff-package/
        if-no-files-found: warn
        retention-days: 7
