name: Windows Build BFF v1.6

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  BUILD_DIR: "C:\\build"
  INSTALL_DIR: "C:\\suitesparse-deps"
  OPENBLAS_DIR: "C:\\openblas-install"
  CMAKE_GENERATOR: "Visual Studio 17 2022"
  CMAKE_ARCH: "x64"
  VCPKG_DIR: "C:\\vcpkg"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 180
    
    steps:
    - name: Checkout BFF repository
      uses: actions/checkout@v4
      with:
        repository: GeometryCollective/boundary-first-flattening
        ref: v1.6
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install build tools
      shell: powershell
      run: |
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
        choco install wget -y
        choco install 7zip -y
        choco install git -y
        choco install ninja -y
        
    - name: Download and setup vcpkg
      shell: powershell
      run: |
        Write-Host "Setting up vcpkg for dependency management..."
        
        # Clone vcpkg
        git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_DIR
        cd $env:VCPKG_DIR
        
        # Bootstrap vcpkg
        .\bootstrap-vcpkg.bat
        
    - name: Build SuiteSparse with vcpkg
      shell: powershell
      run: |
        Write-Host "Building SuiteSparse with vcpkg..."
        
        cd $env:VCPKG_DIR
        
        # Install SuiteSparse dependencies via vcpkg
        Write-Host "Installing SuiteSparse via vcpkg..."
        .\vcpkg install suitesparse:x64-windows
        
        # Create install directory
        New-Item -ItemType Directory -Force -Path "$env:INSTALL_DIR\lib"
        New-Item -ItemType Directory -Force -Path "$env:INSTALL_DIR\include"
        
        # Copy libraries from vcpkg
        $vcpkgInstalledDir = "$env:VCPKG_DIR\installed\x64-windows"
        
        Write-Host "Copying libraries from $vcpkgInstalledDir..."
        
        # Copy .lib files
        Copy-Item "$vcpkgInstalledDir\lib\*.lib" "$env:INSTALL_DIR\lib\" -ErrorAction SilentlyContinue
        
        # Copy .dll files
        Copy-Item "$vcpkgInstalledDir\bin\*.dll" "$env:INSTALL_DIR\lib\" -ErrorAction SilentlyContinue
        
        # Copy headers
        if (Test-Path "$vcpkgInstalledDir\include") {
            Get-ChildItem "$vcpkgInstalledDir\include" -Directory | ForEach-Object {
                $destDir = "$env:INSTALL_DIR\include\$($_.Name)"
                New-Item -ItemType Directory -Force -Path $destDir
                Copy-Item "$($_.FullName)\*" "$destDir\" -Recurse -ErrorAction SilentlyContinue
            }
            Copy-Item "$vcpkgInstalledDir\include\*" "$env:INSTALL_DIR\include\" -ErrorAction SilentlyContinue
        }
        
        Write-Host "Contents of install directory:"
        Get-ChildItem "$env:INSTALL_DIR\lib" -File | Select-Object Name
        
    - name: Download pre-built OpenBLAS
      shell: powershell
      run: |
        Write-Host "Downloading pre-built OpenBLAS..."
        mkdir -Force $env:OPENBLAS_DIR
        wget https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.28/OpenBLAS-0.3.28-x64.zip -OutFile openblas.zip
        7z x openblas.zip -o"$env:OPENBLAS_DIR"
        
        # Copy OpenBLAS to install directory
        Copy-Item "$env:OPENBLAS_DIR\lib\*.lib" "$env:INSTALL_DIR\lib\" -ErrorAction SilentlyContinue
        Copy-Item "$env:OPENBLAS_DIR\bin\*.dll" "$env:INSTALL_DIR\lib\" -ErrorAction SilentlyContinue
        
    - name: Apply Windows patches for BFF
      shell: powershell
      run: |
        Write-Host "Applying Windows compatibility patches..."
        
        # First, check and fix the original CMakeLists.txt
        $originalCmake = Get-Content "CMakeLists.txt" -Raw
        
        # Fix cmake_minimum_required if needed
        if ($originalCmake -match 'cmake_minimum_required\s*\(\s*VERSION\s+([0-9.]+)\s*\)') {
            $version = $matches[1]
            if ([version]$version -lt [version]"3.5") {
                Write-Host "Updating cmake_minimum_required from $version to 3.5..."
                $originalCmake = $originalCmake -replace 'cmake_minimum_required\s*\(\s*VERSION\s+[0-9.]+\s*\)', 'cmake_minimum_required(VERSION 3.5)'
                $originalCmake | Out-File -FilePath "CMakeLists.txt" -Encoding UTF8
            }
        }
        
        # 1. Create custom FindSuiteSparse.cmake
        $findSuiteSparseContent = @"
# Custom FindSuiteSparse for Windows/vcpkg
if(WIN32)
    message(STATUS "Using custom SuiteSparse configuration from vcpkg")
    
    set(SUITESPARSE_FOUND TRUE)
    
    # Set include directories
    set(SUITESPARSE_INCLUDE_DIRS
        "\${CMAKE_SOURCE_DIR}/suitesparse-deps/include"
    )
    
    # Set library directories
    set(SUITESPARSE_LIBRARY_DIRS "\${CMAKE_SOURCE_DIR}/suitesparse-deps/lib")
    
    # Try to find SuiteSparse libraries
    set(SUITESPARSE_LIBRARIES)
    
    # Look for common SuiteSparse libraries
    set(SUITESPARSE_LIB_NAMES suitesparseconfig amd camd ccolamd colamd cholmod metis)
    
    foreach(lib_name \${SUITESPARSE_LIB_NAMES})
        find_library(SUITESPARSE_\${lib_name}_LIBRARY
            NAMES \${lib_name}
            HINTS "\${CMAKE_SOURCE_DIR}/suitesparse-deps/lib"
            NO_DEFAULT_PATH
        )
        if(SUITESPARSE_\${lib_name}_LIBRARY)
            list(APPEND SUITESPARSE_LIBRARIES \${SUITESPARSE_\${lib_name}_LIBRARY})
            message(STATUS "Found \${lib_name}: \${SUITESPARSE_\${lib_name}_LIBRARY}")
        else()
            message(STATUS "NOT found: \${lib_name}")
        endif()
    endforeach()
    
    # Look for OpenBLAS
    find_library(OPENBLAS_LIBRARY
        NAMES openblas libopenblas
        HINTS "\${CMAKE_SOURCE_DIR}/suitesparse-deps/lib"
        NO_DEFAULT_PATH
    )
    if(OPENBLAS_LIBRARY)
        list(APPEND SUITESPARSE_LIBRARIES \${OPENBLAS_LIBRARY})
        set(BLAS_LIBRARIES \${OPENBLAS_LIBRARY})
        set(LAPACK_LIBRARIES \${OPENBLAS_LIBRARY})
        message(STATUS "Found OpenBLAS: \${OPENBLAS_LIBRARY}")
    else()
        message(WARNING "OpenBLAS not found in \${CMAKE_SOURCE_DIR}/suitesparse-deps/lib")
    endif()
    
    if(NOT SUITESPARSE_LIBRARIES)
        message(FATAL_ERROR "No SuiteSparse libraries found!")
    endif()
    
    message(STATUS "SuiteSparse libraries: \${SUITESPARSE_LIBRARIES}")
    
endif()
"@
        
        New-Item -ItemType Directory -Force -Path "cmake"
        $findSuiteSparseContent | Out-File -FilePath "cmake/FindSuiteSparse.cmake" -Encoding UTF8
        
        # 2. Backup original CMakeLists.txt and create a patched version
        Copy-Item "CMakeLists.txt" "CMakeLists.txt.original" -Force
        
        # Read the original file
        $lines = Get-Content "CMakeLists.txt"
        
        # Find and replace the find_package line
        $newLines = @()
        foreach ($line in $lines) {
            if ($line -match 'find_package\s*\(\s*SuiteSparse\s+REQUIRED\s*\)') {
                # Replace with our custom find module
                $newLines += "# find_package(SuiteSparse REQUIRED) - Replaced with custom find module"
                $newLines += "include(cmake/FindSuiteSparse.cmake)"
            } else {
                $newLines += $line
            }
        }
        
        # Write the modified CMakeLists.txt
        $newLines | Out-File -FilePath "CMakeLists.txt" -Encoding UTF8
        
        Write-Host "Patches applied successfully!"
        
    - name: Debug - Show what was built
      shell: powershell
      run: |
        Write-Host "=== Debug Info ==="
        Write-Host "Contents of suitesparse-deps/lib:"
        if (Test-Path "suitesparse-deps/lib") {
            Get-ChildItem "suitesparse-deps/lib" -File | Select-Object Name, Length, LastWriteTime
        } else {
            Write-Host "Directory not found: suitesparse-deps/lib"
        }
        
        Write-Host "Contents of suitesparse-deps/include:"
        if (Test-Path "suitesparse-deps/include") {
            Get-ChildItem "suitesparse-deps/include" -Recurse -Directory | Select-Object FullName | ForEach-Object { $_.FullName }
        }
        
    - name: Build BFF
      shell: powershell
      run: |
        Write-Host "Configuring BFF..."
        
        # Create build directory
        New-Item -ItemType Directory -Force -Path "build"
        cd build
        
        # Debug: Show what's in the install directory
        Write-Host "Checking install directory contents..."
        if (Test-Path "..\suitesparse-deps\lib") {
            Write-Host "Libraries found:"
            Get-ChildItem "..\suitesparse-deps\lib" -Filter "*.lib" | Select-Object -First 10 Name
        }
        
        # Configure with CMake
        Write-Host "Running CMake configuration..."
        
        $cmakeArgs = @(
            "..",
            "-G", "Visual Studio 17 2022",
            "-A", "x64",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DCMAKE_PREFIX_PATH=`"$pwd\..\suitesparse-deps`"",
            "-DBLAS_LIBRARIES=`"$pwd\..\suitesparse-deps\lib\libopenblas.lib`"",
            "-DLAPACK_LIBRARIES=`"$pwd\..\suitesparse-deps\lib\libopenblas.lib`"",
            "-DCMAKE_FIND_DEBUG_MODE=ON"  # Enable debug output for find_package
        )
        
        # Run CMake
        cmake @cmakeArgs
        
        if ($LASTEXITCODE -eq 0) {
            Write-Host "Building BFF..."
            cmake --build . --config Release --parallel 4
        } else {
            Write-Host "CMake configuration failed with exit code: $LASTEXITCODE"
            exit $LASTEXITCODE
        }
        
    - name: Find and package binaries
      shell: powershell
      run: |
        Write-Host "Searching for built binaries..."
        
        # Create package directory
        New-Item -ItemType Directory -Force -Path "bff-package"
        
        # Find and copy executables from Release directory
        if (Test-Path "build\Release") {
            $exeFiles = Get-ChildItem -Path "build\Release" -Filter "*.exe" -File
            foreach ($exe in $exeFiles) {
                Write-Host "Found: $($exe.FullName)"
                Copy-Item -Path $exe.FullName -Destination "bff-package"
            }
            
            # Copy DLLs from Release directory
            $dllFiles = Get-ChildItem -Path "build\Release" -Filter "*.dll" -File
            foreach ($dll in $dllFiles) {
                Write-Host "Found DLL: $($dll.Name)"
                Copy-Item -Path $dll.FullName -Destination "bff-package"
            }
        }
        
        # Copy dependency DLLs
        if (Test-Path "suitesparse-deps\lib\*.dll") {
            Copy-Item "suitesparse-deps\lib\*.dll" "bff-package\" -ErrorAction SilentlyContinue
        }
        
        # Create a README file
        $readmeContent = @"
BFF (Boundary First Flattening) Windows Build
=============================================
Build Date: $(Get-Date -Format 'yyyy-MM-dd')
Version: 1.6

This package contains the Windows binaries for BFF.
To run the application, execute the .exe file in this folder.

Dependencies included:
- OpenBLAS
- SuiteSparse libraries (built via vcpkg)
- Required runtime DLLs
"@
        
        $readmeContent | Out-File -FilePath "bff-package\README.txt" -Encoding UTF8
        
        Write-Host "=== Package Contents ==="
        Get-ChildItem -Path "bff-package"
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bff-windows-binaries
        path: bff-package/
        if-no-files-found: warn
        retention-days: 7
