name: Build BFF Windows Binary

on:
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable debug output'
        required: false
        default: 'false'

env:
  BUILD_TYPE: Release

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Debug - Show environment
      shell: powershell
      run: |
        Write-Host "=== Starting BFF Build ==="
        Write-Host "Runner: $env:RUNNER_OS"
        Write-Host "Workspace: $env:GITHUB_WORKSPACE"
        Write-Host "Event: $env:GITHUB_EVENT_NAME"
        
    - name: Checkout BFF source code
      uses: actions/checkout@v4
      with:
        repository: 'GeometryCollective/boundary-first-flattening'
        ref: 'v1.6'
        
    - name: Show repository structure
      shell: powershell
      run: |
        Write-Host "=== Repository Structure ==="
        Get-ChildItem -Recurse | Select-Object -First 20 Name, Length | Format-Table
        
    - name: Fix CMakeLists.txt
      shell: powershell
      run: |
        Write-Host "=== Fixing CMakeLists.txt ==="
        if (Test-Path CMakeLists.txt) {
          $content = Get-Content CMakeLists.txt -Raw
          Write-Host "Original first line: $($content.Substring(0, 100))..."
          $fixed = $content -replace 'cmake_minimum_required\s*\(.*\)', 'cmake_minimum_required(VERSION 3.10)'
          Set-Content CMakeLists.txt -Value $fixed -NoNewline
          Write-Host "Fixed CMakeLists.txt"
        } else {
          Write-Host "ERROR: CMakeLists.txt not found!"
          Get-ChildItem
        }
        
    - name: Install vcpkg and dependencies
      shell: powershell
      run: |
        Write-Host "=== Installing vcpkg ==="
        
        # Install vcpkg
        git clone https://github.com/microsoft/vcpkg
        .\vcpkg\bootstrap-vcpkg.bat
        
        # Install minimal dependencies
        Write-Host "Installing SuiteSparse..."
        .\vcpkg\vcpkg install suitesparse:x64-windows --triplet x64-windows
        
        Write-Host "Installing FLTK..."
        .\vcpkg\vcpkg install fltk:x64-windows --triplet x64-windows
        
        Write-Host "Installing BLAS/LAPACK..."
        .\vcpkg\vcpkg install openblas:x64-windows --triplet x64-windows
        
        # Set environment variable
        $toolchain = "$pwd\vcpkg\scripts\buildsystems\vcpkg.cmake"
        Write-Host "VCPKG_TOOLCHAIN: $toolchain"
        echo "VCPKG_TOOLCHAIN=$toolchain" >> $env:GITHUB_ENV
        
    - name: Configure BFF
      shell: powershell
      run: |
        Write-Host "=== Configuring BFF ==="
        
        # Create build directory
        New-Item -ItemType Directory -Force -Path "build"
        Set-Location build
        
        # Simple configuration
        Write-Host "Running CMake with vcpkg toolchain..."
        cmake .. `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
          -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_TOOLCHAIN }}" `
          -DVCPKG_TARGET_TRIPLET=x64-windows `
          -DENABLE_BFF_CLI=ON `
          -DENABLE_BFF_GUI=ON
        
        Write-Host "CMake configuration completed"
        
    - name: Attempt Build
      shell: powershell
      run: |
        Write-Host "=== Attempting Build ==="
        Set-Location build
        
        # Try to build
        cmake --build . --config ${{ env.BUILD_TYPE }} || Write-Host "Build failed, continuing..."
        
        # Look for any output
        Write-Host "=== Build Output ==="
        Get-ChildItem . -Recurse -Filter "*.exe" | ForEach-Object {
          Write-Host "Found executable: $($_.FullName)"
        }
        
    - name: Create Artifact if Anything Built
      if: success() || failure()
      shell: powershell
      run: |
        Write-Host "=== Creating Artifact ==="
        
        # Create output directory
        New-Item -ItemType Directory -Force -Path "output"
        
        # Copy any executables
        $exes = Get-ChildItem -Path "." -Recurse -Filter "*.exe"
        if ($exes) {
          foreach ($exe in $exes) {
            Write-Host "Copying: $($exe.Name)"
            Copy-Item $exe.FullName -Destination "output\" -Force
          }
        } else {
          Write-Host "No executables found"
          # Create a dummy file so we can see the artifact
          "Build attempted but no executables were produced" | Out-File "output\BUILD_LOG.txt"
        }
        
        # Create simple README
        @'
BFF Windows Build Attempt
=========================
This is an attempted build of BFF v1.6 for Windows.

If executables are present, they should be in this folder.
Otherwise, check the build logs for errors.
'@ | Out-File "output\README.txt"
        
        # Create zip
        Compress-Archive -Path "output\*" -DestinationPath "bff-build-attempt.zip" -Force
        
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bff-windows-build
        path: bff-build-attempt.zip
        retention-days: 1
