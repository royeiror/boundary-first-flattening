name: Build BFF Windows Binary

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

env:
  BUILD_TYPE: Release
  FLTK_VERSION: '1.3.9'

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout BFF source code
      uses: actions/checkout@v4
      with:
        repository: 'GeometryCollective/boundary-first-flattening'
        ref: 'v1.6'
        submodules: 'recursive'

    - name: Patch CMakeLists.txt for modern CMake
      shell: powershell
      run: |
        # Fix the cmake_minimum_required line in the main CMakeLists.txt
        (Get-Content CMakeLists.txt -Raw) -replace 'cmake_minimum_required\(VERSION 3\.0\)', 'cmake_minimum_required(VERSION 3.5)' | Set-Content CMakeLists.txt
        
        # Also check and patch any subdirectory CMakeLists.txt files if needed
        Get-ChildItem -Recurse -Filter "CMakeLists.txt" | ForEach-Object {
          $content = Get-Content $_.FullName -Raw
          if ($content -match 'cmake_minimum_required\(VERSION 3\.[0-4]\)') {
            $content = $content -replace 'cmake_minimum_required\(VERSION 3\.[0-4]\)', 'cmake_minimum_required(VERSION 3.5)'
            Set-Content $_.FullName -Value $content -NoNewline
            Write-Host "Patched $($_.FullName)"
          }
        }

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install CMake
      uses: lukka/get-cmake@latest

    - name: Download SuiteSparse binaries
      shell: powershell
      run: |
        # Download individual SuiteSparse binaries from the repository
        $baseUrl = "https://github.com/royeiror/suitesparse-metis-for-windows/raw/master/binaries/x64"
        
        # Create directory structure
        New-Item -ItemType Directory -Force -Path "C:\suitesparse\include\suitesparse"
        New-Item -ItemType Directory -Force -Path "C:\suitesparse\lib"
        New-Item -ItemType Directory -Force -Path "C:\suitesparse\bin"
        
        # First, let's check what's actually available in the repository
        Write-Host "Checking repository structure..."
        
        # Try to download a test file to verify the structure
        try {
          Invoke-WebRequest -Uri "$baseUrl/include/amd.h" -OutFile "test.h"
          Write-Host "Repository structure verified"
          Remove-Item "test.h"
        } catch {
          Write-Host "Warning: Repository structure might be different than expected"
          Write-Host "Trying alternative approach..."
          
          # Try to download the entire binaries as a ZIP if individual files don't work
          Invoke-WebRequest -Uri "https://github.com/royeiror/suitesparse-metis-for-windows/archive/refs/heads/master.zip" -OutFile "suitesparse-master.zip"
          Expand-Archive -Path "suitesparse-master.zip" -DestinationPath "." -Force
          
          # Copy files from the extracted structure
          $sourceDir = "suitesparse-metis-for-windows-master/binaries/x64"
          if (Test-Path $sourceDir) {
            Copy-Item "$sourceDir/include/*" -Destination "C:\suitesparse\include\suitesparse\" -Recurse -Force -ErrorAction SilentlyContinue
            Copy-Item "$sourceDir/lib/*" -Destination "C:\suitesparse\lib\" -Recurse -Force -ErrorAction SilentlyContinue
            Copy-Item "$sourceDir/bin/*" -Destination "C:\suitesparse\bin\" -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "Copied SuiteSparse files from extracted ZIP"
          }
        }
        
        # Download critical header files if they weren't copied from ZIP
        $headers = @(
          "amd.h", "btf.h", "camd.h", "ccolamd.h", "cholmod.h", 
          "colamd.h", "cs.h", "cxsparse.h", "klu.h", "ldl.h", 
          "SuiteSparse_config.h", "umfpack.h"
        )
        
        foreach ($header in $headers) {
          $headerPath = "C:\suitesparse\include\suitesparse\$header"
          if (-not (Test-Path $headerPath)) {
            $url = "$baseUrl/include/$header"
            try {
              Invoke-WebRequest -Uri $url -OutFile $headerPath
              Write-Host "Downloaded $header"
            } catch {
              Write-Host "Warning: Could not download $header"
            }
          }
        }
        
        # Verify we have some files
        Write-Host "SuiteSparse files in C:\suitesparse:"
        Get-ChildItem "C:\suitesparse" -Recurse | Measure-Object | Select-Object Count

    - name: Build FLTK
      shell: powershell
      run: |
        # Download FLTK source
        $fltkUrl = "https://github.com/fltk/fltk/archive/refs/tags/release-${{ env.FLTK_VERSION }}.tar.gz"
        Invoke-WebRequest -Uri $fltkUrl -OutFile "fltk-source.tar.gz"
        
        # Extract using tar
        tar -xzf fltk-source.tar.gz
        
        # Create build directory
        New-Item -ItemType Directory -Force -Path "fltk-build"
        Set-Location fltk-build
        
        # Configure FLTK
        cmake ../fltk-release-${{ env.FLTK_VERSION }} `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
          -DCMAKE_INSTALL_PREFIX="C:\fltk" `
          -DOPTION_BUILD_SHARED_LIBS=OFF `
          -DOPTION_USE_SYSTEM_LIBJPEG=OFF `
          -DOPTION_USE_SYSTEM_LIBPNG=OFF `
          -DOPTION_USE_SYSTEM_ZLIB=OFF `
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL
        
        # Build and install FLTK
        cmake --build . --config ${{ env.BUILD_TYPE }} --target install -- /m

    - name: Configure BFF with CMake
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "build"
        Set-Location build
        
        # Configure BFF with CMake policy workaround
        cmake .. `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
          -DCMAKE_PREFIX_PATH="C:\fltk;C:\suitesparse" `
          -DSUITESPARSE_INCLUDE_DIR_HINTS="C:\suitesparse\include\suitesparse" `
          -DSUITESPARSE_LIBRARY_DIR_HINTS="C:\suitesparse\lib" `
          -DFLTK_DIR="C:\fltk\lib\cmake\fltk" `
          -DENABLE_BFF_CLI=ON `
          -DENABLE_BFF_GUI=ON `
          -DCMAKE_INSTALL_PREFIX="$pwd\install" `
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL `
          -DCMAKE_POLICY_DEFAULT_CMP0048=NEW `
          -DCMAKE_POLICY_DEFAULT_CMP0077=NEW
        
        # Show configuration summary
        Write-Host "CMake configuration complete"

    - name: Build BFF
      shell: powershell
      run: |
        Set-Location build
        cmake --build . --config ${{ env.BUILD_TYPE }} --target install -- /m
        
        # Verify build
        if (Test-Path "install\bin\bff-gui.exe") {
          Write-Host "bff-gui.exe built successfully"
        else {
          Write-Error "bff-gui.exe not found"
          Get-ChildItem "install" -Recurse
          exit 1
        }

    - name: Collect dependencies
      shell: powershell
      run: |
        # Create distribution directory
        New-Item -ItemType Directory -Force -Path "bff-dist"
        
        # Copy executables
        Copy-Item "build\install\bin\*.exe" -Destination "bff-dist\" -Force
        
        # Copy SuiteSparse DLLs
        if (Test-Path "C:\suitesparse\bin\*.dll") {
          Copy-Item "C:\suitesparse\bin\*.dll" -Destination "bff-dist\" -Force
          Write-Host "Copied SuiteSparse DLLs"
        }
        
        # Check for required DLLs
        Write-Host "Checking executable dependencies..."
        $exes = Get-ChildItem "bff-dist\*.exe"
        foreach ($exe in $exes) {
          Write-Host "Dependencies for $($exe.Name):"
          dumpbin /DEPENDENTS $exe.FullName | Select-String ".dll"
        }

    - name: Package for distribution
      shell: powershell
      run: |
        # Create README
        $readmeLines = @(
          "# BFF (Boundary First Flattening) v1.6 - Windows Binary",
          "",
          "## Included Files",
          "- bff-gui.exe: GUI application for mesh parameterization",
          "- bff.exe: Command-line interface",
          "- SuiteSparse DLLs: Required numerical libraries",
          "",
          "## Requirements",
          "- Windows 10 or later",
          "- Visual C++ Redistributable (if not already installed)",
          "",
          "## Usage",
          "Double-click bff-gui.exe to launch the graphical interface.",
          "",
          "For command-line usage, run:",
          "  bff.exe --help",
          "",
          "## Build Information",
          "Built on GitHub Actions using:",
          "- SuiteSparse binaries from: https://github.com/royeiror/suitesparse-metis-for-windows",
          "- FLTK 1.3.9",
          "- MSVC compiler",
          "- Patched CMakeLists.txt for modern CMake compatibility"
        )
        
        $readmeLines | Out-File -FilePath "bff-dist\README.txt" -Encoding UTF8
        
        # Create ZIP archive
        Compress-Archive -Path "bff-dist\*" -DestinationPath "bff-windows-x64-v1.6.zip" -Force
        Write-Host "Created ZIP archive: bff-windows-x64-v1.6.zip"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: bff-windows-binary
        path: bff-windows-x64-v1.6.zip
        retention-days: 30
