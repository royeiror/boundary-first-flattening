name: Windows Build BFF v1.6

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  BUILD_DIR: "C:\\build"
  INSTALL_DIR: "C:\\suitesparse-deps"
  OPENBLAS_DIR: "C:\\openblas-install"
  CMAKE_GENERATOR: "Visual Studio 17 2022"
  CMAKE_ARCH: "x64"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    
    steps:
    - name: Checkout BFF repository
      uses: actions/checkout@v4
      with:
        repository: GeometryCollective/boundary-first-flattening
        ref: v1.6
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install build tools
      shell: cmd
      run: |
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
        choco install wget -y
        choco install 7zip -y
        choco install git -y
        REM Python is already available on the runner, no need to install
        
    - name: Download pre-built OpenBLAS
      shell: powershell
      run: |
        Write-Host "Downloading pre-built OpenBLAS..."
        mkdir -Force $env:OPENBLAS_DIR
        wget https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.28/OpenBLAS-0.3.28-x64.zip -OutFile openblas.zip
        7z x openblas.zip -o"$env:OPENBLAS_DIR"
        
    - name: Build SuiteSparse with METIS
      shell: powershell
      run: |
        Write-Host "Building SuiteSparse with METIS..."
        
        # Clean up
        Remove-Item -Recurse -Force $env:INSTALL_DIR -ErrorAction SilentlyContinue
        Remove-Item -Recurse -Force SuiteSparse -ErrorAction SilentlyContinue
        
        # Create directories
        New-Item -ItemType Directory -Force -Path "$env:INSTALL_DIR\lib"
        New-Item -ItemType Directory -Force -Path "$env:INSTALL_DIR\include"
        
        # Clone SuiteSparse
        git clone https://github.com/DrTimothyAldenDavis/SuiteSparse.git
        cd SuiteSparse
        git checkout v5.13.0
        
        # Build SuiteSparse_config
        Write-Host "Building SuiteSparse_config..."
        cd SuiteSparse_config
        mkdir build
        cd build
        cmake .. -G "$env:CMAKE_GENERATOR" -A $env:CMAKE_ARCH -DCMAKE_INSTALL_PREFIX="$env:INSTALL_DIR"
        cmake --build . --config Release --target install
        cd ../../
        
        # Build AMD
        Write-Host "Building AMD..."
        cd AMD
        mkdir build
        cd build
        cmake .. -G "$env:CMAKE_GENERATOR" -A $env:CMAKE_ARCH -DCMAKE_INSTALL_PREFIX="$env:INSTALL_DIR"
        cmake --build . --config Release --target install
        cd ../../
        
        # Build CAMD
        Write-Host "Building CAMD..."
        cd CAMD
        mkdir build
        cd build
        cmake .. -G "$env:CMAKE_GENERATOR" -A $env:CMAKE_ARCH -DCMAKE_INSTALL_PREFIX="$env:INSTALL_DIR"
        cmake --build . --config Release --target install
        cd ../../
        
        # Build CCOLAMD
        Write-Host "Building CCOLAMD..."
        cd CCOLAMD
        mkdir build
        cd build
        cmake .. -G "$env:CMAKE_GENERATOR" -A $env:CMAKE_ARCH -DCMAKE_INSTALL_PREFIX="$env:INSTALL_DIR"
        cmake --build . --config Release --target install
        cd ../../
        
        # Build COLAMD
        Write-Host "Building COLAMD..."
        cd COLAMD
        mkdir build
        cd build
        cmake .. -G "$env:CMAKE_GENERATOR" -A $env:CMAKE_ARCH -DCMAKE_INSTALL_PREFIX="$env:INSTALL_DIR"
        cmake --build . --config Release --target install
        cd ../../
        
        # Build CHOLMOD
        Write-Host "Building CHOLMOD..."
        cd CHOLMOD
        mkdir build
        cd build
        
        # Create CMakeLists.txt for CHOLMOD line by line
        $cmakeLines = @(
            "cmake_minimum_required(VERSION 3.10)",
            "project(CHOLMOD)",
            "",
            "# Find SuiteSparse_config",
            "find_package(SuiteSparse_config REQUIRED)",
            "",
            "# Include directories",
            "include_directories(",
            "    ../Include",
            "    ../../AMD/Include",
            "    ../../CAMD/Include", 
            "    ../../CCOLAMD/Include",
            "    ../../COLAMD/Include",
            "    ../../SuiteSparse_config",
            ")",
            "",
            "# Source files",
            "file(GLOB CHOLMOD_SOURCES `"../Core/*.c`" `"../Cholesky/*.c`" `"../Partition/*.c`" `"../MatrixOps/*.c`" `"../Modify/*.c`" `"../Supernodal/*.c`")",
            "",
            "# Create library",
            "add_library(cholmod STATIC `${CHOLMOD_SOURCES}`)",
            "",
            "# Link dependencies",
            "target_link_libraries(cholmod",
            "    suitesparseconfig",
            "    amd",
            "    camd", 
            "    ccolamd",
            "    colamd",
            "    `"`${OPENBLAS_DIR}`/lib/libopenblas.lib`"",
            ")",
            "",
            "# Install",
            "install(TARGETS cholmod",
            "    ARCHIVE DESTINATION lib",
            "    LIBRARY DESTINATION lib",
            ")",
            "",
            "install(DIRECTORY ../Include/ DESTINATION include)"
        )
        
        $cmakeContent = $cmakeLines -join "`n"
        $cmakeContent | Out-File -FilePath ../CMakeLists.txt -Encoding UTF8
        
        # Build CHOLMOD
        cmake .. -G "$env:CMAKE_GENERATOR" -A $env:CMAKE_ARCH `
            -DCMAKE_INSTALL_PREFIX="$env:INSTALL_DIR" `
            -DOPENBLAS_DIR="$env:OPENBLAS_DIR"
        
        cmake --build . --config Release --target install
        cd ../../
        
        Write-Host "SuiteSparse build complete!"
        
    - name: Apply Windows patches for BFF
      shell: powershell
      run: |
        Write-Host "Applying Windows compatibility patches..."
        
        # 1. Create custom FindSuiteSparse.cmake
        $findSuiteSparseLines = @(
            "# Custom FindSuiteSparse for Windows",
            "if(WIN32)",
            "    message(STATUS `"Using custom SuiteSparse configuration for Windows`")",
            "",
            "    set(SUITESPARSE_FOUND TRUE)",
            "",
            "    # Set include directories",
            "    set(SUITESPARSE_INCLUDE_DIRS",
            "        `"`${CMAKE_SOURCE_DIR}`/suitesparse-deps/include`"",
            "        `"`${CMAKE_SOURCE_DIR}`/SuiteSparse/AMD/Include`"", 
            "        `"`${CMAKE_SOURCE_DIR}`/SuiteSparse/CAMD/Include`"",
            "        `"`${CMAKE_SOURCE_DIR}`/SuiteSparse/CCOLAMD/Include`"",
            "        `"`${CMAKE_SOURCE_DIR}`/SuiteSparse/COLAMD/Include`"",
            "        `"`${CMAKE_SOURCE_DIR}`/SuiteSparse/CHOLMOD/Include`"",
            "    )",
            "",
            "    # Set library directories",
            "    set(SUITESPARSE_LIBRARY_DIRS `"`${CMAKE_SOURCE_DIR}`/suitesparse-deps/lib`")",
            "",
            "    # Set libraries",
            "    set(SUITESPARSE_LIBRARIES",
            "        `"`${CMAKE_SOURCE_DIR}`/suitesparse-deps/lib/cholmod.lib`"",
            "        `"`${CMAKE_SOURCE_DIR}`/suitesparse-deps/lib/amd.lib`"", 
            "        `"`${CMAKE_SOURCE_DIR}`/suitesparse-deps/lib/camd.lib`"",
            "        `"`${CMAKE_SOURCE_DIR}`/suitesparse-deps/lib/ccolamd.lib`"",
            "        `"`${CMAKE_SOURCE_DIR}`/suitesparse-deps/lib/colamd.lib`"",
            "        `"`${CMAKE_SOURCE_DIR}`/suitesparse-deps/lib/suitesparseconfig.lib`"",
            "        `"`${CMAKE_SOURCE_DIR}`/openblas-install/lib/libopenblas.lib`"",
            "    )",
            "",
            "    # Set BLAS/LAPACK libraries",
            "    set(BLAS_LIBRARIES `"`${CMAKE_SOURCE_DIR}`/openblas-install/lib/libopenblas.lib`")",
            "    set(LAPACK_LIBRARIES `"`${CMAKE_SOURCE_DIR}`/openblas-install/lib/libopenblas.lib`")",
            "",
            "    # Mark as advanced",
            "    mark_as_advanced(SUITESPARSE_INCLUDE_DIRS SUITESPARSE_LIBRARIES)",
            "endif()"
        )
        
        New-Item -ItemType Directory -Force -Path "cmake"
        ($findSuiteSparseLines -join "`n") | Out-File -FilePath "cmake/FindSuiteSparse.cmake" -Encoding UTF8
        
        # 2. Patch CMakeLists.txt - FIXED: Use PowerShell newline character
        $cmakeLists = Get-Content "CMakeLists.txt" -Raw
        $replacementText = '# find_package(SuiteSparse REQUIRED) - Using custom config' + [Environment]::NewLine + 'include(cmake/FindSuiteSparse.cmake)'
        $cmakeLists = $cmakeLists -replace 'find_package\(SuiteSparse REQUIRED\)', $replacementText
        $cmakeLists | Out-File -FilePath "CMakeLists.txt" -Encoding UTF8
        
        # 3. Add OpenBLAS include
        $cmakeLists = Get-Content "CMakeLists.txt" -Raw
        if ($cmakeLists -match 'include_directories\(') {
            $openblasInclude = 'include_directories(' + [Environment]::NewLine + '    ${CMAKE_SOURCE_DIR}/openblas-install/include'
            $cmakeLists = $cmakeLists -replace 'include_directories\(', $openblasInclude
            $cmakeLists | Out-File -FilePath "CMakeLists.txt" -Encoding UTF8
        }
        
        Write-Host "Patches applied successfully!"
        
    - name: Build BFF
      shell: cmd
      run: |
        echo "Configuring BFF..."
        
        mkdir build
        cd build
        
        cmake .. -G "Visual Studio 17 2022" -A x64 ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DSUITESPARSE_INCLUDE_DIR="%CD%\..\suitesparse-deps\include" ^
          -DSUITESPARSE_LIBRARY_DIR="%CD%\..\suitesparse-deps\lib" ^
          -DBLAS_LIBRARIES="%CD%\..\openblas-install\lib\libopenblas.lib" ^
          -DLAPACK_LIBRARIES="%CD%\..\openblas-install\lib\libopenblas.lib"
        
        echo "Building BFF..."
        cmake --build . --config Release --parallel 4
        
    - name: Find and package binaries
      shell: powershell
      run: |
        Write-Host "Searching for built binaries..."
        
        # Create package directory
        New-Item -ItemType Directory -Force -Path "bff-package"
        
        # Find and copy executables
        $exeFiles = Get-ChildItem -Path "." -Recurse -Filter "*.exe" -File | Where-Object {
            $_.DirectoryName -match "Release" -and (
                $_.Name -match "bff" -or 
                $_.Name -match "viewer" -or
                $_.Name -match "gui"
            )
        }
        
        foreach ($exe in $exeFiles) {
            Write-Host "Found: $($exe.FullName)"
            Copy-Item -Path $exe.FullName -Destination "bff-package"
        }
        
        # Find and copy DLLs
        $dllFiles = Get-ChildItem -Path "." -Recurse -Filter "*.dll" -File | Where-Object {
            $_.DirectoryName -match "Release"
        }
        
        foreach ($dll in $dllFiles) {
            Write-Host "Found DLL: $($dll.Name)"
            Copy-Item -Path $dll.FullName -Destination "bff-package"
        }
        
        # Copy OpenBLAS DLL
        if (Test-Path "openblas-install/bin/libopenblas.dll") {
            Copy-Item -Path "openblas-install/bin/libopenblas.dll" -Destination "bff-package"
            Write-Host "Copied: libopenblas.dll"
        }
        
        # Create a README file
        $readmeLines = @(
            "BFF (Boundary First Flattening) Windows Build",
            "=============================================",
            "Build Date: $(Get-Date -Format 'yyyy-MM-dd')",
            "Version: 1.6",
            "",
            "This package contains the Windows binaries for BFF.",
            "To run the application, execute the .exe file in this folder.",
            "",
            "Dependencies included:",
            "- OpenBLAS",
            "- SuiteSparse libraries",
            "- Required runtime DLLs"
        )
        
        $readmeContent = $readmeLines -join "`n"
        $readmeContent | Out-File -FilePath "bff-package/README.txt" -Encoding UTF8
        
        Write-Host "=== Package Contents ==="
        Get-ChildItem -Path "bff-package"
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bff-windows-binaries
        path: bff-package/
        if-no-files-found: error
        retention-days: 7
        
    - name: Create zip archive
      shell: powershell
      run: |
        Write-Host "Creating zip archive..."
        Compress-Archive -Path "bff-package/*" -DestinationPath "bff-windows.zip" -Force
        
    - name: Upload zip artifact
      uses: actions/upload-artifact@v4
      with:
        name: bff-windows-zip
        path: bff-windows.zip
        retention-days: 7
