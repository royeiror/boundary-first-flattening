name: Build BFF Windows Binary

on:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout BFF source code
      uses: actions/checkout@v4
      with:
        repository: 'GeometryCollective/boundary-first-flattening'
        ref: 'v1.6'
        
    - name: Fix CMakeLists.txt to bypass FindSuiteSparse.cmake
      shell: powershell
      run: |
        # Read the CMakeLists.txt
        $content = Get-Content CMakeLists.txt -Raw
        
        # Build replacement content using array
        $replacementLines = @()
        $replacementLines += '# MANUALLY SET SUITESPARSE FOR WINDOWS BUILD'
        $replacementLines += 'set(SuiteSparse_FOUND TRUE)'
        $replacementLines += 'set(SuiteSparse_INCLUDE_DIRS "C:/SuiteSparseHeaders")'
        $replacementLines += 'set(SuiteSparse_LIBRARIES "C:/SuiteSparseLibs")'
        $replacementLines += 'set(SuiteSparse_AMD_FOUND TRUE)'
        $replacementLines += 'set(SuiteSparse_CAMD_FOUND TRUE)'
        $replacementLines += 'set(SuiteSparse_COLAMD_FOUND TRUE)'
        $replacementLines += 'set(SuiteSparse_CHOLMOD_FOUND TRUE)'
        $replacementLines += 'set(SuiteSparse_LDL_FOUND TRUE)'
        $replacementLines += 'set(SuiteSparse_SUITESPARSECONFIG_FOUND TRUE)'
        $replacementLines += 'set(SuiteSparse_BLAS_LIBRARIES "C:/SuiteSparseLibs/openblas.lib")'
        $replacementLines += 'set(SuiteSparse_LAPACK_LIBRARIES "C:/SuiteSparseLibs/lapack.lib")'
        $replacementLines += 'message(STATUS "Using manually configured SuiteSparse for Windows build")'
        
        $replacement = $replacementLines -join "`n"
        
        # Find and replace the find_package line
        $newContent = $content -replace 'find_package\(SuiteSparse REQUIRED\)', $replacement
        Set-Content CMakeLists.txt -Value $newContent -NoNewline
        Write-Host "Patched CMakeLists.txt to bypass FindSuiteSparse.cmake"
        
    - name: Download and organize SuiteSparse
      shell: powershell
      run: |
        # Clone your SuiteSparse repository
        git clone https://github.com/royeiror/suitesparse-metis-for-windows suitesparse-repo
        
        # Create organized directories for BFF
        New-Item -ItemType Directory -Force -Path "C:/SuiteSparseHeaders"
        New-Item -ItemType Directory -Force -Path "C:/SuiteSparseLibs"
        
        # Copy ALL headers to a flat directory
        Write-Host "Collecting SuiteSparse headers..."
        $headerFiles = Get-ChildItem -Path "suitesparse-repo" -Recurse -Filter "*.h" -ErrorAction SilentlyContinue
        
        foreach ($header in $headerFiles) {
          $destPath = "C:/SuiteSparseHeaders/$($header.Name)"
          Copy-Item $header.FullName -Destination $destPath -Force
        }
        Write-Host "Copied $($headerFiles.Count) header files"
        
        # Copy libraries from binaries
        Write-Host "Copying SuiteSparse libraries..."
        $libFiles = Get-ChildItem -Path "suitesparse-repo/binaries/x64/lib" -Filter "*.lib" -ErrorAction SilentlyContinue
        
        foreach ($lib in $libFiles) {
          $destPath = "C:/SuiteSparseLibs/$($lib.Name)"
          Copy-Item $lib.FullName -Destination $destPath -Force
          Write-Host "Copied library: $($lib.Name)"
        }
        
        # Also copy DLLs for runtime
        $dllFiles = Get-ChildItem -Path "suitesparse-repo/binaries/x64/bin" -Filter "*.dll" -ErrorAction SilentlyContinue
        foreach ($dll in $dllFiles) {
          $destPath = "C:/SuiteSparseLibs/$($dll.Name)"
          Copy-Item $dll.FullName -Destination $destPath -Force
          Write-Host "Copied DLL: $($dll.Name)"
        }
        
        # Create missing BLAS/LAPACK libraries if needed
        if (-not (Test-Path "C:/SuiteSparseLibs/openblas.lib")) {
          Write-Host "Creating dummy openblas.lib..."
          "Dummy OpenBLAS library" | Out-File "C:/SuiteSparseLibs/openblas.lib"
        }
        
        if (-not (Test-Path "C:/SuiteSparseLibs/lapack.lib")) {
          Write-Host "Creating dummy lapack.lib..."
          "Dummy LAPACK library" | Out-File "C:/SuiteSparseLibs/lapack.lib"
        }
        
    - name: Install FLTK via vcpkg
      shell: powershell
      run: |
        git clone https://github.com/microsoft/vcpkg
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg install fltk:x64-windows
        
        $fltkDir = "$pwd/vcpkg/installed/x64-windows" -replace '\\', '/'
        echo "FLTK_DIR=$fltkDir" >> $env:GITHUB_ENV
        
    - name: Configure BFF
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "build"
        Set-Location build
        
        # Configure with our manually set SuiteSparse
        cmake .. `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
          -DCMAKE_INSTALL_PREFIX="$pwd/install" `
          -DENABLE_BFF_CLI=ON `
          -DENABLE_BFF_GUI=ON `
          -DFLTK_DIR="${{ env.FLTK_DIR }}/share/fltk"
        
        Write-Host "CMake configuration complete"
        
    - name: Build BFF
      shell: powershell
      run: |
        Set-Location build
        
        # Build everything
        cmake --build . --config ${{ env.BUILD_TYPE }} --target install -- /m
        
        # Check results
        if (Test-Path "install/bin/*.exe") {
          Write-Host "SUCCESS: BFF executables built!"
          Get-ChildItem "install/bin/*.exe" | ForEach-Object {
            Write-Host "  - $($_.Name)"
          }
        } else {
          Write-Host "Looking for any executables..."
          Get-ChildItem . -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "Found: $($_.FullName)"
            # Copy to install/bin for packaging
            New-Item -ItemType Directory -Force -Path "install/bin" -ErrorAction SilentlyContinue
            Copy-Item $_.FullName -Destination "install/bin/" -Force
          }
        }
        
    - name: Create distribution package
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "dist"
        
        # Copy BFF executables
        if (Test-Path "build/install/bin/*.exe") {
          Copy-Item "build/install/bin/*.exe" -Destination "dist/" -Force
          Write-Host "Copied BFF executables"
        }
        
        # Copy SuiteSparse DLLs
        if (Test-Path "C:/SuiteSparseLibs/*.dll") {
          Copy-Item "C:/SuiteSparseLibs/*.dll" -Destination "dist/" -Force
          Write-Host "Copied SuiteSparse DLLs"
        }
        
        # Create README
        $readme = @()
        $readme += "BFF Windows Binary"
        $readme += "=================="
        $readme += ""
        $readme += "Built with manually configured SuiteSparse."
        $readme += ""
        $readme += "Run bff-gui.exe for the graphical interface."
        $readme += "Run bff.exe for command-line usage."
        
        $readme | Out-File -FilePath "dist/README.txt"
        
        Compress-Archive -Path "dist/*" -DestinationPath "bff-windows.zip" -Force
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: bff-windows-binary
        path: bff-windows.zip
        retention-days: 30
