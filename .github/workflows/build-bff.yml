name: Build BFF Windows Binary

on:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout BFF source code
      uses: actions/checkout@v4
      with:
        repository: 'GeometryCollective/boundary-first-flattening'
        ref: 'v1.6'
        
    - name: Fix CMakeLists.txt
      shell: powershell
      run: |
        (Get-Content CMakeLists.txt) -replace 'cmake_minimum_required\s*\(.*\)', 'cmake_minimum_required(VERSION 3.10)' | Set-Content CMakeLists.txt
        
    - name: Create SuiteSparse directory structure
      shell: powershell
      run: |
        # Create SuiteSparse directories
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse"
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse\include"
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse\lib"
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse\bin"
        
        # Since we can't download from your repo (URLs return 404), create dummy files
        # These will allow CMake to find "something" and we can see what's missing
        
        # Create minimal SuiteSparse_config.h
        $suiteConfig = '#ifndef SUITESPARSE_CONFIG_H
#define SUITESPARSE_CONFIG_H
#define SUITESPARSE_VERSION "5.10.1"
typedef long long SuiteSparse_long;
#endif'
        Set-Content -Path "C:\SuiteSparse\include\SuiteSparse_config.h" -Value $suiteConfig
        
        # Create other minimal headers
        $headers = @("amd.h", "camd.h", "ccolamd.h", "colamd.h", "cholmod.h", "ldl.h")
        foreach ($header in $headers) {
            "#pragma once`ntypedef int dummy_$(($header -replace '\.h$',''))_t;" | Out-File "C:\SuiteSparse\include\$header"
        }
        
        # Create dummy .lib files
        $libs = @("amd", "camd", "ccolamd", "colamd", "cholmod", "ldl", "suitesparseconfig")
        foreach ($lib in $libs) {
            "LIBRARY $lib`nEXPORTS`ndummy_export" | Out-File "C:\SuiteSparse\lib\$lib.lib"
        }
        
        Write-Host "Created minimal SuiteSparse structure"
        
    - name: Install FLTK via vcpkg
      shell: powershell
      run: |
        git clone https://github.com/microsoft/vcpkg
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg install fltk:x64-windows
        
        # Get the installed directory
        $fltkDir = "$pwd\vcpkg\installed\x64-windows"
        echo "FLTK_DIR=$fltkDir" >> $env:GITHUB_ENV
        
    - name: Create simple CMakeLists patch
      shell: powershell
      run: |
        # Create a simple patch to bypass SuiteSparse dependency check
        $patchContent = @'
# Temporary patch to allow build without full SuiteSparse
if(WIN32)
  # Override SuiteSparse check
  set(SuiteSparse_FOUND TRUE)
  set(SuiteSparse_INCLUDE_DIRS "C:/SuiteSparse/include")
  set(SuiteSparse_LIBRARIES "C:/SuiteSparse/lib/amd.lib;C:/SuiteSparse/lib/cholmod.lib")
  
  # Also set individual components
  set(SuiteSparse_AMD_FOUND TRUE)
  set(SuiteSparse_CHOLMOD_FOUND TRUE)
  
  message(STATUS "Bypassing SuiteSparse dependency check for Windows build")
endif()
'@
        
        # Add this to CMakeLists.txt before find_package(SuiteSparse)
        $cmakeLists = Get-Content CMakeLists.txt -Raw
        $findSuiteSparse = 'find_package(SuiteSparse REQUIRED)'
        $patched = $cmakeLists.Replace($findSuiteSparse, "$patchContent`n`n$findSuiteSparse")
        Set-Content CMakeLists.txt -Value $patched -NoNewline
        
    - name: Configure BFF with minimal setup
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "build"
        Set-Location build
        
        # Use forward slashes for CMake paths
        $currentDir = $pwd -replace '\\', '/'
        $parentDir = (Get-Item $currentDir).Parent.FullName -replace '\\', '/'
        
        # Configure with simple settings
        cmake .. `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
          -DCMAKE_INSTALL_PREFIX="$currentDir/install" `
          -DENABLE_BFF_CLI=ON `
          -DENABLE_BFF_GUI=ON `
          -DSUITESPARSE_FOUND=TRUE `
          -DSUITESPARSE_INCLUDE_DIR="C:/SuiteSparse/include" `
          -DSUITESPARSE_LIBRARY_DIR="C:/SuiteSparse/lib"
        
        Write-Host "CMake configuration attempted"
        
    - name: Try to build BFF core
      shell: powershell
      run: |
        Set-Location build
        
        # Try to build just the core library first
        Write-Host "Attempting to build core components..."
        
        # First, let's see what targets are available
        cmake --build . --target help 2>&1 | Select-Object -First 20
        
        # Try to build the library target if it exists
        cmake --build . --config ${{ env.BUILD_TYPE }} --target bff 2>&1 | Select-Object -Last 50
        
        # Look for any built files
        Get-ChildItem . -Recurse -Filter "*.obj" -ErrorAction SilentlyContinue | Select-Object -First 10 Name
        
    - name: Create debug artifact
      if: always()
      shell: powershell
      run: |
        # Create output with debug info
        New-Item -ItemType Directory -Force -Path "debug_output"
        
        # Save CMake output
        if (Test-Path "build\CMakeCache.txt") {
            Copy-Item "build\CMakeCache.txt" -Destination "debug_output\" -Force
        }
        
        # List all files in build directory
        Get-ChildItem "build" -Recurse | Select-Object Name, Length | Out-File "debug_output\build_files.txt"
        
        # Create summary
        $summary = "Build attempted at: $(Get-Date)`r`n"
        $summary += "Working directory: $pwd`r`n"
        $summary += "SuiteSparse directory exists: $(Test-Path 'C:\SuiteSparse')`r`n"
        $summary += "FLTK directory exists: $(Test-Path '${{ env.FLTK_DIR }}')`r`n"
        
        Set-Content -Path "debug_output\summary.txt" -Value $summary
        
        Compress-Archive -Path "debug_output\*" -DestinationPath "debug_info.zip" -Force
        
    - name: Upload debug info
      uses: actions/upload-artifact@v4
      with:
        name: build-debug-info
        path: debug_info.zip
        retention-days: 7
