name: Build BFF Windows Binary

on:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout BFF source code
      uses: actions/checkout@v4
      with:
        repository: 'GeometryCollective/boundary-first-flattening'
        ref: 'v1.6'
        
    - name: Fix CMakeLists.txt
      shell: powershell
      run: |
        (Get-Content CMakeLists.txt) -replace 'cmake_minimum_required\s*\(.*\)', 'cmake_minimum_required(VERSION 3.10)' | Set-Content CMakeLists.txt
        
    - name: Create SuiteSparse directory structure
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse"
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse\include"
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse\lib"
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse\bin"
        
        $suiteConfig = '#ifndef SUITESPARSE_CONFIG_H'
        $suiteConfig += '#define SUITESPARSE_CONFIG_H'
        $suiteConfig += '#define SUITESPARSE_VERSION "5.10.1"'
        $suiteConfig += 'typedef long long SuiteSparse_long;'
        $suiteConfig += '#endif'
        
        Set-Content -Path "C:\SuiteSparse\include\SuiteSparse_config.h" -Value $suiteConfig
        
        $headers = @("amd.h", "camd.h", "ccolamd.h", "colamd.h", "cholmod.h", "ldl.h")
        foreach ($header in $headers) {
            $content = "#pragma once"
            $content += "`ntypedef int dummy_$(($header -replace '\.h$',''))_t;"
            Set-Content -Path "C:\SuiteSparse\include\$header" -Value $content
        }
        
        $libs = @("amd", "camd", "ccolamd", "colamd", "cholmod", "ldl", "suitesparseconfig")
        foreach ($lib in $libs) {
            $content = "LIBRARY $lib"
            $content += "`nEXPORTS"
            $content += "`ndummy_export"
            Set-Content -Path "C:\SuiteSparse\lib\$lib.lib" -Value $content
        }
        
        Write-Host "Created minimal SuiteSparse structure"
        
    - name: Install FLTK via vcpkg
      shell: powershell
      run: |
        git clone https://github.com/microsoft/vcpkg
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg install fltk:x64-windows
        
        $fltkDir = "$pwd\vcpkg\installed\x64-windows"
        echo "FLTK_DIR=$fltkDir" >> $env:GITHUB_ENV
        
    - name: Create simple CMakeLists patch
      shell: powershell
      run: |
        $patchLines = @()
        $patchLines += '# Temporary patch to allow build without full SuiteSparse'
        $patchLines += 'if(WIN32)'
        $patchLines += '  # Override SuiteSparse check'
        $patchLines += '  set(SuiteSparse_FOUND TRUE)'
        $patchLines += '  set(SuiteSparse_INCLUDE_DIRS "C:/SuiteSparse/include")'
        $patchLines += '  set(SuiteSparse_LIBRARIES "C:/SuiteSparse/lib/amd.lib;C:/SuiteSparse/lib/cholmod.lib")'
        $patchLines += '  '
        $patchLines += '  # Also set individual components'
        $patchLines += '  set(SuiteSparse_AMD_FOUND TRUE)'
        $patchLines += '  set(SuiteSparse_CHOLMOD_FOUND TRUE)'
        $patchLines += '  '
        $patchLines += '  message(STATUS "Bypassing SuiteSparse dependency check for Windows build")'
        $patchLines += 'endif()'
        
        $patchContent = $patchLines -join "`n"
        
        $cmakeLists = Get-Content CMakeLists.txt -Raw
        $findSuiteSparse = 'find_package(SuiteSparse REQUIRED)'
        $patched = $cmakeLists.Replace($findSuiteSparse, "$patchContent`n`n$findSuiteSparse")
        Set-Content CMakeLists.txt -Value $patched -NoNewline
        
    - name: Configure BFF with minimal setup
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "build"
        Set-Location build
        
        $currentDir = $pwd -replace '\\', '/'
        
        cmake .. `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
          -DCMAKE_INSTALL_PREFIX="$currentDir/install" `
          -DENABLE_BFF_CLI=ON `
          -DENABLE_BFF_GUI=ON
        
        Write-Host "CMake configuration attempted"
        
    - name: Try to build BFF core
      shell: powershell
      run: |
        Set-Location build
        
        Write-Host "Attempting to build core components..."
        
        cmake --build . --config ${{ env.BUILD_TYPE }} 2>&1 | Select-Object -Last 100
        
    - name: Create debug artifact
      if: always()
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "debug_output"
        
        if (Test-Path "build\CMakeCache.txt") {
            Copy-Item "build\CMakeCache.txt" -Destination "debug_output\" -Force
        }
        
        Get-ChildItem "build" -Recurse -ErrorAction SilentlyContinue | Select-Object Name, Length | Out-File "debug_output\build_files.txt"
        
        $summary = "Build attempted at: $(Get-Date)"
        $summary += "`r`nWorking directory: $pwd"
        $summary += "`r`nSuiteSparse directory exists: $(Test-Path 'C:\SuiteSparse')"
        $summary += "`r`nFLTK directory exists: $(Test-Path '${{ env.FLTK_DIR }}')"
        
        Set-Content -Path "debug_output\summary.txt" -Value $summary
        
        Compress-Archive -Path "debug_output\*" -DestinationPath "debug_info.zip" -Force
        
    - name: Upload debug info
      uses: actions/upload-artifact@v4
      with:
        name: build-debug-info
        path: debug_info.zip
        retention-days: 7
