name: Build BFF Windows Binary

on:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout BFF source code
      uses: actions/checkout@v4
      with:
        repository: 'GeometryCollective/boundary-first-flattening'
        ref: 'v1.6'
        
    - name: Download SuiteSparse source and binaries
      shell: powershell
      run: |
        # Clone the repository (contains both source and binaries)
        git clone https://github.com/royeiror/suitesparse-metis-for-windows suitesparse
        
        # Navigate to SuiteSparse source
        cd suitesparse
        
        # Create a unified include directory for BFF
        New-Item -ItemType Directory -Force -Path "C:/SuiteSparseUnified/include/suitesparse"
        New-Item -ItemType Directory -Force -Path "C:/SuiteSparseUnified/lib"
        
        # Collect ALL headers from scattered module directories
        Write-Host "Collecting SuiteSparse headers..."
        
        # Find all .h files in SuiteSparse subdirectories
        $headerFiles = Get-ChildItem -Path "SuiteSparse" -Recurse -Filter "*.h"
        
        foreach ($header in $headerFiles) {
          $destPath = "C:/SuiteSparseUnified/include/suitesparse/$($header.Name)"
          Copy-Item $header.FullName -Destination $destPath -Force
          Write-Host "Copied: $($header.Name)"
        }
        
        # Also copy config header if it exists separately
        if (Test-Path "SuiteSparse/SuiteSparse_config/SuiteSparse_config.h") {
          Copy-Item "SuiteSparse/SuiteSparse_config/SuiteSparse_config.h" -Destination "C:/SuiteSparseUnified/include/suitesparse/" -Force
        }
        
        # Copy libraries from binaries directory
        Write-Host "Copying SuiteSparse libraries..."
        
        # Try to find the binaries
        $binDirs = @("binaries/x64/lib", "binaries/x64", "lib", "build/install/lib")
        
        foreach ($dir in $binDirs) {
          if (Test-Path $dir) {
            # Copy .lib files
            Get-ChildItem -Path $dir -Filter "*.lib" | ForEach-Object {
              Copy-Item $_.FullName -Destination "C:/SuiteSparseUnified/lib/" -Force
              Write-Host "Copied library: $($_.Name)"
            }
            
            # Also copy .dll files for runtime
            Get-ChildItem -Path $dir -Filter "*.dll" | ForEach-Object {
              Copy-Item $_.FullName -Destination "C:/SuiteSparseUnified/lib/" -Force
              Write-Host "Copied DLL: $($_.Name)"
            }
            break
          }
        }
        
        # List what we collected
        Write-Host "Collected headers:"
        Get-ChildItem "C:/SuiteSparseUnified/include/suitesparse" | Select-Object -First 10 Name
        
        Write-Host "Collected libraries:"
        Get-ChildItem "C:/SuiteSparseUnified/lib" | Select-Object -First 10 Name
        
        # Set environment variables
        echo "SUITESPARSE_INCLUDE_DIR=C:/SuiteSparseUnified/include/suitesparse" >> $env:GITHUB_ENV
        echo "SUITESPARSE_LIBRARY_DIR=C:/SuiteSparseUnified/lib" >> $env:GITHUB_ENV
        
    - name: Install FLTK via vcpkg
      shell: powershell
      run: |
        git clone https://github.com/microsoft/vcpkg
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg install fltk:x64-windows
        
        $fltkDir = "$pwd\vcpkg\installed\x64-windows"
        echo "FLTK_DIR=$fltkDir" >> $env:GITHUB_ENV
        
    - name: Configure BFF
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "build"
        Set-Location build
        
        # Configure with the unified SuiteSparse directory
        cmake .. `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
          -DCMAKE_INSTALL_PREFIX="$pwd/install" `
          -DSUITESPARSE_INCLUDE_DIR="${{ env.SUITESPARSE_INCLUDE_DIR }}" `
          -DSUITESPARSE_LIBRARY_DIR="${{ env.SUITESPARSE_LIBRARY_DIR }}" `
          -DENABLE_BFF_CLI=ON `
          -DENABLE_BFF_GUI=ON `
          -DFLTK_DIR="${{ env.FLTK_DIR }}/share/fltk"
        
        Write-Host "CMake configuration complete"
        
    - name: Build BFF
      shell: powershell
      run: |
        Set-Location build
        cmake --build . --config ${{ env.BUILD_TYPE }} --target install -- /m
        
        # Check for built executables
        if (Test-Path "install/bin/*.exe") {
          Write-Host "SUCCESS: BFF executables built"
          Get-ChildItem "install/bin/*.exe" | ForEach-Object { Write-Host "  - $($_.Name)" }
        } else {
          Write-Host "Looking for executables in build tree..."
          Get-ChildItem . -Recurse -Filter "*.exe" | ForEach-Object { Write-Host "Found: $($_.FullName)" }
        }
        
    - name: Create Distribution Package
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "dist"
        
        # Copy BFF executables
        if (Test-Path "build/install/bin/*.exe") {
          Copy-Item "build/install/bin/*.exe" -Destination "dist/" -Force
          Write-Host "Copied BFF executables"
        }
        
        # Copy SuiteSparse DLLs
        if (Test-Path "C:/SuiteSparseUnified/lib/*.dll") {
          Copy-Item "C:/SuiteSparseUnified/lib/*.dll" -Destination "dist/" -Force
          Write-Host "Copied SuiteSparse DLLs"
        }
        
        # Create README
        $readme = @()
        $readme += "BFF Windows Build"
        $readme += "================"
        $readme += ""
        $readme += "Built with SuiteSparse from: https://github.com/royeiror/suitesparse-metis-for-windows"
        $readme += ""
        $readme += "Run bff-gui.exe for graphical interface"
        $readme += "Run bff.exe for command line"
        
        $readme | Out-File -FilePath "dist/README.txt"
        
        Compress-Archive -Path "dist/*" -DestinationPath "bff-windows.zip" -Force
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bff-windows-binary
        path: bff-windows.zip
        retention-days: 30
