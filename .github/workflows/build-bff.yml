name: Build BFF Windows Binary

on:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Debug - Show environment
      shell: powershell
      run: |
        Write-Host "Starting BFF Build"
        Write-Host "Runner: $env:RUNNER_OS"
        
    - name: Checkout BFF source code
      uses: actions/checkout@v4
      with:
        repository: 'GeometryCollective/boundary-first-flattening'
        ref: 'v1.6'
        
    - name: Show repository structure
      shell: powershell
      run: |
        Write-Host "Repository Structure:"
        Get-ChildItem | Select-Object Name, Length | Format-Table
        
    - name: Fix CMakeLists.txt
      shell: powershell
      run: |
        if (Test-Path CMakeLists.txt) {
          $content = Get-Content CMakeLists.txt -Raw
          $fixed = $content -replace 'cmake_minimum_required\s*\(.*\)', 'cmake_minimum_required(VERSION 3.10)'
          Set-Content CMakeLists.txt -Value $fixed -NoNewline
          Write-Host "Fixed CMakeLists.txt"
        }
        
    - name: Install vcpkg and dependencies
      shell: powershell
      run: |
        # Install vcpkg
        git clone https://github.com/microsoft/vcpkg
        .\vcpkg\bootstrap-vcpkg.bat
        
        # Install dependencies
        .\vcpkg\vcpkg install suitesparse:x64-windows
        .\vcpkg\vcpkg install fltk:x64-windows
        .\vcpkg\vcpkg install openblas:x64-windows
        
        # Set toolchain
        $toolchain = "$pwd\vcpkg\scripts\buildsystems\vcpkg.cmake"
        echo "VCPKG_TOOLCHAIN=$toolchain" >> $env:GITHUB_ENV
        
    - name: Configure BFF
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "build"
        Set-Location build
        
        cmake .. `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
          -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_TOOLCHAIN }}" `
          -DVCPKG_TARGET_TRIPLET=x64-windows `
          -DENABLE_BFF_CLI=ON `
          -DENABLE_BFF_GUI=ON
        
        Write-Host "CMake configuration done"
        
    - name: Build BFF
      shell: powershell
      run: |
        Set-Location build
        cmake --build . --config ${{ env.BUILD_TYPE }}
        
    - name: Create Artifact
      if: always()
      shell: powershell
      run: |
        # Create output directory
        New-Item -ItemType Directory -Force -Path "output"
        
        # Copy any executables
        $exes = Get-ChildItem -Path "." -Recurse -Filter "*.exe"
        if ($exes) {
          foreach ($exe in $exes) {
            Write-Host "Copying: $($exe.Name)"
            Copy-Item $exe.FullName -Destination "output\" -Force
          }
        } else {
          Write-Host "No executables found"
          "Build attempted but no executables were produced" | Out-File "output\BUILD_LOG.txt"
        }
        
        # Create README using simple string concatenation
        $readmeContent = "BFF Windows Build Attempt`r`n"
        $readmeContent += "=========================`r`n`r`n"
        $readmeContent += "This is an attempted build of BFF v1.6 for Windows.`r`n`r`n"
        $readmeContent += "If executables are present, they should be in this folder.`r`n"
        $readmeContent += "Otherwise, check the build logs for errors.`r`n"
        
        Set-Content -Path "output\README.txt" -Value $readmeContent
        
        # Create zip
        Compress-Archive -Path "output\*" -DestinationPath "bff-build-attempt.zip" -Force
        
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bff-windows-build
        path: bff-build-attempt.zip
        retention-days: 1
