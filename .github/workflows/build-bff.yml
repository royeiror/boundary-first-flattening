name: Build BFF Windows Binary

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

env:
  BUILD_TYPE: Release
  SUITESPARSE_VERSION: '7.6.1'
  FLTK_VERSION: '1.3.9'

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout BFF source code
      uses: actions/checkout@v4
      with:
        repository: 'GeometryCollective/boundary-first-flattening'
        ref: 'v1.6'
        submodules: 'recursive'

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install CMake
      uses: lukka/get-cmake@latest

    - name: Download and extract SuiteSparse
      shell: cmd
      run: |
        curl -L -o suitesparse.zip https://github.com/royeiror/suitesparse-metis-for-windows/releases/download/v7.6.1/suitesparse-metis-v7.6.1-windows-x64.zip
        7z x suitesparse.zip -o"C:\suitesparse" -y
        echo "SUITESPARSE_ROOT=C:\suitesparse" >> "%GITHUB_ENV%"

    - name: Build FLTK
      shell: cmd
      run: |
        # Download FLTK source
        curl -L -o fltk-${{ env.FLTK_VERSION }}-source.tar.gz https://github.com/fltk/fltk/archive/refs/tags/release-${{ env.FLTK_VERSION }}.tar.gz
        7z x fltk-${{ env.FLTK_VERSION }}-source.tar.gz
        7z x fltk-${{ env.FLTK_VERSION }}-source.tar
        
        # Create build directory
        mkdir fltk-build
        cd fltk-build
        
        # Configure FLTK
        cmake ..\fltk-release-${{ env.FLTK_VERSION }} ^
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} ^
          -DCMAKE_INSTALL_PREFIX=C:\fltk ^
          -DOPTION_BUILD_SHARED_LIBS=OFF ^
          -DOPTION_USE_SYSTEM_LIBJPEG=OFF ^
          -DOPTION_USE_SYSTEM_LIBPNG=OFF ^
          -DOPTION_USE_SYSTEM_ZLIB=OFF
        
        # Build and install FLTK
        cmake --build . --config ${{ env.BUILD_TYPE }} --target install -- -m

    - name: Configure BFF with CMake
      shell: cmd
      run: |
        mkdir build
        cd build
        
        cmake .. ^
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} ^
          -DCMAKE_PREFIX_PATH="C:\fltk;C:\suitesparse" ^
          -DSUITESPARSE_INCLUDE_DIR_HINTS="C:\suitesparse\include\suitesparse" ^
          -DSUITESPARSE_LIBRARY_DIR_HINTS="C:\suitesparse\lib" ^
          -DFLTK_DIR="C:\fltk\lib\cmake\fltk" ^
          -DENABLE_BFF_CLI=ON ^
          -DENABLE_BFF_GUI=ON

    - name: Build BFF
      shell: cmd
      run: |
        cd build
        cmake --build . --config ${{ env.BUILD_TYPE }} -- -m

    - name: Collect DLL dependencies
      shell: cmd
      run: |
        # Create distribution directory
        mkdir dist
        
        # Copy the main executables
        copy build\bff-gui\Release\bff-gui.exe dist\
        copy build\bff-cli\Release\bff.exe dist\
        
        # Copy SuiteSparse DLLs
        copy "C:\suitesparse\bin\*.dll" dist\
        
        # Copy FLTK DLLs
        copy "C:\fltk\bin\*.dll" dist\
        
        # Copy Visual C++ runtime DLLs if needed
        # (These might already be installed on target systems)
        echo "Checking for required runtime DLLs..."

    - name: Test if binaries run
      shell: cmd
      run: |
        cd dist
        .\bff-gui.exe --version || echo "GUI version check failed, continuing..."
        .\bff.exe --version || echo "CLI version check failed"

    - name: Create ZIP archive
      uses: thedoctor0/zip-release@master
      with:
        type: 'zip'
        filename: 'bff-windows-x64-v1.6.zip'
        directory: 'dist/'
        path: 'dist/*'

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: bff-windows-binary
        path: |
          bff-windows-x64-v1.6.zip
          dist/bff-gui.exe
          dist/bff.exe
        retention-days: 30
