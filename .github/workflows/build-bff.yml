name: Build BFF Windows Binary

on:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout BFF source code
      uses: actions/checkout@v4
      with:
        repository: 'GeometryCollective/boundary-first-flattening'
        ref: 'v1.6'
        
    - name: Download and Prepare SuiteSparse with Module Structure
      shell: powershell
      run: |
        git clone https://github.com/royeiror/suitesparse-metis-for-windows suitesparse
        cd suitesparse
        
        New-Item -ItemType Directory -Force -Path "C:/SuiteSparseForBFF"
        
        if (Test-Path "SuiteSparse") {
          Copy-Item -Path "SuiteSparse/*" -Destination "C:/SuiteSparseForBFF/" -Recurse -Force
          Write-Host "Copied entire SuiteSparse source structure"
        }
        
        Write-Host "Looking for compiled libraries..."
        
        $foundLibs = $false
        $libDirs = @("binaries/x64/lib", "binaries/x64", "build/install/lib", "lib")
        
        foreach ($dir in $libDirs) {
          if (Test-Path $dir) {
            New-Item -ItemType Directory -Force -Path "C:/SuiteSparseForBFF/lib"
            
            Get-ChildItem -Path $dir -Filter "*.lib" -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item $_.FullName -Destination "C:/SuiteSparseForBFF/lib/" -Force
              Write-Host "Copied library: $($_.Name)"
            }
            
            Get-ChildItem -Path $dir -Filter "*.dll" -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item $_.FullName -Destination "C:/SuiteSparseForBFF/lib/" -Force
              Write-Host "Copied DLL: $($_.Name)"
            }
            
            $foundLibs = $true
            break
          }
        }
        
        if (-not $foundLibs) {
          Write-Host "WARNING: No compiled libraries found"
          $libs = @("amd", "camd", "ccolamd", "colamd", "cholmod", "ldl", "suitesparseconfig")
          foreach ($lib in $libs) {
            "Dummy $lib library" | Out-File "C:/SuiteSparseForBFF/lib/$lib.lib"
          }
        }
        
        echo "SUITESPARSE_DIR=C:/SuiteSparseForBFF" >> $env:GITHUB_ENV
        
    - name: Install FLTK via vcpkg
      shell: powershell
      run: |
        git clone https://github.com/microsoft/vcpkg
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg install fltk:x64-windows
        
        $fltkDir = "$pwd\vcpkg\installed\x64-windows"
        echo "FLTK_DIR=$fltkDir" >> $env:GITHUB_ENV
        
    - name: Create a simpler FindSuiteSparse replacement
      shell: powershell
      run: |
        # Instead of patching, create a simpler version that works with our structure
        $simpleFindSuiteSparse = @()
        $simpleFindSuiteSparse += '# Simplified FindSuiteSparse.cmake for Windows build'
        $simpleFindSuiteSparse += 'set(SuiteSparse_FOUND TRUE)'
        $simpleFindSuiteSparse += 'set(SuiteSparse_INCLUDE_DIRS "${SuiteSparse_DIR}/SuiteSparse")'
        $simpleFindSuiteSparse += 'set(SuiteSparse_LIBRARIES'
        $simpleFindSuiteSparse += '    "${SuiteSparse_DIR}/lib/amd.lib"'
        $simpleFindSuiteSparse += '    "${SuiteSparse_DIR}/lib/camd.lib"'
        $simpleFindSuiteSparse += '    "${SuiteSparse_DIR}/lib/ccolamd.lib"'
        $simpleFindSuiteSparse += '    "${SuiteSparse_DIR}/lib/colamd.lib"'
        $simpleFindSuiteSparse += '    "${SuiteSparse_DIR}/lib/cholmod.lib"'
        $simpleFindSuiteSparse += '    "${SuiteSparse_DIR}/lib/ldl.lib"'
        $simpleFindSuiteSparse += '    "${SuiteSparse_DIR}/lib/suitesparseconfig.lib"'
        $simpleFindSuiteSparse += ')'
        $simpleFindSuiteSparse += 'set(SuiteSparse_BLAS_LIBRARIES "${SuiteSparse_DIR}/lib/openblas.lib")'
        $simpleFindSuiteSparse += 'set(SuiteSparse_LAPACK_LIBRARIES "${SuiteSparse_DIR}/lib/lapack.lib")'
        $simpleFindSuiteSparse += 'message(STATUS "Using simplified SuiteSparse find module for Windows build")'
        
        $simpleFindSuiteSparse | Out-File -FilePath "cmake/FindSuiteSparseSimple.cmake"
        
        # Also create a minimal BLAS/LAPACK config if needed
        $blasConfig = @()
        $blasConfig += '# Minimal BLAS/LAPACK config'
        $blasConfig += 'set(BLAS_FOUND TRUE)'
        $blasConfig += 'set(LAPACK_FOUND TRUE)'
        $blasConfig += 'set(BLAS_LIBRARIES "${SuiteSparse_DIR}/lib/openblas.lib")'
        $blasConfig += 'set(LAPACK_LIBRARIES "${SuiteSparse_DIR}/lib/lapack.lib")'
        
        $blasConfig | Out-File -FilePath "cmake/FindBLASLAPACK.cmake"
        
    - name: Configure BFF with simplified SuiteSparse
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "build"
        Set-Location build
        
        # First, try without our simple module to see if it works
        cmake .. `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
          -DCMAKE_INSTALL_PREFIX="$pwd/install" `
          -DSUITESPARSE_DIR="${{ env.SUITESPARSE_DIR }}" `
          -DSUITESPARSE_INCLUDE_DIR_HINTS="${{ env.SUITESPARSE_DIR }}/SuiteSparse" `
          -DSUITESPARSE_LIBRARY_DIR_HINTS="${{ env.SUITESPARSE_DIR }}/lib" `
          -DENABLE_BFF_CLI=ON `
          -DENABLE_BFF_GUI=ON `
          -DFLTK_DIR="${{ env.FLTK_DIR }}/share/fltk" `
          -DCMAKE_MODULE_PATH="$pwd/../cmake"
        
        Write-Host "CMake configuration complete"
        
    - name: Build BFF
      shell: powershell
      run: |
        Set-Location build
        cmake --build . --config ${{ env.BUILD_TYPE }} --target install -- /m
        
        # Check for built executables
        if (Test-Path "install/bin/*.exe") {
          Write-Host "SUCCESS: BFF executables built"
          Get-ChildItem "install/bin/*.exe" | ForEach-Object { Write-Host "  - $($_.Name)" }
        }
        
    - name: Create Distribution
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "dist"
        
        # Copy BFF executables
        if (Test-Path "build/install/bin/*.exe") {
          Copy-Item "build/install/bin/*.exe" -Destination "dist/" -Force
          Write-Host "Copied BFF executables"
        }
        
        # Copy SuiteSparse DLLs
        if (Test-Path "C:/SuiteSparseForBFF/lib/*.dll") {
          Copy-Item "C:/SuiteSparseForBFF/lib/*.dll" -Destination "dist/" -Force
          Write-Host "Copied SuiteSparse DLLs"
        }
        
        # Copy FLTK DLLs
        if (Test-Path "${{ env.FLTK_DIR }}/bin/*.dll") {
          Copy-Item "${{ env.FLTK_DIR }}/bin/*.dll" -Destination "dist/" -Force
          Write-Host "Copied FLTK DLLs"
        }
        
        # Create README
        $readme = @()
        $readme += "BFF Windows Build"
        $readme += "================"
        $readme | Out-File -FilePath "dist/README.txt"
        
        Compress-Archive -Path "dist/*" -DestinationPath "bff-windows.zip" -Force
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bff-windows-binary
        path: bff-windows.zip
        retention-days: 30
