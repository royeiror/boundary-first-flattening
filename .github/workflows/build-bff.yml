name: Build BFF Windows Binary

on:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout BFF source code
      uses: actions/checkout@v4
      with:
        repository: 'GeometryCollective/boundary-first-flattening'
        ref: 'v1.6'
        
    - name: Fix CMakeLists.txt
      shell: powershell
      run: |
        (Get-Content CMakeLists.txt) -replace 'cmake_minimum_required\s*\(.*\)', 'cmake_minimum_required(VERSION 3.10)' | Set-Content CMakeLists.txt
        
    - name: Download your SuiteSparse binaries
      shell: powershell
      run: |
        # Since vcpkg isn't working, let's directly use your pre-built binaries
        # First, let's see what's actually in your repository
        $repoUrl = "https://github.com/royeiror/suitesparse-metis-for-windows"
        
        # Create SuiteSparse directory
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse"
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse\include"
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse\lib"
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse\bin"
        
        # Download the entire repo as zip to examine it
        Invoke-WebRequest -Uri "$repoUrl/archive/refs/heads/master.zip" -OutFile "suitesparse.zip"
        Expand-Archive -Path "suitesparse.zip" -DestinationPath "." -Force
        
        # Look for files
        Write-Host "Looking for SuiteSparse files..."
        Get-ChildItem -Path "." -Recurse -Filter "*.lib" | Select-Object -First 10 Name, Directory | Format-Table
        Get-ChildItem -Path "." -Recurse -Filter "*.h" | Select-Object -First 10 Name, Directory | Format-Table
        
        # Copy any found files
        Copy-Item -Path ".\suitesparse-metis-for-windows-master\*" -Destination "C:\SuiteSparse\" -Recurse -Force -ErrorAction SilentlyContinue
        
    - name: Install FLTK via vcpkg
      shell: powershell
      run: |
        # Only install FLTK via vcpkg
        git clone https://github.com/microsoft/vcpkg
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg install fltk:x64-windows
        
        $toolchain = "$pwd\vcpkg\scripts\buildsystems\vcpkg.cmake"
        echo "VCPKG_TOOLCHAIN=$toolchain" >> $env:GITHUB_ENV
        echo "FLTK_ROOT=$pwd\vcpkg\installed\x64-windows" >> $env:GITHUB_ENV
        
    - name: Create custom FindSuiteSparse.cmake
      shell: powershell
      run: |
        # Create a custom FindSuiteSparse.cmake that works with your binaries
        $cmakeContent = @()
        $cmakeContent += 'find_path(SuiteSparse_INCLUDE_DIR NAMES SuiteSparse_config.h PATHS "C:/SuiteSparse/include" "C:/SuiteSparse" NO_DEFAULT_PATH)'
        $cmakeContent += 'find_library(SuiteSparse_AMD_LIBRARY NAMES amd PATHS "C:/SuiteSparse/lib" "C:/SuiteSparse" NO_DEFAULT_PATH)'
        $cmakeContent += 'find_library(SuiteSparse_CAMD_LIBRARY NAMES camd PATHS "C:/SuiteSparse/lib" "C:/SuiteSparse" NO_DEFAULT_PATH)'
        $cmakeContent += 'find_library(SuiteSparse_CCOLAMD_LIBRARY NAMES ccolamd PATHS "C:/SuiteSparse/lib" "C:/SuiteSparse" NO_DEFAULT_PATH)'
        $cmakeContent += 'find_library(SuiteSparse_COLAMD_LIBRARY NAMES colamd PATHS "C:/SuiteSparse/lib" "C:/SuiteSparse" NO_DEFAULT_PATH)'
        $cmakeContent += 'find_library(SuiteSparse_CHOLMOD_LIBRARY NAMES cholmod PATHS "C:/SuiteSparse/lib" "C:/SuiteSparse" NO_DEFAULT_PATH)'
        $cmakeContent += 'find_library(SuiteSparse_LDL_LIBRARY NAMES ldl PATHS "C:/SuiteSparse/lib" "C:/SuiteSparse" NO_DEFAULT_PATH)'
        $cmakeContent += 'find_library(SuiteSparse_SUITESPARSECONFIG_LIBRARY NAMES suitesparseconfig PATHS "C:/SuiteSparse/lib" "C:/SuiteSparse" NO_DEFAULT_PATH)'
        $cmakeContent += ''
        $cmakeContent += 'set(SuiteSparse_FOUND TRUE)'
        $cmakeContent += 'set(SuiteSparse_INCLUDE_DIRS "${SuiteSparse_INCLUDE_DIR}")'
        $cmakeContent += 'set(SuiteSparse_LIBRARIES'
        $cmakeContent += '    ${SuiteSparse_AMD_LIBRARY}'
        $cmakeContent += '    ${SuiteSparse_CAMD_LIBRARY}'
        $cmakeContent += '    ${SuiteSparse_CCOLAMD_LIBRARY}'
        $cmakeContent += '    ${SuiteSparse_COLAMD_LIBRARY}'
        $cmakeContent += '    ${SuiteSparse_CHOLMOD_LIBRARY}'
        $cmakeContent += '    ${SuiteSparse_LDL_LIBRARY}'
        $cmakeContent += '    ${SuiteSparse_SUITESPARSECONFIG_LIBRARY}'
        $cmakeContent += ')'
        $cmakeContent += ''
        $cmakeContent += 'message(STATUS "SuiteSparse include dir: ${SuiteSparse_INCLUDE_DIR}")'
        $cmakeContent += 'message(STATUS "SuiteSparse libraries: ${SuiteSparse_LIBRARIES}")'
        
        $cmakeContent | Out-File -FilePath "cmake/FindSuiteSparseCustom.cmake"
        
    - name: Configure BFF with custom SuiteSparse
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "build"
        Set-Location build
        
        # Configure with custom SuiteSparse
        cmake .. `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
          -DCMAKE_MODULE_PATH="$pwd\..\cmake" `
          -DSUITESPARSE_ROOT="C:\SuiteSparse" `
          -DFLTK_DIR="${{ env.FLTK_ROOT }}\share\fltk" `
          -DENABLE_BFF_CLI=ON `
          -DENABLE_BFF_GUI=ON `
          -DCMAKE_INSTALL_PREFIX="$pwd\install"
        
        Write-Host "CMake configuration attempted"
        
    - name: Build BFF
      shell: powershell
      run: |
        Set-Location build
        
        # Try to build
        cmake --build . --config ${{ env.BUILD_TYPE }} --target install -- /m || Write-Host "Build may have issues"
        
        # Look for any executables
        Get-ChildItem . -Recurse -Filter "*.exe" | ForEach-Object {
          Write-Host "Found executable: $($_.FullName)"
          New-Item -ItemType Directory -Force -Path "install\bin" -ErrorAction SilentlyContinue
          Copy-Item $_.FullName -Destination "install\bin\" -Force
        }
        
    - name: Create distribution
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "dist"
        
        # Copy executables
        if (Test-Path "build\install\bin\*.exe") {
          Copy-Item "build\install\bin\*.exe" -Destination "dist\" -Force
          Write-Host "Copied executables"
        }
        
        # Copy SuiteSparse DLLs
        if (Test-Path "C:\SuiteSparse\bin\*.dll") {
          Copy-Item "C:\SuiteSparse\bin\*.dll" -Destination "dist\" -Force
          Write-Host "Copied SuiteSparse DLLs"
        }
        
        # Copy FLTK DLLs
        if (Test-Path "${{ env.FLTK_ROOT }}\bin\*.dll") {
          Copy-Item "${{ env.FLTK_ROOT }}\bin\*.dll" -Destination "dist\" -Force
          Write-Host "Copied FLTK DLLs"
        }
        
        # Create README
        $readme = "BFF Windows Build`r`n"
        $readme += "===============`r`n`r`n"
        $readme += "Built with custom SuiteSparse binaries.`r`n"
        
        Set-Content -Path "dist\README.txt" -Value $readme
        
        Compress-Archive -Path "dist\*" -DestinationPath "bff-windows.zip" -Force
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: bff-windows-binary
        path: bff-windows.zip
        retention-days: 30
