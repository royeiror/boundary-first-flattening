name: Build BFF Windows Binary

on:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout BFF source code
      uses: actions/checkout@v4
      with:
        repository: 'GeometryCollective/boundary-first-flattening'
        ref: 'v1.6'
        
    - name: Fix CMakeLists.txt
      shell: powershell
      run: |
        (Get-Content CMakeLists.txt) -replace 'cmake_minimum_required\s*\(.*\)', 'cmake_minimum_required(VERSION 3.10)' | Set-Content CMakeLists.txt
        
    - name: Create simple FindSuiteSparse override
      shell: powershell
      run: |
        # Create a simple FindSuiteSparse.cmake that works with vcpkg
        $overrideLines = @()
        $overrideLines += 'set(SuiteSparse_FOUND TRUE)'
        $overrideLines += 'set(SuiteSparse_INCLUDE_DIRS "$ENV{VCPKG_INSTALLED_DIR}/x64-windows/include")'
        $overrideLines += 'set(SuiteSparse_LIBRARIES'
        $overrideLines += '    "$ENV{VCPKG_INSTALLED_DIR}/x64-windows/lib/amd.lib"'
        $overrideLines += '    "$ENV{VCPKG_INSTALLED_DIR}/x64-windows/lib/camd.lib"'
        $overrideLines += '    "$ENV{VCPKG_INSTALLED_DIR}/x64-windows/lib/ccolamd.lib"'
        $overrideLines += '    "$ENV{VCPKG_INSTALLED_DIR}/x64-windows/lib/colamd.lib"'
        $overrideLines += '    "$ENV{VCPKG_INSTALLED_DIR}/x64-windows/lib/cholmod.lib"'
        $overrideLines += '    "$ENV{VCPKG_INSTALLED_DIR}/x64-windows/lib/ldl.lib"'
        $overrideLines += '    "$ENV{VCPKG_INSTALLED_DIR}/x64-windows/lib/suitesparseconfig.lib"'
        $overrideLines += ')'
        $overrideLines += 'set(SuiteSparse_BLAS_LIBRARIES "$ENV{VCPKG_INSTALLED_DIR}/x64-windows/lib/openblas.lib")'
        $overrideLines += 'set(SuiteSparse_LAPACK_LIBRARIES "$ENV{VCPKG_INSTALLED_DIR}/x64-windows/lib/lapack.lib")'
        $overrideLines += 'message(STATUS "Using simplified SuiteSparse find module")'
        
        $overrideLines | Out-File -FilePath "FindSuiteSparseSimple.cmake"
        
    - name: Install vcpkg with all features
      shell: powershell
      run: |
        git clone https://github.com/microsoft/vcpkg
        .\vcpkg\bootstrap-vcpkg.bat
        
        echo "VCPKG_INSTALLED_DIR=$pwd\vcpkg\installed" >> $env:GITHUB_ENV
        
        .\vcpkg\vcpkg install suitesparse[metis,openblas]:x64-windows
        .\vcpkg\vcpkg install fltk:x64-windows
        
        $toolchain = "$pwd\vcpkg\scripts\buildsystems\vcpkg.cmake"
        echo "VCPKG_TOOLCHAIN=$toolchain" >> $env:GITHUB_ENV
        
    - name: Manually download SuiteSparse headers
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "$env:VCPKG_INSTALLED_DIR\x64-windows\include\suitesparse"
        
        $headers = @("amd.h", "camd.h", "ccolamd.h", "colamd.h", "cholmod.h", "cholmod_core.h", "ldl.h", "SuiteSparse_config.h")
        
        $baseUrl = "https://raw.githubusercontent.com/DrTimothyAldenDavis/SuiteSparse/master/SuiteSparse"
        
        foreach ($header in $headers) {
          $component = $header.Replace(".h", "")
          $url = "$baseUrl/$component/Include/$header"
          try {
            Invoke-WebRequest -Uri $url -OutFile "$env:VCPKG_INSTALLED_DIR\x64-windows\include\suitesparse\$header"
            Write-Host "Downloaded $header"
          } catch {
            Write-Host "Could not download $header, creating minimal version"
            "#pragma once`ntypedef int SuiteSparse_long;" | Out-File "$env:VCPKG_INSTALLED_DIR\x64-windows\include\suitesparse\$header"
          }
        }
        
    - name: Configure BFF with manual settings
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "build"
        Set-Location build
        
        cmake .. `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
          -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_TOOLCHAIN }}" `
          -DCMAKE_INSTALL_PREFIX="$pwd\install" `
          -DSUITESPARSE_INCLUDE_DIR="$env:VCPKG_INSTALLED_DIR\x64-windows\include\suitesparse" `
          -DSUITESPARSE_LIBRARY_DIR="$env:VCPKG_INSTALLED_DIR\x64-windows\lib" `
          -DSUITESPARSE_BLAS_LIBRARY="$env:VCPKG_INSTALLED_DIR\x64-windows\lib\openblas.lib" `
          -DSUITESPARSE_LAPACK_LIBRARY="$env:VCPKG_INSTALLED_DIR\x64-windows\lib\lapack.lib" `
          -DENABLE_BFF_CLI=ON `
          -DENABLE_BFF_GUI=ON `
          -DVCPKG_TARGET_TRIPLET=x64-windows
        
        Write-Host "CMake configuration completed"
        
    - name: Build BFF
      shell: powershell
      run: |
        Set-Location build
        cmake --build . --config ${{ env.BUILD_TYPE }} --target install -- /m
        
    - name: Create distribution
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "dist"
        
        if (Test-Path "build\install\bin\*.exe") {
          Copy-Item "build\install\bin\*.exe" -Destination "dist\" -Force
          Write-Host "Copied executables"
        }
        
        if (Test-Path "$env:VCPKG_INSTALLED_DIR\x64-windows\bin\*.dll") {
          Copy-Item "$env:VCPKG_INSTALLED_DIR\x64-windows\bin\*.dll" -Destination "dist\" -Force
          Write-Host "Copied DLLs"
        }
        
        $readme = "BFF Windows Build`r`n"
        $readme += "===============`r`n`r`n"
        $readme += "Built using vcpkg dependencies.`r`n"
        $readme += "Run bff-gui.exe for the graphical interface.`r`n"
        $readme += "Run bff.exe for command line usage.`r`n"
        
        Set-Content -Path "dist\README.txt" -Value $readme
        
        Compress-Archive -Path "dist\*" -DestinationPath "bff-windows-v1.6.zip" -Force
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: bff-windows-binary
        path: bff-windows-v1.6.zip
        retention-days: 30
