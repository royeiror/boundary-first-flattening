name: Build BFF Windows Binary

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

env:
  BUILD_TYPE: Release
  FLTK_VERSION: '1.3.9'

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout BFF source code
      uses: actions/checkout@v4
      with:
        repository: 'GeometryCollective/boundary-first-flattening'
        ref: 'v1.6'
        submodules: 'recursive'

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install CMake
      uses: lukka/get-cmake@latest

    - name: Download and extract SuiteSparse
      shell: cmd
      run: |
        # Download SuiteSparse from the correct URL
        curl -L -o suitesparse.zip https://github.com/royeiror/suitesparse-metis-for-windows/releases/download/7.6.1/suitesparse-metis-v7.6.1-windows-x64.zip
        
        # Check if download succeeded
        if not exist suitesparse.zip (
          echo "Failed to download suitesparse.zip"
          exit 1
        )
        
        # Extract to C:\suitesparse
        mkdir C:\suitesparse
        7z x suitesparse.zip -o"C:\suitesparse" -y
        
        # Set environment variable
        echo "SUITESPARSE_ROOT=C:\suitesparse" >> "%GITHUB_ENV%"

    - name: Build FLTK
      shell: cmd
      run: |
        # Download FLTK source
        curl -L -o fltk-${{ env.FLTK_VERSION }}-source.tar.gz https://github.com/fltk/fltk/archive/refs/tags/release-${{ env.FLTK_VERSION }}.tar.gz
        7z x fltk-${{ env.FLTK_VERSION }}-source.tar.gz
        7z x fltk-${{ env.FLTK_VERSION }}-source.tar
        
        # Create build directory
        mkdir fltk-build
        cd fltk-build
        
        # Configure FLTK
        cmake ..\fltk-release-${{ env.FLTK_VERSION }} ^
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} ^
          -DCMAKE_INSTALL_PREFIX=C:\fltk ^
          -DOPTION_BUILD_SHARED_LIBS=OFF ^
          -DOPTION_USE_SYSTEM_LIBJPEG=OFF ^
          -DOPTION_USE_SYSTEM_LIBPNG=OFF ^
          -DOPTION_USE_SYSTEM_ZLIB=OFF
        
        # Build and install FLTK
        cmake --build . --config ${{ env.BUILD_TYPE }} --target install -- -m

    - name: Configure BFF with CMake
      shell: cmd
      run: |
        mkdir build
        cd build
        
        # Configure BFF with correct paths
        cmake .. ^
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} ^
          -DCMAKE_PREFIX_PATH="C:\fltk;C:\suitesparse" ^
          -DSUITESPARSE_INCLUDE_DIR_HINTS="C:\suitesparse\include\suitesparse" ^
          -DSUITESPARSE_LIBRARY_DIR_HINTS="C:\suitesparse\lib" ^
          -DFLTK_DIR="C:\fltk\lib\cmake\fltk" ^
          -DENABLE_BFF_CLI=ON ^
          -DENABLE_BFF_GUI=ON ^
          -DCMAKE_INSTALL_PREFIX="%CD%\install"

    - name: Build BFF
      shell: cmd
      run: |
        cd build
        cmake --build . --config ${{ env.BUILD_TYPE }} --target install -- -m

    - name: Create standalone package
      shell: cmd
      run: |
        mkdir bff-dist
        mkdir bff-dist\bin
        
        # Copy executables
        copy build\install\bin\*.exe bff-dist\bin\
        
        # Copy SuiteSparse DLLs
        copy C:\suitesparse\bin\*.dll bff-dist\bin\
        
        # Copy any FLTK DLLs (if built as shared)
        if exist C:\fltk\bin\*.dll (
          copy C:\fltk\bin\*.dll bff-dist\bin\
        )
        
        # Copy runtime dependencies
        powershell -Command "& {Get-ChildItem bff-dist\bin\*.exe | ForEach-Object {dumpbin /DEPENDENTS $_.FullName | Select-String '.dll'}}"

    - name: Test executables
      shell: cmd
      run: |
        cd bff-dist\bin
        .\bff-gui.exe --help || echo "bff-gui help command executed"
        .\bff.exe --help || echo "bff help command executed"

    - name: Create ZIP archive
      uses: thedoctor0/zip-release@master
      with:
        type: 'zip'
        filename: 'bff-windows-x64-v1.6.zip'
        directory: 'bff-dist/'
        path: 'bff-dist/**/*'

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: bff-windows-binary
        path: bff-windows-x64-v1.6.zip
        retention-days: 30
