name: Build BFF Windows Binary

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

env:
  BUILD_TYPE: Release
  FLTK_VERSION: '1.3.9'

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout BFF source code
      uses: actions/checkout@v4
      with:
        repository: 'GeometryCollective/boundary-first-flattening'
        ref: 'v1.6'
        submodules: 'recursive'

    - name: Display CMakeLists.txt for debugging
      shell: powershell
      run: |
        Write-Host "=== CMakeLists.txt content (first 10 lines) ==="
        Get-Content CMakeLists.txt | Select-Object -First 10
        Write-Host "=============================================="

    - name: Fix CMakeLists.txt
      shell: powershell
      run: |
        # Read the file and fix the cmake_minimum_required line
        $content = Get-Content CMakeLists.txt -Raw
        
        # Check what the actual line looks like
        Write-Host "Original first line:"
        $firstLine = $content -split "`n" | Select-Object -First 1
        Write-Host "'$firstLine'"
        
        # Replace any cmake_minimum_required line with version < 3.5
        if ($content -match 'cmake_minimum_required\s*\(\s*VERSION\s*([0-9]+\.[0-9]+)') {
          $version = $matches[1]
          Write-Host "Found cmake_minimum_required VERSION $version"
          
          if ([version]$version -lt [version]"3.5") {
            $newContent = $content -replace 'cmake_minimum_required\s*\(\s*VERSION\s*[0-9]+\.[0-9]+\s*\)', 'cmake_minimum_required(VERSION 3.5)'
            Set-Content CMakeLists.txt -Value $newContent -NoNewline
            Write-Host "Updated cmake_minimum_required to 3.5"
          } else {
            Write-Host "Version $version is already >= 3.5"
          }
        } else {
          Write-Host "No cmake_minimum_required found, adding it"
          $newContent = "cmake_minimum_required(VERSION 3.5)`n`n" + $content
          Set-Content CMakeLists.txt -Value $newContent -NoNewline
        }
        
        # Display the fixed content
        Write-Host "=== Fixed CMakeLists.txt (first 5 lines) ==="
        Get-Content CMakeLists.txt | Select-Object -First 5

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install CMake
      uses: lukka/get-cmake@latest

    - name: Download SuiteSparse binaries
      shell: powershell
      run: |
        # Since individual file downloads might fail, download the entire repo as ZIP
        Write-Host "Downloading SuiteSparse binaries repository..."
        Invoke-WebRequest -Uri "https://github.com/royeiror/suitesparse-metis-for-windows/archive/refs/heads/master.zip" -OutFile "suitesparse.zip"
        
        # Extract
        Expand-Archive -Path "suitesparse.zip" -DestinationPath "." -Force
        
        # Look for binaries in the extracted structure
        $possiblePaths = @(
          "suitesparse-metis-for-windows-master/binaries/x64",
          "suitesparse-metis-for-windows-master/binaries",
          "suitesparse-metis-for-windows-master/x64"
        )
        
        $foundPath = $null
        foreach ($path in $possiblePaths) {
          if (Test-Path $path) {
            $foundPath = $path
            Write-Host "Found binaries at: $path"
            break
          }
        }
        
        if ($foundPath) {
          # Create SuiteSparse directory structure
          New-Item -ItemType Directory -Force -Path "C:\suitesparse\include\suitesparse"
          New-Item -ItemType Directory -Force -Path "C:\suitesparse\lib"
          New-Item -ItemType Directory -Force -Path "C:\suitesparse\bin"
          
          # Copy files
          if (Test-Path "$foundPath\include") {
            Copy-Item "$foundPath\include\*" -Destination "C:\suitesparse\include\suitesparse\" -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path "$foundPath\lib") {
            Copy-Item "$foundPath\lib\*" -Destination "C:\suitesparse\lib\" -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path "$foundPath\bin") {
            Copy-Item "$foundPath\bin\*" -Destination "C:\suitesparse\bin\" -Recurse -Force -ErrorAction SilentlyContinue
          }
          
          Write-Host "Copied SuiteSparse files from $foundPath"
        } else {
          Write-Host "Warning: Could not find SuiteSparse binaries in expected locations"
          # Create minimal structure anyway
          New-Item -ItemType Directory -Force -Path "C:\suitesparse\include\suitesparse"
          New-Item -ItemType Directory -Force -Path "C:\suitesparse\lib"
          New-Item -ItemType Directory -Force -Path "C:\suitesparse\bin"
        }
        
        # List what we have
        Write-Host "SuiteSparse directory contents:"
        Get-ChildItem "C:\suitesparse" -Recurse | Select-Object Name, Length | Format-Table -AutoSize

    - name: Build FLTK
      shell: powershell
      run: |
        # Download FLTK source
        $fltkUrl = "https://github.com/fltk/fltk/archive/refs/tags/release-${{ env.FLTK_VERSION }}.tar.gz"
        Invoke-WebRequest -Uri $fltkUrl -OutFile "fltk-source.tar.gz"
        
        # Extract using tar
        tar -xzf fltk-source.tar.gz
        
        # Create build directory
        New-Item -ItemType Directory -Force -Path "fltk-build"
        Set-Location fltk-build
        
        # Configure FLTK
        cmake ../fltk-release-${{ env.FLTK_VERSION }} `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
          -DCMAKE_INSTALL_PREFIX="C:\fltk" `
          -DOPTION_BUILD_SHARED_LIBS=OFF `
          -DOPTION_USE_SYSTEM_LIBJPEG=OFF `
          -DOPTION_USE_SYSTEM_LIBPNG=OFF `
          -DOPTION_USE_SYSTEM_ZLIB=OFF `
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL
        
        # Build and install FLTK
        cmake --build . --config ${{ env.BUILD_TYPE }} --target install -- /m

    - name: Configure BFF with CMake (with policy override)
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "build"
        Set-Location build
        
        # Configure BFF with explicit policy version
        cmake .. `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
          -DCMAKE_PREFIX_PATH="C:\fltk;C:\suitesparse" `
          -DSUITESPARSE_INCLUDE_DIR_HINTS="C:\suitesparse\include\suitesparse" `
          -DSUITESPARSE_LIBRARY_DIR_HINTS="C:\suitesparse\lib" `
          -DFLTK_DIR="C:\fltk\lib\cmake\fltk" `
          -DENABLE_BFF_CLI=ON `
          -DENABLE_BFF_GUI=ON `
          -DCMAKE_INSTALL_PREFIX="$pwd\install" `
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL `
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        
        # Show configuration summary
        Write-Host "CMake configuration complete"

    - name: Build BFF
      shell: powershell
      run: |
        Set-Location build
        cmake --build . --config ${{ env.BUILD_TYPE }} --target install -- /m
        
        # Verify build
        if (Test-Path "install\bin\bff-gui.exe") {
          Write-Host "bff-gui.exe built successfully"
        } else {
          Write-Error "bff-gui.exe not found"
          Get-ChildItem "install" -Recurse
          exit 1
        }

    - name: Collect dependencies
      shell: powershell
      run: |
        # Create distribution directory
        New-Item -ItemType Directory -Force -Path "bff-dist"
        
        # Copy executables
        Copy-Item "build\install\bin\*.exe" -Destination "bff-dist\" -Force
        
        # Copy SuiteSparse DLLs
        if (Test-Path "C:\suitesparse\bin\*.dll") {
          Copy-Item "C:\suitesparse\bin\*.dll" -Destination "bff-dist\" -Force
          Write-Host "Copied SuiteSparse DLLs"
        }
        
        # List files in distribution
        Write-Host "Files in distribution folder:"
        Get-ChildItem "bff-dist"

    - name: Package for distribution
      shell: powershell
      run: |
        # Create README
        $readmeLines = @(
          "# BFF (Boundary First Flattening) v1.6 - Windows Binary",
          "",
          "## Included Files",
          "- bff-gui.exe: GUI application for mesh parameterization",
          "- bff.exe: Command-line interface",
          "- SuiteSparse DLLs: Required numerical libraries",
          "",
          "## Requirements",
          "- Windows 10 or later",
          "- Visual C++ Redistributable (if not already installed)",
          "",
          "## Usage",
          "Double-click bff-gui.exe to launch the graphical interface.",
          "",
          "For command-line usage, run:",
          "  bff.exe --help",
          "",
          "## Build Information",
          "Built on GitHub Actions using:",
          "- SuiteSparse binaries from: https://github.com/royeiror/suitesparse-metis-for-windows",
          "- FLTK 1.3.9",
          "- MSVC compiler"
        )
        
        $readmeLines | Out-File -FilePath "bff-dist\README.txt" -Encoding UTF8
        
        # Create ZIP archive
        Compress-Archive -Path "bff-dist\*" -DestinationPath "bff-windows-x64-v1.6.zip" -Force

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: bff-windows-binary
        path: bff-windows-x64-v1.6.zip
        retention-days: 30
