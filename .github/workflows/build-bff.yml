name: Build BFF Windows Binary

on:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout BFF source code
      uses: actions/checkout@v4
      with:
        repository: 'GeometryCollective/boundary-first-flattening'
        ref: 'v1.6'
        
    - name: Prepare SuiteSparse structure
      shell: powershell
      run: |
        # Clone the SuiteSparse repository
        git clone https://github.com/royeiror/suitesparse-metis-for-windows suitesparse
        
        # Use forward slashes for CMake compatibility
        $suiteSparseDir = "$pwd/suitesparse" -replace '\\', '/'
        echo "SUITESPARSE_DIR=$suiteSparseDir" >> $env:GITHUB_ENV
        
        # Check what we have
        Write-Host "SuiteSparse directory contents:"
        Get-ChildItem "$suiteSparseDir" -ErrorAction SilentlyContinue | Select-Object Name
        
        # Check for binaries
        if (Test-Path "$suiteSparseDir/binaries/x64/lib") {
          Write-Host "Found binaries in binaries/x64/lib"
        }
        
    - name: Install FLTK via vcpkg
      shell: powershell
      run: |
        git clone https://github.com/microsoft/vcpkg
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg install fltk:x64-windows
        
        $fltkDir = "$pwd/vcpkg/installed/x64-windows" -replace '\\', '/'
        echo "FLTK_DIR=$fltkDir" >> $env:GITHUB_ENV
        
    - name: Create simplified CMake modules
      shell: powershell
      run: |
        # Create a simple SuiteSparse config that bypasses the complex find logic
        $suiteSparseConfig = @()
        $suiteSparseConfig += '# Simple SuiteSparse config for Windows build'
        $suiteSparseConfig += 'set(SuiteSparse_FOUND TRUE)'
        $suiteSparseConfig += 'set(SuiteSparse_INCLUDE_DIRS "${CMAKE_CURRENT_LIST_DIR}/../../suitesparse/SuiteSparse")'
        $suiteSparseConfig += 'set(SuiteSparse_LIBRARIES "${CMAKE_CURRENT_LIST_DIR}/../../suitesparse/binaries/x64/lib")'
        $suiteSparseConfig += 'message(STATUS "Using simple SuiteSparse config")'
        
        # Write to a location that will be found
        $configDir = "cmake/suitesparse-5.4.0"
        New-Item -ItemType Directory -Force -Path $configDir
        $suiteSparseConfig | Out-File -FilePath "$configDir/SuiteSparseConfig.cmake"
        
        Write-Host "Created simplified SuiteSparseConfig.cmake"
        
    - name: Configure BFF with direct paths
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "build"
        Set-Location build
        
        # Get current directory with forward slashes
        $currentDir = $pwd -replace '\\', '/'
        $parentDir = (Get-Item $currentDir).Parent.FullName -replace '\\', '/'
        $suiteSparseDir = "$parentDir/suitesparse" -replace '\\', '/'
        
        # Configure with explicit paths using forward slashes
        cmake .. `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
          -DCMAKE_INSTALL_PREFIX="$currentDir/install" `
          -DSUITESPARSE_INCLUDE_DIR="$suiteSparseDir/SuiteSparse" `
          -DSUITESPARSE_LIBRARY_DIR="$suiteSparseDir/binaries/x64/lib" `
          -DSUITESPARSE_FOUND=TRUE `
          -DENABLE_BFF_CLI=ON `
          -DENABLE_BFF_GUI=ON `
          -DFLTK_DIR="${{ env.FLTK_DIR }}/share/fltk"
        
        Write-Host "CMake configuration attempted"
        
    - name: Try building just the BFF library
      shell: powershell
      run: |
        Set-Location build
        
        # First, see what targets are available
        Write-Host "Available targets:"
        cmake --build . --target help 2>&1 | Select-Object -First 20
        
        # Try to build just the core library
        Write-Host "Attempting to build..."
        cmake --build . --config ${{ env.BUILD_TYPE }} 2>&1 | Select-Object -Last 50
        
    - name: Create debug output
      if: always()
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "debug"
        
        # Save CMakeCache for analysis
        if (Test-Path "build/CMakeCache.txt") {
          Copy-Item "build/CMakeCache.txt" -Destination "debug/"
        }
        
        # Check what was in the SuiteSparse directory
        if (Test-Path "suitesparse") {
          "SuiteSparse directory structure:" | Out-File "debug/suitesparse_structure.txt"
          Get-ChildItem "suitesparse" -Recurse | Select-Object FullName | Out-File "debug/suitesparse_structure.txt" -Append
        }
        
        # Create summary
        $summary = @()
        $summary += "Build attempted: $(Get-Date)"
        $summary += "Working directory: $pwd"
        $summary += "SuiteSparse dir exists: $(Test-Path 'suitesparse')"
        $summary += "SuiteSparse/SuiteSparse exists: $(Test-Path 'suitesparse/SuiteSparse')"
        $summary += "Binaries exist: $(Test-Path 'suitesparse/binaries/x64/lib')"
        
        $summary | Out-File "debug/build_summary.txt"
        
        Compress-Archive -Path "debug/*" -DestinationPath "debug_info.zip" -Force
        
    - name: Upload debug info
      uses: actions/upload-artifact@v4
      with:
        name: build-debug
        path: debug_info.zip
        retention-days: 7
