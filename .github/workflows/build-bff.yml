name: Build BFF Windows Binary

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build-bff.yml'
  release:
    types: [created]

env:
  BUILD_DIR: "C:/build"
  INSTALL_DIR: "C:/local"
  VCPKG_ROOT: "C:/vcpkg"
  SUITESPARSE_VERSION: "7.0.1"
  METIS_VERSION: "5.1.0"
  CMAKE_GENERATOR: "Visual Studio 17 2022"
  CMAKE_ARCH: "x64"

jobs:
  build-dependencies:
    name: Build SuiteSparse Dependencies
    runs-on: windows-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Setup Visual Studio
      uses: microsoft/setup-visual-studio@v1
      with:
        components: |
          Microsoft.VisualStudio.Component.VC.Tools.x86.x64
          Microsoft.VisualStudio.Component.Windows10SDK
          Microsoft.VisualStudio.Component.VC.CMake.Project
    
    - name: Create Directories
      shell: cmd
      run: |
        mkdir %BUILD_DIR%
        mkdir %INSTALL_DIR%
    
    - name: Install Required Tools
      shell: cmd
      run: |
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
        choco install git -y
        choco install ninja -y
    
    - name: Download and Extract METIS
      shell: cmd
      run: |
        cd %BUILD_DIR%
        curl -L -o metis-%METIS_VERSION%.tar.gz https://github.com/jlblancoc/suitesparse-metis-for-windows/releases/download/v1.4.0/metis-%METIS_VERSION%.tar.gz
        tar -xzf metis-%METIS_VERSION%.tar.gz
        move metis-%METIS_VERSION% metis
    
    - name: Build METIS
      shell: cmd
      run: |
        cd %BUILD_DIR%\metis
        mkdir build
        cd build
        cmake .. -G "%CMAKE_GENERATOR%" -A %CMAKE_ARCH% ^
          -DCMAKE_INSTALL_PREFIX="%INSTALL_DIR%" ^
          -DSHARED=0
        cmake --build . --config Release --target install
    
    - name: Download SuiteSparse
      shell: cmd
      run: |
        cd %BUILD_DIR%
        git clone --depth 1 --branch v%SUITESPARSE_VERSION% https://github.com/DrTimothyAldenDavis/SuiteSparse.git
        cd SuiteSparse
        git submodule update --init --recursive
    
    - name: Build SuiteSparse (UMFPACK)
      shell: cmd
      run: |
        cd %BUILD_DIR%\SuiteSparse\UMFPACK
        mkdir build
        cd build
        cmake .. -G "%CMAKE_GENERATOR%" -A %CMAKE_ARCH% ^
          -DCMAKE_INSTALL_PREFIX="%INSTALL_DIR%" ^
          -DCMAKE_PREFIX_PATH="%INSTALL_DIR%" ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DBUILD_SHARED_LIBS=OFF ^
          -DNSTATIC=ON
        cmake --build . --config Release --target install
    
    - name: Build SuiteSparse (AMD)
      shell: cmd
      run: |
        cd %BUILD_DIR%\SuiteSparse\AMD
        mkdir build
        cd build
        cmake .. -G "%CMAKE_GENERATOR%" -A %CMAKE_ARCH% ^
          -DCMAKE_INSTALL_PREFIX="%INSTALL_DIR%" ^
          -DCMAKE_PREFIX_PATH="%INSTALL_DIR%" ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DBUILD_SHARED_LIBS=OFF ^
          -DNSTATIC=ON
        cmake --build . --config Release --target install
    
    - name: Build SuiteSparse (CHOLMOD)
      shell: cmd
      run: |
        cd %BUILD_DIR%\SuiteSparse\CHOLMOD
        mkdir build
        cd build
        cmake .. -G "%CMAKE_GENERATOR%" -A %CMAKE_ARCH% ^
          -DCMAKE_INSTALL_PREFIX="%INSTALL_DIR%" ^
          -DCMAKE_PREFIX_PATH="%INSTALL_DIR%" ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DBUILD_SHARED_LIBS=OFF ^
          -DNSTATIC=ON
        cmake --build . --config Release --target install
    
    - name: Verify SuiteSparse Build
      shell: cmd
      run: |
        echo "Checking installed libraries..."
        dir "%INSTALL_DIR%\lib" /b
        echo "Checking installed headers..."
        dir "%INSTALL_DIR%\include" /b
    
    - name: Archive Dependencies
      uses: actions/upload-artifact@v4
      with:
        name: suitesparse-dependencies
        path: |
          ${{ env.INSTALL_DIR }}/include
          ${{ env.INSTALL_DIR }}/lib
        retention-days: 7

  build-bff:
    name: Build BFF Windows Binary
    runs-on: windows-latest
    needs: build-dependencies
    
    steps:
    - name: Checkout BFF Repository
      uses: actions/checkout@v4
      with:
        repository: GeometryCollective/boundary-first-flattening
        ref: v1.6
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Setup Visual Studio
      uses: microsoft/setup-visual-studio@v1
      with:
        components: |
          Microsoft.VisualStudio.Component.VC.Tools.x86.x64
          Microsoft.VisualStudio.Component.Windows10SDK
          Microsoft.VisualStudio.Component.VC.CMake.Project
    
    - name: Download Dependencies
      uses: actions/download-artifact@v4
      with:
        name: suitesparse-dependencies
        path: ${{ env.INSTALL_DIR }}
    
    - name: Install Build Tools
      shell: cmd
      run: |
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
        choco install git -y
        choco install ninja -y
    
    - name: Install Qt for GUI
      shell: cmd
      run: |
        choco install qtcreator -y
        # Add Qt to PATH
        echo "C:\Qt\Tools\QtCreator\bin" >> $env:GITHUB_PATH
    
    - name: Clone and Build Eigen
      shell: cmd
      run: |
        cd %BUILD_DIR%
        git clone --depth 1 --branch 3.4 https://gitlab.com/libeigen/eigen.git
        cd eigen
        mkdir build
        cd build
        cmake .. -G "%CMAKE_GENERATOR%" -A %CMAKE_ARCH% ^
          -DCMAKE_INSTALL_PREFIX="%INSTALL_DIR%"
        cmake --build . --config Release --target install
    
    - name: Clone and Build GLFW
      shell: cmd
      run: |
        cd %BUILD_DIR%
        git clone --depth 1 --branch 3.3.8 https://github.com/glfw/glfw.git
        cd glfw
        mkdir build
        cd build
        cmake .. -G "%CMAKE_GENERATOR%" -A %CMAKE_ARCH% ^
          -DCMAKE_INSTALL_PREFIX="%INSTALL_DIR%" ^
          -DGLFW_BUILD_EXAMPLES=OFF ^
          -DGLFW_BUILD_TESTS=OFF ^
          -DGLFW_BUILD_DOCS=OFF
        cmake --build . --config Release --target install
    
    - name: Build BFF Library
      shell: cmd
      run: |
        mkdir build_lib
        cd build_lib
        cmake .. -G "%CMAKE_GENERATOR%" -A %CMAKE_ARCH% ^
          -DCMAKE_INSTALL_PREFIX="%INSTALL_DIR%" ^
          -DCMAKE_PREFIX_PATH="%INSTALL_DIR%" ^
          -DBUILD_GUI=OFF ^
          -DBUILD_TESTING=OFF ^
          -DCMAKE_BUILD_TYPE=Release
        cmake --build . --config Release --target install
    
    - name: Build BFF GUI Application
      shell: cmd
      run: |
        mkdir build_gui
        cd build_gui
        cmake .. -G "%CMAKE_GENERATOR%" -A %CMAKE_ARCH% ^
          -DCMAKE_PREFIX_PATH="%INSTALL_DIR%;C:/Qt/6.5.0/msvc2019_64" ^
          -DBUILD_GUI=ON ^
          -DCMAKE_BUILD_TYPE=Release
        cmake --build . --config Release --target bff-gui
    
    - name: Collect DLL Dependencies
      shell: cmd
      run: |
        # Copy required Qt DLLs
        mkdir -p release_bin
        copy build_gui\Release\bff-gui.exe release_bin\
        
        # Use windeployqt to gather Qt dependencies
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        windeployqt release_bin\bff-gui.exe --release
        
        # Copy SuiteSparse and other dependencies
        copy "%INSTALL_DIR%\lib\*.lib" release_bin\
        
        # List contents for verification
        dir release_bin\
    
    - name: Create Standalone Package
      shell: cmd
      run: |
        cd release_bin
        7z a -tzip bff-gui-windows.zip *
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bff-windows-gui
        path: release_bin/bff-gui-windows.zip
        retention-days: 30 
        name: Windows Build BFF v1.6 - Optimized

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup environment
      shell: bash
      run: |
        echo "Installing required tools..."
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
        choco install wget -y
        choco install 7zip -y
        
    - name: Download pre-built OpenBLAS
      shell: bash
      run: |
        echo "Downloading pre-built OpenBLAS..."
        wget https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.28/OpenBLAS-0.3.28-x64.zip -O openblas.zip
        7z x openblas.zip -oopenblas-install
        
    - name: Build SuiteSparse v5.13.0 with METIS (Simplified)
      shell: bash
      run: |
        echo "Building SuiteSparse v5.13.0 with METIS..."
        
        # Clean up
        rm -rf suitesparse-deps
        rm -rf SuiteSparse
        
        # 1. Clone and checkout v5.13.0
        git clone https://github.com/DrTimothyAldenDavis/SuiteSparse.git
        cd SuiteSparse
        git checkout v5.13.0
        
        # 2. Build METIS with CMake
        echo "Building METIS..."
        if [ -d "metis-5.1.0" ]; then
          cd metis-5.1.0
          # Apply minimal patch for MSVC
          sed -i 's/#include <getopt.h>//' programs/cmdline_metis.c 2>/dev/null || true
          sed -i 's/#include <getopt.h>//' programs/cmdline_graphchk.c 2>/dev/null || true
          
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_INSTALL_PREFIX="../../../suitesparse-deps"
          cmake --build . --config Release
          # Manually copy the built library
          find . -name "*.lib" -exec cp {} ../../../suitesparse-deps/lib/ \;
          cd ../../
        fi
        
        # 3. Prepare directories
        mkdir -p ../suitesparse-deps/lib
        mkdir -p ../suitesparse-deps/include
        
        # 4. Build SuiteSparse libraries one by one (simplified approach)
        echo "Building SuiteSparse libraries..."
        
        # SuiteSparse_config first
        if [ -d "SuiteSparse_config" ]; then
          echo "Building SuiteSparse_config..."
          cd SuiteSparse_config
          mkdir -p build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_INSTALL_PREFIX="../../../../suitesparse-deps"
          cmake --build . --config Release
          cd ../../
        fi
        
        # Build CHOLMOD (most important for BFF)
        if [ -d "CHOLMOD" ]; then
          echo "Building CHOLMOD..."
          cd CHOLMOD
          mkdir -p build
          cd build
          # Create minimal CMakeLists.txt
          echo 'cmake_minimum_required(VERSION 3.10)' > ../CMakeLists_cholmod.txt
          echo 'project(CHOLMOD)' >> ../CMakeLists_cholmod.txt
          echo 'file(GLOB SRC_FILES "*.c" "*.cpp")' >> ../CMakeLists_cholmod.txt
          echo 'add_library(cholmod STATIC ${SRC_FILES})' >> ../CMakeLists_cholmod.txt
          echo 'target_include_directories(cholmod PUBLIC ../Include)' >> ../CMakeLists_cholmod.txt
          
          cmake .. -G "Visual Studio 17 2022" -A x64 \
            -DCMAKE_INSTALL_PREFIX="../../../../suitesparse-deps" \
            -DBLAS_LIBRARIES="../../../../openblas-install/lib/libopenblas.lib"
          cmake --build . --config Release
          cd ../../
        fi
        
        # Build other essential libraries
        for lib in AMD CAMD CCOLAMD COLAMD; do
          if [ -d "$lib" ]; then
            echo "Building $lib..."
            cd "$lib"
            mkdir -p build
            cd build
            cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_INSTALL_PREFIX="../../../../suitesparse-deps"
            cmake --build . --config Release
            cd ../../
          fi
        done
        
        # 5. Copy all built libraries
        echo "Copying built libraries..."
        find . -name "*.lib" -type f -exec cp {} ../suitesparse-deps/lib/ 2>/dev/null \;
        
        # 6. Copy headers
        echo "Copying headers..."
        find . -name "*.h" -type f -exec cp {} ../suitesparse-deps/include/ 2>/dev/null \;
        cp -r Include/* ../suitesparse-deps/include/ 2>/dev/null || true
        
        # 7. Create compatibility symlinks
        cd ../suitesparse-deps/lib
        cp ../../openblas-install/lib/libopenblas.lib blas.lib
        cp ../../openblas-install/lib/libopenblas.lib lapack.lib
        
        echo "SuiteSparse build complete!"
        ls -la
        
    - name: Apply critical BFF patches
      shell: bash
      run: |
        echo "Applying essential BFF patches for Windows..."
        
        # 1. Create custom FindSuiteSparse.cmake using echo commands
        echo "Creating custom FindSuiteSparse.cmake..."
        mkdir -p cmake
        
        echo '# Manual configuration for SuiteSparse on Windows' > cmake/FindSuiteSparse.cmake
        echo 'if(WIN32)' >> cmake/FindSuiteSparse.cmake
        echo '  message(STATUS "Using manually configured SuiteSparse for Windows")' >> cmake/FindSuiteSparse.cmake
        echo '  set(SuiteSparse_FOUND ON)' >> cmake/FindSuiteSparse.cmake
        echo '  set(SuiteSparse_INCLUDE_DIRS "$ENV{GITHUB_WORKSPACE}/suitesparse-deps/include")' >> cmake/FindSuiteSparse.cmake
        echo '  set(SuiteSparse_LIBRARIES' >> cmake/FindSuiteSparse.cmake
        echo '    "$ENV{GITHUB_WORKSPACE}/suitesparse-deps/lib/libopenblas.lib"' >> cmake/FindSuiteSparse.cmake
        
        # Add libraries that might exist
        for lib in amd camd ccolamd colamd cholmod suitesparseconfig metis; do
          echo '    "$ENV{GITHUB_WORKSPACE}/suitesparse-deps/lib/'"$lib"'.lib"' >> cmake/FindSuiteSparse.cmake
        done
        
        echo '  )' >> cmake/FindSuiteSparse.cmake
        echo 'endif()' >> cmake/FindSuiteSparse.cmake
        
        # 2. Patch CMakeLists.txt
        echo "Patching CMakeLists.txt..."
        sed -i 's|find_package(SuiteSparse REQUIRED)|include(cmake/FindSuiteSparse.cmake)|' CMakeLists.txt
        
        # 3. Patch NanoGUI
        echo "Patching NanoGUI for static build..."
        sed -i 's|add_library(nanogui SHARED|add_library(nanogui STATIC|' deps/nanogui/CMakeLists.txt
        sed -i 's|NANOGUI_BUILD SHARED|NANOGUI_BUILD STATIC|' deps/nanogui/CMakeLists.txt
        
        echo "Patches applied successfully!"
        
    - name: Debug - Check what was built
      shell: bash
      run: |
        echo "Checking build artifacts..."
        echo "SuiteSparse libraries:"
        find suitesparse-deps -name "*.lib" -type f 2>/dev/null || echo "No .lib files found"
        echo "OpenBLAS installation:"
        ls -la openblas-install/lib/ 2>/dev/null || echo "OpenBLAS not found"
        
    - name: Configure and Build BFF
      shell: cmd
      run: |
        echo "Configuring BFF with CMake..."
        mkdir build
        cd build
        
        cmake .. -G "Visual Studio 17 2022" -A x64 ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DBUILD_SHARED_LIBS=ON ^
          -DCMAKE_PREFIX_PATH="%cd%/../suitesparse-deps" ^
          -DBLAS_LIBRARIES="%cd%/../openblas-install/lib/libopenblas.lib" ^
          -DLAPACK_LIBRARIES="%cd%/../openblas-install/lib/libopenblas.lib"
        
        echo "Building BFF..."
        cmake --build . --config Release --parallel 4
        
    - name: Package artifacts
      shell: bash
      run: |
        echo "Packaging build artifacts..."
        mkdir -p bff-package
        
        if [ -f "./build/Release/bff-viewer.exe" ]; then
          cp ./build/Release/bff-viewer.exe ./bff-package/
          echo "✓ bff-viewer.exe"
        fi
        
        if [ -f "./build/Release/bff.dll" ]; then
          cp ./build/Release/bff.dll ./bff-package/
          echo "✓ bff.dll"
        fi
        
        echo "Copying runtime dependencies..."
        find ./build -name "*.dll" -exec cp {} ./bff-package/ \;
        
        if [ -f "./openblas-install/bin/libopenblas.dll" ]; then
          cp ./openblas-install/bin/libopenblas.dll ./bff-package/
          echo "✓ libopenblas.dll"
        fi
        
        echo "Package contents:"
        ls -la ./bff-package/
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bff-windows-binaries
        path: bff-package/
        if-no-files-found: error
        retention-days: 7
