name: Windows Build BFF v1.6

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  BUILD_DIR: "C:\\build"
  INSTALL_DIR: "C:\\suitesparse-deps"
  OPENBLAS_DIR: "C:\\openblas-install"
  CMAKE_GENERATOR: "Visual Studio 17 2022"
  CMAKE_ARCH: "x64"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 180
    
    steps:
    - name: Checkout BFF repository
      uses: actions/checkout@v4
      with:
        repository: GeometryCollective/boundary-first-flattening
        ref: v1.6
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install build tools
      shell: powershell
      run: |
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
        choco install wget -y
        choco install 7zip -y
        choco install git -y
        choco install ninja -y
        
    - name: Download and setup dependencies
      shell: powershell
      run: |
        Write-Host "Setting up dependencies..."
        
        # Create directories
        New-Item -ItemType Directory -Force -Path "$env:INSTALL_DIR\lib"
        New-Item -ItemType Directory -Force -Path "$env:INSTALL_DIR\include"
        New-Item -ItemType Directory -Force -Path "$env:OPENBLAS_DIR"
        
        # Download OpenBLAS
        Write-Host "Downloading OpenBLAS..."
        wget https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.28/OpenBLAS-0.3.28-x64.zip -OutFile openblas.zip
        7z x openblas.zip -o"$env:OPENBLAS_DIR"
        
        # Copy OpenBLAS to install directory
        Copy-Item "$env:OPENBLAS_DIR\lib\*.lib" "$env:INSTALL_DIR\lib\" -Force
        Copy-Item "$env:OPENBLAS_DIR\bin\*.dll" "$env:INSTALL_DIR\lib\" -Force
        if (Test-Path "$env:OPENBLAS_DIR\include") {
            Copy-Item "$env:OPENBLAS_DIR\include\*" "$env:INSTALL_DIR\include\" -Recurse -Force
        }
        
    - name: Build SuiteSparse manually
      shell: powershell
      run: |
        Write-Host "Building SuiteSparse manually..."
        
        # Create minimal SuiteSparse headers
        $suiteSparseInclude = "$env:INSTALL_DIR\include\suitesparse"
        New-Item -ItemType Directory -Force -Path $suiteSparseInclude
        
        # Create SuiteSparse_config.h using array joining
        $configLines = @(
            '#ifndef SUITESPARSE_CONFIG_H',
            '#define SUITESPARSE_CONFIG_H',
            '',
            '#ifdef __cplusplus',
            'extern "C" {',
            '#endif',
            '',
            '#define SUITESPARSE_VERSION "5.13.0"',
            '#define SUITESPARSE_MAIN_VERSION 5',
            '#define SUITESPARSE_SUB_VERSION 13',
            '#define SUITESPARSE_SUBSUB_VERSION 0',
            '',
            '#ifdef __cplusplus',
            '}',
            '#endif',
            '',
            '#endif'
        )
        
        $configLines -join "`n" | Out-File -FilePath "$suiteSparseInclude\SuiteSparse_config.h" -Encoding UTF8
        
        # Create amd.h
        $amdLines = @(
            '#ifndef AMD_H',
            '#define AMD_H',
            '',
            '#ifdef __cplusplus',
            'extern "C" {',
            '#endif',
            '',
            'typedef int Int;',
            '',
            '#ifdef __cplusplus',
            '}',
            '#endif',
            '',
            '#endif'
        )
        
        $amdLines -join "`n" | Out-File -FilePath "$suiteSparseInclude\amd.h" -Encoding UTF8
        
        # Create cholmod.h
        $cholmodLines = @(
            '#ifndef CHOLMOD_H',
            '#define CHOLMOD_H',
            '',
            '#ifdef __cplusplus',
            'extern "C" {',
            '#endif',
            '',
            'typedef struct cholmod_common_struct {',
            '    double dbound;',
            '    double grow0;',
            '    double grow1;',
            '    double grow2;',
            '    size_t maxrank;',
            '    double supernodal_switch;',
            '    double supernodal;',
            '    double final_asis;',
            '    double final_super;',
            '    double final_ll;',
            '    double final_pack;',
            '    double final_monotonic;',
            '    double final_resymbol;',
            '    double prefer_zomplex;',
            '    double prefer_upper;',
            '    double quick_return_if_not_posdef;',
            '    int nmethods;',
            '    int selected;',
            '    int postorder;',
            '    int default_nesdis;',
            '} cholmod_common;',
            '',
            'typedef struct cholmod_sparse_struct {',
            '    size_t nrow;',
            '    size_t ncol;',
            '    size_t nzmax;',
            '    void *p;',
            '    void *i;',
            '    void *x;',
            '    void *z;',
            '    int stype;',
            '    int itype;',
            '    int xtype;',
            '    int dtype;',
            '    int sorted;',
            '    int packed;',
            '} *cholmod_sparse;',
            '',
            '#ifdef __cplusplus',
            '}',
            '#endif',
            '',
            '#endif'
        )
        
        $cholmodLines -join "`n" | Out-File -FilePath "$suiteSparseInclude\cholmod.h" -Encoding UTF8
        
        Write-Host "Created minimal SuiteSparse headers"
        
    - name: Fix BFF CMakeLists.txt
      shell: powershell
      run: |
        Write-Host "Fixing BFF CMakeLists.txt for Windows build..."
        
        # Read the original CMakeLists.txt
        $cmakeContent = Get-Content "CMakeLists.txt" -Raw
        
        # Fix 1: Update cmake_minimum_required to at least 3.5
        $cmakeContent = $cmakeContent -replace 'cmake_minimum_required\s*\(\s*VERSION\s+[0-9.]+', 'cmake_minimum_required(VERSION 3.5'
        
        # Fix 2: Replace find_package(SuiteSparse) with direct linking
        $replacementLines = @(
            '# Manual SuiteSparse configuration for Windows',
            'if(WIN32)',
            '    message(STATUS "Using manual SuiteSparse configuration for Windows")',
            '',
            '    # Include directories',
            '    include_directories(',
            '        "${CMAKE_SOURCE_DIR}/suitesparse-deps/include"',
            '        "${CMAKE_SOURCE_DIR}/suitesparse-deps/include/suitesparse"',
            '    )',
            '',
            '    # Link OpenBLAS',
            '    set(OPENBLAS_LIB "${CMAKE_SOURCE_DIR}/suitesparse-deps/lib/libopenblas.lib")',
            '    if(EXISTS ${OPENBLAS_LIB})',
            '        message(STATUS "Found OpenBLAS: ${OPENBLAS_LIB}")',
            '        set(BLAS_LIBRARIES ${OPENBLAS_LIB})',
            '        set(LAPACK_LIBRARIES ${OPENBLAS_LIB})',
            '        link_libraries(${OPENBLAS_LIB})',
            '    else()',
            '        message(FATAL_ERROR "OpenBLAS not found: ${OPENBLAS_LIB}")',
            '    endif()',
            '',
            '    set(SuiteSparse_FOUND TRUE)',
            'else()',
            '    find_package(SuiteSparse REQUIRED)',
            'endif()'
        )
        
        $replacementText = $replacementLines -join "`n"
        $cmakeContent = $cmakeContent -replace 'find_package\s*\(\s*SuiteSparse\s+REQUIRED\s*\)', $replacementText
        
        # Write modified CMakeLists.txt
        $cmakeContent | Out-File -FilePath "CMakeLists.txt" -Encoding UTF8
        
        Write-Host "CMakeLists.txt fixed successfully!"
        
    - name: Patch NanoGUI for static build
      shell: powershell
      run: |
        Write-Host "Patching NanoGUI for static build..."
        
        # Patch NanoGUI to build statically
        $nanoguiCmakePath = "deps\nanogui\CMakeLists.txt"
        if (Test-Path $nanoguiCmakePath) {
            $nanoguiContent = Get-Content $nanoguiCmakePath -Raw
            $nanoguiContent = $nanoguiContent -replace 'add_library\(nanogui SHARED', 'add_library(nanogui STATIC'
            $nanoguiContent = $nanoguiContent -replace 'NANOGUI_BUILD_SHARED', 'NANOGUI_BUILD_STATIC'
            $nanoguiContent | Out-File -FilePath $nanoguiCmakePath -Encoding UTF8
            Write-Host "NanoGUI patched for static build"
        }
        
    - name: Build BFF with simplified configuration
      shell: powershell
      run: |
        Write-Host "Configuring BFF with simplified setup..."
        
        # Create build directory
        New-Item -ItemType Directory -Force -Path "build"
        cd build
        
        # Show what's available
        Write-Host "Available libraries:"
        if (Test-Path "..\suitesparse-deps\lib") {
            Get-ChildItem "..\suitesparse-deps\lib" -Filter "*.lib" | ForEach-Object {
                Write-Host "  - $($_.Name)"
            }
        }
        
        # Simple CMake configuration
        Write-Host "Running CMake..."
        cmake .. -G "$env:CMAKE_GENERATOR" -A $env:CMAKE_ARCH `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=OFF `
            -DBUILD_GUI=ON `
            -DCMAKE_CXX_FLAGS="/DSUITESPARSE_FOUND /DBLAS_FOUND /DLAPACK_FOUND"
        
        if ($LASTEXITCODE -eq 0) {
            Write-Host "Building BFF..."
            cmake --build . --config Release --parallel 4
        } else {
            Write-Host "CMake configuration failed with exit code: $LASTEXITCODE"
            Write-Host "Trying alternative approach..."
            
            # Try building just the library without GUI
            cd ..
            Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path "build"
            cd build
            
            cmake .. -G "$env:CMAKE_GENERATOR" -A $env:CMAKE_ARCH `
                -DCMAKE_BUILD_TYPE=Release `
                -DBUILD_SHARED_LIBS=OFF `
                -DBUILD_GUI=OFF `
                -DCMAKE_CXX_FLAGS="/DSUITESPARSE_FOUND /DBLAS_FOUND /DLAPACK_FOUND"
            
            if ($LASTEXITCODE -eq 0) {
                Write-Host "Building BFF library..."
                cmake --build . --config Release --parallel 4
            } else {
                exit $LASTEXITCODE
            }
        }
        
    - name: Find and package binaries
      shell: powershell
      run: |
        Write-Host "Searching for built binaries..."
        
        # Create package directory
        New-Item -ItemType Directory -Force -Path "bff-package"
        
        # Find executables
        $searchPaths = @("build\Release", "build", ".")
        foreach ($path in $searchPaths) {
            if (Test-Path $path) {
                # Look for bff-viewer or similar
                $possibleNames = @("*bff*", "*viewer*", "*gui*", "*.exe")
                foreach ($pattern in $possibleNames) {
                    $exeFiles = Get-ChildItem -Path $path -Recurse -Filter $pattern -File
                    foreach ($exe in $exeFiles) {
                        if ($exe.Extension -eq ".exe") {
                            Write-Host "Found executable: $($exe.FullName)"
                            Copy-Item -Path $exe.FullName -Destination "bff-package"
                        }
                    }
                }
            }
        }
        
        # Copy DLLs
        if (Test-Path "build\Release") {
            Get-ChildItem -Path "build\Release" -Filter "*.dll" -File | ForEach-Object {
                Write-Host "Found DLL: $($_.Name)"
                Copy-Item -Path $_.FullName -Destination "bff-package"
            }
        }
        
        # Copy OpenBLAS DLL
        if (Test-Path "suitesparse-deps\lib\*.dll") {
            Copy-Item "suitesparse-deps\lib\*.dll" "bff-package\" -Force
        }
        
        # If no executables found, check for libraries
        if ((Get-ChildItem "bff-package" -Filter "*.exe" | Measure-Object).Count -eq 0) {
            Write-Host "No executables found, looking for libraries..."
            if (Test-Path "build\Release") {
                Get-ChildItem -Path "build\Release" -Filter "*.lib" -File | ForEach-Object {
                    Write-Host "Found library: $($_.Name)"
                    Copy-Item -Path $_.FullName -Destination "bff-package"
                }
            }
        }
        
        # Create a README file using array joining
        $readmeLines = @(
            "BFF (Boundary First Flattening) Windows Build Attempt",
            "=====================================================",
            "Build Date: $(Get-Date -Format 'yyyy-MM-dd')",
            "Version: 1.6",
            "",
            "Note: This build attempted to work around SuiteSparse dependencies.",
            "The original BFF requires SuiteSparse, which is complex to build on Windows.",
            "",
            "Contents:"
        )
        
        $fileList = Get-ChildItem "bff-package" | ForEach-Object { "  - $($_.Name)" }
        if ($fileList) {
            $readmeLines += $fileList
        } else {
            $readmeLines += "  (empty)"
        }
        
        $readmeLines -join "`n" | Out-File -FilePath "bff-package\README.txt" -Encoding UTF8
        
        Write-Host "=== Package Contents ==="
        Get-ChildItem -Path "bff-package"
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bff-windows-binaries
        path: bff-package/
        if-no-files-found: warn
        retention-days: 7
