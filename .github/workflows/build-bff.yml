name: Windows Build BFF v1.6

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  BUILD_DIR: "C:\\build"
  INSTALL_DIR: "C:\\suitesparse-deps"
  OPENBLAS_DIR: "C:\\openblas-install"
  CMAKE_GENERATOR: "Visual Studio 17 2022"
  CMAKE_ARCH: "x64"
  VCPKG_DIR: "C:\\vcpkg"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 150
    
    steps:
    - name: Checkout BFF repository
      uses: actions/checkout@v4
      with:
        repository: GeometryCollective/boundary-first-flattening
        ref: v1.6
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install build tools
      shell: cmd
      run: |
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
        choco install wget -y
        choco install 7zip -y
        choco install git -y
        choco install ninja -y
        REM Python is already available on the runner, no need to install
        
    - name: Download and setup vcpkg
      shell: powershell
      run: |
        Write-Host "Setting up vcpkg for dependency management..."
        
        # Clone vcpkg
        git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_DIR
        cd $env:VCPKG_DIR
        
        # Bootstrap vcpkg
        .\bootstrap-vcpkg.bat
        
        # Add vcpkg to PATH for this session
        $env:PATH = "$env:VCPKG_DIR;$env:PATH"
        
    - name: Build SuiteSparse with vcpkg
      shell: powershell
      run: |
        Write-Host "Building SuiteSparse with vcpkg..."
        
        # Set up vcpkg in PATH
        $env:PATH = "$env:VCPKG_DIR;$env:PATH"
        
        # Install SuiteSparse dependencies via vcpkg
        Write-Host "Installing SuiteSparse via vcpkg..."
        vcpkg install suitesparse --triplet x64-windows
        
        # Copy the built libraries to our install directory
        New-Item -ItemType Directory -Force -Path "$env:INSTALL_DIR\lib"
        New-Item -ItemType Directory -Force -Path "$env:INSTALL_DIR\include"
        
        # Copy libraries from vcpkg
        $vcpkgInstalledDir = "$env:VCPKG_DIR\installed\x64-windows"
        
        Write-Host "Copying libraries from $vcpkgInstalledDir..."
        
        # Copy .lib files
        Copy-Item "$vcpkgInstalledDir\lib\*.lib" "$env:INSTALL_DIR\lib\" -ErrorAction SilentlyContinue
        
        # Copy .dll files
        Copy-Item "$vcpkgInstalledDir\bin\*.dll" "$env:INSTALL_DIR\lib\" -ErrorAction SilentlyContinue
        
        # Copy headers
        Copy-Item "$vcpkgInstalledDir\include\*" "$env:INSTALL_DIR\include\" -Recurse -ErrorAction SilentlyContinue
        
        # Also copy SuiteSparse specific headers
        if (Test-Path "$vcpkgInstalledDir\include\suitesparse") {
            Copy-Item "$vcpkgInstalledDir\include\suitesparse\*" "$env:INSTALL_DIR\include\" -Recurse -ErrorAction SilentlyContinue
        }
        
    - name: Download pre-built OpenBLAS (fallback)
      shell: powershell
      run: |
        Write-Host "Downloading pre-built OpenBLAS..."
        mkdir -Force $env:OPENBLAS_DIR
        wget https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.28/OpenBLAS-0.3.28-x64.zip -OutFile openblas.zip
        7z x openblas.zip -o"$env:OPENBLAS_DIR"
        
        # Copy OpenBLAS to install directory
        Copy-Item "$env:OPENBLAS_DIR\lib\*.lib" "$env:INSTALL_DIR\lib\" -ErrorAction SilentlyContinue
        Copy-Item "$env:OPENBLAS_DIR\bin\*.dll" "$env:INSTALL_DIR\lib\" -ErrorAction SilentlyContinue
        if (Test-Path "$env:OPENBLAS_DIR\include") {
            Copy-Item "$env:OPENBLAS_DIR\include\*" "$env:INSTALL_DIR\include\" -Recurse -ErrorAction SilentlyContinue
        }
        
    - name: Apply Windows patches for BFF
      shell: powershell
      run: |
        Write-Host "Applying Windows compatibility patches..."
        
        # 1. Create custom FindSuiteSparse.cmake that works with vcpkg installation
        $findSuiteSparseLines = @(
            "# Custom FindSuiteSparse for Windows/vcpkg",
            "if(WIN32)",
            "    message(STATUS `"Using custom SuiteSparse configuration from vcpkg`")",
            "",
            "    set(SUITESPARSE_FOUND TRUE)",
            "",
            "    # Set include directories",
            "    set(SUITESPARSE_INCLUDE_DIRS",
            "        `"`${CMAKE_SOURCE_DIR}`/suitesparse-deps/include`"",
            "    )",
            "",
            "    # Set library directories",
            "    set(SUITESPARSE_LIBRARY_DIRS `"`${CMAKE_SOURCE_DIR}`/suitesparse-deps/lib`")",
            "",
            "    # Find all SuiteSparse libraries",
            "    set(SUITESPARSE_LIBRARIES)",
            "",
            "    # Common SuiteSparse libraries (add them if they exist)",
            "    foreach(lib_name suitesparseconfig amd camd ccolamd colamd cholmod metis)",
            "        find_library(`${lib_name}_LIBRARY",
            "            NAMES `${lib_name}",
            "            HINTS `"`${CMAKE_SOURCE_DIR}`/suitesparse-deps/lib`"",
            "        )",
            "        if(`${lib_name}_LIBRARY)",
            "            list(APPEND SUITESPARSE_LIBRARIES `${`${lib_name}_LIBRARY}`)",
            "        endif()",
            "    endforeach()",
            "",
            "    # Add BLAS/LAPACK (OpenBLAS)",
            "    find_library(OPENBLAS_LIBRARY",
            "        NAMES openblas libopenblas",
            "        HINTS `"`${CMAKE_SOURCE_DIR}`/suitesparse-deps/lib`"",
            "    )",
            "    if(OPENBLAS_LIBRARY)",
            "        list(APPEND SUITESPARSE_LIBRARIES `${OPENBLAS_LIBRARY}`)",
            "        set(BLAS_LIBRARIES `${OPENBLAS_LIBRARY}`)",
            "        set(LAPACK_LIBRARIES `${OPENBLAS_LIBRARY}`)",
            "    endif()",
            "",
            "    message(STATUS `"Found SuiteSparse libraries: `${SUITESPARSE_LIBRARIES}`")",
            "    mark_as_advanced(SUITESPARSE_INCLUDE_DIRS SUITESPARSE_LIBRARIES)",
            "endif()"
        )
        
        New-Item -ItemType Directory -Force -Path "cmake"
        ($findSuiteSparseLines -join "`n") | Out-File -FilePath "cmake/FindSuiteSparse.cmake" -Encoding UTF8
        
        # 2. Patch CMakeLists.txt
        $cmakeLists = Get-Content "CMakeLists.txt" -Raw
        $replacementText = '# find_package(SuiteSparse REQUIRED) - Using custom config' + [Environment]::NewLine + 'include(cmake/FindSuiteSparse.cmake)'
        $cmakeLists = $cmakeLists -replace 'find_package\(SuiteSparse REQUIRED\)', $replacementText
        $cmakeLists | Out-File -FilePath "CMakeLists.txt" -Encoding UTF8
        
        # 3. Add OpenBLAS include
        $cmakeLists = Get-Content "CMakeLists.txt" -Raw
        if ($cmakeLists -match 'include_directories\(') {
            $openblasInclude = 'include_directories(' + [Environment]::NewLine + '    ${CMAKE_SOURCE_DIR}/suitesparse-deps/include'
            $cmakeLists = $cmakeLists -replace 'include_directories\(', $openblasInclude
            $cmakeLists | Out-File -FilePath "CMakeLists.txt" -Encoding UTF8
        }
        
        Write-Host "Patches applied successfully!"
        
    - name: Build BFF
      shell: cmd
      run: |
        echo "Configuring BFF..."
        
        mkdir build
        cd build
        
        # Set environment variables for finding dependencies
        set SuiteSparse_DIR=%CD%\..\suitesparse-deps
        set OpenBLAS_DIR=%CD%\..\openblas-install
        
        echo "SuiteSparse directory: %SuiteSparse_DIR%"
        echo "OpenBLAS directory: %OpenBLAS_DIR%"
        
        # List available libraries for debugging
        dir "%SuiteSparse_DIR%\lib"
        
        cmake .. -G "Visual Studio 17 2022" -A x64 ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DCMAKE_PREFIX_PATH="%SuiteSparse_DIR%" ^
          -DBLAS_LIBRARIES="%SuiteSparse_DIR%/lib/libopenblas.lib" ^
          -DLAPACK_LIBRARIES="%SuiteSparse_DIR%/lib/libopenblas.lib"
        
        echo "Building BFF..."
        cmake --build . --config Release --parallel 4
        
    - name: Find and package binaries
      shell: powershell
      run: |
        Write-Host "Searching for built binaries..."
        
        # Create package directory
        New-Item -ItemType Directory -Force -Path "bff-package"
        
        # Find and copy executables
        $exeFiles = Get-ChildItem -Path "." -Recurse -Filter "*.exe" -File | Where-Object {
            $_.DirectoryName -match "Release" -and (
                $_.Name -match "bff" -or 
                $_.Name -match "viewer" -or
                $_.Name -match "gui"
            )
        }
        
        foreach ($exe in $exeFiles) {
            Write-Host "Found: $($exe.FullName)"
            Copy-Item -Path $exe.FullName -Destination "bff-package"
        }
        
        # Find and copy DLLs from build directory
        $dllFiles = Get-ChildItem -Path "." -Recurse -Filter "*.dll" -File | Where-Object {
            $_.DirectoryName -match "Release"
        }
        
        foreach ($dll in $dllFiles) {
            Write-Host "Found DLL: $($dll.Name)"
            Copy-Item -Path $dll.FullName -Destination "bff-package"
        }
        
        # Copy dependencies from SuiteSparse directory
        if (Test-Path "suitesparse-deps/lib/*.dll") {
            Copy-Item "suitesparse-deps/lib/*.dll" "bff-package/" -ErrorAction SilentlyContinue
        }
        
        # Copy OpenBLAS DLL
        if (Test-Path "openblas-install/bin/libopenblas.dll") {
            Copy-Item -Path "openblas-install/bin/libopenblas.dll" -Destination "bff-package"
            Write-Host "Copied: libopenblas.dll"
        }
        
        # Create a README file
        $readmeLines = @(
            "BFF (Boundary First Flattening) Windows Build",
            "=============================================",
            "Build Date: $(Get-Date -Format 'yyyy-MM-dd')",
            "Version: 1.6",
            "",
            "This package contains the Windows binaries for BFF.",
            "To run the application, execute the .exe file in this folder.",
            "",
            "Dependencies included:",
            "- OpenBLAS",
            "- SuiteSparse libraries (built via vcpkg)",
            "- Required runtime DLLs"
        )
        
        $readmeContent = $readmeLines -join "`n"
        $readmeContent | Out-File -FilePath "bff-package/README.txt" -Encoding UTF8
        
        Write-Host "=== Package Contents ==="
        Get-ChildItem -Path "bff-package"
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bff-windows-binaries
        path: bff-package/
        if-no-files-found: error
        retention-days: 7
        
    - name: Create zip archive
      shell: powershell
      run: |
        Write-Host "Creating zip archive..."
        Compress-Archive -Path "bff-package/*" -DestinationPath "bff-windows.zip" -Force
        
    - name: Upload zip artifact
      uses: actions/upload-artifact@v4
      with:
        name: bff-windows-zip
        path: bff-windows.zip
        retention-days: 7
