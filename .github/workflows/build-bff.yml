name: Build BFF Windows Binary

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

env:
  BUILD_TYPE: Release
  FLTK_VERSION: '1.3.9'

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout BFF source code
      uses: actions/checkout@v4
      with:
        repository: 'GeometryCollective/boundary-first-flattening'
        ref: 'v1.6'
        submodules: 'recursive'

    - name: Fix CMakeLists.txt
      shell: powershell
      run: |
        (Get-Content CMakeLists.txt) -replace '^cmake_minimum_required.*', 'cmake_minimum_required(VERSION 3.10)' | Set-Content CMakeLists.txt

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install CMake
      uses: lukka/get-cmake@latest

    - name: Download and install complete dependencies via vcpkg
      shell: powershell
      run: |
        # Install vcpkg
        git clone https://github.com/microsoft/vcpkg
        .\vcpkg\bootstrap-vcpkg.bat
        
        # Install SuiteSparse with all features and dependencies
        .\vcpkg\vcpkg install suitesparse[metis]:x64-windows
        .\vcpkg\vcpkg install openblas:x64-windows  # BLAS/LAPACK implementation
        .\vcpkg\vcpkg install lapack-reference:x64-windows  # Reference LAPACK
        .\vcpkg\vcpkg install fltk:x64-windows
        .\vcpkg\vcpkg integrate install
        
        # Set vcpkg toolchain
        $vcpkgToolchain = "$pwd\vcpkg\scripts\buildsystems\vcpkg.cmake"
        echo "VCPKG_TOOLCHAIN=$vcpkgToolchain" >> $env:GITHUB_ENV
        
        # Set include directory for SuiteSparse headers
        $suiteSparseInclude = "$pwd\vcpkg\installed\x64-windows\include"
        echo "SUITESPARSE_INCLUDE=$suiteSparseInclude" >> $env:GITHUB_ENV

    - name: Configure BFF with explicit paths
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "build"
        Set-Location build
        
        # Set environment variables for SuiteSparse
        $env:SUITESPARSE_DIR = "$pwd\..\vcpkg\installed\x64-windows"
        $env:BLAS_DIR = "$pwd\..\vcpkg\installed\x64-windows"
        $env:LAPACK_DIR = "$pwd\..\vcpkg\installed\x64-windows"
        
        # Configure with explicit paths
        cmake .. `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
          -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_TOOLCHAIN }}" `
          -DCMAKE_INSTALL_PREFIX="$pwd\install" `
          -DSUITESPARSE_INCLUDE_DIR_HINTS="${{ env.SUITESPARSE_INCLUDE }}" `
          -DSUITESPARSE_LIBRARY_DIR_HINTS="$pwd\..\vcpkg\installed\x64-windows\lib" `
          -DSUITESPARSE_BLAS_LIBRARY="$pwd\..\vcpkg\installed\x64-windows\lib\openblas.lib" `
          -DSUITESPARSE_LAPACK_LIBRARY="$pwd\..\vcpkg\installed\x64-windows\lib\lapack.lib" `
          -DENABLE_BFF_CLI=ON `
          -DENABLE_BFF_GUI=ON `
          -DVCPKG_TARGET_TRIPLET=x64-windows `
          -DCMAKE_POLICY_DEFAULT_CMP0074=NEW  # FindPackage handles <Package>_ROOT variables
        
        Write-Host "CMake configuration completed"

    - name: Build BFF
      shell: powershell
      run: |
        Set-Location build
        cmake --build . --config ${{ env.BUILD_TYPE }} --target install -- /m
        
        # Verify build
        if (Test-Path "install\bin\bff-gui.exe") {
          Write-Host "SUCCESS: bff-gui.exe built"
        } else {
          Write-Host "Looking for executables..."
          Get-ChildItem . -Recurse -Filter "*.exe" | ForEach-Object {
            Write-Host "Found: $($_.FullName)"
            New-Item -ItemType Directory -Force -Path "install\bin" -ErrorAction SilentlyContinue
            Copy-Item $_.FullName -Destination "install\bin\" -Force
          }
        }

    - name: Patch FindSuiteSparse.cmake to fix header search
      if: failure()
      shell: powershell
      run: |
        # Temporarily patch the FindSuiteSparse.cmake to work with vcpkg layout
        $findSuiteSparse = "cmake/FindSuiteSparse.cmake"
        if (Test-Path $findSuiteSparse) {
          $content = Get-Content $findSuiteSparse -Raw
          
          # Replace the problematic final check
          $newContent = $content -replace 'if\(NOT SuiteSparse_FIND_QUIETLY\)\s+message\(STATUS "Finish to FindSuiteSparse\.cmake => SuiteSparse_FOUND=\$\{SuiteSparse_FOUND\}"\)\s+endif\(\)', 'if(NOT SuiteSparse_FIND_QUIETLY)
  message(STATUS "Finish to FindSuiteSparse.cmake => SuiteSparse_FOUND=${SuiteSparse_FOUND}")
endif()
if(WIN32 AND SuiteSparse_AMD_FOUND AND SuiteSparse_CHOLMOD_FOUND)
  # On Windows with vcpkg, we may have libraries but not all headers
  # Allow build to proceed if we have the essential components
  set(SuiteSparse_FOUND TRUE)
  message(STATUS "Overriding SuiteSparse_FOUND=TRUE for Windows vcpkg build")
endif()'
          
          Set-Content $findSuiteSparse -Value $newContent -NoNewline
          Write-Host "Patched FindSuiteSparse.cmake"
          
          # Try configuration again
          Set-Location build
          cmake .. `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_TOOLCHAIN }}" `
            -DCMAKE_INSTALL_PREFIX="$pwd\install" `
            -DENABLE_BFF_CLI=ON `
            -DENABLE_BFF_GUI=ON `
            -DVCPKG_TARGET_TRIPLET=x64-windows
            
          cmake --build . --config ${{ env.BUILD_TYPE }} --target install -- /m
        }

    - name: Collect dependencies
      shell: powershell
      run: |
        # Create distribution
        New-Item -ItemType Directory -Force -Path "dist"
        
        # Copy executables
        if (Test-Path "build\install\bin\*.exe") {
          Copy-Item "build\install\bin\*.exe" -Destination "dist\" -Force
          Write-Host "Copied executables"
        }
        
        # Copy all DLLs from vcpkg
        if (Test-Path "vcpkg\installed\x64-windows\bin\*.dll") {
          Copy-Item "vcpkg\installed\x64-windows\bin\*.dll" -Destination "dist\" -Force
          Write-Host "Copied vcpkg DLLs"
        }
        
        # Also copy DLLs from debug bin if they exist
        if (Test-Path "vcpkg\installed\x64-windows\debug\bin\*.dll") {
          Copy-Item "vcpkg\installed\x64-windows\debug\bin\*.dll" -Destination "dist\" -Force
          Write-Host "Copied debug DLLs"
        }

    - name: Create distribution package
      shell: powershell
      run: |
        # Create README using array approach
        $readmeLines = @()
        $readmeLines += "# BFF (Boundary First Flattening) v1.6 - Windows Binary"
        $readmeLines += ""
        $readmeLines += "Requirements:"
        $readmeLines += "- Windows 10 or later"
        $readmeLines += "- Visual C++ Redistributable"
        $readmeLines += ""
        $readmeLines += "Usage:"
        $readmeLines += "- Run bff-gui.exe for graphical interface"
        $readmeLines += "- Run bff.exe for command line"
        $readmeLines += ""
        $readmeLines += "Built using:"
        $readmeLines += "- vcpkg for dependency management"
        $readmeLines += "- SuiteSparse with OpenBLAS"
        $readmeLines += "- FLTK GUI library"
        $readmeLines += "- MSVC compiler"
        
        $readmeLines | Out-File -FilePath "dist\README.txt" -Encoding UTF8
        
        # Create ZIP
        Compress-Archive -Path "dist\*" -DestinationPath "bff-windows-v1.6.zip" -Force

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: bff-windows-binary
        path: bff-windows-v1.6.zip
        retention-days: 30
