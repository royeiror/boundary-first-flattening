name: Build BFF Windows Binary

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

env:
  BUILD_TYPE: Release
  FLTK_VERSION: '1.3.9'

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout BFF source code
      uses: actions/checkout@v4
      with:
        repository: 'GeometryCollective/boundary-first-flattening'
        ref: 'v1.6'
        submodules: 'recursive'

    - name: Fix CMakeLists.txt
      shell: powershell
      run: |
        # Simple fix for cmake_minimum_required
        (Get-Content CMakeLists.txt) -replace '^cmake_minimum_required.*', 'cmake_minimum_required(VERSION 3.5)' | Set-Content CMakeLists.txt

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install CMake
      uses: lukka/get-cmake@latest

    - name: Download SuiteSparse
      shell: powershell
      run: |
        # Download the repository
        Invoke-WebRequest -Uri "https://github.com/royeiror/suitesparse-metis-for-windows/archive/refs/heads/master.zip" -OutFile "suitesparse.zip"
        Expand-Archive -Path "suitesparse.zip" -DestinationPath "." -Force
        
        # Find and prepare SuiteSparse
        $source = "suitesparse-metis-for-windows-master"
        New-Item -ItemType Directory -Force -Path "C:\suitesparse"
        
        # Copy everything
        if (Test-Path $source) {
          Get-ChildItem $source | Copy-Item -Destination "C:\suitesparse\" -Recurse -Force
        }
        
        # Create expected structure
        New-Item -ItemType Directory -Force -Path "C:\suitesparse\include\suitesparse" -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Force -Path "C:\suitesparse\lib" -ErrorAction SilentlyContinue
        
        # Move .h files to include/suitesparse
        if (Test-Path "C:\suitesparse\*.h") {
          Move-Item "C:\suitesparse\*.h" -Destination "C:\suitesparse\include\suitesparse\" -Force
        }
        if (Test-Path "C:\suitesparse\include\*.h") {
          Move-Item "C:\suitesparse\include\*.h" -Destination "C:\suitesparse\include\suitesparse\" -Force
        }
        
        Write-Host "SuiteSparse prepared at C:\suitesparse"

    - name: Build FLTK
      shell: powershell
      run: |
        # Download and extract FLTK
        $url = "https://github.com/fltk/fltk/archive/refs/tags/release-${{ env.FLTK_VERSION }}.tar.gz"
        Invoke-WebRequest -Uri $url -OutFile "fltk.tar.gz"
        tar -xzf fltk.tar.gz
        
        # Build FLTK
        New-Item -ItemType Directory -Force -Path "fltk-build"
        Set-Location fltk-build
        
        cmake ../fltk-release-${{ env.FLTK_VERSION }} `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
          -DCMAKE_INSTALL_PREFIX="C:\fltk" `
          -DOPTION_BUILD_SHARED_LIBS=OFF
        
        cmake --build . --config ${{ env.BUILD_TYPE }} --target install -- /m

    - name: Configure BFF
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "build"
        Set-Location build
        
        # Manual SuiteSparse configuration
        $suiteSparseInclude = "C:\suitesparse\include\suitesparse"
        $suiteSparseLib = "C:\suitesparse\lib"
        
        # Configure BFF with manual overrides
        cmake .. `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
          -DSUITESPARSE_INCLUDE_DIR="$suiteSparseInclude" `
          -DSUITESPARSE_LIBRARY_DIR="$suiteSparseLib" `
          -DFLTK_DIR="C:\fltk\lib\cmake\fltk" `
          -DENABLE_BFF_CLI=ON `
          -DENABLE_BFF_GUI=ON `
          -DCMAKE_INSTALL_PREFIX="$pwd\install"

    - name: Build BFF
      shell: powershell
      run: |
        Set-Location build
        cmake --build . --config ${{ env.BUILD_TYPE }} -- /m
        
        # Find and copy executables
        $exes = Get-ChildItem . -Recurse -Filter "*.exe"
        if ($exes) {
          New-Item -ItemType Directory -Force -Path "install\bin"
          foreach ($exe in $exes) {
            Copy-Item $exe.FullName -Destination "install\bin\" -Force
            Write-Host "Copied: $($exe.Name)"
          }
        }

    - name: Create distribution package
      shell: powershell
      run: |
        # Create distribution folder
        New-Item -ItemType Directory -Force -Path "dist"
        
        # Copy executables
        if (Test-Path "build\install\bin\*.exe") {
          Copy-Item "build\install\bin\*.exe" -Destination "dist\" -Force
        }
        
        # Copy DLLs from SuiteSparse
        $dlls = Get-ChildItem "C:\suitesparse" -Recurse -Filter "*.dll"
        if ($dlls) {
          foreach ($dll in $dlls) {
            Copy-Item $dll.FullName -Destination "dist\" -Force
            Write-Host "Copied DLL: $($dll.Name)"
          }
        }
        
        # Create README without problematic here-string
        $readmeLines = @()
        $readmeLines += "# BFF (Boundary First Flattening) v1.6 - Windows Binary"
        $readmeLines += ""
        $readmeLines += "Requirements:"
        $readmeLines += "- Windows 10 or later"
        $readmeLines += "- Visual C++ Redistributable"
        $readmeLines += ""
        $readmeLines += "Usage:"
        $readmeLines += "- Run bff-gui.exe for graphical interface"
        $readmeLines += "- Run bff.exe for command line"
        
        $readmeLines | Out-File -FilePath "dist\README.txt"
        
        # Create ZIP
        Compress-Archive -Path "dist\*" -DestinationPath "bff-windows-v1.6.zip" -Force

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: bff-windows-binary
        path: bff-windows-v1.6.zip
        retention-days: 30
