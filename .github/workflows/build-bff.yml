name: Build BFF Windows Binary

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

env:
  BUILD_TYPE: Release
  FLTK_VERSION: '1.3.9'

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout BFF source code
      uses: actions/checkout@v4
      with:
        repository: 'GeometryCollective/boundary-first-flattening'
        ref: 'v1.6'
        submodules: 'recursive'

    - name: Fix CMakeLists.txt
      shell: powershell
      run: |
        (Get-Content CMakeLists.txt) -replace '^cmake_minimum_required.*', 'cmake_minimum_required(VERSION 3.10)' | Set-Content CMakeLists.txt

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install CMake
      uses: lukka/get-cmake@latest

    - name: Download and install SuiteSparse via vcpkg
      shell: powershell
      run: |
        # Install vcpkg
        git clone https://github.com/microsoft/vcpkg
        .\vcpkg\bootstrap-vcpkg.bat
        
        # Install dependencies
        .\vcpkg\vcpkg install suitesparse:x64-windows
        .\vcpkg\vcpkg install fltk:x64-windows
        .\vcpkg\vcpkg integrate install
        
        # Set vcpkg toolchain
        $vcpkgToolchain = "$pwd\vcpkg\scripts\buildsystems\vcpkg.cmake"
        echo "VCPKG_TOOLCHAIN=$vcpkgToolchain" >> $env:GITHUB_ENV

    - name: Build FLTK (optional, if vcpkg version doesn't work)
      shell: powershell
      run: |
        # Only build FLTK if needed
        $fltkUrl = "https://github.com/fltk/fltk/archive/refs/tags/release-${{ env.FLTK_VERSION }}.tar.gz"
        Invoke-WebRequest -Uri $fltkUrl -OutFile "fltk.tar.gz"
        tar -xzf fltk.tar.gz
        
        New-Item -ItemType Directory -Force -Path "fltk-build"
        Set-Location fltk-build
        
        cmake ../fltk-release-${{ env.FLTK_VERSION }} `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
          -DCMAKE_INSTALL_PREFIX="C:\fltk" `
          -DOPTION_BUILD_SHARED_LIBS=OFF
        
        cmake --build . --config ${{ env.BUILD_TYPE }} --target install -- /m

    - name: Configure BFF with vcpkg
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "build"
        Set-Location build
        
        # Use vcpkg toolchain
        cmake .. `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
          -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_TOOLCHAIN }}" `
          -DCMAKE_INSTALL_PREFIX="$pwd\install" `
          -DENABLE_BFF_CLI=ON `
          -DENABLE_BFF_GUI=ON `
          -DVCPKG_TARGET_TRIPLET=x64-windows
        
        Write-Host "CMake configuration completed"

    - name: Build BFF
      shell: powershell
      run: |
        Set-Location build
        cmake --build . --config ${{ env.BUILD_TYPE }} --target install -- /m
        
        # Verify build
        if (Test-Path "install\bin\bff-gui.exe") {
          Write-Host "SUCCESS: bff-gui.exe built"
        } else {
          Write-Host "Looking for executables..."
          Get-ChildItem . -Recurse -Filter "*.exe" | ForEach-Object {
            Write-Host "Found: $($_.FullName)"
            New-Item -ItemType Directory -Force -Path "install\bin" -ErrorAction SilentlyContinue
            Copy-Item $_.FullName -Destination "install\bin\" -Force
          }
        }

    - name: Collect dependencies
      shell: powershell
      run: |
        # Create distribution
        New-Item -ItemType Directory -Force -Path "dist"
        
        # Copy executables
        if (Test-Path "build\install\bin\*.exe") {
          Copy-Item "build\install\bin\*.exe" -Destination "dist\" -Force
          Write-Host "Copied executables"
        }
        
        # Find and copy required DLLs
        Write-Host "Checking dependencies..."
        $exes = Get-ChildItem "dist\*.exe"
        foreach ($exe in $exes) {
          Write-Host "Dependencies for $($exe.Name):"
          dumpbin /DEPENDENTS $exe.FullName | Select-String ".dll"
        }
        
        # Copy vcpkg installed DLLs
        if (Test-Path "vcpkg\installed\x64-windows\bin\*.dll") {
          Copy-Item "vcpkg\installed\x64-windows\bin\*.dll" -Destination "dist\" -Force
          Write-Host "Copied vcpkg DLLs"
        }

    - name: Create distribution package
      shell: powershell
      run: |
        # Create README
        $readmeContent = @'
# BFF (Boundary First Flattening) v1.6 - Windows Binary

Requirements:
- Windows 10 or later
- Visual C++ Redistributable

Usage:
- Run bff-gui.exe for graphical interface
- Run bff.exe for command line

Built using:
- vcpkg for dependency management
- SuiteSparse from vcpkg
- FLTK from vcpkg
- MSVC compiler
'@
        
        Set-Content -Path "dist\README.txt" -Value $readmeContent
        
        # Create ZIP
        Compress-Archive -Path "dist\*" -DestinationPath "bff-windows-v1.6.zip" -Force

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: bff-windows-binary
        path: bff-windows-v1.6.zip
        retention-days: 30
