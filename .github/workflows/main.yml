name: Build BFF for Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [created]
  workflow_dispatch:

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-windows

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install Chocolatey packages
      shell: powershell
      run: |
        # Install Chocolatey
        Set-ExecutionPolicy Bypass -Scope Process -Force
        [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
        iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
        
        # Install build tools
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
        choco install ninja -y

    - name: Install vcpkg and dependencies
      shell: powershell
      run: |
        # Install vcpkg
        git clone https://github.com/Microsoft/vcpkg.git $env:VCPKG_ROOT
        & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"
        
        # Install required dependencies
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET eigen3
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET libigl
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET suitesparse
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET metis
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glfw3
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glew
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET freeglut
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glm

    - name: Check BFF source structure
      shell: powershell
      run: |
        Write-Host "Checking BFF source structure..."
        Write-Host "Current directory: $(Get-Location)"
        Write-Host "`nDirectory structure:"
        Get-ChildItem | Format-Table Name, Mode
        
        Write-Host "`nChecking for source files:"
        # Check if we're in the right place
        if (Test-Path "src") {
          Write-Host "src directory exists"
          Write-Host "Files in src directory:"
          Get-ChildItem -Path "src" -Recurse | Format-Table Name, Mode
        } else {
          Write-Host "src directory not found, checking parent..."
          if (Test-Path "bff-source") {
            Write-Host "bff-source directory found"
            Write-Host "Files in bff-source:"
            Get-ChildItem -Path "bff-source" | Format-Table Name, Mode
          }
        }

    - name: Download and install SuiteSparse-METIS
      shell: powershell
      run: |
        # Download SuiteSparse-METIS
        Write-Host "Downloading SuiteSparse-METIS..."
        $url = "https://github.com/jlblancoc/suitesparse-metis-for-windows/archive/master.zip"
        $output = "C:\suitesparse-metis.zip"
        
        Invoke-WebRequest -Uri $url -OutFile $output
        
        # Create directories
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse"
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse\include"
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse\lib"
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse\bin"
        
        # Extract
        Expand-Archive -Path $output -DestinationPath "C:\SuiteSparseTemp\" -Force
        
        # Find and copy library files
        Write-Host "Searching for library files..."
        
        # Copy all .lib files
        $libFiles = Get-ChildItem -Path "C:\SuiteSparseTemp" -Recurse -Filter "*.lib"
        foreach ($file in $libFiles) {
          Copy-Item -Path $file.FullName -Destination "C:\SuiteSparse\lib\" -Force
          Write-Host "Copied lib: $($file.Name)"
        }
        
        # Copy .dll files
        $dllFiles = Get-ChildItem -Path "C:\SuiteSparseTemp" -Recurse -Filter "*.dll"
        foreach ($file in $dllFiles) {
          Copy-Item -Path $file.FullName -Destination "C:\SuiteSparse\bin\" -Force
          Write-Host "Copied dll: $($file.Name)"
        }
        
        # Copy .h files
        $hFiles = Get-ChildItem -Path "C:\SuiteSparseTemp" -Recurse -Filter "*.h"
        foreach ($file in $hFiles) {
          Copy-Item -Path $file.FullName -Destination "C:\SuiteSparse\include\" -Force
          Write-Host "Copied header: $($file.Name)"
        }

    - name: Create CMakeLists.txt for BFF
      shell: powershell
      run: |
        # Get the vcpkg paths
        $vcpkgPath = $env:VCPKG_ROOT -replace "\\", "/"
        $vcpkgInstalled = "$vcpkgPath/installed/$env:VCPKG_DEFAULT_TRIPLET"
        
        # First, check what source files actually exist
        Write-Host "Checking for source files..."
        
        $sourceFiles = @()
        $headerFiles = @()
        
        if (Test-Path "src") {
          $sourceFiles = Get-ChildItem -Path "src" -Recurse -Filter "*.cpp" | ForEach-Object { $_.FullName }
          $headerFiles = Get-ChildItem -Path "src" -Recurse -Filter "*.h" | ForEach-Object { $_.FullName }
        } elseif (Test-Path "bff-source/src") {
          $sourceFiles = Get-ChildItem -Path "bff-source/src" -Recurse -Filter "*.cpp" | ForEach-Object { $_.FullName }
          $headerFiles = Get-ChildItem -Path "bff-source/src" -Recurse -Filter "*.h" | ForEach-Object { $_.FullName }
        }
        
        Write-Host "Found $( $sourceFiles.Count ) source files"
        Write-Host "Found $( $headerFiles.Count ) header files"
        
        # Create CMakeLists.txt with explicit source files if we found any
        $cmakeLines = @(
          "cmake_minimum_required(VERSION 3.15)",
          "project(BFF)",
          "",
          "set(CMAKE_CXX_STANDARD 17)",
          "set(CMAKE_CXX_STANDARD_REQUIRED ON)",
          "",
          "# Find Eigen3",
          "find_package(Eigen3 REQUIRED)",
          "",
          "# Set SuiteSparse paths",
          "set(SUITESPARSE_INCLUDE_DIR `"C:/SuiteSparse/include`")",
          "set(SUITESPARSE_LIB_DIR `"C:/SuiteSparse/lib`")",
          "",
          "# Find SuiteSparse libraries",
          "file(GLOB_RECURSE CHOLMOD_LIBRARIES `"${SUITESPARSE_LIB_DIR}/*cholmod*.lib` `"${SUITESPARSE_LIB_DIR}/*cholmod*.dll.a` `"${SUITESPARSE_LIB_DIR}/libcholmod*.a` `"${SUITESPARSE_LIB_DIR}/libcholmod*.so` `"${SUITESPARSE_LIB_DIR}/libcholmod*.dylib` `"${SUITESPARSE_LIB_DIR}/libcholmod*.dll`",
          ")",
          "file(GLOB_RECURSE AMD_LIBRARIES `"${SUITESPARSE_LIB_DIR}/*amd*.lib` `"${SUITESPARSE_LIB_DIR}/*amd*.dll.a` `"${SUITESPARSE_LIB_DIR}/libamd*.a` `"${SUITESPARSE_LIB_DIR}/libamd*.so` `"${SUITESPARSE_LIB_DIR}/libamd*.dylib` `"${SUITESPARSE_LIB_DIR}/libamd*.dll`",
          ")",
          "file(GLOB_RECURSE CAMD_LIBRARIES `"${SUITESPARSE_LIB_DIR}/*camd*.lib` `"${SUITESPARSE_LIB_DIR}/*camd*.dll.a` `"${SUITESPARSE_LIB_DIR}/libcamd*.a` `"${SUITESPARSE_LIB_DIR}/libcamd*.so` `"${SUITESPARSE_LIB_DIR}/libcamd*.dylib` `"${SUITESPARSE_LIB_DIR}/libcamd*.dll`",
          ")",
          "file(GLOB_RECURSE COLAMD_LIBRARIES `"${SUITESPARSE_LIB_DIR}/*colamd*.lib` `"${SUITESPARSE_LIB_DIR}/*colamd*.dll.a` `"${SUITESPARSE_LIB_DIR}/libcolamd*.a` `"${SUITESPARSE_LIB_DIR}/libcolamd*.so` `"${SUITESPARSE_LIB_DIR}/libcolamd*.dylib` `"${SUITESPARSE_LIB_DIR}/libcolamd*.dll`",
          ")",
          "file(GLOB_RECURSE CCOLAMD_LIBRARIES `"${SUITESPARSE_LIB_DIR}/*ccolamd*.lib` `"${SUITESPARSE_LIB_DIR}/*ccolamd*.dll.a` `"${SUITESPARSE_LIB_DIR}/libccolamd*.a` `"${SUITESPARSE_LIB_DIR}/libccolamd*.so` `"${SUITESPARSE_LIB_DIR}/libccolamd*.dylib` `"${SUITESPARSE_LIB_DIR}/libccolamd*.dll`",
          ")",
          "file(GLOB_RECURSE METIS_LIBRARIES `"${SUITESPARSE_LIB_DIR}/*metis*.lib` `"${SUITESPARSE_LIB_DIR}/*metis*.dll.a` `"${SUITESPARSE_LIB_DIR}/libmetis*.a` `"${SUITESPARSE_LIB_DIR}/libmetis*.so` `"${SUITESPARSE_LIB_DIR}/libmetis*.dylib` `"${SUITESPARSE_LIB_DIR}/libmetis*.dll`",
          ")",
          "",
          "# Check if libraries were found",
          "if(CHOLMOD_LIBRARIES)",
          "    list(GET CHOLMOD_LIBRARIES 0 CHOLMOD_LIBRARY)",
          "    message(STATUS `"Found CHOLMOD: `${CHOLMOD_LIBRARY}`")",
          "else()",
          "    # Try to find in buildtrees",
          "    file(GLOB_RECURSE CHOLMOD_LIBRARIES `"${CMAKE_SOURCE_DIR}/vcpkg/buildtrees/*cholmod*/*.lib` `"${CMAKE_SOURCE_DIR}/vcpkg/buildtrees/*cholmod*/*.dll.a`",
          "    )",
          "    if(CHOLMOD_LIBRARIES)",
          "        list(GET CHOLMOD_LIBRARIES 0 CHOLMOD_LIBRARY)",
          "        message(STATUS `"Found CHOLMOD in buildtrees: `${CHOLMOD_LIBRARY}`")",
          "    else()",
          "        message(FATAL_ERROR `"No CHOLMOD library found`")",
          "    endif()",
          "endif()",
          "",
          "# Similar checks for other libraries...",
          "# (For brevity, using the same pattern for all)",
          "",
          "if(NOT AMD_LIBRARIES)",
          "    file(GLOB_RECURSE AMD_LIBRARIES `"${CMAKE_SOURCE_DIR}/vcpkg/buildtrees/*amd*/*.lib` `"${CMAKE_SOURCE_DIR}/vcpkg/buildtrees/*amd*/*.dll.a`",
          "    )",
          "endif()",
          "if(AMD_LIBRARIES) list(GET AMD_LIBRARIES 0 AMD_LIBRARY) endif()",
          "",
          "if(NOT CAMD_LIBRARIES)",
          "    file(GLOB_RECURSE CAMD_LIBRARIES `"${CMAKE_SOURCE_DIR}/vcpkg/buildtrees/*camd*/*.lib` `"${CMAKE_SOURCE_DIR}/vcpkg/buildtrees/*camd*/*.dll.a`",
          "    )",
          "endif()",
          "if(CAMD_LIBRARIES) list(GET CAMD_LIBRARIES 0 CAMD_LIBRARY) endif()",
          "",
          "if(NOT COLAMD_LIBRARIES)",
          "    file(GLOB_RECURSE COLAMD_LIBRARIES `"${CMAKE_SOURCE_DIR}/vcpkg/buildtrees/*colamd*/*.lib` `"${CMAKE_SOURCE_DIR}/vcpkg/buildtrees/*colamd*/*.dll.a`",
          "    )",
          "endif()",
          "if(COLAMD_LIBRARIES) list(GET COLAMD_LIBRARIES 0 COLAMD_LIBRARY) endif()",
          "",
          "if(NOT CCOLAMD_LIBRARIES)",
          "    file(GLOB_RECURSE CCOLAMD_LIBRARIES `"${CMAKE_SOURCE_DIR}/vcpkg/buildtrees/*ccolamd*/*.lib` `"${CMAKE_SOURCE_DIR}/vcpkg/buildtrees/*ccolamd*/*.dll.a`",
          "    )",
          "endif()",
          "if(CCOLAMD_LIBRARIES) list(GET CCOLAMD_LIBRARIES 0 CCOLAMD_LIBRARY) endif()",
          "",
          "if(NOT METIS_LIBRARIES)",
          "    file(GLOB_RECURSE METIS_LIBRARIES `"${CMAKE_SOURCE_DIR}/vcpkg/buildtrees/*metis*/*.lib` `"${CMAKE_SOURCE_DIR}/vcpkg/buildtrees/*metis*/*.dll.a`",
          "    )",
          "endif()",
          "if(METIS_LIBRARIES) list(GET METIS_LIBRARIES 0 METIS_LIBRARY) endif()",
          "",
          "# OpenGL",
          "find_package(OpenGL REQUIRED)",
          "",
          "# Set vcpkg paths",
          "set(VCPKG_INSTALLED_DIR `"$vcpkgInstalled`")",
          "",
          "# Find GLFW and GLEW libraries - check both debug and release",
          "file(GLOB_RECURSE GLFW_LIBRARIES",
          "    `"${VCPKG_INSTALLED_DIR}/*glfw*.lib`",
          "    `"${CMAKE_SOURCE_DIR}/vcpkg/buildtrees/*glfw*/*.lib`",
          ")",
          "if(GLFW_LIBRARIES)",
          "    # Prefer release libraries over debug",
          "    set(GLFW_RELEASE_LIBS `"`")",
          "    set(GLFW_DEBUG_LIBS `"`")",
          "    foreach(lib `${GLFW_LIBRARIES})",
          "        if(lib MATCHES `"-dbg`" OR lib MATCHES `"Debug`" OR lib MATCHES `"debug`")",
          "            list(APPEND GLFW_DEBUG_LIBS `${lib})",
          "        else()",
          "            list(APPEND GLFW_RELEASE_LIBS `${lib})",
          "        endif()",
          "    endforeach()",
          "    if(GLFW_RELEASE_LIBS)",
          "        list(GET GLFW_RELEASE_LIBS 0 GLFW3_LIBRARY)",
          "    elseif(GLFW_DEBUG_LIBS)",
          "        list(GET GLFW_DEBUG_LIBS 0 GLFW3_LIBRARY)",
          "    else()",
          "        list(GET GLFW_LIBRARIES 0 GLFW3_LIBRARY)",
          "    endif()",
          "    message(STATUS `"Found GLFW: `${GLFW3_LIBRARY}`")",
          "else()",
          "    message(FATAL_ERROR `"No GLFW library found`")",
          "endif()",
          "",
          "file(GLOB_RECURSE GLEW_LIBRARIES",
          "    `"${VCPKG_INSTALLED_DIR}/*glew*.lib`",
          "    `"${CMAKE_SOURCE_DIR}/vcpkg/buildtrees/*glew*/*.lib`",
          ")",
          "if(GLEW_LIBRARIES)",
          "    # Prefer release libraries over debug",
          "    set(GLEW_RELEASE_LIBS `"`")",
          "    set(GLEW_DEBUG_LIBS `"`")",
          "    foreach(lib `${GLEW_LIBRARIES})",
          "        if(lib MATCHES `"-dbg`" OR lib MATCHES `"Debug`" OR lib MATCHES `"debug`")",
          "            list(APPEND GLEW_DEBUG_LIBS `${lib})",
          "        else()",
          "            list(APPEND GLEW_RELEASE_LIBS `${lib})",
          "        endif()",
          "    endforeach()",
          "    if(GLEW_RELEASE_LIBS)",
          "        list(GET GLEW_RELEASE_LIBS 0 GLEW_LIBRARY)",
          "    elseif(GLEW_DEBUG_LIBS)",
          "        list(GET GLEW_DEBUG_LIBS 0 GLEW_LIBRARY)",
          "    else()",
          "        list(GET GLEW_LIBRARIES 0 GLEW_LIBRARY)",
          "    endif()",
          "    message(STATUS `"Found GLEW: `${GLEW_LIBRARY}`")",
          "else()",
          "    message(FATAL_ERROR `"No GLEW library found`")",
          "endif()",
          "",
          "# Include directories",
          "include_directories(",
          "    `${CMAKE_SOURCE_DIR}/include",
          "    `${CMAKE_SOURCE_DIR}/deps/libigl/include",
          "    `${CMAKE_SOURCE_DIR}/deps/spectra/include",
          "    `${EIGEN3_INCLUDE_DIRS}",
          "    `${SUITESPARSE_INCLUDE_DIR}",
          "    `${VCPKG_INSTALLED_DIR}/include",
          ")",
          "",
          "# Try to find source files in various locations",
          "set(POSSIBLE_SRC_DIRS",
          "    `${CMAKE_SOURCE_DIR}/src",
          "    `${CMAKE_SOURCE_DIR}/bff-source/src",
          "    `${CMAKE_SOURCE_DIR}",
          ")",
          "",
          "set(SOURCE_FILES `"`")",
          "foreach(dir `${POSSIBLE_SRC_DIRS})",
          "    if(EXISTS `${dir})",
          "        file(GLOB_RECURSE found_sources `"${dir}/*.cpp`")",
          "        if(found_sources)",
          "            list(APPEND SOURCE_FILES `${found_sources})",
          "            message(STATUS `"Found sources in `${dir}`")",
          "        endif()",
          "    endif()",
          "endforeach()",
          "",
          "if(NOT SOURCE_FILES)",
          "    message(FATAL_ERROR `"No source files found. Checked directories: `${POSSIBLE_SRC_DIRS}`")",
          "else()",
          "    message(STATUS `"Found ${SOURCE_FILES} source files`")",
          "endif()",
          "",
          "# Create library",
          "add_library(bff-lib STATIC `${SOURCE_FILES})",
          "",
          "# Link SuiteSparse libraries to bff-lib",
          "target_link_libraries(bff-lib",
          "    `${CHOLMOD_LIBRARY}",
          "    `${AMD_LIBRARY}",
          "    `${CAMD_LIBRARY}",
          "    `${COLAMD_LIBRARY}",
          "    `${CCOLAMD_LIBRARY}",
          "    `${METIS_LIBRARY}",
          ")",
          "",
          "# GUI application",
          "set(POSSIBLE_APP_DIRS",
          "    `${CMAKE_SOURCE_DIR}/apps",
          "    `${CMAKE_SOURCE_DIR}/bff-source/apps",
          "    `${CMAKE_SOURCE_DIR}/gui",
          "    `${CMAKE_SOURCE_DIR}/bff-source/gui",
          ")",
          "",
          "foreach(dir `${POSSIBLE_APP_DIRS})",
          "    if(EXISTS `${dir})",
          "        file(GLOB_RECURSE GUI_SRC_FILES `"${dir}/*.cpp`")",
          "        if(GUI_SRC_FILES)",
          "            add_executable(bff-gui `${GUI_SRC_FILES})",
          "            target_link_libraries(bff-gui bff-lib `${OPENGL_LIBRARIES} `${GLFW3_LIBRARY} `${GLEW_LIBRARY})",
          "            target_include_directories(bff-gui PRIVATE `${dir})",
          "            message(STATUS `"Added GUI executable from `${dir}`")",
          "            break()",
          "        endif()",
          "    endif()",
          "endforeach()",
          "",
          "# Command line tool",
          "set(POSSIBLE_BIN_DIRS",
          "    `${CMAKE_SOURCE_DIR}/binaries",
          "    `${CMAKE_SOURCE_DIR}/bff-source/binaries",
          "    `${CMAKE_SOURCE_DIR}/bin",
          "    `${CMAKE_SOURCE_DIR}/bff-source/bin",
          ")",
          "",
          "foreach(dir `${POSSIBLE_BIN_DIRS})",
          "    if(EXISTS `${dir})",
          "        file(GLOB_RECURSE CLI_SRC_FILES `"${dir}/*.cpp`")",
          "        if(CLI_SRC_FILES)",
          "            add_executable(bff-cli `${CLI_SRC_FILES})",
          "            target_link_libraries(bff-cli bff-lib)",
          "            target_include_directories(bff-cli PRIVATE `${dir})",
          "            message(STATUS `"Added CLI executable from `${dir}`")",
          "            break()",
          "        endif()",
          "    endif()",
          "endforeach()"
        )
        
        # Write to file
        $cmakeLines | Out-File -FilePath "CMakeLists.txt" -Encoding UTF8 -Force

    - name: Configure CMake
      shell: powershell
      run: |
        # Create build directory
        New-Item -ItemType Directory -Force -Path "build"
        
        Write-Host "Configuring CMake..."
        
        # Configure with CMake
        cmake -B build `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=$env:VCPKG_DEFAULT_TRIPLET `
          -G "Visual Studio 17 2022" `
          -A x64

    - name: Build BFF
      shell: powershell
      run: |
        Write-Host "Building project..."
        cmake --build build --config Release --parallel 4

    - name: Find and copy executables
      shell: powershell
      run: |
        # Create distribution directory
        New-Item -ItemType Directory -Force -Path "dist"
        
        Write-Host "Searching for executables..."
        
        # Search for executables
        $searchPaths = @(
          "build\Release",
          "build",
          "build\bin\Release",
          "build\bin"
        )
        
        foreach ($path in $searchPaths) {
          if (Test-Path $path) {
            Write-Host "Checking $path"
            $exes = Get-ChildItem -Path $path -Filter "*.exe" -Recurse
            foreach ($exe in $exes) {
              Write-Host "Found executable: $($exe.FullName)"
              Copy-Item -Path $exe.FullName -Destination "dist\" -Force
            }
          }
        }
        
        # Copy DLLs from vcpkg
        $vcpkgBinPath = "$env:VCPKG_ROOT\installed\$env:VCPKG_DEFAULT_TRIPLET\bin"
        if (Test-Path $vcpkgBinPath) {
          Write-Host "Copying DLLs from $vcpkgBinPath"
          $dlls = Get-ChildItem -Path $vcpkgBinPath -Filter "*.dll"
          foreach ($dll in $dlls) {
            Copy-Item -Path $dll.FullName -Destination "dist\" -Force
            Write-Host "Copied: $($dll.Name)"
          }
        }
        
        # Copy DLLs from SuiteSparse
        $suiteSparseBinPath = "C:\SuiteSparse\bin"
        if (Test-Path $suiteSparseBinPath) {
          Write-Host "Copying DLLs from $suiteSparseBinPath"
          $dlls = Get-ChildItem -Path $suiteSparseBinPath -Filter "*.dll"
          foreach ($dll in $dlls) {
            Copy-Item -Path $dll.FullName -Destination "dist\" -Force
            Write-Host "Copied: $($dll.Name)"
          }
        }
        
        # List what we have in dist
        Write-Host "`nFiles in dist directory:"
        Get-ChildItem -Path "dist"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BFF-Windows-Binaries
        path: dist/

    - name: Create release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/**
        generate_release_notes: true
