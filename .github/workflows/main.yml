name: Build BFF v1.6 Windows with GUI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout BFF repository with submodules
      uses: actions/checkout@v4
      with:
        repository: GeometryCollective/boundary-first-flattening
        submodules: recursive
        ref: v1.6

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      
    - name: Install CMake
      uses: jwlawson/actions-setup-cmake@v1
      with:
        cmake-version: "3.25.x"

    - name: Install build tools
      shell: pwsh
      run: |
        choco install -y git
        choco install -y ninja

    - name: Build SuiteSparse for Windows
      shell: pwsh
      run: |
        $SuiteSparseRepo = "https://github.com/jlblancoc/suitesparse-metis-for-windows"
        $SuiteSparseDir = "suitesparse-build"
        
        Write-Host "Cloning SuiteSparse for Windows..."
        git clone --depth 1 $SuiteSparseRepo $SuiteSparseDir
        cd $SuiteSparseDir
        
        Write-Host "Configuring SuiteSparse with CMake..."
        $BuildDir = "build"
        $InstallDir = "$pwd\install"
        
        # Create install directory
        New-Item -ItemType Directory -Force -Path $InstallDir
        
        # Configure with specific options for Windows
        cmake -B $BuildDir -S . `
          -DCMAKE_INSTALL_PREFIX="$InstallDir" `
          -DCMAKE_BUILD_TYPE=Release `
          -DBUILD_METIS=ON `
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON `
          -G "Visual Studio 17 2022" `
          -A x64
        
        Write-Host "Building SuiteSparse..."
        cmake --build $BuildDir --config Release --target INSTALL --parallel
        
        Write-Host "SuiteSparse built successfully!"
        Write-Host "Install directory: $InstallDir"

    - name: Build BFF using SuiteSparse config file
      shell: pwsh
      run: |
        $SuiteSparseDir = "$pwd\suitesparse-build\install"
        $BFFBuildDir = "bff-build"
        
        Write-Host "Setting up BFF build with SuiteSparse config file..."
        cd "${{ github.workspace }}"
        
        # Find the actual config directory
        $ConfigDir = "$SuiteSparseDir\lib\cmake\suitesparse-7.5.1"
        Write-Host "SuiteSparse config directory: $ConfigDir"
        
        # List contents to verify
        Write-Host "Config directory contents:"
        Get-ChildItem -Path $ConfigDir
        
        # First, let's patch BFF's CMakeLists.txt to use the config file properly
        # We'll create a modified version or set the right CMake variables
        Write-Host "Creating modified CMakeLists.txt approach..."
        
        # Create a build script that sets the right variables
        $BuildScript = @"
# Set SuiteSparse_DIR to point to the config directory
set(SuiteSparse_DIR "$ConfigDir")
message(STATUS "Setting SuiteSparse_DIR to: $\{SuiteSparse_DIR\}")

# Now run the original CMakeLists.txt
"@
        
        # Build BFF with the config file approach
        Write-Host "Configuring BFF with CMake..."
        cmake -B $BFFBuildDir -S . `
          -DCMAKE_BUILD_TYPE=Release `
          -DBFF_BUILD_GUI=ON `
          -DSuiteSparse_DIR="$ConfigDir" `
          -DCMAKE_PREFIX_PATH="$SuiteSparseDir;$ConfigDir" `
          -G "Visual Studio 17 2022" `
          -A x64
        
        Write-Host "Building BFF..."
        cmake --build $BFFBuildDir --config Release --parallel
        
        Write-Host "BFF build completed!"

    - name: Patch FindSuiteSparse.cmake if needed
      shell: pwsh
      if: failure()
      run: |
        Write-Host "Patching FindSuiteSparse.cmake to work with our build..."
        cd "${{ github.workspace }}"
        
        # Backup the original file
        Copy-Item "cmake/FindSuiteSparse.cmake" "cmake/FindSuiteSparse.cmake.backup"
        
        # Read the file content
        $content = Get-Content "cmake/FindSuiteSparse.cmake" -Raw
        
        # Add a patch to help find our SuiteSparse installation
        $patch = @"

# === PATCH FOR WINDOWS BUILD ===
# Manually set paths for Windows build
if(WIN32)
    set(SuiteSparse_FOUND ON)
    set(SuiteSparse_INCLUDE_DIRS "$pwd\suitesparse-build\install\include")
    set(SuiteSparse_LIBRARY_DIRS "$pwd\suitesparse-build\install\lib")
    
    # Find all libraries in the lib directory
    file(GLOB SuiteSparse_LIBS "$pwd\suitesparse-build\install\lib/*.lib")
    set(SuiteSparse_LIBRARIES $\{SuiteSparse_LIBS\})
    
    # Set individual component variables
    set(SuiteSparse_AMD_FOUND ON)
    set(SuiteSparse_CAMD_FOUND ON)
    set(SuiteSparse_COLAMD_FOUND ON)
    set(SuiteSparse_CCOLAMD_FOUND ON)
    set(SuiteSparse_CHOLMOD_FOUND ON)
    set(SuiteSparse_SUITESPARSECONFIG_FOUND ON)
    
    message(STATUS "Using patched SuiteSparse paths for Windows")
    message(STATUS "Include dirs: $\{SuiteSparse_INCLUDE_DIRS\}")
    message(STATUS "Library dirs: $\{SuiteSparse_LIBRARY_DIRS\}")
endif()
# === END PATCH ===

"@
        
        # Insert the patch after the initial comments
        $newContent = $content -replace "(# Detect SuiteSparse libraries:)", "$1`n`n$patch"
        Set-Content -Path "cmake/FindSuiteSparse.cmake" -Value $newContent
        
        Write-Host "FindSuiteSparse.cmake patched successfully"

    - name: Build BFF with patched CMake file
      shell: pwsh
      if: failure()
      run: |
        $BFFBuildDir = "bff-build-patched"
        
        Write-Host "Building BFF with patched FindSuiteSparse.cmake..."
        cd "${{ github.workspace }}"
        
        cmake -B $BFFBuildDir -S . `
          -DCMAKE_BUILD_TYPE=Release `
          -DBFF_BUILD_GUI=ON `
          -G "Visual Studio 17 2022" `
          -A x64
        
        Write-Host "Building BFF..."
        cmake --build $BFFBuildDir --config Release --parallel

    - name: Alternative: Direct compilation approach
      shell: pwsh
      if: failure()
      run: |
        Write-Host "Trying direct compilation approach..."
        cd "${{ github.workspace }}"
        
        $SuiteSparseDir = "$pwd\suitesparse-build\install"
        $BuildDir = "bff-direct-build"
        
        # Create a simple CMakeLists.txt that directly links to SuiteSparse
        $SimpleCMake = @"
cmake_minimum_required(VERSION 3.1.0)
project(bff)

option(BFF_BUILD_CLI "Build BFF command line" ON)
option(BFF_BUILD_GUI "Build BFF GUI" ON)

set(CMAKE_CXX_STANDARD 11)
set(CMAKE_CXX_STANDARD_REQUIRED ON)

# Set SuiteSparse paths directly
set(SUITESPARSE_INCLUDE_DIR "$SuiteSparseDir/include")
set(SUITESPARSE_LIB_DIR "$SuiteSparseDir/lib")

# Find all SuiteSparse libraries
file(GLOB SUITESPARSE_LIBS "$\{SUITESPARSE_LIB_DIR\}/*.lib")

message(STATUS "SuiteSparse include dir: $\{SUITESPARSE_INCLUDE_DIR\}")
message(STATUS "SuiteSparse lib dir: $\{SUITESPARSE_LIB_DIR\}")
message(STATUS "Found $\{SUITESPARSE_LIBS\} libraries")

# bff lib
include_directories($\{SUITESPARSE_INCLUDE_DIR\})
include_directories("deps/rectangle-bin-pack")
include_directories("include")

file(GLOB BFF_SOURCES "deps/rectangle-bin-pack/GuillotineBinPack.cpp"
                      "deps/rectangle-bin-pack/SkylineBinPack.cpp"
                      "deps/rectangle-bin-pack/Rect.cpp"
                      "src/linear-algebra/*.cpp"
                      "src/mesh/*.cpp"
                      "src/project/*.cpp")

# create bff static library
add_library(bff $\{BFF_SOURCES\})
target_link_libraries(bff $\{SUITESPARSE_LIBS\})

# Add executable targets if needed
if(BFF_BUILD_GUI)
    # GUI specific source files would go here
    message(STATUS "GUI build enabled")
endif()
"@
        
        # Create a temporary CMakeLists.txt
        Set-Content -Path "CMakeLists-simple.txt" -Value $SimpleCMake
        
        # Build with the simple CMakeLists
        cmake -B $BuildDir -S . `
          -DCMAKE_BUILD_TYPE=Release `
          -DBFF_BUILD_GUI=ON `
          -G "Visual Studio 17 2022" `
          -A x64 `
          -DCMAKE_MODULE_PATH="$pwd/cmake"
        
        cmake --build $BuildDir --config Release --parallel

    - name: Collect and package artifacts
      shell: pwsh
      run: |
        $DistDir = "bff-dist"
        New-Item -ItemType Directory -Force -Path $DistDir
        
        Write-Host "Looking for built executables..."
        
        # Check multiple possible build directories
        $BuildDirs = @(
            "bff-build",
            "bff-build-patched", 
            "bff-direct-build"
        )
        
        foreach ($buildDir in $BuildDirs) {
            if (Test-Path $buildDir) {
                Write-Host "Checking $buildDir..."
                
                # Look for executables in various locations
                $exePaths = @(
                    "$buildDir\Release\BFF.exe",
                    "$buildDir\BFF.exe",
                    "$buildDir\src\Release\BFF.exe",
                    "$buildDir\Release\bff-command.exe"
                )
                
                foreach ($exePath in $exePaths) {
                    if (Test-Path $exePath) {
                        Write-Host "Found: $exePath"
                        Copy-Item $exePath -Destination $DistDir
                    }
                }
            }
        }
        
        # Copy SuiteSparse DLLs
        $SuiteSparseDir = "$pwd\suitesparse-build\install"
        Write-Host "Copying SuiteSparse DLLs from $SuiteSparseDir..."
        
        if (Test-Path "$SuiteSparseDir\lib") {
            $dlls = Get-ChildItem -Path "$SuiteSparseDir\lib" -Filter "*.dll" -Recurse
            foreach ($dll in $dlls) {
                Copy-Item $dll.FullName -Destination $DistDir
            }
        }
        
        if (Test-Path "$SuiteSparseDir\bin") {
            $binDlls = Get-ChildItem -Path "$SuiteSparseDir\bin" -Filter "*.dll"
            foreach ($dll in $binDlls) {
                Copy-Item $dll.FullName -Destination $DistDir
            }
        }
        
        # Create README
        $ReadmeContent = "Boundary First Flattening (BFF) v1.6 Windows Build" + "`n" + 
                         "=============================================" + "`n" + 
                         "Built: $(Get-Date -Format 'yyyy-MM-dd HH:mm')" + "`n" + 
                         "" + "`n" + 
                         "INSTRUCTIONS:" + "`n" + 
                         "1. Place all files in the same directory" + "`n" + 
                         "2. Run BFF.exe for GUI interface" + "`n" + 
                         "3. Run bff-command.exe for command line" + "`n" + 
                         "" + "`n" + 
                         "REQUIRED DLLs included:" + "`n" + 
                         "- SuiteSparse libraries" + "`n" + 
                         "- LAPACK/BLAS runtime" + "`n" + 
                         "" + "`n" + 
                         "If you get DLL errors, install Visual C++ Redistributable:" + "`n" + 
                         "https://aka.ms/vs/17/release/vc_redist.x64.exe"
        
        Set-Content -Path "$DistDir\README.txt" -Value $ReadmeContent
        
        # Create ZIP archive
        Compress-Archive -Path "$DistDir\*" -DestinationPath "BFF-Windows-v1.6.zip"
        
        Write-Host "Artifacts prepared in $DistDir"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BFF-Windows-Package
        path: |
          bff-dist/
          BFF-Windows-v1.6.zip
        retention-days: 7
