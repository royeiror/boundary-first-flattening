name: Build BFF for Windows

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout BFF repository
      uses: actions/checkout@v4
      with:
        repository: royeiror/boundary-first-flattening
        submodules: recursive
        
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2
      
    - name: Install CMake
      uses: jwlawson/actions-setup-cmake@v1
      with:
        cmake-version: '3.28.x'
        
    - name: Clean workspace
      shell: cmd
      run: |
        if exist deps rd /s /q deps
        if exist suitesparse rd /s /q suitesparse
        if exist build rd /s /q build
        
    - name: Setup OpenBLAS
      shell: powershell
      run: |
        mkdir -Force deps | Out-Null
        cd deps
        
        if (!(Test-Path "openblas-windows")) {
          git clone https://github.com/xianyi/OpenBLAS.git openblas-src
          cd openblas-src
          git checkout v0.3.24
          mkdir -Force build | Out-Null
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_WITHOUT_LAPACK=NO `
            -DNOFORTRAN=1 `
            -DDYNAMIC_ARCH=OFF `
            -DBUILD_SHARED_LIBS=OFF `
            -DCMAKE_INSTALL_PREFIX="$pwd\..\..\openblas-windows"
          cmake --build . --config Release --target install
          cd ..\..
          Remove-Item -Recurse -Force openblas-src
        }
        
    - name: Build SuiteSparse
      shell: powershell
      run: |
        # Clean up if exists
        if (Test-Path "suitesparse") {
          Remove-Item -Recurse -Force suitesparse
        }
        
        mkdir suitesparse
        cd suitesparse
        
        # Clone SuiteSparseProject
        git clone https://github.com/jlblancoc/suitesparse-metis-for-windows.git SuiteSparseProject
        cd SuiteSparseProject
        git checkout v1.5.0
        
        # Download SuiteSparse sources (only if directory doesn't exist)
        if (!(Test-Path "SuiteSparse")) {
          mkdir SuiteSparse
          Invoke-WebRequest -Uri 'https://github.com/DrTimothyAldenDavis/SuiteSparse/archive/refs/tags/v7.6.1.tar.gz' -OutFile 'SuiteSparse.tar.gz'
          tar -xzf SuiteSparse.tar.gz -C SuiteSparse --strip-components=1
          Remove-Item SuiteSparse.tar.gz
        }
        
        # Download METIS (only if directory doesn't exist)
        if (!(Test-Path "metis")) {
          mkdir metis
          Invoke-WebRequest -Uri 'http://glaros.dtc.umn.edu/gkhome/fetch/sw/metis/metis-5.1.0.tar.gz' -OutFile 'metis.tar.gz'
          tar -xzf metis.tar.gz -C metis --strip-components=1
          Remove-Item metis.tar.gz
          
          # Fix METIS CMakeLists.txt
          $content = Get-Content 'metis/CMakeLists.txt' -Raw
          $newContent = $content -replace 'project\(METIS\)', "project(METIS)`ncmake_policy(SET CMP0022 NEW)"
          Set-Content 'metis/CMakeLists.txt' $newContent -Encoding ASCII
        }
        
        # Configure SuiteSparse
        if (Test-Path "build") {
          Remove-Item -Recurse -Force build
        }
        mkdir build
        cd build
        
        cmake .. -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_INSTALL_PREFIX="$pwd\install" `
          -DWITH_OPENBLAS=ON `
          -DOPENBLAS_LIBRARY="$env:GITHUB_WORKSPACE\deps\openblas-windows\lib\libopenblas.lib" `
          -DOPENBLAS_INCLUDE_DIR="$env:GITHUB_WORKSPACE\deps\openblas-windows\include"
        
        # Build and install
        cmake --build . --config Release --target install
        
        # Create lib directory structure expected by BFF
        mkdir -Force install\lib | Out-Null
        if (Test-Path "install\lib64") {
          Copy-Item install\lib64\*.lib install\lib\
        }
        
    - name: Configure BFF with CMake
      shell: cmd
      run: |
        if exist build rd /s /q build
        mkdir build
        cd build
        
        set SUITESPARSE_DIR=%GITHUB_WORKSPACE%\suitesparse\SuiteSparseProject\build\install
        set OPENBLAS_DIR=%GITHUB_WORKSPACE%\deps\openblas-windows
        
        cmake .. -G "Visual Studio 17 2022" -A x64 ^
          -DCMAKE_BUILD_TYPE=%BUILD_TYPE% ^
          -DSuiteSparse_CHOLMOD_DIR=%SUITESPARSE_DIR%\lib ^
          -DSuiteSparse_CHOLMOD_INCLUDE_DIR=%SUITESPARSE_DIR%\include\suitesparse ^
          -DSuiteSparse_CHOLMOD_LIBRARY=%SUITESPARSE_DIR%\lib\libcholmod.lib ^
          -DSuiteSparse_DIR=%SUITESPARSE_DIR% ^
          -DBLAS_LIBRARIES=%OPENBLAS_DIR%\lib\libopenblas.lib ^
          -DLAPACK_LIBRARIES=%OPENBLAS_DIR%\lib\libopenblas.lib
        
    - name: Build BFF
      shell: cmd
      run: |
        cd build
        cmake --build . --config Release --target bff-command-line
        
    - name: Copy dependencies
      shell: cmd
      run: |
        if exist deps\openblas-windows\bin\*.dll (
          copy deps\openblas-windows\bin\*.dll build\%BUILD_TYPE%\
        )
        
    - name: Test executable
      shell: cmd
      run: |
        cd build\%BUILD_TYPE%
        if exist bff-command-line.exe (
          bff-command-line.exe --help || echo "Executable ran (help may not be available)"
        ) else (
          echo "Executable not found!"
          dir *.exe
          exit 1
        )
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bff-windows
        path: |
          build/Release/*.exe
          build/Release/*.dll
        retention-days: 7
