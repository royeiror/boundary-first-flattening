name: Windows Build BFF v1.6 - Optimized

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup environment
      shell: bash
      run: |
        echo "Installing required tools..."
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
        choco install wget -y
        
    - name: Download pre-built OpenBLAS and METIS
      shell: bash
      run: |
        echo "Downloading pre-built OpenBLAS..."
        wget https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.28/OpenBLAS-0.3.28-x64.zip -O openblas.zip
        7z x openblas.zip -oopenblas-install
        
        echo "Downloading pre-built METIS..."
        mkdir -p metis-install/lib
        mkdir -p metis-install/include
        wget https://github.com/GraphChallenge/GraphChallenge-Data/raw/master/metis-5.1.0-win-x86_64/lib/libmetis.lib -O metis-install/lib/metis.lib
        wget https://github.com/GraphChallenge/GraphChallenge-Data/raw/master/metis-5.1.0-win-x86_64/include/metis.h -O metis-install/include/metis.h
        
    - name: Download pre-built SuiteSparse
      shell: bash
      run: |
        echo "Downloading SuiteSparse for Windows..."
        mkdir -p suitesparse-deps/lib
        mkdir -p suitesparse-deps/include
        
        SUITESPARSE_URL="https://github.com/jlblancoc/suitesparse-metis-for-windows/releases/download/v1.4.0"
        
        wget "${SUITESPARSE_URL}/suitesparse-include.zip" -O suitesparse-include.zip
        7z x suitesparse-include.zip -osuitesparse-deps/include
        
        wget "${SUITESPARSE_URL}/suitesparse-lib.zip" -O suitesparse-lib.zip
        7z x suitesparse-lib.zip -osuitesparse-deps/lib
        
        cd suitesparse-deps/lib
        cp ../../openblas-install/lib/libopenblas.lib blas.lib
        cp ../../openblas-install/lib/libopenblas.lib lapack.lib
        
    - name: Apply critical BFF patches
      shell: bash
      run: |
        echo "Applying essential BFF patches for Windows..."
        
        # 1. Create custom FindSuiteSparse.cmake
        echo "Creating custom FindSuiteSparse.cmake..."
        mkdir -p cmake
        echo '# Manual SuiteSparse config for Windows' > cmake/FindSuiteSparse.cmake
        echo 'set(SuiteSparse_FOUND ON)' >> cmake/FindSuiteSparse.cmake
        echo 'set(SuiteSparse_INCLUDE_DIRS "$ENV{GITHUB_WORKSPACE}/suitesparse-deps/include")' >> cmake/FindSuiteSparse.cmake
        echo 'set(SuiteSparse_LIBRARIES' >> cmake/FindSuiteSparse.cmake
        echo '  "$ENV{GITHUB_WORKSPACE}/suitesparse-deps/lib/libamd.lib"' >> cmake/FindSuiteSparse.cmake
        echo '  "$ENV{GITHUB_WORKSPACE}/suitesparse-deps/lib/libcamd.lib"' >> cmake/FindSuiteSparse.cmake
        echo '  "$ENV{GITHUB_WORKSPACE}/suitesparse-deps/lib/libccolamd.lib"' >> cmake/FindSuiteSparse.cmake
        echo '  "$ENV{GITHUB_WORKSPACE}/suitesparse-deps/lib/libcolamd.lib"' >> cmake/FindSuiteSparse.cmake
        echo '  "$ENV{GITHUB_WORKSPACE}/suitesparse-deps/lib/libcholmod.lib"' >> cmake/FindSuiteSparse.cmake
        echo '  "$ENV{GITHUB_WORKSPACE}/suitesparse-deps/lib/libspqr.lib"' >> cmake/FindSuiteSparse.cmake
        echo '  "$ENV{GITHUB_WORKSPACE}/suitesparse-deps/lib/libldl.lib"' >> cmake/FindSuiteSparse.cmake
        echo '  "$ENV{GITHUB_WORKSPACE}/suitesparse-deps/lib/libbtf.lib"' >> cmake/FindSuiteSparse.cmake
        echo '  "$ENV{GITHUB_WORKSPACE}/suitesparse-deps/lib/libklu.lib"' >> cmake/FindSuiteSparse.cmake
        echo '  "$ENV{GITHUB_WORKSPACE}/suitesparse-deps/lib/libcxsparse.lib"' >> cmake/FindSuiteSparse.cmake
        echo '  "$ENV{GITHUB_WORKSPACE}/suitesparse-deps/lib/libumfpack.lib"' >> cmake/FindSuiteSparse.cmake
        echo '  "$ENV{GITHUB_WORKSPACE}/suitesparse-deps/lib/suitesparseconfig.lib"' >> cmake/FindSuiteSparse.cmake
        echo '  "$ENV{GITHUB_WORKSPACE}/metis-install/lib/metis.lib"' >> cmake/FindSuiteSparse.cmake
        echo '  "$ENV{GITHUB_WORKSPACE}/openblas-install/lib/libopenblas.lib"' >> cmake/FindSuiteSparse.cmake
        echo ')' >> cmake/FindSuiteSparse.cmake
        
        # 2. Patch CMakeLists.txt
        echo "Patching CMakeLists.txt..."
        sed -i 's|find_package(SuiteSparse REQUIRED)|include(cmake/FindSuiteSparse.cmake)|' CMakeLists.txt
        
        # 3. Patch NanoGUI
        echo "Patching NanoGUI for static build..."
        sed -i 's|add_library(nanogui SHARED|add_library(nanogui STATIC|' deps/nanogui/CMakeLists.txt
        sed -i 's|NANOGUI_BUILD SHARED|NANOGUI_BUILD STATIC|' deps/nanogui/CMakeLists.txt
        
        echo "Patches applied successfully!"
        
    - name: Configure and Build BFF
      shell: cmd
      run: |
        echo "Configuring BFF with CMake..."
        mkdir build
        cd build
        
        cmake .. -G "Visual Studio 17 2022" -A x64 ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DBUILD_SHARED_LIBS=ON ^
          -DCMAKE_PREFIX_PATH="%cd%/../suitesparse-deps" ^
          -DMETIS_ROOT="%cd%/../metis-install" ^
          -DBLAS_LIBRARIES="%cd%/../openblas-install/lib/libopenblas.lib" ^
          -DLAPACK_LIBRARIES="%cd%/../openblas-install/lib/libopenblas.lib"
        
        echo "Building BFF..."
        cmake --build . --config Release --parallel 4
        
    - name: Package artifacts
      shell: bash
      run: |
        echo "Packaging build artifacts..."
        mkdir -p bff-package
        
        if [ -f "./build/Release/bff-viewer.exe" ]; then
          cp ./build/Release/bff-viewer.exe ./bff-package/
          echo "✓ bff-viewer.exe"
        fi
        
        if [ -f "./build/Release/bff.dll" ]; then
          cp ./build/Release/bff.dll ./bff-package/
          echo "✓ bff.dll"
        fi
        
        echo "Copying runtime dependencies..."
        find ./build -name "*.dll" -exec cp {} ./bff-package/ \;
        
        if [ -f "./openblas-install/bin/libopenblas.dll" ]; then
          cp ./openblas-install/bin/libopenblas.dll ./bff-package/
          echo "✓ libopenblas.dll"
        fi
        
        echo "Package contents:"
        ls -la ./bff-package/
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bff-windows-binaries
        path: bff-package/
        if-no-files-found: error
        retention-days: 7
