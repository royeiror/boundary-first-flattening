name: Build BFF Modified

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup vcpkg
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg install suitesparse openblas eigen3 --triplet x64-windows

    - name: Modify CMake to reduce dependencies
      run: |
        # Create a modified CMakeLists.txt that doesn't require all SuiteSparse components
        if (Test-Path "CMakeLists.txt") {
            $content = Get-Content CMakeLists.txt -Raw
            
            # Fix minimum version
            $content = $content -replace 'cmake_minimum_required\(.*\)', 'cmake_minimum_required(VERSION 3.5)'
            
            # Comment out or modify the SuiteSparse requirement
            # Look for the find_package(SuiteSparse line and modify it
            $content = $content -replace 'find_package\(SuiteSparse REQUIRED\)', '# find_package(SuiteSparse REQUIRED)'
            
            # Write modified content
            $content | Set-Content CMakeLists.txt
            echo "Modified CMakeLists.txt to reduce dependencies"
        }
        
        # Also check if there's a cmake/FindSuiteSparse.cmake we can modify
        if (Test-Path "cmake/FindSuiteSparse.cmake") {
            $findContent = Get-Content "cmake/FindSuiteSparse.cmake" -Raw
            # Comment out the error that stops configuration
            $findContent = $findContent -replace 'MESSAGE\(FATAL_ERROR "SuiteSparse required but some headers or libs not found."\)', '# MESSAGE(FATAL_ERROR "SuiteSparse required but some headers or libs not found.")'
            $findContent | Set-Content "cmake/FindSuiteSparse.cmake"
            echo "Modified FindSuiteSparse.cmake"
        }

    - name: Try simple build
      run: |
        mkdir build
        cd build
        cmake .. `
          -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake `
          -DCMAKE_BUILD_TYPE=Release `
          -G "Visual Studio 17 2022" -A x64
        
        cmake --build . --config Release --parallel

    - name: Collect any built files
      run: |
        mkdir artifacts
        Get-ChildItem -Path build -Recurse -Filter *.exe | ForEach-Object {
            Copy-Item $_.FullName "artifacts/"
            echo "Found: $($_.Name)"
        }
        dir artifacts

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bff-modified-build
        path: artifacts/*
        retention-days: 30
