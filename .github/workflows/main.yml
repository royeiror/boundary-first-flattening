name: Build BFF Viewer

on: workflow_dispatch

jobs:
  build-viewer:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Install vcpkg
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg install suitesparse:x64-windows
        
    - name: Copy headers
      run: |
        $vcpkgPath = "$env:GITHUB_WORKSPACE/vcpkg/installed/x64-windows"
        
        # Create include directory
        mkdir include -Force
        
        # Copy cholmod.h and other headers
        Get-ChildItem "$vcpkgPath" -Filter "*.h" -Recurse | ForEach-Object {
            Copy-Item $_.FullName "include/$($_.Name)" -Force
        }
        
        echo "Headers copied to include/"
        
    - name: Patch source files
      run: |
        # Patch the .inl files
        $file1 = "include/bff/linear-algebra/DenseMatrix.inl"
        $file2 = "include/bff/linear-algebra/SparseMatrix.inl"
        
        if (Test-Path $file1) {
            (Get-Content $file1) -replace 'cholmod_l_', 'cholmod_' | Set-Content $file1
        }
        
        if (Test-Path $file2) {
            (Get-Content $file2) -replace 'cholmod_l_', 'cholmod_' | Set-Content $file2
        }
        
    - name: Create FindSuiteSparse.cmake with forward slashes
      run: |
        # Convert paths to forward slashes for CMake
        $workspace = "$env:GITHUB_WORKSPACE" -replace '\\', '/'
        $vcpkgPath = "$env:GITHUB_WORKSPACE/vcpkg/installed/x64-windows" -replace '\\', '/'
        
        # Write file with forward slashes
        echo "set(SuiteSparse_FOUND TRUE)" | Out-File cmake/FindSuiteSparse.cmake
        echo "set(SuiteSparse_INCLUDE_DIR `"$workspace/include`")" | Out-File -Append cmake/FindSuiteSparse.cmake
        echo "set(SuiteSparse_LIBRARY_DIR `"$vcpkgPath/lib`")" | Out-File -Append cmake/FindSuiteSparse.cmake
        echo "set(SuiteSparse_CHOLMOD_LIBRARY `"$vcpkgPath/lib/cholmod.lib`")" | Out-File -Append cmake/FindSuiteSparse.cmake
        echo "set(SuiteSparse_AMD_LIBRARY `"$vcpkgPath/lib/amd.lib`")" | Out-File -Append cmake/FindSuiteSparse.cmake
        
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1
      
    - name: Configure CMake
      run: |
        cmake -B build -DBFF_BUILD_GUI=ON -DCMAKE_BUILD_TYPE=Release
        
    - name: Build
      run: |
        cmake --build build --config Release
        
    - name: Check results
      run: |
        if (Test-Path "build/Release/bff-viewer.exe") {
            echo "✅ SUCCESS: bff-viewer.exe built!"
            echo "Size: $((Get-Item 'build/Release/bff-viewer.exe').Length) bytes"
        } else {
            echo "❌ Viewer not found"
        }
