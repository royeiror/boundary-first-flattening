name: Build BFF for Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [created]
  workflow_dispatch:

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-windows

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install Chocolatey packages
      shell: powershell
      run: |
        # Install Chocolatey
        Set-ExecutionPolicy Bypass -Scope Process -Force
        [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
        iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
        
        # Install build tools
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
        choco install ninja -y

    - name: Install vcpkg and dependencies
      shell: powershell
      run: |
        # Install vcpkg
        git clone https://github.com/Microsoft/vcpkg.git $env:VCPKG_ROOT
        & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"
        
        # Install required dependencies
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET eigen3
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET libigl
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET suitesparse
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET metis
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glfw3
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glew
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET freeglut
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glm

    - name: Check SuiteSparse directory
      shell: powershell
      run: |
        Write-Host "Checking SuiteSparse directory..."
        $suiteSparseLibDir = "C:\SuiteSparse\lib"
        
        if (Test-Path $suiteSparseLibDir) {
          Write-Host "Listing all files in $( $suiteSparseLibDir ):"
          Get-ChildItem -Path $suiteSparseLibDir | Format-Table Name, Length
          
          Write-Host "`nLooking for library files (.lib):"
          $libFiles = Get-ChildItem -Path $suiteSparseLibDir -Filter "*.lib"
          foreach ($file in $libFiles) {
            Write-Host "  - $($file.Name)"
          }
        } else {
          Write-Host "SuiteSparse lib directory not found: $( $suiteSparseLibDir )"
        }

    - name: Download and install SuiteSparse-METIS
      shell: powershell
      run: |
        # Download SuiteSparse-METIS
        Write-Host "Downloading SuiteSparse-METIS..."
        $url = "https://github.com/jlblancoc/suitesparse-metis-for-windows/archive/master.zip"
        $output = "C:\suitesparse-metis.zip"
        
        Invoke-WebRequest -Uri $url -OutFile $output
        
        # Create directories
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse"
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse\include"
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse\lib"
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse\bin"
        
        # Extract
        Expand-Archive -Path $output -DestinationPath "C:\SuiteSparseTemp\" -Force
        
        # Find the actual library directory
        Write-Host "Searching for library files in extracted directory..."
        
        # Look for lib directory
        $extractedLibDir = Get-ChildItem -Path "C:\SuiteSparseTemp" -Recurse -Directory | Where-Object { $_.Name -eq "lib" } | Select-Object -First 1
        
        if ($extractedLibDir) {
          Write-Host "Found lib directory: $( $extractedLibDir.FullName )"
          
          # Copy all .lib files
          $libFiles = Get-ChildItem -Path $extractedLibDir.FullName -Filter "*.lib"
          foreach ($file in $libFiles) {
            Copy-Item -Path $file.FullName -Destination "C:\SuiteSparse\lib\" -Force
            Write-Host "Copied lib: $($file.Name)"
          }
        } else {
          Write-Host "No lib directory found, searching for .lib files..."
          $libFiles = Get-ChildItem -Path "C:\SuiteSparseTemp" -Recurse -Filter "*.lib"
          foreach ($file in $libFiles) {
            Copy-Item -Path $file.FullName -Destination "C:\SuiteSparse\lib\" -Force
            Write-Host "Copied lib: $($file.Name)"
          }
        }
        
        # Copy .dll files
        $dllFiles = Get-ChildItem -Path "C:\SuiteSparseTemp" -Recurse -Filter "*.dll"
        foreach ($file in $dllFiles) {
          Copy-Item -Path $file.FullName -Destination "C:\SuiteSparse\bin\" -Force
          Write-Host "Copied dll: $($file.Name)"
        }
        
        # Copy .h files
        $hFiles = Get-ChildItem -Path "C:\SuiteSparseTemp" -Recurse -Filter "*.h"
        foreach ($file in $hFiles) {
          Copy-Item -Path $file.FullName -Destination "C:\SuiteSparse\include\" -Force
          Write-Host "Copied header: $($file.Name)"
        }
        
        # List what we copied
        Write-Host "`nFinal SuiteSparse lib directory contents:"
        Get-ChildItem -Path "C:\SuiteSparse\lib" | Format-Table Name

    - name: Create CMakeLists.txt for BFF
      shell: powershell
      run: |
        # Get the vcpkg paths
        $vcpkgPath = $env:VCPKG_ROOT -replace "\\", "/"
        $vcpkgInstalled = "$vcpkgPath/installed/$env:VCPKG_DEFAULT_TRIPLET"
        
        # Create CMakeLists.txt with better library finding
        $cmakeLines = @(
          "cmake_minimum_required(VERSION 3.15)",
          "project(BFF)",
          "",
          "set(CMAKE_CXX_STANDARD 17)",
          "set(CMAKE_CXX_STANDARD_REQUIRED ON)",
          "",
          "# Find Eigen3",
          "find_package(Eigen3 REQUIRED)",
          "",
          "# Set SuiteSparse paths",
          "set(SUITESPARSE_INCLUDE_DIR `"C:/SuiteSparse/include`")",
          "set(SUITESPARSE_LIB_DIR `"C:/SuiteSparse/lib`")",
          "",
          "# Try to find any SuiteSparse library files using glob",
          "file(GLOB_RECURSE CHOLMOD_LIBRARIES `"${SUITESPARSE_LIB_DIR}/*cholmod*.lib`")",
          "file(GLOB_RECURSE AMD_LIBRARIES `"${SUITESPARSE_LIB_DIR}/*amd*.lib`")",
          "file(GLOB_RECURSE CAMD_LIBRARIES `"${SUITESPARSE_LIB_DIR}/*camd*.lib`")",
          "file(GLOB_RECURSE COLAMD_LIBRARIES `"${SUITESPARSE_LIB_DIR}/*colamd*.lib`")",
          "file(GLOB_RECURSE CCOLAMD_LIBRARIES `"${SUITESPARSE_LIB_DIR}/*ccolamd*.lib`")",
          "file(GLOB_RECURSE METIS_LIBRARIES `"${SUITESPARSE_LIB_DIR}/*metis*.lib`")",
          "",
          "# Check if libraries were found",
          "if(CHOLMOD_LIBRARIES)",
          "    list(GET CHOLMOD_LIBRARIES 0 CHOLMOD_LIBRARY)",
          "    message(STATUS `"Found CHOLMOD: `${CHOLMOD_LIBRARY}`")",
          "else()",
          "    message(FATAL_ERROR `"No CHOLMOD library found in `${SUITESPARSE_LIB_DIR}`")",
          "endif()",
          "",
          "if(AMD_LIBRARIES)",
          "    list(GET AMD_LIBRARIES 0 AMD_LIBRARY)",
          "    message(STATUS `"Found AMD: `${AMD_LIBRARY}`")",
          "else()",
          "    message(FATAL_ERROR `"No AMD library found in `${SUITESPARSE_LIB_DIR}`")",
          "endif()",
          "",
          "if(CAMD_LIBRARIES)",
          "    list(GET CAMD_LIBRARIES 0 CAMD_LIBRARY)",
          "    message(STATUS `"Found CAMD: `${CAMD_LIBRARY}`")",
          "else()",
          "    message(FATAL_ERROR `"No CAMD library found in `${SUITESPARSE_LIB_DIR}`")",
          "endif()",
          "",
          "if(COLAMD_LIBRARIES)",
          "    list(GET COLAMD_LIBRARIES 0 COLAMD_LIBRARY)",
          "    message(STATUS `"Found COLAMD: `${COLAMD_LIBRARY}`")",
          "else()",
          "    message(FATAL_ERROR `"No COLAMD library found in `${SUITESPARSE_LIB_DIR}`")",
          "endif()",
          "",
          "if(CCOLAMD_LIBRARIES)",
          "    list(GET CCOLAMD_LIBRARIES 0 CCOLAMD_LIBRARY)",
          "    message(STATUS `"Found CCOLAMD: `${CCOLAMD_LIBRARY}`")",
          "else()",
          "    message(FATAL_ERROR `"No CCOLAMD library found in `${SUITESPARSE_LIB_DIR}`")",
          "endif()",
          "",
          "if(METIS_LIBRARIES)",
          "    list(GET METIS_LIBRARIES 0 METIS_LIBRARY)",
          "    message(STATUS `"Found METIS: `${METIS_LIBRARY}`")",
          "else()",
          "    message(FATAL_ERROR `"No METIS library found in `${SUITESPARSE_LIB_DIR}`")",
          "endif()",
          "",
          "# OpenGL",
          "find_package(OpenGL REQUIRED)",
          "",
          "# Set vcpkg paths",
          "set(VCPKG_INSTALLED_DIR `"$vcpkgInstalled`")",
          "",
          "# Find GLFW and GLEW libraries",
          "file(GLOB_RECURSE GLFW_LIBRARIES `"${VCPKG_INSTALLED_DIR}/*glfw*.lib`")",
          "if(GLFW_LIBRARIES)",
          "    list(GET GLFW_LIBRARIES 0 GLFW3_LIBRARY)",
          "    message(STATUS `"Found GLFW: `${GLFW3_LIBRARY}`")",
          "else()",
          "    message(FATAL_ERROR `"No GLFW library found in `${VCPKG_INSTALLED_DIR}`")",
          "endif()",
          "",
          "file(GLOB_RECURSE GLEW_LIBRARIES `"${VCPKG_INSTALLED_DIR}/*glew*.lib`")",
          "if(GLEW_LIBRARIES)",
          "    list(GET GLEW_LIBRARIES 0 GLEW_LIBRARY)",
          "    message(STATUS `"Found GLEW: `${GLEW_LIBRARY}`")",
          "else()",
          "    message(FATAL_ERROR `"No GLEW library found in `${VCPKG_INSTALLED_DIR}`")",
          "endif()",
          "",
          "# Include directories",
          "include_directories(",
          "    `${CMAKE_SOURCE_DIR}/include",
          "    `${CMAKE_SOURCE_DIR}/deps/libigl/include",
          "    `${CMAKE_SOURCE_DIR}/deps/spectra/include",
          "    `${EIGEN3_INCLUDE_DIRS}",
          "    `${SUITESPARSE_INCLUDE_DIR}",
          "    `${VCPKG_INSTALLED_DIR}/include",
          ")",
          "",
          "# Source files for library",
          "file(GLOB SRC_FILES `"src/*.cpp`")",
          "",
          "# Create library",
          "add_library(bff-lib STATIC `${SRC_FILES})",
          "",
          "# Link SuiteSparse libraries to bff-lib",
          "target_link_libraries(bff-lib",
          "    `${CHOLMOD_LIBRARY}",
          "    `${AMD_LIBRARY}",
          "    `${CAMD_LIBRARY}",
          "    `${COLAMD_LIBRARY}",
          "    `${CCOLAMD_LIBRARY}",
          "    `${METIS_LIBRARY}",
          ")",
          "",
          "# GUI application",
          "if(EXISTS `${CMAKE_SOURCE_DIR}/apps)",
          "    file(GLOB GUI_SRC_FILES `"apps/*.cpp`")",
          "    if(GUI_SRC_FILES)",
          "        add_executable(bff-gui `${GUI_SRC_FILES})",
          "        target_link_libraries(bff-gui bff-lib `${OPENGL_LIBRARIES} `${GLFW3_LIBRARY} `${GLEW_LIBRARY})",
          "        target_include_directories(bff-gui PRIVATE `${CMAKE_SOURCE_DIR}/apps)",
          "    endif()",
          "endif()",
          "",
          "# Command line tool",
          "if(EXISTS `${CMAKE_SOURCE_DIR}/binaries)",
          "    file(GLOB CLI_SRC_FILES `"binaries/*.cpp`")",
          "    if(CLI_SRC_FILES)",
          "        add_executable(bff-cli `${CLI_SRC_FILES})",
          "        target_link_libraries(bff-cli bff-lib)",
          "        target_include_directories(bff-cli PRIVATE `${CMAKE_SOURCE_DIR}/binaries)",
          "    endif()",
          "endif()"
        )
        
        # Write to file
        $cmakeLines | Out-File -FilePath "CMakeLists.txt" -Encoding UTF8 -Force

    - name: Configure CMake
      shell: powershell
      run: |
        # Create build directory
        New-Item -ItemType Directory -Force -Path "build"
        
        Write-Host "Configuring CMake..."
        
        # Configure with CMake
        cmake -B build `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=$env:VCPKG_DEFAULT_TRIPLET `
          -G "Visual Studio 17 2022" `
          -A x64

    - name: Build BFF
      shell: powershell
      run: |
        Write-Host "Building project..."
        cmake --build build --config Release --parallel 4

    - name: Find and copy executables
      shell: powershell
      run: |
        # Create distribution directory
        New-Item -ItemType Directory -Force -Path "dist"
        
        Write-Host "Searching for executables..."
        
        # Search for executables
        $searchPaths = @(
          "build\Release",
          "build",
          "build\bin\Release",
          "build\bin"
        )
        
        foreach ($path in $searchPaths) {
          if (Test-Path $path) {
            Write-Host "Checking $path"
            $exes = Get-ChildItem -Path $path -Filter "*.exe" -Recurse
            foreach ($exe in $exes) {
              Write-Host "Found executable: $($exe.FullName)"
              Copy-Item -Path $exe.FullName -Destination "dist\" -Force
            }
          }
        }
        
        # Copy DLLs from vcpkg
        $vcpkgBinPath = "$env:VCPKG_ROOT\installed\$env:VCPKG_DEFAULT_TRIPLET\bin"
        if (Test-Path $vcpkgBinPath) {
          Write-Host "Copying DLLs from $vcpkgBinPath"
          $dlls = Get-ChildItem -Path $vcpkgBinPath -Filter "*.dll"
          foreach ($dll in $dlls) {
            Copy-Item -Path $dll.FullName -Destination "dist\" -Force
            Write-Host "Copied: $($dll.Name)"
          }
        }
        
        # Copy DLLs from SuiteSparse
        $suiteSparseBinPath = "C:\SuiteSparse\bin"
        if (Test-Path $suiteSparseBinPath) {
          Write-Host "Copying DLLs from $suiteSparseBinPath"
          $dlls = Get-ChildItem -Path $suiteSparseBinPath -Filter "*.dll"
          foreach ($dll in $dlls) {
            Copy-Item -Path $dll.FullName -Destination "dist\" -Force
            Write-Host "Copied: $($dll.Name)"
          }
        }
        
        # List what we have in dist
        Write-Host "`nFiles in dist directory:"
        Get-ChildItem -Path "dist"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BFF-Windows-Binaries
        path: dist/

    - name: Create release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/**
        generate_release_notes: true
