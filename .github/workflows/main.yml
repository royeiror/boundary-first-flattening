name: Build BFF for Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [created]
  workflow_dispatch:

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-windows

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install vcpkg and dependencies
      shell: powershell
      run: |
        # Install vcpkg
        git clone https://github.com/Microsoft/vcpkg.git $env:VCPKG_ROOT
        & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"
        
        # Install required dependencies
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET eigen3
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET libigl
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET suitesparse
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET metis
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glfw3
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glew
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET freeglut
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glm

    - name: Clone BFF repository v1.6
      shell: powershell
      run: |
        Write-Host "Cloning BFF v1.6..."
        
        # Clean up any existing files first
        Remove-Item -Path "src" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "apps" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "include" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "deps" -Recurse -Force -ErrorAction SilentlyContinue
        
        # Clone the repository
        git clone --depth 1 --branch v1.6 https://github.com/GeometryCollective/boundary-first-flattening.git bff-source
        
        # Copy the source files
        Write-Host "Copying source files..."
        Copy-Item -Path "bff-source/src" -Destination "." -Recurse -Force
        Copy-Item -Path "bff-source/apps" -Destination "." -Recurse -Force
        Copy-Item -Path "bff-source/include" -Destination "." -Recurse -Force
        Copy-Item -Path "bff-source/deps" -Destination "." -Recurse -Force
        Copy-Item -Path "bff-source/binaries" -Destination "." -Recurse -Force

    - name: Create simple CMakeLists.txt
      shell: powershell
      run: |
        # Create a very simple CMakeLists.txt
        $cmakeContent = @'
cmake_minimum_required(VERSION 3.15)
project(BFF)

set(CMAKE_CXX_STANDARD 17)
set(CMAKE_CXX_STANDARD_REQUIRED ON)

# Get vcpkg paths from environment
set(VCPKG_INSTALLED_DIR "$ENV{VCPKG_ROOT}/installed/$ENV{VCPKG_DEFAULT_TRIPLET}")

# Set include directories
include_directories(
    ${CMAKE_SOURCE_DIR}/include
    ${CMAKE_SOURCE_DIR}/deps/libigl/include
    ${CMAKE_SOURCE_DIR}/deps/spectra/include
    ${VCPKG_INSTALLED_DIR}/include
    ${VCPKG_INSTALLED_DIR}/include/eigen3
)

# Find libraries
file(GLOB CHOLMOD_LIBS "${VCPKG_INSTALLED_DIR}/lib/*cholmod*.lib")
file(GLOB AMD_LIBS "${VCPKG_INSTALLED_DIR}/lib/*amd*.lib")
file(GLOB CAMD_LIBS "${VCPKG_INSTALLED_DIR}/lib/*camd*.lib")
file(GLOB COLAMD_LIBS "${VCPKG_INSTALLED_DIR}/lib/*colamd*.lib")
file(GLOB CCOLAMD_LIBS "${VCPKG_INSTALLED_DIR}/lib/*ccolamd*.lib")
file(GLOB METIS_LIBS "${VCPKG_INSTALLED_DIR}/lib/*metis*.lib")
file(GLOB GLFW_LIBS "${VCPKG_INSTALLED_DIR}/lib/*glfw*.lib")
file(GLOB GLEW_LIBS "${VCPKG_INSTALLED_DIR}/lib/*glew*.lib")

# Get first library found
if(CHOLMOD_LIBS)
    list(GET CHOLMOD_LIBS 0 CHOLMOD_LIBRARY)
    message(STATUS "Found CHOLMOD: ${CHOLMOD_LIBRARY}")
else()
    message(FATAL_ERROR "CHOLMOD library not found")
endif()

if(AMD_LIBS) list(GET AMD_LIBS 0 AMD_LIBRARY) endif()
if(CAMD_LIBS) list(GET CAMD_LIBS 0 CAMD_LIBRARY) endif()
if(COLAMD_LIBS) list(GET COLAMD_LIBS 0 COLAMD_LIBRARY) endif()
if(CCOLAMD_LIBS) list(GET CCOLAMD_LIBS 0 CCOLAMD_LIBRARY) endif()
if(METIS_LIBS) list(GET METIS_LIBS 0 METIS_LIBRARY) endif()

if(GLFW_LIBS)
    list(GET GLFW_LIBS 0 GLFW_LIBRARY)
    message(STATUS "Found GLFW: ${GLFW_LIBRARY}")
else()
    message(FATAL_ERROR "GLFW library not found")
endif()

if(GLEW_LIBS)
    list(GET GLEW_LIBS 0 GLEW_LIBRARY)
    message(STATUS "Found GLEW: ${GLEW_LIBRARY}")
else()
    message(FATAL_ERROR "GLEW library not found")
endif()

# OpenGL
if(WIN32)
    set(OPENGL_LIBRARIES "opengl32")
else()
    set(OPENGL_LIBRARIES "GL")
endif()

# Source files for library
set(SRC_FILES
    ${CMAKE_SOURCE_DIR}/src/bff.cpp
    ${CMAKE_SOURCE_DIR}/src/ConePlacement.cpp
    ${CMAKE_SOURCE_DIR}/src/Cutting.cpp
    ${CMAKE_SOURCE_DIR}/src/Distance.cpp
    ${CMAKE_SOURCE_DIR}/src/HodgeDecomposition.cpp
    ${CMAKE_SOURCE_DIR}/src/LinearSolver.cpp
    ${CMAKE_SOURCE_DIR}/src/Mesh.cpp
    ${CMAKE_SOURCE_DIR}/src/Projection.cpp
    ${CMAKE_SOURCE_DIR}/src/Serialization.cpp
    ${CMAKE_SOURCE_DIR}/src/Vertex.cpp
)

# Create library
add_library(bff-lib STATIC ${SRC_FILES})

# Link libraries
target_link_libraries(bff-lib
    ${CHOLMOD_LIBRARY}
    ${AMD_LIBRARY}
    ${CAMD_LIBRARY}
    ${COLAMD_LIBRARY}
    ${CCOLAMD_LIBRARY}
    ${METIS_LIBRARY}
)

# GUI executable
set(GUI_FILES
    ${CMAKE_SOURCE_DIR}/apps/main.cpp
    ${CMAKE_SOURCE_DIR}/apps/Viewer.cpp
)

if(EXISTS "${CMAKE_SOURCE_DIR}/apps/main.cpp")
    add_executable(bff-gui ${GUI_FILES})
    target_link_libraries(bff-gui bff-lib
        ${OPENGL_LIBRARIES}
        ${GLFW_LIBRARY}
        ${GLEW_LIBRARY}
    )
    target_include_directories(bff-gui PRIVATE ${CMAKE_SOURCE_DIR}/apps)
    message(STATUS "Building GUI application")
else()
    message(WARNING "GUI source files not found")
endif()

# CLI executable
file(GLOB_RECURSE CLI_FILES "${CMAKE_SOURCE_DIR}/binaries/*.cpp")
if(CLI_FILES)
    add_executable(bff-cli ${CLI_FILES})
    target_link_libraries(bff-cli bff-lib)
    target_include_directories(bff-cli PRIVATE ${CMAKE_SOURCE_DIR}/binaries)
    message(STATUS "Building CLI application")
endif()
'@
        
        # Save to file
        $cmakeContent | Out-File -FilePath "CMakeLists.txt" -Encoding UTF8
        Write-Host "Created CMakeLists.txt"

    - name: Configure CMake
      shell: powershell
      run: |
        # Create build directory
        New-Item -ItemType Directory -Force -Path "build"
        
        Write-Host "Configuring CMake..."
        
        # Configure with CMake
        cmake -B build `
          -DCMAKE_BUILD_TYPE=Release `
          -G "Visual Studio 17 2022" `
          -A x64

    - name: Build BFF
      shell: powershell
      run: |
        Write-Host "Building project..."
        cmake --build build --config Release --parallel 4

    - name: Find and copy executables
      shell: powershell
      run: |
        # Create distribution directory
        New-Item -ItemType Directory -Force -Path "dist"
        
        Write-Host "Searching for executables..."
        
        # Search for executables
        $exes = Get-ChildItem -Path "build" -Filter "*.exe" -Recurse
        foreach ($exe in $exes) {
          Write-Host "Found executable: $($exe.FullName)"
          Copy-Item -Path $exe.FullName -Destination "dist\" -Force
        }
        
        if ($exes.Count -eq 0) {
          Write-Host "No executables found! Checking build directory..."
          Get-ChildItem -Path "build" -Recurse | Select-Object -First 20 | Format-Table Name
        }
        
        # Copy DLLs
        $vcpkgBinPath = "$env:VCPKG_ROOT\installed\$env:VCPKG_DEFAULT_TRIPLET\bin"
        if (Test-Path $vcpkgBinPath) {
          Write-Host "Copying DLLs from vcpkg..."
          Get-ChildItem -Path $vcpkgBinPath -Filter "*.dll" | Copy-Item -Destination "dist\" -Force
        }
        
        # List what we have
        Write-Host "`nFiles in dist directory:"
        Get-ChildItem -Path "dist"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BFF-Windows-Binaries
        path: dist/

    - name: Create release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/**
        generate_release_notes: true
