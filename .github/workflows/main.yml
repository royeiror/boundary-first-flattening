name: Build BFF for Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout BFF Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2
    
    - name: Install CMake
      uses: lukka/get-cmake@latest
    
    - name: Download SuiteSparse-METIS from BFF releases
      shell: powershell
      run: |
        Write-Host "Downloading SuiteSparse-METIS pre-built binaries..."
        
        # Create SuiteSparse directory structure
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse" -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse\include" -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse\lib" -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse\include\suitesparse" -ErrorAction SilentlyContinue
        
        # Based on the BFF v1.6 release notes, we need specific SuiteSparse binaries
        # Let's try to download from the repository mentioned in the instructions
        
        # First, check if we have the binaries in the BFF repository
        Write-Host "Checking for SuiteSparse in BFF repository..."
        
        # Look for any .h files that might be SuiteSparse headers
        $hFiles = Get-ChildItem -Path "." -Filter "*.h" -Recurse | Where-Object { 
            $_.Directory.Name -match "suitesparse|cholmod|amd|camd|colamd|ccolamd|metis" -or
            $_.Name -match "cholmod|amd|camd|colamd|ccolamd|metis"
        }
        
        if ($hFiles) {
            Write-Host "Found potential header files:"
            $hFiles | Select-Object -First 10 | ForEach-Object { 
                Write-Host "  $($_.FullName)"
                # Copy to SuiteSparse include directory
                Copy-Item -Path $_.FullName -Destination "C:\SuiteSparse\include\" -Force
            }
        }
        
        # Look for .lib files
        $libFiles = Get-ChildItem -Path "." -Filter "*.lib" -Recurse
        if ($libFiles) {
            Write-Host "Found library files:"
            $libFiles | ForEach-Object { 
                Write-Host "  $($_.FullName)"
                Copy-Item -Path $_.FullName -Destination "C:\SuiteSparse\lib\" -Force
            }
        }
        
        # If we didn't find headers, download them from a known source
        if (-not (Test-Path "C:\SuiteSparse\include\cholmod.h")) {
            Write-Host "Downloading SuiteSparse headers from GitHub..."
            
            # Download SuiteSparse source for headers
            $headersUrl = "https://github.com/jlblancoc/suitesparse-metis-for-windows/archive/master.zip"
            $headersZip = "C:\suitesparse-headers.zip"
            
            Invoke-WebRequest -Uri $headersUrl -OutFile $headersZip
            
            # Extract
            Expand-Archive -Path $headersZip -DestinationPath "C:\suitesparse-temp" -Force
            
            # Find and copy headers
            Get-ChildItem -Path "C:\suitesparse-temp" -Recurse -Filter "*.h" | Where-Object {
                $_.Directory.Name -match "Include|include" -or
                $_.Name -match "cholmod|amd|camd|colamd|ccolamd|metis"
            } | ForEach-Object {
                Copy-Item -Path $_.FullName -Destination "C:\SuiteSparse\include\" -Force
                Write-Host "  Copied header: $($_.Name)"
            }
            
            # Also look for .lib files in the downloaded package
            Get-ChildItem -Path "C:\suitesparse-temp" -Recurse -Filter "*.lib" | ForEach-Object {
                Copy-Item -Path $_.FullName -Destination "C:\SuiteSparse\lib\" -Force
                Write-Host "  Copied library: $($_.Name)"
            }
            
            # Clean up
            Remove-Item -Path "C:\suitesparse-temp" -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -Path $headersZip -Force -ErrorAction SilentlyContinue
        }
        
        Write-Host "SuiteSparse directory contents:"
        Write-Host "Headers in C:\SuiteSparse\include:"
        Get-ChildItem -Path "C:\SuiteSparse\include" -Filter "*.h" | Select-Object -First 10
        
        Write-Host "`nLibraries in C:\SuiteSparse\lib:"
        Get-ChildItem -Path "C:\SuiteSparse\lib" -Filter "*.lib" | Select-Object -First 10
    
    - name: Create CMakeLists.txt with fixed include paths
      shell: powershell
      run: |
        Write-Host "Creating CMakeLists.txt with proper include paths..."
        
        # Start fresh
        if (Test-Path "CMakeLists.txt") {
            Remove-Item "CMakeLists.txt"
        }
        
        # Create new file
        New-Item -ItemType File -Path "CMakeLists.txt" -Force
        
        # Add lines one by one
        'cmake_minimum_required(VERSION 3.5)' | Add-Content -Path "CMakeLists.txt"
        'project(BFF)' | Add-Content -Path "CMakeLists.txt"
        '' | Add-Content -Path "CMakeLists.txt"
        'set(CMAKE_CXX_STANDARD 17)' | Add-Content -Path "CMakeLists.txt"
        'set(CMAKE_CXX_STANDARD_REQUIRED ON)' | Add-Content -Path "CMakeLists.txt"
        '' | Add-Content -Path "CMakeLists.txt"
        
        # Set SuiteSparse paths
        'set(SUITESPARSE_DIR "C:/SuiteSparse")' | Add-Content -Path "CMakeLists.txt"
        'set(SUITESPARSE_INCLUDE_DIR "${SUITESPARSE_DIR}/include")' | Add-Content -Path "CMakeLists.txt"
        'set(SUITESPARSE_LIB_DIR "${SUITESPARSE_DIR}/lib")' | Add-Content -Path "CMakeLists.txt"
        '' | Add-Content -Path "CMakeLists.txt"
        
        # Find libraries
        'find_library(CHOLMOD_LIBRARY NAMES cholmod libcholmod PATHS "${SUITESPARSE_LIB_DIR}" NO_DEFAULT_PATH)' | Add-Content -Path "CMakeLists.txt"
        'find_library(AMD_LIBRARY NAMES amd libamd PATHS "${SUITESPARSE_LIB_DIR}" NO_DEFAULT_PATH)' | Add-Content -Path "CMakeLists.txt"
        'find_library(CAMD_LIBRARY NAMES camd libcamd PATHS "${SUITESPARSE_LIB_DIR}" NO_DEFAULT_PATH)' | Add-Content -Path "CMakeLists.txt"
        'find_library(COLAMD_LIBRARY NAMES colamd libcolamd PATHS "${SUITESPARSE_LIB_DIR}" NO_DEFAULT_PATH)' | Add-Content -Path "CMakeLists.txt"
        'find_library(CCOLAMD_LIBRARY NAMES ccolamd libccolamd PATHS "${SUITESPARSE_LIB_DIR}" NO_DEFAULT_PATH)' | Add-Content -Path "CMakeLists.txt"
        'find_library(METIS_LIBRARY NAMES metis libmetis PATHS "${SUITESPARSE_LIB_DIR}" NO_DEFAULT_PATH)' | Add-Content -Path "CMakeLists.txt"
        '' | Add-Content -Path "CMakeLists.txt"
        
        # Check if libraries were found
        'if(NOT CHOLMOD_LIBRARY)' | Add-Content -Path "CMakeLists.txt"
        '    message(FATAL_ERROR "CHOLMOD library not found in ${SUITESPARSE_LIB_DIR}")' | Add-Content -Path "CMakeLists.txt"
        'else()' | Add-Content -Path "CMakeLists.txt"
        '    message(STATUS "Found CHOLMOD: ${CHOLMOD_LIBRARY}")' | Add-Content -Path "CMakeLists.txt"
        'endif()' | Add-Content -Path "CMakeLists.txt"
        '' | Add-Content -Path "CMakeLists.txt"
        
        # Include directories - add SuiteSparse include with subdirectories
        'include_directories(' | Add-Content -Path "CMakeLists.txt"
        '    ${CMAKE_SOURCE_DIR}/include' | Add-Content -Path "CMakeLists.txt"
        '    ${CMAKE_SOURCE_DIR}/deps/libigl/include' | Add-Content -Path "CMakeLists.txt"
        '    ${CMAKE_SOURCE_DIR}/deps/spectra/include' | Add-Content -Path "CMakeLists.txt"
        '    ${SUITESPARSE_INCLUDE_DIR}' | Add-Content -Path "CMakeLists.txt"
        ')' | Add-Content -Path "CMakeLists.txt"
        '' | Add-Content -Path "CMakeLists.txt"
        
        # Also add target include directories for the library
        'set(CMAKE_INCLUDE_CURRENT_DIR ON)' | Add-Content -Path "CMakeLists.txt"
        '' | Add-Content -Path "CMakeLists.txt"
        
        # Find source files
        'file(GLOB_RECURSE SRC_FILES "src/*.cpp")' | Add-Content -Path "CMakeLists.txt"
        'file(GLOB_RECURSE SRC_HEADERS "src/*.h")' | Add-Content -Path "CMakeLists.txt"
        '' | Add-Content -Path "CMakeLists.txt"
        
        'if(SRC_FILES)' | Add-Content -Path "CMakeLists.txt"
        '    message(STATUS "Found source files")' | Add-Content -Path "CMakeLists.txt"
        '    add_library(bff-lib STATIC ${SRC_FILES})' | Add-Content -Path "CMakeLists.txt"
        'else()' | Add-Content -Path "CMakeLists.txt"
        '    message(FATAL_ERROR "No source files found in src/")' | Add-Content -Path "CMakeLists.txt"
        'endif()' | Add-Content -Path "CMakeLists.txt"
        '' | Add-Content -Path "CMakeLists.txt"
        
        # Link libraries with better error checking
        'target_link_libraries(bff-lib' | Add-Content -Path "CMakeLists.txt"
        '    ${CHOLMOD_LIBRARY}' | Add-Content -Path "CMakeLists.txt"
        '    ${AMD_LIBRARY}' | Add-Content -Path "CMakeLists.txt"
        '    ${CAMD_LIBRARY}' | Add-Content -Path "CMakeLists.txt"
        '    ${COLAMD_LIBRARY}' | Add-Content -Path "CMakeLists.txt"
        '    ${CCOLAMD_LIBRARY}' | Add-Content -Path "CMakeLists.txt"
        '    ${METIS_LIBRARY}' | Add-Content -Path "CMakeLists.txt"
        ')' | Add-Content -Path "CMakeLists.txt"
        '' | Add-Content -Path "CMakeLists.txt"
        
        # GUI application
        'file(GLOB_RECURSE GUI_FILES "apps/*.cpp")' | Add-Content -Path "CMakeLists.txt"
        'if(GUI_FILES)' | Add-Content -Path "CMakeLists.txt"
        '    add_executable(bff-gui ${GUI_FILES})' | Add-Content -Path "CMakeLists.txt"
        '    target_link_libraries(bff-gui bff-lib)' | Add-Content -Path "CMakeLists.txt"
        '    target_include_directories(bff-gui PRIVATE ${CMAKE_SOURCE_DIR}/apps)' | Add-Content -Path "CMakeLists.txt"
        '    message(STATUS "Building GUI application")' | Add-Content -Path "CMakeLists.txt"
        'else()' | Add-Content -Path "CMakeLists.txt"
        '    message(WARNING "No GUI files found")' | Add-Content -Path "CMakeLists.txt"
        'endif()' | Add-Content -Path "CMakeLists.txt"
        
        Write-Host "CMakeLists.txt created successfully"
    
    - name: Configure CMake
      shell: powershell
      run: |
        # Create build directory
        New-Item -ItemType Directory -Force -Path "build"
        cd build
        
        Write-Host "Configuring CMake..."
        
        # Configure with CMake
        cmake -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_BUILD_TYPE=Release `
          ..
        
        if ($LASTEXITCODE -ne 0) {
            Write-Host "CMake configuration failed with exit code: $LASTEXITCODE"
            Write-Host "Checking what CMake found..."
            
            # Try to see what the issue is
            if (Test-Path "CMakeCache.txt") {
                Get-Content "CMakeCache.txt" | Select-String "CHOLMOD|SuiteSparse" | Select-Object -First 10
            }
        } else {
            Write-Host "CMake configuration successful!"
        }
    
    - name: Build project
      shell: powershell
      run: |
        if (Test-Path "build\CMakeCache.txt") {
            Write-Host "Building project..."
            cd build
            cmake --build . --config Release --parallel 4
            
            # Check for BFF executables
            $bffExes = Get-ChildItem -Path "." -Filter "*bff*.exe" -Recurse
            if ($bffExes) {
                Write-Host "Build successful! Found BFF executables:"
                $bffExes | ForEach-Object { Write-Host "  $($_.FullName)" }
            } else {
                Write-Host "Build completed but no BFF executables found"
                Write-Host "Looking for any executables..."
                Get-ChildItem -Path "." -Filter "*.exe" -Recurse | ForEach-Object { Write-Host "  $($_.FullName)" }
            }
        } else {
            Write-Host "Skipping build - CMake configuration failed"
        }
    
    - name: Collect real artifacts
      shell: powershell
      run: |
        # Create artifacts directory
        New-Item -ItemType Directory -Force -Path "artifacts" -ErrorAction SilentlyContinue
        
        # Find BFF executables (not compiler test files)
        $bffExes = Get-ChildItem -Path "." -Recurse -Filter "*.exe" | Where-Object {
            $_.FullName -notmatch "CompilerId" -and
            $_.FullName -match "bff|BFF"
        }
        
        if ($bffExes) {
            Write-Host "Found BFF executables:"
            foreach ($exe in $bffExes) {
                Write-Host "  $($exe.FullName)"
                Copy-Item -Path $exe.FullName -Destination "artifacts\" -Force
            }
        } else {
            Write-Host "No BFF executables found"
            
            # Look for any executables that aren't compiler tests
            $otherExes = Get-ChildItem -Path "." -Recurse -Filter "*.exe" | Where-Object {
                $_.FullName -notmatch "CompilerId"
            }
            
            if ($otherExes) {
                Write-Host "Found other executables:"
                foreach ($exe in $otherExes) {
                    Write-Host "  $($exe.FullName)"
                    Copy-Item -Path $exe.FullName -Destination "artifacts\" -Force
                }
            }
        }
        
        # Copy any DLLs from SuiteSparse
        if (Test-Path "C:\SuiteSparse\lib") {
            $dlls = Get-ChildItem -Path "C:\SuiteSparse\lib" -Filter "*.dll"
            foreach ($dll in $dlls) {
                Copy-Item -Path $dll.FullName -Destination "artifacts\" -Force
                Write-Host "  Copied DLL: $($dll.Name)"
            }
        }
        
        Write-Host "Artifacts directory contents:"
        Get-ChildItem -Path "artifacts" -ErrorAction SilentlyContinue
    
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BFF-Windows-Build
        path: artifacts/
        if-no-files-found: warn
