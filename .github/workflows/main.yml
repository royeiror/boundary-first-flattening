name: Analyze BFF Viewer Structure

on: workflow_dispatch

jobs:
  analyze:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Analyze source for viewer
      run: |
        echo "=== Looking for viewer source files ==="
        if (Test-Path "src/viewer") {
            echo "Viewer directory found:"
            dir src/viewer -Recurse
        }
        if (Test-Path "src/gui") {
            echo "GUI directory found:"
            dir src/gui -Recurse
        }
        
        echo "=== Searching for viewer in CMakeLists ==="
        Get-ChildItem -Path . -Recurse -Filter "CMakeLists.txt" | ForEach-Object {
            echo "Checking: $($_.FullName)"
            Get-Content $_ | Select-String -Pattern "viewer|gui|visualizer" | ForEach-Object {
                echo "  Found: $_"
            }
        }
        
        echo "=== Possible viewer entry points ==="
        Get-ChildItem -Path . -Recurse -Filter "*.cpp" | Select-String -Pattern "main.*\(.*argc.*argv" | ForEach-Object {
            echo "Main function in: $($_.Filename)"
        }
