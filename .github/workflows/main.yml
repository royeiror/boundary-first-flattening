name: Build BFF Windows with GUI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  SUITESPARSE_VERSION: "7.1.0"
  BUILD_TYPE: "Release"

jobs:
  build-suite-sparse:
    name: Build SuiteSparse
    runs-on: windows-latest
    outputs:
      suitesparse-path: ${{ steps.set-output.outputs.suitesparse-path }}
    steps:
      - name: Checkout SuiteSparse
        uses: actions/checkout@v4
        with:
          repository: jlblancoc/suitesparse-metis-for-windows
          # REMOVE this line: ref: windows-vs2019
          path: suitesparse-src

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v1
        with:
          cmake-version: "3.25.x"

      - name: Install required tools
        run: |
          choco install nasm -y

      - name: Build SuiteSparse
        run: |
          mkdir suitesparse-build
          cd suitesparse-build
          cmake ../suitesparse-src `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX=../install `
            -DBLA_VENDOR=OpenBLAS `
            -DBUILD_METIS=ON `
            -DBUILD_CXSparse=ON `
            -DBUILD_CHOLMOD=ON `
            -DBUILD_UMFPACK=ON `
            -DBUILD_SPQR=ON `
            -DBUILD_AMD=ON `
            -DBUILD_CAMD=ON `
            -DBUILD_CCOLAMD=ON `
            -DBUILD_COLAMD=ON `
            -DBUILD_CCOLAMD=ON `
            -DBUILD_Suitesparseconfig=ON `
            -DBUILD_KT_RICHEXT=OFF `
            -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON
          
          cmake --build . --config Release --target install --parallel

      - name: Set SuiteSparse path
        id: set-output
        run: |
          # First navigate back to the suitesparse-build directory
          cd suitesparse-build
          # Now go up one level to find the install directory
          cd ..
          $path = (Resolve-Path "install").Path
          echo "suitesparse-path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload SuiteSparse artifacts
        uses: actions/upload-artifact@v4
        with:
          name: suitesparse-windows
          path: |
            install/
            !install/**/*.pdb
            
  build-bff:
    name: Build BFF
    runs-on: windows-latest
    needs: build-suite-sparse
    steps:
      - name: Checkout BFF
        uses: actions/checkout@v4
        with:
          repository: GeometryCollective/boundary-first-flattening
          ref: v1.6
          submodules: recursive

      - name: Download SuiteSparse artifacts
        uses: actions/download-artifact@v4
        with:
          name: suitesparse-windows
          path: suitesparse-deps

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v1
        with:
          cmake-version: "3.25.x"

      - name: Install dependencies
        run: |
          choco install eigen openblas -y
          choco install vcpkg -y
          vcpkg integrate install
          vcpkg install glew freeglut libpng tiff --triplet x64-windows

      - name: Patch BFF CMakeLists.txt
        run: |
          $SUITESPARSE_DIR = (Resolve-Path "suitesparse-deps/install").Path
          
          # Create a custom CMake script to find SuiteSparse
          $CUSTOM_FIND = 'set(SUITESPARSE_DIR "' + $SUITESPARSE_DIR + '")\n' +
            'set(SUITESPARSE_INCLUDE_DIR "${SUITESPARSE_DIR}/include")\n' +
            'set(SUITESPARSE_LIBRARY_DIR "${SUITESPARSE_DIR}/lib")\n' +
            '\n' +
            'file(GLOB SUITESPARSE_LIBRARIES "${SUITESPARSE_LIBRARY_DIR}/*.lib")\n' +
            '\n' +
            'set(SUITESPARSE_INCLUDE_DIRS "${SUITESPARSE_INCLUDE_DIR}")\n' +
            'set(SUITESPARSE_LIBRARIES "${SUITESPARSE_LIBRARIES}")\n' +
            'set(SUITESPARSE_FOUND TRUE)\n' +
            '\n' +
            'message(STATUS "SuiteSparse manually configured:")\n' +
            'message(STATUS "  Include dir: ${SUITESPARSE_INCLUDE_DIR}")\n' +
            'message(STATUS "  Library dir: ${SUITESPARSE_LIBRARY_DIR}")\n' +
            'message(STATUS "  Libraries: ${SUITESPARSE_LIBRARIES}")\n'
          
          Set-Content -Path "FindSuiteSparseCustom.cmake" -Value $CUSTOM_FIND
          
          # Patch the main CMakeLists.txt to use our custom find script
          $PATCH = 'find_package(Eigen3 3.2 REQUIRED)\n' +
            '\n' +
            '# Manually set SuiteSparse paths before find_package\n' +
            'set(SUITESPARSE_DIR "' + $SUITESPARSE_DIR + '")\n' +
            'set(SUITESPARSE_INCLUDE_DIR "${SUITESPARSE_DIR}/include")\n' +
            'set(SUITESPARSE_LIBRARY_DIR "${SUITESPARSE_DIR}/lib")\n' +
            '\n' +
            '# Override the find module\n' +
            'set(SuiteSparse_FOUND TRUE)\n' +
            'set(SuiteSparse_INCLUDE_DIRS "${SUITESPARSE_INCLUDE_DIR}")\n' +
            'set(SuiteSparse_LIBRARY_DIRS "${SUITESPARSE_LIBRARY_DIR}")\n' +
            '\n' +
            'file(GLOB SuiteSparse_LIBRARIES "${SUITESPARSE_LIBRARY_DIR}/*.lib")\n' +
            '\n' +
            'message(STATUS "SuiteSparse manually configured:")\n' +
            'message(STATUS "  Include dir: ${SUITESPARSE_INCLUDE_DIR}")\n' +
            'message(STATUS "  Library dir: ${SUITESPARSE_LIBRARY_DIR}")\n' +
            '\n' +
            'find_package(OpenGL REQUIRED)\n'
          
          # Read the original file and patch it
          $content = Get-Content -Path "CMakeLists.txt" -Raw
          # Insert our patch after Eigen3 find_package
          $pattern = 'find_package\(Eigen3 3\.2 REQUIRED\)'
          $replacement = $PATCH
          $content = $content -replace $pattern, $replacement
          Set-Content -Path "CMakeLists.txt" -Value $content

      - name: Configure BFF
        run: |
          mkdir build
          cd build
          
          $SUITESPARSE_DIR = (Resolve-Path "../suitesparse-deps/install").Path
          
          # Find OpenBLAS from Chocolatey
          $OPENBLAS_DIR = "C:\tools\openblas"
          
          cmake .. `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$SUITESPARSE_DIR" `
            -DCMAKE_INCLUDE_PATH="$SUITESPARSE_DIR/include" `
            -DCMAKE_LIBRARY_PATH="$SUITESPARSE_DIR/lib" `
            -DEigen3_DIR="C:\tools\eigen\share\eigen3\cmake" `
            -DOpenBLAS_DIR="$OPENBLAS_DIR" `
            -DBUILD_GUI=ON `
            -DBUILD_CLI=ON `
            -DBUILD_WITH_OPENMP=ON `
            -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON `
            -G "Visual Studio 17 2022" `
            -A x64

      - name: Build BFF
        run: |
          cd build
          cmake --build . --config Release --parallel

      - name: Collect DLLs and package
        run: |
          mkdir -p bff-package
          
          # Copy executables
          Copy-Item "build/Release/BFF_GUI.exe" -Destination "bff-package/"
          Copy-Item "build/Release/BFF_CLI.exe" -Destination "bff-package/" -ErrorAction SilentlyContinue
          
          # Copy required DLLs using a more comprehensive approach
          $dlls = @()
          
          # Function to collect DLLs recursively
          function Get-Dependencies($path) {
            $result = dumpbin /DEPENDENTS $path | Where-Object { $_ -match "\.dll" } | ForEach-Object { $_.Trim() }
            return $result
          }
          
          # Collect DLLs for GUI executable
          $guiDeps = Get-Dependencies "bff-package/BFF_GUI.exe"
          $dlls += $guiDeps
          
          # Collect from build directory
          Get-ChildItem "build/Release/*.dll" | Copy-Item -Destination "bff-package/"
          
          # Collect from common system locations
          $systemDirs = @(
            "C:\Windows\System32",
            "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Redist\MSVC\14.38.33130\x64\Microsoft.VC143.CRT",
            "C:\tools\openblas\bin",
            "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin"
          )
          
          foreach ($dll in $dlls) {
            foreach ($dir in $systemDirs) {
              $dllPath = Join-Path $dir $dll
              if (Test-Path $dllPath) {
                Copy-Item $dllPath -Destination "bff-package/" -ErrorAction SilentlyContinue
                break
              }
            }
          }
          
          # Copy SuiteSparse DLLs
          Copy-Item "suitesparse-deps/install/bin/*.dll" -Destination "bff-package/" -ErrorAction SilentlyContinue
          Copy-Item "suitesparse-deps/install/lib/*.dll" -Destination "bff-package/" -ErrorAction SilentlyContinue
          
          # Create a simple README
          $README = 'Boundary First Flattening (BFF) v1.6 Windows Build\n' +
            '=================================================\n' +
            '\n' +
            'This package contains:\n' +
            '1. BFF_GUI.exe - The graphical user interface\n' +
            '2. All required DLL dependencies\n' +
            '\n' +
            'Requirements:\n' +
            '- Windows 10 or later\n' +
            '- Visual C++ Redistributable 2022 (should be included)\n' +
            '\n' +
            'Usage:\n' +
            '1. Double-click BFF_GUI.exe to launch the application\n' +
            '2. Use File menu to open OBJ files\n' +
            '\n' +
            'Note: This is an automated build from GitHub Actions.\n'
          
          Set-Content -Path "bff-package/README.txt" -Value $README
          
          # Verify the executable runs
          & "bff-package/BFF_GUI.exe" --version

      - name: Upload BFF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bff-windows-gui
          path: |
            bff-package/
          retention-days: 7

      - name: Create release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: bff-package/*
          draft: true
          prerelease: false
