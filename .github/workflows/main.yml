name: Build BFF for Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [created]
  workflow_dispatch:

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-windows

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install vcpkg and dependencies
      shell: powershell
      run: |
        # Install vcpkg
        git clone https://github.com/Microsoft/vcpkg.git $env:VCPKG_ROOT
        & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"
        
        # Install required dependencies
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET eigen3
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET libigl
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET suitesparse
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET metis
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glfw3
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glew
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET freeglut
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glm

    - name: Check what libraries vcpkg installed
      shell: powershell
      run: |
        Write-Host "Checking what libraries vcpkg installed..."
        $vcpkgLibDir = "$env:VCPKG_ROOT\installed\$env:VCPKG_DEFAULT_TRIPLET\lib"
        
        if (Test-Path $vcpkgLibDir) {
          Write-Host "Library files in $( $vcpkgLibDir ):"
          Get-ChildItem -Path $vcpkgLibDir -Filter "*.lib" | Select-Object -First 20 | Format-Table Name
        }

    - name: Create simple CMakeLists.txt
      shell: powershell
      run: |
        # Create a minimal CMakeLists.txt
        $cmakeContent = @'
cmake_minimum_required(VERSION 3.15)
project(BFF)

set(CMAKE_CXX_STANDARD 17)
set(CMAKE_CXX_STANDARD_REQUIRED ON)

# Get vcpkg paths from environment
set(VCPKG_INSTALLED_DIR "$ENV{VCPKG_ROOT}/installed/$ENV{VCPKG_DEFAULT_TRIPLET}")

# Find Eigen3
find_package(Eigen3 REQUIRED)

# Find OpenGL
find_package(OpenGL REQUIRED)

# Use file glob to find all needed libraries
file(GLOB CHOLMOD_LIBS "${VCPKG_INSTALLED_DIR}/lib/*cholmod*.lib")
file(GLOB AMD_LIBS "${VCPKG_INSTALLED_DIR}/lib/*amd*.lib")
file(GLOB CAMD_LIBS "${VCPKG_INSTALLED_DIR}/lib/*camd*.lib")
file(GLOB COLAMD_LIBS "${VCPKG_INSTALLED_DIR}/lib/*colamd*.lib")
file(GLOB CCOLAMD_LIBS "${VCPKG_INSTALLED_DIR}/lib/*ccolamd*.lib")
file(GLOB METIS_LIBS "${VCPKG_INSTALLED_DIR}/lib/*metis*.lib")
file(GLOB GLFW_LIBS "${VCPKG_INSTALLED_DIR}/lib/*glfw*.lib")
file(GLOB GLEW_LIBS "${VCPKG_INSTALLED_DIR}/lib/*glew*.lib")

# Check if libraries were found
if(NOT CHOLMOD_LIBS)
    message(FATAL_ERROR "CHOLMOD library not found")
else()
    list(GET CHOLMOD_LIBS 0 CHOLMOD_LIBRARY)
    message(STATUS "Found CHOLMOD: ${CHOLMOD_LIBRARY}")
endif()

if(NOT AMD_LIBS)
    message(FATAL_ERROR "AMD library not found")
else()
    list(GET AMD_LIBS 0 AMD_LIBRARY)
endif()

if(NOT CAMD_LIBS)
    message(FATAL_ERROR "CAMD library not found")
else()
    list(GET CAMD_LIBS 0 CAMD_LIBRARY)
endif()

if(NOT COLAMD_LIBS)
    message(FATAL_ERROR "COLAMD library not found")
else()
    list(GET COLAMD_LIBS 0 COLAMD_LIBRARY)
endif()

if(NOT CCOLAMD_LIBS)
    message(FATAL_ERROR "CCOLAMD library not found")
else()
    list(GET CCOLAMD_LIBS 0 CCOLAMD_LIBRARY)
endif()

if(NOT METIS_LIBS)
    message(FATAL_ERROR "METIS library not found")
else()
    list(GET METIS_LIBS 0 METIS_LIBRARY)
endif()

if(NOT GLFW_LIBS)
    message(FATAL_ERROR "GLFW library not found")
else()
    list(GET GLFW_LIBS 0 GLFW_LIBRARY)
    message(STATUS "Found GLFW: ${GLFW_LIBRARY}")
endif()

if(NOT GLEW_LIBS)
    message(FATAL_ERROR "GLEW library not found")
else()
    list(GET GLEW_LIBS 0 GLEW_LIBRARY)
    message(STATUS "Found GLEW: ${GLEW_LIBRARY}")
endif()

# Include directories
include_directories(
    ${CMAKE_SOURCE_DIR}/include
    ${CMAKE_SOURCE_DIR}/deps/libigl/include
    ${CMAKE_SOURCE_DIR}/deps/spectra/include
    ${Eigen3_INCLUDE_DIRS}
    ${VCPKG_INSTALLED_DIR}/include
)

# Find source files
file(GLOB_RECURSE SRC_FILES "src/*.cpp")
file(GLOB_RECURSE SRC_HEADERS "src/*.h")

if(NOT SRC_FILES)
    message(FATAL_ERROR "No source files found in src/ directory")
endif()

# Create library
add_library(bff-lib STATIC ${SRC_FILES})

# Link libraries
target_link_libraries(bff-lib
    ${CHOLMOD_LIBRARY}
    ${AMD_LIBRARY}
    ${CAMD_LIBRARY}
    ${COLAMD_LIBRARY}
    ${CCOLAMD_LIBRARY}
    ${METIS_LIBRARY}
)

# GUI executable
file(GLOB_RECURSE GUI_FILES "apps/*.cpp")
if(GUI_FILES)
    add_executable(bff-gui ${GUI_FILES})
    target_link_libraries(bff-gui bff-lib
        ${OPENGL_LIBRARIES}
        ${GLFW_LIBRARY}
        ${GLEW_LIBRARY}
    )
    target_include_directories(bff-gui PRIVATE ${CMAKE_SOURCE_DIR}/apps)
    message(STATUS "Building GUI application")
endif()

# CLI executable
file(GLOB_RECURSE CLI_FILES "binaries/*.cpp")
if(CLI_FILES)
    add_executable(bff-cli ${CLI_FILES})
    target_link_libraries(bff-cli bff-lib)
    target_include_directories(bff-cli PRIVATE ${CMAKE_SOURCE_DIR}/binaries)
    message(STATUS "Building CLI application")
endif()
'@
        
        # Save to file - using Out-File with UTF8 encoding
        $cmakeContent | Out-File -FilePath "CMakeLists.txt" -Encoding UTF8
        Write-Host "Created CMakeLists.txt"

    - name: Check if we need to clone BFF
      shell: powershell
      run: |
        # Check if we have the BFF source files
        if (-not (Test-Path "src") -and -not (Test-Path "apps")) {
          Write-Host "BFF source not found, cloning v1.6..."
          git clone --recursive --branch v1.6 https://github.com/GeometryCollective/boundary-first-flattening.git bff-temp
          # Copy everything except .git
          Get-ChildItem -Path "bff-temp" -Exclude ".git" | Copy-Item -Destination "." -Recurse -Force
        }

    - name: Configure CMake
      shell: powershell
      run: |
        # Create build directory
        New-Item -ItemType Directory -Force -Path "build"
        
        Write-Host "Configuring CMake with vcpkg toolchain..."
        
        # Configure with CMake
        cmake -B build `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=$env:VCPKG_DEFAULT_TRIPLET `
          -G "Visual Studio 17 2022" `
          -A x64

    - name: Build BFF
      shell: powershell
      run: |
        Write-Host "Building project..."
        cmake --build build --config Release --parallel 4

    - name: Find and copy executables
      shell: powershell
      run: |
        # Create distribution directory
        New-Item -ItemType Directory -Force -Path "dist"
        
        Write-Host "Searching for executables..."
        
        # Search for executables
        $exes = Get-ChildItem -Path "build" -Filter "*.exe" -Recurse
        foreach ($exe in $exes) {
          Write-Host "Found executable: $($exe.FullName)"
          Copy-Item -Path $exe.FullName -Destination "dist\" -Force
        }
        
        # Copy DLLs
        $vcpkgBinPath = "$env:VCPKG_ROOT\installed\$env:VCPKG_DEFAULT_TRIPLET\bin"
        if (Test-Path $vcpkgBinPath) {
          Write-Host "Copying DLLs from vcpkg..."
          Get-ChildItem -Path $vcpkgBinPath -Filter "*.dll" | Copy-Item -Destination "dist\" -Force
        }
        
        # List what we have
        Write-Host "`nFiles in dist directory:"
        Get-ChildItem -Path "dist"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BFF-Windows-Binaries
        path: dist/

    - name: Create release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/**
        generate_release_notes: true
