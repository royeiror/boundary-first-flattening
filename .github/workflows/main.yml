name: Build BFF Manual

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install build tools
      run: |
        choco install cmake -y

    - name: Use provided dependencies
      run: |
        echo "=== Using dependencies from repository ==="
        if (Test-Path "deps") {
            dir "deps" -Recurse
        }

    - name: Simple direct build
      run: |
        # Fix CMake minimum version
        (Get-Content CMakeLists.txt) -replace 'cmake_minimum_required\(.*\)', 'cmake_minimum_required(VERSION 3.5)' | Set-Content CMakeLists.txt
        
        # Remove SuiteSparse requirement
        (Get-Content CMakeLists.txt) -replace 'find_package\(SuiteSparse REQUIRED\)', '# find_package(SuiteSparse)' | Set-Content CMakeLists.txt
        
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -G "Visual Studio 17 2022" -A x64 -Wno-dev
        cmake --build . --config Release --target bff-command-line

    - name: Upload result
      uses: actions/upload-artifact@v4
      with:
        name: bff-simple
        path: build/Release/bff-command-line.exe
