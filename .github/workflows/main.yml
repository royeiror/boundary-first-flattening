name: Build BFF with vcpkg

on: 
  push:
    tags: ['v*']
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup vcpkg
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        .\vcpkg\bootstrap-vcpkg.bat

    - name: Install dependencies
      run: |
        .\vcpkg\vcpkg install suitesparse openblas eigen3 --triplet x64-windows

    - name: Fix CMake minimum version
      run: |
        if (Test-Path "CMakeLists.txt") {
            (Get-Content CMakeLists.txt) -replace 'cmake_minimum_required\(.*\)', 'cmake_minimum_required(VERSION 3.5)' | Set-Content CMakeLists.txt
        }

    - name: Configure BFF
      run: |
        mkdir build
        cd build
        cmake .. `
          -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake `
          -DCMAKE_BUILD_TYPE=Release `
          -G "Visual Studio 17 2022" -A x64

    - name: Build BFF
      run: |
        cd build
        cmake --build . --config Release --target bff-command-line --parallel

    - name: Collect binaries
      run: |
        mkdir dist
        # Look for the executable in common locations
        $possiblePaths = @(
            "build/Release/bff-command-line.exe",
            "build/src/Release/bff-command-line.exe", 
            "build/bff-command-line.exe",
            "build/src/bff-command-line.exe"
        )
        
        foreach ($path in $possiblePaths) {
            if (Test-Path $path) {
                Copy-Item $path "dist/"
                echo "✓ Found and copied: $path"
            }
        }
        
        echo "Final dist contents:"
        dir dist -Recurse

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bff-command-line
        path: dist/*
        retention-days: 30
