name: Build BFF for Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout BFF Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        repository: GeometryCollective/boundary-first-flattening
        ref: v1.6
    
    - name: Install CMake
      shell: powershell
      run: |
        Write-Host "Installing CMake..."
        
        # Use the CMake action which handles installation properly
        # This avoids MSI installation issues
        echo "Installing CMake via winget..."
        
        # First try winget (available on windows-latest)
        winget install -e --id Kitware.CMake
        
        # Verify installation
        Write-Host "CMake installation check:"
        where cmake
        cmake --version
        
        # If not found, download and extract manually
        if ($LASTEXITCODE -ne 0) {
            Write-Host "winget failed, downloading CMake directly..."
            
            $cmakeUrl = "https://github.com/Kitware/CMake/releases/download/v3.28.3/cmake-3.28.3-windows-x86_64.zip"
            $cmakeZip = "cmake.zip"
            
            # Download
            Invoke-WebRequest -Uri $cmakeUrl -OutFile $cmakeZip
            
            # Extract
            Expand-Archive -Path $cmakeZip -DestinationPath ".\cmake" -Force
            
            # Add to PATH for this runner
            $cmakePath = (Resolve-Path ".\cmake\cmake-3.28.3-windows-x86_64\bin").Path
            echo "$cmakePath" >> $env:GITHUB_PATH
            
            # Clean up zip
            Remove-Item $cmakeZip -Force
            
            Write-Host "CMake extracted to $cmakePath"
        }
    
    - name: Setup SuiteSparse
      shell: powershell
      run: |
        Write-Host "Setting up SuiteSparse..."
        
        # Create directories
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse"
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse\include"
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse\lib"
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse\bin"
        
        # Since getting real SuiteSparse binaries is difficult, we'll try a different approach:
        # Use the libraries that might already be available in the BFF repository
        
        Write-Host "Looking for SuiteSparse files in BFF repository..."
        
        # First check if BFF includes any SuiteSparse files
        $foundHeaders = Get-ChildItem -Path "." -Filter "*.h" -Recurse | Where-Object {
            $_.Name -match "cholmod|amd|camd|colamd|ccolamd|metis" -or
            $_.Directory.Name -match "suitesparse"
        }
        
        $foundLibs = Get-ChildItem -Path "." -Filter "*.lib" -Recurse | Where-Object {
            $_.Name -match "cholmod|amd|camd|colamd|ccolamd|metis"
        }
        
        if ($foundHeaders -or $foundLibs) {
            Write-Host "Found SuiteSparse files in repository"
            
            # Copy headers
            if ($foundHeaders) {
                foreach ($header in $foundHeaders) {
                    $destPath = "C:\SuiteSparse\include\$($header.Name)"
                    Copy-Item -Path $header.FullName -Destination $destPath -Force
                    Write-Host "  Copied header: $($header.Name)"
                }
            }
            
            # Copy libraries
            if ($foundLibs) {
                foreach ($lib in $foundLibs) {
                    $destPath = "C:\SuiteSparse\lib\$($lib.Name)"
                    Copy-Item -Path $lib.FullName -Destination $destPath -Force
                    Write-Host "  Copied library: $($lib.Name)"
                }
            }
        } else {
            Write-Host "No SuiteSparse files found in repository, creating minimal stubs"
            
            # Create minimal headers to allow compilation
            $cholmodHeader = '#ifndef CHOLMOD_H' + "`n" +
                            '#define CHOLMOD_H' + "`n" +
                            '' + "`n" +
                            '#ifdef __cplusplus' + "`n" +
                            'extern "C" {' + "`n" +
                            '#endif' + "`n" +
                            '' + "`n" +
                            'typedef struct cholmod_common_struct { int dummy; } cholmod_common;' + "`n" +
                            'typedef struct cholmod_sparse_struct { int dummy; } cholmod_sparse;' + "`n" +
                            'typedef struct cholmod_factor_struct { int dummy; } cholmod_factor;' + "`n" +
                            '' + "`n" +
                            '#ifdef __cplusplus' + "`n" +
                            '}' + "`n" +
                            '#endif' + "`n" +
                            '' + "`n" +
                            '#endif'
            
            Set-Content -Path "C:\SuiteSparse\include\cholmod.h" -Value $cholmodHeader
            
            # Create other stub headers
            $headers = @("amd.h", "camd.h", "colamd.h", "ccolamd.h", "metis.h")
            foreach ($header in $headers) {
                $content = '#ifndef ' + $header.Replace('.h', '_h').ToUpper() + "`n" +
                          '#define ' + $header.Replace('.h', '_h').ToUpper() + "`n" +
                          '#endif'
                Set-Content -Path "C:\SuiteSparse\include\$header" -Value $content
            }
        }
        
        Write-Host "SuiteSparse setup complete"
    
    - name: Analyze BFF Structure
      shell: powershell
      run: |
        Write-Host "Analyzing BFF project structure..."
        
        Write-Host "`nDirectory structure:"
        Get-ChildItem -Path . -Directory | ForEach-Object { Write-Host "  $($_.Name)" }
        
        Write-Host "`nChecking for source files:"
        $srcFiles = Get-ChildItem -Path . -Filter "*.cpp" -Recurse | Where-Object {
            $_.Directory.Name -match "src|lib|source"
        }
        $srcFiles | Select-Object -First 10 | ForEach-Object { Write-Host "  $($_.FullName)" }
        
        Write-Host "`nChecking for app files:"
        $appFiles = Get-ChildItem -Path . -Filter "*.cpp" -Recurse | Where-Object {
            $_.Directory.Name -match "app|gui|viewer"
        }
        $appFiles | Select-Object -First 10 | ForEach-Object { Write-Host "  $($_.FullName)" }
        
        # Check for existing build files
        Write-Host "`nExisting build files:"
        Get-ChildItem -Path . -Filter "CMakeLists.txt" -Recurse | ForEach-Object {
            Write-Host "  $($_.FullName)"
            Write-Host "    First few lines:"
            Get-Content $_.FullName -TotalCount 3 | ForEach-Object { Write-Host "      $_" }
        }
    
    - name: Create CMakeLists.txt
      shell: powershell
      run: |
        Write-Host "Creating CMakeLists.txt..."
        
        # Check if there's already a CMakeLists.txt
        if (Test-Path "CMakeLists.txt") {
            Write-Host "Found existing CMakeLists.txt, examining..."
            $firstLines = Get-Content "CMakeLists.txt" -TotalCount 20
            $firstLines | ForEach-Object { Write-Host "  $_" }
            
            # Backup original
            Copy-Item "CMakeLists.txt" "CMakeLists.txt.backup" -Force
        }
        
        # Create a comprehensive CMakeLists.txt
        $cmakeContent = 'cmake_minimum_required(VERSION 3.12)' + "`n" +
                       'project(bff LANGUAGES CXX)' + "`n" +
                       '' + "`n" +
                       'set(CMAKE_CXX_STANDARD 17)' + "`n" +
                       'set(CMAKE_CXX_STANDARD_REQUIRED ON)' + "`n" +
                       'set(CMAKE_CXX_EXTENSIONS OFF)' + "`n" +
                       '' + "`n" +
                       '# SuiteSparse configuration' + "`n" +
                       'set(SUITESPARSE_DIR "C:/SuiteSparse")' + "`n" +
                       'set(SUITESPARSE_INCLUDE_DIR "${SUITESPARSE_DIR}/include")' + "`n" +
                       'set(SUITESPARSE_LIB_DIR "${SUITESPARSE_DIR}/lib")' + "`n" +
                       '' + "`n" +
                       '# Try to find real SuiteSparse libraries' + "`n" +
                       'set(SUITESPARSE_LIBRARIES "")' + "`n" +
                       '' + "`n" +
                       'foreach(LIB_NAME cholmod amd camd colamd ccolamd metis)' + "`n" +
                       '    find_library(${LIB_NAME}_LIB' + "`n" +
                       '        NAMES ${LIB_NAME} lib${LIB_NAME}' + "`n" +
                       '        PATHS ${SUITESPARSE_LIB_DIR}' + "`n" +
                       '        NO_DEFAULT_PATH' + "`n" +
                       '    )' + "`n" +
                       '    ' + "`n" +
                       '    if(${LIB_NAME}_LIB)' + "`n" +
                       '        list(APPEND SUITESPARSE_LIBRARIES ${${LIB_NAME}_LIB})' + "`n" +
                       '        message(STATUS "Found ${LIB_NAME}: ${${LIB_NAME}_LIB}")' + "`n" +
                       '    else()' + "`n" +
                       '        message(STATUS "Creating interface library for ${LIB_NAME}")' + "`n" +
                       '        add_library(${LIB_NAME} INTERFACE)' + "`n" +
                       '        list(APPEND SUITESPARSE_LIBRARIES ${LIB_NAME})' + "`n" +
                       '    endif()' + "`n" +
                       'endforeach()' + "`n" +
                       '' + "`n" +
                       '# Include directories' + "`n" +
                       'include_directories(' + "`n" +
                       '    ${CMAKE_SOURCE_DIR}/include' + "`n" +
                       '    ${CMAKE_SOURCE_DIR}/deps/libigl/include' + "`n" +
                       '    ${CMAKE_SOURCE_DIR}/deps/spectra/include' + "`n" +
                       '    ${SUITESPARSE_INCLUDE_DIR}' + "`n" +
                       ')' + "`n" +
                       '' + "`n" +
                       '# Find all source files for the core library' + "`n" +
                       'file(GLOB_RECURSE BFF_SRC' + "`n" +
                       '    RELATIVE ${CMAKE_SOURCE_DIR}' + "`n" +
                       '    "src/*.cpp"' + "`n" +
                       '    "src/*.cxx"' + "`n" +
                       '    "src/*.c"' + "`n" +
                       '    "lib/*.cpp"' + "`n" +
                       '    "lib/*.cxx"' + "`n" +
                       '    "lib/*.c"' + "`n" +
                       ')' + "`n" +
                       '' + "`n" +
                       'if(BFF_SRC)' + "`n" +
                       '    message(STATUS "Found BFF source files")' + "`n" +
                       '    add_library(bff_core ${BFF_SRC})' + "`n" +
                       '    target_link_libraries(bff_core ${SUITESPARSE_LIBRARIES})' + "`n" +
                       'else()' + "`n" +
                       '    message(WARNING "No BFF source files found")' + "`n" +
                       'endif()' + "`n" +
                       '' + "`n" +
                       '# Find and build GUI application' + "`n" +
                       'file(GLOB_RECURSE GUI_SRC' + "`n" +
                       '    RELATIVE ${CMAKE_SOURCE_DIR}' + "`n" +
                       '    "apps/*.cpp"' + "`n" +
                       '    "apps/*.cxx"' + "`n" +
                       '    "gui/*.cpp"' + "`n" +
                       '    "gui/*.cxx"' + "`n" +
                       ')' + "`n" +
                       '' + "`n" +
                       'if(GUI_SRC)' + "`n" +
                       '    message(STATUS "Found GUI source files")' + "`n" +
                       '    add_executable(bff_gui ${GUI_SRC})' + "`n" +
                       '    if(TARGET bff_core)' + "`n" +
                       '        target_link_libraries(bff_gui bff_core)' + "`n" +
                       '    endif()' + "`n" +
                       '    target_include_directories(bff_gui PRIVATE ${CMAKE_SOURCE_DIR}/apps)' + "`n" +
                       'else()' + "`n" +
                       '    message(WARNING "No GUI source files found")' + "`n" +
                       'endif()' + "`n" +
                       '' + "`n" +
                       '# Find and build other executables' + "`n" +
                       'file(GLOB_RECURSE OTHER_SRC' + "`n" +
                       '    RELATIVE ${CMAKE_SOURCE_DIR}' + "`n" +
                       '    "*.cpp"' + "`n" +
                       '    "*.cxx"' + "`n" +
                       ')' + "`n" +
                       '' + "`n" +
                       'foreach(src_file ${OTHER_SRC})' + "`n" +
                       '    get_filename_component(exe_name ${src_file} NAME_WE)' + "`n" +
                       '    ' + "`n" +
                       '    # Skip if already a target or if its part of the core/GUI' + "`n" +
                       '    if(NOT TARGET ${exe_name} AND' + "`n" +
                       '       NOT ${src_file} MATCHES "^src/" AND' + "`n" +
                       '       NOT ${src_file} MATCHES "^apps/" AND' + "`n" +
                       '       NOT ${src_file} MATCHES "^gui/")' + "`n" +
                       '       ' + "`n" +
                       '        message(STATUS "Adding executable: ${exe_name}")' + "`n" +
                       '        add_executable(${exe_name} ${src_file})' + "`n" +
                       '        ' + "`n" +
                       '        if(TARGET bff_core)' + "`n" +
                       '            target_link_libraries(${exe_name} bff_core)' + "`n" +
                       '        endif()' + "`n" +
                       '    endif()' + "`n" +
                       'endforeach()'
        
        Set-Content -Path "CMakeLists.txt" -Value $cmakeContent
        Write-Host "Created CMakeLists.txt"
    
    - name: Configure Project
      shell: powershell
      run: |
        Write-Host "Configuring project..."
        
        # Create fresh build directory
        if (Test-Path "build") {
            Remove-Item -Path "build" -Recurse -Force -ErrorAction SilentlyContinue
        }
        
        New-Item -ItemType Directory -Force -Path "build"
        cd build
        
        Write-Host "Current CMake version:"
        cmake --version
        
        Write-Host "`nRunning CMake configuration..."
        
        # Configure with verbose output to see what's happening
        cmake .. -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_BUILD_TYPE=Release `
          --trace-expand
        
        if ($LASTEXITCODE -ne 0) {
            Write-Host "Configuration failed, trying without specific generator..."
            cmake .. -DCMAKE_BUILD_TYPE=Release
        }
        
        Write-Host "Configuration completed"
    
    - name: Build Project
      shell: powershell
      run: |
        Write-Host "Building project..."
        
        if (Test-Path "build\CMakeCache.txt") {
            cd build
            
            Write-Host "Starting build..."
            
            # Build with maximum parallelism
            cmake --build . --config Release --parallel 4 --verbose
            
            if ($LASTEXITCODE -ne 0) {
                Write-Host "Release build failed, trying Debug..."
                cmake --build . --config Debug --parallel 4
            }
            
            # Search for output files
            Write-Host "`nSearching for build output..."
            
            # Look in standard output locations
            $searchPaths = @(".", "Release", "Debug", "bin", "bin/Release", "bin/Debug")
            
            foreach ($path in $searchPaths) {
                if (Test-Path $path) {
                    $exes = Get-ChildItem -Path $path -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue
                    if ($exes) {
                        Write-Host "Found in $($path):"
                        foreach ($exe in $exes) {
                            Write-Host "  - $($exe.Name)"
                        }
                    }
                }
            }
            
            # Also look for any .lib files that were built
            $libs = Get-ChildItem -Path . -Filter "*.lib" -Recurse -ErrorAction SilentlyContinue
            if ($libs) {
                Write-Host "`nBuilt libraries:"
                foreach ($lib in $libs) {
                    Write-Host "  - $($lib.Name)"
                }
            }
            
        } else {
            Write-Host "No CMakeCache.txt found - project was not configured"
        }
    
    - name: Package Results
      shell: powershell
      run: |
        Write-Host "Packaging results..."
        
        New-Item -ItemType Directory -Force -Path "artifacts"
        
        # Collect all executables from build directory
        $allExes = @()
        
        if (Test-Path "build") {
            $exes = Get-ChildItem -Path "build" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue | Where-Object {
                $_.FullName -notmatch "CompilerId"
            }
            $allExes += $exes
        }
        
        if ($allExes.Count -gt 0) {
            Write-Host "Packaging $($allExes.Count) executables"
            
            foreach ($exe in $allExes) {
                $destPath = "artifacts\$($exe.Name)"
                Copy-Item -Path $exe.FullName -Destination $destPath -Force
                Write-Host "  Added: $($exe.Name)"
                
                # Copy any DLL dependencies from SuiteSparse
                if (Test-Path "C:\SuiteSparse\bin") {
                    $dlls = Get-ChildItem -Path "C:\SuiteSparse\bin" -Filter "*.dll"
                    foreach ($dll in $dlls) {
                        Copy-Item -Path $dll.FullName -Destination "artifacts\" -Force
                    }
                }
            }
            
            # Create a simple README
            $readme = 'BFF (Boundary First Flattening) Build' + "`n" +
                     '=====================================' + "`n" +
                     '' + "`n" +
                     'Built executables:' + "`n" +
                     '' + "`n"
            
            foreach ($exe in $allExes) {
                $readme += '- ' + $exe.Name + "`n"
            }
            
            $readme += '' + "`n" +
                      'To run: Place all files in same folder and double-click executable.' + "`n"
            
            Set-Content -Path "artifacts\README.txt" -Value $readme
            
        } else {
            Write-Host "No executables found"
            
            # Create a diagnostic file
            $diagnostic = 'Build Diagnostic Information' + "`n" +
                         '============================' + "`n" +
                         '' + "`n" +
                         'No executables were produced by the build.' + "`n" +
                         '' + "`n" +
                         'Possible issues:' + "`n" +
                         '1. SuiteSparse libraries not found or incompatible' + "`n" +
                         '2. Compilation errors in source code' + "`n" +
                         '3. Incorrect project structure' + "`n" +
                         '' + "`n" +
                         'Check the build logs for specific error messages.' + "`n" +
                         '' + "`n" +
                         'SuiteSparse setup used:' + "`n" +
                         '- Headers: ' + ((Get-ChildItem "C:\SuiteSparse\include" -Filter "*.h" | Measure-Object).Count) + ' .h files' + "`n" +
                         '- Libraries: ' + ((Get-ChildItem "C:\SuiteSparse\lib" -Filter "*.lib" | Measure-Object).Count) + ' .lib files' + "`n"
            
            Set-Content -Path "artifacts\DIAGNOSTIC.txt" -Value $diagnostic
        }
        
        Write-Host "`nArtifacts directory contents:"
        Get-ChildItem -Path "artifacts" -ErrorAction SilentlyContinue
    
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BFF-Windows-Build
        path: artifacts/
        if-no-files-found: warn
