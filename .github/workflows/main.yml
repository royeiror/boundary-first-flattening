name: Build BFF for Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout BFF Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2
    
    - name: Install CMake
      uses: lukka/get-cmake@latest
    
    - name: Download pre-built SuiteSparse binaries
      shell: powershell
      run: |
        # Instead of building from source, download pre-built binaries
        # from the releases mentioned in the BFF documentation
        Write-Host "Downloading pre-built SuiteSparse-METIS..."
        
        # Create directories
        New-Item -ItemType Directory -Force -Path "suitesparse" -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Force -Path "suitesparse/lib" -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Force -Path "suitesparse/include" -ErrorAction SilentlyContinue
        
        # The actual URL might need to be found from the repository releases
        # For now, we'll check what's available in the cloned BFF repo
        Write-Host "Checking for existing dependencies..."
        
        # Look for any pre-built libraries in the repository
        if (Test-Path "deps") {
          Write-Host "Found deps directory"
          Get-ChildItem -Path "deps" -Recurse -Filter "*.lib" | Select-Object -First 5
        }
    
    - name: Use existing CMakeLists.txt if available
      shell: powershell
      run: |
        # Check if CMakeLists.txt already exists
        if (Test-Path "CMakeLists.txt") {
          Write-Host "Using existing CMakeLists.txt"
          Write-Host "First few lines:"
          Get-Content "CMakeLists.txt" -First 10
        } else {
          Write-Host "Creating minimal CMakeLists.txt..."
          # Create a VERY simple CMakeLists.txt without any complex strings
          
          # Start with an empty file
          "" | Out-File -FilePath "CMakeLists.txt" -Encoding UTF8
          
          # Append lines one by one using simple strings
          'cmake_minimum_required(VERSION 3.15)' | Add-Content -Path "CMakeLists.txt"
          'project(BFF)' | Add-Content -Path "CMakeLists.txt"
          '' | Add-Content -Path "CMakeLists.txt"
          'set(CMAKE_CXX_STANDARD 17)' | Add-Content -Path "CMakeLists.txt"
          'set(CMAKE_CXX_STANDARD_REQUIRED ON)' | Add-Content -Path "CMakeLists.txt"
          '' | Add-Content -Path "CMakeLists.txt"
          'include_directories(${CMAKE_SOURCE_DIR}/include)' | Add-Content -Path "CMakeLists.txt"
          'include_directories(${CMAKE_SOURCE_DIR}/deps/libigl/include)' | Add-Content -Path "CMakeLists.txt"
          'include_directories(${CMAKE_SOURCE_DIR}/deps/spectra/include)' | Add-Content -Path "CMakeLists.txt"
          '' | Add-Content -Path "CMakeLists.txt"
          'file(GLOB_RECURSE SRC_FILES "src/*.cpp")' | Add-Content -Path "CMakeLists.txt"
          '' | Add-Content -Path "CMakeLists.txt"
          'if(SRC_FILES)' | Add-Content -Path "CMakeLists.txt"
          '    add_library(bff-lib STATIC ${SRC_FILES})' | Add-Content -Path "CMakeLists.txt"
          'else()' | Add-Content -Path "CMakeLists.txt"
          '    message(WARNING "No source files found")' | Add-Content -Path "CMakeLists.txt"
          'endif()' | Add-Content -Path "CMakeLists.txt"
          '' | Add-Content -Path "CMakeLists.txt"
          'file(GLOB_RECURSE GUI_FILES "apps/*.cpp")' | Add-Content -Path "CMakeLists.txt"
          'if(GUI_FILES)' | Add-Content -Path "CMakeLists.txt"
          '    add_executable(bff-gui ${GUI_FILES})' | Add-Content -Path "CMakeLists.txt"
          '    target_link_libraries(bff-gui bff-lib)' | Add-Content -Path "CMakeLists.txt"
          'endif()' | Add-Content -Path "CMakeLists.txt"
          
          Write-Host "Created minimal CMakeLists.txt"
        }
    
    - name: Try to build with existing setup
      shell: powershell
      run: |
        # Create build directory
        New-Item -ItemType Directory -Force -Path "build"
        cd build
        
        Write-Host "Attempting to configure with CMake..."
        
        # Try a simple CMake configuration
        # This will likely fail, but we need to see the error
        cmake -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_BUILD_TYPE=Release `
          ..
        
        # Note: This will fail because we don't have SuiteSparse linked
        # but we need to see what the actual error is
    
    - name: If build fails, use alternative approach
      shell: powershell
      run: |
        Write-Host "Since the build will likely fail without SuiteSparse, let's try a different approach."
        Write-Host "We'll look for any existing build scripts or instructions..."
        
        # Check for any build scripts in the repository
        if (Test-Path "windows-build-v1.6.yml") {
          Write-Host "Found windows-build-v1.6.yml - this might be useful"
          Get-Content "windows-build-v1.6.yml" -First 20
        }
        
        # The reality is that building BFF on Windows is complex
        # and requires specific pre-built SuiteSparse binaries
    
    - name: Upload any artifacts if they exist
      shell: powershell
      run: |
        # Check if any executables were built
        $exes = Get-ChildItem -Path "." -Filter "*.exe" -Recurse
        if ($exes) {
          Write-Host "Found executables:"
          $exes | ForEach-Object { Write-Host "  $($_.FullName)" }
          
          # Create artifacts directory
          New-Item -ItemType Directory -Force -Path "artifacts"
          
          # Copy executables
          $exes | Copy-Item -Destination "artifacts\" -Force
          
          Write-Host "Artifacts prepared"
        } else {
          Write-Host "No executables found"
        }
    
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BFF-Windows-Build-Results
        path: |
          artifacts/
          build/CMakeCache.txt
        if-no-files-found: warn
