name: Build BFF Manual Header Copy

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build SuiteSparse
      run: |
        git clone https://github.com/jlblancoc/suitesparse-metis-for-windows.git SuiteSparseWin
        cd SuiteSparseWin
        mkdir build && cd build
        cmake .. -DCMAKE_INSTALL_PREFIX="$pwd/install" -DCMAKE_BUILD_TYPE=Release -G "Visual Studio 17 2022" -A x64
        cmake --build . --config Release --target install

    - name: Manually copy each header
      run: |
        echo "=== Manually copying SuiteSparse headers ==="
        $sourceDir = "SuiteSparseWin/build/install/include/suitesparse"
        $destDir = "include"
        
        echo "Source directory: $sourceDir"
        echo "Destination directory: $destDir"
        
        # List all headers in source
        echo "Headers available:"
        dir $sourceDir -Filter *.h | Select-Object Name
        
        # Copy each header individually
        $headers = @("cholmod.h", "amd.h", "camd.h", "ccolamd.h", "colamd.h", "suitesparseconfig.h")
        foreach ($header in $headers) {
            if (Test-Path "$sourceDir/$header") {
                Copy-Item "$sourceDir/$header" "$destDir/" -Force
                echo "Copied: $header"
            } else {
                echo "WARNING: $header not found in source"
            }
        }
        
        echo "Final include directory:"
        dir $destDir -Filter *.h

    - name: Remove dependency check and build
      run: |
        if (Test-Path "cmake/FindSuiteSparse.cmake") {
            Remove-Item "cmake/FindSuiteSparse.cmake" -Force
        }
        
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -G "Visual Studio 17 2022" -A x64
        cmake --build . --config Release --target bff-command-line

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: bff-manual-copy
        path: build/Release/bff-command-line.exe
