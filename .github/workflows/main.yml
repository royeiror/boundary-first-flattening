name: Build BFF for Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [created]
  workflow_dispatch:

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-windows

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install vcpkg and dependencies
      shell: powershell
      run: |
        # Install vcpkg
        git clone https://github.com/Microsoft/vcpkg.git $env:VCPKG_ROOT
        & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"
        
        # Install required dependencies
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET eigen3
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET libigl
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET suitesparse
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET metis
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glfw3
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glew
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET freeglut
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glm

    - name: Check what libraries vcpkg installed
      shell: powershell
      run: |
        Write-Host "Checking what libraries vcpkg installed..."
        $vcpkgLibDir = "$env:VCPKG_ROOT\installed\$env:VCPKG_DEFAULT_TRIPLET\lib"
        
        if (Test-Path $vcpkgLibDir) {
          Write-Host "Library files in $( $vcpkgLibDir ):"
          Get-ChildItem -Path $vcpkgLibDir -Filter "*.lib" | Select-Object -First 20 | Format-Table Name
          
          Write-Host "`nLooking for SuiteSparse libraries:"
          Get-ChildItem -Path $vcpkgLibDir -Filter "*cholmod*" -Recurse | Format-Table FullName
          Get-ChildItem -Path $vcpkgLibDir -Filter "*amd*" -Recurse | Select-Object -First 2
          Get-ChildItem -Path $vcpkgLibDir -Filter "*metis*" -Recurse | Select-Object -First 2
          
          Write-Host "`nLooking for GLFW and GLEW:"
          Get-ChildItem -Path $vcpkgLibDir -Filter "*glfw*" -Recurse | Format-Table FullName
          Get-ChildItem -Path $vcpkgLibDir -Filter "*glew*" -Recurse | Format-Table FullName
        } else {
          Write-Host "Library directory not found: $( $vcpkgLibDir )"
        }

    - name: Create CMakeLists.txt with correct library names
      shell: powershell
      run: |
        # Create CMakeLists.txt using Add-Content
        $cmakeFile = "CMakeLists.txt"
        
        # Start fresh
        if (Test-Path $cmakeFile) {
          Remove-Item $cmakeFile
        }
        
        # Build the file line by line
        Add-Content -Path $cmakeFile -Value "cmake_minimum_required(VERSION 3.15)"
        Add-Content -Path $cmakeFile -Value "project(BFF)"
        Add-Content -Path $cmakeFile -Value ""
        Add-Content -Path $cmakeFile -Value "set(CMAKE_CXX_STANDARD 17)"
        Add-Content -Path $cmakeFile -Value "set(CMAKE_CXX_STANDARD_REQUIRED ON)"
        Add-Content -Path $cmakeFile -Value ""
        Add-Content -Path $cmakeFile -Value "# Set vcpkg paths from environment"
        Add-Content -Path $cmakeFile -Value 'set(VCPKG_INSTALLED_DIR "$ENV{VCPKG_ROOT}/installed/$ENV{VCPKG_DEFAULT_TRIPLET}")'
        Add-Content -Path $cmakeFile -Value ""
        Add-Content -Path $cmakeFile -Value "# Find Eigen3"
        Add-Content -Path $cmakeFile -Value "find_package(Eigen3 REQUIRED)"
        Add-Content -Path $cmakeFile -Value ""
        Add-Content -Path $cmakeFile -Value "# Find OpenGL"
        Add-Content -Path $cmakeFile -Value "find_package(OpenGL REQUIRED)"
        Add-Content -Path $cmakeFile -Value ""
        Add-Content -Path $cmakeFile -Value "# Try to find libraries with multiple possible names"
        Add-Content -Path $cmakeFile -Value "set(SUITESPARSE_LIB_DIR \"\${VCPKG_INSTALLED_DIR}/lib\")"
        Add-Content -Path $cmakeFile -Value ""
        Add-Content -Path $cmakeFile -Value "# Use file glob to find libraries instead of find_library"
        Add-Content -Path $cmakeFile -Value "file(GLOB CHOLMOD_LIBS \"\${SUITESPARSE_LIB_DIR}/*cholmod*.lib\")"
        Add-Content -Path $cmakeFile -Value "file(GLOB AMD_LIBS \"\${SUITESPARSE_LIB_DIR}/*amd*.lib\")"
        Add-Content -Path $cmakeFile -Value "file(GLOB CAMD_LIBS \"\${SUITESPARSE_LIB_DIR}/*camd*.lib\")"
        Add-Content -Path $cmakeFile -Value "file(GLOB COLAMD_LIBS \"\${SUITESPARSE_LIB_DIR}/*colamd*.lib\")"
        Add-Content -Path $cmakeFile -Value "file(GLOB CCOLAMD_LIBS \"\${SUITESPARSE_LIB_DIR}/*ccolamd*.lib\")"
        Add-Content -Path $cmakeFile -Value "file(GLOB METIS_LIBS \"\${SUITESPARSE_LIB_DIR}/*metis*.lib\")"
        Add-Content -Path $cmakeFile -Value ""
        Add-Content -Path $cmakeFile -Value "# Check if libraries were found"
        Add-Content -Path $cmakeFile -Value "if(CHOLMOD_LIBS)"
        Add-Content -Path $cmakeFile -Value "    list(GET CHOLMOD_LIBS 0 CHOLMOD_LIBRARY)"
        Add-Content -Path $cmakeFile -Value '    message(STATUS "Found CHOLMOD: ${CHOLMOD_LIBRARY}")'
        Add-Content -Path $cmakeFile -Value "else()"
        Add-Content -Path $cmakeFile -Value '    message(FATAL_ERROR "CHOLMOD library not found in ${SUITESPARSE_LIB_DIR}")'
        Add-Content -Path $cmakeFile -Value "endif()"
        Add-Content -Path $cmakeFile -Value ""
        Add-Content -Path $cmakeFile -Value "if(AMD_LIBS)"
        Add-Content -Path $cmakeFile -Value "    list(GET AMD_LIBS 0 AMD_LIBRARY)"
        Add-Content -Path $cmakeFile -Value "else()"
        Add-Content -Path $cmakeFile -Value '    message(FATAL_ERROR "AMD library not found")'
        Add-Content -Path $cmakeFile -Value "endif()"
        Add-Content -Path $cmakeFile -Value ""
        Add-Content -Path $cmakeFile -Value "if(CAMD_LIBS)"
        Add-Content -Path $cmakeFile -Value "    list(GET CAMD_LIBS 0 CAMD_LIBRARY)"
        Add-Content -Path $cmakeFile -Value "else()"
        Add-Content -Path $cmakeFile -Value '    message(FATAL_ERROR "CAMD library not found")'
        Add-Content -Path $cmakeFile -Value "endif()"
        Add-Content -Path $cmakeFile -Value ""
        Add-Content -Path $cmakeFile -Value "if(COLAMD_LIBS)"
        Add-Content -Path $cmakeFile -Value "    list(GET COLAMD_LIBS 0 COLAMD_LIBRARY)"
        Add-Content -Path $cmakeFile -Value "else()"
        Add-Content -Path $cmakeFile -Value '    message(FATAL_ERROR "COLAMD library not found")'
        Add-Content -Path $cmakeFile -Value "endif()"
        Add-Content -Path $cmakeFile -Value ""
        Add-Content -Path $cmakeFile -Value "if(CCOLAMD_LIBS)"
        Add-Content -Path $cmakeFile -Value "    list(GET CCOLAMD_LIBS 0 CCOLAMD_LIBRARY)"
        Add-Content -Path $cmakeFile -Value "else()"
        Add-Content -Path $cmakeFile -Value '    message(FATAL_ERROR "CCOLAMD library not found")'
        Add-Content -Path $cmakeFile -Value "endif()"
        Add-Content -Path $cmakeFile -Value ""
        Add-Content -Path $cmakeFile -Value "if(METIS_LIBS)"
        Add-Content -Path $cmakeFile -Value "    list(GET METIS_LIBS 0 METIS_LIBRARY)"
        Add-Content -Path $cmakeFile -Value "else()"
        Add-Content -Path $cmakeFile -Value '    message(FATAL_ERROR "METIS library not found")'
        Add-Content -Path $cmakeFile -Value "endif()"
        Add-Content -Path $cmakeFile -Value ""
        Add-Content -Path $cmakeFile -Value "# Find GLFW and GLEW"
        Add-Content -Path $cmakeFile -Value "file(GLOB GLFW_LIBS \"\${VCPKG_INSTALLED_DIR}/lib/*glfw*.lib\")"
        Add-Content -Path $cmakeFile -Value "file(GLOB GLEW_LIBS \"\${VCPKG_INSTALLED_DIR}/lib/*glew*.lib\")"
        Add-Content -Path $cmakeFile -Value ""
        Add-Content -Path $cmakeFile -Value "if(GLFW_LIBS)"
        Add-Content -Path $cmakeFile -Value "    list(GET GLFW_LIBS 0 GLFW_LIBRARY)"
        Add-Content -Path $cmakeFile -Value '    message(STATUS "Found GLFW: ${GLFW_LIBRARY}")'
        Add-Content -Path $cmakeFile -Value "else()"
        Add-Content -Path $cmakeFile -Value '    message(FATAL_ERROR "GLFW library not found")'
        Add-Content -Path $cmakeFile -Value "endif()"
        Add-Content -Path $cmakeFile -Value ""
        Add-Content -Path $cmakeFile -Value "if(GLEW_LIBS)"
        Add-Content -Path $cmakeFile -Value "    list(GET GLEW_LIBS 0 GLEW_LIBRARY)"
        Add-Content -Path $cmakeFile -Value '    message(STATUS "Found GLEW: ${GLEW_LIBRARY}")'
        Add-Content -Path $cmakeFile -Value "else()"
        Add-Content -Path $cmakeFile -Value '    message(FATAL_ERROR "GLEW library not found")'
        Add-Content -Path $cmakeFile -Value "endif()"
        Add-Content -Path $cmakeFile -Value ""
        Add-Content -Path $cmakeFile -Value "# Include directories"
        Add-Content -Path $cmakeFile -Value "include_directories("
        Add-Content -Path $cmakeFile -Value "    \${CMAKE_SOURCE_DIR}/include"
        Add-Content -Path $cmakeFile -Value "    \${CMAKE_SOURCE_DIR}/deps/libigl/include"
        Add-Content -Path $cmakeFile -Value "    \${CMAKE_SOURCE_DIR}/deps/spectra/include"
        Add-Content -Path $cmakeFile -Value "    \${Eigen3_INCLUDE_DIRS}"
        Add-Content -Path $cmakeFile -Value "    \${VCPKG_INSTALLED_DIR}/include"
        Add-Content -Path $cmakeFile -Value ")"
        Add-Content -Path $cmakeFile -Value ""
        Add-Content -Path $cmakeFile -Value "# Find source files"
        Add-Content -Path $cmakeFile -Value 'file(GLOB_RECURSE SRC_FILES "src/*.cpp")'
        Add-Content -Path $cmakeFile -Value 'file(GLOB_RECURSE SRC_HEADERS "src/*.h")'
        Add-Content -Path $cmakeFile -Value ""
        Add-Content -Path $cmakeFile -Value "if(NOT SRC_FILES)"
        Add-Content -Path $cmakeFile -Value '    message(FATAL_ERROR "No source files found in src/ directory")'
        Add-Content -Path $cmakeFile -Value "endif()"
        Add-Content -Path $cmakeFile -Value ""
        Add-Content -Path $cmakeFile -Value "# Create library"
        Add-Content -Path $cmakeFile -Value "add_library(bff-lib STATIC \${SRC_FILES})"
        Add-Content -Path $cmakeFile -Value ""
        Add-Content -Path $cmakeFile -Value "# Link SuiteSparse and METIS libraries to bff-lib"
        Add-Content -Path $cmakeFile -Value "target_link_libraries(bff-lib"
        Add-Content -Path $cmakeFile -Value "    \${CHOLMOD_LIBRARY}"
        Add-Content -Path $cmakeFile -Value "    \${AMD_LIBRARY}"
        Add-Content -Path $cmakeFile -Value "    \${CAMD_LIBRARY}"
        Add-Content -Path $cmakeFile -Value "    \${COLAMD_LIBRARY}"
        Add-Content -Path $cmakeFile -Value "    \${CCOLAMD_LIBRARY}"
        Add-Content -Path $cmakeFile -Value "    \${METIS_LIBRARY}"
        Add-Content -Path $cmakeFile -Value ")"
        Add-Content -Path $cmakeFile -Value ""
        Add-Content -Path $cmakeFile -Value "# GUI executable"
        Add-Content -Path $cmakeFile -Value 'file(GLOB_RECURSE GUI_FILES "apps/*.cpp")'
        Add-Content -Path $cmakeFile -Value "if(GUI_FILES)"
        Add-Content -Path $cmakeFile -Value "    add_executable(bff-gui \${GUI_FILES})"
        Add-Content -Path $cmakeFile -Value "    target_link_libraries(bff-gui bff-lib"
        Add-Content -Path $cmakeFile -Value "        \${OPENGL_LIBRARIES}"
        Add-Content -Path $cmakeFile -Value "        \${GLFW_LIBRARY}"
        Add-Content -Path $cmakeFile -Value "        \${GLEW_LIBRARY}"
        Add-Content -Path $cmakeFile -Value "    )"
        Add-Content -Path $cmakeFile -Value "    target_include_directories(bff-gui PRIVATE \${CMAKE_SOURCE_DIR}/apps)"
        Add-Content -Path $cmakeFile -Value '    message(STATUS "Building GUI application")'
        Add-Content -Path $cmakeFile -Value "endif()"
        Add-Content -Path $cmakeFile -Value ""
        Add-Content -Path $cmakeFile -Value "# CLI executable"
        Add-Content -Path $cmakeFile -Value 'file(GLOB_RECURSE CLI_FILES "binaries/*.cpp")'
        Add-Content -Path $cmakeFile -Value "if(CLI_FILES)"
        Add-Content -Path $cmakeFile -Value "    add_executable(bff-cli \${CLI_FILES})"
        Add-Content -Path $cmakeFile -Value "    target_link_libraries(bff-cli bff-lib)"
        Add-Content -Path $cmakeFile -Value "    target_include_directories(bff-cli PRIVATE \${CMAKE_SOURCE_DIR}/binaries)"
        Add-Content -Path $cmakeFile -Value '    message(STATUS "Building CLI application")'
        Add-Content -Path $cmakeFile -Value "endif()"
        
        Write-Host "Created CMakeLists.txt"

    - name: Check if we need to clone BFF
      shell: powershell
      run: |
        # Check if we have the BFF source files
        if (-not (Test-Path "src") -and -not (Test-Path "apps")) {
          Write-Host "BFF source not found, cloning v1.6..."
          git clone --recursive --branch v1.6 https://github.com/GeometryCollective/boundary-first-flattening.git bff-temp
          # Copy everything except .git
          Get-ChildItem -Path "bff-temp" -Exclude ".git" | Copy-Item -Destination "." -Recurse -Force
        }
        
        # Check what we have
        Write-Host "Current directory contents:"
        Get-ChildItem | Select-Object -First 10 | Format-Table Name, Mode

    - name: Configure CMake
      shell: powershell
      run: |
        # Create build directory
        New-Item -ItemType Directory -Force -Path "build"
        
        Write-Host "Configuring CMake with vcpkg toolchain..."
        
        # Configure with CMake
        cmake -B build `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=$env:VCPKG_DEFAULT_TRIPLET `
          -G "Visual Studio 17 2022" `
          -A x64

    - name: Build BFF
      shell: powershell
      run: |
        Write-Host "Building project..."
        cmake --build build --config Release --parallel 4

    - name: Find and copy executables
      shell: powershell
      run: |
        # Create distribution directory
        New-Item -ItemType Directory -Force -Path "dist"
        
        Write-Host "Searching for executables..."
        
        # Search for executables
        $exes = Get-ChildItem -Path "build" -Filter "*.exe" -Recurse
        foreach ($exe in $exes) {
          Write-Host "Found executable: $($exe.FullName)"
          Copy-Item -Path $exe.FullName -Destination "dist\" -Force
        }
        
        # Copy DLLs
        $vcpkgBinPath = "$env:VCPKG_ROOT\installed\$env:VCPKG_DEFAULT_TRIPLET\bin"
        if (Test-Path $vcpkgBinPath) {
          Write-Host "Copying DLLs from vcpkg..."
          Get-ChildItem -Path $vcpkgBinPath -Filter "*.dll" | Copy-Item -Destination "dist\" -Force
        }
        
        # List what we have
        Write-Host "`nFiles in dist directory:"
        Get-ChildItem -Path "dist"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BFF-Windows-Binaries
        path: dist/

    - name: Create release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/**
        generate_release_notes: true
