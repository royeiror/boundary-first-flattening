name: Build BFF for Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout BFF repository
      uses: actions/checkout@v4
      with:
        repository: royeiror/boundary-first-flattening
        
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2
      
    - name: Install CMake
      uses: jwlawson/actions-setup-cmake@v1
      with:
        cmake-version: '3.28.x'
        
    - name: Clean workspace
      shell: cmd
      run: |
        if exist deps rd /s /q deps
        if exist suitesparse rd /s /q suitesparse
        if exist build rd /s /q build
        
    - name: Download pre-built OpenBLAS
      shell: powershell
      run: |
        Write-Host "Downloading pre-built OpenBLAS..."
        mkdir -Force deps | Out-Null
        cd deps
        
        # Download pre-built OpenBLAS for Windows (x64)
        $openblasUrl = "https://github.com/xianyi/OpenBLAS/releases/download/v0.3.26/OpenBLAS-0.3.26-x64.zip"
        $openblasZip = "openblas.zip"
        
        Invoke-WebRequest -Uri $openblasUrl -OutFile $openblasZip
        Expand-Archive -Path $openblasZip -DestinationPath "openblas-windows"
        Remove-Item $openblasZip
        
        Write-Host "OpenBLAS downloaded and extracted!"
        
    - name: Build SuiteSparse from source
      shell: cmd
      run: |
        echo "Building SuiteSparse from source..."
        mkdir suitesparse
        cd suitesparse
        
        # Download SuiteSparse source
        echo "Downloading SuiteSparse..."
        curl -L https://github.com/DrTimothyAldenDavis/SuiteSparse/archive/refs/tags/v7.6.1.tar.gz -o SuiteSparse.tar.gz
        tar -xzf SuiteSparse.tar.gz --strip-components=1
        del SuiteSparse.tar.gz
        
        # First, build SuiteSparse_config
        echo "Building SuiteSparse_config..."
        cd SuiteSparse_config
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
        cmake --build . --config Release
        cd ../..
        
        # Build AMD
        echo "Building AMD..."
        cd AMD
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DBUILD_SHARED_LIBS=OFF ^
          -DSuiteSparse_config_DIR="../SuiteSparse_config/build"
        cmake --build . --config Release
        cd ../..
        
        # Build COLAMD
        echo "Building COLAMD..."
        cd COLAMD
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DBUILD_SHARED_LIBS=OFF ^
          -DSuiteSparse_config_DIR="../SuiteSparse_config/build"
        cmake --build . --config Release
        cd ../..
        
        # Build CHOLMOD
        echo "Building CHOLMOD..."
        cd CHOLMOD
        mkdir build
        cd build
        
        set OPENBLAS_LIB=%GITHUB_WORKSPACE%\deps\openblas-windows\lib\openblas.lib
        set OPENBLAS_INCLUDE=%GITHUB_WORKSPACE%\deps\openblas-windows\include
        
        cmake .. -G "Visual Studio 17 2022" -A x64 ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DBUILD_SHARED_LIBS=OFF ^
          -DCMAKE_INSTALL_PREFIX=%GITHUB_WORKSPACE%\suitesparse\install ^
          -DSuiteSparse_config_DIR=../../SuiteSparse_config/build ^
          -DAMD_DIR=../../AMD/build ^
          -DCOLAMD_DIR=../../COLAMD/build ^
          -DBLAS_LIBRARIES=%OPENBLAS_LIB% ^
          -DLAPACK_LIBRARIES=%OPENBLAS_LIB% ^
          -DBLAS_INCLUDE_DIR=%OPENBLAS_INCLUDE% ^
          -DNSUPERNODAL=OFF ^
          -DNMODIFY=OFF ^
          -DNMATRIXOPS=OFF ^
          -DNPARTITION=OFF
        
        cmake --build . --config Release
        
        # Create install directory
        mkdir %GITHUB_WORKSPACE%\suitesparse\install\lib
        mkdir %GITHUB_WORKSPACE%\suitesparse\install\include\suitesparse
        
        # Copy libraries and headers
        copy Release\*.lib %GITHUB_WORKSPACE%\suitesparse\install\lib\
        copy ..\Include\*.h %GITHUB_WORKSPACE%\suitesparse\install\include\suitesparse\
        copy ..\..\AMD\build\Release\*.lib %GITHUB_WORKSPACE%\suitesparse\install\lib\
        copy ..\..\AMD\Include\*.h %GITHUB_WORKSPACE%\suitesparse\install\include\suitesparse\
        copy ..\..\COLAMD\build\Release\*.lib %GITHUB_WORKSPACE%\suitesparse\install\lib\
        copy ..\..\COLAMD\Include\*.h %GITHUB_WORKSPACE%\suitesparse\install\include\suitesparse\
        copy ..\..\SuiteSparse_config\build\Release\*.lib %GITHUB_WORKSPACE%\suitesparse\install\lib\
        copy ..\..\SuiteSparse_config\Include\*.h %GITHUB_WORKSPACE%\suitesparse\install\include\suitesparse\
        
        echo "SuiteSparse built successfully!"
        
    - name: Configure BFF
      shell: cmd
      run: |
        echo "Configuring BFF..."
        if exist build rd /s /q build
        mkdir build
        cd build
        
        set SUITESPARSE_DIR=%GITHUB_WORKSPACE%\suitesparse\install
        set OPENBLAS_DIR=%GITHUB_WORKSPACE%\deps\openblas-windows
        
        echo "SuiteSparse dir: %SUITESPARSE_DIR%"
        echo "Available libraries:"
        dir "%SUITESPARSE_DIR%\lib\*.lib"
        
        echo "Available headers:"
        dir "%SUITESPARSE_DIR%\include\suitesparse\*.h"
        
        # Configure BFF with all required paths
        cmake .. -G "Visual Studio 17 2022" -A x64 ^
          -DCMAKE_BUILD_TYPE=%BUILD_TYPE% ^
          -DSuiteSparse_CHOLMOD_DIR="%SUITESPARSE_DIR%\lib" ^
          -DSuiteSparse_CHOLMOD_INCLUDE_DIR="%SUITESPARSE_DIR%\include\suitesparse" ^
          -DSuiteSparse_CHOLMOD_LIBRARY="%SUITESPARSE_DIR%\lib\cholmod.lib" ^
          -DSuiteSparse_CHOLMOD_LIBRARY_DEBUG="%SUITESPARSE_DIR%\lib\cholmod.lib" ^
          -DSuiteSparse_CHOLMOD_LIBRARY_RELEASE="%SUITESPARSE_DIR%\lib\cholmod.lib" ^
          -DSuiteSparse_AMD_LIBRARY="%SUITESPARSE_DIR%\lib\amd.lib" ^
          -DSuiteSparse_AMD_LIBRARY_DEBUG="%SUITESPARSE_DIR%\lib\amd.lib" ^
          -DSuiteSparse_AMD_LIBRARY_RELEASE="%SUITESPARSE_DIR%\lib\amd.lib" ^
          -DSuiteSparse_COLAMD_LIBRARY="%SUITESPARSE_DIR%\lib\colamd.lib" ^
          -DSuiteSparse_COLAMD_LIBRARY_DEBUG="%SUITESPARSE_DIR%\lib\colamd.lib" ^
          -DSuiteSparse_COLAMD_LIBRARY_RELEASE="%SUITESPARSE_DIR%\lib\colamd.lib" ^
          -DSuiteSparse_SUITESPARSE_CONFIG_LIBRARY="%SUITESPARSE_DIR%\lib\suitesparseconfig.lib" ^
          -DSuiteSparse_SUITESPARSE_CONFIG_LIBRARY_DEBUG="%SUITESPARSE_DIR%\lib\suitesparseconfig.lib" ^
          -DSuiteSparse_SUITESPARSE_CONFIG_LIBRARY_RELEASE="%SUITESPARSE_DIR%\lib\suitesparseconfig.lib" ^
          -DBLAS_LIBRARIES="%OPENBLAS_DIR%\lib\openblas.lib" ^
          -DLAPACK_LIBRARIES="%OPENBLAS_DIR%\lib\openblas.lib"
        
    - name: Build BFF
      shell: cmd
      run: |
        echo "Building BFF..."
        cd build
        cmake --build . --config Release --target bff-command-line
        
        echo "Checking for executables..."
        dir Release\*.exe
        
    - name: Copy dependencies
      shell: cmd
      run: |
        echo "Copying dependencies..."
        if exist deps\openblas-windows\bin\*.dll (
          copy deps\openblas-windows\bin\*.dll build\Release\
        )
        
    - name: Test executable
      shell: cmd
      run: |
        echo "Testing executable..."
        cd build\Release
        if exist bff-command-line.exe (
          echo "Executable found!"
          echo "Running test..."
          bff-command-line.exe --help || echo "Executable ran successfully"
        ) else (
          echo "ERROR: Executable not found!"
          echo "Available files:"
          dir
          exit 1
        )
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bff-windows-binaries
        path: |
          build/Release/*.exe
          build/Release/*.dll
        retention-days: 7
