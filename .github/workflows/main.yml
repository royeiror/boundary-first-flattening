name: Build BFF Windows Binary

on: 
  push:
    tags: ['v*']
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup vcpkg
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        .\vcpkg\bootstrap-vcpkg.bat

    - name: Install dependencies
      run: |
        .\vcpkg\vcpkg install suitesparse openblas eigen3 --triplet x64-windows

    - name: Fix CMakeLists.txt
      run: |
        # Fix CMake minimum version
        if (Test-Path "CMakeLists.txt") {
            (Get-Content CMakeLists.txt) -replace 'cmake_minimum_required\(.*\)', 'cmake_minimum_required(VERSION 3.5)' | Set-Content CMakeLists.txt
        }

    - name: Configure BFF with correct include paths
      run: |
        $VcpkgDir = "$pwd/vcpkg/installed/x64-windows" -replace '\\', '/'
        
        mkdir build
        cd build
        
        # Configure with explicit include and library paths
        cmake .. `
          -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake `
          -DCMAKE_BUILD_TYPE=Release `
          -DSUITESPARSE_INCLUDE_DIR="$VcpkgDir/include" `
          -DSUITESPARSE_LIBRARY_DIR="$VcpkgDir/lib" `
          -DCHOLMOD_INCLUDE_DIR="$VcpkgDir/include" `
          -DCHOLMOD_LIBRARY="$VcpkgDir/lib/cholmod.lib" `
          -DAMD_LIBRARY="$VcpkgDir/lib/amd.lib" `
          -DCAMD_LIBRARY="$VcpkgDir/lib/camd.lib" `
          -DCCOLAMD_LIBRARY="$VcpkgDir/lib/ccolamd.lib" `
          -DCOLAMD_LIBRARY="$VcpkgDir/lib/colamd.lib" `
          -DBTF_LIBRARY="$VcpkgDir/lib/btf.lib" `
          -DSUITESPARSE_CONFIG_LIBRARY="$VcpkgDir/lib/suitesparseconfig.lib" `
          -DOPENBLAS_LIBRARY="$VcpkgDir/lib/openblas.lib" `
          -G "Visual Studio 17 2022" -A x64

    - name: Build BFF command line tool
      run: |
        cd build
        cmake --build . --config Release --target bff-command-line --parallel

    - name: Collect binaries
      run: |
        mkdir dist
        
        # Find and copy the executable
        $exePaths = @(
            "build/Release/bff-command-line.exe",
            "build/src/Release/bff-command-line.exe", 
            "build/bff-command-line.exe"
        )
        
        foreach ($path in $exePaths) {
            if (Test-Path $path) {
                Copy-Item $path "dist/"
                echo "✓ Found executable: $path"
            }
        }
        
        # Copy required DLLs from vcpkg
        if (Test-Path "vcpkg/installed/x64-windows/bin") {
            $requiredDlls = @(
                "libopenblas.dll",
                "libgcc_s_seh-1.dll",
                "libgfortran-5.dll", 
                "libquadmath-0.dll",
                "suitesparseconfig.dll"
            )
            
            foreach ($dll in $requiredDlls) {
                if (Test-Path "vcpkg/installed/x64-windows/bin/$dll") {
                    Copy-Item "vcpkg/installed/x64-windows/bin/$dll" "dist/"
                    echo "✓ Copied DLL: $dll"
                }
            }
        }
        
        echo "Final artifacts:"
        dir dist

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bff-command-line
        path: dist/*
        retention-days: 30
