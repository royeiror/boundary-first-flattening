name: Build BFF for Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [created]
  workflow_dispatch:

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-windows

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install vcpkg and dependencies
      shell: powershell
      run: |
        # Install vcpkg
        git clone https://github.com/Microsoft/vcpkg.git $env:VCPKG_ROOT
        & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"
        
        # Install required dependencies
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET eigen3
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET libigl
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glfw3
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glew
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET freeglut
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glm

    - name: Download and install SuiteSparse-METIS with headers
      shell: powershell
      run: |
        Write-Host "Downloading SuiteSparse-METIS with headers..."
        
        # Create directories
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse"
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse\include"
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse\lib"
        
        # Download from the actual release mentioned in BFF instructions
        # Based on: https://github.com/jlblancoc/suitesparse-metis-for-windows
        # Let's try to get the actual pre-built binaries
        $url = "https://github.com/jlblancoc/suitesparse-metis-for-windows/releases/download/v1.5.0/SuiteSparse-5.4.0-METIS-5.1.0-Win-x64.zip"
        $output = "C:\SuiteSparse.zip"
        
        Write-Host "Downloading from: $url"
        try {
          Invoke-WebRequest -Uri $url -OutFile $output
          Write-Host "Download successful"
        } catch {
          Write-Host "Failed to download from primary URL, trying alternative..."
          # Try an alternative URL
          $url = "https://github.com/jlblancoc/suitesparse-metis-for-windows/releases/download/v1.4.0/SuiteSparse-4.5.1-METIS-5.1.0-Win-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile $output
        }
        
        # Extract
        Expand-Archive -Path $output -DestinationPath "C:\SuiteSparseTemp\" -Force
        
        Write-Host "Extracted files:"
        Get-ChildItem -Path "C:\SuiteSparseTemp" -Recurse | Select-Object -First 10
        
        # Copy include files
        $includeSrc = Get-ChildItem -Path "C:\SuiteSparseTemp" -Recurse -Directory | Where-Object { $_.Name -eq "include" } | Select-Object -First 1
        if ($includeSrc) {
          Write-Host "Found include directory: $($includeSrc.FullName)"
          Copy-Item -Path "$($includeSrc.FullName)\*" -Destination "C:\SuiteSparse\include\" -Recurse -Force
        }
        
        # Copy library files
        $libSrc = Get-ChildItem -Path "C:\SuiteSparseTemp" -Recurse -Directory | Where-Object { $_.Name -eq "lib" } | Select-Object -First 1
        if ($libSrc) {
          Write-Host "Found lib directory: $($libSrc.FullName)"
          Copy-Item -Path "$($libSrc.FullName)\*" -Destination "C:\SuiteSparse\lib\" -Recurse -Force
        }
        
        # If no structured directories found, copy all .h and .lib files
        if (-not $includeSrc -or -not $libSrc) {
          Write-Host "No structured directories found, copying all files..."
          Get-ChildItem -Path "C:\SuiteSparseTemp" -Recurse -Filter "*.h" | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination "C:\SuiteSparse\include\" -Force
          }
          Get-ChildItem -Path "C:\SuiteSparseTemp" -Recurse -Filter "*.lib" | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination "C:\SuiteSparse\lib\" -Force
          }
        }
        
        Write-Host "SuiteSparse installation complete"
        Write-Host "Files in include directory:"
        Get-ChildItem -Path "C:\SuiteSparse\include" -Filter "*.h" | Select-Object -First 10
        Write-Host "Files in lib directory:"
        Get-ChildItem -Path "C:\SuiteSparse\lib" -Filter "*.lib" | Select-Object -First 10

    - name: Clone BFF source
      shell: powershell
      run: |
        Write-Host "Cloning BFF v1.6..."
        git clone --recursive --branch v1.6 https://github.com/GeometryCollective/boundary-first-flattening.git bff-source
        
        # Copy to current directory
        Copy-Item -Path "bff-source\*" -Destination "." -Recurse -Force
        
        Write-Host "BFF files copied to current directory"

    - name: Create modified CMakeLists.txt that uses SuiteSparse directory
      shell: powershell
      run: |
        # Read the original CMakeLists.txt
        $original = Get-Content -Path "CMakeLists.txt" -Raw
        
        # Modify it to use our SuiteSparse installation
        $modified = $original -replace 'find_package\(SuiteSparse REQUIRED\)', @'
# Use our SuiteSparse installation
set(SuiteSparse_DIR "C:/SuiteSparse")
set(SuiteSparse_INCLUDE_DIR "C:/SuiteSparse/include")
set(SuiteSparse_LIBRARY_DIR "C:/SuiteSparse/lib")

# Manually set the libraries
set(SuiteSparse_CHOLMOD_LIBRARY "C:/SuiteSparse/lib/cholmod.lib")
set(SuiteSparse_AMD_LIBRARY "C:/SuiteSparse/lib/amd.lib")
set(SuiteSparse_CAMD_LIBRARY "C:/SuiteSparse/lib/camd.lib")
set(SuiteSparse_COLAMD_LIBRARY "C:/SuiteSparse/lib/colamd.lib")
set(SuiteSparse_CCOLAMD_LIBRARY "C:/SuiteSparse/lib/ccolamd.lib")
set(SuiteSparse_METIS_LIBRARY "C:/SuiteSparse/lib/metis.lib")

# Set that SuiteSparse was found
set(SuiteSparse_FOUND ON)
set(SuiteSparse_CHOLMOD_FOUND ON)
set(SuiteSparse_AMD_FOUND ON)
set(SuiteSparse_CAMD_FOUND ON)
set(SuiteSparse_COLAMD_FOUND ON)
set(SuiteSparse_CCOLAMD_FOUND ON)
set(SuiteSparse_METIS_FOUND ON)
'@
        
        # Save the modified version
        $modified | Out-File -FilePath "CMakeLists.txt" -Encoding UTF8
        Write-Host "Modified CMakeLists.txt to use local SuiteSparse"

    - name: Configure CMake
      shell: powershell
      run: |
        # Create build directory
        New-Item -ItemType Directory -Force -Path "build"
        
        Write-Host "Configuring CMake with vcpkg toolchain..."
        
        # Configure with CMake - explicitly set SuiteSparse paths
        cmake -B build `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=$env:VCPKG_DEFAULT_TRIPLET `
          -DSuiteSparse_DIR="C:/SuiteSparse" `
          -DSuiteSparse_INCLUDE_DIR="C:/SuiteSparse/include" `
          -G "Visual Studio 17 2022" `
          -A x64

    - name: Build BFF
      shell: powershell
      run: |
        Write-Host "Building project..."
        cmake --build build --config Release --parallel 4

    - name: Find and copy executables
      shell: powershell
      run: |
        # Create distribution directory
        New-Item -ItemType Directory -Force -Path "dist"
        
        Write-Host "Searching for executables..."
        
        # Search for executables
        $exes = Get-ChildItem -Path "build" -Filter "*.exe" -Recurse
        foreach ($exe in $exes) {
          Write-Host "Found executable: $($exe.FullName)"
          Copy-Item -Path $exe.FullName -Destination "dist\" -Force
        }
        
        # Copy DLLs from vcpkg
        $vcpkgBinPath = "$env:VCPKG_ROOT\installed\$env:VCPKG_DEFAULT_TRIPLET\bin"
        if (Test-Path $vcpkgBinPath) {
          Write-Host "Copying DLLs from vcpkg..."
          Get-ChildItem -Path $vcpkgBinPath -Filter "*.dll" | Copy-Item -Destination "dist\" -Force
        }
        
        # Copy DLLs from SuiteSparse
        $suiteSparseLibPath = "C:\SuiteSparse\lib"
        if (Test-Path $suiteSparseLibPath) {
          Write-Host "Copying DLLs from SuiteSparse..."
          Get-ChildItem -Path $suiteSparseLibPath -Filter "*.dll" | Copy-Item -Destination "dist\" -Force
        }
        
        # List what we have
        Write-Host "`nFiles in dist directory:"
        Get-ChildItem -Path "dist"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BFF-Windows-Binaries
        path: dist/

    - name: Create release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/**
        generate_release_notes: true
