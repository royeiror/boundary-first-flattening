name: Build BFF Viewer

on: workflow_dispatch

jobs:
  build-viewer:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Install vcpkg
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg install suitesparse:x64-windows
        
    - name: Check cholmod functions
      run: |
        $vcpkgPath = "$env:GITHUB_WORKSPACE/vcpkg/installed/x64-windows"
        
        # Check what functions are in the library
        echo "Checking cholmod.lib for _l functions..."
        dumpbin /exports "$vcpkgPath/lib/cholmod.lib" 2>$null | findstr "cholmod_l" || echo "No cholmod_l functions found"
        
        echo "Checking for standard cholmod functions..."
        dumpbin /exports "$vcpkgPath/lib/cholmod.lib" 2>$null | findstr "cholmod_" | select -first 5
        
    - name: Patch source files to remove _l suffix
      run: |
        # Simple find and replace in all .inl files
        Get-ChildItem -Path . -Recurse -Filter "*.inl" | ForEach-Object {
            $content = Get-Content $_ -Raw
            # Replace cholmod_l_ with cholmod_
            $newContent = $content -replace 'cholmod_l_', 'cholmod_'
            if ($newContent -ne $content) {
                $newContent | Set-Content $_ -Encoding UTF8
                Write-Host "Patched: $_"
            }
        }
        
        # Also check .h and .cpp files
        Get-ChildItem -Path . -Recurse -Include "*.h", "*.cpp" | ForEach-Object {
            $content = Get-Content $_ -Raw
            $newContent = $content -replace 'cholmod_l_', 'cholmod_'
            if ($newContent -ne $content) {
                $newContent | Set-Content $_ -Encoding UTF8
                Write-Host "Patched: $_"
            }
        }
        
    - name: Create FindSuiteSparse.cmake (NO @ symbols)
      run: |
        $vcpkgPath = "$env:GITHUB_WORKSPACE/vcpkg/installed/x64-windows" -replace '\\', '/'
        
        # Write file line by line
        $file = "cmake/FindSuiteSparse.cmake"
        
        # Start fresh
        "" | Set-Content $file
        
        # Add lines one by one
        "set(SuiteSparse_FOUND TRUE)" | Add-Content $file
        "set(SuiteSparse_INCLUDE_DIR `"$vcpkgPath/include`")" | Add-Content $file
        "set(SuiteSparse_LIBRARY_DIR `"$vcpkgPath/lib`")" | Add-Content $file
        "set(SuiteSparse_CHOLMOD_LIBRARY `"$vcpkgPath/lib/cholmod.lib`")" | Add-Content $file
        "set(SuiteSparse_AMD_LIBRARY `"$vcpkgPath/lib/amd.lib`")" | Add-Content $file
        "set(SuiteSparse_BLAS_LIBRARY `"$vcpkgPath/lib/openblas.lib`")" | Add-Content $file
        "set(SuiteSparse_LAPACK_LIBRARY `"$vcpkgPath/lib/lapack.lib`")" | Add-Content $file
        "message(STATUS `"SuiteSparse found`")" | Add-Content $file
        
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1
      
    - name: Configure CMake
      run: |
        cmake -B build -DBFF_BUILD_GUI=ON -DCMAKE_BUILD_TYPE=Release
        
    - name: Build
      run: |
        cmake --build build --config Release
        
    - name: Check results
      run: |
        if (Test-Path "build/Release/bff-viewer.exe") {
            echo "✅ SUCCESS: Viewer built!"
            dir "build/Release/bff-viewer.exe"
        } else {
            echo "❌ Viewer not found"
            dir build -Recurse -Filter *.exe
        }
