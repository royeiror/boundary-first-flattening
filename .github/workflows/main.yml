name: Windows Build BFF v1.6 - Optimized

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45  # Set timeout to prevent hanging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup environment
      shell: bash
      run: |
        echo "Installing required tools..."
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
        choco install wget -y
        
    - name: Download pre-built OpenBLAS and METIS
      shell: bash
      run: |
        # Download pre-compiled OpenBLAS for Windows (much faster than building)
        echo "Downloading pre-built OpenBLAS..."
        wget https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.28/OpenBLAS-0.3.28-x64.zip -O openblas.zip
        7z x openblas.zip -oopenblas-install
        
        # Download pre-built METIS
        echo "Downloading pre-built METIS..."
        mkdir -p metis-install/lib metis-install/include
        wget https://github.com/GraphChallenge/GraphChallenge-Data/raw/master/metis-5.1.0-win-x86_64/lib/libmetis.lib -O metis-install/lib/metis.lib
        wget https://github.com/GraphChallenge/GraphChallenge-Data/raw/master/metis-5.1.0-win-x86_64/include/metis.h -O metis-install/include/metis.h
        
    - name: Download pre-built SuiteSparse
      shell: bash
      run: |
        # Download SuiteSparse binaries compiled for Windows
        echo "Downloading SuiteSparse for Windows..."
        mkdir -p suitesparse-deps/{lib,include}
        
        # Download individual SuiteSparse components (using a known working build)
        SUITESPARSE_URL="https://github.com/jlblancoc/suitesparse-metis-for-windows/releases/download/v1.4.0"
        
        wget "${SUITESPARSE_URL}/suitesparse-include.zip" -O suitesparse-include.zip
        7z x suitesparse-include.zip -osuitesparse-deps/include
        
        wget "${SUITESPARSE_URL}/suitesparse-lib.zip" -O suitesparse-lib.zip
        7z x suitesparse-lib.zip -osuitesparse-deps/lib
        
        # Create required symlinks/compatibility files
        cd suitesparse-deps/lib
        cp ../../openblas-install/lib/libopenblas.lib blas.lib
        cp ../../openblas-install/lib/libopenblas.lib lapack.lib
        echo "Created compatibility symlinks"
        
    - name: Apply critical BFF patches
      shell: bash
      run: |
        echo "Applying essential BFF patches for Windows..."
        
        # 1. Patch for Windows DLL export
        echo "Patching BFF_API macros..."
        cat > api_patch.h << 'EOF'
#ifndef BFF_API_H
#define BFF_API_H

#ifdef _WIN32
    #ifdef bff_EXPORTS
        #define BFF_API __declspec(dllexport)
    #else
        #define BFF_API __declspec(dllimport)
    #endif
#else
    #define BFF_API
#endif

#endif
EOF
        
        # Include the API macro in main headers
        for header in include/bff/*.h include/bff/*/*.h; do
            if [ -f "$header" ]; then
                sed -i '1i #include "api_patch.h"' "$header"
            fi
        done
        
        # 2. Create custom FindSuiteSparse.cmake
        echo "Creating custom FindSuiteSparse.cmake..."
        cat > cmake/FindSuiteSparse.cmake << EOF
# Manual configuration for SuiteSparse on Windows
if(WIN32)
    message(STATUS "Using manually configured SuiteSparse for Windows")
    
    set(SuiteSparse_FOUND ON)
    set(SuiteSparse_INCLUDE_DIRS "\${CMAKE_SOURCE_DIR}/suitesparse-deps/include")
    
    # Use forward slashes for Windows compatibility
    file(TO_CMAKE_PATH "\${CMAKE_SOURCE_DIR}/suitesparse-deps/lib" SUITESPARSE_LIB_DIR)
    
    set(SuiteSparse_LIBRARIES
        "\${SUITESPARSE_LIB_DIR}/libamd.lib"
        "\${SUITESPARSE_LIB_DIR}/libcamd.lib"
        "\${SUITESPARSE_LIB_DIR}/libccolamd.lib"
        "\${SUITESPARSE_LIB_DIR}/libcolamd.lib"
        "\${SUITESPARSE_LIB_DIR}/libcholmod.lib"
        "\${SUITESPARSE_LIB_DIR}/libspqr.lib"
        "\${SUITESPARSE_LIB_DIR}/libldl.lib"
        "\${SUITESPARSE_LIB_DIR}/libbtf.lib"
        "\${SUITESPARSE_LIB_DIR}/libklu.lib"
        "\${SUITESPARSE_LIB_DIR}/libcxsparse.lib"
        "\${SUITESPARSE_LIB_DIR}/libumfpack.lib"
        "\${SUITESPARSE_LIB_DIR}/suitesparseconfig.lib"
        "\${CMAKE_SOURCE_DIR}/metis-install/lib/metis.lib"
        "\${CMAKE_SOURCE_DIR}/openblas-install/lib/libopenblas.lib"
    )
    
    message(STATUS "SuiteSparse includes: \${SuiteSparse_INCLUDE_DIRS}")
    message(STATUS "SuiteSparse libraries configured")
endif()
EOF
        
        # 3. Patch main CMakeLists.txt
        echo "Patching main CMakeLists.txt..."
        sed -i 's|find_package(SuiteSparse REQUIRED)|# find_package(SuiteSparse REQUIRED)\ninclude(cmake/FindSuiteSparse.cmake)|' CMakeLists.txt
        
        # 4. Fix NanoGUI build
        echo "Patching NanoGUI for static build..."
        sed -i 's|add_library(nanogui SHARED|add_library(nanogui STATIC|' deps/nanogui/CMakeLists.txt
        sed -i 's|NANOGUI_BUILD SHARED|NANOGUI_BUILD STATIC|' deps/nanogui/CMakeLists.txt
        
        echo "Patches applied successfully!"
        
    - name: Configure and Build BFF
      shell: cmd
      run: |
        echo "Configuring BFF with CMake..."
        mkdir build
        cd build
        
        # Configure with explicit paths
        cmake .. -G "Visual Studio 17 2022" -A x64 ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DBUILD_SHARED_LIBS=ON ^
          -DCMAKE_PREFIX_PATH="%cd%/../suitesparse-deps" ^
          -DMETIS_ROOT="%cd%/../metis-install" ^
          -DBLAS_LIBRARIES="%cd%/../openblas-install/lib/libopenblas.lib" ^
          -DLAPACK_LIBRARIES="%cd%/../openblas-install/lib/libopenblas.lib"
        
        echo "Building BFF..."
        cmake --build . --config Release --parallel 4
        
    - name: Package artifacts
      shell: bash
      run: |
        echo "Packaging build artifacts..."
        mkdir -p bff-package
        
        # Copy executables
        if [ -f "./build/Release/bff-viewer.exe" ]; then
            cp ./build/Release/bff-viewer.exe ./bff-package/
            echo "✓ bff-viewer.exe"
        fi
        
        if [ -f "./build/Release/bff.dll" ]; then
            cp ./build/Release/bff.dll ./bff-package/
            echo "✓ bff.dll"
        fi
        
        # Copy required DLLs
        echo "Copying runtime dependencies..."
        find ./build -name "*.dll" -exec cp {} ./bff-package/ \;
        
        # Copy OpenBLAS DLL
        if [ -f "./openblas-install/bin/libopenblas.dll" ]; then
            cp ./openblas-install/bin/libopenblas.dll ./bff-package/
            echo "✓ libopenblas.dll"
        fi
        
        # List package contents
        echo "Package contents:"
        ls -la ./bff-package/
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bff-windows-binaries
        path: bff-package/
        if-no-files-found: error
        retention-days: 7
