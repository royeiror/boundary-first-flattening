name: Build and Test BFF Viewer

on: workflow_dispatch

jobs:
  build-test:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Install SuiteSparse (Windows)
      run: |
        echo "Installing SuiteSparse dependencies..."
        # Download prebuilt SuiteSparse for Windows
        # From: https://github.com/jlblancoc/suitesparse-metis-for-windows
        curl -L -o suitesparse.zip https://github.com/jlblancoc/suitesparse-metis-for-windows/releases/download/v1.4.0/SuiteSparse-5.1.2-METIS-5.1.0.tar.gz
        7z x suitesparse.zip -o"C:\SuiteSparse" -y
        echo "SuiteSparse installed to C:\SuiteSparse"
        
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1
      
    - name: Configure CMake with SuiteSparse
      run: |
        echo "Configuring CMake with SuiteSparse path..."
        # Set the path to SuiteSparse
        cmake -B build `
          -DBFF_BUILD_GUI=ON `
          -DSuiteSparse_DIR="C:/SuiteSparse" `
          -DSuiteSparse_ROOT="C:/SuiteSparse"
        
    - name: Build the project
      run: |
        echo "Building project..."
        cmake --build build --config Release
        
    - name: Check if viewer was built
      run: |
        echo "=== Looking for built viewer executable ==="
        if (Test-Path "build/Release/bff-viewer.exe") {
            echo "✅ Viewer found at: build/Release/bff-viewer.exe"
            Get-Item "build/Release/bff-viewer.exe"
        } elseif (Test-Path "build/bff-viewer.exe") {
            echo "✅ Viewer found at: build/bff-viewer.exe"
            Get-Item "build/bff-viewer.exe"
        } else {
            echo "❌ Viewer not found in expected locations"
            echo "Searching for any executable..."
            Get-ChildItem -Path build -Recurse -Filter "*.exe" | ForEach-Object {
                echo "Found executable: $($_.FullName)"
            }
        }
