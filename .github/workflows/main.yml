name: Build BFF Viewer

on: workflow_dispatch

jobs:
  build-viewer:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Install vcpkg with SuiteSparse
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg install suitesparse:x64-windows
        .\vcpkg\vcpkg install lapack-reference:x64-windows
        
    - name: Create proper FindSuiteSparse.cmake
      run: |
        $vcpkgPath = "$env:GITHUB_WORKSPACE/vcpkg/installed/x64-windows" -replace '\\', '/'
        
        $lines = @()
        $lines += "# FindSuiteSparse.cmake for vcpkg"
        $lines += "cmake_minimum_required(VERSION 3.10)"
        $lines += ""
        $lines += "# Set paths from vcpkg"
        $lines += "set(SuiteSparse_FOUND TRUE)"
        $lines += "set(SuiteSparse_INCLUDE_DIR `"$vcpkgPath/include`")"
        $lines += "set(SuiteSparse_LIBRARY_DIR `"$vcpkgPath/lib`")"
        $lines += ""
        $lines += "# Set individual component paths"
        $lines += "set(SuiteSparse_AMD_INCLUDE_DIR `"$vcpkgPath/include`")"
        $lines += "set(SuiteSparse_CAMD_INCLUDE_DIR `"$vcpkgPath/include`")"
        $lines += "set(SuiteSparse_COLAMD_INCLUDE_DIR `"$vcpkgPath/include`")"
        $lines += "set(SuiteSparse_CCOLAMD_INCLUDE_DIR `"$vcpkgPath/include`")"
        $lines += "set(SuiteSparse_CHOLMOD_INCLUDE_DIR `"$vcpkgPath/include`")"
        $lines += "set(SuiteSparse_UMFPACK_INCLUDE_DIR `"$vcpkgPath/include`")"
        $lines += "set(SuiteSparse_SPQR_INCLUDE_DIR `"$vcpkgPath/include`")"
        $lines += "set(SuiteSparse_KLU_INCLUDE_DIR `"$vcpkgPath/include`")"
        $lines += "set(SuiteSparse_LDL_INCLUDE_DIR `"$vcpkgPath/include`")"
        $lines += "set(SuiteSparse_BTF_INCLUDE_DIR `"$vcpkgPath/include`")"
        $lines += "set(SuiteSparse_CXSPARSE_INCLUDE_DIR `"$vcpkgPath/include`")"
        $lines += "set(SuiteSparse_SUITESPARSECONFIG_INCLUDE_DIR `"$vcpkgPath/include`")"
        $lines += ""
        $lines += "# Set library files"
        $lines += "set(SuiteSparse_AMD_LIBRARY `"$vcpkgPath/lib/amd.lib`")"
        $lines += "set(SuiteSparse_CAMD_LIBRARY `"$vcpkgPath/lib/camd.lib`")"
        $lines += "set(SuiteSparse_COLAMD_LIBRARY `"$vcpkgPath/lib/colamd.lib`")"
        $lines += "set(SuiteSparse_CCOLAMD_LIBRARY `"$vcpkgPath/lib/ccolamd.lib`")"
        $lines += "set(SuiteSparse_CHOLMOD_LIBRARY `"$vcpkgPath/lib/cholmod.lib`")"
        $lines += "set(SuiteSparse_UMFPACK_LIBRARY `"$vcpkgPath/lib/umfpack.lib`")"
        $lines += "set(SuiteSparse_SPQR_LIBRARY `"$vcpkgPath/lib/spqr.lib`")"
        $lines += "set(SuiteSparse_KLU_LIBRARY `"$vcpkgPath/lib/klu.lib`")"
        $lines += "set(SuiteSparse_LDL_LIBRARY `"$vcpkgPath/lib/ldl.lib`")"
        $lines += "set(SuiteSparse_BTF_LIBRARY `"$vcpkgPath/lib/btf.lib`")"
        $lines += "set(SuiteSparse_CXSPARSE_LIBRARY `"$vcpkgPath/lib/cxsparse.lib`")"
        $lines += "set(SuiteSparse_SUITESPARSECONFIG_LIBRARY `"$vcpkgPath/lib/suitesparseconfig.lib`")"
        $lines += ""
        $lines += "# BLAS/LAPACK"
        $lines += "set(SuiteSparse_BLAS_LIBRARY `"$vcpkgPath/lib/openblas.lib`")"
        $lines += "set(SuiteSparse_LAPACK_LIBRARY `"$vcpkgPath/lib/lapack.lib`")"
        $lines += ""
        $lines += "# Create imported target"
        $lines += "if(NOT TARGET SuiteSparse::SuiteSparse)"
        $lines += "  add_library(SuiteSparse::SuiteSparse INTERFACE IMPORTED)"
        $lines += "  target_include_directories(SuiteSparse::SuiteSparse INTERFACE `"$vcpkgPath/include`")"
        $lines += "  target_link_libraries(SuiteSparse::SuiteSparse INTERFACE"
        $lines += "    `"$vcpkgPath/lib/cholmod.lib`""
        $lines += "    `"$vcpkgPath/lib/amd.lib`""
        $lines += "    `"$vcpkgPath/lib/camd.lib`""
        $lines += "    `"$vcpkgPath/lib/colamd.lib`""
        $lines += "    `"$vcpkgPath/lib/ccolamd.lib`""
        $lines += "    `"$vcpkgPath/lib/openblas.lib`""
        $lines += "    `"$vcpkgPath/lib/lapack.lib`""
        $lines += "  )"
        $lines += "endif()"
        $lines += ""
        $lines += "message(STATUS `"Found SuiteSparse via vcpkg at $vcpkgPath`")"
        
        $content = $lines -join "`n"
        $content | Set-Content "cmake/FindSuiteSparse.cmake" -Encoding UTF8
        
        echo "Created FindSuiteSparse.cmake"
        
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1
      
    - name: Configure CMake
      run: |
        $vcpkgPath = "$env:GITHUB_WORKSPACE/vcpkg/installed/x64-windows" -replace '\\', '/'
        
        cmake -B build `
          -DBFF_BUILD_GUI=ON `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" `
          -DSuiteSparse_DIR="$vcpkgPath"
        
    - name: Build
      run: |
        cmake --build build --config Release --parallel 2
        
    - name: Check results
      run: |
        if (Test-Path "build/Release/bff-viewer.exe") {
            echo "✅ SUCCESS: bff-viewer.exe built!"
            dir "build/Release/bff-viewer.exe"
            
            # Try to run it (will fail without display, but that's OK)
            echo "`nTrying to run viewer..."
            & "build/Release/bff-viewer.exe" --help 2>&1 | Out-String
        } else {
            echo "❌ Viewer not found in build/Release/"
            echo "Looking in all build directories..."
            Get-ChildItem -Path build -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue | ForEach-Object {
                echo "Found: $($_.FullName)"
            }
        }
