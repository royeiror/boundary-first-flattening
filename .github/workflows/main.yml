name: Build BFF Windows Binary

on:
  push:
    tags: ['v*']
  release:
    types: [created]
  workflow_dispatch:  # Manual trigger

jobs:
  build-windows:
    name: Build BFF Command Line (Windows x64)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Clean existing directories
      run: |
        # Clean up any existing directories completely
        if (Test-Path "SuiteSparse-fresh") {
            Remove-Item -Recurse -Force SuiteSparse-fresh
        }
        if (Test-Path "build") {
            Remove-Item -Recurse -Force build
        }

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install build tools
      run: |
        choco install cmake -y
        choco install git -y

    - name: Download and setup OpenBLAS for SuiteSparse
      run: |
        # Download a pre-built OpenBLAS for Windows
        mkdir openblas-setup
        cd openblas-setup
        
        # Download OpenBLAS from a reliable source
        # Using the one from GitHub releases
        $openblasUrl = "https://github.com/xianyi/OpenBLAS/releases/download/v0.3.26/OpenBLAS-0.3.26-x64.zip"
        Invoke-WebRequest -Uri $openblasUrl -OutFile openblas.zip
        
        # Extract OpenBLAS
        Expand-Archive openblas.zip -DestinationPath .
        
        # Find the extracted directory
        $openblasDir = Get-ChildItem -Path . -Directory -Name | Where-Object { $_ -like "OpenBLAS*" } | Select-Object -First 1
        
        if ($openblasDir) {
            echo "OpenBLAS directory: $openblasDir"
            # Copy libraries and includes to a standard location
            Copy-Item "$openblasDir\lib\*" ..\openblas-libs\ -Recurse -Force
            Copy-Item "$openblasDir\include\*" ..\openblas-include\ -Recurse -Force
            Copy-Item "$openblasDir\bin\*" ..\openblas-bins\ -Recurse -Force
        } else {
            echo "Could not find OpenBLAS directory after extraction"
            dir . -Recurse
        }

    - name: Clone and build SuiteSparse with explicit BLAS
      run: |
        # Clone SuiteSparse
        git clone https://github.com/DrTimothyAldenDavis/SuiteSparse.git SuiteSparse-fresh
        cd SuiteSparse-fresh
        
        # Create fresh build directory
        if (Test-Path "build") {
            Remove-Item -Recurse -Force build
        }
        mkdir build
        cd build
        
        echo "Building SuiteSparse with explicit BLAS..."
        
        # Configure SuiteSparse with explicit BLAS paths
        cmake .. `
          -DCMAKE_INSTALL_PREFIX="$pwd\install" `
          -DCMAKE_BUILD_TYPE=Release `
          -DBLAS_LIBRARIES="$pwd\..\..\openblas-libs\libopenblas.lib" `
          -DBLAS_openblas_LIBRARY="$pwd\..\..\openblas-libs\libopenblas.lib" `
          -DBLAS_INCLUDE_DIRS="$pwd\..\..\openblas-include" `
          -DLAPACK_LIBRARIES="$pwd\..\..\openblas-libs\libopenblas.lib" `
          -DLAPACK_openblas_LIBRARY="$pwd\..\..\openblas-libs\libopenblas.lib" `
          -DUSE_OPENBLAS=ON `
          -DBLA_VENDOR=OpenBLAS `
          -G "Visual Studio 17 2022" -A x64
        
        # Build SuiteSparse
        cmake --build . --config Release --parallel
        
        # Install to the local install directory
        cmake --build . --config Release --target install
        
        # Verify the build
        if (Test-Path "install\lib\libcholmod.lib") {
            echo "✓ SuiteSparse built successfully!"
            dir install\lib /s
        } else {
            echo "✗ SuiteSparse build failed - checking what was built..."
            dir . -Recurse -Filter *.lib
            exit 1
        }

    - name: Setup BFF dependencies
      run: |
        # Check for OpenBLAS in deps (required for BFF)
        if (Test-Path "deps/openblas-windows") {
            echo "✓ BFF OpenBLAS found in deps"
            dir deps\openblas-windows /s
        } else {
            echo "✗ BFF OpenBLAS not found - setting up from downloaded OpenBLAS"
            # Use the OpenBLAS we downloaded for SuiteSparse
            mkdir deps\openblas-windows\lib -Force
            mkdir deps\openblas-windows\include -Force
            Copy-Item "openblas-libs\*" "deps\openblas-windows\lib\" -Recurse -Force
            Copy-Item "openblas-include\*" "deps\openblas-windows\include\" -Recurse -Force
        }

    - name: Fix CMakeLists.txt for modern CMake
      run: |
        # Apply minimal fix to CMakeLists.txt
        if (Test-Path "CMakeLists.txt") {
            $content = Get-Content CMakeLists.txt -Raw
            # Update cmake_minimum_required to a compatible version
            $content = $content -replace 'cmake_minimum_required\(.*\)', 'cmake_minimum_required(VERSION 3.5)'
            $content | Set-Content CMakeLists.txt
            echo "Updated CMakeLists.txt"
        }

    - name: Configure BFF
      run: |
        $SuiteSparseDir = "$pwd\SuiteSparse-fresh\build\install"
        $OpenBLASDir = "$pwd\deps\openblas-windows"
        
        echo "Using SuiteSparse from: $SuiteSparseDir"
        echo "Using OpenBLAS from: $OpenBLASDir"
        
        # Verify dependencies exist
        if (-not (Test-Path "$SuiteSparseDir\lib\libcholmod.lib")) {
            echo "ERROR: SuiteSparse libraries not found!"
            exit 1
        }
        
        if (-not (Test-Path "$OpenBLASDir\lib\libopenblas.lib")) {
            echo "WARNING: OpenBLAS lib not found, checking for alternatives..."
            dir "$OpenBLASDir\lib" /s
        }
        
        # Create fresh BFF build directory
        if (Test-Path "build") {
            Remove-Item -Recurse -Force build
        }
        mkdir build
        cd build
        
        # Configure BFF
        cmake .. `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_POLICY_DEFAULT_CMP0001=NEW `
          -DSuiteSparse_CHOLMOD_DIR="$SuiteSparseDir\lib" `
          -DSuiteSparse_CHOLMOD_INCLUDE_DIR="$SuiteSparseDir\include\suitesparse" `
          -DSuiteSparse_CHOLMOD_LIBRARY_RELEASE="$SuiteSparseDir\lib\libcholmod.lib" `
          -DSuiteSparse_AMD_LIBRARY_RELEASE="$SuiteSparseDir\lib\libamd.lib" `
          -DSuiteSparse_CAMD_LIBRARY_RELEASE="$SuiteSparseDir\lib\libcamd.lib" `
          -DSuiteSparse_CCOLAMD_LIBRARY_RELEASE="$SuiteSparseDir\lib\libccolamd.lib" `
          -DSuiteSparse_COLAMD_LIBRARY_RELEASE="$SuiteSparseDir\lib\libcolamd.lib" `
          -DSuiteSparse_BLAS_LIBRARY="$OpenBLASDir\lib\libopenblas.lib" `
          -DSuiteSparse_LAPACK_LIBRARY="$OpenBLASDir\lib\libopenblas.lib" `
          -G "Visual Studio 17 2022" -A x64

    - name: Build BFF command line tool
      run: |
        cd build
        cmake --build . --config Release --target bff-command-line --parallel

    - name: Find and package executable
      run: |
        echo "Searching for built executables..."
        $exes = Get-ChildItem -Path build -Recurse -Filter *.exe
        if ($exes) {
            foreach ($exe in $exes) {
                echo "✓ Found: $($exe.FullName)"
                # Copy to a common location for easy upload
                Copy-Item $exe.FullName ".\"
            }
        } else {
            echo "No executables found in build directory!"
            echo "Build directory contents:"
            dir build -Recurse
        }

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bff-windows-binaries
        path: |
          *.exe
          build/Release/*.exe
          build/*.exe
        retention-days: 30
