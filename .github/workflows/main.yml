name: Build BFF Viewer

on: workflow_dispatch

jobs:
  build-viewer:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Install vcpkg
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg install suitesparse:x64-windows
        
    - name: Create stub header
      run: |
        # Simple stub as a single string
        $stub = '// cholmod_stub.h
#ifndef CHOLMOD_STUB_H
#define CHOLMOD_STUB_H

#include "cholmod.h"

// Dummy function definitions
double cholmod_norm_dense(cholmod_dense* A, int norm, cholmod_common* Common) { return 0.0; }
double cholmod_norm_sparse(cholmod_sparse* A, int norm, cholmod_common* Common) { return 0.0; }
cholmod_sparse* cholmod_submatrix(cholmod_sparse* A, int* rset, int rsize, int* cset, int csize, int values, int sorted, cholmod_common* Common) { return NULL; }
int cholmod_scale(cholmod_dense* S, int scale, cholmod_sparse* A, cholmod_common* Common) { return 0; }
cholmod_sparse* cholmod_ssmult(cholmod_sparse* A, cholmod_sparse* B, int stype, int values, int sorted, cholmod_common* Common) { return NULL; }
int cholmod_sdmult(cholmod_sparse* A, int transpose, double alpha[2], double beta[2], cholmod_dense* X, cholmod_dense* Y, cholmod_common* Common) { return 0; }

#ifndef CHOLMOD_SCALAR
#define CHOLMOD_SCALAR 0
#endif

#endif'
        
        $stub | Set-Content cholmod_stub.h
        
        # Update Common.h
        (Get-Content "include/bff/linear-algebra/Common.h") | ForEach-Object {
            if ($_ -match '#include "cholmod.h"') {
                $_
                '#include "cholmod_stub.h"'
            } else {
                $_
            }
        } | Set-Content "include/bff/linear-algebra/Common.h"
        
    - name: Copy headers
      run: |
        mkdir include
        Copy-Item "vcpkg/installed/x64-windows/include/*.h" "include/" -ErrorAction SilentlyContinue
        
    - name: Create FindSuiteSparse.cmake with forward slashes
      run: |
        # Get workspace path and convert ALL backslashes to forward slashes
        $workspace = $env:GITHUB_WORKSPACE -replace '\\', '/'
        $libpath = "$env:GITHUB_WORKSPACE/vcpkg/installed/x64-windows/lib" -replace '\\', '/'
        
        # Write file
        "set(SuiteSparse_FOUND TRUE)" | Out-File cmake/FindSuiteSparse.cmake -Encoding UTF8
        "set(SuiteSparse_INCLUDE_DIR `"$workspace/include`")" | Out-File -Append cmake/FindSuiteSparse.cmake -Encoding UTF8
        "set(SuiteSparse_CHOLMOD_LIBRARY `"$libpath/cholmod.lib`")" | Out-File -Append cmake/FindSuiteSparse.cmake -Encoding UTF8
        "message(STATUS `"SuiteSparse configured`")" | Out-File -Append cmake/FindSuiteSparse.cmake -Encoding UTF8
        
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1
      
    - name: Configure CMake
      run: |
        cmake -B build -DBFF_BUILD_GUI=ON -DCMAKE_BUILD_TYPE=Release
        
    - name: Build
      run: |
        cmake --build build --config Release
        
    - name: Check results
      run: |
        if (Test-Path "build/Release/bff-viewer.exe") {
            echo "✅ SUCCESS: bff-viewer.exe built!"
        } else {
            echo "❌ Build failed"
        }
