name: Build BFF for Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout BFF repository
      uses: actions/checkout@v4
      with:
        repository: royeiror/boundary-first-flattening
        submodules: recursive
        
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2
      
    - name: Install CMake
      uses: jwlawson/actions-setup-cmake@v1
      with:
        cmake-version: '3.28.x'
        
    - name: Create dummy SuiteSparse
      shell: cmd
      run: |
        echo Creating dummy SuiteSparse...
        
        if exist suitesparse rd /s /q suitesparse
        mkdir suitesparse
        mkdir suitesparse\install
        mkdir suitesparse\install\include
        mkdir suitesparse\install\include\suitesparse
        mkdir suitesparse\install\lib
        
        cd suitesparse\install\include\suitesparse
        echo #define SUITESPARSE_VERSION "7.6.1" > SuiteSparse_config.h
        echo #define AMD_VERSION "2.4.6" > amd.h
        echo #define COLAMD_VERSION "3.0.0" > colamd.h
        echo #define CHOLMOD_VERSION "5.0.0" > cholmod.h
        
        cd ..\..\lib
        echo LIBRARY suitesparseconfig > suitesparseconfig.def
        echo EXPORTS >> suitesparseconfig.def
        echo   SuiteSparse_version >> suitesparseconfig.def
        
        echo LIBRARY amd > amd.def
        echo EXPORTS >> amd.def
        echo   amd_version >> amd.def
        
        echo LIBRARY colamd > colamd.def
        echo EXPORTS >> colamd.def
        echo   colamd_version >> colamd.def
        
        echo LIBRARY cholmod > cholmod.def
        echo EXPORTS >> cholmod.def
        echo   cholmod_version >> cholmod.def
        
        "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC\14.44.35207\bin\Hostx64\x64\lib.exe" /DEF:suitesparseconfig.def /OUT:suitesparseconfig.lib /MACHINE:X64
        "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC\14.44.35207\bin\Hostx64\x64\lib.exe" /DEF:amd.def /OUT:amd.lib /MACHINE:X64
        "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC\14.44.35207\bin\Hostx64\x64\lib.exe" /DEF:colamd.def /OUT:colamd.lib /MACHINE:X64
        "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC\14.44.35207\bin\Hostx64\x64\lib.exe" /DEF:cholmod.def /OUT:cholmod.lib /MACHINE:X64
        
        echo Dummy SuiteSparse created
        
    - name: Clean up dummy dependency files
      shell: cmd
      run: |
        echo Cleaning up any leftover dummy files...
        
        rem Remove our dummy CMakeLists.txt files if they exist
        if exist deps\nanogui\CMakeLists.txt.dummy (
          echo Removing dummy nanogui CMakeLists.txt...
          if exist deps\nanogui\CMakeLists.txt (
            if exist deps\nanogui\CMakeLists.txt.real (
              move /y deps\nanogui\CMakeLists.txt.real deps\nanogui\CMakeLists.txt
            ) else (
              del deps\nanogui\CMakeLists.txt
            )
          )
          del deps\nanogui\CMakeLists.txt.dummy
        )
        
        if exist deps\glm\CMakeLists.txt.dummy (
          echo Removing dummy glm CMakeLists.txt...
          if exist deps\glm\CMakeLists.txt (
            if exist deps\glm\CMakeLists.txt.real (
              move /y deps\glm\CMakeLists.txt.real deps\glm\CMakeLists.txt
            ) else (
              del deps\glm\CMakeLists.txt
            )
          )
          del deps\glm\CMakeLists.txt.dummy
        )
        
    - name: Patch CMakeLists.txt
      shell: powershell
      run: |
        # Simple patch to disable SuiteSparse requirement
        $content = Get-Content CMakeLists.txt -Raw
        
        $replacement = "# find_package(SuiteSparse REQUIRED) - disabled`n" +
        "set(SUITESPARSE_FOUND TRUE)`n" +
        'set(SUITESPARSE_INCLUDE_DIRS "${CMAKE_CURRENT_SOURCE_DIR}/../suitesparse/install/include/suitesparse")' + "`n" +
        'set(SUITESPARSE_LIBRARIES "${CMAKE_CURRENT_SOURCE_DIR}/../suitesparse/install/lib/cholmod.lib;${CMAKE_CURRENT_SOURCE_DIR}/../suitesparse/install/lib/amd.lib;${CMAKE_CURRENT_SOURCE_DIR}/../suitesparse/install/lib/colamd.lib;${CMAKE_CURRENT_SOURCE_DIR}/../suitesparse/install/lib/suitesparseconfig.lib")' + "`n" +
        'set(CHOLMOD_FOUND TRUE)' + "`n" +
        'set(CHOLMOD_LIBRARIES "${CMAKE_CURRENT_SOURCE_DIR}/../suitesparse/install/lib/cholmod.lib")' + "`n" +
        'set(CHOLMOD_INCLUDE_DIRS "${CMAKE_CURRENT_SOURCE_DIR}/../suitesparse/install/include/suitesparse")'
        
        $content = $content -replace 'find_package\(SuiteSparse REQUIRED\)', $replacement
        Set-Content CMakeLists.txt $content -Encoding ASCII
        Write-Host "CMakeLists.txt patched"
        
    - name: Configure
      shell: cmd
      run: |
        if exist build rd /s /q build
        mkdir build
        cd build
        
        rem Try to configure with OpenGL disabled if nanogui needs it
        cmake .. -G "Visual Studio 17 2022" -A x64 ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DNANOGUI_BUILD_EXAMPLE=OFF ^
          -DNANOGUI_BUILD_SHARED=OFF ^
          -DNANOGUI_BUILD_PYTHON=OFF
        
    - name: Build
      shell: cmd
      run: |
        cd build
        
        rem Try to build specific target first
        cmake --build . --config Release --target bff-command-line || (
          echo "Building bff-command-line failed, trying all targets..."
          cmake --build . --config Release
        )
        
        if exist Release\*.exe (
          echo Success! Executables:
          dir Release\*.exe
        ) else (
          echo No executables in Release
          echo Looking for any executables...
          dir /s *.exe 2>nul || echo No executables found
        )
        
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: bff-binaries
        path: build/Release/*.exe
