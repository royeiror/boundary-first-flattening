name: Build BFF for Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout BFF Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        repository: GeometryCollective/boundary-first-flattening
        ref: v1.6
    
    - name: Install Modern CMake
      shell: powershell
      run: |
        Write-Host "Installing latest CMake..."
        
        # Download and install latest CMake
        $cmakeUrl = "https://github.com/Kitware/CMake/releases/download/v3.28.3/cmake-3.28.3-windows-x86_64.msi"
        $cmakeInstaller = "C:\cmake-installer.msi"
        
        Invoke-WebRequest -Uri $cmakeUrl -OutFile $cmakeInstaller
        
        # Install CMake
        msiexec /i $cmakeInstaller /quiet /qn /norestart ADD_CMAKE_TO_PATH=System
        
        # Wait for installation
        Start-Sleep -Seconds 10
        
        # Clean up
        Remove-Item $cmakeInstaller -Force
        
        Write-Host "CMake installed"
    
    - name: Setup Build Environment
      shell: powershell
      run: |
        Write-Host "Setting up build environment..."
        
        # Create SuiteSparse directory
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse" | Out-Null
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse\include" | Out-Null
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse\lib" | Out-Null
        
        # Download pre-built SuiteSparse binaries for Windows
        # From: https://github.com/jlblancoc/suitesparse-metis-for-windows/releases
        Write-Host "Downloading SuiteSparse binaries..."
        
        $suiteSparseUrl = "https://github.com/jlblancoc/suitesparse-metis-for-windows/releases/download/v1.7.2/SuiteSparse-7.0.1-Win64.zip"
        $suiteSparseZip = "C:\SuiteSparse.zip"
        
        Invoke-WebRequest -Uri $suiteSparseUrl -OutFile $suiteSparseZip
        
        # Extract
        Expand-Archive -Path $suiteSparseZip -DestinationPath "C:\SuiteSparse-temp" -Force
        
        # Copy libraries and headers
        Write-Host "Copying SuiteSparse files..."
        
        # Copy include files
        if (Test-Path "C:\SuiteSparse-temp\include") {
            Get-ChildItem -Path "C:\SuiteSparse-temp\include" -Filter "*.h" -Recurse | ForEach-Object {
                $destPath = "C:\SuiteSparse\include\$($_.Name)"
                Copy-Item -Path $_.FullName -Destination $destPath -Force
                Write-Host "  Copied header: $($_.Name)"
            }
        }
        
        # Copy library files
        if (Test-Path "C:\SuiteSparse-temp\lib") {
            Get-ChildItem -Path "C:\SuiteSparse-temp\lib" -Filter "*.lib" | ForEach-Object {
                $destPath = "C:\SuiteSparse\lib\$($_.Name)"
                Copy-Item -Path $_.FullName -Destination $destPath -Force
                Write-Host "  Copied library: $($_.Name)"
            }
        }
        
        # Also look for DLLs
        if (Test-Path "C:\SuiteSparse-temp\bin") {
            New-Item -ItemType Directory -Force -Path "C:\SuiteSparse\bin" | Out-Null
            Get-ChildItem -Path "C:\SuiteSparse-temp\bin" -Filter "*.dll" | ForEach-Object {
                $destPath = "C:\SuiteSparse\bin\$($_.Name)"
                Copy-Item -Path $_.FullName -Destination $destPath -Force
                Write-Host "  Copied DLL: $($_.Name)"
            }
        }
        
        # Clean up
        Remove-Item -Path "C:\SuiteSparse-temp" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path $suiteSparseZip -Force -ErrorAction SilentlyContinue
        
        Write-Host "SuiteSparse setup complete"
    
    - name: Create CMakeLists.txt
      shell: powershell
      run: |
        Write-Host "Creating CMakeLists.txt..."
        
        # Backup original if it exists
        if (Test-Path "CMakeLists.txt") {
            Copy-Item "CMakeLists.txt" "CMakeLists.txt.backup" -Force
        }
        
        # Create a robust CMakeLists.txt that manually finds SuiteSparse
        $cmakeContent = 'cmake_minimum_required(VERSION 3.15)' + "`n" +
                        'project(BFF LANGUAGES CXX)' + "`n" +
                        '' + "`n" +
                        'set(CMAKE_CXX_STANDARD 17)' + "`n" +
                        'set(CMAKE_CXX_STANDARD_REQUIRED ON)' + "`n" +
                        'set(CMAKE_CXX_EXTENSIONS OFF)' + "`n" +
                        '' + "`n" +
                        '# Set SuiteSparse paths' + "`n" +
                        'set(SUITESPARSE_DIR "C:/SuiteSparse")' + "`n" +
                        'set(SUITESPARSE_INCLUDE_DIR "${SUITESPARSE_DIR}/include")' + "`n" +
                        'set(SUITESPARSE_LIB_DIR "${SUITESPARSE_DIR}/lib")' + "`n" +
                        '' + "`n" +
                        '# Find SuiteSparse libraries manually' + "`n" +
                        'find_library(CHOLMOD_LIBRARY NAMES cholmod libcholmod PATHS ${SUITESPARSE_LIB_DIR} NO_DEFAULT_PATH)' + "`n" +
                        'find_library(AMD_LIBRARY NAMES amd libamd PATHS ${SUITESPARSE_LIB_DIR} NO_DEFAULT_PATH)' + "`n" +
                        'find_library(CAMD_LIBRARY NAMES camd libcamd PATHS ${SUITESPARSE_LIB_DIR} NO_DEFAULT_PATH)' + "`n" +
                        'find_library(COLAMD_LIBRARY NAMES colamd libcolamd PATHS ${SUITESPARSE_LIB_DIR} NO_DEFAULT_PATH)' + "`n" +
                        'find_library(CCOLAMD_LIBRARY NAMES ccolamd libccolamd PATHS ${SUITESPARSE_LIB_DIR} NO_DEFAULT_PATH)' + "`n" +
                        'find_library(METIS_LIBRARY NAMES metis libmetis PATHS ${SUITESPARSE_LIB_DIR} NO_DEFAULT_PATH)' + "`n" +
                        '' + "`n" +
                        '# Check if libraries were found' + "`n" +
                        'if(NOT CHOLMOD_LIBRARY)' + "`n" +
                        '    message(FATAL_ERROR "CHOLMOD library not found in ${SUITESPARSE_LIB_DIR}")' + "`n" +
                        'else()' + "`n" +
                        '    message(STATUS "Found CHOLMOD: ${CHOLMOD_LIBRARY}")' + "`n" +
                        'endif()' + "`n" +
                        '' + "`n" +
                        '# Include directories' + "`n" +
                        'include_directories(' + "`n" +
                        '    ${CMAKE_SOURCE_DIR}/include' + "`n" +
                        '    ${CMAKE_SOURCE_DIR}/deps/libigl/include' + "`n" +
                        '    ${CMAKE_SOURCE_DIR}/deps/spectra/include' + "`n" +
                        '    ${SUITESPARSE_INCLUDE_DIR}' + "`n" +
                        ')' + "`n" +
                        '' + "`n" +
                        '# Find source files' + "`n" +
                        'file(GLOB_RECURSE SRC_FILES "src/*.cpp")' + "`n" +
                        'if(NOT SRC_FILES)' + "`n" +
                        '    message(FATAL_ERROR "No source files found in src/ directory")' + "`n" +
                        'endif()' + "`n" +
                        '' + "`n" +
                        '# Create library' + "`n" +
                        'add_library(bff-lib STATIC ${SRC_FILES})' + "`n" +
                        '' + "`n" +
                        '# Link SuiteSparse libraries' + "`n" +
                        'target_link_libraries(bff-lib' + "`n" +
                        '    ${CHOLMOD_LIBRARY}' + "`n" +
                        '    ${AMD_LIBRARY}' + "`n" +
                        '    ${CAMD_LIBRARY}' + "`n" +
                        '    ${COLAMD_LIBRARY}' + "`n" +
                        '    ${CCOLAMD_LIBRARY}' + "`n" +
                        '    ${METIS_LIBRARY}' + "`n" +
                        ')' + "`n" +
                        '' + "`n" +
                        '# Find and add GUI application' + "`n" +
                        'file(GLOB_RECURSE GUI_FILES "apps/*.cpp")' + "`n" +
                        'if(GUI_FILES)' + "`n" +
                        '    add_executable(bff-gui ${GUI_FILES})' + "`n" +
                        '    target_link_libraries(bff-gui bff-lib)' + "`n" +
                        '    target_include_directories(bff-gui PRIVATE ${CMAKE_SOURCE_DIR}/apps)' + "`n" +
                        '    message(STATUS "Building GUI application: bff-gui")' + "`n" +
                        'else()' + "`n" +
                        '    message(WARNING "No GUI files found in apps/ directory")' + "`n" +
                        'endif()' + "`n" +
                        '' + "`n" +
                        '# Also look for any other executables' + "`n" +
                        'file(GLOB_RECURSE ALL_APP_FILES "apps/*.cpp" "*.cpp")' + "`n" +
                        'foreach(app_file ${ALL_APP_FILES})' + "`n" +
                        '    get_filename_component(app_name ${app_file} NAME_WE)' + "`n" +
                        '    if(NOT TARGET bff-gui AND NOT ${app_name} STREQUAL "bff-gui")' + "`n" +
                        '        add_executable(${app_name} ${app_file})' + "`n" +
                        '        target_link_libraries(${app_name} bff-lib)' + "`n" +
                        '        message(STATUS "Building application: ${app_name}")' + "`n" +
                        '    endif()' + "`n" +
                        'endforeach()'
        
        Set-Content -Path "CMakeLists.txt" -Value $cmakeContent
        Write-Host "Created CMakeLists.txt"
    
    - name: Verify SuiteSparse Installation
      shell: powershell
      run: |
        Write-Host "Verifying SuiteSparse installation..."
        
        Write-Host "`nSuiteSparse include directory (C:\SuiteSparse\include):"
        if (Test-Path "C:\SuiteSparse\include") {
            Get-ChildItem -Path "C:\SuiteSparse\include" -Filter "*.h" | Select-Object -First 10 | ForEach-Object {
                Write-Host "  - $($_.Name)"
            }
        } else {
            Write-Host "  ERROR: Include directory not found!"
        }
        
        Write-Host "`nSuiteSparse library directory (C:\SuiteSparse\lib):"
        if (Test-Path "C:\SuiteSparse\lib") {
            Get-ChildItem -Path "C:\SuiteSparse\lib" -Filter "*.lib" | ForEach-Object {
                Write-Host "  - $($_.Name)"
            }
        } else {
            Write-Host "  ERROR: Library directory not found!"
        }
        
        # Check for specific required libraries
        $requiredLibs = @("cholmod", "amd", "camd", "colamd", "ccolamd", "metis")
        foreach ($lib in $requiredLibs) {
            $found = Get-ChildItem -Path "C:\SuiteSparse\lib" -Filter "*$lib*.lib" -ErrorAction SilentlyContinue
            if ($found) {
                Write-Host "  ✓ Found $lib library"
            } else {
                Write-Host "  ✗ Missing $lib library"
            }
        }
    
    - name: Configure CMake
      shell: powershell
      run: |
        Write-Host "Configuring CMake..."
        
        # Clean build directory
        if (Test-Path "build") {
            Remove-Item -Path "build" -Recurse -Force -ErrorAction SilentlyContinue
        }
        
        New-Item -ItemType Directory -Force -Path "build"
        cd build
        
        Write-Host "Current CMake version:"
        & "C:\Program Files\CMake\bin\cmake.exe" --version
        
        Write-Host "`nConfiguring project..."
        
        # Configure with explicit paths
        & "C:\Program Files\CMake\bin\cmake.exe" .. `
          -G "Visual Studio 17 2022" `
          -A x64 `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_PREFIX_PATH="C:/SuiteSparse"
        
        if ($LASTEXITCODE -ne 0) {
            Write-Host "CMake configuration failed with Visual Studio 2022, trying older generator..."
            
            # Try with Visual Studio 2019 generator
            & "C:\Program Files\CMake\bin\cmake.exe" .. `
              -G "Visual Studio 16 2019" `
              -A x64 `
              -DCMAKE_BUILD_TYPE=Release `
              -DCMAKE_PREFIX_PATH="C:/SuiteSparse"
        }
        
        Write-Host "CMake configuration completed"
    
    - name: Build Project
      shell: powershell
      run: |
        Write-Host "Building project..."
        
        if (Test-Path "build\CMakeCache.txt") {
            cd build
            
            Write-Host "Building with CMake..."
            & "C:\Program Files\CMake\bin\cmake.exe" --build . --config Release --parallel 4
            
            if ($LASTEXITCODE -ne 0) {
                Write-Host "Release build failed, trying Debug..."
                & "C:\Program Files\CMake\bin\cmake.exe" --build . --config Debug --parallel 4
            }
            
            # Look for executables
            Write-Host "`nSearching for executables..."
            
            # Check common output directories
            $searchPaths = @(
                ".",
                "Release",
                "Debug",
                "bin",
                "bin/Release",
                "bin/Debug"
            )
            
            foreach ($path in $searchPaths) {
                if (Test-Path $path) {
                    $exes = Get-ChildItem -Path $path -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue | Where-Object {
                        $_.FullName -notmatch "CompilerId"
                    }
                    
                    if ($exes) {
                        Write-Host "Found in $path:"
                        foreach ($exe in $exes) {
                            Write-Host "  - $($exe.Name) ($([math]::Round($exe.Length/1KB, 2)) KB)"
                        }
                    }
                }
            }
            
            if (-not $exes) {
                Write-Host "No executables found in build directory"
            }
        } else {
            Write-Host "Build directory not configured"
        }
    
    - name: Collect and Package Artifacts
      shell: powershell
      run: |
        Write-Host "Collecting and packaging artifacts..."
        
        # Create artifacts directory
        New-Item -ItemType Directory -Force -Path "artifacts"
        
        # Find all executables in build directory
        $allExes = @()
        
        if (Test-Path "build") {
            $buildExes = Get-ChildItem -Path "build" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue | Where-Object {
                $_.FullName -notmatch "CompilerId"
            }
            $allExes += $buildExes
        }
        
        if ($allExes.Count -gt 0) {
            Write-Host "Found executables to package:"
            foreach ($exe in $allExes) {
                Write-Host "  $($exe.FullName)"
                
                # Copy executable to artifacts
                Copy-Item -Path $exe.FullName -Destination "artifacts\" -Force
                
                # Copy required DLLs
                Write-Host "    Copying dependencies..."
                
                # Copy SuiteSparse DLLs
                if (Test-Path "C:\SuiteSparse\bin") {
                    $suiteDlls = Get-ChildItem -Path "C:\SuiteSparse\bin" -Filter "*.dll"
                    foreach ($dll in $suiteDlls) {
                        Copy-Item -Path $dll.FullName -Destination "artifacts\" -Force
                        Write-Host "      Copied: $($dll.Name)"
                    }
                }
                
                # Copy VC++ runtime DLLs
                $vcDlls = @("vcruntime140.dll", "msvcp140.dll", "vcruntime140_1.dll")
                foreach ($vcDll in $vcDlls) {
                    $sysPath = "C:\Windows\System32\$vcDll"
                    if (Test-Path $sysPath) {
                        Copy-Item -Path $sysPath -Destination "artifacts\$vcDll" -Force
                        Write-Host "      Copied VC++ DLL: $vcDll"
                    }
                }
            }
            
            # Create a simple README
            $readmeContent = 'BFF (Boundary First Flattening) - Windows Build' + "`n" +
                            '================================================' + "`n" +
                            '' + "`n" +
                            'To use:' + "`n" +
                            '1. Extract all files to a folder' + "`n" +
                            '2. Run the executable (e.g., bff-gui.exe)' + "`n" +
                            '' + "`n" +
                            'Files included:' + "`n"
            
            $allExes | ForEach-Object {
                $readmeContent += '- ' + $_.Name + "`n"
            }
            
            $readmeContent += '' + "`n" +
                            'Note: All required DLLs are included in this folder.' + "`n"
            
            Set-Content -Path "artifacts\README.txt" -Value $readmeContent
            
        } else {
            Write-Host "No executables found"
            
            # Try to find any build output
            Write-Host "Looking for any build output..."
            
            # List build directory contents
            if (Test-Path "build") {
                Write-Host "Build directory contents:"
                Get-ChildItem -Path "build" -Recurse -File | Select-Object -First 20 | ForEach-Object {
                    Write-Host "  $($_.Name) ($($_.Extension))"
                }
            }
            
            # Create error log
            $errorContent = 'Build completed but no executables were produced.' + "`n" +
                          'Check the build logs for compilation errors.' + "`n"
            
            Set-Content -Path "artifacts\ERROR_LOG.txt" -Value $errorContent
        }
        
        Write-Host "`nArtifacts directory contents:"
        Get-ChildItem -Path "artifacts" -ErrorAction SilentlyContinue | Format-Table Name, Length
    
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BFF-Windows-Build
        path: artifacts/
        if-no-files-found: warn
