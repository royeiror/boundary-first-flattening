name: Windows Build BFF v1.6

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v1.1

    - name: Install dependencies
      shell: powershell
      run: |
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
        choco install git -y

    - name: Build OpenBLAS (static)
      shell: bash
      run: |
        git clone https://github.com/OpenMathLib/OpenBLAS.git
        cd OpenBLAS
        cmake . -G "Visual Studio 17 2022" -A x64 `
          -DBUILD_SHARED_LIBS=OFF `
          -DBUILD_STATIC_LIBS=ON `
          -DCMAKE_INSTALL_PREFIX="../openblas-install"
        cmake --build . --config Release --target INSTALL
        cd ..

    - name: Build METIS (missing dependency)
      shell: bash
      run: |
        # Download and extract METIS 5.1.0
        curl -L -o metis.tar.gz http://glaros.dtc.umn.edu/gkhome/fetch/sw/metis/metis-5.1.0.tar.gz
        tar -xzf metis.tar.gz
        cd metis-5.1.0
        # Patch for MSVC
        sed -i 's/#include <getopt.h>//' programs/cmdline_metis.c
        sed -i 's/#include <getopt.h>//' programs/cmdline_graphchk.c
        mkdir build && cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 `
          -DSHARED=OFF `
          -DCMAKE_INSTALL_PREFIX="../../metis-install"
        cmake --build . --config Release --target INSTALL
        cd .. && cd ..

    - name: Build SuiteSparse (static with OpenBLAS)
      shell: bash
      run: |
        # Use a fork/commit known to build on Windows
        git clone https://github.com/jlblancoc/suitesparse.git --depth 1 --branch v7.7.0
        cd suitesparse
        # Apply critical Windows patches before build
        echo "Patching SuiteSparse for static build with OpenBLAS..." > patch.log
        # 1. Patch cblas.h to use relative includes
        find . -name "cblas.h" -type f -exec sed -i 's|#include "cblas\.h"|#include "../../OpenBLAS/cblas.h"|g' {} \;
        
        # 2. Patch cholmod.h include path
        find . -name "*.h" -type f -exec sed -i 's|#include "suitesparse/cholmod.h"|#include "cholmod.h"|g' {} \;
        find . -name "*.h" -type f -exec sed -i 's|#include <suitesparse/cholmod.h>|#include "cholmod.h"|g' {} \;
        
        # Build with CMake
        mkdir build && cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 `
          -DBLA_VENDOR=OpenBLAS `
          -DBLAS_LIBRARIES="${{ github.workspace }}/openblas-install/lib/libopenblas.lib" `
          -DLAPACK_LIBRARIES="${{ github.workspace }}/openblas-install/lib/libopenblas.lib" `
          -DCMAKE_INSTALL_PREFIX="../../suitesparse-deps" `
          -DBUILD_SHARED_LIBS=OFF `
          -DCMAKE_POLICY_DEFAULT_CMP0074=NEW `
          -DNSTATIC=OFF `
          -DNFORTRAN=ON `
          -DMETIS_LIBRARY="${{ github.workspace }}/metis-install/lib/metis.lib" `
          -DMETIS_INCLUDE_DIR="${{ github.workspace }}/metis-install/include"
        cmake --build . --config Release --target INSTALL
        cd .. && cd ..
        
        # 3. Create blas.lib symlink for compatibility
        cd suitesparse-deps/lib
        cp libopenblas.lib blas.lib
        echo "Created blas.lib symlink from libopenblas.lib" >> ../../patch.log

    - name: Patch BFF source code
      shell: bash
      run: |
        echo "Applying BFF patches for Windows build..." > patches.log
        
        # 1. BFF_API export macros for Windows
        find ./include -name "*.h" -type f -exec sed -i 's/^class \(.*\)$/#ifdef _WIN32\n#ifdef bff_EXPORTS\n#define BFF_API __declspec(dllexport)\n#else\n#define BFF_API __declspec(dllimport)\n#endif\n#else\n#define BFF_API\n#endif\nclass BFF_API \1/g' {} \;
        
        # 2. Create custom FindSuiteSparse.cmake
        cat > cmake/FindSuiteSparse.cmake << 'EOF'
        # Manual override for Windows static build
        if(WIN32)
            set(SuiteSparse_FOUND ON)
            set(SuiteSparse_INCLUDE_DIRS "${{ github.workspace }}/suitesparse-deps/include")
            set(SuiteSparse_LIBRARIES 
                "${{ github.workspace }}/suitesparse-deps/lib/libamd.lib"
                "${{ github.workspace }}/suitesparse-deps/lib/libcamd.lib"
                "${{ github.workspace }}/suitesparse-deps/lib/libccolamd.lib"
                "${{ github.workspace }}/suitesparse-deps/lib/libcolamd.lib"
                "${{ github.workspace }}/suitesparse-deps/lib/libcholmod.lib"
                "${{ github.workspace }}/suitesparse-deps/lib/libspqr.lib"
                "${{ github.workspace }}/suitesparse-deps/lib/libldl.lib"
                "${{ github.workspace }}/suitesparse-deps/lib/libbtf.lib"
                "${{ github.workspace }}/suitesparse-deps/lib/libklu.lib"
                "${{ github.workspace }}/suitesparse-deps/lib/libcxsparse.lib"
                "${{ github.workspace }}/suitesparse-deps/lib/libumfpack.lib"
                "${{ github.workspace }}/suitesparse-deps/lib/suitesparseconfig.lib"
                "${{ github.workspace }}/metis-install/lib/metis.lib"
                "${{ github.workspace }}/openblas-install/lib/libopenblas.lib"
            )
            message(STATUS "Manually configured SuiteSparse for Windows static build")
            message(STATUS "  Includes: ${SuiteSparse_INCLUDE_DIRS}")
            message(STATUS "  Libraries: ${SuiteSparse_LIBRARIES}")
        endif()
        EOF
        
        # 3. Patch main CMakeLists.txt to use manual SuiteSparse
        sed -i 's/find_package(SuiteSparse REQUIRED)/# find_package(SuiteSparse REQUIRED)\ninclude(cmake\/FindSuiteSparse.cmake)/' CMakeLists.txt
        
        # 4. NanoGUI static build patch
        sed -i 's/add_library(nanogui SHARED/add_library(nanogui STATIC/' deps/nanogui/CMakeLists.txt
        sed -i 's/NANOGUI_BUILD SHARED/NANOGUI_BUILD STATIC/' deps/nanogui/CMakeLists.txt
        sed -i 's/target_compile_definitions(nanogui PRIVATE "-DNVG_SHARED")/target_compile_definitions(nanogui PRIVATE "-DNVG_STATIC")/' deps/nanogui/CMakeLists.txt
        
        # 5. Ensure forward slash paths in CMake
        find . -name "CMakeLists.txt" -type f -exec sed -i 's|\\\\|/|g' {} \;

    - name: Configure and Build BFF
      shell: cmd
      run: |
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DCMAKE_PREFIX_PATH="..\suitesparse-deps" ^
          -DBUILD_SHARED_LIBS=ON ^
          -DCMAKE_CXX_FLAGS="/DBFF_EXPORTS"
        cmake --build . --config Release --target ALL_BUILD

    - name: Collect and Package Artifacts
      shell: bash
      run: |
        mkdir -p bff-package
        
        # Copy main executables and DLLs
        cp ./build/Release/bff-viewer.exe ./bff-package/ 2>/dev/null || echo "Warning: bff-viewer.exe not found"
        cp ./build/Release/bff.dll ./bff-package/ 2>/dev/null || echo "Warning: bff.dll not found"
        cp ./build/Release/bff.lib ./bff-package/ 2>/dev/null || echo "Warning: bff.lib not found"
        
        # Copy all DLLs from build directory
        find ./build -name "*.dll" -type f -exec cp {} ./bff-package/ \;
        
        # Copy OpenBLAS DLL if it exists
        cp ./openblas-install/bin/*.dll ./bff-package/ 2>/dev/null || echo "Note: No OpenBLAS DLLs found (may be static)"
        
        # Verify what was collected
        echo "Package contents:" > package_contents.txt
        ls -la ./bff-package/ >> package_contents.txt
        echo "" >> package_contents.txt
        echo "Files in package:" >> package_contents.txt
        find ./bff-package -type f -name "*.exe" -o -name "*.dll" -o -name "*.lib" >> package_contents.txt

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bff-windows-binaries
        path: bff-package/
        if-no-files-found: error
        retention-days: 7
