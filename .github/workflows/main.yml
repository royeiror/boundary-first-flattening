name: Build BFF Windows Binary

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Create stub headers for SuiteSparse
      run: |
        # Create stub cholmod.h using simple echo commands
        echo "#pragma once" > include/cholmod.h
        echo "// Stub cholmod.h for compilation" >> include/cholmod.h
        echo "typedef struct cholmod_common_struct { int dummy; } cholmod_common;" >> include/cholmod.h
        echo "typedef void* cholmod_factor;" >> include/cholmod.h
        echo "typedef void* cholmod_dense;" >> include/cholmod.h
        echo "typedef void* cholmod_sparse;" >> include/cholmod.h
        echo "#define CHOLMOD_MAIN_VERSION 0" >> include/cholmod.h
        echo "#define CHOLMOD_SUB_VERSION 0" >> include/cholmod.h
        
        # Create stub amd.h
        echo "#pragma once" > include/amd.h
        echo "#define AMD_VERSION 0" >> include/amd.h
        
        # Create stub suitesparseconfig.h
        echo "#pragma once" > include/suitesparseconfig.h
        echo "#define SUITESPARSE_VERSION 0" >> include/suitesparseconfig.h
        
        echo "Created stub headers"

    - name: Fix CMake files
      run: |
        # Fix main CMakeLists
        (Get-Content CMakeLists.txt) -replace 'cmake_minimum_required\(.*\)', 'cmake_minimum_required(VERSION 3.5)' | Set-Content CMakeLists.txt
        (Get-Content CMakeLists.txt) -replace 'find_package\(SuiteSparse REQUIRED\)', '# find_package(SuiteSparse)' | Set-Content CMakeLists.txt
        
        # Fix nanogui CMakeLists
        if (Test-Path "deps/nanogui/CMakeLists.txt") {
            (Get-Content "deps/nanogui/CMakeLists.txt") -replace 'cmake_minimum_required\(.*\)', 'cmake_minimum_required(VERSION 3.5)' | Set-Content "deps/nanogui/CMakeLists.txt"
        }
        
        # Remove problematic file
        if (Test-Path "cmake/FindSuiteSparse.cmake") {
            Remove-Item "cmake/FindSuiteSparse.cmake" -Force
        }

    - name: Build BFF
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -G "Visual Studio 17 2022" -A x64
        cmake --build . --config Release --target bff-command-line --parallel

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bff-windows-binary
        path: build/Release/bff-command-line.exe
