name: Build BFF Manual Fix

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build SuiteSparse
      run: |
        git clone https://github.com/jlblancoc/suitesparse-metis-for-windows.git SuiteSparseWin
        cd SuiteSparseWin
        mkdir build && cd build
        cmake .. -DCMAKE_INSTALL_PREFIX="$pwd/install" -DCMAKE_BUILD_TYPE=Release -G "Visual Studio 17 2022" -A x64
        cmake --build . --config Release --target install

    - name: Fix Common.h include
      run: |
        # Fix the Common.h file to use the correct path
        $commonHeader = "include/bff/linear-algebra/Common.h"
        $cholmodPath = "$pwd/SuiteSparseWin/build/install/include/suitesparse/cholmod.h"
        
        if (Test-Path $commonHeader) {
            $content = Get-Content $commonHeader -Raw
            # Replace the simple include with absolute path
            $newContent = $content -replace '#include "cholmod.h"', "#include `"$cholmodPath`""
            $newContent | Set-Content $commonHeader
            echo "Fixed Common.h to use absolute path to cholmod.h"
        }

    - name: Remove dependency check
      run: |
        if (Test-Path "cmake/FindSuiteSparse.cmake") {
            Remove-Item "cmake/FindSuiteSparse.cmake" -Force
        }
        (Get-Content CMakeLists.txt) -replace 'find_package\(SuiteSparse REQUIRED\)', '# ' | Set-Content CMakeLists.txt

    - name: Build BFF
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -G "Visual Studio 17 2022" -A x64
        cmake --build . --config Release --target bff-command-line

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: bff-manual-fix
        path: build/Release/bff-command-line.exe
