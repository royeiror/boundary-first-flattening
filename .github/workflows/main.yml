name: Build BFF v1.6 Windows with GUI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout BFF repository with submodules
      uses: actions/checkout@v4
      with:
        repository: GeometryCollective/boundary-first-flattening
        submodules: recursive
        ref: v1.6

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      
    - name: Install CMake
      uses: jwlawson/actions-setup-cmake@v1
      with:
        cmake-version: "3.25.x"

    - name: Install build tools
      shell: pwsh
      run: |
        choco install -y git
        choco install -y ninja

    - name: Build SuiteSparse for Windows
      shell: pwsh
      run: |
        $SuiteSparseRepo = "https://github.com/jlblancoc/suitesparse-metis-for-windows"
        $SuiteSparseDir = "suitesparse-build"
        
        Write-Host "Cloning SuiteSparse for Windows..."
        git clone --depth 1 $SuiteSparseRepo $SuiteSparseDir
        cd $SuiteSparseDir
        
        Write-Host "Configuring SuiteSparse with CMake..."
        $BuildDir = "build"
        $InstallDir = "$pwd\install"
        
        cmake -B $BuildDir -S . `
          -DCMAKE_INSTALL_PREFIX="$InstallDir" `
          -DCMAKE_BUILD_TYPE=Release `
          -DBUILD_METIS=ON `
          -G "Visual Studio 17 2022" `
          -A x64
        
        Write-Host "Building SuiteSparse..."
        cmake --build $BuildDir --config Release --target INSTALL --parallel
        
        Write-Host "SuiteSparse built successfully!"
        Write-Host "Install directory: $InstallDir"

    - name: Build BFF with SuiteSparse dependency
      shell: pwsh
      run: |
        $SuiteSparseDir = "$pwd\suitesparse-build\install"
        $BFFBuildDir = "bff-build"
        
        Write-Host "Setting up BFF build with SuiteSparse..."
        cd "${{ github.workspace }}"
        
        cmake -B $BFFBuildDir -S . `
          -DCMAKE_BUILD_TYPE=Release `
          -DBFF_BUILD_GUI=ON `
          -DSUITESPARSE_INCLUDE_DIR_HINTS="$SuiteSparseDir\include" `
          -DSUITESPARSE_LIBRARY_DIR_HINTS="$SuiteSparseDir\lib" `
          -DCMAKE_PREFIX_PATH="$SuiteSparseDir\lib\cmake\suitesparse-5.4.0" `
          -G "Visual Studio 17 2022" `
          -A x64
        
        Write-Host "Building BFF..."
        cmake --build $BFFBuildDir --config Release --parallel
        
        Write-Host "BFF build completed!"

    - name: Collect required DLLs
      shell: pwsh
      run: |
        $BuildDir = "bff-build"
        $SuiteSparseDir = "$pwd\suitesparse-build\install"
        $DistDir = "bff-dist"
        
        New-Item -ItemType Directory -Force -Path $DistDir
        
        Write-Host "Copying BFF executables..."
        Copy-Item "$BuildDir\Release\BFF.exe" -Destination $DistDir
        Copy-Item "$BuildDir\Release\bff-command.exe" -Destination $DistDir
        
        Write-Host "Copying SuiteSparse DLLs..."
        $Dlls = Get-ChildItem -Path "$SuiteSparseDir\lib" -Filter "*.dll" -Recurse
        foreach ($dll in $Dlls) {
            Copy-Item $dll.FullName -Destination $DistDir
        }
        
        Write-Host "Copying LAPACK/BLAS DLLs..."
        $BlasDir = "$SuiteSparseDir\lib\lapack_blas_windows"
        if (Test-Path $BlasDir) {
            Copy-Item "$BlasDir\*.dll" -Destination $DistDir
        }
        
        Write-Host "Creating README.txt..."
        $ReadmeContent = "Boundary First Flattening (BFF) v1.6 Windows Build" + "`n" + 
                         "=============================================" + "`n" + 
                         "" + "`n" + 
                         "To run BFF:" + "`n" + 
                         "1. Ensure all DLLs are in the same directory as BFF.exe" + "`n" + 
                         "2. Double-click BFF.exe to launch the GUI" + "`n" + 
                         "3. For command-line usage, run bff-command.exe" + "`n" + 
                         "" + "`n" + 
                         "Dependencies included:" + "`n" + 
                         "- SuiteSparse libraries" + "`n" + 
                         "- LAPACK/BLAS runtime" + "`n" + 
                         "- METIS (optional)" + "`n" + 
                         "" + "`n" + 
                         "Built with GitHub Actions on $(Get-Date -Format 'yyyy-MM-dd')"
        
        Set-Content -Path "$DistDir\README.txt" -Value $ReadmeContent

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BFF-Windows-v1.6
        path: bff-dist/
        retention-days: 7

    - name: Create release archive
      shell: pwsh
      run: |
        $DistDir = "bff-dist"
        $ArchiveName = "BFF-Windows-v1.6.zip"
        
        Compress-Archive -Path "$DistDir\*" -DestinationPath $ArchiveName
        
        Write-Host "Archive created: $ArchiveName"
        Write-Host "Archive size: $((Get-Item $ArchiveName).Length / 1MB) MB"

    - name: Upload release archive
      uses: actions/upload-artifact@v4
      with:
        name: BFF-Windows-Portable
        path: BFF-Windows-v1.6.zip
        retention-days: 7
