    - name: Download and setup OpenBLAS
      shell: powershell
      run: |
        Write-Host "Setting up OpenBLAS..."
        mkdir -Force deps | Out-Null
        cd deps
        
        # Try to download pre-built OpenBLAS
        $success = $false
        $openblasUrls = @(
          "https://github.com/xianyi/OpenBLAS/releases/download/v0.3.23/OpenBLAS-0.3.23-x64.zip",
          "https://github.com/xianyi/OpenBLAS/releases/download/v0.3.24/OpenBLAS-0.3.24-x64.zip",
          "https://github.com/xianyi/OpenBLAS/releases/download/v0.3.26/OpenBLAS-0.3.26-x64.zip"
        )
        
        foreach ($url in $openblasUrls) {
          try {
            Write-Host "Trying OpenBLAS URL: $url"
            $openblasZip = "openblas.zip"
            Invoke-WebRequest -Uri $url -OutFile $openblasZip
            Expand-Archive -Path $openblasZip -DestinationPath "openblas-temp"
            Remove-Item $openblasZip
            
            # Move to final location
            if (Test-Path "openblas-windows") {
              Remove-Item -Recurse -Force "openblas-windows"
            }
            Move-Item "openblas-temp" "openblas-windows"
            
            $success = $true
            Write-Host "OpenBLAS downloaded successfully from $url"
            break
          } catch {
            Write-Host "Failed to download from $url"
          }
        }
        
        if (-not $success) {
          Write-Host "Building OpenBLAS from source..."
          git clone https://github.com/xianyi/OpenBLAS.git openblas-src
          cd openblas-src
          git checkout v0.3.23
          
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=OFF `
            -DNOFORTRAN=1 `
            -DCMAKE_INSTALL_PREFIX="..\..\openblas-windows"
          cmake --build . --config Release --target install
          
          cd ..\..
          Remove-Item -Recurse -Force openblas-src
        }
        
        # Check what we have
        Write-Host "OpenBLAS directory structure:"
        Get-ChildItem -Recurse "openblas-windows" | Select-Object -First 30
        
        # Find the library
        $libFiles = Get-ChildItem -Path "openblas-windows" -Recurse -Filter "*.lib" | Where-Object { $_.Name -like "*openblas*" -or $_.Name -like "*blas*" }
        if ($libFiles) {
          $firstLib = $libFiles | Select-Object -First 1
          Write-Host "Found library: $($firstLib.FullName)"
          
          # Create standard lib directory if it doesn't exist
          $libDir = "openblas-windows\lib"
          mkdir -Force $libDir | Out-Null
          
          # Copy library to standard location
          if ($firstLib.Directory.FullName -ne (Join-Path (Get-Location) $libDir)) {
            Copy-Item $firstLib.FullName -Destination "$libDir\openblas.lib" -Force
          } else {
            # If already in the right directory, just rename if needed
            if ($firstLib.Name -ne "openblas.lib") {
              Copy-Item $firstLib.FullName -Destination "$libDir\openblas.lib" -Force
            }
          }
        } else {
          Write-Host "WARNING: No OpenBLAS library found!"
        }
        
        # Find include directory
        $includeDirs = Get-ChildItem -Path "openblas-windows" -Recurse -Directory | Where-Object { $_.Name -eq "include" }
        if ($includeDirs) {
          $firstInclude = $includeDirs | Select-Object -First 1
          Write-Host "Found include directory: $($firstInclude.FullName)"
          
          # Create standard include directory
          $stdIncludeDir = "openblas-windows\include"
          if ($firstInclude.FullName -ne (Join-Path (Get-Location) $stdIncludeDir)) {
            mkdir -Force $stdIncludeDir | Out-Null
            # Copy headers
            $headerFiles = Get-ChildItem -Path $firstInclude.FullName -Filter "*.h"
            foreach ($file in $headerFiles) {
              $destPath = Join-Path $stdIncludeDir $file.Name
              if ($file.FullName -ne $destPath) {
                Copy-Item $file.FullName -Destination $destPath -Force
              }
            }
          }
        }
        
        Write-Host "OpenBLAS setup complete!"
        Write-Host "Final OpenBLAS structure:"
        Get-ChildItem -Recurse "openblas-windows" -Depth 2
        
    - name: Verify OpenBLAS
      shell: cmd
      run: |
        echo Verifying OpenBLAS installation...
        if exist deps\openblas-windows\lib\openblas.lib (
          echo OpenBLAS library found!
          dir deps\openblas-windows\lib\openblas.lib
        ) else (
          echo ERROR: OpenBLAS library not found!
          echo Looking for any .lib files...
          dir /s deps\openblas-windows\*.lib
        )
        
        if exist deps\openblas-windows\include\*.h (
          echo OpenBLAS headers found!
          dir deps\openblas-windows\include\*.h
        ) else (
          echo WARNING: No OpenBLAS headers found
        )
