name: Build BFF for Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-windows

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout BFF Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2
    
    - name: Install CMake
      uses: lukka/get-cmake@latest
    
    - name: Clone and Build SuiteSparse-METIS
      shell: powershell
      run: |
        Write-Host "Building SuiteSparse-METIS from source..."
        
        # Clone the repository
        git clone https://github.com/jlblancoc/suitesparse-metis-for-windows.git suitesparse-source
        
        # Create build directory
        New-Item -ItemType Directory -Force -Path "suitesparse-build"
        cd suitesparse-build
        
        # Configure with CMake
        cmake -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/suitesparse-install" `
          -DCMAKE_BUILD_TYPE=Release `
          -DBUILD_METIS=ON `
          ../suitesparse-source
        
        # Build and install
        cmake --build . --config Release --target install -j 4
        
        Write-Host "SuiteSparse-METIS built successfully"
        
        # Verify installation
        Write-Host "`nChecking installation..."
        if (Test-Path "${{ github.workspace }}/suitesparse-install/lib") {
          Write-Host "Library files found:"
          Get-ChildItem "${{ github.workspace }}/suitesparse-install/lib" -Filter "*.lib" | Select-Object -First 10
        }
    
    - name: Create Minimal CMakeLists.txt
      shell: powershell
      run: |
        # Create a simple CMakeLists.txt that works
        # We'll write it directly without complex string operations
        $cmakeFile = "CMakeLists.txt"
        
        # Use a here-string but make sure it's properly formatted
        # We'll write to a temporary file first to avoid YAML issues
        $tempFile = "temp_cmake.cmake"
        
        # Write the CMake content
        @"
cmake_minimum_required(VERSION 3.15)
project(BFF)

set(CMAKE_CXX_STANDARD 17)
set(CMAKE_CXX_STANDARD_REQUIRED ON)

# Set SuiteSparse paths
set(SUITESPARSE_INSTALL_DIR "\$ENV{SUITESPARSE_INSTALL}")
set(SUITESPARSE_INCLUDE_DIR "\${SUITESPARSE_INSTALL_DIR}/include")
set(SUITESPARSE_LIB_DIR "\${SUITESPARSE_INSTALL_DIR}/lib")

# Find libraries using file glob
file(GLOB CHOLMOD_LIBS "\${SUITESPARSE_LIB_DIR}/*cholmod*.lib")
file(GLOB AMD_LIBS "\${SUITESPARSE_LIB_DIR}/*amd*.lib")
file(GLOB CAMD_LIBS "\${SUITESPARSE_LIB_DIR}/*camd*.lib")
file(GLOB COLAMD_LIBS "\${SUITESPARSE_LIB_DIR}/*colamd*.lib")
file(GLOB CCOLAMD_LIBS "\${SUITESPARSE_LIB_DIR}/*ccolamd*.lib")
file(GLOB METIS_LIBS "\${SUITESPARSE_LIB_DIR}/*metis*.lib")

# Get first library found
if(CHOLMOD_LIBS)
    list(GET CHOLMOD_LIBS 0 CHOLMOD_LIBRARY)
    message(STATUS "Found CHOLMOD: \${CHOLMOD_LIBRARY}")
else()
    message(FATAL_ERROR "CHOLMOD library not found")
endif()

if(AMD_LIBS) 
    list(GET AMD_LIBS 0 AMD_LIBRARY)
endif()

if(CAMD_LIBS)
    list(GET CAMD_LIBS 0 CAMD_LIBRARY)
endif()

if(COLAMD_LIBS)
    list(GET COLAMD_LIBS 0 COLAMD_LIBRARY)
endif()

if(CCOLAMD_LIBS)
    list(GET CCOLAMD_LIBS 0 CCOLAMD_LIBRARY)
endif()

if(METIS_LIBS)
    list(GET METIS_LIBS 0 METIS_LIBRARY)
endif()

# Include directories
include_directories(
    \${CMAKE_SOURCE_DIR}/include
    \${CMAKE_SOURCE_DIR}/deps/libigl/include
    \${CMAKE_SOURCE_DIR}/deps/spectra/include
    \${SUITESPARSE_INCLUDE_DIR}
)

# Find source files
file(GLOB_RECURSE SRC_FILES "src/*.cpp")

if(NOT SRC_FILES)
    message(FATAL_ERROR "No source files found")
endif()

# Create library
add_library(bff-lib STATIC \${SRC_FILES})

# Link SuiteSparse libraries
target_link_libraries(bff-lib
    \${CHOLMOD_LIBRARY}
    \${AMD_LIBRARY}
    \${CAMD_LIBRARY}
    \${COLAMD_LIBRARY}
    \${CCOLAMD_LIBRARY}
    \${METIS_LIBRARY}
)

# Find and build GUI if it exists
file(GLOB_RECURSE GUI_FILES "apps/*.cpp")
if(GUI_FILES)
    add_executable(bff-gui \${GUI_FILES})
    target_link_libraries(bff-gui bff-lib)
    target_include_directories(bff-gui PRIVATE \${CMAKE_SOURCE_DIR}/apps)
    message(STATUS "Building GUI application")
endif()
"@ | Out-File -FilePath $tempFile -Encoding UTF8
        
        # Now copy it to the right location
        Copy-Item -Path $tempFile -Destination $cmakeFile -Force
        Remove-Item -Path $tempFile
        
        Write-Host "Created CMakeLists.txt"
    
    - name: Configure BFF
      shell: powershell
      run: |
        # Set environment variable for SuiteSparse
        echo "SUITESPARSE_INSTALL=${{ github.workspace }}/suitesparse-install" >> $env:GITHUB_ENV
        
        # Create build directory
        New-Item -ItemType Directory -Force -Path "build"
        cd build
        
        Write-Host "Configuring BFF..."
        
        # Simple CMake configure
        cmake -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_BUILD_TYPE=Release `
          ..
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "CMake configuration failed"
          exit 1
        }
    
    - name: Build BFF
      shell: powershell
      run: |
        cd build
        Write-Host "Building BFF..."
        cmake --build . --config Release --parallel 4
    
    - name: Collect Artifacts
      shell: powershell
      run: |
        # Create artifacts directory
        New-Item -ItemType Directory -Force -Path "artifacts"
        
        # Find executables
        $exes = Get-ChildItem -Path "build" -Filter "*.exe" -Recurse
        foreach ($exe in $exes) {
          Write-Host "Found: $($exe.FullName)"
          Copy-Item -Path $exe.FullName -Destination "artifacts\" -Force
        }
        
        # Copy SuiteSparse DLLs
        $suiteSparseLib = "${{ github.workspace }}/suitesparse-install/lib"
        if (Test-Path $suiteSparseLib) {
          Get-ChildItem -Path $suiteSparseLib -Filter "*.dll" | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination "artifacts\" -Force
            Write-Host "Copied DLL: $($_.Name)"
          }
        }
        
        Write-Host "Artifacts collected:"
        Get-ChildItem -Path "artifacts"
    
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BFF-Windows
        path: artifacts/
