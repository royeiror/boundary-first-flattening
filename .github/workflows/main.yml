name: Build BFF Windows

on: 
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup vcpkg
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg install suitesparse openblas eigen3 --triplet x64-windows

    - name: Copy SuiteSparse headers
      run: |
        # Copy required headers to where the build expects them
        Copy-Item "vcpkg/installed/x64-windows/include/cholmod.h" "include/" -ErrorAction SilentlyContinue
        Copy-Item "vcpkg/installed/x64-windows/include/amd.h" "include/" -ErrorAction SilentlyContinue
        Copy-Item "vcpkg/installed/x64-windows/include/colamd.h" "include/" -ErrorAction SilentlyContinue
        echo "Copied SuiteSparse headers"

    - name: Fix CMake minimum version
      run: |
        (Get-Content CMakeLists.txt) -replace 'cmake_minimum_required\(.*\)', 'cmake_minimum_required(VERSION 3.5)' | Set-Content CMakeLists.txt

    - name: Build
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=Release -G "Visual Studio 17 2022" -A x64
        cmake --build . --config Release --target bff-command-line --parallel

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: bff-windows
        path: build/Release/bff-command-line.exe
