name: Build BFF for Windows

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout BFF repository
      uses: actions/checkout@v4
      with:
        repository: royeiror/boundary-first-flattening
        
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2
      
    - name: Install CMake
      uses: jwlawson/actions-setup-cmake@v1
      with:
        cmake-version: '3.28.x'
        
    - name: Clean workspace
      shell: cmd
      run: |
        if exist deps rd /s /q deps
        if exist suitesparse rd /s /q suitesparse
        if exist build rd /s /q build
        
    - name: Download pre-built OpenBLAS
      shell: powershell
      run: |
        Write-Host "Downloading pre-built OpenBLAS..."
        mkdir -Force deps | Out-Null
        cd deps
        
        # Download pre-built OpenBLAS for Windows (x64)
        $openblasUrl = "https://github.com/xianyi/OpenBLAS/releases/download/v0.3.26/OpenBLAS-0.3.26-x64.zip"
        $openblasZip = "openblas.zip"
        
        Invoke-WebRequest -Uri $openblasUrl -OutFile $openblasZip
        Expand-Archive -Path $openblasZip -DestinationPath "openblas-windows"
        Remove-Item $openblasZip
        
        Write-Host "OpenBLAS downloaded and extracted!"
        
    - name: Download pre-built SuiteSparse
      shell: powershell
      run: |
        Write-Host "Setting up SuiteSparse..."
        mkdir -Force suitesparse | Out-Null
        cd suitesparse
        
        # Try to find or build a minimal SuiteSparse setup
        # We'll build just CHOLMOD and required dependencies
        
        # Download SuiteSparse source
        Write-Host "Downloading SuiteSparse source..."
        Invoke-WebRequest -Uri "https://github.com/DrTimothyAldenDavis/SuiteSparse/archive/refs/tags/v7.6.1.tar.gz" -OutFile "SuiteSparse.tar.gz"
        tar -xzf SuiteSparse.tar.gz --strip-components=1 -C . 2>$null
        Remove-Item SuiteSparse.tar.gz
        
        # We'll build a minimal subset: AMD, COLAMD, CHOLMOD
        Write-Host "Building minimal SuiteSparse components..."
        
        # Build AMD
        cd AMD
        mkdir -Force build | Out-Null
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
        cmake --build . --config Release
        cd ../..
        
        # Build COLAMD
        cd COLAMD
        mkdir -Force build | Out-Null
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
        cmake --build . --config Release
        cd ../..
        
        # Build CHOLMOD
        cd CHOLMOD
        mkdir -Force build | Out-Null
        cd build
        
        $openblasLib = "$env:GITHUB_WORKSPACE\deps\openblas-windows\lib\openblas.lib"
        $openblasInclude = "$env:GITHUB_WORKSPACE\deps\openblas-windows\include"
        
        cmake .. -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_BUILD_TYPE=Release `
          -DBUILD_SHARED_LIBS=OFF `
          -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE\suitesparse\install" `
          -DNSUPERNODAL=OFF `  # Disable supernodal to simplify
          -DNMODIFY=OFF `      # Disable modification routines
          -DNMATRIXOPS=OFF `   # Disable matrix operations
          -DNPARTITION=OFF `   # Disable partition (no METIS)
          -DCMAKE_PREFIX_PATH="$env:GITHUB_WORKSPACE\suitesparse\AMD\build;$env:GITHUB_WORKSPACE\suitesparse\COLAMD\build" `
          -DBLAS_LIBRARIES="$openblasLib" `
          -DLAPACK_LIBRARIES="$openblasLib" `
          -DBLAS_INCLUDE_DIR="$openblasInclude"
        
        cmake --build . --config Release
        
        # Create install directory
        mkdir -Force "$env:GITHUB_WORKSPACE\suitesparse\install\lib" | Out-Null
        mkdir -Force "$env:GITHUB_WORKSPACE\suitesparse\install\include" | Out-Null
        
        # Copy libraries
        Copy-Item "Release\*.lib" -Destination "$env:GITHUB_WORKSPACE\suitesparse\install\lib\" -Force
        Copy-Item "..\Include\*.h" -Destination "$env:GITHUB_WORKSPACE\suitesparse\install\include\" -Force
        Copy-Item "$env:GITHUB_WORKSPACE\suitesparse\AMD\build\Release\*.lib" -Destination "$env:GITHUB_WORKSPACE\suitesparse\install\lib\" -Force
        Copy-Item "$env:GITHUB_WORKSPACE\suitesparse\AMD\Include\*.h" -Destination "$env:GITHUB_WORKSPACE\suitesparse\install\include\" -Force
        Copy-Item "$env:GITHUB_WORKSPACE\suitesparse\COLAMD\build\Release\*.lib" -Destination "$env:GITHUB_WORKSPACE\suitesparse\install\lib\" -Force
        Copy-Item "$env:GITHUB_WORKSPACE\suitesparse\COLAMD\Include\*.h" -Destination "$env:GITHUB_WORKSPACE\suitesparse\install\include\" -Force
        
        Write-Host "Minimal SuiteSparse built successfully!"
        
    - name: Configure BFF
      shell: cmd
      run: |
        echo "Configuring BFF..."
        if exist build rd /s /q build
        mkdir build
        cd build
        
        set SUITESPARSE_DIR=%GITHUB_WORKSPACE%\suitesparse\install
        set OPENBLAS_DIR=%GITHUB_WORKSPACE%\deps\openblas-windows
        
        echo "SuiteSparse dir: %SUITESPARSE_DIR%"
        echo "OpenBLAS dir: %OPENBLAS_DIR%"
        
        # List available libraries
        echo "Available libraries in SuiteSparse:"
        dir "%SUITESPARSE_DIR%\lib\*.lib"
        
        echo "Available includes in SuiteSparse:"
        dir "%SUITESPARSE_DIR%\include\*.h"
        
        # Try a simpler CMake configuration
        cmake .. -G "Visual Studio 17 2022" -A x64 ^
          -DCMAKE_BUILD_TYPE=%BUILD_TYPE% ^
          -DSUITESPARSE_INCLUDE_DIR="%SUITESPARSE_DIR%\include" ^
          -DSUITESPARSE_LIBRARY_DIR="%SUITESPARSE_DIR%\lib" ^
          -DBLAS_LIBRARIES="%OPENBLAS_DIR%\lib\openblas.lib" ^
          -DLAPACK_LIBRARIES="%OPENBLAS_DIR%\lib\openblas.lib"
        
    - name: Build BFF
      shell: cmd
      run: |
        echo "Building BFF..."
        cd build
        cmake --build . --config Release --target bff-command-line
        
    - name: Copy OpenBLAS DLL
      shell: cmd
      run: |
        echo "Copying dependencies..."
        copy deps\openblas-windows\bin\*.dll build\Release\
        
    - name: Test executable
      shell: cmd
      run: |
        echo "Testing executable..."
        cd build\Release
        if exist bff-command-line.exe (
          echo "Executable found!"
          bff-command-line.exe --version || bff-command-line.exe --help || echo "Executable ran successfully"
        ) else (
          echo "ERROR: Executable not found!"
          dir
          exit 1
        )
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bff-windows-binaries
        path: |
          build/Release/*.exe
          build/Release/*.dll
        retention-days: 7
