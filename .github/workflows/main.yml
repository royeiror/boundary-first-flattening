name: Build BFF for Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [created]
  workflow_dispatch:

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-windows

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install Chocolatey packages
      shell: powershell
      run: |
        # Install Chocolatey if not present
        Set-ExecutionPolicy Bypass -Scope Process -Force
        [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
        iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
        
        # Install build tools
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
        choco install ninja -y
        choco install git -y

    - name: Install vcpkg and dependencies
      shell: powershell
      run: |
        # Install vcpkg
        git clone https://github.com/Microsoft/vcpkg.git $env:VCPKG_ROOT
        & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"
        
        # Install required dependencies
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET eigen3
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET libigl
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET suitesparse
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET metis
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glfw3
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glew
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET libpng
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET zlib
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET freeglut
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glm

    - name: Download and install SuiteSparse-METIS
      shell: powershell
      run: |
        # Download SuiteSparse-METIS
        $url = "https://github.com/jlblancoc/suitesparse-metis-for-windows/releases/download/v1.4.0/SuiteSparse-4.5.1-METIS-5.1.0.zip"
        $output = "C:\SuiteSparse.zip"
        
        Invoke-WebRequest -Uri $url -OutFile $output
        
        # Extract
        Expand-Archive -Path $output -DestinationPath "C:\SuiteSparse\" -Force
        
        # Set environment variables
        echo "SUITESPARSE_ROOT=C:\SuiteSparse" | Out-File -FilePath $env:GITHUB_ENV -Append
        echo "SUITESPARSE_INCLUDE_DIR=C:\SuiteSparse\include" | Out-File -FilePath $env:GITHUB_ENV -Append
        echo "SUITESPARSE_LIB_DIR=C:\SuiteSparse\lib" | Out-File -FilePath $env:GITHUB_ENV -Append
        
        # Add to PATH
        echo "C:\SuiteSparse\lib" | Out-File -FilePath $env:GITHUB_PATH -Append
        echo "C:\SuiteSparse\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

    - name: Clone BFF repository
      shell: powershell
      run: |
        # Clone the BFF repository if not already cloned
        if (-not (Test-Path "bff-source")) {
          git clone https://github.com/GeometryCollective/boundary-first-flattening.git bff-source
          cd bff-source
          git checkout v1.6
          cd ..
        }
        
        # Copy to workspace
        Copy-Item -Path "bff-source\*" -Destination "." -Recurse -Force

    - name: Create CMakeLists.txt for BFF
      shell: powershell
      run: |
        # Create a simple CMakeLists.txt for BFF
        $cmakeContent = @'
cmake_minimum_required(VERSION 3.15)
project(BFF)

set(CMAKE_CXX_STANDARD 17)
set(CMAKE_CXX_STANDARD_REQUIRED ON)

# Find dependencies
find_package(Eigen3 REQUIRED)
find_package(SuiteSparse REQUIRED COMPONENTS CHOLMOD AMD CAMD COLAMD CCOLAMD)
find_package(METIS REQUIRED)
find_package(OpenGL REQUIRED)
find_package(GLFW3 REQUIRED)
find_package(GLEW REQUIRED)

# Add source files
file(GLOB_RECURSE BFF_SOURCES "lib/*.cpp" "gui/*.cpp")
file(GLOB_RECURSE BFF_HEADERS "lib/*.h" "gui/*.h")

# Add executable
add_executable(bff-gui ${BFF_SOURCES} ${BFF_HEADERS})

# Include directories
target_include_directories(bff-gui PRIVATE
    ${EIGEN3_INCLUDE_DIRS}
    ${SUITESPARSE_INCLUDE_DIRS}
    ${OPENGL_INCLUDE_DIRS}
    ${GLFW3_INCLUDE_DIRS}
    ${GLEW_INCLUDE_DIRS}
    "lib"
    "gui"
)

# Link libraries
target_link_libraries(bff-gui
    ${SUITESPARSE_LIBRARIES}
    ${METIS_LIBRARIES}
    ${OPENGL_LIBRARIES}
    ${GLFW3_LIBRARIES}
    ${GLEW_LIBRARIES}
)
'@
        
        $cmakeContent | Out-File -FilePath "CMakeLists.txt" -Encoding UTF8

    - name: Configure CMake
      shell: powershell
      run: |
        # Create build directory
        New-Item -ItemType Directory -Force -Path "build"
        
        # Configure with CMake
        cmake -B build `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=$env:VCPKG_DEFAULT_TRIPLET `
          -DSUITESPARSE_ROOT="C:\SuiteSparse" `
          -DCMAKE_PREFIX_PATH="C:\SuiteSparse" `
          -G "Visual Studio 17 2022" `
          -A x64

    - name: Build BFF
      shell: powershell
      run: |
        # Build the project
        cmake --build build --config Release --target ALL_BUILD --parallel 4

    - name: Find and copy executables
      shell: powershell
      run: |
        # Create distribution directory
        New-Item -ItemType Directory -Force -Path "dist"
        
        # Find all executables
        $exes = Get-ChildItem -Path "build" -Filter "*.exe" -Recurse | Where-Object { $_.Directory.Name -eq "Release" }
        
        foreach ($exe in $exes) {
          Write-Host "Found executable: $($exe.FullName)"
          Copy-Item -Path $exe.FullName -Destination "dist\" -Force
        }
        
        # Copy required DLLs from vcpkg
        $vcpkgBinPath = "$env:VCPKG_ROOT\installed\$env:VCPKG_DEFAULT_TRIPLET\bin"
        if (Test-Path $vcpkgBinPath) {
          Copy-Item -Path "$vcpkgBinPath\*.dll" -Destination "dist\" -Force
        }
        
        # Copy DLLs from SuiteSparse
        $suiteSparseBinPath = "C:\SuiteSparse\bin"
        if (Test-Path $suiteSparseBinPath) {
          Copy-Item -Path "$suiteSparseBinPath\*.dll" -Destination "dist\" -Force
        }

    - name: Create README
      shell: powershell
      run: |
        # Create simple README
        $date = Get-Date -Format 'yyyy-MM-dd'
        $readmeText = "Boundary First Flattening (BFF) for Windows`r`n"
        $readmeText += "===========================================`r`n`r`n"
        $readmeText += "Build Date: $date`r`n"
        $readmeText += "Version: v1.6`r`n`r`n"
        $readmeText += "To run: Execute bff-gui.exe`r`n"
        
        $readmeText | Out-File -FilePath "dist\README.txt" -Encoding UTF8

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BFF-Windows-Binaries
        path: dist/

    - name: Create release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/*.exe
          dist/README.txt
        generate_release_notes: true
