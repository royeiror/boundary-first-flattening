name: Build BFF Windows Binary (2021-era)

on: 
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2019  # Use older Windows version
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install 2021-era CMake
      run: |
        # Install CMake 3.20 which was current in 2021
        choco install cmake --version=3.20.0 -y

    - name: Clone older SuiteSparse version
      run: |
        # Clone SuiteSparse and checkout a 2020-2021 compatible version
        git clone https://github.com/jlblancoc/suitesparse-metis-for-windows.git SuiteSparseWin
        cd SuiteSparseWin
        
        # Try to find a 2020-2021 compatible commit
        git checkout 80ed52cc1bfa7e9e1c8b52d3cb29d1980f4c5b3a  # A 2020 commit
        
        echo "=== Building SuiteSparse with VS2019 ==="
        mkdir build
        cd build
        
        # Build with Visual Studio 2019 (current in 2021)
        cmake .. -DCMAKE_INSTALL_PREFIX="$pwd/install" -DCMAKE_BUILD_TYPE=Release -G "Visual Studio 16 2019" -A x64
        cmake --build . --config Release --target install --parallel

    - name: Fix CMakeLists.txt for compatibility
      run: |
        # Fix the minimum CMake version in all CMakeLists files
        (Get-Content CMakeLists.txt) -replace 'cmake_minimum_required\(.*\)', 'cmake_minimum_required(VERSION 3.5)' | Set-Content CMakeLists.txt
        
        # Fix nanogui CMakeLists
        if (Test-Path "deps/nanogui/CMakeLists.txt") {
            (Get-Content "deps/nanogui/CMakeLists.txt") -replace 'cmake_minimum_required\(.*\)', 'cmake_minimum_required(VERSION 3.5)' | Set-Content "deps/nanogui/CMakeLists.txt"
        }

    - name: Configure BFF with 2021-era settings
      run: |
        $SuiteSparseDir = "$pwd/SuiteSparseWin/build/install"
        $OpenBLASDir = "$pwd/deps/openblas-windows"
        
        echo "SuiteSparse directory: $SuiteSparseDir"
        echo "OpenBLAS directory: $OpenBLASDir"
        
        mkdir build
        cd build
        
        # Configure with VS2019 and policy overrides for old CMake
        cmake .. `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 `
          -DSuiteSparse_DIR="$SuiteSparseDir/lib" `
          -DSuiteSparse_CHOLMOD_DIR="$SuiteSparseDir/lib" `
          -DSuiteSparse_CHOLMOD_INCLUDE_DIR="$SuiteSparseDir/include/suitesparse" `
          -DSuiteSparse_CHOLMOD_LIBRARY_RELEASE="$SuiteSparseDir/lib/libcholmod.lib" `
          -DSuiteSparse_AMD_LIBRARY_RELEASE="$SuiteSparseDir/lib/libamd.lib" `
          -DSuiteSparse_CAMD_LIBRARY_RELEASE="$SuiteSparseDir/lib/libcamd.lib" `
          -DSuiteSparse_CCOLAMD_LIBRARY_RELEASE="$SuiteSparseDir/lib/libccolamd.lib" `
          -DSuiteSparse_COLAMD_LIBRARY_RELEASE="$SuiteSparseDir/lib/libcolamd.lib" `
          -DSuiteSparse_BTF_LIBRARY_RELEASE="$SuiteSparseDir/lib/libbtf.lib" `
          -DSuiteSparse_KLU_LIBRARY_RELEASE="$SuiteSparseDir/lib/libklu.lib" `
          -DSuiteSparse_UMFPACK_LIBRARY_RELEASE="$SuiteSparseDir/lib/libumfpack.lib" `
          -DSuiteSparse_CXSPARSE_LIBRARY_RELEASE="$SuiteSparseDir/lib/libcxsparse.lib" `
          -DSuiteSparse_SUITESPARSECONFIG_LIBRARY_RELEASE="$SuiteSparseDir/lib/libsuitesparseconfig.lib" `
          -DSuiteSparse_BLAS_LIBRARY="$OpenBLASDir/lib/libopenblas.lib" `
          -DSuiteSparse_LAPACK_LIBRARY="$OpenBLASDir/lib/libopenblas.lib" `
          -G "Visual Studio 16 2019" -A x64

    - name: Build BFF command line tool
      run: |
        cd build
        cmake --build . --config Release --target bff-command-line --parallel

    - name: Package binaries
      run: |
        mkdir dist
        Copy-Item "build/Release/bff-command-line.exe" "dist/" -ErrorAction SilentlyContinue
        Copy-Item "build/Release/*.dll" "dist/" -ErrorAction SilentlyContinue
        dir dist

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bff-windows-2021-era
        path: dist/*
        retention-days: 30
