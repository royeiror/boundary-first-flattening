name: Build BFF Viewer

on: workflow_dispatch

jobs:
  build-viewer:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Install vcpkg with SuiteSparse
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg install suitesparse:x64-windows
        .\vcpkg\vcpkg install lapack-reference:x64-windows
        
    - name: Check what vcpkg installed
      run: |
        $vcpkgPath = "$env:GITHUB_WORKSPACE/vcpkg/installed/x64-windows"
        echo "VCPKG Path: $vcpkgPath"
        
        echo "Looking for cholmod.h..."
        Get-ChildItem "$vcpkgPath" -Filter "cholmod.h" -Recurse
        
    - name: Copy headers to expected location
      run: |
        $vcpkgPath = "$env:GITHUB_WORKSPACE/vcpkg/installed/x64-windows"
        
        # Find cholmod.h
        $cholmodFile = Get-ChildItem "$vcpkgPath" -Filter "cholmod.h" -Recurse | Select-Object -First 1
        
        if ($cholmodFile) {
            echo "Found cholmod.h at: $($cholmodFile.FullName)"
            
            # Copy it to include directory
            $targetDir = "$env:GITHUB_WORKSPACE/include"
            New-Item -ItemType Directory -Path $targetDir -Force
            
            # Copy cholmod.h
            Copy-Item $cholmodFile.FullName "$targetDir/cholmod.h" -Force
            echo "Copied cholmod.h to: $targetDir/cholmod.h"
            
            # Copy all SuiteSparse headers from the same directory
            $suiteDir = $cholmodFile.Directory.FullName
            Get-ChildItem $suiteDir -Filter "*.h" | ForEach-Object {
                Copy-Item $_.FullName "$targetDir/$($_.Name)" -Force
                echo "Copied header: $($_.Name)"
            }
        } else {
            echo "ERROR: cholmod.h not found!"
            # List what's in vcpkg/include
            echo "Contents of vcpkg/include:"
            Get-ChildItem "$vcpkgPath/include" -Recurse -Filter "*.h" | Select-Object -First 20
        }
        
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1
      
    - name: Configure CMake
      run: |
        cmake -B build `
          -DBFF_BUILD_GUI=ON `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake"
        
    - name: Build
      run: |
        cmake --build build --config Release
        
    - name: Check results
      run: |
        Get-ChildItem -Path build -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue
