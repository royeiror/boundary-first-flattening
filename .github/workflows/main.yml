    - name: Build and Install SuiteSparse Libraries
      shell: powershell
      run: |
        cd "$env:GITHUB_WORKSPACE\SuiteSparseBuild\build"
        
        # CRITICAL FIX: Build the 'INSTALL' project for BOTH Release and Debug.
        # This ensures all necessary files (like SuiteSparseConfig.cmake) are generated.
        Write-Host "Building INSTALL project for Release..."
        msbuild INSTALL.vcxproj /p:Configuration=Release /p:Platform=x64 /m /v:minimal
        
        Write-Host "Building INSTALL project for Debug..."
        msbuild INSTALL.vcxproj /p:Configuration=Debug /p:Platform=x64 /m /v:minimal

        # The 'install' directory path might have changed. Let's find it.
        # The CMake variable CMAKE_INSTALL_PREFIX is set to "$env:GITHUB_WORKSPACE\SuiteSparseInstall"
        $InstallPath = "$env:GITHUB_WORKSPACE\SuiteSparseInstall"
        
        Write-Host "Verifying installation in: $InstallPath"
        # Look for the critical CMake config file. It may be in a subdirectory.
        $ConfigFile = Get-ChildItem -Path $InstallPath -Recurse -Filter "SuiteSparseConfig.cmake" -ErrorAction SilentlyContinue | Select-Object -First 1
        
        if ($ConfigFile) {
            Write-Host "SUCCESS: Found SuiteSparseConfig.cmake at $($ConfigFile.FullName)"
            Write-Host "Full install directory listing:"
            Get-ChildItem -Path $InstallPath -Recurse | Where-Object { $_.Extension -match '\.(cmake|lib|h)$' } | Select-Object -First 20
        } else {
            # If not found in the expected place, the CMake install prefix might be different.
            # Check the default build/install directory as a fallback.
            $FallbackPath = "$env:GITHUB_WORKSPACE\SuiteSparseBuild\build\install"
            Write-Host "Checking fallback path: $FallbackPath"
            $ConfigFile = Get-ChildItem -Path $FallbackPath -Recurse -Filter "SuiteSparseConfig.cmake" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($ConfigFile) {
                Write-Host "SUCCESS: Found SuiteSparseConfig.cmake at $($ConfigFile.FullName)"
                # Update the environment variable for the next phase
                $env:SUITESPARSE_INSTALL_DIR = $FallbackPath
                echo "SUITESPARSE_INSTALL_DIR=$FallbackPath" >> $env:GITHUB_ENV
            } else {
                Write-Error "FATAL: SuiteSparseConfig.cmake was not generated in expected or fallback locations. Build failed."
                # List directories for debugging
                Write-Host "Contents of build directory:"
                Get-ChildItem -Path "$env:GITHUB_WORKSPACE\SuiteSparseBuild\build" -Recurse -Directory | Select-Object FullName
                exit 1
            }
        }
