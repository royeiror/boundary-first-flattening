name: Build BFF for Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [created]
  workflow_dispatch:

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-windows

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install vcpkg and dependencies
      shell: powershell
      run: |
        # Install vcpkg
        git clone https://github.com/Microsoft/vcpkg.git $env:VCPKG_ROOT
        & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"
        
        # Install required dependencies
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET eigen3
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET libigl
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET suitesparse
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET metis
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glfw3
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glew
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET freeglut
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glm

    - name: Clone BFF source
      shell: powershell
      run: |
        Write-Host "Cloning BFF v1.6..."
        git clone --recursive --branch v1.6 https://github.com/GeometryCollective/boundary-first-flattening.git bff-source
        
        # Copy to current directory
        Copy-Item -Path "bff-source\*" -Destination "." -Recurse -Force
        
        Write-Host "BFF files copied to current directory"

    - name: Check what vcpkg installed for SuiteSparse
      shell: powershell
      run: |
        Write-Host "Checking vcpkg SuiteSparse installation..."
        $vcpkgInstalled = "$env:VCPKG_ROOT\installed\$env:VCPKG_DEFAULT_TRIPLET"
        
        Write-Host "Include files found:"
        Get-ChildItem -Path "$vcpkgInstalled\include" -Filter "*cholmod*" -Recurse | Select-Object -First 5
        
        Write-Host "`nLibrary files found:"
        Get-ChildItem -Path "$vcpkgInstalled\lib" -Filter "*cholmod*" -Recurse | Select-Object -First 5
        
        Write-Host "`nAll .h files in include:"
        Get-ChildItem -Path "$vcpkgInstalled\include" -Filter "*.h" | Select-Object -First 10

    - name: Modify CMakeLists.txt to use vcpkg SuiteSparse
      shell: powershell
      run: |
        # Create a simple CMakeLists.txt that works with vcpkg
        $lines = @()
        
        $lines += "cmake_minimum_required(VERSION 3.15)"
        $lines += "project(BFF)"
        $lines += ""
        $lines += "set(CMAKE_CXX_STANDARD 17)"
        $lines += "set(CMAKE_CXX_STANDARD_REQUIRED ON)"
        $lines += ""
        $lines += "# Get vcpkg paths"
        $lines += 'set(VCPKG_INSTALLED_DIR "$ENV{VCPKG_ROOT}/installed/$ENV{VCPKG_DEFAULT_TRIPLET}")'
        $lines += ""
        $lines += "# Find packages"
        $lines += "find_package(Eigen3 REQUIRED)"
        $lines += "find_package(OpenGL REQUIRED)"
        $lines += "find_package(glfw3 REQUIRED)"
        $lines += "find_package(GLEW REQUIRED)"
        $lines += ""
        $lines += "# Manually set SuiteSparse paths from vcpkg"
        $lines += 'set(SuiteSparse_DIR "${VCPKG_INSTALLED_DIR}")'
        $lines += 'set(SuiteSparse_INCLUDE_DIR "${VCPKG_INSTALLED_DIR}/include")'
        $lines += 'set(SuiteSparse_LIBRARY_DIR "${VCPKG_INSTALLED_DIR}/lib")'
        $lines += ""
        $lines += "# Manually find SuiteSparse libraries"
        $lines += 'file(GLOB CHOLMOD_LIBS "${SuiteSparse_LIBRARY_DIR}/*cholmod*.lib")'
        $lines += 'file(GLOB AMD_LIBS "${SuiteSparse_LIBRARY_DIR}/*amd*.lib")'
        $lines += 'file(GLOB CAMD_LIBS "${SuiteSparse_LIBRARY_DIR}/*camd*.lib")'
        $lines += 'file(GLOB COLAMD_LIBS "${SuiteSparse_LIBRARY_DIR}/*colamd*.lib")'
        $lines += 'file(GLOB CCOLAMD_LIBS "${SuiteSparse_LIBRARY_DIR}/*ccolamd*.lib")'
        $lines += 'file(GLOB METIS_LIBS "${SuiteSparse_LIBRARY_DIR}/*metis*.lib")'
        $lines += ""
        $lines += "if(CHOLMOD_LIBS)"
        $lines += "    list(GET CHOLMOD_LIBS 0 SuiteSparse_CHOLMOD_LIBRARY)"
        $lines += '    message(STATUS "Found CHOLMOD: ${SuiteSparse_CHOLMOD_LIBRARY}")'
        $lines += "    set(SuiteSparse_CHOLMOD_FOUND ON)"
        $lines += "else()"
        $lines += '    message(FATAL_ERROR "CHOLMOD library not found")'
        $lines += "endif()"
        $lines += ""
        $lines += "if(AMD_LIBS)"
        $lines += "    list(GET AMD_LIBS 0 SuiteSparse_AMD_LIBRARY)"
        $lines += "    set(SuiteSparse_AMD_FOUND ON)"
        $lines += "endif()"
        $lines += ""
        $lines += "if(CAMD_LIBS)"
        $lines += "    list(GET CAMD_LIBS 0 SuiteSparse_CAMD_LIBRARY)"
        $lines += "    set(SuiteSparse_CAMD_FOUND ON)"
        $lines += "endif()"
        $lines += ""
        $lines += "if(COLAMD_LIBS)"
        $lines += "    list(GET COLAMD_LIBS 0 SuiteSparse_COLAMD_LIBRARY)"
        $lines += "    set(SuiteSparse_COLAMD_FOUND ON)"
        $lines += "endif()"
        $lines += ""
        $lines += "if(CCOLAMD_LIBS)"
        $lines += "    list(GET CCOLAMD_LIBS 0 SuiteSparse_CCOLAMD_LIBRARY)"
        $lines += "    set(SuiteSparse_CCOLAMD_FOUND ON)"
        $lines += "endif()"
        $lines += ""
        $lines += "if(METIS_LIBS)"
        $lines += "    list(GET METIS_LIBS 0 SuiteSparse_METIS_LIBRARY)"
        $lines += "    set(SuiteSparse_METIS_FOUND ON)"
        $lines += "endif()"
        $lines += ""
        $lines += "set(SuiteSparse_FOUND ON)"
        $lines += ""
        $lines += "# Include directories"
        $lines += "include_directories("
        $lines += "    ${CMAKE_SOURCE_DIR}/include"
        $lines += "    ${CMAKE_SOURCE_DIR}/deps/libigl/include"
        $lines += "    ${CMAKE_SOURCE_DIR}/deps/spectra/include"
        $lines += "    ${Eigen3_INCLUDE_DIRS}"
        $lines += "    ${SuiteSparse_INCLUDE_DIR}"
        $lines += "    ${VCPKG_INSTALLED_DIR}/include"
        $lines += ")"
        $lines += ""
        $lines += "# Find source files"
        $lines += 'file(GLOB_RECURSE SRC_FILES "lib/*.cpp")'
        $lines += 'file(GLOB_RECURSE SRC_HEADERS "lib/*.h")'
        $lines += ""
        $lines += "if(NOT SRC_FILES)"
        $lines += '    message(FATAL_ERROR "No source files found")'
        $lines += "endif()"
        $lines += ""
        $lines += "# Create library"
        $lines += "add_library(bff-lib STATIC ${SRC_FILES})"
        $lines += ""
        $lines += "# Link libraries"
        $lines += "target_link_libraries(bff-lib"
        $lines += "    ${SuiteSparse_CHOLMOD_LIBRARY}"
        $lines += "    ${SuiteSparse_AMD_LIBRARY}"
        $lines += "    ${SuiteSparse_CAMD_LIBRARY}"
        $lines += "    ${SuiteSparse_COLAMD_LIBRARY}"
        $lines += "    ${SuiteSparse_CCOLAMD_LIBRARY}"
        $lines += "    ${SuiteSparse_METIS_LIBRARY}"
        $lines += ")"
        $lines += ""
        $lines += "# GUI executable"
        $lines += 'file(GLOB_RECURSE GUI_FILES "apps/*.cpp")'
        $lines += "if(GUI_FILES)"
        $lines += "    add_executable(bff-gui ${GUI_FILES})"
        $lines += "    target_link_libraries(bff-gui bff-lib"
        $lines += "        ${OPENGL_LIBRARIES}"
        $lines += "        ${GLFW3_LIBRARY}"
        $lines += "        ${GLEW_LIBRARIES}"
        $lines += "    )"
        $lines += "    target_include_directories(bff-gui PRIVATE ${CMAKE_SOURCE_DIR}/apps)"
        $lines += '    message(STATUS "Building GUI application")'
        $lines += "endif()"
        
        # Write to file
        $lines | Out-File -FilePath "CMakeLists.txt" -Encoding UTF8
        Write-Host "Created CMakeLists.txt"

    - name: Configure CMake
      shell: powershell
      run: |
        # Create build directory
        New-Item -ItemType Directory -Force -Path "build"
        
        Write-Host "Configuring CMake..."
        
        # Configure with CMake
        cmake -B build `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=$env:VCPKG_DEFAULT_TRIPLET `
          -G "Visual Studio 17 2022" `
          -A x64

    - name: Build BFF
      shell: powershell
      run: |
        Write-Host "Building project..."
        cmake --build build --config Release --parallel 4

    - name: Find and copy executables
      shell: powershell
      run: |
        # Create distribution directory
        New-Item -ItemType Directory -Force -Path "dist"
        
        Write-Host "Searching for executables..."
        
        # Search for executables
        $exes = Get-ChildItem -Path "build" -Filter "*.exe" -Recurse
        foreach ($exe in $exes) {
          Write-Host "Found executable: $($exe.FullName)"
          Copy-Item -Path $exe.FullName -Destination "dist\" -Force
        }
        
        # Copy DLLs
        $vcpkgBinPath = "$env:VCPKG_ROOT\installed\$env:VCPKG_DEFAULT_TRIPLET\bin"
        if (Test-Path $vcpkgBinPath) {
          Write-Host "Copying DLLs from vcpkg..."
          Get-ChildItem -Path $vcpkgBinPath -Filter "*.dll" | Copy-Item -Destination "dist\" -Force
        }
        
        # List what we have
        Write-Host "`nFiles in dist directory:"
        Get-ChildItem -Path "dist"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BFF-Windows-Binaries
        path: dist/

    - name: Create release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/**
        generate_release_notes: true
