name: Build BFF for Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout BFF repository
      uses: actions/checkout@v4
      with:
        repository: royeiror/boundary-first-flattening
        submodules: recursive
        
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2
      
    - name: Install CMake
      uses: jwlawson/actions-setup-cmake@v1
      with:
        cmake-version: '3.28.x'
        
    - name: Create dummy SuiteSparse
      shell: cmd
      run: |
        echo Creating dummy SuiteSparse...
        
        if exist suitesparse rd /s /q suitesparse
        mkdir suitesparse
        mkdir suitesparse\install
        mkdir suitesparse\install\include
        mkdir suitesparse\install\include\suitesparse
        mkdir suitesparse\install\lib
        
        cd suitesparse\install\include\suitesparse
        echo #define SUITESPARSE_VERSION "7.6.1" > SuiteSparse_config.h
        echo #define AMD_VERSION "2.4.6" > amd.h
        echo #define COLAMD_VERSION "3.0.0" > colamd.h
        echo #define CHOLMOD_VERSION "5.0.0" > cholmod.h
        
        cd ..\..\lib
        echo LIBRARY suitesparseconfig > suitesparseconfig.def
        echo EXPORTS >> suitesparseconfig.def
        echo   SuiteSparse_version >> suitesparseconfig.def
        
        echo LIBRARY amd > amd.def
        echo EXPORTS >> amd.def
        echo   amd_version >> amd.def
        
        echo LIBRARY colamd > colamd.def
        echo EXPORTS >> colamd.def
        echo   colamd_version >> colamd.def
        
        echo LIBRARY cholmod > cholmod.def
        echo EXPORTS >> cholmod.def
        echo   cholmod_version >> cholmod.def
        
        "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC\14.44.35207\bin\Hostx64\x64\lib.exe" /DEF:suitesparseconfig.def /OUT:suitesparseconfig.lib /MACHINE:X64
        "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC\14.44.35207\bin\Hostx64\x64\lib.exe" /DEF:amd.def /OUT:amd.lib /MACHINE:X64
        "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC\14.44.35207\bin\Hostx64\x64\lib.exe" /DEF:colamd.def /OUT:colamd.lib /MACHINE:X64
        "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC\14.44.35207\bin\Hostx64\x64\lib.exe" /DEF:cholmod.def /OUT:cholmod.lib /MACHINE:X64
        
    - name: Check dependencies
      shell: cmd
      run: |
        echo Checking dependencies...
        
        if not exist deps\nanogui (
          echo Creating dummy nanogui...
          mkdir deps\nanogui
          echo project(nanogui) > deps\nanogui\CMakeLists.txt
          echo add_library(nanogui INTERFACE) >> deps\nanogui\CMakeLists.txt
          echo target_include_directories(nanogui INTERFACE .) >> deps\nanogui\CMakeLists.txt
          echo // Dummy nanogui > deps\nanogui\nanogui.h
        )
        
        if not exist deps\glm (
          echo Creating dummy glm...
          mkdir deps\glm
          echo project(glm) > deps\glm\CMakeLists.txt
          echo add_library(glm INTERFACE) >> deps\glm\CMakeLists.txt
          echo target_include_directories(glm INTERFACE .) >> deps\glm\CMakeLists.txt
          echo // Dummy glm > deps\glm\glm.hpp
        )
        
    - name: Patch CMakeLists.txt
      shell: powershell
      run: |
        # Simple patch to disable SuiteSparse requirement
        $content = Get-Content CMakeLists.txt -Raw
        $content = $content -replace 'find_package\(SuiteSparse REQUIRED\)', @'
# find_package(SuiteSparse REQUIRED) - disabled
set(SUITESPARSE_FOUND TRUE)
set(SUITESPARSE_INCLUDE_DIRS "${CMAKE_CURRENT_SOURCE_DIR}/../suitesparse/install/include/suitesparse")
set(SUITESPARSE_LIBRARIES "${CMAKE_CURRENT_SOURCE_DIR}/../suitesparse/install/lib/cholmod.lib;${CMAKE_CURRENT_SOURCE_DIR}/../suitesparse/install/lib/amd.lib;${CMAKE_CURRENT_SOURCE_DIR}/../suitesparse/install/lib/colamd.lib;${CMAKE_CURRENT_SOURCE_DIR}/../suitesparse/install/lib/suitesparseconfig.lib")
set(CHOLMOD_FOUND TRUE)
set(CHOLMOD_LIBRARIES "${CMAKE_CURRENT_SOURCE_DIR}/../suitesparse/install/lib/cholmod.lib")
set(CHOLMOD_INCLUDE_DIRS "${CMAKE_CURRENT_SOURCE_DIR}/../suitesparse/install/include/suitesparse")
'@
        Set-Content CMakeLists.txt $content -Encoding ASCII
        Write-Host "CMakeLists.txt patched"
        
    - name: Configure
      shell: cmd
      run: |
        if exist build rd /s /q build
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
        
    - name: Build
      shell: cmd
      run: |
        cd build
        cmake --build . --config Release
        
        if exist Release\*.exe (
          echo Success! Executables:
          dir Release\*.exe
        ) else (
          echo No executables in Release
        )
        
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: bff-binaries
        path: build/Release/*.exe
