name: Build BFF with Pre-built SuiteSparse

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Download pre-built SuiteSparse
      run: |
        # Try to find or download pre-built SuiteSparse for Windows
        # This is a placeholder - you might need to host pre-built binaries
        echo "Looking for pre-built SuiteSparse..."
        if (Test-Path "deps/suitesparse") {
            echo "Using SuiteSparse from deps folder"
            dir deps/suitesparse -Recurse
        } else {
            echo "No pre-built SuiteSparse found, the build may fail"
            # Create minimal structure to avoid CMake errors
            mkdir deps/suitesparse
            mkdir deps/suitesparse/lib
            mkdir deps/suitesparse/include
        }

    - name: Use repository dependencies
      run: |
        echo "=== Available dependencies ==="
        if (Test-Path "deps") {
            dir deps -Recurse
        }

    - name: Build with local dependencies only
      run: |
        # Fix CMake
        (Get-Content CMakeLists.txt) -replace 'cmake_minimum_required\(.*\)', 'cmake_minimum_required(VERSION 3.5)' | Set-Content CMakeLists.txt
        
        mkdir build
        cd build
        
        # Try to build with whatever dependencies are available
        cmake .. -DCMAKE_BUILD_TYPE=Release -G "Visual Studio 17 2022" -A x64 -Wno-dev
        
        # Build whatever targets are available
        cmake --build . --config Release --parallel

    - name: Find any built executables
      run: |
        echo "=== All built executables ==="
        Get-ChildItem -Path "build" -Recurse -Filter *.exe | ForEach-Object {
            echo "Found: $($_.FullName)"
            # Copy to a common location
            mkdir artifacts -Force
            Copy-Item $_.FullName "artifacts/"
        }

    - name: Upload any results
      uses: actions/upload-artifact@v4
      with:
        name: bff-build-attempt
        path: artifacts/*
        retention-days: 5
