name: Build BFF v1.6 Windows with GUI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout BFF repository with submodules
      uses: actions/checkout@v4
      with:
        repository: GeometryCollective/boundary-first-flattening
        submodules: recursive
        ref: v1.6

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      
    - name: Install CMake
      uses: jwlawson/actions-setup-cmake@v1
      with:
        cmake-version: "3.25.x"

    - name: Install build tools
      shell: pwsh
      run: |
        choco install -y git
        choco install -y ninja

    - name: Build SuiteSparse for Windows
      shell: pwsh
      run: |
        $SuiteSparseRepo = "https://github.com/jlblancoc/suitesparse-metis-for-windows"
        $SuiteSparseDir = "suitesparse-build"
        
        Write-Host "Cloning SuiteSparse for Windows..."
        git clone --depth 1 $SuiteSparseRepo $SuiteSparseDir
        cd $SuiteSparseDir
        
        Write-Host "Configuring SuiteSparse with CMake..."
        $BuildDir = "build"
        $InstallDir = "$pwd\install"
        
        # Create install directory
        New-Item -ItemType Directory -Force -Path $InstallDir
        
        # Configure with specific options for Windows
        cmake -B $BuildDir -S . `
          -DCMAKE_INSTALL_PREFIX="$InstallDir" `
          -DCMAKE_BUILD_TYPE=Release `
          -DBUILD_METIS=ON `
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON `
          -G "Visual Studio 17 2022" `
          -A x64
        
        Write-Host "Building SuiteSparse..."
        cmake --build $BuildDir --config Release --target INSTALL --parallel
        
        Write-Host "SuiteSparse built successfully!"
        Write-Host "Install directory: $InstallDir"
        
        # Verify the installation
        Write-Host "Checking SuiteSparse installation..."
        if (Test-Path "$InstallDir\include") {
            Write-Host "Include directory exists"
            Get-ChildItem -Path "$InstallDir\include" -Filter "*.h" | Select-Object -First 10
        }
        if (Test-Path "$InstallDir\include\suitesparse") {
            Write-Host "suitesparse subdirectory exists"
            Get-ChildItem -Path "$InstallDir\include\suitesparse" -Filter "*.h"
        }

    - name: Patch BFF CMakeLists.txt to include SuiteSparse headers
      shell: pwsh
      run: |
        Write-Host "Patching BFF CMakeLists.txt to include SuiteSparse headers..."
        cd "${{ github.workspace }}"
        
        $SuiteSparseDir = "$pwd\suitesparse-build\install"
        
        # First, let's check what headers are actually available
        Write-Host "Looking for cholmod.h..."
        $cholmodPath = Get-ChildItem -Path $SuiteSparseDir -Filter "cholmod.h" -Recurse | Select-Object -First 1
        if ($cholmodPath) {
            Write-Host "Found cholmod.h at: $($cholmodPath.FullName)"
        } else {
            Write-Host "cholmod.h not found! Looking for any SuiteSparse headers..."
            $allHeaders = Get-ChildItem -Path "$SuiteSparseDir\include" -Filter "*.h" -Recurse
            Write-Host "Found $($allHeaders.Count) header files"
            $allHeaders | Select-Object -First 10
        }
        
        # Patch the CMakeLists.txt to add explicit include directories
        $cmakeContent = Get-Content "CMakeLists.txt" -Raw
        
        # Find the line after SuiteSparse detection and add include directories
        $patch = "`n" + 
                 "# Add SuiteSparse include directory" + "`n" +
                 "include_directories(" + '"' + "$SuiteSparseDir/include" + '"' + ")" + "`n" +
                 "if(EXISTS " + '"' + "$SuiteSparseDir/include/suitesparse" + '"' + ")" + "`n" +
                 "    include_directories(" + '"' + "$SuiteSparseDir/include/suitesparse" + '"' + ")" + "`n" +
                 "endif()" + "`n"
        
        # Insert after SuiteSparse detection
        $newContent = $cmakeContent -replace "(MESSAGE\(STATUS \"SuiteSparse_LIBS: \$\{SuiteSparse_LIBRARIES\}\"\))", "$1`n$patch"
        
        Set-Content -Path "CMakeLists.txt" -Value $newContent -Encoding UTF8
        Write-Host "CMakeLists.txt patched"

    - name: Build BFF with explicit SuiteSparse paths
      shell: pwsh
      run: |
        $SuiteSparseDir = "$pwd\suitesparse-build\install"
        $BFFBuildDir = "bff-build"
        
        Write-Host "Building BFF with explicit SuiteSparse paths..."
        cd "${{ github.workspace }}"
        
        # First check if SuiteSparseConfig.cmake exists
        $ConfigDir = "$SuiteSparseDir\lib\cmake\suitesparse-7.5.1"
        
        Write-Host "Using SuiteSparse from: $SuiteSparseDir"
        Write-Host "Config directory: $ConfigDir"
        
        # Build with multiple approaches to ensure SuiteSparse is found
        cmake -B $BFFBuildDir -S . `
          -DCMAKE_BUILD_TYPE=Release `
          -DBFF_BUILD_GUI=ON `
          -DSuiteSparse_DIR="$ConfigDir" `
          -DCMAKE_PREFIX_PATH="$SuiteSparseDir;$ConfigDir" `
          -DSUITESPARSE_INCLUDE_DIR="$SuiteSparseDir\include" `
          -DSUITESPARSE_LIBRARY_DIR="$SuiteSparseDir\lib" `
          -G "Visual Studio 17 2022" `
          -A x64
        
        Write-Host "Building BFF..."
        cmake --build $BFFBuildDir --config Release --parallel
        
        Write-Host "BFF build completed!"

    - name: Check if BFF library built successfully
      shell: pwsh
      run: |
        $BFFBuildDir = "bff-build"
        Write-Host "Checking build results..."
        
        if (Test-Path "$BFFBuildDir\Release\bff.lib") {
            Write-Host "✓ BFF library built successfully"
        } else {
            Write-Host "✗ BFF library not found"
            Write-Host "Looking for build artifacts..."
            Get-ChildItem -Path $BFFBuildDir -Filter "*.lib" -Recurse
        }
        
        # Check for executables
        $possibleExes = @(
            "$BFFBuildDir\BFF.exe",
            "$BFFBuildDir\Release\BFF.exe",
            "$BFFBuildDir\bff-command.exe",
            "$BFFBuildDir\Release\bff-command.exe"
        )
        
        foreach ($exe in $possibleExes) {
            if (Test-Path $exe) {
                Write-Host "✓ Found executable: $exe"
            }
        }

    - name: Build BFF GUI executable
      shell: pwsh
      if: success() || failure()
      run: |
        Write-Host "Building BFF GUI executable..."
        cd "${{ github.workspace }}"
        
        $SuiteSparseDir = "$pwd\suitesparse-build\install"
        $BFFBuildDir = "bff-gui-build"
        
        # Check if GUI source files exist
        if (Test-Path "src\gui") {
            Write-Host "GUI source directory exists"
            
            # Create a separate build for GUI
            cmake -B $BFFBuildDir -S . `
              -DCMAKE_BUILD_TYPE=Release `
              -DBFF_BUILD_GUI=ON `
              -DBFF_BUILD_CLI=ON `
              -DSUITESPARSE_INCLUDE_DIR="$SuiteSparseDir\include" `
              -DSUITESPARSE_LIBRARY_DIR="$SuiteSparseDir\lib" `
              -G "Visual Studio 17 2022" `
              -A x64
            
            cmake --build $BFFBuildDir --config Release --target BFF --parallel
        } else {
            Write-Host "GUI source directory not found, checking for main executable..."
            # Try to find and build the main target
            $mainBuildDir = "bff-build"
            if (Test-Path $mainBuildDir) {
                cmake --build $mainBuildDir --config Release --target ALL_BUILD --parallel
            }
        }

    - name: Collect and package artifacts
      shell: pwsh
      run: |
        $DistDir = "bff-dist"
        New-Item -ItemType Directory -Force -Path $DistDir
        
        Write-Host "Collecting artifacts..."
        
        # Check multiple build directories
        $BuildDirs = @(
            "bff-build",
            "bff-gui-build"
        )
        
        $foundExecutables = @()
        
        foreach ($buildDir in $BuildDirs) {
            if (Test-Path $buildDir) {
                Write-Host "Checking $buildDir..."
                
                # Look for executables
                $exePatterns = @(
                    "$buildDir\BFF.exe",
                    "$buildDir\Release\BFF.exe",
                    "$buildDir\Debug\BFF.exe",
                    "$buildDir\bff-command.exe",
                    "$buildDir\Release\bff-command.exe",
                    "$buildDir\Debug\bff-command.exe",
                    "$buildDir\src\gui\Release\BFF.exe",
                    "$buildDir\src\gui\Debug\BFF.exe"
                )
                
                foreach ($pattern in $exePatterns) {
                    if (Test-Path $pattern) {
                        $exePath = Resolve-Path $pattern
                        Write-Host "Found executable: $exePath"
                        Copy-Item $exePath -Destination $DistDir
                        $foundExecutables += $exePath
                    }
                }
            }
        }
        
        if ($foundExecutables.Count -eq 0) {
            Write-Host "No executables found. Checking for any built files..."
            Get-ChildItem -Path "bff-build" -Filter "*.exe" -Recurse | ForEach-Object {
                Write-Host "Found: $($_.FullName)"
                Copy-Item $_.FullName -Destination $DistDir
            }
        }
        
        # Copy SuiteSparse DLLs
        $SuiteSparseDir = "$pwd\suitesparse-build\install"
        Write-Host "Copying SuiteSparse DLLs..."
        
        $dllSources = @(
            "$SuiteSparseDir\lib\*.dll",
            "$SuiteSparseDir\bin\*.dll",
            "$SuiteSparseDir\lib\lapack_blas_windows\*.dll"
        )
        
        foreach ($source in $dllSources) {
            if (Test-Path $source) {
                Write-Host "Copying from: $source"
                Copy-Item $source -Destination $DistDir -ErrorAction SilentlyContinue
            }
        }
        
        # Copy NanoGUI DLL if it exists
        $nanoguiDll = Get-ChildItem -Path "bff-build" -Filter "nanogui.dll" -Recurse | Select-Object -First 1
        if ($nanoguiDll) {
            Write-Host "Found NanoGUI DLL: $($nanoguiDll.FullName)"
            Copy-Item $nanoguiDll.FullName -Destination $DistDir
        }
        
        # Copy OpenGL and other required DLLs
        $systemDir = "$env:SystemRoot\System32"
        $runtimeDlls = @(
            "vcruntime140.dll",
            "vcruntime140_1.dll",
            "msvcp140.dll",
            "concrt140.dll",
            "opengl32.dll",
            "glu32.dll"
        )
        
        foreach ($dllName in $runtimeDlls) {
            $dllPath = "$systemDir\$dllName"
            if (Test-Path $dllPath) {
                Copy-Item $dllPath -Destination $DistDir
                Write-Host "Copied runtime DLL: $dllName"
            }
        }
        
        # Create README
        $ReadmeContent = "Boundary First Flattening (BFF) v1.6 Windows Build" + "`n" + 
                         "=============================================" + "`n" + 
                         "Built: $(Get-Date -Format 'yyyy-MM-dd HH:mm')" + "`n" + 
                         "" + "`n" + 
                         "EXECUTABLES:" + "`n"
        
        # List found executables
        if (Test-Path "$DistDir\BFF.exe") {
            $ReadmeContent += "- BFF.exe: GUI application" + "`n"
        }
        if (Test-Path "$DistDir\bff-command.exe") {
            $ReadmeContent += "- bff-command.exe: Command line tool" + "`n"
        }
        
        $ReadmeContent += "" + "`n" + 
                         "INSTRUCTIONS:" + "`n" + 
                         "1. Place all files in the same directory" + "`n" + 
                         "2. Run BFF.exe for GUI interface" + "`n" + 
                         "3. Run bff-command.exe for command line" + "`n" + 
                         "" + "`n" + 
                         "REQUIRED DLLs included:" + "`n" + 
                         "- SuiteSparse libraries" + "`n" + 
                         "- LAPACK/BLAS runtime" + "`n" + 
                         "- NanoGUI (GUI framework)" + "`n" + 
                         "- OpenGL runtime" + "`n" + 
                         "- Visual C++ Runtime" + "`n" + 
                         "" + "`n" + 
                         "If you get DLL errors:" + "`n" + 
                         "1. Install Visual C++ Redistributable:" + "`n" + 
                         "   https://aka.ms/vs/17/release/vc_redist.x64.exe" + "`n" + 
                         "2. Update graphics drivers for OpenGL support"
        
        Set-Content -Path "$DistDir\README.txt" -Value $ReadmeContent -Encoding UTF8
        
        # Create ZIP archive
        if (Test-Path "$DistDir\*") {
            Compress-Archive -Path "$DistDir\*" -DestinationPath "BFF-Windows-v1.6.zip" -Force
            Write-Host "ZIP archive created: BFF-Windows-v1.6.zip"
        } else {
            Write-Host "Warning: No files to package in $DistDir"
        }

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BFF-Windows-Package
        path: |
          bff-dist/
          BFF-Windows-v1.6.zip
        retention-days: 7

    - name: Debug information on failure
      if: failure()
      shell: pwsh
      run: |
        Write-Host "=== DEBUG INFORMATION ==="
        Write-Host "Current directory: $pwd"
        Write-Host "SuiteSparse installation check:"
        $SuiteSparseDir = "$pwd\suitesparse-build\install"
        if (Test-Path $SuiteSparseDir) {
            Write-Host "SuiteSparse dir exists"
            Write-Host "Include directory contents:"
            Get-ChildItem -Path "$SuiteSparseDir\include" -Recurse | Select-Object -First 20
            Write-Host "Lib directory contents:"
            Get-ChildItem -Path "$SuiteSparseDir\lib" | Select-Object -First 20
        }
        Write-Host "BFF build directory structure:"
        if (Test-Path "bff-build") {
            Get-ChildItem -Path "bff-build" -Recurse | Where-Object { $_.Name -match "\.(exe|lib|dll)$" } | Select-Object -First 30
        }
        Write-Host "=== END DEBUG ==="
