name: Build BFF Windows Binary (2021 Compatibility)

on: 
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install specific CMake version
      run: |
        # Install CMake 3.20.0 (released April 2021)
        choco install cmake --version=3.20.0 -y

    - name: Clone and build SuiteSparse with compatibility
      run: |
        # Clone SuiteSparse for Windows
        git clone https://github.com/jlblancoc/suitesparse-metis-for-windows.git SuiteSparseWin
        cd SuiteSparseWin
        
        # Use a 2020-2021 compatible commit
        git checkout 80ed52cc1bfa7e9e1c8b52d3cb29d1980f4c5b3a
        
        echo "=== Building SuiteSparse ==="
        mkdir build
        cd build
        
        # Build with compatibility flags
        cmake .. `
          -DCMAKE_INSTALL_PREFIX="$pwd/install" `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_POLICY_DEFAULT_CMP0001=NEW `
          -DCMAKE_POLICY_DEFAULT_CMP0002=NEW `
          -DCMAKE_POLICY_DEFAULT_CMP0003=NEW `
          -G "Visual Studio 17 2022" -A x64
        
        cmake --build . --config Release --target install --parallel
        
        echo "=== SuiteSparse build complete ==="
        dir install/include/suitesparse | Select-Object -First 10

    - name: Fix all CMakeLists.txt files
      run: |
        echo "=== Fixing CMakeLists.txt files ==="
        
        # Fix main CMakeLists.txt
        if (Test-Path "CMakeLists.txt") {
            $content = Get-Content "CMakeLists.txt" -Raw
            $content = $content -replace 'cmake_minimum_required\(.*\)', 'cmake_minimum_required(VERSION 3.5)'
            $content | Set-Content "CMakeLists.txt"
            echo "Fixed main CMakeLists.txt"
        }
        
        # Fix nanogui CMakeLists.txt
        if (Test-Path "deps/nanogui/CMakeLists.txt") {
            $content = Get-Content "deps/nanogui/CMakeLists.txt" -Raw
            $content = $content -replace 'cmake_minimum_required\(.*\)', 'cmake_minimum_required(VERSION 3.5)'
            $content | Set-Content "deps/nanogui/CMakeLists.txt"
            echo "Fixed nanogui CMakeLists.txt"
        }
        
        # Fix glm CMakeLists.txt
        if (Test-Path "deps/glm/glm/CMakeLists.txt") {
            $content = Get-Content "deps/glm/glm/CMakeLists.txt" -Raw
            $content = $content -replace 'cmake_minimum_required\(.*\)', 'cmake_minimum_required(VERSION 3.5)'
            $content | Set-Content "deps/glm/glm/CMakeLists.txt"
            echo "Fixed glm CMakeLists.txt"
        }

    - name: Remove problematic FindSuiteSparse.cmake
      run: |
        if (Test-Path "cmake/FindSuiteSparse.cmake") {
            Remove-Item "cmake/FindSuiteSparse.cmake" -Force
            echo "Removed FindSuiteSparse.cmake"
        }

    - name: Configure BFF with compatibility settings
      run: |
        $SuiteSparseDir = "$pwd/SuiteSparseWin/build/install"
        $OpenBLASDir = "$pwd/deps/openblas-windows"
        
        echo "SuiteSparse directory: $SuiteSparseDir"
        echo "OpenBLAS directory: $OpenBLASDir"
        
        # Verify critical files
        if (-not (Test-Path "$SuiteSparseDir/include/suitesparse/cholmod.h")) {
            echo "ERROR: cholmod.h not found!"
            dir "$SuiteSparseDir/include" -Recurse
            exit 1
        }
        
        if (-not (Test-Path "$OpenBLASDir/lib/libopenblas.lib")) {
            echo "ERROR: libopenblas.lib not found!"
            dir "$OpenBLASDir/lib" -Recurse
            exit 1
        }
        
        mkdir build
        cd build
        
        # Configure with extensive compatibility settings
        cmake .. `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 `
          -DCMAKE_POLICY_DEFAULT_CMP0001=NEW `
          -DCMAKE_POLICY_DEFAULT_CMP0002=NEW `
          -DCMAKE_POLICY_DEFAULT_CMP0003=NEW `
          -DCMAKE_POLICY_DEFAULT_CMP0004=NEW `
          -DSuiteSparse_CHOLMOD_INCLUDE_DIR="$SuiteSparseDir/include/suitesparse" `
          -DSuiteSparse_CHOLMOD_LIBRARY_RELEASE="$SuiteSparseDir/lib/libcholmod.lib" `
          -DSuiteSparse_AMD_LIBRARY_RELEASE="$SuiteSparseDir/lib/libamd.lib" `
          -DSuiteSparse_CAMD_LIBRARY_RELEASE="$SuiteSparseDir/lib/libcamd.lib" `
          -DSuiteSparse_CCOLAMD_LIBRARY_RELEASE="$SuiteSparseDir/lib/libccolamd.lib" `
          -DSuiteSparse_COLAMD_LIBRARY_RELEASE="$SuiteSparseDir/lib/libcolamd.lib" `
          -DSuiteSparse_BTF_LIBRARY_RELEASE="$SuiteSparseDir/lib/libbtf.lib" `
          -DSuiteSparse_KLU_LIBRARY_RELEASE="$SuiteSparseDir/lib/libklu.lib" `
          -DSuiteSparse_UMFPACK_LIBRARY_RELEASE="$SuiteSparseDir/lib/libumfpack.lib" `
          -DSuiteSparse_CXSPARSE_LIBRARY_RELEASE="$SuiteSparseDir/lib/libcxsparse.lib" `
          -DSuiteSparse_SUITESPARSECONFIG_LIBRARY_RELEASE="$SuiteSparseDir/lib/libsuitesparseconfig.lib" `
          -DSuiteSparse_BLAS_LIBRARY="$OpenBLASDir/lib/libopenblas.lib" `
          -DSuiteSparse_LAPACK_LIBRARY="$OpenBLASDir/lib/libopenblas.lib" `
          -G "Visual Studio 17 2022" -A x64 `
          -Wno-dev

    - name: Build BFF command line tool
      run: |
        cd build
        cmake --build . --config Release --target bff-command-line --parallel

    - name: Copy required DLLs
      run: |
        # Copy SuiteSparse DLLs
        if (Test-Path "SuiteSparseWin/build/install/bin") {
            Copy-Item "SuiteSparseWin/build/install/bin/*.dll" "build/Release/" -ErrorAction SilentlyContinue
            echo "Copied SuiteSparse DLLs"
        }
        
        # Copy OpenBLAS DLLs
        if (Test-Path "deps/openblas-windows/bin") {
            Copy-Item "deps/openblas-windows/bin/*.dll" "build/Release/" -ErrorAction SilentlyContinue
            echo "Copied OpenBLAS DLLs"
        }

    - name: Package and test
      run: |
        mkdir dist
        
        if (Test-Path "build/Release/bff-command-line.exe") {
            Copy-Item "build/Release/bff-command-line.exe" "dist/"
            echo "✓ bff-command-line.exe found and copied"
            
            # Test if it runs
            cd dist
            ./bff-command-line.exe --help || echo "Executable ran (may have shown help)"
        } else {
            echo "ERROR: bff-command-line.exe not found"
            dir build -Recurse -Filter *.exe
        }
        
        Copy-Item "build/Release/*.dll" "dist/" -ErrorAction SilentlyContinue
        dir dist

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bff-windows-binary
        path: dist/*
        retention-days: 30
