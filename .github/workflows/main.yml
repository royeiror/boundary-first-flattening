name: Windows Build BFF v1.6 - Optimized

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup environment
      shell: bash
      run: |
        echo "Installing required tools..."
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
        choco install wget -y
        choco install 7zip -y
        
    - name: Download pre-built OpenBLAS
      shell: bash
      run: |
        echo "Downloading pre-built OpenBLAS..."
        wget https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.28/OpenBLAS-0.3.28-x64.zip -O openblas.zip
        7z x openblas.zip -oopenblas-install
        
    - name: Build SuiteSparse v5.13.0 with METIS
      shell: bash
      run: |
        echo "Building SuiteSparse v5.13.0 with METIS..."
        
        # Clean up
        rm -rf suitesparse-deps
        rm -rf SuiteSparse
        
        # 1. Clone and checkout v5.13.0
        git clone https://github.com/DrTimothyAldenDavis/SuiteSparse.git
        cd SuiteSparse
        git checkout v5.13.0
        
        # 2. Build METIS first
        echo "Building METIS..."
        if [ -d "metis-5.1.0" ]; then
          cd metis-5.1.0
          # Patch for MSVC
          find . -name "*.c" -type f -exec sed -i 's/#include <getopt.h>//g' {} \;
          
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64 \
            -DCMAKE_INSTALL_PREFIX="../../../suitesparse-deps" \
            -DSHARED=OFF
          cmake --build . --config Release --target INSTALL
          cd ../../
        else
          echo "METIS directory not found, attempting to build from separate source"
          # Fallback: download and build METIS separately
          cd ..
          wget http://glaros.dtc.umn.edu/gkhome/fetch/sw/metis/metis-5.1.0.tar.gz
          tar -xzf metis-5.1.0.tar.gz
          cd metis-5.1.0
          make config shared=0 prefix=../../suitesparse-deps
          make install
          cd ..
        fi
        
        # 3. Build essential SuiteSparse libraries
        echo "Building SuiteSparse libraries..."
        
        # First build SuiteSparse_config
        if [ -d "SuiteSparse_config" ]; then
          echo "=== Building SuiteSparse_config ==="
          cd SuiteSparse_config
          mkdir -p build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64 \
            -DCMAKE_INSTALL_PREFIX="../../../../suitesparse-deps"
          cmake --build . --config Release --target INSTALL
          cd ../../
        fi
        
        # Build other libraries in dependency order
        for lib in AMD CAMD CCOLAMD COLAMD CHOLMOD; do
          if [ -d "$lib" ]; then
            echo "=== Building $lib ==="
            cd "$lib"
            mkdir -p build
            cd build
            
            # Create a simple CMakeLists.txt if needed
            if [ ! -f "../CMakeLists.txt" ]; then
              cat > ../CMakeLists.txt << 'EOF'
cmake_minimum_required(VERSION 3.10)
project(${LIBNAME})

file(GLOB SOURCES "*.c" "*.cpp")
add_library(${LIBNAME} STATIC ${SOURCES})

install(TARGETS ${LIBNAME}
  ARCHIVE DESTINATION lib
  LIBRARY DESTINATION lib
  RUNTIME DESTINATION bin)

install(DIRECTORY ../Include/ DESTINATION include)
EOF
            fi
            
            cmake .. -G "Visual Studio 17 2022" -A x64 \
              -DCMAKE_INSTALL_PREFIX="../../../../suitesparse-deps" \
              -DBLAS_LIBRARIES="../../../../openblas-install/lib/libopenblas.lib" \
              -DLIBNAME="$lib"
            cmake --build . --config Release --target INSTALL
            cd ../../
          fi
        done
        
        # 4. Copy headers
        echo "Copying headers..."
        mkdir -p ../suitesparse-deps/include
        cp -r Include/* ../suitesparse-deps/include/ 2>/dev/null || true
        find . -name "*.h" -maxdepth 2 -exec cp {} ../suitesparse-deps/include/ 2>/dev/null \;
        
        # 5. Create compatibility symlinks
        cd ../suitesparse-deps/lib
        cp ../../openblas-install/lib/libopenblas.lib blas.lib
        cp ../../openblas-install/lib/libopenblas.lib lapack.lib
        
        echo "SuiteSparse v5.13.0 built successfully!"
        echo "Libraries available:"
        ls -la *.lib
        
    - name: Apply critical BFF patches
      shell: bash
      run: |
        echo "Applying essential BFF patches for Windows..."
        
        # 1. Create custom FindSuiteSparse.cmake for v5.13.0
        echo "Creating custom FindSuiteSparse.cmake..."
        mkdir -p cmake
        cat > cmake/FindSuiteSparse.cmake << 'EOF'
# Manual configuration for SuiteSparse v5.13.0 on Windows
if(WIN32)
    message(STATUS "Using manually configured SuiteSparse v5.13.0 for Windows")
    
    set(SuiteSparse_FOUND ON)
    set(SuiteSparse_INCLUDE_DIRS "$ENV{GITHUB_WORKSPACE}/suitesparse-deps/include")
    
    # Check which libraries actually exist
    set(SUITESPARSE_LIBS)
    
    foreach(lib amd camd ccolamd colamd cholmod suitesparseconfig metis)
        set(lib_path "$ENV{GITHUB_WORKSPACE}/suitesparse-deps/lib/${lib}.lib")
        if(EXISTS "${lib_path}")
            list(APPEND SUITESPARSE_LIBS "${lib_path}")
            message(STATUS "Found ${lib}.lib")
        else
            # Try with lib prefix
            set(lib_path "$ENV{GITHUB_WORKSPACE}/suitesparse-deps/lib/lib${lib}.lib")
            if(EXISTS "${lib_path}")
                list(APPEND SUITESPARSE_LIBS "${lib_path}")
                message(STATUS "Found lib${lib}.lib")
            endif()
        endif()
    endforeach()
    
    # Add OpenBLAS
    set(OPENBLAS_PATH "$ENV{GITHUB_WORKSPACE}/openblas-install/lib/libopenblas.lib")
    if(EXISTS "${OPENBLAS_PATH}")
        list(APPEND SUITESPARSE_LIBS "${OPENBLAS_PATH}")
        message(STATUS "Added OpenBLAS")
    endif()
    
    set(SuiteSparse_LIBRARIES ${SUITESPARSE_LIBS})
    
    message(STATUS "SuiteSparse includes: ${SuiteSparse_INCLUDE_DIRS}")
    message(STATUS "SuiteSparse libraries: ${SuiteSparse_LIBRARIES}")
endif()
EOF
        
        # 2. Patch CMakeLists.txt
        echo "Patching CMakeLists.txt..."
        sed -i 's|find_package(SuiteSparse REQUIRED)|include(cmake/FindSuiteSparse.cmake)|' CMakeLists.txt
        
        # 3. Patch NanoGUI
        echo "Patching NanoGUI for static build..."
        sed -i 's|add_library(nanogui SHARED|add_library(nanogui STATIC|' deps/nanogui/CMakeLists.txt
        sed -i 's|NANOGUI_BUILD SHARED|NANOGUI_BUILD STATIC|' deps/nanogui/CMakeLists.txt
        
        echo "Patches applied successfully!"
        
    - name: Configure and Build BFF
      shell: cmd
      run: |
        echo "Configuring BFF with CMake..."
        mkdir build
        cd build
        
        cmake .. -G "Visual Studio 17 2022" -A x64 ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DBUILD_SHARED_LIBS=ON ^
          -DCMAKE_PREFIX_PATH="%cd%/../suitesparse-deps" ^
          -DBLAS_LIBRARIES="%cd%/../openblas-install/lib/libopenblas.lib" ^
          -DLAPACK_LIBRARIES="%cd%/../openblas-install/lib/libopenblas.lib"
        
        echo "Building BFF..."
        cmake --build . --config Release --parallel 4
        
    - name: Package artifacts
      shell: bash
      run: |
        echo "Packaging build artifacts..."
        mkdir -p bff-package
        
        if [ -f "./build/Release/bff-viewer.exe" ]; then
          cp ./build/Release/bff-viewer.exe ./bff-package/
          echo "✓ bff-viewer.exe"
        fi
        
        if [ -f "./build/Release/bff.dll" ]; then
          cp ./build/Release/bff.dll ./bff-package/
          echo "✓ bff.dll"
        fi
        
        echo "Copying runtime dependencies..."
        find ./build -name "*.dll" -exec cp {} ./bff-package/ \;
        
        if [ -f "./openblas-install/bin/libopenblas.dll" ]; then
          cp ./openblas-install/bin/libopenblas.dll ./bff-package/
          echo "✓ libopenblas.dll"
        fi
        
        echo "Package contents:"
        ls -la ./bff-package/
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bff-windows-binaries
        path: bff-package/
        if-no-files-found: error
        retention-days: 7
