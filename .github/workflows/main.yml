name: Build BFF Viewer

on: workflow_dispatch

jobs:
  build-viewer:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Install vcpkg
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg install suitesparse:x64-windows
        
    - name: Copy ALL headers from vcpkg
      run: |
        # Clean and create include directory
        if (Test-Path "include") {
            Remove-Item -Recurse -Force include
        }
        mkdir include
        
        # Copy ALL headers recursively
        $vcpkgInclude = "vcpkg/installed/x64-windows/include"
        if (Test-Path $vcpkgInclude) {
            echo "Copying headers from $vcpkgInclude..."
            
            # Find all .h files
            $headers = Get-ChildItem $vcpkgInclude -Filter "*.h" -Recurse
            echo "Found $($headers.Count) header files"
            
            foreach ($header in $headers) {
                $target = "include/$($header.Name)"
                Copy-Item $header.FullName $target -Force
            }
            
            # Also check for cholmod.h specifically
            $cholmod = Get-ChildItem $vcpkgInclude -Filter "cholmod.h" -Recurse | Select -First 1
            if ($cholmod) {
                echo "✅ cholmod.h copied to include/"
            } else {
                echo "❌ cholmod.h not found in vcpkg!"
                echo "Available headers:"
                Get-ChildItem "include" | Select -First 10 Name
            }
        } else {
            echo "❌ vcpkg include directory not found!"
        }
        
    - name: Patch Common.h to look in current directory
      run: |
        # Make Common.h look for cholmod.h in the same directory
        $commonFile = "include/bff/linear-algebra/Common.h"
        if (Test-Path $commonFile) {
            $content = Get-Content $commonFile -Raw
            # Change to look in parent directories
            $newContent = $content -replace '#include "cholmod.h"', '#include "../../../cholmod.h"'
            $newContent | Set-Content $commonFile
            echo "Updated Common.h to look in workspace root"
        }
        
    - name: Create FindSuiteSparse.cmake
      run: |
        # Use CMAKE_CURRENT_SOURCE_DIR to avoid path issues
        "set(SuiteSparse_FOUND TRUE)" | Out-File cmake/FindSuiteSparse.cmake -Encoding UTF8
        "set(SuiteSparse_INCLUDE_DIR `"\${CMAKE_CURRENT_SOURCE_DIR}`")" | Out-File -Append cmake/FindSuiteSparse.cmake -Encoding UTF8
        "set(SuiteSparse_CHOLMOD_LIBRARY `"cholmod`")" | Out-File -Append cmake/FindSuiteSparse.cmake -Encoding UTF8
        
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1
      
    - name: Configure CMake
      run: |
        cmake -B build -DBFF_BUILD_GUI=ON -DCMAKE_BUILD_TYPE=Release
        
    - name: Build
      run: |
        cmake --build build --config Release
        
    - name: Check results
      run: |
        if (Test-Path "build/Release/bff-viewer.exe") {
            echo "✅ SUCCESS: bff-viewer.exe built!"
        } else {
            echo "❌ Viewer not found"
        }
