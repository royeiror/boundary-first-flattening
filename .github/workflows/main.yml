name: Build BFF for Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [created]
  workflow_dispatch:

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-windows

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install Chocolatey packages
      shell: powershell
      run: |
        # Install Chocolatey
        Set-ExecutionPolicy Bypass -Scope Process -Force
        [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
        iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
        
        # Install build tools
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
        choco install ninja -y

    - name: Install vcpkg and dependencies
      shell: powershell
      run: |
        # Install vcpkg
        git clone https://github.com/Microsoft/vcpkg.git $env:VCPKG_ROOT
        & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"
        
        # Install required dependencies
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET eigen3
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET libigl
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET suitesparse
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET metis
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glfw3
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glew
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET freeglut
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glm

    - name: Download and install SuiteSparse-METIS
      shell: powershell
      run: |
        # Download SuiteSparse-METIS
        $url = "https://github.com/jlblancoc/suitesparse-metis-for-windows/archive/master.zip"
        $output = "C:\suitesparse-metis.zip"
        
        Write-Host "Downloading SuiteSparse-METIS from $url"
        Invoke-WebRequest -Uri $url -OutFile $output
        
        # Create directories
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse"
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse\include"
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse\lib"
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse\bin"
        
        # Extract
        Expand-Archive -Path $output -DestinationPath "C:\SuiteSparseTemp\" -Force
        
        # Find and copy files
        Write-Host "Searching for library files..."
        
        # Copy all .lib files
        $libFiles = Get-ChildItem -Path "C:\SuiteSparseTemp" -Recurse -Filter "*.lib"
        foreach ($file in $libFiles) {
          Copy-Item -Path $file.FullName -Destination "C:\SuiteSparse\lib\" -Force
          Write-Host "Copied lib: $($file.Name)"
        }
        
        # Copy all .dll files
        $dllFiles = Get-ChildItem -Path "C:\SuiteSparseTemp" -Recurse -Filter "*.dll"
        foreach ($file in $dllFiles) {
          Copy-Item -Path $file.FullName -Destination "C:\SuiteSparse\bin\" -Force
          Write-Host "Copied dll: $($file.Name)"
        }
        
        # Copy all .h files
        $hFiles = Get-ChildItem -Path "C:\SuiteSparseTemp" -Recurse -Filter "*.h"
        foreach ($file in $hFiles) {
          # Copy to include directory
          Copy-Item -Path $file.FullName -Destination "C:\SuiteSparse\include\" -Force
        }
        
        # Set environment variables
        echo "SUITESPARSE_INCLUDE_DIR=C:\SuiteSparse\include" | Out-File -FilePath $env:GITHUB_ENV -Append
        echo "SUITESPARSE_LIB_DIR=C:\SuiteSparse\lib" | Out-File -FilePath $env:GITHUB_ENV -Append
        
        # Add to PATH
        echo "C:\SuiteSparse\lib" | Out-File -FilePath $env:GITHUB_PATH -Append
        echo "C:\SuiteSparse\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

    - name: Create CMakeLists.txt for BFF
      shell: powershell
      run: |
        # Get the vcpkg path with forward slashes for CMake
        $vcpkgPath = $env:VCPKG_ROOT -replace "\\", "/"
        
        $cmakeLines = @(
          "cmake_minimum_required(VERSION 3.15)",
          "project(BFF)",
          "",
          "set(CMAKE_CXX_STANDARD 17)",
          "set(CMAKE_CXX_STANDARD_REQUIRED ON)",
          "",
          "# Use vcpkg toolchain",
          "set(CMAKE_TOOLCHAIN_FILE `"$vcpkgPath/scripts/buildsystems/vcpkg.cmake`" CACHE STRING `"`")",
          "",
          "# Find Eigen3",
          "find_package(Eigen3 REQUIRED)",
          "",
          "# Manually set SuiteSparse paths",
          "set(SUITESPARSE_INCLUDE_DIR `"C:/SuiteSparse/include`")",
          "set(SUITESPARSE_LIB_DIR `"C:/SuiteSparse/lib`")",
          "",
          "# Find SuiteSparse libraries",
          "find_library(CHOLMOD_LIBRARY NAMES cholmod libcholmod PATHS `${SUITESPARSE_LIB_DIR})",
          "find_library(AMD_LIBRARY NAMES amd libamd PATHS `${SUITESPARSE_LIB_DIR})",
          "find_library(CAMD_LIBRARY NAMES camd libcamd PATHS `${SUITESPARSE_LIB_DIR})",
          "find_library(COLAMD_LIBRARY Names colamd libcolamd PATHS `${SUITESPARSE_LIB_DIR})",
          "find_library(CCOLAMD_LIBRARY NAMES ccolamd libccolamd PATHS `${SUITESPARSE_LIB_DIR})",
          "find_library(METIS_LIBRARY NAMES metis libmetis PATHS `${SUITESPARSE_LIB_DIR})",
          "",
          "# OpenGL and GLFW",
          "find_package(OpenGL REQUIRED)",
          "find_package(glfw3 REQUIRED)",
          "find_package(GLEW REQUIRED)",
          "",
          "# Include directories",
          "include_directories(",
          "    `${CMAKE_SOURCE_DIR}/include",
          "    `${CMAKE_SOURCE_DIR}/deps/libigl/include",
          "    `${CMAKE_SOURCE_DIR}/deps/spectra/include",
          "    `${EIGEN3_INCLUDE_DIRS}",
          "    `${SUITESPARSE_INCLUDE_DIR}",
          ")",
          "",
          "# Source files for library",
          "file(GLOB SRC_FILES `"src/*.cpp`")",
          "",
          "# Create library",
          "add_library(bff-lib STATIC `${SRC_FILES})",
          "",
          "# Link libraries to bff-lib",
          "target_link_libraries(bff-lib",
          "    `${CHOLMOD_LIBRARY}",
          "    `${AMD_LIBRARY}",
          "    `${CAMD_LIBRARY}",
          "    `${COLAMD_LIBRARY}",
          "    `${CCOLAMD_LIBRARY}",
          "    `${METIS_LIBRARY}",
          ")",
          "",
          "# GUI application",
          "if(EXISTS `${CMAKE_SOURCE_DIR}/apps)",
          "    file(GLOB GUI_SRC_FILES `"apps/*.cpp`")",
          "    if(GUI_SRC_FILES)",
          "        add_executable(bff-gui `${GUI_SRC_FILES})",
          "        target_link_libraries(bff-gui bff-lib `${OPENGL_LIBRARIES} glfw ${GLEW_LIBRARIES})",
          "        target_include_directories(bff-gui PRIVATE `${CMAKE_SOURCE_DIR}/apps)",
          "    endif()",
          "endif()",
          "",
          "# Command line tool",
          "if(EXISTS `${CMAKE_SOURCE_DIR}/binaries)",
          "    file(GLOB CLI_SRC_FILES `"binaries/*.cpp`")",
          "    if(CLI_SRC_FILES)",
          "        add_executable(bff-cli `${CLI_SRC_FILES})",
          "        target_link_libraries(bff-cli bff-lib)",
          "        target_include_directories(bff-cli PRIVATE `${CMAKE_SOURCE_DIR}/binaries)",
          "    endif()",
          "endif()"
        )
        
        # Write to file
        $cmakeLines | Out-File -FilePath "CMakeLists.txt" -Encoding UTF8 -Force

    - name: Check BFF source structure
      shell: powershell
      run: |
        Write-Host "BFF source structure:"
        Write-Host "`nChecking deps directory..."
        if (Test-Path "deps") {
          Get-ChildItem -Path "deps" | Select-Object Name, Mode
        }
        
        Write-Host "`nChecking if libigl exists in deps..."
        if (Test-Path "deps/libigl") {
          Write-Host "libigl found"
        } else {
          Write-Host "libigl not found, cloning it..."
          git clone https://github.com/libigl/libigl.git deps/libigl
        }
        
        Write-Host "`nChecking if spectra exists in deps..."
        if (Test-Path "deps/spectra") {
          Write-Host "spectra found"
        } else {
          Write-Host "spectra not found, cloning it..."
          git clone https://github.com/yixuan/spectra.git deps/spectra
        }

    - name: Configure CMake
      shell: powershell
      run: |
        # Create build directory
        New-Item -ItemType Directory -Force -Path "build"
        
        Write-Host "Configuring CMake..."
        Write-Host "Current directory: $(Get-Location)"
        
        # Configure with CMake - pass toolchain file as argument
        cmake -B build `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=$env:VCPKG_DEFAULT_TRIPLET `
          -G "Visual Studio 17 2022" `
          -A x64

    - name: Build BFF
      shell: powershell
      run: |
        Write-Host "Building project..."
        cmake --build build --config Release --parallel 4

    - name: Find and copy executables
      shell: powershell
      run: |
        # Create distribution directory
        New-Item -ItemType Directory -Force -Path "dist"
        
        Write-Host "Searching for executables..."
        
        # Search for executables
        $searchPaths = @(
          "build\Release",
          "build",
          "build\bin\Release",
          "build\bin"
        )
        
        foreach ($path in $searchPaths) {
          if (Test-Path $path) {
            Write-Host "Checking $path"
            $exes = Get-ChildItem -Path $path -Filter "*.exe" -Recurse
            foreach ($exe in $exes) {
              Write-Host "Found executable: $($exe.FullName)"
              Copy-Item -Path $exe.FullName -Destination "dist\" -Force
            }
          }
        }
        
        # Copy DLLs from vcpkg
        $vcpkgBinPath = "$env:VCPKG_ROOT\installed\$env:VCPKG_DEFAULT_TRIPLET\bin"
        if (Test-Path $vcpkgBinPath) {
          Write-Host "Copying DLLs from $vcpkgBinPath"
          Get-ChildItem -Path $vcpkgBinPath -Filter "*.dll" | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination "dist\" -Force
            Write-Host "Copied: $($_.Name)"
          }
        }
        
        # Copy DLLs from SuiteSparse
        $suiteSparseBinPath = "C:\SuiteSparse\bin"
        if (Test-Path $suiteSparseBinPath) {
          Write-Host "Copying DLLs from $suiteSparseBinPath"
          Get-ChildItem -Path $suiteSparseBinPath -Filter "*.dll" | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination "dist\" -Force
            Write-Host "Copied: $($_.Name)"
          }
        }
        
        # List what we have in dist
        Write-Host "`nFiles in dist directory:"
        Get-ChildItem -Path "dist"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BFF-Windows-Binaries
        path: dist/

    - name: Create release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/**
        generate_release_notes: true
