    - name: Download pre-built OpenBLAS
      shell: powershell
      run: |
        Write-Host "Downloading pre-built OpenBLAS..."
        mkdir -Force deps | Out-Null
        cd deps
        
        # Download pre-built OpenBLAS for Windows (x64)
        $openblasUrl = "https://github.com/xianyi/OpenBLAS/releases/download/v0.3.26/OpenBLAS-0.3.26-x64.zip"
        $openblasZip = "openblas.zip"
        
        Invoke-WebRequest -Uri $openblasUrl -OutFile $openblasZip
        Expand-Archive -Path $openblasZip -DestinationPath "openblas-windows"
        Remove-Item $openblasZip
        
        Write-Host "OpenBLAS directory structure:"
        Get-ChildItem -Recurse "openblas-windows" | Select-Object -First 20
        
        # Find the actual openblas.lib file
        $openblasLib = Get-ChildItem -Path "openblas-windows" -Recurse -Filter "openblas.lib" | Select-Object -First 1
        if ($openblasLib) {
          Write-Host "Found OpenBLAS library at: $($openblasLib.FullName)"
          # Create a simpler path structure
          mkdir -Force "openblas-windows\lib" | Out-Null
          mkdir -Force "openblas-windows\include" | Out-Null
          Copy-Item $openblasLib.FullName -Destination "openblas-windows\lib\openblas.lib"
          
          # Find and copy include files
          $includeFiles = Get-ChildItem -Path "openblas-windows" -Recurse -Filter "*.h" | Where-Object { $_.Directory.Name -eq "include" }
          foreach ($file in $includeFiles) {
            Copy-Item $file.FullName -Destination "openblas-windows\include\" -Force
          }
        } else {
          Write-Host "WARNING: openblas.lib not found!"
          Write-Host "Trying to find any .lib file..."
          $anyLib = Get-ChildItem -Path "openblas-windows" -Recurse -Filter "*.lib" | Select-Object -First 1
          if ($anyLib) {
            Write-Host "Found library: $($anyLib.FullName)"
            mkdir -Force "openblas-windows\lib" | Out-Null
            Copy-Item $anyLib.FullName -Destination "openblas-windows\lib\openblas.lib"
          }
        }
        
        Write-Host "OpenBLAS setup complete!"
