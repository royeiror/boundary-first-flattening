name: Build BFF Viewer

on: workflow_dispatch

jobs:
  build-viewer:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Install vcpkg and SuiteSparse
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg install suitesparse:x64-windows
        
    - name: Create simplified FindSuiteSparse.cmake
      shell: pwsh
      run: |
        # Backup original
        if (Test-Path "cmake/FindSuiteSparse.cmake") {
            Move-Item "cmake/FindSuiteSparse.cmake" "cmake/FindSuiteSparse.cmake.backup" -Force
        }
        
        # Create simple version
        $content = @'
# Simplified FindSuiteSparse.cmake
cmake_minimum_required(VERSION 3.10)

# Always return success
set(SuiteSparse_FOUND TRUE)
set(SuiteSparse_INCLUDE_DIR "$ENV{GITHUB_WORKSPACE}/vcpkg/installed/x64-windows/include")
set(SuiteSparse_LIBRARY_DIR "$ENV{GITHUB_WORKSPACE}/vcpkg/installed/x64-windows/lib")

# Mark all components as found
set(SuiteSparse_AMD_FOUND TRUE)
set(SuiteSparse_CHOLMOD_FOUND TRUE)
set(SuiteSparse_UMFPACK_FOUND TRUE)
set(SuiteSparse_SPQR_FOUND TRUE)

message(STATUS "Using simplified SuiteSparse configuration")
'@
        
        $content | Out-File "cmake/FindSuiteSparse.cmake" -Encoding UTF8
        
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1
      
    - name: Configure CMake
      run: |
        cmake -B build `
          -DBFF_BUILD_GUI=ON `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake"
        
    - name: Build
      run: |
        cmake --build build --config Release
        
    - name: Check for viewer
      run: |
        Get-ChildItem -Path build -Recurse -Filter "*viewer*.exe" -ErrorAction SilentlyContinue | ForEach-Object {
            echo "Found: $($_.FullName)"
        }
