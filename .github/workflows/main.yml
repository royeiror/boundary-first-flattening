name: Build BFF Windows Binary

on:
  push:
    tags: ['v*']
  release:
    types: [created]
  workflow_dispatch:  # Manual trigger

jobs:
  build-windows:
    name: Build BFF Command Line (Windows x64)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # Remove the 'ref' parameter or use the exact tag name
        # If v1.6 is a tag, use: ref: 'refs/tags/v1.6'
        # If it's a branch, use: ref: 'v1.6'
        # For now, let's checkout the default branch
        submodules: recursive

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install build tools
      run: |
        choco install cmake -y
        choco install git -y

    - name: Clone and build SuiteSparse
      run: |
        # Clone SuiteSparse
        git clone https://github.com/DrTimothyAldenDavis/SuiteSparse.git
        cd SuiteSparse
        
        # Build SuiteSparse using CMake
        mkdir build
        cd build
        cmake .. -DCMAKE_INSTALL_PREFIX=./install -DCMAKE_BUILD_TYPE=Release
        cmake --build . --config Release --target install --parallel
        
        # List installed files for verification
        echo "SuiteSparse build completed:"
        dir install\lib /s
        dir install\include /s

    - name: Setup OpenBLAS paths
      run: |
        # Create directory structure for OpenBLAS
        # Assuming OpenBLAS is in the deps folder of the repository
        if (Test-Path "deps/openblas-windows") {
            echo "OpenBLAS found in deps folder"
            dir deps\openblas-windows /s
        } else {
            echo "WARNING: OpenBLAS not found in deps folder"
            # Create minimal structure for CMake configuration
            mkdir deps\openblas-windows\lib -Force
            mkdir deps\openblas-windows\include -Force
        }

    - name: Configure BFF with CMake
      run: |
        $SuiteSparseDir = "$pwd\SuiteSparse\build\install"
        $OpenBLASDir = "$pwd\deps\openblas-windows"
        
        echo "SuiteSparse directory: $SuiteSparseDir"
        echo "OpenBLAS directory: $OpenBLASDir"
        
        # Create build directory
        mkdir build
        cd build
        
        # Configure with all required SuiteSparse paths
        cmake .. `
          -DCMAKE_BUILD_TYPE=Release `
          -DSuiteSparse_CHOLMOD_DIR="$SuiteSparseDir\lib" `
          -DSuiteSparse_CHOLMOD_INCLUDE_DIR="$SuiteSparseDir\include\suitesparse" `
          -DSuiteSparse_CHOLMOD_LIBRARY_RELEASE="$SuiteSparseDir\lib\libcholmod.lib" `
          -DSuiteSparse_AMD_LIBRARY_RELEASE="$SuiteSparseDir\lib\libamd.lib" `
          -DSuiteSparse_CAMD_LIBRARY_RELEASE="$SuiteSparseDir\lib\libcamd.lib" `
          -DSuiteSparse_CCOLAMD_LIBRARY_RELEASE="$SuiteSparseDir\lib\libccolamd.lib" `
          -DSuiteSparse_COLAMD_LIBRARY_RELEASE="$SuiteSparseDir\lib\libcolamd.lib" `
          -DSuiteSparse_BLAS_LIBRARY="$OpenBLASDir\lib\libopenblas.lib" `
          -DSuiteSparse_LAPACK_LIBRARY="$OpenBLASDir\lib\libopenblas.lib" `
          -G "Visual Studio 17 2022" -A x64

    - name: Build BFF command line tool
      run: |
        cd build
        # Build only the command line tool
        cmake --build . --config Release --target bff-command-line --parallel

    - name: Verify built executable
      run: |
        echo "Looking for built executables:"
        dir build /s -include *.exe
        if (Test-Path "build\Release\bff-command-line.exe") {
            echo "✓ bff-command-line.exe found in Release directory!"
        } elseif (Test-Path "build\bff-command-line.exe") {
            echo "✓ bff-command-line.exe found in build directory!"
        } else {
            echo "Searching for any executable files..."
            Get-ChildItem -Path build -Recurse -Filter *.exe | ForEach-Object { 
                echo "Found: $($_.FullName)"
            }
        }

    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: bff-command-line-windows
        path: |
          build/**/*.exe
          build/**/*.dll
        retention-days: 30
