name: Build BFF Windows

on: 
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Check what dependencies we have
      run: |
        echo "=== Available dependencies ==="
        if (Test-Path "deps") {
            dir deps -Recurse
        }

    - name: Simple CMake configuration
      run: |
        # Just try to configure with what we have
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -G "Visual Studio 17 2022" -A x64

    - name: Try to build
      run: |
        cd build
        cmake --build . --config Release --target bff-command-line

    - name: Upload result
      uses: actions/upload-artifact@v4
      with:
        name: bff-attempt
        path: build/Release/bff-command-line.exe
