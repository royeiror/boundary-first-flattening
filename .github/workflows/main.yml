name: Build BFF with Stubs

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Create stub headers for SuiteSparse
      run: |
        # Create stub cholmod.h
        $stubCholmod = @'
#pragma once

// Stub cholmod.h for compilation - actual functionality will be limited
typedef struct cholmod_common_struct {
    int print;
    int precise;
    int (*malloc_memory)(size_t);
    int (*free_memory)(void*);
    int (*realloc_memory)(void*, size_t);
    void* (*calloc_memory)(size_t, size_t);
    int (*printf_func)(const char*, ...);
    int (*hypotenuse)(double, double);
    int (*divcomplex)(double [2], double [2], double [2]);
    double dbound;
    double grow0;
    double grow1;
    double grow2;
    size_t maxrank;
    double supernodal_switch;
    double supernodal_switch2;
    int final_asis;
    int final_super;
    int final_ll;
    int final_pack;
    int final_monotonic;
    int final_resymbol;
    int prefer_zomplex;
    int prefer_upper;
    int quick_return_if_not_posdef;
    int nmethods;
    int (*method)(int);
    double (*postorder);
    int itype;
    double dtype;
} cholmod_common;

typedef struct cholmod_factor_struct {
    int n;
    int minor;
    int *Perm;
    int *ColCount;
    int *IPerm;
    int *super;
    int *pi;
    int *px;
    int *s;
    int ordering;
    int is_ll;
    int is_super;
    int is_monotonic;
    size_t nzmax;
    int nz;
    int *p;
    int *i;
    double *x;
    double *z;
    int *next;
    int *prev;
} *cholmod_factor;

typedef struct cholmod_dense_struct {
    size_t nrow;
    size_t ncol;
    size_t nzmax;
    size_t d;
    void *x;
    void *z;
    int xtype;
    int dtype;
} *cholmod_dense;

typedef struct cholmod_sparse_struct {
    size_t nrow;
    size_t ncol;
    size_t nzmax;
    void *p;
    void *i;
    void *x;
    void *z;
    int stype;
    int itype;
    int xtype;
    int dtype;
    int sorted;
    int packed;
} *cholmod_sparse;

#define CHOLMOD_MAIN_VERSION 0
#define CHOLMOD_SUB_VERSION 0
#define CHOLMOD_PATCH_VERSION 0

// Stub function declarations
cholmod_common* cholmod_start(int*);
int cholmod_finish(cholmod_common*);
cholmod_dense* cholmod_zeros(size_t, size_t, int, cholmod_common*);
int cholmod_free_dense(cholmod_dense**, cholmod_common*);
cholmod_sparse* cholmod_allocate_sparse(size_t, size_t, size_t, int, int, int, int, cholmod_common*);
int cholmod_free_sparse(cholmod_sparse**, cholmod_common*);
cholmod_factor* cholmod_analyze(cholmod_sparse*, cholmod_common*);
cholmod_factor* cholmod_factorize(cholmod_sparse*, cholmod_factor*, cholmod_common*);
cholmod_dense* cholmod_solve(int, cholmod_factor*, cholmod_dense*, cholmod_common*);
'@
        $stubCholmod | Set-Content "include/cholmod.h"
        echo "Created stub cholmod.h"

        # Create stub amd.h
        $stubAmd = @'
#pragma once
// Stub amd.h for compilation
#define AMD_VERSION 0
#define AMD_SUB_VERSION 0
'@
        $stubAmd | Set-Content "include/amd.h"

        # Create stub suitesparseconfig.h
        $stubConfig = @'
#pragma once
// Stub suitesparseconfig.h for compilation
#define SUITESPARSE_VERSION 0
#define SUITESPARSE_MAIN_VERSION 0
#define SUITESPARSE_SUB_VERSION 0
#define SUITESPARSE_SUBSUB_VERSION 0
'@
        $stubConfig | Set-Content "include/suitesparseconfig.h"

    - name: Fix CMake and build
      run: |
        # Quick CMake fixes
        (Get-Content CMakeLists.txt) -replace 'find_package\(SuiteSparse REQUIRED\)', '# ' | Set-Content CMakeLists.txt
        
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -G "Visual Studio 17 2022" -A x64
        cmake --build . --config Release --target bff-command-line --parallel

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: bff-stub-build
        path: build/Release/bff-command-line.exe
