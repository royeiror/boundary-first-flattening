name: Build BFF Windows with GUI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  BUILD_TYPE: "Release"

jobs:
  build-suite-sparse:
    name: Build SuiteSparse
    runs-on: windows-latest
    outputs:
      suitesparse-path: ${{ steps.set-output.outputs.suitesparse-path }}
    steps:
      - name: Checkout SuiteSparse
        uses: actions/checkout@v4
        with:
          repository: jlblancoc/suitesparse-metis-for-windows
          path: suitesparse-src

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v1
        with:
          cmake-version: "3.25.x"

      - name: Install required tools
        run: |
          choco install nasm -y

      - name: Build SuiteSparse
        run: |
          mkdir suitesparse-build
          cd suitesparse-build
          
          # Build with explicit install path
          cmake ../suitesparse-src `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE/install" `
            -DBLA_VENDOR=OpenBLAS `
            -DENABLE_CUDA=OFF `
            -DBUILD_METIS=ON `
            -DBUILD_CHOLMOD=ON `
            -DBUILD_UMFPACK=ON `
            -DBUILD_SPQR=ON `
            -DBUILD_AMD=ON `
            -DBUILD_COLAMD=ON `
            -DBUILD_CCOLAMD=ON `
            -DBUILD_CAMD=ON `
            -DBUILD_Suitesparseconfig=ON `
            -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON
          
          cmake --build . --config Release --target install --parallel
          
          # Verify the install directory
          Write-Host "Checking install directory..."
          if (Test-Path "$env:GITHUB_WORKSPACE/install") {
            Write-Host "✓ Install directory created successfully"
            Get-ChildItem -Path "$env:GITHUB_WORKSPACE/install" -Recurse | Select-Object Name, FullName
          } else {
            Write-Host "✗ Install directory not found"
            exit 1
          }

      - name: Verify SuiteSparse build
        run: |
          Write-Host "Verifying SuiteSparse installation..."
          $installPath = Join-Path $env:GITHUB_WORKSPACE "install"
          
          if (Test-Path $installPath) {
            Write-Host "✓ Main install directory exists"
            
            # Check for essential directories
            $includePath = Join-Path $installPath "include"
            $libPath = Join-Path $installPath "lib"
            
            if (Test-Path $includePath) {
              Write-Host "✓ Include directory exists"
              Get-ChildItem $includePath | Select-Object -First 5 Name
            } else {
              Write-Host "✗ Include directory missing"
            }
            
            if (Test-Path $libPath) {
              Write-Host "✓ Library directory exists"
              Get-ChildItem $libPath | Select-Object -First 5 Name
            } else {
              Write-Host "✗ Library directory missing"
            }
          } else {
            Write-Host "✗ Install directory not found at $installPath"
            exit 1
          }

      - name: Set SuiteSparse path
        id: set-output
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE "install"
          Write-Host "Setting SuiteSparse path to: $path"
          echo "suitesparse-path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Change to workspace root and upload
        run: |
          cd $env:GITHUB_WORKSPACE
          Write-Host "Current directory: $(Get-Location)"
          Write-Host "Contents of install directory:"
          if (Test-Path "install") {
            Get-ChildItem "install" -Recurse | Select-Object Name
          } else {
            Write-Host "install directory not found!"
            exit 1
          }

      - name: Upload SuiteSparse artifacts
        uses: actions/upload-artifact@v4
        with:
          name: suitesparse-windows
          path: install/
          if-no-files-found: error
          retention-days: 1

  build-bff:
    name: Build BFF
    runs-on: windows-latest
    needs: build-suite-sparse
    steps:
      - name: Checkout BFF
        uses: actions/checkout@v4
        with:
          repository: GeometryCollective/boundary-first-flattening
          ref: v1.6
          submodules: recursive

      - name: Download SuiteSparse artifacts
        uses: actions/download-artifact@v4
        with:
          name: suitesparse-windows
          path: suitesparse-deps

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v1
        with:
          cmake-version: "3.25.x"

      - name: Install dependencies with BLAS headers
        run: |
          choco install eigen -y
          # Install OpenBLAS with development headers
          choco install openblas -y --installargs "ADDLOCAL=headers"
          choco install vcpkg -y
          vcpkg integrate install
          vcpkg install glew freeglut libpng tiff cblas lapack --triplet x64-windows

      - name: Find and Configure SuiteSparse
        run: |
          # The artifact contains bin/, include/, lib/ directly in suitesparse-deps
          $SUITESPARSE_DIR = (Resolve-Path "suitesparse-deps").Path
          Write-Host "SuiteSparse directory: $SUITESPARSE_DIR"
          
          # Verify SuiteSparse files exist
          $cholmodHeader = Join-Path $SUITESPARSE_DIR "include\suitesparse\cholmod.h"
          if (Test-Path $cholmodHeader) {
            Write-Host "✓ Found cholmod.h at: $cholmodHeader"
          } else {
            Write-Host "Checking alternative locations..."
            # Check if it's in include/ directly
            $cholmodAlt = Join-Path $SUITESPARSE_DIR "include\cholmod.h"
            if (Test-Path $cholmodAlt) {
              Write-Host "✓ Found cholmod.h at: $cholmodAlt"
            } else {
              Write-Host "✗ Missing cholmod.h"
              Write-Host "Include directory contents:"
              Get-ChildItem -Path (Join-Path $SUITESPARSE_DIR "include") -Recurse | Select-Object FullName
              exit 1
            }
          }
          
          # Create environment variable for subsequent steps
          echo "SUITESPARSE_DIR=$SUITESPARSE_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Patch BFF CMakeLists.txt
        run: |
          $SUITESPARSE_DIR = $env:SUITESPARSE_DIR
          Write-Host "Using SuiteSparse directory: $SUITESPARSE_DIR"
          
          # Note: The headers are in suitesparse-deps/include/suitesparse/
          $INCLUDE_DIR = Join-Path $SUITESPARSE_DIR "include"
          
          # Create a custom find script
          $CUSTOM_FIND = 'set(SUITESPARSE_DIR "' + $SUITESPARSE_DIR + '")\n' +
            'set(SUITESPARSE_INCLUDE_DIR "${SUITESPARSE_DIR}/include")\n' +
            'set(SUITESPARSE_LIBRARY_DIR "${SUITESPARSE_DIR}/lib")\n' +
            '\n' +
            'file(GLOB SUITESPARSE_LIBRARIES "${SUITESPARSE_LIBRARY_DIR}/*.lib")\n' +
            '\n' +
            'set(SUITESPARSE_INCLUDE_DIRS "${SUITESPARSE_INCLUDE_DIR}")\n' +
            'set(SUITESPARSE_LIBRARIES "${SUITESPARSE_LIBRARIES}")\n' +
            'set(SUITESPARSE_FOUND TRUE)\n' +
            '\n' +
            'message(STATUS "SuiteSparse manually configured:")\n' +
            'message(STATUS "  Include dir: ${SUITESPARSE_INCLUDE_DIR}")\n' +
            'message(STATUS "  Library dir: ${SUITESPARSE_LIBRARY_DIR}")\n'
          
          Set-Content -Path "FindSuiteSparseCustom.cmake" -Value $CUSTOM_FIND
          
          # Patch the main CMakeLists.txt
          $PATCH = 'find_package(Eigen3 3.2 REQUIRED)\n' +
            '\n' +
            '# Manually set SuiteSparse paths before find_package\n' +
            'set(SUITESPARSE_DIR "' + $SUITESPARSE_DIR + '")\n' +
            'set(SUITESPARSE_INCLUDE_DIR "${SUITESPARSE_DIR}/include")\n' +
            'set(SUITESPARSE_LIBRARY_DIR "${SUITESPARSE_DIR}/lib")\n' +
            '\n' +
            '# Override the find module\n' +
            'set(SuiteSparse_FOUND TRUE)\n' +
            'set(SuiteSparse_INCLUDE_DIRS "${SUITESPARSE_INCLUDE_DIR}")\n' +
            'set(SuiteSparse_LIBRARY_DIRS "${SUITESPARSE_LIBRARY_DIR}")\n' +
            '\n' +
            'file(GLOB SuiteSparse_LIBRARIES "${SUITESPARSE_LIBRARY_DIR}/*.lib")\n' +
            '\n' +
            'message(STATUS "SuiteSparse manually configured:")\n' +
            'message(STATUS "  Include dir: ${SUITESPARSE_INCLUDE_DIR}")\n' +
            'message(STATUS "  Library dir: ${SUITESPARSE_LIBRARY_DIR}")\n' +
            '\n' +
            'find_package(OpenGL REQUIRED)\n'
          
          $content = Get-Content -Path "CMakeLists.txt" -Raw
          $pattern = 'find_package\(Eigen3 3\.2 REQUIRED\)'
          $replacement = $PATCH
          $content = $content -replace $pattern, $replacement
          Set-Content -Path "CMakeLists.txt" -Value $content

      - name: Configure BFF with BLAS support
        run: |
          mkdir build
          cd build
          
          $SUITESPARSE_DIR = $env:SUITESPARSE_DIR
          $OPENBLAS_DIR = "C:\tools\openblas"
          $VCPKG_DIR = "C:\vcpkg\installed\x64-windows"
          
          # CRITICAL: Add the path to the OpenBLAS headers included with BFF
          $BFF_OPENBLAS_INCLUDE = "$env:GITHUB_WORKSPACE\deps\openblas-windows\include"
          
          Write-Host "Configuring with BFF's OpenBLAS includes at: $BFF_OPENBLAS_INCLUDE"
          
          cmake .. `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$SUITESPARSE_DIR;$VCPKG_DIR;$OPENBLAS_DIR" `
            -DCMAKE_INCLUDE_PATH="$SUITESPARSE_DIR/include;$SUITESPARSE_DIR/include/suitesparse;$BFF_OPENBLAS_INCLUDE;$OPENBLAS_DIR/include;$VCPKG_DIR/include" `
            -DCMAKE_LIBRARY_PATH="$SUITESPARSE_DIR/lib;$OPENBLAS_DIR/lib;$VCPKG_DIR/lib" `
            -DEigen3_DIR="C:\tools\eigen\share\eigen3\cmake" `
            -DOpenBLAS_INCLUDE_DIR="$BFF_OPENBLAS_INCLUDE" `
            -DOpenBLAS_DIR="$OPENBLAS_DIR" `
            -DBUILD_GUI=ON `
            -DBUILD_CLI=ON `
            -DBUILD_WITH_OPENMP=ON `
            -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON `
            -G "Visual Studio 17 2022" `
            -A x64

      - name: Build BFF without GUI first
        run: |
          cd build
          # First build the core library without GUI to isolate issues
          cmake --build . --config Release --target bff --parallel --verbose
          
          # Check if bff.lib was created
          Write-Host "Checking if bff.lib was built..."
          if (Test-Path "Release\bff.lib") {
            Write-Host "✓ bff.lib built successfully"
          } else {
            Write-Host "✗ bff.lib not found"
            exit 1
          }

      - name: Build GUI components
        run: |
          cd build
          # Now build the GUI components
          cmake --build . --config Release --target bff-viewer --parallel --verbose

      - name: Build CLI components
        run: |
          cd build
          # Build CLI if needed
          cmake --build . --config Release --target bff-command-line --parallel --verbose

      - name: Collect DLLs and package
        run: |
          mkdir -p bff-package
          
          # Copy executables (check different possible names)
          $exeNames = @("bff-viewer.exe", "BFF_GUI.exe", "bff-command-line.exe", "BFF_CLI.exe")
          foreach ($exe in $exeNames) {
            $exePath = Join-Path "build\Release" $exe
            if (Test-Path $exePath) {
              Write-Host "✓ Found executable: $exe"
              Copy-Item $exePath -Destination "bff-package/" -ErrorAction SilentlyContinue
            }
          }
          
          # Check what executables were built
          Write-Host "Checking built executables..."
          Get-ChildItem "build\Release\*.exe" | Select-Object Name
          
          # Get SuiteSparse directory from environment
          $SUITESPARSE_DIR = $env:SUITESPARSE_DIR
          
          # Copy SuiteSparse DLLs
          if (Test-Path "$SUITESPARSE_DIR/bin/*.dll") {
            Copy-Item "$SUITESPARSE_DIR/bin/*.dll" -Destination "bff-package/" -ErrorAction SilentlyContinue
          }
          
          # Copy OpenBLAS DLLs
          $openblasDll = "C:\tools\openblas\bin\libopenblas.dll"
          if (Test-Path $openblasDll) {
            Copy-Item $openblasDll -Destination "bff-package/" -ErrorAction SilentlyContinue
          }
          
          # Copy common runtime DLLs
          $systemDlls = @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll", "concrt140.dll")
          foreach ($dll in $systemDlls) {
            $systemPath = Join-Path "C:\Windows\System32" $dll
            if (Test-Path $systemPath) {
              Copy-Item $systemPath -Destination "bff-package/" -ErrorAction SilentlyContinue
            }
          }
          
          # Copy vcpkg DLLs
          $vcpkgBin = "C:\vcpkg\installed\x64-windows\bin"
          if (Test-Path $vcpkgBin) {
            # Copy common graphics DLLs
            $graphicsDlls = @("glew32.dll", "freeglut.dll", "libpng16.dll", "tiff.dll", "zlib1.dll")
            foreach ($dll in $graphicsDlls) {
              $dllPath = Join-Path $vcpkgBin $dll
              if (Test-Path $dllPath) {
                Copy-Item $dllPath -Destination "bff-package/" -ErrorAction SilentlyContinue
              }
            }
          }
          
          # Create README
          $README = 'Boundary First Flattening (BFF) v1.6 Windows Build\n' +
            '=================================================\n' +
            '\n' +
            'This package contains:\n' +
            '1. bff-viewer.exe - The graphical user interface\n' +
            '2. bff-command-line.exe - Command line interface\n' +
            '3. All required DLL dependencies\n' +
            '\n' +
            'Requirements:\n' +
            '- Windows 10 or later\n' +
            '- Visual C++ Redistributable 2022\n' +
            '\n' +
            'Usage:\n' +
            '1. Double-click bff-viewer.exe to launch the application\n' +
            '2. Use File menu to open OBJ files\n' +
            '\n' +
            'Note: This is an automated build from GitHub Actions.\n'
          
          Set-Content -Path "bff-package/README.txt" -Value $README
          
          # List package contents
          Write-Host "Package contents:"
          Get-ChildItem "bff-package/" -Recurse | Select-Object Name

      - name: Upload BFF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bff-windows-gui
          path: bff-package/
          if-no-files-found: error
          retention-days: 7

      - name: Create release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: bff-package/*
          draft: true
          prerelease: false
