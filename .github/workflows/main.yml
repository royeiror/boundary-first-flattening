name: Build BFF v1.6 for Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  BUILD_TYPE: "Release"

jobs:
  build-suite-sparse:
    name: Build SuiteSparse
    runs-on: windows-latest
    outputs:
      suitesparse-path: ${{ steps.set-output.outputs.suitesparse-path }}
    steps:
      - name: Checkout SuiteSparse
        uses: actions/checkout@v4
        with:
          repository: jlblancoc/suitesparse-metis-for-windows
          path: suitesparse-src

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v1
        with:
          cmake-version: "3.25.x"

      - name: Build SuiteSparse (Static with OpenBLAS)
        run: |
          mkdir suitesparse-build
          cd suitesparse-build
          
          cmake ../suitesparse-src `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE/install" `
            -DBLA_VENDOR=OpenBLAS `
            -DENABLE_CUDA=OFF `
            -DBUILD_METIS=ON `
            -DBUILD_CHOLMOD=ON `
            -DBUILD_UMFPACK=ON `
            -DBUILD_SPQR=ON `
            -DBUILD_AMD=ON `
            -DBUILD_COLAMD=ON `
            -DBUILD_CCOLAMD=ON `
            -DBUILD_CAMD=ON `
            -DBUILD_Suitesparseconfig=ON `
            -DBUILD_SHARED_LIBS=OFF `
            -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=OFF
          
          cmake --build . --config Release --target install --parallel

      - name: Set SuiteSparse path
        id: set-output
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE "install"
          Write-Host "Setting SuiteSparse path to: $path"
          echo "suitesparse-path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload SuiteSparse artifacts
        uses: actions/upload-artifact@v4
        with:
          name: suitesparse-windows-static
          path: install/
          if-no-files-found: error
          retention-days: 1

  build-bff:
    name: Build BFF GUI Application
    runs-on: windows-latest
    needs: build-suite-sparse
    steps:
      - name: Checkout BFF v1.6 with Submodules
        uses: actions/checkout@v4
        with:
          repository: GeometryCollective/boundary-first-flattening
          ref: v1.6
          submodules: recursive

      - name: Download SuiteSparse artifacts
        uses: actions/download-artifact@v4
        with:
          name: suitesparse-windows-static
          path: suitesparse-deps

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v1
        with:
          cmake-version: "3.25.x"

      - name: Debug SuiteSparse structure
        run: |
          Write-Host "=== Checking SuiteSparse artifact structure ==="
          $SUITESPARSE_DIR = (Resolve-Path "suitesparse-deps").Path
          Write-Host "SuiteSparse directory: $SUITESPARSE_DIR"
          
          Write-Host "`nInclude directory contents:"
          if (Test-Path "$SUITESPARSE_DIR/include") {
            Get-ChildItem "$SUITESPARSE_DIR/include" -Recurse -File | Select-Object -First 30 Name
          } else {
            Write-Host "Include directory not found!"
            Get-ChildItem "$SUITESPARSE_DIR" -Recurse | Where-Object { $_.Name -match "\.h$" } | Select-Object -First 20 FullName
          }
          
          Write-Host "`nLib directory contents:"
          if (Test-Path "$SUITESPARSE_DIR/lib") {
            Get-ChildItem "$SUITESPARSE_DIR/lib" -File | Select-Object Name
          }
          
          # Check if headers are in suitesparse/ subdirectory
          if (Test-Path "$SUITESPARSE_DIR/include/suitesparse") {
            Write-Host "`nHeaders found in suitesparse/ subdirectory:"
            Get-ChildItem "$SUITESPARSE_DIR/include/suitesparse" -Filter "*.h" | Select-Object -First 10 Name
          }
          
          # Set environment variable for later steps
          echo "SUITESPARSE_DIR=$SUITESPARSE_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create blas.lib symlink for OpenBLAS
        run: |
          $openblasLib = "$env:GITHUB_WORKSPACE\deps\openblas-windows\lib\libopenblas.lib"
          $blasSymlink = "$env:GITHUB_WORKSPACE\deps\openblas-windows\lib\blas.lib"
          
          if (Test-Path $openblasLib) {
            New-Item -ItemType SymbolicLink -Path $blasSymlink -Target $openblasLib -Force
            Write-Host "✓ Created blas.lib symlink to libopenblas.lib"
          } else {
            Write-Host "✗ libopenblas.lib not found at: $openblasLib"
            Get-ChildItem "$env:GITHUB_WORKSPACE\deps\openblas-windows\lib\" -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Patch BFF Source Files for cblas.h
        shell: pwsh
        run: |
          # Patch cblas.h includes in all relevant files
          $cblasPath = "$env:GITHUB_WORKSPACE\deps\openblas-windows\include\cblas.h"
          $relativePath = "../../deps/openblas-windows/include/cblas.h"
          
          Write-Host "cblas.h location: $cblasPath"
          
          if (Test-Path $cblasPath) {
            Write-Host "✓ Found cblas.h"
            
            # Files that need patching
            $filesToPatch = @(
              "$env:GITHUB_WORKSPACE\include\bff\linear-algebra\Common.h",
              "$env:GITHUB_WORKSPACE\include\bff\linear-algebra\DenseMatrix.inl",
              "$env:GITHUB_WORKSPACE\include\bff\linear-algebra\Cholesky.inl"
            )
            
            foreach ($file in $filesToPatch) {
              if (Test-Path $file) {
                $content = Get-Content $file -Raw
                $newContent = $content -replace '#include <cblas\.h>', "#include `"$relativePath`""
                $newContent = $newContent -replace '#include "cblas\.h"', "#include `"$relativePath`""
                
                if ($newContent -ne $content) {
                  Set-Content $file -Value $newContent -NoNewline
                  Write-Host "✓ Patched $((Get-Item $file).Name) for cblas.h"
                } else {
                  Write-Host "⚠ No cblas.h include found in $((Get-Item $file).Name)"
                }
              } else {
                Write-Host "⚠ File not found: $file"
              }
            }
            
          } else {
            Write-Host "✗ cblas.h not found at expected location"
            exit 1
          }

      - name: Patch Common.h for SuiteSparse headers
        shell: pwsh
        run: |
          # Patch Common.h to include suitesparse/cholmod.h
          $CommonHeader = "$env:GITHUB_WORKSPACE\include\bff\linear-algebra\Common.h"
          
          if (Test-Path $CommonHeader) {
            Write-Host "Patching Common.h at: $CommonHeader"
            
            $content = Get-Content $CommonHeader -Raw
            
            # First, check what the current include looks like
            Write-Host "Current cholmod.h include line:"
            $content -split "`n" | Where-Object { $_ -match 'cholmod\.h' } | ForEach-Object { Write-Host "  $_" }
            
            # Replace #include <cholmod.h> with #include <suitesparse/cholmod.h>
            $newContent = $content -replace '#include <cholmod\.h>', '#include <suitesparse/cholmod.h>'
            
            if ($newContent -ne $content) {
              Set-Content $CommonHeader -Value $newContent -NoNewline
              Write-Host "✓ Patched Common.h to include suitesparse/cholmod.h"
            } else {
              # Try alternative pattern
              $newContent = $content -replace '#include "cholmod\.h"', '#include <suitesparse/cholmod.h>'
              if ($newContent -ne $content) {
                Set-Content $CommonHeader -Value $newContent -NoNewline
                Write-Host "✓ Patched Common.h (alternative pattern)"
              } else {
                Write-Host "⚠ Could not find cholmod.h include to patch in Common.h"
                # Add it manually if not found
                if ($content -notmatch 'suitesparse/cholmod') {
                  $newContent = $content -replace '(#include.*)', '#include <suitesparse/cholmod.h>' + "`n" + '$1'
                  Set-Content $CommonHeader -Value $newContent -NoNewline
                  Write-Host "✓ Added suitesparse/cholmod.h include to Common.h"
                }
              }
            }
          } else {
            Write-Host "⚠ Common.h not found at: $CommonHeader"
          }

      - name: Add BFF_API Export Macros
        shell: pwsh
        run: |
          # Find Common.h
          $commonHeader = "$env:GITHUB_WORKSPACE\include\bff\linear-algebra\Common.h"
          
          if (Test-Path $commonHeader) {
            Write-Host "Found Common.h at: $commonHeader"
            
            # Add BFF_API definition to Common.h
            $content = Get-Content $commonHeader -Raw
            $apiMacro = "#ifdef _WIN32" + "`n" +
              "#ifdef BFF_EXPORTS" + "`n" +
              "#define BFF_API __declspec(dllexport)" + "`n" +
              "#else" + "`n" +
              "#define BFF_API __declspec(dllimport)" + "`n" +
              "#endif" + "`n" +
              "#else" + "`n" +
              "#define BFF_API" + "`n" +
              "#endif" + "`n" +
              "`n"
            
            # Only add if not already present
            if ($content -notmatch 'BFF_API') {
              $content = $apiMacro + $content
              Set-Content $commonHeader -Value $content -NoNewline
              Write-Host "✓ Added BFF_API macros to Common.h"
            } else {
              Write-Host "✓ BFF_API macros already present in Common.h"
            }
          } else {
            Write-Host "⚠ Common.h not found"
          }
          
          # Find and patch Common.cpp
          $commonSource = "$env:GITHUB_WORKSPACE\src\linear-algebra\Common.cpp"
          
          if (Test-Path $commonSource) {
            Write-Host "Found Common.cpp at: $commonSource"
            $sourceContent = Get-Content $commonSource -Raw
            # Add BFF_EXPORTS define if not present
            if ($sourceContent -notmatch 'BFF_EXPORTS') {
              $sourceContent = "#define BFF_EXPORTS" + "`n" + $sourceContent
              Set-Content $commonSource -Value $sourceContent -NoNewline
              Write-Host "✓ Added BFF_EXPORTS to Common.cpp"
            }
          }

      - name: Clean build directory
        run: |
          if (Test-Path "build") {
            Remove-Item -Recurse -Force "build" -ErrorAction SilentlyContinue
          }
          mkdir build

      - name: Copy SuiteSparse headers to include/suitesparse if needed
        run: |
          $SUITESPARSE_DIR = $env:SUITESPARSE_DIR
          $targetDir = "$env:GITHUB_WORKSPACE\include\suitesparse"
          
          # Check if headers are in suitesparse/ subdirectory
          if (Test-Path "$SUITESPARSE_DIR/include/suitesparse") {
            Write-Host "Headers are already in suitesparse/ subdirectory"
          } else {
            # Create suitesparse directory in BFF include
            New-Item -ItemType Directory -Force -Path $targetDir
            
            # Copy all headers from SuiteSparse include
            if (Test-Path "$SUITESPARSE_DIR/include") {
              Copy-Item "$SUITESPARSE_DIR/include/*.h" -Destination $targetDir -ErrorAction SilentlyContinue
              Copy-Item "$SUITESPARSE_DIR/include/*.hpp" -Destination $targetDir -ErrorAction SilentlyContinue
              
              # Also copy any subdirectories
              Get-ChildItem "$SUITESPARSE_DIR/include" -Directory | ForEach-Object {
                $subDir = $_.Name
                Copy-Item "$SUITESPARSE_DIR/include/$subDir/*" -Destination "$targetDir/" -Recurse -ErrorAction SilentlyContinue
              }
              Write-Host "✓ Copied SuiteSparse headers to $targetDir"
            }
          }

      - name: Configure BFF with CMake (Manual SuiteSparse setup)
        run: |
          cd build
          
          $SUITESPARSE_DIR = $env:SUITESPARSE_DIR
          $BFF_OPENBLAS_INCLUDE = "$env:GITHUB_WORKSPACE\deps\openblas-windows\include"
          $BFF_OPENBLAS_LIB = "$env:GITHUB_WORKSPACE\deps\openblas-windows\lib"
          
          Write-Host "SuiteSparse directory: $SUITESPARSE_DIR"
          Write-Host "OpenBLAS include: $BFF_OPENBLAS_INCLUDE"
          Write-Host "OpenBLAS lib: $BFF_OPENBLAS_LIB"
          
          # Create a simple CMakeLists.txt patch file
          $PATCH_FILE = "SuiteSparsePatch.cmake"
          $PATCH_CONTENT = 'set(SuiteSparse_FOUND TRUE)' + "`n" +
            'set(SuiteSparse_INCLUDE_DIRS "' + $SUITESPARSE_DIR + '/include")' + "`n" +
            'set(SuiteSparse_LIBRARY_DIRS "' + $SUITESPARSE_DIR + '/lib")' + "`n" +
            'set(SuiteSparse_LIBRARIES' + "`n" +
            '  "' + $SUITESPARSE_DIR + '/lib/libamd.lib"' + "`n" +
            '  "' + $SUITESPARSE_DIR + '/lib/libcamd.lib"' + "`n" +
            '  "' + $SUITESPARSE_DIR + '/lib/libccolamd.lib"' + "`n" +
            '  "' + $SUITESPARSE_DIR + '/lib/libcolamd.lib"' + "`n" +
            '  "' + $SUITESPARSE_DIR + '/lib/libcholmod.lib"' + "`n" +
            '  "' + $SUITESPARSE_DIR + '/lib/libspqr.lib"' + "`n" +
            '  "' + $SUITESPARSE_DIR + '/lib/libldl.lib"' + "`n" +
            '  "' + $SUITESPARSE_DIR + '/lib/libbtf.lib"' + "`n" +
            '  "' + $SUITESPARSE_DIR + '/lib/libklu.lib"' + "`n" +
            '  "' + $SUITESPARSE_DIR + '/lib/libcxsparse.lib"' + "`n" +
            '  "' + $SUITESPARSE_DIR + '/lib/libumfpack.lib"' + "`n" +
            '  "' + $SUITESPARSE_DIR + '/lib/suitesparseconfig.lib"' + "`n" +
            ')' + "`n"
          
          Set-Content -Path $PATCH_FILE -Value $PATCH_CONTENT
          Write-Host "✓ Created SuiteSparse patch file"
          
          # Configure with explicit settings
          cmake .. `
            -DCMAKE_BUILD_TYPE=Release `
            -DSUITESPARSE_DIR="$SUITESPARSE_DIR" `
            -DSUITESPARSE_INCLUDE_DIR="$SUITESPARSE_DIR/include" `
            -DSUITESPARSE_LIBRARY_DIR="$SUITESPARSE_DIR/lib" `
            -DBLAS_INCLUDE_DIR="$BFF_OPENBLAS_INCLUDE" `
            -DBLAS_LIBRARIES="$BFF_OPENBLAS_LIB/blas.lib" `
            -DBLA_VENDOR=OpenBLAS `
            -DBUILD_GUI=ON `
            -DBUILD_CLI=ON `
            -DBUILD_SHARED_LIBS=OFF `
            -DBFF_EXPORTS=ON `
            -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=OFF `
            -G "Visual Studio 17 2022" `
            -A x64

      - name: Patch NanoGUI for Static Build
        run: |
          $NanoGUICMake = "$env:GITHUB_WORKSPACE\deps\nanogui\CMakeLists.txt"
          
          if (Test-Path $NanoGUICMake) {
            $content = Get-Content $NanoGUICMake -Raw
            
            if ($content -notmatch "BUILD_SHARED_LIBS OFF") {
              $patchText = "`n`n" + 
                "# Force static build for Windows compatibility" + "`n" +
                "set(BUILD_SHARED_LIBS OFF CACHE BOOL `"Build static libraries`" FORCE)" + "`n" +
                "set(CMAKE_WINDOWS_EXPORT_ALL_SYMBOLS OFF CACHE BOOL `"Disable auto-export`" FORCE)"
              
              Set-Content $NanoGUICMake -Value ($content + $patchText) -NoNewline
              Write-Host "✓ Added static build configuration to NanoGUI CMakeLists.txt"
            }
          }

      - name: Build BFF core library first
        run: |
          cd build
          cmake --build . --config Release --target bff --parallel --verbose

      - name: Build BFF Viewer
        run: |
          cd build
          cmake --build . --config Release --target bff-viewer --parallel --verbose

      - name: Gather Runtime Dependencies
        shell: pwsh
        run: |
          $exePath = "$env:GITHUB_WORKSPACE\build\Release\bff-viewer.exe"
          
          if (-not (Test-Path $exePath)) {
            Write-Host "✗ bff-viewer.exe not found at: $exePath"
            exit 1
          }
          
          Write-Host "✓ Found bff-viewer.exe"
          
          # Create distribution directory
          New-Item -ItemType Directory -Force -Path "dist"
          Copy-Item $exePath -Destination "dist\"
          
          # Copy required DLLs
          $dllSources = @(
            "$env:GITHUB_WORKSPACE\deps\openblas-windows\lib\*.dll",
            "C:\Windows\System32\vcruntime140.dll",
            "C:\Windows\System32\msvcp140.dll",
            "C:\Windows\System32\vcruntime140_1.dll"
          )
          
          foreach ($source in $dllSources) {
            if (Test-Path $source -ErrorAction SilentlyContinue) {
              Copy-Item $source -Destination "dist\" -ErrorAction SilentlyContinue
              Write-Host "✓ Copied DLLs from: $source"
            }
          }
          
          # Copy NanoGUI DLL if it exists
          $nanoguiDll = "$env:GITHUB_WORKSPACE\build\deps\nanogui\Release\nanogui.dll"
          if (Test-Path $nanoguiDll) {
            Copy-Item $nanoguiDll -Destination "dist\"
            Write-Host "✓ Copied NanoGUI DLL"
          }

      - name: Create Final Package
        run: |
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\dist\*" -DestinationPath "bff-viewer-windows.zip"

      - name: Upload BFF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bff-viewer-windows
          path: bff-viewer-windows.zip
          retention-days: 7

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: bff-viewer-windows.zip
          draft: false
          prerelease: false
