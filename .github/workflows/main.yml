name: Build BFF for Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [created]
  workflow_dispatch:

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-windows

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install vcpkg and dependencies
      shell: powershell
      run: |
        # Install vcpkg
        git clone https://github.com/Microsoft/vcpkg.git $env:VCPKG_ROOT
        & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"
        
        # Install required dependencies
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET eigen3
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET libigl
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET suitesparse
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET metis
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glfw3
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glew
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET freeglut
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glm

    - name: Download pre-built SuiteSparse-METIS
      shell: powershell
      run: |
        # Instead of building from source, let's use the pre-built binaries
        # from the releases page mentioned in the instructions
        Write-Host "Looking for pre-built SuiteSparse-METIS..."
        
        # Create directories
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse"
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse\include"
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse\lib"
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse\bin"
        
        # Since the exact download URL is problematic, let's check what vcpkg installed
        Write-Host "Checking what vcpkg installed for SuiteSparse..."
        $vcpkgInstalled = "$env:VCPKG_ROOT\installed\$env:VCPKG_DEFAULT_TRIPLET"
        if (Test-Path $vcpkgInstalled) {
          Write-Host "Looking for SuiteSparse in vcpkg installed directory..."
          
          # Copy include files
          if (Test-Path "$vcpkgInstalled\include") {
            Copy-Item -Path "$vcpkgInstalled\include\*" -Destination "C:\SuiteSparse\include\" -Recurse -Force
            Write-Host "Copied include files from vcpkg"
          }
          
          # Copy library files
          if (Test-Path "$vcpkgInstalled\lib") {
            $libFiles = Get-ChildItem -Path "$vcpkgInstalled\lib" -Filter "*metis*" -Recurse
            foreach ($file in $libFiles) {
              Copy-Item -Path $file.FullName -Destination "C:\SuiteSparse\lib\" -Force
              Write-Host "Copied: $($file.Name)"
            }
          }
        }

    - name: Create simple CMakeLists.txt
      shell: powershell
      run: |
        # Create a very simple CMakeLists.txt that uses the original BFF structure
        $cmakeContent = @"
cmake_minimum_required(VERSION 3.15)
project(BFF)

set(CMAKE_CXX_STANDARD 17)
set(CMAKE_CXX_STANDARD_REQUIRED ON)

# Use vcpkg
set(CMAKE_TOOLCHAIN_FILE "\$ENV{VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake")

# Find packages
find_package(Eigen3 REQUIRED)
find_package(SuiteSparse REQUIRED)
find_package(METIS REQUIRED)
find_package(OpenGL REQUIRED)
find_package(glfw3 REQUIRED)
find_package(GLEW REQUIRED)

# Include directories
include_directories(
    \${CMAKE_SOURCE_DIR}/include
    \${CMAKE_SOURCE_DIR}/deps/libigl/include
    \${CMAKE_SOURCE_DIR}/deps/spectra/include
    \${Eigen3_INCLUDE_DIRS}
    \${SuiteSparse_INCLUDE_DIRS}
    \${METIS_INCLUDE_DIRS}
)

# Find source files
file(GLOB_RECURSE SRC_FILES "src/*.cpp")
file(GLOB_RECURSE SRC_HEADERS "src/*.h")

if(NOT SRC_FILES)
    message(FATAL_ERROR "No source files found in src/ directory")
endif()

# Create library
add_library(bff-lib STATIC \${SRC_FILES})

# Link libraries
target_link_libraries(bff-lib
    \${SuiteSparse_LIBRARIES}
    \${METIS_LIBRARIES}
)

# GUI executable
file(GLOB_RECURSE GUI_FILES "apps/*.cpp")
if(GUI_FILES)
    add_executable(bff-gui \${GUI_FILES})
    target_link_libraries(bff-gui bff-lib 
        \${OPENGL_LIBRARIES}
        glfw
        \${GLEW_LIBRARIES}
    )
    message(STATUS "Building GUI application")
endif()

# CLI executable  
file(GLOB_RECURSE CLI_FILES "binaries/*.cpp")
if(CLI_FILES)
    add_executable(bff-cli \${CLI_FILES})
    target_link_libraries(bff-cli bff-lib)
    message(STATUS "Building CLI application")
endif()
"@
        
        # Write to file
        $cmakeContent | Out-File -FilePath "CMakeLists.txt" -Encoding UTF8 -Force
        Write-Host "Created CMakeLists.txt"

    - name: Check if we need to clone BFF
      shell: powershell
      run: |
        # Check if we have the BFF source files
        if (-not (Test-Path "src") -and -not (Test-Path "apps")) {
          Write-Host "BFF source not found, cloning v1.6..."
          git clone --recursive --branch v1.6 https://github.com/GeometryCollective/boundary-first-flattening.git bff-temp
          # Copy everything except .git
          Get-ChildItem -Path "bff-temp" -Exclude ".git" | Copy-Item -Destination "." -Recurse -Force
        }
        
        # Check what we have
        Write-Host "Current directory contents:"
        Get-ChildItem | Format-Table Name, Mode
        
        Write-Host "`nChecking for source files:"
        if (Test-Path "src") {
          Write-Host "src directory exists with $( @(Get-ChildItem -Path "src" -Recurse -Filter "*.cpp").Count ) .cpp files"
        }
        if (Test-Path "apps") {
          Write-Host "apps directory exists with $( @(Get-ChildItem -Path "apps" -Recurse -Filter "*.cpp").Count ) .cpp files"
        }

    - name: Configure CMake
      shell: powershell
      run: |
        # Create build directory
        New-Item -ItemType Directory -Force -Path "build"
        
        Write-Host "Configuring CMake with vcpkg toolchain..."
        Write-Host "VCPKG_ROOT: $env:VCPKG_ROOT"
        
        # Configure with CMake
        cmake -B build `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=$env:VCPKG_DEFAULT_TRIPLET `
          -G "Visual Studio 17 2022" `
          -A x64

    - name: Build BFF
      shell: powershell
      run: |
        Write-Host "Building project..."
        cmake --build build --config Release --parallel 4

    - name: Find and copy executables
      shell: powershell
      run: |
        # Create distribution directory
        New-Item -ItemType Directory -Force -Path "dist"
        
        Write-Host "Searching for executables..."
        
        # Search for executables
        $exes = Get-ChildItem -Path "build" -Filter "*.exe" -Recurse
        foreach ($exe in $exes) {
          Write-Host "Found executable: $($exe.FullName)"
          Copy-Item -Path $exe.FullName -Destination "dist\" -Force
        }
        
        # Copy DLLs
        $vcpkgBinPath = "$env:VCPKG_ROOT\installed\$env:VCPKG_DEFAULT_TRIPLET\bin"
        if (Test-Path $vcpkgBinPath) {
          Write-Host "Copying DLLs from vcpkg..."
          Get-ChildItem -Path $vcpkgBinPath -Filter "*.dll" | Copy-Item -Destination "dist\" -Force
        }
        
        # List what we have
        Write-Host "`nFiles in dist directory:"
        Get-ChildItem -Path "dist"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BFF-Windows-Binaries
        path: dist/

    - name: Create release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/**
        generate_release_notes: true
