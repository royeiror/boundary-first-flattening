name: Build BFF Viewer

on: workflow_dispatch

jobs:
  build-viewer:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Install vcpkg
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg install suitesparse:x64-windows
        
    - name: Create separate directory for SuiteSparse headers
      run: |
        # Don't touch the original include/ directory!
        # Create a separate directory for SuiteSparse headers
        if (Test-Path "suitesparse_include") {
            Remove-Item -Recurse -Force suitesparse_include
        }
        mkdir suitesparse_include
        
        # Copy SuiteSparse headers to separate directory
        Copy-Item "vcpkg/installed/x64-windows/include/*.h" "suitesparse_include/" -ErrorAction SilentlyContinue
        
    - name: Patch Common.h to look in suitesparse_include
      run: |
        # Update Common.h to look for cholmod.h in suitesparse_include
        $commonFile = "include/bff/linear-algebra/Common.h"
        if (Test-Path $commonFile) {
            $content = Get-Content $commonFile -Raw
            # Change to look in suitesparse_include directory
            $newContent = $content -replace '#include "cholmod.h"', '#include "../../../suitesparse_include/cholmod.h"'
            $newContent | Set-Content $commonFile
            echo "Updated Common.h"
        }
        
    - name: Create FindSuiteSparse.cmake
      run: |
        # Simple correct file
        "set(SuiteSparse_FOUND TRUE)" | Out-File cmake/FindSuiteSparse.cmake -Encoding UTF8
        "set(SuiteSparse_INCLUDE_DIRS `"\${CMAKE_CURRENT_SOURCE_DIR}/suitesparse_include`")" | Out-File -Append cmake/FindSuiteSparse.cmake -Encoding UTF8
        "set(SuiteSparse_LIBRARIES cholmod)" | Out-File -Append cmake/FindSuiteSparse.cmake -Encoding UTF8
        
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1
      
    - name: Configure CMake
      run: |
        cmake -B build -DBFF_BUILD_GUI=ON -DCMAKE_BUILD_TYPE=Release
        
    - name: Build
      run: |
        cmake --build build --config Release
        
    - name: Check results
      run: |
        if (Test-Path "build/Release/bff-viewer.exe") {
            echo "✅ SUCCESS: bff-viewer.exe built!"
            echo "Size: $((Get-Item 'build/Release/bff-viewer.exe').Length) bytes"
        } else {
            echo "❌ Viewer not found"
        }
