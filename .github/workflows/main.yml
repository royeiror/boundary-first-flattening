name: Build BFF Viewer

on: workflow_dispatch

jobs:
  build-viewer:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Install vcpkg with SuiteSparse
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg install suitesparse:x64-windows
        .\vcpkg\vcpkg install lapack-reference:x64-windows
        
    - name: Create FindSuiteSparse.cmake via PowerShell script
      run: |
        # Create a PowerShell script that writes the file
        $script = @'
$vcpkgPath = "$env:GITHUB_WORKSPACE/vcpkg/installed/x64-windows" -replace '\\', '/'

$cmakeContent = @"
# FindSuiteSparse.cmake for vcpkg
set(SuiteSparse_FOUND TRUE)

# Base directories
set(SuiteSparse_INCLUDE_DIR "$vcpkgPath/include")
set(SuiteSparse_LIBRARY_DIR "$vcpkgPath/lib")

# Mark all components as found
set(SuiteSparse_AMD_FOUND TRUE)
set(SuiteSparse_CAMD_FOUND TRUE)
set(SuiteSparse_COLAMD_FOUND TRUE)
set(SuiteSparse_CCOLAMD_FOUND TRUE)
set(SuiteSparse_CHOLMOD_FOUND TRUE)
set(SuiteSparse_UMFPACK_FOUND TRUE)
set(SuiteSparse_SPQR_FOUND TRUE)
set(SuiteSparse_KLU_FOUND TRUE)
set(SuiteSparse_LDL_FOUND TRUE)
set(SuiteSparse_BTF_FOUND TRUE)
set(SuiteSparse_CXSPARSE_FOUND TRUE)
set(SuiteSparse_SUITESPARSECONFIG_FOUND TRUE)

# Libraries
set(SuiteSparse_CHOLMOD_LIBRARY "$vcpkgPath/lib/cholmod.lib")
set(SuiteSparse_AMD_LIBRARY "$vcpkgPath/lib/amd.lib")
set(SuiteSparse_CAMD_LIBRARY "$vcpkgPath/lib/camd.lib")
set(SuiteSparse_COLAMD_LIBRARY "$vcpkgPath/lib/colamd.lib")
set(SuiteSparse_CCOLAMD_LIBRARY "$vcpkgPath/lib/ccolamd.lib")
set(SuiteSparse_UMFPACK_LIBRARY "$vcpkgPath/lib/umfpack.lib")
set(SuiteSparse_SPQR_LIBRARY "$vcpkgPath/lib/spqr.lib")

# BLAS/LAPACK
set(SuiteSparse_BLAS_LIBRARY "$vcpkgPath/lib/openblas.lib")
set(SuiteSparse_LAPACK_LIBRARY "$vcpkgPath/lib/lapack.lib")

message(STATUS "SuiteSparse configured via vcpkg")
"@

$cmakeContent | Set-Content "cmake/FindSuiteSparse.cmake" -Encoding UTF8
Write-Host "Created FindSuiteSparse.cmake"
'@
        
        $script | Out-File create_findsuitesparse.ps1 -Encoding UTF8
        .\create_findsuitesparse.ps1
        
    - name: Copy headers
      run: |
        $vcpkgPath = "$env:GITHUB_WORKSPACE/vcpkg/installed/x64-windows"
        
        # Create include directory
        mkdir include -Force
        
        # Copy all headers we can find
        Get-ChildItem "$vcpkgPath/include" -Filter "*.h" -Recurse | ForEach-Object {
            Copy-Item $_.FullName "include/$($_.Name)" -Force
        }
        
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1
      
    - name: Configure CMake
      run: |
        cmake -B build -DBFF_BUILD_GUI=ON -DCMAKE_BUILD_TYPE=Release
        
    - name: Build
      run: |
        cmake --build build --config Release
        
    - name: Check results
      run: |
        dir build -Recurse -Filter *.exe
