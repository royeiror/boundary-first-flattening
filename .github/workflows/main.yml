name: Build and Test BFF Viewer

on: workflow_dispatch

jobs:
  build-test:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Install SuiteSparse (Windows - alternative)
      run: |
        echo "Installing SuiteSparse dependencies..."
        # Download SuiteSparse from a working source
        # Using vcpkg to install SuiteSparse
        git clone https://github.com/Microsoft/vcpkg.git
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg install suitesparse:x64-windows
        
        # Set environment variables for CMake
        echo "VCPKG_ROOT=$env:GITHUB_WORKSPACE\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
        echo "CMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Append
      
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1
      
    - name: Configure CMake with vcpkg
      run: |
        echo "Configuring CMake with vcpkg toolchain..."
        cmake -B build `
          -DBFF_BUILD_GUI=ON `
          -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake"
        
    - name: Build the project
      run: |
        echo "Building project..."
        cmake --build build --config Release
        
    - name: Check if viewer was built
      run: |
        echo "=== Looking for built viewer executable ==="
        if (Test-Path "build/Release/bff-viewer.exe") {
            echo "✅ Viewer found at: build/Release/bff-viewer.exe"
            Get-Item "build/Release/bff-viewer.exe"
        } elseif (Test-Path "build/bff-viewer.exe") {
            echo "✅ Viewer found at: build/bff-viewer.exe"
            Get-Item "build/bff-viewer.exe"
        } else {
            echo "❌ Viewer not found in expected locations"
        }
