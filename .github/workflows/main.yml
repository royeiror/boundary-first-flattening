name: Build BFF Viewer

on: workflow_dispatch

jobs:
  build-viewer:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Install vcpkg
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        .\vcpkg\bootstrap-vcpkg.bat
        
    - name: Patch FindSuiteSparse.cmake directly
      run: |
        # Use simple string replacement without any @ symbols
        (Get-Content -Path "cmake/FindSuiteSparse.cmake" -Raw) -replace 'SuiteSparse required but some headers or libs not found\.', '# SuiteSparse requirement disabled for CI' | Set-Content -Path "cmake/FindSuiteSparse.cmake"
        
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1
      
    - name: Configure CMake
      run: |
        cmake -B build -DBFF_BUILD_GUI=ON -DCMAKE_BUILD_TYPE=Release
        
    - name: Build
      run: |
        cmake --build build --config Release
        
    - name: Check results
      run: |
        Get-ChildItem -Path build -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue
