name: Build BFF Viewer

on: workflow_dispatch

jobs:
  build-viewer:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Install vcpkg
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg install suitesparse:x64-windows
        
    - name: Create stub header
      run: |
        # Check if include exists, create if not
        if (-not (Test-Path "include")) {
            mkdir include
        }
        
        # Write stub directly
        "// cholmod_stub.h" | Out-File cholmod_stub.h
        "#ifndef CHOLMOD_STUB_H" | Out-File -Append cholmod_stub.h
        "#define CHOLMOD_STUB_H" | Out-File -Append cholmod_stub.h
        "" | Out-File -Append cholmod_stub.h
        "#include `"cholmod.h`"" | Out-File -Append cholmod_stub.h
        "" | Out-File -Append cholmod_stub.h
        "// Dummy definitions" | Out-File -Append cholmod_stub.h
        "#define cholmod_norm_dense 0" | Out-File -Append cholmod_stub.h
        "#define cholmod_norm_sparse 0" | Out-File -Append cholmod_stub.h
        "#define cholmod_submatrix 0" | Out-File -Append cholmod_stub.h
        "#define cholmod_scale 0" | Out-File -Append cholmod_stub.h
        "#define cholmod_ssmult 0" | Out-File -Append cholmod_stub.h
        "#define cholmod_sdmult 0" | Out-File -Append cholmod_stub.h
        "#define CHOLMOD_SCALAR 0" | Out-File -Append cholmod_stub.h
        "" | Out-File -Append cholmod_stub.h
        "#endif" | Out-File -Append cholmod_stub.h
        
    - name: Update Common.h
      run: |
        $file = "include/bff/linear-algebra/Common.h"
        if (Test-Path $file) {
            $lines = Get-Content $file
            $newLines = @()
            
            foreach ($line in $lines) {
                $newLines += $line
                if ($line -match '#include "cholmod.h"') {
                    $newLines += '#include "cholmod_stub.h"'
                }
            }
            
            $newLines | Set-Content $file
        }
        
    - name: Copy vcpkg headers
      run: |
        # Copy headers if they exist
        $source = "vcpkg/installed/x64-windows/include"
        if (Test-Path $source) {
            Copy-Item "$source/*.h" "include/" -ErrorAction SilentlyContinue
        }
        
    - name: Create FindSuiteSparse.cmake
      run: |
        # Use simple relative paths
        "set(SuiteSparse_FOUND TRUE)" | Out-File cmake/FindSuiteSparse.cmake -Encoding UTF8
        "set(SuiteSparse_INCLUDE_DIR `"\${CMAKE_CURRENT_SOURCE_DIR}/include`")" | Out-File -Append cmake/FindSuiteSparse.cmake -Encoding UTF8
        "set(SuiteSparse_CHOLMOD_LIBRARY `"cholmod`")" | Out-File -Append cmake/FindSuiteSparse.cmake -Encoding UTF8
        
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1
      
    - name: Configure CMake
      run: |
        cmake -B build -DBFF_BUILD_GUI=ON -DCMAKE_BUILD_TYPE=Release
        
    - name: Build
      run: |
        cmake --build build --config Release
        
    - name: Check results
      run: |
        if (Test-Path "build/Release/bff-viewer.exe") {
            echo "✅ SUCCESS: bff-viewer.exe built!"
            echo "File size: $((Get-Item 'build/Release/bff-viewer.exe').Length) bytes"
            
            # Try to run with --help
            echo "Trying to run viewer..."
            & "build/Release/bff-viewer.exe" --help 2>&1 | Out-String
        } else {
            echo "❌ Viewer not found"
            echo "Looking for executables..."
            Get-ChildItem -Path build -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue
        }
