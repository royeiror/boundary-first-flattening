name: Build BFF Viewer

on: workflow_dispatch

jobs:
  build-viewer:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Install vcpkg
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg install suitesparse:x64-windows
        
    - name: Create stub header without quotes
      run: |
        # Write stub directly without complex string
        $file = "cholmod_stub.h"
        
        # Clear and write line by line
        "" | Set-Content $file
        
        "// cholmod_stub.h" | Add-Content $file
        "#ifndef CHOLMOD_STUB_H" | Add-Content $file
        "#define CHOLMOD_STUB_H" | Add-Content $file
        "" | Add-Content $file
        "#include `"cholmod.h`"" | Add-Content $file
        "" | Add-Content $file
        "// Dummy function definitions" | Add-Content $file
        "double cholmod_norm_dense(cholmod_dense* A, int norm, cholmod_common* Common) { return 0.0; }" | Add-Content $file
        "double cholmod_norm_sparse(cholmod_sparse* A, int norm, cholmod_common* Common) { return 0.0; }" | Add-Content $file
        "cholmod_sparse* cholmod_submatrix(cholmod_sparse* A, int* rset, int rsize, int* cset, int csize, int values, int sorted, cholmod_common* Common) { return NULL; }" | Add-Content $file
        "int cholmod_scale(cholmod_dense* S, int scale, cholmod_sparse* A, cholmod_common* Common) { return 0; }" | Add-Content $file
        "cholmod_sparse* cholmod_ssmult(cholmod_sparse* A, cholmod_sparse* B, int stype, int values, int sorted, cholmod_common* Common) { return NULL; }" | Add-Content $file
        "int cholmod_sdmult(cholmod_sparse* A, int transpose, double alpha[2], double beta[2], cholmod_dense* X, cholmod_dense* Y, cholmod_common* Common) { return 0; }" | Add-Content $file
        "" | Add-Content $file
        "#ifndef CHOLMOD_SCALAR" | Add-Content $file
        "#define CHOLMOD_SCALAR 0" | Add-Content $file
        "#endif" | Add-Content $file
        "" | Add-Content $file
        "#endif // CHOLMOD_STUB_H" | Add-Content $file
        
        echo "Created stub header"
        
    - name: Update Common.h
      run: |
        $common = "include/bff/linear-algebra/Common.h"
        if (Test-Path $common) {
            $lines = Get-Content $common
            $newLines = @()
            
            foreach ($line in $lines) {
                $newLines += $line
                if ($line -match '#include "cholmod.h"') {
                    $newLines += '#include "cholmod_stub.h"'
                }
            }
            
            $newLines | Set-Content $common
        }
        
    - name: Copy headers
      run: |
        mkdir include
        Copy-Item "vcpkg/installed/x64-windows/include/*.h" "include/" -ErrorAction SilentlyContinue
        
    - name: Create FindSuiteSparse.cmake
      run: |
        # Convert paths to forward slashes
        $ws = $env:GITHUB_WORKSPACE -replace '\\', '/'
        $lib = "$env:GITHUB_WORKSPACE/vcpkg/installed/x64-windows/lib" -replace '\\', '/'
        
        "set(SuiteSparse_FOUND TRUE)" > cmake/FindSuiteSparse.cmake
        "set(SuiteSparse_INCLUDE_DIR `"$ws/include`")" >> cmake/FindSuiteSparse.cmake
        "set(SuiteSparse_CHOLMOD_LIBRARY `"$lib/cholmod.lib`")" >> cmake/FindSuiteSparse.cmake
        
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1
      
    - name: Configure CMake
      run: |
        cmake -B build -DBFF_BUILD_GUI=ON -DCMAKE_BUILD_TYPE=Release
        
    - name: Build
      run: |
        cmake --build build --config Release
        
    - name: Check results
      run: |
        if (Test-Path "build/Release/bff-viewer.exe") {
            echo "✅ Viewer built!"
        } else {
            echo "❌ No viewer"
        }
