name: Build BFF for Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout BFF Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        repository: GeometryCollective/boundary-first-flattening
        ref: v1.6
    
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2
    
    - name: Install CMake
      uses: lukka/get-cmake@latest
    
    - name: Install Visual Studio Build Tools (for SuiteSparse)
      shell: powershell
      run: |
        # Install Visual Studio Build Tools components needed for SuiteSparse
        choco install visualstudio2022buildtools -y
        choco install visualstudio2022-workload-vctools -y
    
    - name: Download and Extract SuiteSparse-METIS for Windows
      shell: powershell
      run: |
        Write-Host "Downloading SuiteSparse-METIS pre-built binaries..."
        
        # Clean up any existing SuiteSparse directory
        if (Test-Path "C:\SuiteSparse") {
            Remove-Item -Path "C:\SuiteSparse" -Recurse -Force -ErrorAction SilentlyContinue
        }
        
        # Create SuiteSparse directory structure
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse" | Out-Null
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse\include" | Out-Null
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse\lib" | Out-Null
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse\bin" | Out-Null
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse\include\suitesparse" | Out-Null
        
        Write-Host "Cloning SuiteSparse-METIS repository to build it..."
        
        # Clone the SuiteSparse-METIS for Windows repository
        git clone --depth 1 https://github.com/jlblancoc/suitesparse-metis-for-windows.git C:\suite-temp
        
        # Build SuiteSparse
        cd C:\suite-temp
        
        # Check if we have the build script
        if (Test-Path "build_windows.bat") {
            Write-Host "Running build_windows.bat..."
            cmd /c "build_windows.bat"
        } else {
            Write-Host "No build script found, trying to build manually..."
            
            # Create build directory
            New-Item -ItemType Directory -Force -Path "build" | Out-Null
            cd build
            
            # Configure with CMake
            cmake -G "Visual Studio 17 2022" -A x64 ..
            
            # Build
            cmake --build . --config Release
        }
        
        # Copy the built libraries and headers
        Write-Host "Copying built libraries and headers..."
        
        # Look for built libraries
        $libDirs = @("build\lib\Release", "build\Release", "lib", "build\lib")
        foreach ($dir in $libDirs) {
            if (Test-Path $dir) {
                Get-ChildItem -Path $dir -Filter "*.lib" | ForEach-Object {
                    Copy-Item -Path $_.FullName -Destination "C:\SuiteSparse\lib\" -Force
                    Write-Host "  Copied library: $($_.Name)"
                }
                
                Get-ChildItem -Path $dir -Filter "*.dll" | ForEach-Object {
                    Copy-Item -Path $_.FullName -Destination "C:\SuiteSparse\bin\" -Force
                    Write-Host "  Copied DLL: $($_.Name)"
                }
            }
        }
        
        # Copy headers
        if (Test-Path "Include") {
            Get-ChildItem -Path "Include" -Filter "*.h" -Recurse | ForEach-Object {
                $destPath = "C:\SuiteSparse\include\suitesparse\$($_.Name)"
                Copy-Item -Path $_.FullName -Destination $destPath -Force
            }
        }
        
        # Also copy from SuiteSparse_config directory if it exists
        if (Test-Path "SuiteSparse_config") {
            Get-ChildItem -Path "SuiteSparse_config" -Filter "*.h" -Recurse | ForEach-Object {
                $destPath = "C:\SuiteSparse\include\suitesparse\$($_.Name)"
                Copy-Item -Path $_.FullName -Destination $destPath -Force
            }
        }
        
        # Check what we have
        Write-Host "`nSuiteSparse directory contents:"
        Write-Host "Headers in C:\SuiteSparse\include:"
        Get-ChildItem -Path "C:\SuiteSparse\include" -Recurse -Filter "*.h" | Select-Object -First 20
        
        Write-Host "`nLibraries in C:\SuiteSparse\lib:"
        Get-ChildItem -Path "C:\SuiteSparse\lib" -Filter "*.lib" | Select-Object -First 20
        
        Write-Host "`nBinaries in C:\SuiteSparse\bin:"
        Get-ChildItem -Path "C:\SuiteSparse\bin" -Filter "*.dll" | Select-Object -First 10
    
    - name: Create proper CMakeLists.txt for BFF
      shell: powershell
      run: |
        Write-Host "Creating proper CMakeLists.txt for BFF..."
        
        # Check if we have the original CMakeLists.txt
        if (Test-Path "CMakeLists.txt") {
            Write-Host "Backing up original CMakeLists.txt..."
            Copy-Item "CMakeLists.txt" "CMakeLists.txt.orig" -Force
        }
        
        # Create a new CMakeLists.txt based on the original but fixed
        # First, let's see what files we have
        Write-Host "Checking BFF source structure..."
        
        # List main directories
        Get-ChildItem -Path "." -Directory | Select-Object Name
        
        # Check for existing CMakeLists.txt patterns
        $cmakeFiles = Get-ChildItem -Path "." -Filter "CMakeLists.txt" -Recurse
        if ($cmakeFiles) {
            Write-Host "Found CMakeLists.txt files:"
            $cmakeFiles | ForEach-Object { Write-Host "  $($_.FullName)" }
        }
        
        # Use the original CMakeLists.txt if it exists and looks reasonable
        if (Test-Path "CMakeLists.txt.orig") {
            $content = Get-Content "CMakeLists.txt.orig" -Raw
            if ($content -match "project|add_executable|add_library") {
                Write-Host "Original CMakeLists.txt looks valid, using it as base..."
                Copy-Item "CMakeLists.txt.orig" "CMakeLists.txt" -Force
                
                # Now we need to patch it to find SuiteSparse properly
                $cmakeContent = Get-Content "CMakeLists.txt" -Raw
                
                # Replace or add SuiteSparse configuration
                if ($cmakeContent -notmatch "SUITESPARSE_DIR") {
                    Write-Host "Adding SuiteSparse configuration..."
                    
                    # Add SuiteSparse configuration after project() call
                    $cmakeContent = $cmakeContent -replace '(project\(.*?\))', "`$1`n`n# SuiteSparse configuration`nset(SUITESPARSE_DIR `"C:/SuiteSparse`")`nset(SUITESPARSE_INCLUDE_DIR `"`${SUITESPARSE_DIR}/include`")`nset(SUITESPARSE_LIB_DIR `"`${SUITESPARSE_DIR}/lib`")"
                    
                    # Add include directories
                    if ($cmakeContent -match 'include_directories\(') {
                        # Add to existing include_directories
                        $cmakeContent = $cmakeContent -replace 'include_directories\(', "include_directories(`n    `${SUITESPARSE_INCLUDE_DIR}`n    `${SUITESPARSE_INCLUDE_DIR}/suitesparse"
                    } else {
                        # Add new include_directories
                        $cmakeContent = $cmakeContent + "`n`ninclude_directories(`${SUITESPARSE_INCLUDE_DIR} `${SUITESPARSE_INCLUDE_DIR}/suitesparse)"
                    }
                    
                    # Add library linking (simplified approach)
                    $cmakeContent = $cmakeContent + "`n# SuiteSparse libraries`nfind_library(CHOLMOD_LIBRARY NAMES cholmod libcholmod PATHS `${SUITESPARSE_LIB_DIR} NO_DEFAULT_PATH)`nfind_library(AMD_LIBRARY NAMES amd libamd PATHS `${SUITESPARSE_LIB_DIR} NO_DEFAULT_PATH)`nfind_library(CAMD_LIBRARY NAMES camd libcamd PATHS `${SUITESPARSE_LIB_DIR} NO_DEFAULT_PATH)`nfind_library(COLAMD_LIBRARY NAMES colamd libcolamd PATHS `${SUITESPARSE_LIB_DIR} NO_DEFAULT_PATH)`nfind_library(CCOLAMD_LIBRARY NAMES ccolamd libccolamd PATHS `${SUITESPARSE_LIB_DIR} NO_DEFAULT_PATH)`nfind_library(METIS_LIBRARY NAMES metis libmetis PATHS `${SUITESPARSE_LIB_DIR} NO_DEFAULT_PATH)`n`nif(NOT CHOLMOD_LIBRARY)`n    message(FATAL_ERROR `"CHOLMOD library not found in `${SUITESPARSE_LIB_DIR}`")`nendif()`n`n# Link SuiteSparse libraries to targets`nif(TARGET bff-lib)`n    target_link_libraries(bff-lib`n        `${CHOLMOD_LIBRARY}`n        `${AMD_LIBRARY}`n        `${CAMD_LIBRARY}`n        `${COLAMD_LIBRARY}`n        `${CCOLAMD_LIBRARY}`n        `${METIS_LIBRARY}`n    )`nendif()"
                    
                    Set-Content -Path "CMakeLists.txt" -Value $cmakeContent
                }
            } else {
                Write-Host "Original CMakeLists.txt doesn't look valid, creating a new one..."
                # Create new CMakeLists.txt from scratch using string concatenation
                $cmakeContent = 'cmake_minimum_required(VERSION 3.10)' + "`n" +
                                'project(BFF)' + "`n" +
                                '' + "`n" +
                                'set(CMAKE_CXX_STANDARD 17)' + "`n" +
                                'set(CMAKE_CXX_STANDARD_REQUIRED ON)' + "`n" +
                                '' + "`n" +
                                '# SuiteSparse configuration' + "`n" +
                                'set(SUITESPARSE_DIR "C:/SuiteSparse")' + "`n" +
                                'set(SUITESPARSE_INCLUDE_DIR "${SUITESPARSE_DIR}/include")' + "`n" +
                                'set(SUITESPARSE_LIB_DIR "${SUITESPARSE_DIR}/lib")' + "`n" +
                                '' + "`n" +
                                '# Find SuiteSparse libraries' + "`n" +
                                'find_library(CHOLMOD_LIBRARY NAMES cholmod libcholmod PATHS ${SUITESPARSE_LIB_DIR} NO_DEFAULT_PATH)' + "`n" +
                                'find_library(AMD_LIBRARY NAMES amd libamd PATHS ${SUITESPARSE_LIB_DIR} NO_DEFAULT_PATH)' + "`n" +
                                'find_library(CAMD_LIBRARY NAMES camd libcamd PATHS ${SUITESPARSE_LIB_DIR} NO_DEFAULT_PATH)' + "`n" +
                                'find_library(COLAMD_LIBRARY NAMES colamd libcolamd PATHS ${SUITESPARSE_LIB_DIR} NO_DEFAULT_PATH)' + "`n" +
                                'find_library(CCOLAMD_LIBRARY NAMES ccolamd libccolamd PATHS ${SUITESPARSE_LIB_DIR} NO_DEFAULT_PATH)' + "`n" +
                                'find_library(METIS_LIBRARY NAMES metis libmetis PATHS ${SUITESPARSE_LIB_DIR} NO_DEFAULT_PATH)' + "`n" +
                                '' + "`n" +
                                'if(NOT CHOLMOD_LIBRARY)' + "`n" +
                                '    message(FATAL_ERROR "CHOLMOD library not found in ${SUITESPARSE_LIB_DIR}")' + "`n" +
                                'else()' + "`n" +
                                '    message(STATUS "Found CHOLMOD: ${CHOLMOD_LIBRARY}")' + "`n" +
                                'endif()' + "`n" +
                                '' + "`n" +
                                '# Include directories' + "`n" +
                                'include_directories(' + "`n" +
                                '    ${CMAKE_SOURCE_DIR}/include' + "`n" +
                                '    ${CMAKE_SOURCE_DIR}/deps/libigl/include' + "`n" +
                                '    ${CMAKE_SOURCE_DIR}/deps/spectra/include' + "`n" +
                                '    ${SUITESPARSE_INCLUDE_DIR}' + "`n" +
                                '    ${SUITESPARSE_INCLUDE_DIR}/suitesparse' + "`n" +
                                ')' + "`n" +
                                '' + "`n" +
                                '# Find source files for library' + "`n" +
                                'file(GLOB_RECURSE SRC_FILES "src/*.cpp")' + "`n" +
                                'if(NOT SRC_FILES)' + "`n" +
                                '    message(FATAL_ERROR "No source files found in src/ directory")' + "`n" +
                                'endif()' + "`n" +
                                '' + "`n" +
                                '# Create library' + "`n" +
                                'add_library(bff-lib STATIC ${SRC_FILES})' + "`n" +
                                '' + "`n" +
                                '# Link SuiteSparse libraries' + "`n" +
                                'target_link_libraries(bff-lib' + "`n" +
                                '    ${CHOLMOD_LIBRARY}' + "`n" +
                                '    ${AMD_LIBRARY}' + "`n" +
                                '    ${CAMD_LIBRARY}' + "`n" +
                                '    ${COLAMD_LIBRARY}' + "`n" +
                                '    ${CCOLAMD_LIBRARY}' + "`n" +
                                '    ${METIS_LIBRARY}' + "`n" +
                                ')' + "`n" +
                                '' + "`n" +
                                '# Find and add GUI application' + "`n" +
                                'file(GLOB_RECURSE GUI_FILES "apps/*.cpp")' + "`n" +
                                'if(GUI_FILES)' + "`n" +
                                '    add_executable(bff-gui ${GUI_FILES})' + "`n" +
                                '    target_link_libraries(bff-gui bff-lib)' + "`n" +
                                '    target_include_directories(bff-gui PRIVATE ${CMAKE_SOURCE_DIR}/apps)' + "`n" +
                                '    message(STATUS "Building GUI application")' + "`n" +
                                'else()' + "`n" +
                                '    message(WARNING "No GUI files found in apps/ directory")' + "`n" +
                                'endif()'
                Set-Content -Path "CMakeLists.txt" -Value $cmakeContent
            }
        } else {
            # Create new CMakeLists.txt
            $cmakeContent = 'cmake_minimum_required(VERSION 3.10)' + "`n" +
                            'project(BFF)' + "`n" +
                            '' + "`n" +
                            'set(CMAKE_CXX_STANDARD 17)' + "`n" +
                            'set(CMAKE_CXX_STANDARD_REQUIRED ON)' + "`n" +
                            '' + "`n" +
                            '# SuiteSparse configuration' + "`n" +
                            'set(SUITESPARSE_DIR "C:/SuiteSparse")' + "`n" +
                            'set(SUITESPARSE_INCLUDE_DIR "${SUITESPARSE_DIR}/include")' + "`n" +
                            'set(SUITESPARSE_LIB_DIR "${SUITESPARSE_DIR}/lib")' + "`n" +
                            '' + "`n" +
                            '# Find SuiteSparse libraries' + "`n" +
                            'find_library(CHOLMOD_LIBRARY NAMES cholmod libcholmod PATHS ${SUITESPARSE_LIB_DIR} NO_DEFAULT_PATH)' + "`n" +
                            'find_library(AMD_LIBRARY NAMES amd libamd PATHS ${SUITESPARSE_LIB_DIR} NO_DEFAULT_PATH)' + "`n" +
                            'find_library(CAMD_LIBRARY NAMES camd libcamd PATHS ${SUITESPARSE_LIB_DIR} NO_DEFAULT_PATH)' + "`n" +
                            'find_library(COLAMD_LIBRARY NAMES colamd libcolamd PATHS ${SUITESPARSE_LIB_DIR} NO_DEFAULT_PATH)' + "`n" +
                            'find_library(CCOLAMD_LIBRARY NAMES ccolamd libccolamd PATHS ${SUITESPARSE_LIB_DIR} NO_DEFAULT_PATH)' + "`n" +
                            'find_library(METIS_LIBRARY NAMES metis libmetis PATHS ${SUITESPARSE_LIB_DIR} NO_DEFAULT_PATH)' + "`n" +
                            '' + "`n" +
                            'if(NOT CHOLMOD_LIBRARY)' + "`n" +
                            '    message(FATAL_ERROR "CHOLMOD library not found in ${SUITESPARSE_LIB_DIR}")' + "`n" +
                            'else()' + "`n" +
                            '    message(STATUS "Found CHOLMOD: ${CHOLMOD_LIBRARY}")' + "`n" +
                            'endif()' + "`n" +
                            '' + "`n" +
                            '# Include directories' + "`n" +
                            'include_directories(' + "`n" +
                            '    ${CMAKE_SOURCE_DIR}/include' + "`n" +
                            '    ${CMAKE_SOURCE_DIR}/deps/libigl/include' + "`n" +
                            '    ${CMAKE_SOURCE_DIR}/deps/spectra/include' + "`n" +
                            '    ${SUITESPARSE_INCLUDE_DIR}' + "`n" +
                            '    ${SUITESPARSE_INCLUDE_DIR}/suitesparse' + "`n" +
                            ')' + "`n" +
                            '' + "`n" +
                            '# Find source files for library' + "`n" +
                            'file(GLOB_RECURSE SRC_FILES "src/*.cpp")' + "`n" +
                            'if(NOT SRC_FILES)' + "`n" +
                            '    message(FATAL_ERROR "No source files found in src/ directory")' + "`n" +
                            'endif()' + "`n" +
                            '' + "`n" +
                            '# Create library' + "`n" +
                            'add_library(bff-lib STATIC ${SRC_FILES})' + "`n" +
                            '' + "`n" +
                            '# Link SuiteSparse libraries' + "`n" +
                            'target_link_libraries(bff-lib' + "`n" +
                            '    ${CHOLMOD_LIBRARY}' + "`n" +
                            '    ${AMD_LIBRARY}' + "`n" +
                            '    ${CAMD_LIBRARY}' + "`n" +
                            '    ${COLAMD_LIBRARY}' + "`n" +
                            '    ${CCOLAMD_LIBRARY}' + "`n" +
                            '    ${METIS_LIBRARY}' + "`n" +
                            ')' + "`n" +
                            '' + "`n" +
                            '# Find and add GUI application' + "`n" +
                            'file(GLOB_RECURSE GUI_FILES "apps/*.cpp")' + "`n" +
                            'if(GUI_FILES)' + "`n" +
                            '    add_executable(bff-gui ${GUI_FILES})' + "`n" +
                            '    target_link_libraries(bff-gui bff-lib)' + "`n" +
                            '    target_include_directories(bff-gui PRIVATE ${CMAKE_SOURCE_DIR}/apps)' + "`n" +
                            '    message(STATUS "Building GUI application")' + "`n" +
                            'else()' + "`n" +
                            '    message(WARNING "No GUI files found in apps/ directory")' + "`n" +
                            'endif()'
            Set-Content -Path "CMakeLists.txt" -Value $cmakeContent
        }
        
        Write-Host "CMakeLists.txt created/updated successfully"
    
    - name: Configure CMake with verbose output
      shell: powershell
      run: |
        # Clean build directory
        if (Test-Path "build") {
            Remove-Item -Path "build" -Recurse -Force -ErrorAction SilentlyContinue
        }
        
        New-Item -ItemType Directory -Force -Path "build"
        cd build
        
        Write-Host "Configuring CMake with verbose output..."
        Write-Host "Current directory: $(Get-Location)"
        Write-Host "CMake version:"
        cmake --version
        
        # First, let's check what libraries are actually in SuiteSparse/lib
        Write-Host "`nChecking SuiteSparse/lib contents:"
        if (Test-Path "C:\SuiteSparse\lib") {
            Get-ChildItem -Path "C:\SuiteSparse\lib" -Filter "*.lib" | ForEach-Object {
                Write-Host "  Found: $($_.Name)"
            }
        } else {
            Write-Host "  ERROR: C:\SuiteSparse\lib does not exist!"
        }
        
        Write-Host "`nConfiguring CMake..."
        
        # Configure with verbose output
        $env:VERBOSE=1
        cmake -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON `
          ..
        
        if ($LASTEXITCODE -ne 0) {
            Write-Host "CMake configuration failed"
            Write-Host "Checking CMakeCache.txt for clues..."
            if (Test-Path "CMakeCache.txt") {
                Get-Content "CMakeCache.txt" | Select-String "CHOLMOD|SuiteSparse|METIS" | ForEach-Object {
                    Write-Host "  $_"
                }
            }
            exit 1
        }
        
        Write-Host "CMake configuration successful!"
    
    - name: Build project
      shell: powershell
      run: |
        Write-Host "Building project..."
        cd build
        
        # Build with verbose output
        cmake --build . --config Release --parallel 4 --verbose
        
        if ($LASTEXITCODE -ne 0) {
            Write-Host "Build failed, trying to build debug configuration..."
            cmake --build . --config Debug --verbose
        }
        
        # Check for executables
        Write-Host "`nLooking for built executables..."
        $exes = Get-ChildItem -Path "." -Filter "*.exe" -Recurse | Where-Object {
            $_.FullName -notmatch "CompilerId"
        }
        
        if ($exes) {
            Write-Host "Found executables:"
            $exes | ForEach-Object { 
                Write-Host "  $($_.FullName)"
                # Also show dependencies
                Write-Host "    Size: $([math]::Round($_.Length/1KB,2)) KB"
            }
        } else {
            Write-Host "No executables found"
        }
    
    - name: Copy required DLLs and create artifacts
      shell: powershell
      run: |
        Write-Host "Copying required DLLs and creating artifacts..."
        
        # Create artifacts directory
        New-Item -ItemType Directory -Force -Path "artifacts"
        
        # Find all BFF executables
        $bffExes = Get-ChildItem -Path "." -Recurse -Filter "*bff*.exe" | Where-Object {
            $_.FullName -notmatch "CompilerId"
        }
        
        if (-not $bffExes) {
            # Look for any executables that might be BFF
            $bffExes = Get-ChildItem -Path "." -Recurse -Filter "*.exe" | Where-Object {
                $_.FullName -notmatch "CompilerId" -and
                ($_.Directory.Name -match "Release|Debug" -or $_.Name -match "gui|GUI")
            }
        }
        
        if ($bffExes) {
            Write-Host "Found BFF executables:"
            foreach ($exe in $bffExes) {
                Write-Host "  $($exe.FullName)"
                # Copy executable
                Copy-Item -Path $exe.FullName -Destination "artifacts\" -Force
                
                # Check for required DLLs
                Write-Host "    Checking dependencies for $($exe.Name)..."
                
                # Common DLLs that might be needed
                $commonDlls = @(
                    "libcholmod.dll", "cholmod.dll",
                    "libamd.dll", "amd.dll",
                    "libcamd.dll", "camd.dll", 
                    "libcolamd.dll", "colamd.dll",
                    "libccolamd.dll", "ccolamd.dll",
                    "libmetis.dll", "metis.dll",
                    "vcruntime140.dll", "msvcp140.dll",
                    "vcruntime140_1.dll"
                )
                
                # Copy DLLs from SuiteSparse/bin
                if (Test-Path "C:\SuiteSparse\bin") {
                    foreach ($dll in $commonDlls) {
                        $dllPath = "C:\SuiteSparse\bin\$dll"
                        if (Test-Path $dllPath) {
                            Copy-Item -Path $dllPath -Destination "artifacts\" -Force
                            Write-Host "      Copied: $dll"
                        }
                    }
                }
                
                # Also check Windows system directories for VC++ redistributables
                $vcDlls = @(
                    "C:\Windows\System32\vcruntime140.dll",
                    "C:\Windows\System32\msvcp140.dll",
                    "C:\Windows\System32\vcruntime140_1.dll"
                )
                
                foreach ($vcDll in $vcDlls) {
                    if (Test-Path $vcDll) {
                        $destName = Split-Path $vcDll -Leaf
                        Copy-Item -Path $vcDll -Destination "artifacts\$destName" -Force
                        Write-Host "      Copied VC++ DLL: $destName"
                    }
                }
            }
            
            # Create a simple batch file to run the application
            $batchContent = '@echo off' + "`n" +
                           'echo BFF (Boundary First Flattening) Application' + "`n" +
                           'echo ============================================' + "`n" +
                           'echo.' + "`n" +
                           'echo Make sure all DLLs are in the same directory as the executable.' + "`n" +
                           'echo.' + "`n" +
                           'echo Available executables:' + "`n"
            
            $bffExes | ForEach-Object {
                $batchContent += 'echo   ' + $_.Name + "`n"
            }
            
            $batchContent += 'echo.' + "`n" +
                            'echo To run an executable, type its name in the command prompt.' + "`n" +
                            'echo Example: bff-gui.exe' + "`n" +
                            'echo.' + "`n" +
                            'pause'
            
            Set-Content -Path "artifacts\RUN_ME.bat" -Value $batchContent -Encoding ASCII
            
        } else {
            Write-Host "No executables found to package"
            # At least copy any libraries we built
            $libs = Get-ChildItem -Path "." -Recurse -Filter "*.lib" | Where-Object {
                $_.FullName -match "bff"
            }
            foreach ($lib in $libs) {
                Copy-Item -Path $lib.FullName -Destination "artifacts\" -Force
                Write-Host "  Copied library: $($lib.Name)"
            }
        }
        
        Write-Host "`nArtifacts directory contents:"
        Get-ChildItem -Path "artifacts" -ErrorAction SilentlyContinue | Format-Table Name, Length
    
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BFF-Windows-Build
        path: artifacts/
        if-no-files-found: warn
