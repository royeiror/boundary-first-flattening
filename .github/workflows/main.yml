name: Build BFF for Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout BFF Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        repository: GeometryCollective/boundary-first-flattening
        ref: v1.6
    
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2
    
    - name: Install CMake
      run: |
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
    
    - name: Install vcpkg and SuiteSparse
      shell: powershell
      run: |
        Write-Host "Setting up vcpkg for SuiteSparse..."
        
        # Install vcpkg
        git clone https://github.com/Microsoft/vcpkg.git
        cd vcpkg
        .\bootstrap-vcpkg.bat
        
        # Install SuiteSparse
        .\vcpkg install suitesparse --triplet x64-windows
        
        # Set environment variables for CMake to find vcpkg
        $vcpkgPath = (Get-Location).Path
        echo "VCPKG_ROOT=$vcpkgPath" >> $env:GITHUB_ENV
        echo "CMAKE_TOOLCHAIN_FILE=$vcpkgPath\scripts\buildsystems\vcpkg.cmake" >> $env:GITHUB_ENV
        
        Write-Host "vcpkg and SuiteSparse installed successfully"
    
    - name: Check BFF project structure
      shell: powershell
      run: |
        Write-Host "Checking BFF project structure..."
        
        # List all directories
        Get-ChildItem -Path "." -Directory | ForEach-Object {
            Write-Host "Directory: $($_.Name)"
            # List files in each directory
            Get-ChildItem -Path $_.FullName -File | Select-Object -First 3 | ForEach-Object {
                Write-Host "  - $($_.Name)"
            }
        }
        
        # Check for existing CMakeLists.txt
        if (Test-Path "CMakeLists.txt") {
            Write-Host "Found CMakeLists.txt at root"
            Write-Host "First 20 lines:"
            Get-Content "CMakeLists.txt" -TotalCount 20
        }
        
        # Check for src directory
        if (Test-Path "src") {
            Write-Host "Found src directory with files:"
            Get-ChildItem -Path "src" -Recurse -File | Select-Object -First 10 | ForEach-Object {
                Write-Host "  $($_.Name)"
            }
        }
        
        # Check for apps directory
        if (Test-Path "apps") {
            Write-Host "Found apps directory with files:"
            Get-ChildItem -Path "apps" -Recurse -File | Select-Object -First 10 | ForEach-Object {
                Write-Host "  $($_.Name)"
            }
        }
    
    - name: Create or fix CMakeLists.txt
      shell: powershell
      run: |
        Write-Host "Creating/fixing CMakeLists.txt..."
        
        # Backup original if it exists
        if (Test-Path "CMakeLists.txt") {
            Copy-Item "CMakeLists.txt" "CMakeLists.txt.backup" -Force
            Write-Host "Backed up original CMakeLists.txt"
        }
        
        # Create a simple but effective CMakeLists.txt
        $cmakeContent = 'cmake_minimum_required(VERSION 3.12)' + "`n" +
                        'project(BFF LANGUAGES CXX)' + "`n" +
                        '' + "`n" +
                        'set(CMAKE_CXX_STANDARD 17)' + "`n" +
                        'set(CMAKE_CXX_STANDARD_REQUIRED ON)' + "`n" +
                        'set(CMAKE_CXX_EXTENSIONS OFF)' + "`n" +
                        '' + "`n" +
                        '# Use vcpkg for dependencies' + "`n" +
                        'if(DEFINED ENV{VCPKG_ROOT} AND NOT DEFINED CMAKE_TOOLCHAIN_FILE)' + "`n" +
                        '    set(CMAKE_TOOLCHAIN_FILE "$ENV{VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" CACHE STRING "")' + "`n" +
                        'endif()' + "`n" +
                        '' + "`n" +
                        '# Find SuiteSparse package' + "`n" +
                        'find_package(SuiteSparse CONFIG REQUIRED)' + "`n" +
                        '' + "`n" +
                        '# Include directories' + "`n" +
                        'include_directories(' + "`n" +
                        '    ${CMAKE_SOURCE_DIR}/include' + "`n" +
                        '    ${CMAKE_SOURCE_DIR}/deps/libigl/include' + "`n" +
                        '    ${CMAKE_SOURCE_DIR}/deps/spectra/include' + "`n" +
                        ')' + "`n" +
                        '' + "`n" +
                        '# Find source files' + "`n" +
                        'file(GLOB_RECURSE SRC_FILES "src/*.cpp")' + "`n" +
                        'if(NOT SRC_FILES)' + "`n" +
                        '    message(FATAL_ERROR "No source files found in src/ directory")' + "`n" +
                        'endif()' + "`n" +
                        '' + "`n" +
                        '# Create library' + "`n" +
                        'add_library(bff-lib STATIC ${SRC_FILES})' + "`n" +
                        '' + "`n" +
                        '# Link SuiteSparse libraries' + "`n" +
                        'target_link_libraries(bff-lib PRIVATE SuiteSparse::SuiteSparse)' + "`n" +
                        '' + "`n" +
                        '# Find and add GUI application' + "`n" +
                        'file(GLOB_RECURSE GUI_FILES "apps/*.cpp")' + "`n" +
                        'if(GUI_FILES)' + "`n" +
                        '    add_executable(bff-gui ${GUI_FILES})' + "`n" +
                        '    target_link_libraries(bff-gui bff-lib)' + "`n" +
                        '    target_include_directories(bff-gui PRIVATE ${CMAKE_SOURCE_DIR}/apps)' + "`n" +
                        '    message(STATUS "Building GUI application")' + "`n" +
                        'else()' + "`n" +
                        '    message(WARNING "No GUI files found in apps/ directory")' + "`n" +
                        'endif()' + "`n" +
                        '' + "`n" +
                        '# Install targets (optional)' + "`n" +
                        'install(TARGETS bff-lib ARCHIVE DESTINATION lib)' + "`n" +
                        'if(TARGET bff-gui)' + "`n" +
                        '    install(TARGETS bff-gui RUNTIME DESTINATION bin)' + "`n" +
                        'endif()'
        
        Set-Content -Path "CMakeLists.txt" -Value $cmakeContent
        Write-Host "Created new CMakeLists.txt"
    
    - name: Configure CMake with vcpkg
      shell: powershell
      run: |
        Write-Host "Configuring CMake with vcpkg..."
        
        # Clean build directory
        if (Test-Path "build") {
            Remove-Item -Path "build" -Recurse -Force -ErrorAction SilentlyContinue
        }
        
        New-Item -ItemType Directory -Force -Path "build"
        cd build
        
        Write-Host "Current CMake version:"
        cmake --version
        
        Write-Host "`nConfiguring with vcpkg toolchain..."
        
        # Configure with vcpkg toolchain
        cmake .. -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
        
        if ($LASTEXITCODE -ne 0) {
            Write-Host "CMake configuration failed"
            Write-Host "Trying alternative configuration..."
            
            # Try without specifying generator
            cmake .. -DCMAKE_BUILD_TYPE=Release `
              -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
        }
        
        Write-Host "CMake configuration completed"
    
    - name: Build project
      shell: powershell
      run: |
        Write-Host "Building project..."
        
        if (Test-Path "build\CMakeCache.txt") {
            cd build
            
            # Build Release configuration
            cmake --build . --config Release --parallel 4
            
            if ($LASTEXITCODE -ne 0) {
                Write-Host "Release build failed, trying Debug..."
                cmake --build . --config Debug --parallel 4
            }
            
            # Check for built executables
            Write-Host "`nLooking for built executables..."
            $exeFiles = Get-ChildItem -Path "." -Filter "*.exe" -Recurse | Where-Object {
                $_.FullName -notmatch "CompilerId"
            }
            
            if ($exeFiles) {
                Write-Host "Found executables:"
                $exeFiles | ForEach-Object {
                    Write-Host "  - $($_.FullName)"
                }
            } else {
                Write-Host "No executables found in build directory"
                
                # Also check the install directory if it exists
                if (Test-Path "Release") {
                    Get-ChildItem -Path "Release" -Filter "*.exe" -Recurse | ForEach-Object {
                        Write-Host "  - $($_.FullName)"
                    }
                }
                if (Test-Path "Debug") {
                    Get-ChildItem -Path "Debug" -Filter "*.exe" -Recurse | ForEach-Object {
                        Write-Host "  - $($_.FullName)"
                    }
                }
            }
        } else {
            Write-Host "No CMakeCache.txt found - build was not configured"
        }
    
    - name: Package artifacts
      shell: powershell
      run: |
        Write-Host "Packaging artifacts..."
        
        # Create artifacts directory
        New-Item -ItemType Directory -Force -Path "artifacts"
        
        # Find executables
        $exeFiles = @()
        
        # Check build directory
        if (Test-Path "build") {
            $buildExes = Get-ChildItem -Path "build" -Filter "*.exe" -Recurse | Where-Object {
                $_.FullName -notmatch "CompilerId"
            }
            $exeFiles += $buildExes
        }
        
        # Also check for installed binaries
        $possiblePaths = @(
            "build\Release",
            "build\Debug", 
            "build\bin",
            "build\bin\Release",
            "build\bin\Debug"
        )
        
        foreach ($path in $possiblePaths) {
            if (Test-Path $path) {
                $pathExes = Get-ChildItem -Path $path -Filter "*.exe" -Recurse
                $exeFiles += $pathExes
            }
        }
        
        if ($exeFiles.Count -gt 0) {
            Write-Host "Found executables to package:"
            foreach ($exe in $exeFiles) {
                Write-Host "  $($exe.FullName)"
                
                # Copy executable
                Copy-Item -Path $exe.FullName -Destination "artifacts\" -Force
                
                # Copy required DLLs
                Write-Host "    Looking for DLL dependencies..."
                
                # Check vcpkg installed directory for DLLs
                if (Test-Path "$env:VCPKG_ROOT\installed\x64-windows\bin") {
                    # Copy SuiteSparse DLLs
                    $suiteSparseDlls = Get-ChildItem -Path "$env:VCPKG_ROOT\installed\x64-windows\bin" -Filter "*cholmod*.dll"
                    foreach ($dll in $suiteSparseDlls) {
                        Copy-Item -Path $dll.FullName -Destination "artifacts\" -Force
                        Write-Host "      Copied: $($dll.Name)"
                    }
                    
                    # Copy other required DLLs
                    $requiredDlls = @("amd.dll", "camd.dll", "colamd.dll", "ccolamd.dll", "metis.dll")
                    foreach ($dllName in $requiredDlls) {
                        $dllPath = "$env:VCPKG_ROOT\installed\x64-windows\bin\$dllName"
                        if (Test-Path $dllPath) {
                            Copy-Item -Path $dllPath -Destination "artifacts\" -Force
                            Write-Host "      Copied: $dllName"
                        }
                    }
                }
                
                # Copy VC++ runtime DLLs
                $vcDlls = @("vcruntime140.dll", "msvcp140.dll", "vcruntime140_1.dll")
                foreach ($vcDll in $vcDlls) {
                    $sysPath = "C:\Windows\System32\$vcDll"
                    if (Test-Path $sysPath) {
                        Copy-Item -Path $sysPath -Destination "artifacts\$vcDll" -Force
                        Write-Host "      Copied VC++ DLL: $vcDll"
                    }
                }
            }
            
            # Create a README file
            $readmeContent = 'BFF (Boundary First Flattening) Windows Build' + "`n" +
                            '=============================================' + "`n" +
                            '' + "`n" +
                            'This package contains the BFF application built for Windows.' + "`n" +
                            '' + "`n" +
                            'To run:' + "`n" +
                            '1. Extract all files to a folder' + "`n" +
                            '2. Double-click on the executable (e.g., bff-gui.exe)' + "`n" +
                            '3. Or run from command prompt: bff-gui.exe' + "`n" +
                            '' + "`n" +
                            'Requirements:' + "`n" +
                            '- Windows 10 or later' + "`n" +
                            '- Visual C++ Redistributable (included in DLLs)' + "`n" +
                            '' + "`n" +
                            'Executables included:' + "`n"
            
            foreach ($exe in $exeFiles) {
                $readmeContent += '- ' + $exe.Name + "`n"
            }
            
            Set-Content -Path "artifacts\README.txt" -Value $readmeContent
            
        } else {
            Write-Host "No executables found to package"
            
            # Create error log
            $errorContent = 'Build completed but no executables were found.' + "`n" +
                          'Possible issues:' + "`n" +
                          '1. CMake configuration failed' + "`n" +
                          '2. Build failed to produce executables' + "`n" +
                          '3. Executables are in an unexpected location' + "`n" +
                          '' + "`n" +
                          'Check the build logs for more information.'
            
            Set-Content -Path "artifacts\ERROR_LOG.txt" -Value $errorContent
        }
        
        Write-Host "`nArtifacts directory contents:"
        Get-ChildItem -Path "artifacts" -ErrorAction SilentlyContinue | Format-Table Name, Length
    
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BFF-Windows-Build
        path: artifacts/
        if-no-files-found: warn
