name: Build BFF Viewer

on: workflow_dispatch

jobs:
  build-viewer:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Check Common.h file
      run: |
        echo "Checking Common.h..."
        $file = "include/bff/linear-algebra/Common.h"
        if (Test-Path $file) {
            echo "File exists"
            echo "First 5 lines:"
            Get-Content $file -First 5
        }
        
    - name: Fix Common.h
      run: |
        $file = "include/bff/linear-algebra/Common.h"
        if (Test-Path $file) {
            # Read and replace
            $content = Get-Content $file -Raw
            $newContent = $content -replace '#include "cholmod.h"', '// #include "cholmod.h"'
            $newContent | Set-Content $file
            echo "Fixed Common.h"
        }
        
    - name: Create FindSuiteSparse.cmake
      run: |
        echo "set(SuiteSparse_FOUND TRUE)" > cmake/FindSuiteSparse.cmake
        
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1
      
    - name: Configure CMake
      run: |
        cmake -B build -DBFF_BUILD_GUI=ON -DCMAKE_BUILD_TYPE=Release
        
    - name: Build
      run: |
        cmake --build build --config Release
        
    - name: Check results
      run: |
        if (Test-Path "build/Release/bff-viewer.exe") {
            echo "✅ Viewer built!"
        } else {
            echo "❌ No viewer"
        }
