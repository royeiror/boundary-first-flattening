name: Build BFF Viewer

on: workflow_dispatch

jobs:
  build-viewer:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Install vcpkg with SuiteSparse
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg install suitesparse:x64-windows
        .\vcpkg\vcpkg install lapack-reference:x64-windows
        
    - name: Create proper FindSuiteSparse.cmake with CMake syntax
      run: |
        $vcpkgPath = "$env:GITHUB_WORKSPACE/vcpkg/installed/x64-windows"
        # Convert to forward slashes for CMake
        $vcpkgPath = $vcpkgPath -replace '\\', '/'
        
        $lines = @()
        $lines += "# Simplified FindSuiteSparse.cmake for CI"
        $lines += "cmake_minimum_required(VERSION 3.10)"
        $lines += ""
        $lines += "# Always succeed"
        $lines += "set(SuiteSparse_FOUND TRUE)"
        $lines += ""
        $lines += "# Set paths from vcpkg"
        $lines += "set(SuiteSparse_INCLUDE_DIR `"$vcpkgPath/include`")"
        $lines += "set(SuiteSparse_LIBRARY_DIR `"$vcpkgPath/lib`")"
        $lines += ""
        $lines += "# Mark all components as found"
        $lines += "set(SuiteSparse_AMD_FOUND TRUE)"
        $lines += "set(SuiteSparse_CAMD_FOUND TRUE)"
        $lines += "set(SuiteSparse_COLAMD_FOUND TRUE)"
        $lines += "set(SuiteSparse_CCOLAMD_FOUND TRUE)"
        $lines += "set(SuiteSparse_CHOLMOD_FOUND TRUE)"
        $lines += "set(SuiteSparse_UMFPACK_FOUND TRUE)"
        $lines += "set(SuiteSparse_SPQR_FOUND TRUE)"
        $lines += "set(SuiteSparse_KLU_FOUND TRUE)"
        $lines += "set(SuiteSparse_LDL_FOUND TRUE)"
        $lines += "set(SuiteSparse_BTF_FOUND TRUE)"
        $lines += "set(SuiteSparse_CXSPARSE_FOUND TRUE)"
        $lines += "set(SuiteSparse_SUITESPARSECONFIG_FOUND TRUE)"
        $lines += ""
        $lines += "# BLAS/LAPACK"
        $lines += "set(SuiteSparse_BLAS_LIBRARY `"$vcpkgPath/lib/openblas.lib`")"
        $lines += "set(SuiteSparse_LAPACK_LIBRARY `"$vcpkgPath/lib/lapack.lib`")"
        $lines += ""
        $lines += "# Create a dummy target if needed"
        $lines += "if(NOT TARGET SuiteSparse::SuiteSparse)"
        $lines += "  add_library(SuiteSparse::SuiteSparse INTERFACE IMPORTED)"
        $lines += "  target_include_directories(SuiteSparse::SuiteSparse INTERFACE `${SuiteSparse_INCLUDE_DIR}`)"
        $lines += "  target_link_libraries(SuiteSparse::SuiteSparse INTERFACE `${SuiteSparse_BLAS_LIBRARY}` `${SuiteSparse_LAPACK_LIBRARY}`)"
        $lines += "endif()"
        $lines += ""
        $lines += "message(STATUS `"CI: Using vcpkg SuiteSparse`")"
        
        $content = $lines -join "`n"
        $content | Set-Content "cmake/FindSuiteSparse.cmake" -Encoding UTF8
        
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1
      
    - name: Configure CMake
      run: |
        $vcpkgPath = "$env:GITHUB_WORKSPACE/vcpkg/installed/x64-windows" -replace '\\', '/'
        
        cmake -B build `
          -DBFF_BUILD_GUI=ON `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" `
          -DSuiteSparse_DIR="$vcpkgPath" `
          -DSuiteSparse_ROOT="$vcpkgPath"
        
    - name: Build
      run: |
        cmake --build build --config Release --parallel 2
        
    - name: Check results
      run: |
        if (Test-Path "build/Release/bff-viewer.exe") {
            echo "✅ SUCCESS: bff-viewer.exe built!"
            dir "build/Release/bff-viewer.exe"
        } else {
            echo "❌ Viewer not found"
            Get-ChildItem -Path build -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue
        }
