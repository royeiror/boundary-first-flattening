name: Build BFF for Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout BFF repository
      uses: actions/checkout@v4
      with:
        repository: royeiror/boundary-first-flattening
        
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2
      
    - name: Install CMake
      uses: jwlawson/actions-setup-cmake@v1
      with:
        cmake-version: '3.28.x'
        
    - name: Clean workspace
      shell: cmd
      run: |
        if exist deps rd /s /q deps
        if exist suitesparse rd /s /q suitesparse
        if exist build rd /s /q build
        
    - name: Download OpenBLAS
      shell: powershell
      run: |
        Write-Host "Downloading OpenBLAS..."
        mkdir -Force deps | Out-Null
        cd deps
        
        $openblasUrl = "https://github.com/xianyi/OpenBLAS/releases/download/v0.3.23/OpenBLAS-0.3.23-x64.zip"
        Invoke-WebRequest -Uri $openblasUrl -OutFile "openblas.zip"
        Expand-Archive -Path "openblas.zip" -DestinationPath "openblas-windows"
        Remove-Item "openblas.zip"
        
        Write-Host "OpenBLAS downloaded!"
        
    - name: Create patch file
      shell: cmd
      run: |
        echo Creating CMake patch file...
        
        rem Create a patch file
        (
          echo # Manual SuiteSparse setup
          echo set(SUITESPARSE_FOUND TRUE)
          echo set(SUITESPARSE_INCLUDE_DIRS "$\{CMAKE_CURRENT_SOURCE_DIR\}/../suitesparse/install/include/suitesparse")
          echo set(SUITESPARSE_LIBRARIES 
          echo     "$\{CMAKE_CURRENT_SOURCE_DIR\}/../suitesparse/install/lib/cholmod.lib"
          echo     "$\{CMAKE_CURRENT_SOURCE_DIR\}/../suitesparse/install/lib/amd.lib"
          echo     "$\{CMAKE_CURRENT_SOURCE_DIR\}/../suitesparse/install/lib/colamd.lib"
          echo     "$\{CMAKE_CURRENT_SOURCE_DIR\}/../suitesparse/install/lib/suitesparseconfig.lib")
          echo set(CHOLMOD_FOUND TRUE)
          echo set(CHOLMOD_LIBRARIES "$\{CMAKE_CURRENT_SOURCE_DIR\}/../suitesparse/install/lib/cholmod.lib")
          echo set(CHOLMOD_INCLUDE_DIRS "$\{CMAKE_CURRENT_SOURCE_DIR\}/../suitesparse/install/include/suitesparse")
        ) > cmake_patch.txt
        
    - name: Patch BFF CMakeLists.txt
      shell: powershell
      run: |
        Write-Host "Patching BFF CMakeLists.txt..."
        
        # Backup original
        Copy-Item CMakeLists.txt CMakeLists.txt.backup -Force
        
        # Read the file
        $content = Get-Content CMakeLists.txt -Raw
        
        # Comment out the find_package line
        $content = $content -replace 'find_package\(SuiteSparse REQUIRED\)', '#find_package(SuiteSparse REQUIRED)'
        
        # Add our manual setup
        $patch = Get-Content cmake_patch.txt -Raw
        $content = $content + "`n" + $patch
        
        # Write back
        Set-Content CMakeLists.txt $content -Encoding ASCII
        
        Write-Host "Patch applied!"
        Write-Host "First few lines of patched file:"
        Get-Content CMakeLists.txt | Select-Object -First 20
        
    - name: Build minimal SuiteSparse
      shell: cmd
      run: |
        echo Building minimal SuiteSparse...
        
        rem Clean and create directories
        if exist suitesparse rd /s /q suitesparse
        mkdir suitesparse
        cd suitesparse
        
        rem Download SuiteSparse (older, simpler version)
        echo Downloading SuiteSparse...
        curl -L https://github.com/DrTimothyAldenDavis/SuiteSparse/archive/refs/tags/v5.10.1.tar.gz -o SuiteSparse.tar.gz
        tar -xzf SuiteSparse.tar.gz --strip-components=1
        del SuiteSparse.tar.gz
        
        rem Find OpenBLAS library
        for /r ..\deps\openblas-windows %%i in (*.lib) do set OPENBLAS_LIB=%%i
        echo Found OpenBLAS: %OPENBLAS_LIB%
        
        rem Create install directories
        mkdir install
        mkdir install\include
        mkdir install\include\suitesparse
        mkdir install\lib
        
        rem Copy basic headers
        copy SuiteSparse_config\Include\*.h install\include\suitesparse\ 2>nul || echo No SuiteSparse_config headers
        copy AMD\Include\*.h install\include\suitesparse\ 2>nul || echo No AMD headers
        copy COLAMD\Include\*.h install\include\suitesparse\ 2>nul || echo No COLAMD headers
        copy CHOLMOD\Include\*.h install\include\suitesparse\ 2>nul || echo No CHOLMOD headers
        
        rem Create a simple SuiteSparse_config.h
        (
          echo /* Minimal SuiteSparse_config.h */
          echo #ifndef SUITESPARSE_CONFIG_H
          echo #define SUITESPARSE_CONFIG_H
          echo #define SUITESPARSE_VERSION "5.10.1"
          echo #define SUITESPARSE_MAIN_VERSION 5
          echo #define SUITESPARSE_SUB_VERSION 10
          echo #define SUITESPARSE_SUBSUB_VERSION 1
          echo #endif
        ) > install\include\suitesparse\SuiteSparse_config.h
        
        rem Build AMD (simple, no dependencies)
        echo Building AMD...
        cd AMD
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
        cmake --build . --config Release
        copy Release\*.lib ..\..\install\lib\
        cd ..\..
        
        rem Build COLAMD (simple, no dependencies)
        echo Building COLAMD...
        cd COLAMD
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
        cmake --build . --config Release
        copy Release\*.lib ..\..\install\lib\
        cd ..\..
        
        rem Try to build CHOLMOD with simplified settings
        echo Trying to build CHOLMOD...
        cd CHOLMOD
        mkdir build
        cd build
        
        rem Try without BLAS first
        cmake .. -G "Visual Studio 17 2022" -A x64 ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DBUILD_SHARED_LIBS=OFF ^
          -DNSUPERNODAL=OFF ^
          -DNMATRIXOPS=OFF
        
        cmake --build . --config Release
        if exist Release\*.lib (
          copy Release\*.lib ..\..\install\lib\
          echo CHOLMOD built successfully
        ) else (
          echo WARNING: CHOLMOD build failed, creating dummy library
          cd ..\..\install\lib
          echo. > cholmod.lib
        )
        
        rem Create dummy suitesparseconfig.lib if needed
        cd ..\install\lib
        if not exist suitesparseconfig.lib (
          echo. > suitesparseconfig.lib
        )
        
        rem Rename libraries if they have _static suffix
        for %%f in (*_static.lib) do (
          set name=%%~nf
          set name=!name:_static=!
          copy %%f !name!.lib
        )
        
        echo SuiteSparse libraries:
        dir *.lib
        
    - name: Configure BFF
      shell: cmd
      run: |
        echo Configuring BFF...
        if exist build rd /s /q build
        mkdir build
        cd build
        
        set SUITESPARSE_DIR=%GITHUB_WORKSPACE%\suitesparse\install
        
        rem Find OpenBLAS library
        for /r %GITHUB_WORKSPACE%\deps\openblas-windows %%i in (*.lib) do set OPENBLAS_LIB=%%i
        
        echo SuiteSparse dir: %SUITESPARSE_DIR%
        echo OpenBLAS lib: %OPENBLAS_LIB%
        
        rem Try to configure
        cmake .. -G "Visual Studio 17 2022" -A x64 ^
          -DCMAKE_BUILD_TYPE=%BUILD_TYPE% ^
          -DSUITESPARSE_INCLUDE_DIR="%SUITESPARSE_DIR%\include\suitesparse" ^
          -DSUITESPARSE_LIBRARY_DIR="%SUITESPARSE_DIR%\lib" ^
          -DBLAS_LIBRARIES="%OPENBLAS_LIB%" ^
          -DLAPACK_LIBRARIES="%OPENBLAS_LIB%"
        
    - name: Build BFF
      shell: cmd
      run: |
        echo Building BFF...
        cd build
        
        rem Try to build
        cmake --build . --config Release --target bff-command-line || echo "Build failed, trying alternative target"
        
        rem Try alternative target names
        if not exist Release\bff-command-line.exe (
          cmake --build . --config Release || echo "Build failed"
        )
        
        if exist Release\*.exe (
          echo SUCCESS: Executable(s) built!
          dir Release\*.exe
        ) else (
          echo ERROR: No executables found
          echo Looking for any executables...
          dir /s *.exe 2>nul || echo No executables found anywhere
        )
        
    - name: Copy dependencies
      shell: cmd
      run: |
        echo Copying dependencies...
        if exist Release\*.exe (
          rem Copy DLLs if any
          for /r %GITHUB_WORKSPACE%\deps\openblas-windows %%i in (*.dll) do (
            copy "%%i" build\Release\ 2>nul && echo Copied: %%~nxi
          )
        )
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: success() || failure()
      with:
        name: bff-windows-build
        path: |
          build/
          suitesparse/install/
        retention-days: 7
