name: Debug BFF Build

on: workflow_dispatch

jobs:
  debug:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        repository: royeiror/boundary-first-flattening
        submodules: recursive
        
    - name: Initial analysis
      shell: cmd
      run: |
        echo "=== Initial Repository Analysis ==="
        echo.
        echo "Directory structure:"
        dir
        
        echo.
        echo "CMakeLists.txt exists:" 
        if exist CMakeLists.txt echo YES && type CMakeLists.txt | head -30
        
        echo.
        echo "Looking for source directories:"
        dir /b /ad src source lib include 2>nul
        
        echo.
        echo "Checking for executable source files:"
        findstr /S /M "main(" *.cpp *.c 2>nul
        
    - name: Create minimal build setup
      shell: cmd
      run: |
        echo "=== Creating minimal build ==="
        
        rem Create dummy SuiteSparse
        mkdir suitesparse\install\include\suitesparse
        mkdir suitesparse\install\lib
        
        cd suitesparse\install\include\suitesparse
        echo #define SUITESPARSE_VERSION "1.0" > SuiteSparse_config.h
        echo #define AMD_VERSION "1.0" > amd.h
        echo #define COLAMD_VERSION "1.0" > colamd.h
        echo #define CHOLMOD_VERSION "1.0" > cholmod.h
        
        cd ..\..\lib
        echo. > suitesparseconfig.lib
        echo. > amd.lib
        echo. > colamd.lib
        echo. > cholmod.lib
        
        cd ../../..
        
        rem Backup original CMakeLists.txt
        copy CMakeLists.txt CMakeLists.txt.orig
        
    - name: Try to understand build system
      shell: cmd
      run: |
        echo "=== Analyzing CMakeLists.txt ==="
        
        echo.
        echo "CMakeLists.txt summary:"
        echo "Total lines:" && find /c /v "" < CMakeLists.txt
        
        echo.
        echo "Looking for project() command:"
        findstr /I "project(" CMakeLists.txt
        
        echo.
        echo "Looking for add_executable() commands:"
        findstr /I "add_executable" CMakeLists.txt
        
        echo.
        echo "Looking for add_library() commands:"
        findstr /I "add_library" CMakeLists.txt | head -10
        
        echo.
        echo "Looking for target names:"
        findstr /I "add_executable\|add_library" CMakeLists.txt | findstr /v "#" | sed "s/.*(//" | sed "s/ .*//" | sort | uniq
        
    - name: Create simplified CMakeLists.txt
      shell: cmd
      run: |
        echo "=== Creating simplified CMakeLists.txt ==="
        
        rem Create a minimal CMakeLists.txt
        (
          echo cmake_minimum_required(VERSION 3.5)
          echo project(bff)
          echo 
          echo set(CMAKE_CXX_STANDARD 11)
          echo set(CMAKE_CXX_STANDARD_REQUIRED ON)
          echo 
          echo # Dummy SuiteSparse setup
          echo set(SUITESPARSE_FOUND TRUE)
          echo set(SUITESPARSE_INCLUDE_DIRS "${CMAKE_CURRENT_SOURCE_DIR}/suitesparse/install/include/suitesparse")
          echo set(SUITESPARSE_LIBRARIES "${CMAKE_CURRENT_SOURCE_DIR}/suitesparse/install/lib/cholmod.lib")
          echo 
          echo # Find source files
          echo file(GLOB_RECURSE SOURCES "*.cpp" "*.c")
          echo message(STATUS "Found sources: $\{SOURCES\}")
          echo 
          echo # Try to build everything
          echo foreach(source $\{SOURCES\})
          echo   get_filename_component(name $\{source\} NAME_WE)
          echo   add_executable($\{name\} $\{source\})
          echo endforeach()
        ) > CMakeLists_simple.txt
        
        echo "Simple CMakeLists.txt created"
        type CMakeLists_simple.txt
        
    - name: Try simple build
      shell: cmd
      run: |
        echo "=== Trying simple build ==="
        
        rem Use our simple CMakeLists.txt
        copy CMakeLists_simple.txt CMakeLists.txt
        
        mkdir build_simple
        cd build_simple
        
        rem Configure
        cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release 2>&1 | tail -50
        
        rem Try to build
        cmake --build . --config Release 2>&1 | tail -50
        
        echo.
        echo "Build results:"
        dir /s *.exe 2>nul || echo "No executables built"
        
    - name: Check original build with debug
      shell: cmd
      run: |
        echo "=== Checking original build with debug output ==="
        
        rem Restore original
        copy CMakeLists.txt.orig CMakeLists.txt
        
        mkdir build_orig
        cd build_orig
        
        rem Configure with maximum verbosity
        echo "CMake configure output:"
        cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release --trace 2>&1 | head -200
        
    - name: Search for build scripts
      shell: cmd
      run: |
        echo "=== Looking for alternative build methods ==="
        
        echo.
        echo "Looking for Makefiles:"
        dir /b /s Makefile makefile 2>nul
        
        echo.
        echo "Looking for build scripts:"
        dir /b /s build.sh build.cmd build.bat BUILD* 2>nul
        
        echo.
        echo "Looking for Visual Studio projects:"
        dir /b /s *.sln *.vcxproj 2>nul
        
    - name: Upload all for analysis
      uses: actions/upload-artifact@v4
      with:
        name: bff-debug-analysis
        path: |
          CMakeLists.txt.orig
          CMakeLists.txt
          CMakeLists_simple.txt
          build_orig/
          build_simple/
        retention-days: 7
