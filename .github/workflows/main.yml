name: Build BFF Windows Binary

on:
  push:
    tags: ['v*']
  release:
    types: [created]
  workflow_dispatch:  # Manual trigger

jobs:
  build-windows:
    name: Build BFF Command Line (Windows x64)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Clean existing directories
      run: |
        # Clean up any existing directories completely
        if (Test-Path "SuiteSparse") {
            echo "Removing existing SuiteSparse directory..."
            Remove-Item -Recurse -Force SuiteSparse
        }
        if (Test-Path "build") {
            echo "Removing existing build directory..."
            Remove-Item -Recurse -Force build
        }

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install build tools
      run: |
        choco install cmake -y
        choco install git -y

    - name: Clone SuiteSparse
      run: |
        # Clone SuiteSparse without any existing directories
        git clone https://github.com/DrTimothyAldenDavis/SuiteSparse.git SuiteSparse-fresh
        cd SuiteSparse-fresh
        
        # Check if build directory exists from clone
        if (Test-Path "build") {
            echo "Removing build directory from clone..."
            Remove-Item -Recurse -Force build
        }
        
        # Create fresh build directory
        mkdir build
        cd build
        
        echo "Building SuiteSparse..."
        # Build SuiteSparse using CMake with policy workaround
        cmake .. `
          -DCMAKE_INSTALL_PREFIX="$pwd\install" `
          -DCMAKE_BUILD_TYPE=Release `
          -G "Visual Studio 17 2022" -A x64
        
        cmake --build . --config Release --target install --parallel
        
        # Verify the build
        if (Test-Path "install\lib\libcholmod.lib") {
            echo "✓ SuiteSparse built successfully!"
        } else {
            echo "✗ SuiteSparse build failed - libcholmod.lib not found"
            dir install\lib /s
            exit 1
        }

    - name: Fix CMake compatibility
      run: |
        # Apply CMake policy override by creating a wrapper
        if (Test-Path "CMakeLists.txt") {
            # Create a backup
            Copy-Item CMakeLists.txt CMakeLists.txt.original
            
            # Read the first few lines to check the current version
            $lines = Get-Content CMakeLists.txt
            $firstLine = $lines[0]
            echo "First line of CMakeLists.txt: $firstLine"
            
            # Update the cmake_minimum_required line if needed
            $updatedContent = $lines -replace '^cmake_minimum_required\(.*\)', 'cmake_minimum_required(VERSION 3.5)'
            $updatedContent | Set-Content CMakeLists.txt
            
            echo "Updated CMakeLists.txt"
        }

    - name: Setup OpenBLAS
      run: |
        # Check for OpenBLAS in deps
        if (Test-Path "deps/openblas-windows") {
            echo "✓ OpenBLAS found in deps"
            dir deps\openblas-windows /s
        } else {
            echo "✗ OpenBLAS not found in deps/openblas-windows"
            echo "This will likely cause build failures"
            # Create directory structure to avoid CMake errors
            mkdir deps\openblas-windows\lib -Force
            mkdir deps\openblas-windows\include -Force
        }

    - name: Configure BFF
      run: |
        $SuiteSparseDir = "$pwd\SuiteSparse-fresh\build\install"
        $OpenBLASDir = "$pwd\deps\openblas-windows"
        
        echo "Using SuiteSparse from: $SuiteSparseDir"
        echo "Using OpenBLAS from: $OpenBLASDir"
        
        # Create fresh BFF build directory
        if (Test-Path "build") {
            Remove-Item -Recurse -Force build
        }
        mkdir build
        cd build
        
        # Configure BFF with CMake policy override
        cmake .. `
          -DCMAKE_POLICY_DEFAULT_CMP0001=NEW `
          -DCMAKE_BUILD_TYPE=Release `
          -DSuiteSparse_CHOLMOD_DIR="$SuiteSparseDir\lib" `
          -DSuiteSparse_CHOLMOD_INCLUDE_DIR="$SuiteSparseDir\include\suitesparse" `
          -DSuiteSparse_CHOLMOD_LIBRARY_RELEASE="$SuiteSparseDir\lib\libcholmod.lib" `
          -DSuiteSparse_AMD_LIBRARY_RELEASE="$SuiteSparseDir\lib\libamd.lib" `
          -DSuiteSparse_CAMD_LIBRARY_RELEASE="$SuiteSparseDir\lib\libcamd.lib" `
          -DSuiteSparse_CCOLAMD_LIBRARY_RELEASE="$SuiteSparseDir\lib\libccolamd.lib" `
          -DSuiteSparse_COLAMD_LIBRARY_RELEASE="$SuiteSparseDir\lib\libcolamd.lib" `
          -DSuiteSparse_BLAS_LIBRARY="$OpenBLASDir\lib\libopenblas.lib" `
          -DSuiteSparse_LAPACK_LIBRARY="$OpenBLASDir\lib\libopenblas.lib" `
          -G "Visual Studio 17 2022" -A x64

    - name: Build BFF
      run: |
        cd build
        cmake --build . --config Release --target bff-command-line --parallel

    - name: Find and test executable
      run: |
        echo "Searching for built executables..."
        $exes = Get-ChildItem -Path . -Recurse -Filter *.exe
        if ($exes) {
            foreach ($exe in $exes) {
                echo "Found: $($exe.FullName)"
                # Try to run with --help to test
                try {
                    & $exe.FullName --help
                    echo "✓ $($exe.Name) runs successfully"
                } catch {
                    echo "  - Could not execute (may require specific arguments)"
                }
            }
        } else {
            echo "No executables found!"
            echo "Build directory contents:"
            dir build -Recurse
        }

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bff-windows-build
        path: |
          build/**/*.exe
          build/**/*.dll
        retention-days: 30
