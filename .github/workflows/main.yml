name: Build BFF for Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [created]
  workflow_dispatch:

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-windows

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install vcpkg and dependencies
      shell: powershell
      run: |
        # Install vcpkg
        git clone https://github.com/Microsoft/vcpkg.git $env:VCPKG_ROOT
        & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"
        
        # Install required dependencies
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET eigen3
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET libigl
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET suitesparse
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET metis
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glfw3
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glew
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET freeglut
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glm

    - name: Clone BFF repository v1.6
      shell: powershell
      run: |
        Write-Host "Cloning BFF v1.6..."
        
        # Clean up any existing files first
        Remove-Item -Path "src" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "apps" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "include" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "deps" -Recurse -Force -ErrorAction SilentlyContinue
        
        # Clone the repository
        git clone --depth 1 --branch v1.6 https://github.com/GeometryCollective/boundary-first-flattening.git bff-source
        
        # Copy the source files
        Write-Host "Copying source files..."
        Copy-Item -Path "bff-source/src" -Destination "." -Recurse -Force
        Copy-Item -Path "bff-source/apps" -Destination "." -Recurse -Force
        Copy-Item -Path "bff-source/include" -Destination "." -Recurse -Force
        Copy-Item -Path "bff-source/deps" -Destination "." -Recurse -Force
        Copy-Item -Path "bff-source/binaries" -Destination "." -Recurse -Force

    - name: Download pre-made CMakeLists.txt
      shell: powershell
      run: |
        # Since creating CMakeLists.txt with PowerShell in YAML is problematic,
        # let's download a pre-made one or create it with minimal PowerShell
        Write-Host "Creating CMakeLists.txt with minimal PowerShell..."
        
        # Create the file line by line using simple echo-style commands
        # We'll use a different approach: write each line individually
        
        # First, create an empty file
        New-Item -ItemType File -Path "CMakeLists.txt" -Force
        
        # Now append each line using Add-Content with simple strings
        # We'll use single quotes for CMake variables to avoid PowerShell expansion
        
        # Basic CMake setup
        'cmake_minimum_required(VERSION 3.15)' | Add-Content -Path "CMakeLists.txt"
        'project(BFF)' | Add-Content -Path "CMakeLists.txt"
        '' | Add-Content -Path "CMakeLists.txt"
        'set(CMAKE_CXX_STANDARD 17)' | Add-Content -Path "CMakeLists.txt"
        'set(CMAKE_CXX_STANDARD_REQUIRED ON)' | Add-Content -Path "CMakeLists.txt"
        '' | Add-Content -Path "CMakeLists.txt"
        
        # VCPKG paths
        'set(VCPKG_INSTALLED_DIR "$ENV{VCPKG_ROOT}/installed/$ENV{VCPKG_DEFAULT_TRIPLET}")' | Add-Content -Path "CMakeLists.txt"
        '' | Add-Content -Path "CMakeLists.txt"
        
        # Include directories
        'include_directories(' | Add-Content -Path "CMakeLists.txt"
        '    ${CMAKE_SOURCE_DIR}/include' | Add-Content -Path "CMakeLists.txt"
        '    ${CMAKE_SOURCE_DIR}/deps/libigl/include' | Add-Content -Path "CMakeLists.txt"
        '    ${CMAKE_SOURCE_DIR}/deps/spectra/include' | Add-Content -Path "CMakeLists.txt"
        '    ${VCPKG_INSTALLED_DIR}/include' | Add-Content -Path "CMakeLists.txt"
        '    ${VCPKG_INSTALLED_DIR}/include/eigen3' | Add-Content -Path "CMakeLists.txt"
        ')' | Add-Content -Path "CMakeLists.txt"
        '' | Add-Content -Path "CMakeLists.txt"
        
        # Find libraries
        'file(GLOB CHOLMOD_LIBS "${VCPKG_INSTALLED_DIR}/lib/*cholmod*.lib")' | Add-Content -Path "CMakeLists.txt"
        'file(GLOB AMD_LIBS "${VCPKG_INSTALLED_DIR}/lib/*amd*.lib")' | Add-Content -Path "CMakeLists.txt"
        'file(GLOB CAMD_LIBS "${VCPKG_INSTALLED_DIR}/lib/*camd*.lib")' | Add-Content -Path "CMakeLists.txt"
        'file(GLOB COLAMD_LIBS "${VCPKG_INSTALLED_DIR}/lib/*colamd*.lib")' | Add-Content -Path "CMakeLists.txt"
        'file(GLOB CCOLAMD_LIBS "${VCPKG_INSTALLED_DIR}/lib/*ccolamd*.lib")' | Add-Content -Path "CMakeLists.txt"
        'file(GLOB METIS_LIBS "${VCPKG_INSTALLED_DIR}/lib/*metis*.lib")' | Add-Content -Path "CMakeLists.txt"
        'file(GLOB GLFW_LIBS "${VCPKG_INSTALLED_DIR}/lib/*glfw*.lib")' | Add-Content -Path "CMakeLists.txt"
        'file(GLOB GLEW_LIBS "${VCPKG_INSTALLED_DIR}/lib/*glew*.lib")' | Add-Content -Path "CMakeLists.txt"
        '' | Add-Content -Path "CMakeLists.txt"
        
        # Get libraries
        'if(CHOLMOD_LIBS)' | Add-Content -Path "CMakeLists.txt"
        '    list(GET CHOLMOD_LIBS 0 CHOLMOD_LIBRARY)' | Add-Content -Path "CMakeLists.txt"
        '    message(STATUS "Found CHOLMOD: ${CHOLMOD_LIBRARY}")' | Add-Content -Path "CMakeLists.txt"
        'else()' | Add-Content -Path "CMakeLists.txt"
        '    message(FATAL_ERROR "CHOLMOD library not found")' | Add-Content -Path "CMakeLists.txt"
        'endif()' | Add-Content -Path "CMakeLists.txt"
        '' | Add-Content -Path "CMakeLists.txt"
        
        # Other libraries (simplified)
        'if(AMD_LIBS) list(GET AMD_LIBS 0 AMD_LIBRARY) endif()' | Add-Content -Path "CMakeLists.txt"
        'if(CAMD_LIBS) list(GET CAMD_LIBS 0 CAMD_LIBRARY) endif()' | Add-Content -Path "CMakeLists.txt"
        'if(COLAMD_LIBS) list(GET COLAMD_LIBS 0 COLAMD_LIBRARY) endif()' | Add-Content -Path "CMakeLists.txt"
        'if(CCOLAMD_LIBS) list(GET CCOLAMD_LIBS 0 CCOLAMD_LIBRARY) endif()' | Add-Content -Path "CMakeLists.txt"
        'if(METIS_LIBS) list(GET METIS_LIBS 0 METIS_LIBRARY) endif()' | Add-Content -Path "CMakeLists.txt"
        '' | Add-Content -Path "CMakeLists.txt"
        
        'if(GLFW_LIBS)' | Add-Content -Path "CMakeLists.txt"
        '    list(GET GLFW_LIBS 0 GLFW_LIBRARY)' | Add-Content -Path "CMakeLists.txt"
        '    message(STATUS "Found GLFW: ${GLFW_LIBRARY}")' | Add-Content -Path "CMakeLists.txt"
        'else()' | Add-Content -Path "CMakeLists.txt"
        '    message(FATAL_ERROR "GLFW library not found")' | Add-Content -Path "CMakeLists.txt"
        'endif()' | Add-Content -Path "CMakeLists.txt"
        '' | Add-Content -Path "CMakeLists.txt"
        
        'if(GLEW_LIBS)' | Add-Content -Path "CMakeLists.txt"
        '    list(GET GLEW_LIBS 0 GLEW_LIBRARY)' | Add-Content -Path "CMakeLists.txt"
        '    message(STATUS "Found GLEW: ${GLEW_LIBRARY}")' | Add-Content -Path "CMakeLists.txt"
        'else()' | Add-Content -Path "CMakeLists.txt"
        '    message(FATAL_ERROR "GLEW library not found")' | Add-Content -Path "CMakeLists.txt"
        'endif()' | Add-Content -Path "CMakeLists.txt"
        '' | Add-Content -Path "CMakeLists.txt"
        
        # OpenGL
        'if(WIN32)' | Add-Content -Path "CMakeLists.txt"
        '    set(OPENGL_LIBRARIES "opengl32")' | Add-Content -Path "CMakeLists.txt"
        'else()' | Add-Content -Path "CMakeLists.txt"
        '    set(OPENGL_LIBRARIES "GL")' | Add-Content -Path "CMakeLists.txt"
        'endif()' | Add-Content -Path "CMakeLists.txt"
        '' | Add-Content -Path "CMakeLists.txt"
        
        # Source files
        'set(SRC_FILES' | Add-Content -Path "CMakeLists.txt"
        '    ${CMAKE_SOURCE_DIR}/src/bff.cpp' | Add-Content -Path "CMakeLists.txt"
        '    ${CMAKE_SOURCE_DIR}/src/ConePlacement.cpp' | Add-Content -Path "CMakeLists.txt"
        '    ${CMAKE_SOURCE_DIR}/src/Cutting.cpp' | Add-Content -Path "CMakeLists.txt"
        '    ${CMAKE_SOURCE_DIR}/src/Distance.cpp' | Add-Content -Path "CMakeLists.txt"
        '    ${CMAKE_SOURCE_DIR}/src/HodgeDecomposition.cpp' | Add-Content -Path "CMakeLists.txt"
        '    ${CMAKE_SOURCE_DIR}/src/LinearSolver.cpp' | Add-Content -Path "CMakeLists.txt"
        '    ${CMAKE_SOURCE_DIR}/src/Mesh.cpp' | Add-Content -Path "CMakeLists.txt"
        '    ${CMAKE_SOURCE_DIR}/src/Projection.cpp' | Add-Content -Path "CMakeLists.txt"
        '    ${CMAKE_SOURCE_DIR}/src/Serialization.cpp' | Add-Content -Path "CMakeLists.txt"
        '    ${CMAKE_SOURCE_DIR}/src/Vertex.cpp' | Add-Content -Path "CMakeLists.txt"
        ')' | Add-Content -Path "CMakeLists.txt"
        '' | Add-Content -Path "CMakeLists.txt"
        
        # Create library
        'add_library(bff-lib STATIC ${SRC_FILES})' | Add-Content -Path "CMakeLists.txt"
        '' | Add-Content -Path "CMakeLists.txt"
        
        # Link libraries
        'target_link_libraries(bff-lib' | Add-Content -Path "CMakeLists.txt"
        '    ${CHOLMOD_LIBRARY}' | Add-Content -Path "CMakeLists.txt"
        '    ${AMD_LIBRARY}' | Add-Content -Path "CMakeLists.txt"
        '    ${CAMD_LIBRARY}' | Add-Content -Path "CMakeLists.txt"
        '    ${COLAMD_LIBRARY}' | Add-Content -Path "CMakeLists.txt"
        '    ${CCOLAMD_LIBRARY}' | Add-Content -Path "CMakeLists.txt"
        '    ${METIS_LIBRARY}' | Add-Content -Path "CMakeLists.txt"
        ')' | Add-Content -Path "CMakeLists.txt"
        '' | Add-Content -Path "CMakeLists.txt"
        
        # GUI executable
        'set(GUI_FILES' | Add-Content -Path "CMakeLists.txt"
        '    ${CMAKE_SOURCE_DIR}/apps/main.cpp' | Add-Content -Path "CMakeLists.txt"
        '    ${CMAKE_SOURCE_DIR}/apps/Viewer.cpp' | Add-Content -Path "CMakeLists.txt"
        ')' | Add-Content -Path "CMakeLists.txt"
        '' | Add-Content -Path "CMakeLists.txt"
        
        'if(EXISTS "${CMAKE_SOURCE_DIR}/apps/main.cpp")' | Add-Content -Path "CMakeLists.txt"
        '    add_executable(bff-gui ${GUI_FILES})' | Add-Content -Path "CMakeLists.txt"
        '    target_link_libraries(bff-gui bff-lib' | Add-Content -Path "CMakeLists.txt"
        '        ${OPENGL_LIBRARIES}' | Add-Content -Path "CMakeLists.txt"
        '        ${GLFW_LIBRARY}' | Add-Content -Path "CMakeLists.txt"
        '        ${GLEW_LIBRARY}' | Add-Content -Path "CMakeLists.txt"
        '    )' | Add-Content -Path "CMakeLists.txt"
        '    target_include_directories(bff-gui PRIVATE ${CMAKE_SOURCE_DIR}/apps)' | Add-Content -Path "CMakeLists.txt"
        '    message(STATUS "Building GUI application")' | Add-Content -Path "CMakeLists.txt"
        'else()' | Add-Content -Path "CMakeLists.txt"
        '    message(WARNING "GUI source files not found")' | Add-Content -Path "CMakeLists.txt"
        'endif()' | Add-Content -Path "CMakeLists.txt"
        
        Write-Host "Created CMakeLists.txt"

    - name: Configure CMake
      shell: powershell
      run: |
        # Create build directory
        New-Item -ItemType Directory -Force -Path "build"
        
        Write-Host "Configuring CMake..."
        
        # Configure with CMake
        cmake -B build `
          -DCMAKE_BUILD_TYPE=Release `
          -G "Visual Studio 17 2022" `
          -A x64

    - name: Build BFF
      shell: powershell
      run: |
        Write-Host "Building project..."
        cmake --build build --config Release --parallel 4

    - name: Find and copy executables
      shell: powershell
      run: |
        # Create distribution directory
        New-Item -ItemType Directory -Force -Path "dist"
        
        Write-Host "Searching for executables..."
        
        # Search for executables
        $exes = Get-ChildItem -Path "build" -Filter "*.exe" -Recurse
        foreach ($exe in $exes) {
          Write-Host "Found executable: $($exe.FullName)"
          Copy-Item -Path $exe.FullName -Destination "dist\" -Force
        }
        
        if ($exes.Count -eq 0) {
          Write-Host "No executables found! Checking build directory..."
          Get-ChildItem -Path "build" -Recurse | Select-Object -First 20 | Format-Table Name
        }
        
        # Copy DLLs
        $vcpkgBinPath = "$env:VCPKG_ROOT\installed\$env:VCPKG_DEFAULT_TRIPLET\bin"
        if (Test-Path $vcpkgBinPath) {
          Write-Host "Copying DLLs from vcpkg..."
          Get-ChildItem -Path $vcpkgBinPath -Filter "*.dll" | Copy-Item -Destination "dist\" -Force
        }
        
        # List what we have
        Write-Host "`nFiles in dist directory:"
        Get-ChildItem -Path "dist"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BFF-Windows-Binaries
        path: dist/

    - name: Create release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/**
        generate_release_notes: true
