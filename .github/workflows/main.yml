name: Build BFF Viewer

on: workflow_dispatch

jobs:
  build-viewer:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Install vcpkg
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg install suitesparse:x64-windows
        
    - name: Copy SuiteSparse headers to include directory
      run: |
        $vcpkgPath = "$env:GITHUB_WORKSPACE/vcpkg/installed/x64-windows"
        
        # Create include directory in workspace root
        mkdir include -Force
        
        # Copy ALL headers from vcpkg
        echo "Copying headers from $vcpkgPath..."
        Get-ChildItem "$vcpkgPath" -Filter "*.h" -Recurse | ForEach-Object {
            $target = "include/$($_.Name)"
            Copy-Item $_.FullName $target -Force
            echo "Copied: $($_.Name)"
        }
        
        # Also look specifically for cholmod.h
        $cholmod = Get-ChildItem "$vcpkgPath" -Filter "cholmod.h" -Recurse | Select-Object -First 1
        if ($cholmod) {
            echo "cholmod.h found at: $($cholmod.FullName)"
            Copy-Item $cholmod.FullName "include/cholmod.h" -Force
            echo "✅ cholmod.h copied to include/"
        } else {
            echo "❌ cholmod.h not found!"
            echo "Contents of vcpkg/include:"
            Get-ChildItem "$vcpkgPath/include" -Recurse | Select-Object -First 10
        }
        
    - name: Patch source files
      run: |
        # Patch the two .inl files
        $file1 = "include/bff/linear-algebra/DenseMatrix.inl"
        $file2 = "include/bff/linear-algebra/SparseMatrix.inl"
        
        if (Test-Path $file1) {
            (Get-Content $file1) -replace 'cholmod_l_', 'cholmod_' | Set-Content $file1
            echo "Patched $file1"
        }
        
        if (Test-Path $file2) {
            (Get-Content $file2) -replace 'cholmod_l_', 'cholmod_' | Set-Content $file2
            echo "Patched $file2"
        }
        
    - name: Create simple CMake config
      run: |
        $path = "$env:GITHUB_WORKSPACE/vcpkg/installed/x64-windows" -replace '\\', '/'
        
        # Write minimal FindSuiteSparse.cmake
        echo "set(SuiteSparse_FOUND TRUE)" | Out-File cmake/FindSuiteSparse.cmake
        echo "set(SuiteSparse_INCLUDE_DIR `"$env:GITHUB_WORKSPACE/include`")" | Out-File -Append cmake/FindSuiteSparse.cmake
        echo "set(SuiteSparse_LIBRARY_DIR `"$path/lib`")" | Out-File -Append cmake/FindSuiteSparse.cmake
        echo "set(SuiteSparse_CHOLMOD_LIBRARY `"$path/lib/cholmod.lib`")" | Out-File -Append cmake/FindSuiteSparse.cmake
        echo "set(SuiteSparse_AMD_LIBRARY `"$path/lib/amd.lib`")" | Out-File -Append cmake/FindSuiteSparse.cmake
        echo "message(STATUS `"SuiteSparse configured`")" | Out-File -Append cmake/FindSuiteSparse.cmake
        
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1
      
    - name: Configure CMake
      run: |
        # Add the include directory to CMake
        cmake -B build `
          -DBFF_BUILD_GUI=ON `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_CXX_FLAGS="/I`"$env:GITHUB_WORKSPACE/include`""
        
    - name: Build
      run: |
        cmake --build build --config Release
        
    - name: Check results
      run: |
        if (Test-Path "build/Release/bff-viewer.exe") {
            echo "✅ SUCCESS: bff-viewer.exe built!"
            echo "File info:"
            dir "build/Release/bff-viewer.exe"
        } else {
            echo "❌ Viewer not found"
            echo "Looking for executables..."
            Get-ChildItem -Path build -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue
        }
