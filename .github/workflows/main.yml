name: Build BFF v1.6 Windows with GUI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout BFF repository with submodules
      uses: actions/checkout@v4
      with:
        repository: GeometryCollective/boundary-first-flattening
        submodules: recursive
        ref: v1.6

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      
    - name: Install CMake
      uses: jwlawson/actions-setup-cmake@v1
      with:
        cmake-version: "3.25.x"

    - name: Install build tools
      shell: pwsh
      run: |
        choco install -y git
        choco install -y ninja

    - name: Build SuiteSparse for Windows (with proper config)
      shell: pwsh
      run: |
        $SuiteSparseRepo = "https://github.com/jlblancoc/suitesparse-metis-for-windows"
        $SuiteSparseDir = "suitesparse-build"
        
        Write-Host "Cloning SuiteSparse for Windows..."
        git clone --depth 1 $SuiteSparseRepo $SuiteSparseDir
        cd $SuiteSparseDir
        
        Write-Host "Configuring SuiteSparse with CMake..."
        $BuildDir = "build"
        $InstallDir = "$pwd\install"
        
        # Create install directory
        New-Item -ItemType Directory -Force -Path $InstallDir
        
        # Configure with specific options for Windows
        cmake -B $BuildDir -S . `
          -DCMAKE_INSTALL_PREFIX="$InstallDir" `
          -DCMAKE_BUILD_TYPE=Release `
          -DBUILD_METIS=ON `
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON `
          -G "Visual Studio 17 2022" `
          -A x64
        
        Write-Host "Building SuiteSparse..."
        cmake --build $BuildDir --config Release --target INSTALL --parallel
        
        Write-Host "SuiteSparse built successfully!"
        Write-Host "Install directory: $InstallDir"
        
        # List installed files to verify
        Write-Host "Listing installed files..."
        Get-ChildItem -Path $InstallDir -Recurse | Select-Object -First 20

    - name: Find SuiteSparseConfig.cmake
      shell: pwsh
      run: |
        $SuiteSparseDir = "$pwd\suitesparse-build\install"
        Write-Host "Looking for SuiteSparseConfig.cmake..."
        
        # Search recursively for the config file
        $ConfigFiles = Get-ChildItem -Path $SuiteSparseDir -Filter "*SuiteSparse*config*.cmake" -Recurse
        if ($ConfigFiles) {
            foreach ($file in $ConfigFiles) {
                Write-Host "Found: $($file.FullName)"
                Write-Host "Relative path: $($file.FullName.Replace($pwd + '\', ''))"
            }
        } else {
            Write-Host "No SuiteSparseConfig.cmake found. Searching for any cmake files..."
            $AllCmakeFiles = Get-ChildItem -Path $SuiteSparseDir -Filter "*.cmake" -Recurse
            foreach ($file in $AllCmakeFiles) {
                Write-Host "Found: $($file.FullName)"
            }
        }

    - name: Build BFF with explicit SuiteSparse paths
      shell: pwsh
      run: |
        $SuiteSparseDir = "$pwd\suitesparse-build\install"
        $BFFBuildDir = "bff-build"
        
        Write-Host "Setting up BFF build with explicit SuiteSparse paths..."
        cd "${{ github.workspace }}"
        
        # First, let's manually set the required variables
        $SuiteSparseInclude = "$SuiteSparseDir\include"
        $SuiteSparseLib = "$SuiteSparseDir\lib"
        
        Write-Host "SuiteSparse include dir: $SuiteSparseInclude"
        Write-Host "SuiteSparse lib dir: $SuiteSparseLib"
        
        # Check what's actually in these directories
        Write-Host "Contents of include dir:"
        if (Test-Path $SuiteSparseInclude) {
            Get-ChildItem -Path $SuiteSparseInclude | Select-Object -First 10
        }
        
        Write-Host "Contents of lib dir:"
        if (Test-Path $SuiteSparseLib) {
            Get-ChildItem -Path $SuiteSparseLib | Select-Object -First 20
        }
        
        # Try building with explicit library linking
        cmake -B $BFFBuildDir -S . `
          -DCMAKE_BUILD_TYPE=Release `
          -DBFF_BUILD_GUI=ON `
          -DSUITESPARSE_INCLUDE_DIR="$SuiteSparseInclude" `
          -DSUITESPARSE_LIBRARY_DIR="$SuiteSparseLib" `
          -DSUITESPARSE_FOUND=ON `
          -DSUITESPARSE_INCLUDE_DIR_HINTS="$SuiteSparseInclude" `
          -DSUITESPARSE_LIBRARY_DIR_HINTS="$SuiteSparseLib" `
          -DCMAKE_PREFIX_PATH="$SuiteSparseDir" `
          -G "Visual Studio 17 2022" `
          -A x64
        
        Write-Host "Building BFF..."
        cmake --build $BFFBuildDir --config Release --parallel
        
        Write-Host "BFF build completed!"

    - name: Alternative BFF build (if first fails)
      shell: pwsh
      if: failure()
      run: |
        $SuiteSparseDir = "$pwd\suitesparse-build\install"
        $BFFBuildDir = "bff-build-alt"
        
        Write-Host "Trying alternative build approach..."
        cd "${{ github.workspace }}"
        
        # Create a simple CMakeLists.txt patch or use direct compilation
        # First check the actual CMakeLists.txt structure
        Write-Host "Checking BFF CMakeLists.txt..."
        Get-Content CMakeLists.txt | Select-Object -First 50
        
        # Try a more direct approach - manually specify all SuiteSparse components
        $SuiteSparseLibDir = "$SuiteSparseDir\lib"
        
        # Build with Ninja generator instead
        cmake -B $BFFBuildDir -S . `
          -DCMAKE_BUILD_TYPE=Release `
          -DBFF_BUILD_GUI=ON `
          -DSUITESPARSE_DIR="$SuiteSparseDir" `
          -DSUITESPARSE_INCLUDE_DIR="$SuiteSparseDir\include" `
          -DSUITESPARSE_LIBRARY_DIR="$SuiteSparseLibDir" `
          -DAMD_LIBRARY="$SuiteSparseLibDir\amd.lib" `
          -DCAMD_LIBRARY="$SuiteSparseLibDir\camd.lib" `
          -DCOLAMD_LIBRARY="$SuiteSparseLibDir\colamd.lib" `
          -DCCOLAMD_LIBRARY="$SuiteSparseLibDir\ccolamd.lib" `
          -DCHOLMOD_LIBRARY="$SuiteSparseLibDir\cholmod.lib" `
          -DSUITESPARSECONFIG_LIBRARY="$SuiteSparseLibDir\suitesparseconfig.lib" `
          -G "Ninja"
        
        Write-Host "Building BFF with Ninja..."
        cmake --build $BFFBuildDir --config Release --parallel

    - name: Collect required DLLs
      shell: pwsh
      if: success()
      run: |
        $BuildDir = "bff-build"
        $SuiteSparseDir = "$pwd\suitesparse-build\install"
        $DistDir = "bff-dist"
        
        # Try alternative build directory if main one doesn't exist
        if (-not (Test-Path $BuildDir)) {
            $BuildDir = "bff-build-alt"
        }
        
        New-Item -ItemType Directory -Force -Path $DistDir
        
        Write-Host "Copying BFF executables from $BuildDir..."
        # Look for executables in Release or build directory
        $PossibleExePaths = @(
            "$BuildDir\Release\BFF.exe",
            "$BuildDir\BFF.exe",
            "$BuildDir\src\Release\BFF.exe"
        )
        
        foreach ($path in $PossibleExePaths) {
            if (Test-Path $path) {
                Write-Host "Found executable at: $path"
                Copy-Item $path -Destination $DistDir
                break
            }
        }
        
        Write-Host "Copying SuiteSparse DLLs..."
        $Dlls = Get-ChildItem -Path "$SuiteSparseDir\lib" -Filter "*.dll" -Recurse
        foreach ($dll in $Dlls) {
            Copy-Item $dll.FullName -Destination $DistDir
        }
        
        # Also look for DLLs in bin directory
        if (Test-Path "$SuiteSparseDir\bin") {
            $BinDlls = Get-ChildItem -Path "$SuiteSparseDir\bin" -Filter "*.dll"
            foreach ($dll in $BinDlls) {
                Copy-Item $dll.FullName -Destination $DistDir
            }
        }
        
        Write-Host "Creating README.txt..."
        $ReadmeContent = "Boundary First Flattening (BFF) v1.6 Windows Build" + "`n" + 
                         "=============================================" + "`n" + 
                         "" + "`n" + 
                         "To run BFF:" + "`n" + 
                         "1. Ensure all DLLs are in the same directory as BFF.exe" + "`n" + 
                         "2. Double-click BFF.exe to launch the GUI" + "`n" + 
                         "3. For command-line usage, run bff-command.exe" + "`n" + 
                         "" + "`n" + 
                         "Dependencies included:" + "`n" + 
                         "- SuiteSparse libraries" + "`n" + 
                         "- LAPACK/BLAS runtime" + "`n" + 
                         "- METIS (optional)" + "`n" + 
                         "" + "`n" + 
                         "Built with GitHub Actions on $(Get-Date -Format 'yyyy-MM-dd')"
        
        Set-Content -Path "$DistDir\README.txt" -Value $ReadmeContent

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: BFF-Windows-v1.6
        path: bff-dist/
        retention-days: 7

    - name: Debug information (on failure)
      if: failure()
      shell: pwsh
      run: |
        Write-Host "=== DEBUG INFORMATION ==="
        Write-Host "Current directory: $pwd"
        Write-Host "Directory contents:"
        Get-ChildItem
        Write-Host "SuiteSparse build directory contents:"
        if (Test-Path "suitesparse-build") {
            Get-ChildItem -Path "suitesparse-build" -Recurse | Select-Object -First 30
        }
        Write-Host "=== END DEBUG ==="
