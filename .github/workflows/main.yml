name: Build BFF Windows Binary (CMake 3.26)

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup CMake 3.26
      run: |
        # Use the CMake that comes with windows-latest (includes 3.26)
        cmake --version
        echo "Using system CMake"

    - name: Build SuiteSparse
      run: |
        git clone https://github.com/jlblancoc/suitesparse-metis-for-windows.git SuiteSparseWin
        cd SuiteSparseWin
        mkdir build && cd build
        cmake .. -DCMAKE_INSTALL_PREFIX="$pwd/install" -DCMAKE_BUILD_TYPE=Release -G "Visual Studio 17 2022" -A x64
        cmake --build . --config Release --target install

    - name: Quick CMake fix
      run: |
        # Just remove the SuiteSparse requirement
        (Get-Content CMakeLists.txt) -replace 'find_package\(SuiteSparse REQUIRED\)', '# ' | Set-Content CMakeLists.txt
        if (Test-Path "cmake/FindSuiteSparse.cmake") {
            Remove-Item "cmake/FindSuiteSparse.cmake" -Force
        }

    - name: Build BFF
      run: |
        $SuiteSparseDir = "$pwd/SuiteSparseWin/build/install"
        $OpenBLASDir = "$pwd/deps/openblas-windows"
        
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DSuiteSparse_CHOLMOD_INCLUDE_DIR="$SuiteSparseDir/include/suitesparse" -DSuiteSparse_CHOLMOD_LIBRARY_RELEASE="$SuiteSparseDir/lib/libcholmod.lib" -DSuiteSparse_AMD_LIBRARY_RELEASE="$SuiteSparseDir/lib/libamd.lib" -DSuiteSparse_COLAMD_LIBRARY_RELEASE="$SuiteSparseDir/lib/libcolamd.lib" -DSuiteSparse_BLAS_LIBRARY="$OpenBLASDir/lib/libopenblas.lib" -G "Visual Studio 17 2022" -A x64
        cmake --build . --config Release --target bff-command-line

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: bff-cmake326
        path: build/Release/bff-command-line.exe
