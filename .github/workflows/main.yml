name: Build BFF for Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [created]
  workflow_dispatch:

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-windows

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install Chocolatey packages
      shell: powershell
      run: |
        # Install Chocolatey
        Set-ExecutionPolicy Bypass -Scope Process -Force
        [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
        iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
        
        # Install build tools
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
        choco install ninja -y

    - name: Install vcpkg and dependencies
      shell: powershell
      run: |
        # Install vcpkg
        git clone https://github.com/Microsoft/vcpkg.git $env:VCPKG_ROOT
        & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"
        
        # Install required dependencies
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET eigen3
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET libigl
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET suitesparse
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET metis
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glfw3
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glew
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET freeglut
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glm

    - name: Download and install SuiteSparse-METIS
      shell: powershell
      run: |
        # Download SuiteSparse-METIS
        $url = "https://github.com/jlblancoc/suitesparse-metis-for-windows/archive/master.zip"
        $output = "C:\suitesparse-metis.zip"
        
        Write-Host "Downloading SuiteSparse-METIS from $url"
        Invoke-WebRequest -Uri $url -OutFile $output
        
        # Create directories
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse"
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse\include"
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse\lib"
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse\bin"
        
        # Extract
        Expand-Archive -Path $output -DestinationPath "C:\SuiteSparseTemp\" -Force
        
        # Find the actual library files
        $libDir = Get-ChildItem -Path "C:\SuiteSparseTemp" -Recurse -Directory | Where-Object { $_.Name -eq "lib" } | Select-Object -First 1
        $includeDir = Get-ChildItem -Path "C:\SuiteSparseTemp" -Recurse -Directory | Where-Object { $_.Name -eq "include" } | Select-Object -First 1
        
        if ($libDir -and $includeDir) {
          Write-Host "Found lib directory: $($libDir.FullName)"
          Write-Host "Found include directory: $($includeDir.FullName)"
          
          # Copy files with proper paths
          Copy-Item -Path "$($includeDir.FullName)\*" -Destination "C:\SuiteSparse\include\" -Recurse -Force
          Copy-Item -Path "$($libDir.FullName)\*" -Destination "C:\SuiteSparse\lib\" -Recurse -Force
        }
        
        # Look for .lib, .dll, and .h files in the entire extracted directory
        Write-Host "Searching for library files..."
        
        # Copy all .lib files
        $libFiles = Get-ChildItem -Path "C:\SuiteSparseTemp" -Recurse -Filter "*.lib"
        foreach ($file in $libFiles) {
          Copy-Item -Path $file.FullName -Destination "C:\SuiteSparse\lib\" -Force
          Write-Host "Copied lib: $($file.Name)"
        }
        
        # Copy all .dll files
        $dllFiles = Get-ChildItem -Path "C:\SuiteSparseTemp" -Recurse -Filter "*.dll"
        foreach ($file in $dllFiles) {
          Copy-Item -Path $file.FullName -Destination "C:\SuiteSparse\bin\" -Force
          Write-Host "Copied dll: $($file.Name)"
        }
        
        # Copy all .h files
        $hFiles = Get-ChildItem -Path "C:\SuiteSparseTemp" -Recurse -Filter "*.h"
        foreach ($file in $hFiles) {
          # Create subdirectory structure if needed
          $relativePath = $file.FullName.Substring("C:\SuiteSparseTemp\".Length)
          $destPath = "C:\SuiteSparse\include\" + (Split-Path $relativePath -Parent)
          New-Item -ItemType Directory -Force -Path $destPath | Out-Null
          Copy-Item -Path $file.FullName -Destination $destPath -Force
        }
        
        # Set environment variables
        echo "SUITESPARSE_INCLUDE_DIR=C:\SuiteSparse\include" | Out-File -FilePath $env:GITHUB_ENV -Append
        echo "SUITESPARSE_LIB_DIR=C:\SuiteSparse\lib" | Out-File -FilePath $env:GITHUB_ENV -Append
        
        # Add to PATH
        echo "C:\SuiteSparse\lib" | Out-File -FilePath $env:GITHUB_PATH -Append
        echo "C:\SuiteSparse\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

    - name: Clone BFF repository
      shell: powershell
      run: |
        # Clone the BFF repository
        if (-not (Test-Path "bff-source")) {
          git clone --recursive https://github.com/GeometryCollective/boundary-first-flattening.git bff-source
          cd bff-source
          git checkout v1.6
          cd ..
        }
        
        # Copy to workspace
        Copy-Item -Path "bff-source\*" -Destination "." -Recurse -Force

    - name: Check BFF structure
      shell: powershell
      run: |
        # Check what files are in the BFF repository
        Write-Host "BFF directory structure:"
        Get-ChildItem | Select-Object Name, Mode
        
        Write-Host "`nChecking for source files:"
        if (Test-Path "lib") {
          Write-Host "lib directory exists"
          Get-ChildItem -Path "lib" -Filter "*.cpp" | Select-Object Name
        } else {
          Write-Host "lib directory does not exist"
        }
        
        if (Test-Path "gui") {
          Write-Host "gui directory exists"
          Get-ChildItem -Path "gui" -Filter "*.cpp" | Select-Object Name
        } else {
          Write-Host "gui directory does not exist"
        }

    - name: Create CMakeLists.txt for BFF
      shell: powershell
      run: |
        # Create CMakeLists.txt using array approach
        $cmakeLines = @(
          "cmake_minimum_required(VERSION 3.15)",
          "project(BFF)",
          "",
          "set(CMAKE_CXX_STANDARD 17)",
          "set(CMAKE_CXX_STANDARD_REQUIRED ON)",
          "",
          "# Find dependencies",
          "find_package(Eigen3 REQUIRED)",
          "find_package(OpenGL REQUIRED)",
          "find_package(GLFW3 REQUIRED)",
          "find_package(GLEW REQUIRED)",
          "",
          "# Manually set SuiteSparse paths",
          "set(SUITESPARSE_INCLUDE_DIR `"C:/SuiteSparse/include`")",
          "set(SUITESPARSE_LIB_DIR `"C:/SuiteSparse/lib`")",
          "",
          "# Find SuiteSparse libraries",
          "find_library(CHOLMOD_LIBRARY NAMES cholmod libcholmod PATHS `${SUITESPARSE_LIB_DIR})",
          "find_library(AMD_LIBRARY NAMES amd libamd PATHS `${SUITESPARSE_LIB_DIR})",
          "find_library(CAMD_LIBRARY NAMES camd libcamd PATHS `${SUITESPARSE_LIB_DIR})",
          "find_library(COLAMD_LIBRARY NAMES colamd libcolamd PATHS `${SUITESPARSE_LIB_DIR})",
          "find_library(CCOLAMD_LIBRARY NAMES ccolamd libccolamd PATHS `${SUITESPARSE_LIB_DIR})",
          "find_library(METIS_LIBRARY NAMES metis libmetis PATHS `${SUITESPARSE_LIB_DIR})",
          "",
          "# Add source files",
          "file(GLOB_RECURSE BFF_SOURCES `"lib/*.cpp`")",
          "file(GLOB_RECURSE BFF_HEADERS `"lib/*.h`")",
          "",
          "# Check for GUI files",
          "if(EXISTS `${CMAKE_CURRENT_SOURCE_DIR}/gui)",
          "    file(GLOB_RECURSE GUI_SOURCES `"gui/*.cpp`")",
          "    file(GLOB_RECURSE GUI_HEADERS `"gui/*.h`")",
          "endif()",
          "",
          "# Combine sources",
          "set(ALL_SOURCES `${BFF_SOURCES})",
          "set(ALL_HEADERS `${BFF_HEADERS})",
          "if(GUI_SOURCES)",
          "    list(APPEND ALL_SOURCES `${GUI_SOURCES})",
          "    list(APPEND ALL_HEADERS `${GUI_HEADERS})",
          "endif()",
          "",
          "# Add executable",
          "add_executable(bff-gui `${ALL_SOURCES} `${ALL_HEADERS})",
          "",
          "# Include directories",
          "target_include_directories(bff-gui PRIVATE",
          "    `${EIGEN3_INCLUDE_DIRS}",
          "    `${SUITESPARSE_INCLUDE_DIR}",
          "    `${OPENGL_INCLUDE_DIRS}",
          "    `${GLFW3_INCLUDE_DIRS}",
          "    `${GLEW_INCLUDE_DIRS}",
          "    `${CMAKE_CURRENT_SOURCE_DIR}/lib",
          ")",
          "",
          "# Add GUI include if it exists",
          "if(EXISTS `${CMAKE_CURRENT_SOURCE_DIR}/gui)",
          "    target_include_directories(bff-gui PRIVATE `${CMAKE_CURRENT_SOURCE_DIR}/gui)",
          "endif()",
          "",
          "# Link libraries",
          "target_link_libraries(bff-gui",
          "    `${CHOLMOD_LIBRARY}",
          "    `${AMD_LIBRARY}",
          "    `${CAMD_LIBRARY}",
          "    `${COLAMD_LIBRARY}",
          "    `${CCOLAMD_LIBRARY}",
          "    `${METIS_LIBRARY}",
          "    `${OPENGL_LIBRARIES}",
          "    `${GLFW3_LIBRARIES}",
          "    `${GLEW_LIBRARIES}",
          ")"
        )
        
        # Write to file
        $cmakeLines | Out-File -FilePath "CMakeLists.txt" -Encoding UTF8

    - name: Configure CMake
      shell: powershell
      run: |
        # Create build directory
        New-Item -ItemType Directory -Force -Path "build"
        
        Write-Host "Configuring CMake..."
        Write-Host "Current directory: $(Get-Location)"
        Write-Host "Files in current directory:"
        Get-ChildItem
        
        # Configure with CMake
        cmake -B build `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=$env:VCPKG_DEFAULT_TRIPLET `
          -G "Visual Studio 17 2022" `
          -A x64

    - name: Build BFF
      shell: powershell
      run: |
        Write-Host "Building project..."
        cmake --build build --config Release --parallel 4

    - name: Find and copy executables
      shell: powershell
      run: |
        # Create distribution directory
        New-Item -ItemType Directory -Force -Path "dist"
        
        Write-Host "Searching for executables..."
        
        # Search for executables
        $searchPaths = @(
          "build\Release",
          "build",
          "build\bin\Release",
          "build\bin"
        )
        
        foreach ($path in $searchPaths) {
          if (Test-Path $path) {
            Write-Host "Checking $path"
            $exes = Get-ChildItem -Path $path -Filter "*.exe" -Recurse
            foreach ($exe in $exes) {
              Write-Host "Found executable: $($exe.FullName)"
              Copy-Item -Path $exe.FullName -Destination "dist\" -Force
            }
          }
        }
        
        # Copy DLLs
        $dllSources = @(
          "$env:VCPKG_ROOT\installed\$env:VCPKG_DEFAULT_TRIPLET\bin",
          "C:\SuiteSparse\bin",
          "C:\SuiteSparse\lib"
        )
        
        foreach ($source in $dllSources) {
          if (Test-Path $source) {
            Write-Host "Copying DLLs from $source"
            Get-ChildItem -Path $source -Filter "*.dll" | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination "dist\" -Force
              Write-Host "Copied: $($_.Name)"
            }
          }
        }
        
        # List what we have in dist
        Write-Host "`nFiles in dist directory:"
        Get-ChildItem -Path "dist"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BFF-Windows-Binaries
        path: dist/

    - name: Create release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/**
        generate_release_notes: true
