name: Build BFF for Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [created]
  workflow_dispatch:

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-windows

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install vcpkg and dependencies
      shell: powershell
      run: |
        # Install vcpkg
        git clone https://github.com/Microsoft/vcpkg.git $env:VCPKG_ROOT
        & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"
        
        # Install required dependencies
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET eigen3
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET libigl
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET suitesparse
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET metis
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glfw3
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glew
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET freeglut
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glm

    - name: Create CMakeLists.txt using Write-Output
      shell: powershell
      run: |
        # Create CMakeLists.txt by writing directly to file
        $cmakeFile = "CMakeLists.txt"
        
        # Start fresh
        if (Test-Path $cmakeFile) {
          Remove-Item $cmakeFile
        }
        
        # Write CMakeLists.txt line by line
        @"
cmake_minimum_required(VERSION 3.15)
project(BFF)

set(CMAKE_CXX_STANDARD 17)
set(CMAKE_CXX_STANDARD_REQUIRED ON)

# Set vcpkg paths from environment
set(VCPKG_INSTALLED_DIR "\$ENV{VCPKG_ROOT}/installed/\$ENV{VCPKG_DEFAULT_TRIPLET}")

# Find Eigen3
find_package(Eigen3 REQUIRED)

# Find OpenGL
find_package(OpenGL REQUIRED)

# Manually find SuiteSparse and METIS libraries from vcpkg
find_library(CHOLMOD_LIBRARY NAMES cholmod PATHS \${VCPKG_INSTALLED_DIR}/lib NO_DEFAULT_PATH)
find_library(AMD_LIBRARY NAMES amd PATHS \${VCPKG_INSTALLED_DIR}/lib NO_DEFAULT_PATH)
find_library(CAMD_LIBRARY NAMES camd PATHS \${VCPKG_INSTALLED_DIR}/lib NO_DEFAULT_PATH)
find_library(COLAMD_LIBRARY NAMES colamd PATHS \${VCPKG_INSTALLED_DIR}/lib NO_DEFAULT_PATH)
find_library(CCOLAMD_LIBRARY NAMES ccolamd PATHS \${VCPKG_INSTALLED_DIR}/lib NO_DEFAULT_PATH)
find_library(METIS_LIBRARY NAMES metis PATHS \${VCPKG_INSTALLED_DIR}/lib NO_DEFAULT_PATH)

# Check if SuiteSparse libraries were found
if(NOT CHOLMOD_LIBRARY)
    message(FATAL_ERROR "CHOLMOD library not found in \${VCPKG_INSTALLED_DIR}/lib")
else()
    message(STATUS "Found CHOLMOD: \${CHOLMOD_LIBRARY}")
endif()

# Manually find GLFW and GLEW
find_library(GLFW_LIBRARY NAMES glfw3 PATHS \${VCPKG_INSTALLED_DIR}/lib NO_DEFAULT_PATH)
find_library(GLEW_LIBRARY NAMES glew32 PATHS \${VCPKG_INSTALLED_DIR}/lib NO_DEFAULT_PATH)

# Check if GLFW and GLEW were found
if(NOT GLFW_LIBRARY)
    message(FATAL_ERROR "GLFW library not found in \${VCPKG_INSTALLED_DIR}/lib")
else()
    message(STATUS "Found GLFW: \${GLFW_LIBRARY}")
endif()

if(NOT GLEW_LIBRARY)
    message(FATAL_ERROR "GLEW library not found in \${VCPKG_INSTALLED_DIR}/lib")
else()
    message(STATUS "Found GLEW: \${GLEW_LIBRARY}")
endif()

# Include directories
include_directories(
    \${CMAKE_SOURCE_DIR}/include
    \${CMAKE_SOURCE_DIR}/deps/libigl/include
    \${CMAKE_SOURCE_DIR}/deps/spectra/include
    \${Eigen3_INCLUDE_DIRS}
    \${VCPKG_INSTALLED_DIR}/include
)

# Find source files
file(GLOB_RECURSE SRC_FILES "src/*.cpp")
file(GLOB_RECURSE SRC_HEADERS "src/*.h")

if(NOT SRC_FILES)
    message(FATAL_ERROR "No source files found in src/ directory")
endif()

# Create library
add_library(bff-lib STATIC \${SRC_FILES})

# Link SuiteSparse and METIS libraries to bff-lib
target_link_libraries(bff-lib
    \${CHOLMOD_LIBRARY}
    \${AMD_LIBRARY}
    \${CAMD_LIBRARY}
    \${COLAMD_LIBRARY}
    \${CCOLAMD_LIBRARY}
    \${METIS_LIBRARY}
)

# GUI executable
file(GLOB_RECURSE GUI_FILES "apps/*.cpp")
if(GUI_FILES)
    add_executable(bff-gui \${GUI_FILES})
    target_link_libraries(bff-gui bff-lib
        \${OPENGL_LIBRARIES}
        \${GLFW_LIBRARY}
        \${GLEW_LIBRARY}
    )
    target_include_directories(bff-gui PRIVATE \${CMAKE_SOURCE_DIR}/apps)
    message(STATUS "Building GUI application")
endif()

# CLI executable
file(GLOB_RECURSE CLI_FILES "binaries/*.cpp")
if(CLI_FILES)
    add_executable(bff-cli \${CLI_FILES})
    target_link_libraries(bff-cli bff-lib)
    target_include_directories(bff-cli PRIVATE \${CMAKE_SOURCE_DIR}/binaries)
    message(STATUS "Building CLI application")
endif()
"@ | Out-File -FilePath $cmakeFile -Encoding UTF8
        
        Write-Host "Created CMakeLists.txt"
        Write-Host "First few lines of CMakeLists.txt:"
        Get-Content $cmakeFile -First 10

    - name: Check if we need to clone BFF
      shell: powershell
      run: |
        # Check if we have the BFF source files
        if (-not (Test-Path "src") -and -not (Test-Path "apps")) {
          Write-Host "BFF source not found, cloning v1.6..."
          git clone --recursive --branch v1.6 https://github.com/GeometryCollective/boundary-first-flattening.git bff-temp
          # Copy everything except .git
          Get-ChildItem -Path "bff-temp" -Exclude ".git" | Copy-Item -Destination "." -Recurse -Force
        }
        
        # Check what we have
        Write-Host "Current directory contents:"
        Get-ChildItem | Select-Object -First 10 | Format-Table Name, Mode

    - name: Configure CMake
      shell: powershell
      run: |
        # Create build directory
        New-Item -ItemType Directory -Force -Path "build"
        
        Write-Host "Configuring CMake with vcpkg toolchain..."
        Write-Host "VCPKG_ROOT: $env:VCPKG_ROOT"
        
        # Configure with CMake
        cmake -B build `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=$env:VCPKG_DEFAULT_TRIPLET `
          -G "Visual Studio 17 2022" `
          -A x64

    - name: Build BFF
      shell: powershell
      run: |
        Write-Host "Building project..."
        cmake --build build --config Release --parallel 4

    - name: Find and copy executables
      shell: powershell
      run: |
        # Create distribution directory
        New-Item -ItemType Directory -Force -Path "dist"
        
        Write-Host "Searching for executables..."
        
        # Search for executables
        $exes = Get-ChildItem -Path "build" -Filter "*.exe" -Recurse
        foreach ($exe in $exes) {
          Write-Host "Found executable: $($exe.FullName)"
          Copy-Item -Path $exe.FullName -Destination "dist\" -Force
        }
        
        # Copy DLLs
        $vcpkgBinPath = "$env:VCPKG_ROOT\installed\$env:VCPKG_DEFAULT_TRIPLET\bin"
        if (Test-Path $vcpkgBinPath) {
          Write-Host "Copying DLLs from vcpkg..."
          Get-ChildItem -Path $vcpkgBinPath -Filter "*.dll" | Copy-Item -Destination "dist\" -Force
        }
        
        # List what we have
        Write-Host "`nFiles in dist directory:"
        Get-ChildItem -Path "dist"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BFF-Windows-Binaries
        path: dist/

    - name: Create release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/**
        generate_release_notes: true
