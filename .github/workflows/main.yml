name: Build BFF for Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [created]
  workflow_dispatch:

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-windows

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install vcpkg and dependencies
      shell: powershell
      run: |
        # Install vcpkg
        git clone https://github.com/Microsoft/vcpkg.git $env:VCPKG_ROOT
        & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"
        
        # Install required dependencies
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET eigen3
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET libigl
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET suitesparse
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET metis
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glfw3
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glew
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET freeglut
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glm

    - name: Create CMakeLists.txt using WriteAllLines
      shell: powershell
      run: |
        # Create CMakeLists.txt line by line
        $lines = @()
        
        # Add each line individually
        $lines += "cmake_minimum_required(VERSION 3.15)"
        $lines += "project(BFF)"
        $lines += ""
        $lines += "set(CMAKE_CXX_STANDARD 17)"
        $lines += "set(CMAKE_CXX_STANDARD_REQUIRED ON)"
        $lines += ""
        $lines += "# Get vcpkg paths from environment"
        $lines += 'set(VCPKG_INSTALLED_DIR "$ENV{VCPKG_ROOT}/installed/$ENV{VCPKG_DEFAULT_TRIPLET}")'
        $lines += ""
        $lines += "# Find Eigen3"
        $lines += "find_package(Eigen3 REQUIRED)"
        $lines += ""
        $lines += "# Find OpenGL"
        $lines += "find_package(OpenGL REQUIRED)"
        $lines += ""
        $lines += "# Use file glob to find all needed libraries"
        $lines += 'file(GLOB CHOLMOD_LIBS "${VCPKG_INSTALLED_DIR}/lib/*cholmod*.lib")'
        $lines += 'file(GLOB AMD_LIBS "${VCPKG_INSTALLED_DIR}/lib/*amd*.lib")'
        $lines += 'file(GLOB CAMD_LIBS "${VCPKG_INSTALLED_DIR}/lib/*camd*.lib")'
        $lines += 'file(GLOB COLAMD_LIBS "${VCPKG_INSTALLED_DIR}/lib/*colamd*.lib")'
        $lines += 'file(GLOB CCOLAMD_LIBS "${VCPKG_INSTALLED_DIR}/lib/*ccolamd*.lib")'
        $lines += 'file(GLOB METIS_LIBS "${VCPKG_INSTALLED_DIR}/lib/*metis*.lib")'
        $lines += 'file(GLOB GLFW_LIBS "${VCPKG_INSTALLED_DIR}/lib/*glfw*.lib")'
        $lines += 'file(GLOB GLEW_LIBS "${VCPKG_INSTALLED_DIR}/lib/*glew*.lib")'
        $lines += ""
        $lines += "# Check if libraries were found"
        $lines += "if(NOT CHOLMOD_LIBS)"
        $lines += '    message(FATAL_ERROR "CHOLMOD library not found")'
        $lines += "else()"
        $lines += "    list(GET CHOLMOD_LIBS 0 CHOLMOD_LIBRARY)"
        $lines += '    message(STATUS "Found CHOLMOD: ${CHOLMOD_LIBRARY}")'
        $lines += "endif()"
        $lines += ""
        $lines += "if(NOT AMD_LIBS)"
        $lines += '    message(FATAL_ERROR "AMD library not found")'
        $lines += "else()"
        $lines += "    list(GET AMD_LIBS 0 AMD_LIBRARY)"
        $lines += "endif()"
        $lines += ""
        $lines += "if(NOT CAMD_LIBS)"
        $lines += '    message(FATAL_ERROR "CAMD library not found")'
        $lines += "else()"
        $lines += "    list(GET CAMD_LIBS 0 CAMD_LIBRARY)"
        $lines += "endif()"
        $lines += ""
        $lines += "if(NOT COLAMD_LIBS)"
        $lines += '    message(FATAL_ERROR "COLAMD library not found")'
        $lines += "else()"
        $lines += "    list(GET COLAMD_LIBS 0 COLAMD_LIBRARY)"
        $lines += "endif()"
        $lines += ""
        $lines += "if(NOT CCOLAMD_LIBS)"
        $lines += '    message(FATAL_ERROR "CCOLAMD library not found")'
        $lines += "else()"
        $lines += "    list(GET CCOLAMD_LIBS 0 CCOLAMD_LIBRARY)"
        $lines += "endif()"
        $lines += ""
        $lines += "if(NOT METIS_LIBS)"
        $lines += '    message(FATAL_ERROR "METIS library not found")'
        $lines += "else()"
        $lines += "    list(GET METIS_LIBS 0 METIS_LIBRARY)"
        $lines += "endif()"
        $lines += ""
        $lines += "if(NOT GLFW_LIBS)"
        $lines += '    message(FATAL_ERROR "GLFW library not found")'
        $lines += "else()"
        $lines += "    list(GET GLFW_LIBS 0 GLFW_LIBRARY)"
        $lines += '    message(STATUS "Found GLFW: ${GLFW_LIBRARY}")'
        $lines += "endif()"
        $lines += ""
        $lines += "if(NOT GLEW_LIBS)"
        $lines += '    message(FATAL_ERROR "GLEW library not found")'
        $lines += "else()"
        $lines += "    list(GET GLEW_LIBS 0 GLEW_LIBRARY)"
        $lines += '    message(STATUS "Found GLEW: ${GLEW_LIBRARY}")'
        $lines += "endif()"
        $lines += ""
        $lines += "# Include directories"
        $lines += "include_directories("
        $lines += "    ${CMAKE_SOURCE_DIR}/include"
        $lines += "    ${CMAKE_SOURCE_DIR}/deps/libigl/include"
        $lines += "    ${CMAKE_SOURCE_DIR}/deps/spectra/include"
        $lines += "    ${Eigen3_INCLUDE_DIRS}"
        $lines += "    ${VCPKG_INSTALLED_DIR}/include"
        $lines += ")"
        $lines += ""
        $lines += "# Find source files"
        $lines += 'file(GLOB_RECURSE SRC_FILES "src/*.cpp")'
        $lines += 'file(GLOB_RECURSE SRC_HEADERS "src/*.h")'
        $lines += ""
        $lines += "if(NOT SRC_FILES)"
        $lines += '    message(FATAL_ERROR "No source files found in src/ directory")'
        $lines += "endif()"
        $lines += ""
        $lines += "# Create library"
        $lines += "add_library(bff-lib STATIC ${SRC_FILES})"
        $lines += ""
        $lines += "# Link libraries"
        $lines += "target_link_libraries(bff-lib"
        $lines += "    ${CHOLMOD_LIBRARY}"
        $lines += "    ${AMD_LIBRARY}"
        $lines += "    ${CAMD_LIBRARY}"
        $lines += "    ${COLAMD_LIBRARY}"
        $lines += "    ${CCOLAMD_LIBRARY}"
        $lines += "    ${METIS_LIBRARY}"
        $lines += ")"
        $lines += ""
        $lines += "# GUI executable"
        $lines += 'file(GLOB_RECURSE GUI_FILES "apps/*.cpp")'
        $lines += "if(GUI_FILES)"
        $lines += "    add_executable(bff-gui ${GUI_FILES})"
        $lines += "    target_link_libraries(bff-gui bff-lib"
        $lines += "        ${OPENGL_LIBRARIES}"
        $lines += "        ${GLFW_LIBRARY}"
        $lines += "        ${GLEW_LIBRARY}"
        $lines += "    )"
        $lines += "    target_include_directories(bff-gui PRIVATE ${CMAKE_SOURCE_DIR}/apps)"
        $lines += '    message(STATUS "Building GUI application")'
        $lines += "endif()"
        $lines += ""
        $lines += "# CLI executable"
        $lines += 'file(GLOB_RECURSE CLI_FILES "binaries/*.cpp")'
        $lines += "if(CLI_FILES)"
        $lines += "    add_executable(bff-cli ${CLI_FILES})"
        $lines += "    target_link_libraries(bff-cli bff-lib)"
        $lines += "    target_include_directories(bff-cli PRIVATE ${CMAKE_SOURCE_DIR}/binaries)"
        $lines += '    message(STATUS "Building CLI application")'
        $lines += "endif()"
        
        # Write all lines to file
        [System.IO.File]::WriteAllLines("CMakeLists.txt", $lines)
        Write-Host "Created CMakeLists.txt with $($lines.Count) lines"

    - name: Check if we need to clone BFF
      shell: powershell
      run: |
        # Check if we have the BFF source files
        if (-not (Test-Path "src") -and -not (Test-Path "apps")) {
          Write-Host "BFF source not found, cloning v1.6..."
          git clone --recursive --branch v1.6 https://github.com/GeometryCollective/boundary-first-flattening.git bff-temp
          # Copy everything except .git
          Get-ChildItem -Path "bff-temp" -Exclude ".git" | Copy-Item -Destination "." -Recurse -Force
        }

    - name: Configure CMake
      shell: powershell
      run: |
        # Create build directory
        New-Item -ItemType Directory -Force -Path "build"
        
        Write-Host "Configuring CMake with vcpkg toolchain..."
        
        # Configure with CMake - don't pass the toolchain file since we set it in CMakeLists.txt
        cmake -B build `
          -DCMAKE_BUILD_TYPE=Release `
          -G "Visual Studio 17 2022" `
          -A x64

    - name: Build BFF
      shell: powershell
      run: |
        Write-Host "Building project..."
        cmake --build build --config Release --parallel 4

    - name: Find and copy executables
      shell: powershell
      run: |
        # Create distribution directory
        New-Item -ItemType Directory -Force -Path "dist"
        
        Write-Host "Searching for executables..."
        
        # Search for executables
        $exes = Get-ChildItem -Path "build" -Filter "*.exe" -Recurse
        foreach ($exe in $exes) {
          Write-Host "Found executable: $($exe.FullName)"
          Copy-Item -Path $exe.FullName -Destination "dist\" -Force
        }
        
        # Copy DLLs
        $vcpkgBinPath = "$env:VCPKG_ROOT\installed\$env:VCPKG_DEFAULT_TRIPLET\bin"
        if (Test-Path $vcpkgBinPath) {
          Write-Host "Copying DLLs from vcpkg..."
          Get-ChildItem -Path $vcpkgBinPath -Filter "*.dll" | Copy-Item -Destination "dist\" -Force
        }
        
        # List what we have
        Write-Host "`nFiles in dist directory:"
        Get-ChildItem -Path "dist"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BFF-Windows-Binaries
        path: dist/

    - name: Create release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/**
        generate_release_notes: true
