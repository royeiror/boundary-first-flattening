name: Build BFF Viewer

on: workflow_dispatch

jobs:
  build-viewer:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Setup Visual Studio tools
      run: |
        # Initialize VS Dev Command Prompt
        echo "Setting up Visual Studio tools..."
        # This should make dumpbin available
        $vsPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build"
        if (Test-Path $vsPath) {
            cmd.exe /c "call `"$vsPath\vcvarsall.bat`" x64 && set" | ForEach-Object {
                if ($_ -match "^(.*?)=(.*)$") {
                    $name = $matches[1]
                    $value = $matches[2]
                    [Environment]::SetEnvironmentVariable($name, $value)
                }
            }
        }
        
    - name: Install vcpkg
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg install suitesparse:x64-windows
        
    - name: Simple patch - replace cholmod_l_ with cholmod_
      run: |
        echo "Patching cholmod_l_ to cholmod_..."
        
        # Just patch the specific files we know have issues
        $filesToPatch = @(
            "include/bff/linear-algebra/DenseMatrix.inl",
            "include/bff/linear-algebra/SparseMatrix.inl"
        )
        
        foreach ($file in $filesToPatch) {
            if (Test-Path $file) {
                echo "Patching $file"
                (Get-Content $file -Raw) -replace 'cholmod_l_', 'cholmod_' | Set-Content $file
            }
        }
        
        # Also check Common.h
        if (Test-Path "include/bff/linear-algebra/Common.h") {
            echo "Checking Common.h"
            (Get-Content "include/bff/linear-algebra/Common.h" -Raw) -replace 'cholmod_l_', 'cholmod_' | Set-Content "include/bff/linear-algebra/Common.h"
        }
        
    - name: Create FindSuiteSparse.cmake
      run: |
        $path = "$env:GITHUB_WORKSPACE/vcpkg/installed/x64-windows" -replace '\\', '/'
        
        # Write simple file
        $lines = @(
            "set(SuiteSparse_FOUND TRUE)",
            "set(SuiteSparse_INCLUDE_DIR `"$path/include`")",
            "set(SuiteSparse_LIBRARY_DIR `"$path/lib`")",
            "set(SuiteSparse_CHOLMOD_LIBRARY `"$path/lib/cholmod.lib`")",
            "set(SuiteSparse_AMD_LIBRARY `"$path/lib/amd.lib`")",
            "message(STATUS `"SuiteSparse configured`")"
        )
        
        $content = $lines -join "`n"
        $content | Set-Content "cmake/FindSuiteSparse.cmake" -Encoding UTF8
        
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1
      
    - name: Configure CMake
      run: |
        cmake -B build -DBFF_BUILD_GUI=ON -DCMAKE_BUILD_TYPE=Release
        
    - name: Build
      run: |
        cmake --build build --config Release
        
    - name: Check results
      run: |
        if (Test-Path "build/Release/bff-viewer.exe") {
            echo "✅ SUCCESS: bff-viewer.exe built!"
            # Try to run it (will fail without display, but that's OK)
            echo "Trying to run viewer..."
            & "build/Release/bff-viewer.exe" --help 2>&1 | Out-String
        } else {
            echo "❌ Viewer not found"
            echo "Looking for any executables..."
            Get-ChildItem -Path build -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue
        }
