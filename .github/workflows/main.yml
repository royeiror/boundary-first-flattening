name: Build BFF Windows Binary

on: 
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install build tools
      run: |
        choco install cmake -y
        choco install git -y

    - name: Clone and build SuiteSparse with Metis
      run: |
        # Clone the Windows-specific SuiteSparse
        git clone https://github.com/jlblancoc/suitesparse-metis-for-windows.git SuiteSparseWin
        cd SuiteSparseWin
        
        echo "=== Building SuiteSparse with Metis ==="
        mkdir build
        cd build
        
        # Build SuiteSparse as per the instructions
        cmake .. -DCMAKE_INSTALL_PREFIX="$pwd/install" -DCMAKE_BUILD_TYPE=Release -G "Visual Studio 17 2022" -A x64
        cmake --build . --config Release --target install --parallel
        
        echo "=== SuiteSparse build completed ==="
        echo "=== Include files ==="
        dir install/include -Recurse
        echo "=== Library files ==="
        dir install/lib -Filter *.lib

    - name: Verify OpenBLAS in repository
      run: |
        echo "=== Checking for OpenBLAS in deps ==="
        if (Test-Path "deps/openblas-windows") {
            dir deps/openblas-windows -Recurse
        } else {
            echo "ERROR: OpenBLAS not found in deps/openblas-windows"
            echo "The repository should include OpenBLAS as mentioned in the build instructions"
            exit 1
        }

    - name: Configure BFF with correct SuiteSparse paths
      run: |
        $SuiteSparseDir = "$pwd/SuiteSparseWin/build/install"
        $OpenBLASDir = "$pwd/deps/openblas-windows"
        
        echo "SuiteSparse directory: $SuiteSparseDir"
        echo "OpenBLAS directory: $OpenBLASDir"
        
        # Verify critical files exist
        if (-not (Test-Path "$SuiteSparseDir/include/suitesparse/cholmod.h")) {
            echo "ERROR: cholmod.h not found at expected location"
            dir "$SuiteSparseDir/include" -Recurse
            exit 1
        }
        
        if (-not (Test-Path "$OpenBLASDir/lib/libopenblas.lib")) {
            echo "ERROR: libopenblas.lib not found at expected location"
            dir "$OpenBLASDir/lib" -Recurse
            exit 1
        }
        
        mkdir build
        cd build
        
        # Configure BFF with all required paths as per the Windows instructions
        cmake .. `
          -DCMAKE_BUILD_TYPE=Release `
          -DSuiteSparse_DIR="$SuiteSparseDir/lib" `
          -DSuiteSparse_CHOLMOD_DIR="$SuiteSparseDir/lib" `
          -DSuiteSparse_CHOLMOD_INCLUDE_DIR="$SuiteSparseDir/include/suitesparse" `
          -DSuiteSparse_CHOLMOD_LIBRARY_RELEASE="$SuiteSparseDir/lib/libcholmod.lib" `
          -DSuiteSparse_AMD_LIBRARY_RELEASE="$SuiteSparseDir/lib/libamd.lib" `
          -DSuiteSparse_CAMD_LIBRARY_RELEASE="$SuiteSparseDir/lib/libcamd.lib" `
          -DSuiteSparse_CCOLAMD_LIBRARY_RELEASE="$SuiteSparseDir/lib/libccolamd.lib" `
          -DSuiteSparse_COLAMD_LIBRARY_RELEASE="$SuiteSparseDir/lib/libcolamd.lib" `
          -DSuiteSparse_BTF_LIBRARY_RELEASE="$SuiteSparseDir/lib/libbtf.lib" `
          -DSuiteSparse_KLU_LIBRARY_RELEASE="$SuiteSparseDir/lib/libklu.lib" `
          -DSuiteSparse_UMFPACK_LIBRARY_RELEASE="$SuiteSparseDir/lib/libumfpack.lib" `
          -DSuiteSparse_CXSPARSE_LIBRARY_RELEASE="$SuiteSparseDir/lib/libcxsparse.lib" `
          -DSuiteSparse_SUITESPARSECONFIG_LIBRARY_RELEASE="$SuiteSparseDir/lib/libsuitesparseconfig.lib" `
          -DSuiteSparse_BLAS_LIBRARY="$OpenBLASDir/lib/libopenblas.lib" `
          -DSuiteSparse_LAPACK_LIBRARY="$OpenBLASDir/lib/libopenblas.lib" `
          -G "Visual Studio 17 2022" -A x64

    - name: Build BFF command line tool
      run: |
        cd build
        cmake --build . --config Release --target bff-command-line --parallel

    - name: Copy required DLLs
      run: |
        # Copy SuiteSparse DLLs
        if (Test-Path "SuiteSparseWin/build/install/bin") {
            Copy-Item "SuiteSparseWin/build/install/bin/*.dll" "build/Release/" -ErrorAction SilentlyContinue
            echo "Copied SuiteSparse DLLs"
        }
        
        # Copy OpenBLAS DLLs
        if (Test-Path "deps/openblas-windows/bin") {
            Copy-Item "deps/openblas-windows/bin/*.dll" "build/Release/" -ErrorAction SilentlyContinue
            echo "Copied OpenBLAS DLLs"
        }

    - name: Test the executable
      run: |
        if (Test-Path "build/Release/bff-command-line.exe") {
            echo "=== Testing bff-command-line.exe ==="
            cd build/Release
            ./bff-command-line.exe --help || echo "Executable ran (may have exited with help message)"
        } else {
            echo "ERROR: bff-command-line.exe not found"
            dir build -Recurse -Filter *.exe
        }

    - name: Package and upload artifacts
      run: |
        mkdir dist
        
        # Copy the main executable
        if (Test-Path "build/Release/bff-command-line.exe") {
            Copy-Item "build/Release/bff-command-line.exe" "dist/"
            echo "✓ Copied bff-command-line.exe"
        }
        
        # Copy all DLLs
        Copy-Item "build/Release/*.dll" "dist/" -ErrorAction SilentlyContinue
        echo "✓ Copied DLLs"
        
        echo "=== Final distribution package ==="
        dir dist

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bff-windows-binary
        path: dist/*
        retention-days: 30
