name: Build BFF v1.6 Windows with GUI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout BFF repository with submodules
      uses: actions/checkout@v4
      with:
        repository: GeometryCollective/boundary-first-flattening
        submodules: recursive
        ref: v1.6

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      
    - name: Install CMake
      uses: jwlawson/actions-setup-cmake@v1
      with:
        cmake-version: "3.25.x"

    - name: Install build tools
      shell: pwsh
      run: |
        choco install -y git
        choco install -y ninja

    - name: Build SuiteSparse for Windows
      shell: pwsh
      run: |
        $SuiteSparseRepo = "https://github.com/jlblancoc/suitesparse-metis-for-windows"
        $SuiteSparseDir = "suitesparse-build"
        
        Write-Host "Cloning SuiteSparse for Windows..."
        git clone --depth 1 $SuiteSparseRepo $SuiteSparseDir
        cd $SuiteSparseDir
        
        Write-Host "Configuring SuiteSparse with CMake..."
        $BuildDir = "build"
        $InstallDir = "$pwd\install"
        
        # Create install directory
        New-Item -ItemType Directory -Force -Path $InstallDir
        
        # Configure with specific options for Windows
        cmake -B $BuildDir -S . `
          -DCMAKE_INSTALL_PREFIX="$InstallDir" `
          -DCMAKE_BUILD_TYPE=Release `
          -DBUILD_METIS=ON `
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON `
          -G "Visual Studio 17 2022" `
          -A x64
        
        Write-Host "Building SuiteSparse..."
        cmake --build $BuildDir --config Release --target INSTALL --parallel
        
        Write-Host "SuiteSparse built successfully!"
        Write-Host "Install directory: $InstallDir"
        
        # Verify the installation
        Write-Host "Checking SuiteSparse installation..."
        if (Test-Path "$InstallDir\include") {
            Write-Host "Include directory exists"
            Get-ChildItem -Path "$InstallDir\include" -Filter "*.h" | Select-Object -First 10
        }

    - name: Create custom FindSuiteSparse.cmake
      shell: pwsh
      run: |
        Write-Host "Creating custom FindSuiteSparse.cmake..."
        cd "${{ github.workspace }}"
        
        $SuiteSparseDir = "$pwd\suitesparse-build\install"
        
        # Create the content using string concatenation to avoid YAML issues
        $FindSuiteSparseContent = "# Custom FindSuiteSparse.cmake for Windows build" + "`n" +
                                 "# This file is generated by the GitHub Actions workflow" + "`n" +
                                 "`n" +
                                 "set(SuiteSparse_FOUND ON)" + "`n" +
                                 "`n" +
                                 "# Set include directories" + "`n" +
                                 "set(SuiteSparse_INCLUDE_DIRS " + "`n" +
                                 '    "' + $SuiteSparseDir + '/include"' + "`n" +
                                 '    "' + $SuiteSparseDir + '/include/suitesparse"' + "`n" +
                                 ")" + "`n" +
                                 "`n" +
                                 "# Set library directory" + "`n" +
                                 'set(SuiteSparse_LIBRARY_DIRS "' + $SuiteSparseDir + '/lib")' + "`n" +
                                 "`n" +
                                 "# Find all SuiteSparse libraries" + "`n" +
                                 'file(GLOB SuiteSparse_LIBS "${SuiteSparse_LIBRARY_DIRS}/*.lib")' + "`n" +
                                 "set(SuiteSparse_LIBRARIES " + '${SuiteSparse_LIBS})' + "`n" +
                                 "`n" +
                                 "# Set individual component variables" + "`n" +
                                 "set(SuiteSparse_AMD_FOUND ON)" + "`n" +
                                 "set(SuiteSparse_CAMD_FOUND ON)" + "`n" +
                                 "set(SuiteSparse_COLAMD_FOUND ON)" + "`n" +
                                 "set(SuiteSparse_CCOLAMD_FOUND ON)" + "`n" +
                                 "set(SuiteSparse_CHOLMOD_FOUND ON)" + "`n" +
                                 "set(SuiteSparse_SUITESPARSECONFIG_FOUND ON)" + "`n" +
                                 "set(SuiteSparse_LDL_FOUND ON)" + "`n" +
                                 "set(SuiteSparse_UMFPACK_FOUND ON)" + "`n" +
                                 "`n" +
                                 "# For backward compatibility" + "`n" +
                                 "set(SuiteSparse_INCLUDE_DIR " + '${SuiteSparse_INCLUDE_DIRS})' + "`n" +
                                 "set(SuiteSparse_LIBRARY " + '${SuiteSparse_LIBRARIES})' + "`n" +
                                 "`n" +
                                 'message(STATUS "Using custom SuiteSparse paths for Windows")' + "`n" +
                                 'message(STATUS "Include dirs: ${SuiteSparse_INCLUDE_DIRS}")' + "`n" +
                                 'message(STATUS "Library dirs: ${SuiteSparse_LIBRARY_DIRS}")' + "`n" +
                                 'message(STATUS "Libraries: ${SuiteSparse_LIBRARIES}")'
        
        # Save the custom FindSuiteSparse.cmake
        Set-Content -Path "cmake/FindSuiteSparse-custom.cmake" -Value $FindSuiteSparseContent -Encoding UTF8
        Write-Host "Custom FindSuiteSparse.cmake created"

    - name: Build BFF with custom SuiteSparse setup
      shell: pwsh
      run: |
        $SuiteSparseDir = "$pwd\suitesparse-build\install"
        $BFFBuildDir = "bff-build"
        
        Write-Host "Building BFF with custom SuiteSparse setup..."
        cd "${{ github.workspace }}"
        
        # Create build script using string concatenation
        $BuildScript = "# Simple build approach" + "`n" +
                      "cmake_minimum_required(VERSION 3.1.0)" + "`n" +
                      "project(bff)" + "`n" +
                      "`n" +
                      "option(BFF_BUILD_CLI " + '"Build BFF command line"' + " ON)" + "`n" +
                      "option(BFF_BUILD_GUI " + '"Build BFF GUI"' + " ON)" + "`n" +
                      "`n" +
                      "set(CMAKE_CXX_STANDARD 11)" + "`n" +
                      "set(CMAKE_CXX_STANDARD_REQUIRED ON)" + "`n" +
                      "`n" +
                      "# Manually set SuiteSparse paths" + "`n" +
                      'set(SUITESPARSE_INCLUDE_DIR "' + $SuiteSparseDir + '/include;' + $SuiteSparseDir + '/include/suitesparse")' + "`n" +
                      'set(SUITESPARSE_LIB_DIR "' + $SuiteSparseDir + '/lib")' + "`n" +
                      "`n" +
                      "# Find all SuiteSparse libraries" + "`n" +
                      'file(GLOB SUITESPARSE_LIBS "${SUITESPARSE_LIB_DIR}/*.lib")' + "`n" +
                      "`n" +
                      'message(STATUS "SuiteSparse include dir: ${SUITESPARSE_INCLUDE_DIR}")' + "`n" +
                      'message(STATUS "SuiteSparse lib dir: ${SUITESPARSE_LIB_DIR}")' + "`n" +
                      "`n" +
                      "# bff lib" + "`n" +
                      "include_directories(" + '${SUITESPARSE_INCLUDE_DIR}' + ")" + "`n" +
                      'include_directories("deps/rectangle-bin-pack")' + "`n" +
                      'include_directories("include")' + "`n" +
                      "`n" +
                      'file(GLOB BFF_SOURCES "deps/rectangle-bin-pack/GuillotineBinPack.cpp"' + "`n" +
                      '                      "deps/rectangle-bin-pack/SkylineBinPack.cpp"' + "`n" +
                      '                      "deps/rectangle-bin-pack/Rect.cpp"' + "`n" +
                      '                      "src/linear-algebra/*.cpp"' + "`n" +
                      '                      "src/mesh/*.cpp"' + "`n" +
                      '                      "src/project/*.cpp")' + "`n" +
                      "`n" +
                      "# create bff static library" + "`n" +
                      "add_library(bff " + '${BFF_SOURCES}' + ")" + "`n" +
                      "target_link_libraries(bff " + '${SUITESPARSE_LIBS}' + ")" + "`n" +
                      "`n" +
                      "# Add executables if GUI is enabled" + "`n" +
                      "if(BFF_BUILD_GUI)" + "`n" +
                      "    # Check for GUI source files" + "`n" +
                      '    if(EXISTS "src/gui/main.cpp")' + "`n" +
                      "        add_executable(BFF src/gui/main.cpp)" + "`n" +
                      "        target_link_libraries(BFF bff nanogui)" + "`n" +
                      '        message(STATUS "GUI executable target added")' + "`n" +
                      "    endif()" + "`n" +
                      "endif()" + "`n" +
                      "`n" +
                      "if(BFF_BUILD_CLI)" + "`n" +
                      '    if(EXISTS "src/command/main.cpp")' + "`n" +
                      "        add_executable(bff-command src/command/main.cpp)" + "`n" +
                      "        target_link_libraries(bff-command bff)" + "`n" +
                      '        message(STATUS "CLI executable target added")' + "`n" +
                      "    endif()" + "`n" +
                      "endif()"
        
        # Save as CMakeLists-simple.txt
        Set-Content -Path "CMakeLists-simple.txt" -Value $BuildScript -Encoding UTF8
        
        # Now build with the simple CMakeLists
        Write-Host "Configuring BFF with custom CMakeLists..."
        cmake -B $BFFBuildDir -S . `
          -DCMAKE_BUILD_TYPE=Release `
          -DBFF_BUILD_GUI=ON `
          -DBFF_BUILD_CLI=ON `
          -G "Visual Studio 17 2022" `
          -A x64
        
        Write-Host "Building BFF..."
        cmake --build $BFFBuildDir --config Release --parallel
        
        Write-Host "BFF build completed!"

    - name: Check for built executables
      shell: pwsh
      run: |
        $BFFBuildDir = "bff-build"
        Write-Host "Checking for built executables in $BFFBuildDir..."
        
        # Look for any executables
        $exes = Get-ChildItem -Path $BFFBuildDir -Filter "*.exe" -Recurse
        if ($exes.Count -gt 0) {
            Write-Host "Found $($exes.Count) executables:"
            foreach ($exe in $exes) {
                Write-Host "  - $($exe.FullName)"
            }
        } else {
            Write-Host "No executables found. Checking for libraries..."
            $libs = Get-ChildItem -Path $BFFBuildDir -Filter "*.lib" -Recurse
            Write-Host "Found $($libs.Count) libraries"
        }
        
        # Check build output directory structure
        Write-Host "Build directory structure:"
        Get-ChildItem -Path $BFFBuildDir -Directory | ForEach-Object {
            Write-Host "  $($_.Name)/"
        }

    - name: Build BFF using original CMake with patched paths
      shell: pwsh
      if: failure()
      run: |
        Write-Host "Trying alternative build with patched paths..."
        cd "${{ github.workspace }}"
        
        $SuiteSparseDir = "$pwd\suitesparse-build\install"
        $BFFBuildDir = "bff-build-alt"
        
        # Create wrapper using string concatenation
        $WrapperCMake = "cmake_minimum_required(VERSION 3.1.0)" + "`n" +
                       "`n" +
                       "# Manually set SuiteSparse paths before including original CMakeLists" + "`n" +
                       "set(SuiteSparse_FOUND ON)" + "`n" +
                       'set(SuiteSparse_INCLUDE_DIRS "' + $SuiteSparseDir + '/include;' + $SuiteSparseDir + '/include/suitesparse")' + "`n" +
                       'set(SuiteSparse_LIBRARY_DIRS "' + $SuiteSparseDir + '/lib")' + "`n" +
                       'set(SuiteSparse_LIBRARIES "' + $SuiteSparseDir + '/lib/amd.lib;' + $SuiteSparseDir + '/lib/camd.lib;' + $SuiteSparseDir + '/lib/colamd.lib;' + $SuiteSparseDir + '/lib/ccolamd.lib;' + $SuiteSparseDir + '/lib/cholmod.lib;' + $SuiteSparseDir + '/lib/suitesparseconfig.lib")' + "`n" +
                       "`n" +
                       "# Set individual component variables" + "`n" +
                       "set(SuiteSparse_AMD_FOUND ON)" + "`n" +
                       "set(SuiteSparse_CAMD_FOUND ON)" + "`n" +
                       "set(SuiteSparse_COLAMD_FOUND ON)" + "`n" +
                       "set(SuiteSparse_CCOLAMD_FOUND ON)" + "`n" +
                       "set(SuiteSparse_CHOLMOD_FOUND ON)" + "`n" +
                       "set(SuiteSparse_SUITESPARSECONFIG_FOUND ON)" + "`n" +
                       "`n" +
                       '# Now include the original CMakeLists' + "`n" +
                       'include("CMakeLists.txt")'
        
        # Save wrapper
        Set-Content -Path "CMakeLists-wrapper.txt" -Value $WrapperCMake -Encoding UTF8
        
        # Build with wrapper
        cmake -B $BFFBuildDir -S . `
          -DCMAKE_BUILD_TYPE=Release `
          -DBFF_BUILD_GUI=ON `
          -G "Visual Studio 17 2022" `
          -A x64
        
        cmake --build $BFFBuildDir --config Release --parallel

    - name: Collect and package any built artifacts
      shell: pwsh
      run: |
        $DistDir = "bff-dist"
        New-Item -ItemType Directory -Force -Path $DistDir
        
        Write-Host "Collecting any built artifacts..."
        
        # Check all possible build directories
        $BuildDirs = @("bff-build", "bff-build-alt")
        
        foreach ($buildDir in $BuildDirs) {
            if (Test-Path $buildDir) {
                Write-Host "Checking $buildDir for executables..."
                
                # Copy any executables
                $exes = Get-ChildItem -Path $buildDir -Filter "*.exe" -Recurse
                foreach ($exe in $exes) {
                    Write-Host "Found: $($exe.FullName)"
                    Copy-Item $exe.FullName -Destination $DistDir
                }
                
                # Copy any DLLs
                $dlls = Get-ChildItem -Path $buildDir -Filter "*.dll" -Recurse
                foreach ($dll in $dlls) {
                    Write-Host "Found DLL: $($dll.FullName)"
                    Copy-Item $dll.FullName -Destination $DistDir
                }
            }
        }
        
        # Copy SuiteSparse DLLs
        $SuiteSparseDir = "$pwd\suitesparse-build\install"
        Write-Host "Copying SuiteSparse DLLs..."
        
        if (Test-Path "$SuiteSparseDir\lib") {
            $suiteDlls = Get-ChildItem -Path "$SuiteSparseDir\lib" -Filter "*.dll" -Recurse
            foreach ($dll in $suiteDlls) {
                Copy-Item $dll.FullName -Destination $DistDir
            }
        }
        
        # Copy system DLLs
        $systemDir = "$env:SystemRoot\System32"
        $runtimeDlls = @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")
        
        foreach ($dllName in $runtimeDlls) {
            $dllPath = "$systemDir\$dllName"
            if (Test-Path $dllPath) {
                Copy-Item $dllPath -Destination $DistDir
            }
        }
        
        # Create README using string concatenation
        $ReadmeContent = "Boundary First Flattening (BFF) v1.6 Windows Build Attempt" + "`n" + 
                         "======================================================" + "`n" + 
                         "Built: $(Get-Date -Format 'yyyy-MM-dd HH:mm')" + "`n" + 
                         "" + "`n" + 
                         "NOTE: This is a build attempt. Executables may or may not be present." + "`n" + 
                         "" + "`n" + 
                         "If executables are present:" + "`n" + 
                         "1. Place all files in the same directory" + "`n" + 
                         "2. Run BFF.exe for GUI interface" + "`n" + 
                         "3. Run bff-command.exe for command line" + "`n" + 
                         "" + "`n" + 
                         "DLLs included for testing:" + "`n" + 
                         "- SuiteSparse libraries" + "`n" + 
                         "- Visual C++ Runtime" + "`n" + 
                         "" + "`n" + 
                         "Build logs available in GitHub Actions workflow."
        
        Set-Content -Path "$DistDir\README.txt" -Value $ReadmeContent -Encoding UTF8
        
        # Create ZIP if there are files
        if ((Get-ChildItem -Path $DistDir).Count -gt 0) {
            Compress-Archive -Path "$DistDir\*" -DestinationPath "BFF-Windows-v1.6.zip" -Force
            Write-Host "ZIP archive created"
        }

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BFF-Windows-Build-Attempt
        path: |
          bff-dist/
          BFF-Windows-v1.6.zip
        retention-days: 7

    - name: Final status
      shell: pwsh
      run: |
        Write-Host "=== BUILD SUMMARY ==="
        Write-Host "SuiteSparse built: $(Test-Path 'suitesparse-build/install')"
        Write-Host "BFF build attempted: $(Test-Path 'bff-build')"
        Write-Host "Artifacts collected: $(if (Test-Path 'bff-dist') { (Get-ChildItem 'bff-dist').Count } else { 0 })"
        Write-Host "==================="
