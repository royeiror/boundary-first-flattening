name: Build BFF for Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout BFF repository
      uses: actions/checkout@v4
      with:
        repository: royeiror/boundary-first-flattening
        
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2
      
    - name: Install CMake
      uses: jwlawson/actions-setup-cmake@v1
      with:
        cmake-version: '3.28.x'
        
    - name: Create dummy SuiteSparse
      shell: cmd
      run: |
        echo Creating dummy SuiteSparse installation...
        
        rem Clean and create directories
        if exist suitesparse rd /s /q suitesparse
        mkdir suitesparse
        mkdir suitesparse\install
        mkdir suitesparse\install\include
        mkdir suitesparse\install\include\suitesparse
        mkdir suitesparse\install\lib
        
        rem Create dummy headers
        echo /* Dummy SuiteSparse_config.h */ > suitesparse\install\include\suitesparse\SuiteSparse_config.h
        echo #ifndef SUITESPARSE_CONFIG_H >> suitesparse\install\include\suitesparse\SuiteSparse_config.h
        echo #define SUITESPARSE_CONFIG_H >> suitesparse\install\include\suitesparse\SuiteSparse_config.h
        echo #define SUITESPARSE_VERSION "7.6.1" >> suitesparse\install\include\suitesparse\SuiteSparse_config.h
        echo #endif >> suitesparse\install\include\suitesparse\SuiteSparse_config.h
        
        echo /* Dummy amd.h */ > suitesparse\install\include\suitesparse\amd.h
        echo #ifndef AMD_H >> suitesparse\install\include\suitesparse\amd.h
        echo #define AMD_H >> suitesparse\install\include\suitesparse\amd.h
        echo #endif >> suitesparse\install\include\suitesparse\amd.h
        
        echo /* Dummy colamd.h */ > suitesparse\install\include\suitesparse\colamd.h
        echo #ifndef COLAMD_H >> suitesparse\install\include\suitesparse\colamd.h
        echo #define COLAMD_H >> suitesparse\install\include\suitesparse\colamd.h
        echo #endif >> suitesparse\install\include\suitesparse\colamd.h
        
        echo /* Dummy cholmod.h */ > suitesparse\install\include\suitesparse\cholmod.h
        echo #ifndef CHOLMOD_H >> suitesparse\install\include\suitesparse\cholmod.h
        echo #define CHOLMOD_H >> suitesparse\install\include\suitesparse\cholmod.h
        echo #endif >> suitesparse\install\include\suitesparse\cholmod.h
        
        rem Create dummy libraries
        cd suitesparse\install\lib
        echo dummy > suitesparseconfig.lib
        echo dummy > amd.lib
        echo dummy > colamd.lib
        echo dummy > cholmod.lib
        
        echo Dummy SuiteSparse created
        
    - name: Modify CMakeLists.txt
      shell: cmd
      run: |
        echo Modifying CMakeLists.txt...
        
        rem Create a modified version
        (
          echo # Comment out SuiteSparse requirement
          echo # find_package(SuiteSparse REQUIRED)
          echo.
          echo # Manual setup
          echo set(SUITESPARSE_FOUND TRUE)
          echo set(SUITESPARSE_INCLUDE_DIRS "${CMAKE_CURRENT_SOURCE_DIR}/../suitesparse/install/include/suitesparse")
          echo set(SUITESPARSE_LIBRARIES 
          echo     "${CMAKE_CURRENT_SOURCE_DIR}/../suitesparse/install/lib/cholmod.lib"
          echo     "${CMAKE_CURRENT_SOURCE_DIR}/../suitesparse/install/lib/amd.lib"
          echo     "${CMAKE_CURRENT_SOURCE_DIR}/../suitesparse/install/lib/colamd.lib"
          echo     "${CMAKE_CURRENT_SOURCE_DIR}/../suitesparse/install/lib/suitesparseconfig.lib")
          echo set(CHOLMOD_FOUND TRUE)
          echo set(CHOLMOD_LIBRARIES "${CMAKE_CURRENT_SOURCE_DIR}/../suitesparse/install/lib/cholmod.lib")
          echo set(CHOLMOD_INCLUDE_DIRS "${CMAKE_CURRENT_SOURCE_DIR}/../suitesparse/install/include/suitesparse")
          echo.
        ) > CMakeLists_modified.txt
        
        rem Append original CMakeLists.txt
        type CMakeLists.txt >> CMakeLists_modified.txt
        
        rem Replace original
        move /y CMakeLists_modified.txt CMakeLists.txt
        
        echo CMakeLists.txt modified
        
    - name: Try to configure BFF
      shell: cmd
      run: |
        echo Trying to configure BFF...
        if exist build rd /s /q build
        mkdir build
        cd build
        
        rem Try simple configuration
        cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
        
    - name: Try to build BFF
      shell: cmd
      run: |
        echo Trying to build BFF...
        cd build
        
        cmake --build . --config Release
        
        echo Build attempt complete
        if exist Release\*.exe (
          echo Found executables:
          dir Release\*.exe
        ) else (
          echo No executables found in Release directory
        )
        
    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: bff-build
        path: |
          build/
          suitesparse/
        retention-days: 7
