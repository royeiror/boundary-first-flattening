name: Build BFF Viewer

on: workflow_dispatch

jobs:
  build-viewer:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Install vcpkg with SuiteSparse
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg install suitesparse:x64-windows
        .\vcpkg\vcpkg install lapack-reference:x64-windows
        
    - name: Create FindSuiteSparse.cmake (NO complex strings)
      run: |
        $vcpkgPath = "$env:GITHUB_WORKSPACE/vcpkg/installed/x64-windows"
        $vcpkgPath = $vcpkgPath -replace '\\', '/'
        
        # Write file line by line with no complex escaping
        $file = "cmake/FindSuiteSparse.cmake"
        
        # Clear file
        "" | Set-Content $file
        
        # Append lines one by one
        "# FindSuiteSparse.cmake for CI" | Add-Content $file
        "set(SuiteSparse_FOUND TRUE)" | Add-Content $file
        "set(SuiteSparse_INCLUDE_DIR `"$vcpkgPath/include`")" | Add-Content $file
        "set(SuiteSparse_LIBRARY_DIR `"$vcpkgPath/lib`")" | Add-Content $file
        "set(SuiteSparse_CHOLMOD_FOUND TRUE)" | Add-Content $file
        "set(SuiteSparse_AMD_FOUND TRUE)" | Add-Content $file
        "set(SuiteSparse_CAMD_FOUND TRUE)" | Add-Content $file
        "set(SuiteSparse_COLAMD_FOUND TRUE)" | Add-Content $file
        "set(SuiteSparse_CCOLAMD_FOUND TRUE)" | Add-Content $file
        "set(SuiteSparse_UMFPACK_FOUND TRUE)" | Add-Content $file
        "set(SuiteSparse_SPQR_FOUND TRUE)" | Add-Content $file
        "set(SuiteSparse_CHOLMOD_LIBRARY `"$vcpkgPath/lib/cholmod.lib`")" | Add-Content $file
        "set(SuiteSparse_AMD_LIBRARY `"$vcpkgPath/lib/amd.lib`")" | Add-Content $file
        "set(SuiteSparse_BLAS_LIBRARY `"$vcpkgPath/lib/openblas.lib`")" | Add-Content $file
        "set(SuiteSparse_LAPACK_LIBRARY `"$vcpkgPath/lib/lapack.lib`")" | Add-Content $file
        "message(STATUS `"SuiteSparse configured`")" | Add-Content $file
        
        echo "Created $file"
        
    - name: Copy headers
      run: |
        mkdir include -Force
        $vcpkgPath = "$env:GITHUB_WORKSPACE/vcpkg/installed/x64-windows"
        
        # Simple copy of any .h files
        Get-ChildItem $vcpkgPath -Filter "*.h" -Recurse | ForEach-Object {
            Copy-Item $_.FullName "include/$($_.Name)" -Force -ErrorAction SilentlyContinue
        }
        
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1
      
    - name: Configure CMake
      run: |
        cmake -B build -DBFF_BUILD_GUI=ON -DCMAKE_BUILD_TYPE=Release
        
    - name: Build
      run: |
        cmake --build build --config Release
        
    - name: Check results
      run: |
        if (Test-Path "build/Release/bff-viewer.exe") {
            echo "✅ Viewer built!"
        } else {
            echo "❌ No viewer found"
            dir build -Recurse -Filter *.exe
        }
