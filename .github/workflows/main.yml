name: Build BFF v1.6 for Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  BUILD_TYPE: "Release"

jobs:
  build-suite-sparse:
    name: Build SuiteSparse
    runs-on: windows-latest
    outputs:
      suitesparse-path: ${{ steps.set-output.outputs.suitesparse-path }}
    steps:
      - name: Checkout SuiteSparse
        uses: actions/checkout@v4
        with:
          repository: jlblancoc/suitesparse-metis-for-windows
          path: suitesparse-src

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v1
        with:
          cmake-version: "3.25.x"

      - name: Build SuiteSparse (Static with OpenBLAS)
        run: |
          mkdir suitesparse-build
          cd suitesparse-build
          
          cmake ../suitesparse-src `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE/install" `
            -DBLA_VENDOR=OpenBLAS `
            -DENABLE_CUDA=OFF `
            -DBUILD_METIS=ON `
            -DBUILD_CHOLMOD=ON `
            -DBUILD_UMFPACK=ON `
            -DBUILD_SPQR=ON `
            -DBUILD_AMD=ON `
            -DBUILD_COLAMD=ON `
            -DBUILD_CCOLAMD=ON `
            -DBUILD_CAMD=ON `
            -DBUILD_Suitesparseconfig=ON `
            -DBUILD_SHARED_LIBS=OFF `
            -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=OFF
          
          cmake --build . --config Release --target install --parallel

      - name: Set SuiteSparse path
        id: set-output
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE "install"
          Write-Host "Setting SuiteSparse path to: $path"
          echo "suitesparse-path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload SuiteSparse artifacts
        uses: actions/upload-artifact@v4
        with:
          name: suitesparse-windows-static
          path: install/
          if-no-files-found: error
          retention-days: 1

  build-bff:
    name: Build BFF GUI Application
    runs-on: windows-latest
    needs: build-suite-sparse
    steps:
      - name: Checkout BFF v1.6 with Submodules
        uses: actions/checkout@v4
        with:
          repository: GeometryCollective/boundary-first-flattening
          ref: v1.6
          submodules: recursive

      - name: Download SuiteSparse artifacts
        uses: actions/download-artifact@v4
        with:
          name: suitesparse-windows-static
          path: suitesparse-deps

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v1
        with:
          cmake-version: "3.25.x"

      - name: Debug SuiteSparse structure
        run: |
          Write-Host "=== Checking SuiteSparse artifact structure ==="
          $SUITESPARSE_DIR = (Resolve-Path "suitesparse-deps").Path
          Write-Host "SuiteSparse directory: $SUITESPARSE_DIR"
          
          Write-Host "`nInclude directory contents:"
          if (Test-Path "$SUITESPARSE_DIR/include") {
            Get-ChildItem "$SUITESPARSE_DIR/include" -File | Select-Object -First 20 Name
            Write-Host "`nChecking for suitesparse subdirectory:"
            if (Test-Path "$SUITESPARSE_DIR/include/suitesparse") {
              Get-ChildItem "$SUITESPARSE_DIR/include/suitesparse" -Filter "*.h" | Select-Object -First 10 Name
            }
          }
          
          Write-Host "`nLib directory contents:"
          if (Test-Path "$SUITESPARSE_DIR/lib") {
            Get-ChildItem "$SUITESPARSE_DIR/lib" -File | Select-Object Name
          }
          
          # Set environment variable for later steps
          echo "SUITESPARSE_DIR=$SUITESPARSE_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create blas.lib symlink for OpenBLAS
        run: |
          $openblasLib = "$env:GITHUB_WORKSPACE\deps\openblas-windows\lib\libopenblas.lib"
          $blasSymlink = "$env:GITHUB_WORKSPACE\deps\openblas-windows\lib\blas.lib"
          
          if (Test-Path $openblasLib) {
            New-Item -ItemType SymbolicLink -Path $blasSymlink -Target $openblasLib -Force
            Write-Host "✓ Created blas.lib symlink to libopenblas.lib"
          } else {
            Write-Host "✗ libopenblas.lib not found at: $openblasLib"
            exit 1
          }

      - name: Patch BFF Source Files
        shell: pwsh
        run: |
          # Patch cblas.h includes
          $cblasPath = "$env:GITHUB_WORKSPACE\deps\openblas-windows\include\cblas.h"
          $relativePath = "../../deps/openblas-windows/include/cblas.h"
          
          Write-Host "Patching cblas.h includes..."
          
          $filesToPatch = @(
            "$env:GITHUB_WORKSPACE\include\bff\linear-algebra\Common.h",
            "$env:GITHUB_WORKSPACE\include\bff\linear-algebra\DenseMatrix.inl",
            "$env:GITHUB_WORKSPACE\include\bff\linear-algebra\Cholesky.inl"
          )
          
          foreach ($file in $filesToPatch) {
            if (Test-Path $file) {
              $content = Get-Content $file -Raw
              $newContent = $content -replace '#include <cblas\.h>', "#include `"$relativePath`""
              $newContent = $newContent -replace '#include "cblas\.h"', "#include `"$relativePath`""
              
              if ($newContent -ne $content) {
                Set-Content $file -Value $newContent -NoNewline
                Write-Host "✓ Patched $((Get-Item $file).Name) for cblas.h"
              }
            }
          }

      - name: Patch Common.h for SuiteSparse headers
        shell: pwsh
        run: |
          $CommonHeader = "$env:GITHUB_WORKSPACE\include\bff\linear-algebra\Common.h"
          
          if (Test-Path $CommonHeader) {
            Write-Host "Patching Common.h for SuiteSparse headers..."
            
            $content = Get-Content $CommonHeader -Raw
            
            # Replace cholmod.h include
            $newContent = $content -replace '#include <cholmod\.h>', '#include <suitesparse/cholmod.h>'
            $newContent = $newContent -replace '#include "cholmod\.h"', '#include <suitesparse/cholmod.h>'
            
            if ($newContent -ne $content) {
              Set-Content $CommonHeader -Value $newContent -NoNewline
              Write-Host "✓ Patched Common.h for SuiteSparse headers"
            }
          }

      - name: Add BFF_API Export Macros
        shell: pwsh
        run: |
          $commonHeader = "$env:GITHUB_WORKSPACE\include\bff\linear-algebra\Common.h"
          
          if (Test-Path $commonHeader) {
            $content = Get-Content $commonHeader -Raw
            $apiMacro = "#ifdef _WIN32" + "`n" +
              "#ifdef BFF_EXPORTS" + "`n" +
              "#define BFF_API __declspec(dllexport)" + "`n" +
              "#else" + "`n" +
              "#define BFF_API __declspec(dllimport)" + "`n" +
              "#endif" + "`n" +
              "#else" + "`n" +
              "#define BFF_API" + "`n" +
              "#endif" + "`n" +
              "`n"
            
            if ($content -notmatch 'BFF_API') {
              $content = $apiMacro + $content
              Set-Content $commonHeader -Value $content -NoNewline
              Write-Host "✓ Added BFF_API macros to Common.h"
            }
          }
          
          $commonSource = "$env:GITHUB_WORKSPACE\src\linear-algebra\Common.cpp"
          if (Test-Path $commonSource) {
            $sourceContent = Get-Content $commonSource -Raw
            if ($sourceContent -notmatch 'BFF_EXPORTS') {
              $sourceContent = "#define BFF_EXPORTS" + "`n" + $sourceContent
              Set-Content $commonSource -Value $sourceContent -NoNewline
              Write-Host "✓ Added BFF_EXPORTS to Common.cpp"
            }
          }

      - name: Patch CMakeLists.txt to bypass FindSuiteSparse
        shell: pwsh
        run: |
          $SUITESPARSE_DIR = $env:SUITESPARSE_DIR
          $CMAKELISTS = "CMakeLists.txt"
          
          Write-Host "Patching CMakeLists.txt to manually set SuiteSparse..."
          
          # Convert Windows path to CMake-friendly format (forward slashes)
          $SUITESPARSE_DIR_CMAKE = $SUITESPARSE_DIR -replace '\\', '/'
          
          # Check what libraries actually exist
          Write-Host "Checking for available SuiteSparse libraries in $SUITESPARSE_DIR/lib..."
          $libFiles = Get-ChildItem "$SUITESPARSE_DIR/lib" -Filter "*.lib" | Select-Object -ExpandProperty Name
          Write-Host "Available libraries: $libFiles"
          
          # Build library list based on what actually exists
          $libraryList = @()
          $commonLibraries = @("amd", "camd", "ccolamd", "colamd", "cholmod", "spqr", "ldl", "btf", "klu", "cxsparse", "umfpack")
          
          foreach ($lib in $commonLibraries) {
            $libName = "lib${lib}.lib"
            $libPath = "$SUITESPARSE_DIR/lib/$libName"
            if (Test-Path $libPath) {
              $libraryList += "`"$SUITESPARSE_DIR_CMAKE/lib/$libName`""
              Write-Host "✓ Adding library: $libName"
            } else {
              Write-Host "⚠ Library not found: $libName"
            }
          }
          
          # Add suitesparseconfig.lib (without lib prefix)
          $suitesparseconfigPath = "$SUITESPARSE_DIR/lib/suitesparseconfig.lib"
          if (Test-Path $suitesparseconfigPath) {
            $libraryList += "`"$SUITESPARSE_DIR_CMAKE/lib/suitesparseconfig.lib`""
            Write-Host "✓ Adding library: suitesparseconfig.lib"
          }
          
          # Check for OpenBLAS/BLAS library
          $openblasLib = "$env:GITHUB_WORKSPACE/deps/openblas-windows/lib/blas.lib"
          if (Test-Path $openblasLib) {
            $openblasPath = $openblasLib -replace '\\', '/'
            $libraryList += "`"$openblasPath`""
            Write-Host "✓ Adding OpenBLAS library: $openblasPath"
          }
          
          # Create the manual setup string
          $MANUAL_SETUP = '# Manually set SuiteSparse paths (bypassing FindSuiteSparse)' + "`n" +
            'set(SuiteSparse_FOUND TRUE)' + "`n" +
            'set(SuiteSparse_INCLUDE_DIRS "' + $SUITESPARSE_DIR_CMAKE + '/include")' + "`n" +
            'set(SuiteSparse_LIBRARY_DIRS "' + $SUITESPARSE_DIR_CMAKE + '/lib")' + "`n" +
            'set(SuiteSparse_LIBRARIES' + "`n"
          
          foreach ($lib in $libraryList) {
            $MANUAL_SETUP += '  ' + $lib + "`n"
          }
          
          $MANUAL_SETUP += ')' + "`n" +
            'message(STATUS "Manually configured SuiteSparse:")' + "`n" +
            'message(STATUS "  Includes: ${SuiteSparse_INCLUDE_DIRS}")' + "`n" +
            'message(STATUS "  Libraries: ${SuiteSparse_LIBRARIES}")' + "`n"
          
          # Read the entire file
          $content = Get-Content $CMAKELISTS -Raw
          
          # Try different patterns to find and replace - replace the 2nd find_package(SuiteSparse)
          $newContent = $content -replace 'find_package\(SuiteSparse REQUIRED\)', $MANUAL_SETUP
          
          if ($newContent -ne $content) {
            Set-Content -Path $CMAKELISTS -Value $newContent -NoNewline
            Write-Host "✓ Patched CMakeLists.txt - replaced find_package(SuiteSparse REQUIRED)"
          } else {
            Write-Host "⚠ Could not find find_package(SuiteSparse REQUIRED)"
            # Try to insert after first find_package(SuiteSparse QUIET NO_MODULE)
            $newContent = $content -replace '(find_package\(SuiteSparse QUIET NO_MODULE\)[^}]*\})', '$1' + "`n`n" + $MANUAL_SETUP
            Set-Content -Path $CMAKELISTS -Value $newContent -NoNewline
            Write-Host "✓ Inserted manual SuiteSparse setup"
          }
          
          # Also need to ensure BLAS is found - add a separate patch for BLAS
          if (Test-Path $openblasLib) {
            $openblasPathCmake = $openblasLib -replace '\\', '/'
            $BLAS_PATCH = "`n" + 
              '# Manually set BLAS for SuiteSparse' + "`n" +
              'set(BLAS_FOUND TRUE)' + "`n" +
              'set(BLAS_LIBRARIES "' + $openblasPathCmake + '")' + "`n" +
              'set(LAPACK_FOUND TRUE)' + "`n" +
              'set(LAPACK_LIBRARIES "' + $openblasPathCmake + '")' + "`n"
            
            # Add BLAS patch at the end of the file
            $finalContent = Get-Content $CMAKELISTS -Raw
            $finalContent = $finalContent + $BLAS_PATCH
            Set-Content -Path $CMAKELISTS -Value $finalContent -NoNewline
            Write-Host "✓ Added BLAS/LAPACK configuration"
          }
      - name: Clean build directory
        run: |
          if (Test-Path "build") {
            Remove-Item -Recurse -Force "build" -ErrorAction SilentlyContinue
          }
          mkdir build

      - name: Configure BFF with CMake (Simple approach)
        run: |
          cd build
          
          $SUITESPARSE_DIR = $env:SUITESPARSE_DIR
          $BFF_OPENBLAS_INCLUDE = "$env:GITHUB_WORKSPACE\deps\openblas-windows\include"
          $BFF_OPENBLAS_LIB = "$env:GITHUB_WORKSPACE\deps\openblas-windows\lib"
          
          Write-Host "Configuring with SuiteSparse at: $SUITESPARSE_DIR"
          
          # Very simple configuration
          cmake .. `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_GUI=ON `
            -DBUILD_CLI=ON `
            -DBUILD_SHARED_LIBS=OFF `
            -DBFF_EXPORTS=ON `
            -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=OFF `
            -G "Visual Studio 17 2022" `
            -A x64

      - name: Patch NanoGUI for Static Build
        run: |
          $NanoGUICMake = "$env:GITHUB_WORKSPACE\deps\nanogui\CMakeLists.txt"
          
          if (Test-Path $NanoGUICMake) {
            $content = Get-Content $NanoGUICMake -Raw
            
            if ($content -notmatch "BUILD_SHARED_LIBS OFF") {
              $patchText = "`n`n" + 
                "# Force static build for Windows compatibility" + "`n" +
                "set(BUILD_SHARED_LIBS OFF CACHE BOOL `"Build static libraries`" FORCE)" + "`n" +
                "set(CMAKE_WINDOWS_EXPORT_ALL_SYMBOLS OFF CACHE BOOL `"Disable auto-export`" FORCE)"
              
              Set-Content $NanoGUICMake -Value ($content + $patchText) -NoNewline
              Write-Host "✓ Added static build configuration to NanoGUI CMakeLists.txt"
            }
          }

      - name: Build BFF core library first (fixed)
        run: |
          cd build
          # First clean any previous failed builds
          cmake --build . --config Release --target clean
          # Build the bff library
          cmake --build . --config Release --target bff --parallel --verbose
          
          # Verify bff.lib was created
          if (Test-Path "Release\bff.lib") {
            Write-Host "✓ bff.lib successfully created"
            Write-Host "File size: $((Get-Item 'Release\bff.lib').Length) bytes"
          } else {
            Write-Host "✗ bff.lib not found after build"
            Write-Host "Checking what files were created in Release directory:"
            Get-ChildItem "Release\" -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Build BFF Viewer
        run: |
          cd build
          cmake --build . --config Release --target bff-viewer --parallel --verbose
          
          # Verify bff-viewer.exe was created
          if (Test-Path "Release\bff-viewer.exe") {
            Write-Host "✓ bff-viewer.exe successfully created"
            Write-Host "File size: $((Get-Item 'Release\bff-viewer.exe').Length) bytes"
          } else {
            Write-Host "✗ bff-viewer.exe not found after build"
            Write-Host "Checking what files were created in Release directory:"
            Get-ChildItem "Release\" -ErrorAction SilentlyContinue
            exit 1
          }
      - name: Gather Runtime Dependencies
        shell: pwsh
        run: |
          $exePath = "$env:GITHUB_WORKSPACE\build\Release\bff-viewer.exe"
          
          if (-not (Test-Path $exePath)) {
            Write-Host "✗ bff-viewer.exe not found"
            exit 1
          }
          
          Write-Host "✓ Found bff-viewer.exe"
          
          New-Item -ItemType Directory -Force -Path "dist"
          Copy-Item $exePath -Destination "dist\"
          
          # Copy DLLs
          $dllSources = @(
            "$env:GITHUB_WORKSPACE\deps\openblas-windows\lib\*.dll",
            "C:\Windows\System32\vcruntime140.dll",
            "C:\Windows\System32\msvcp140.dll",
            "C:\Windows\System32\vcruntime140_1.dll"
          )
          
          foreach ($source in $dllSources) {
            if (Test-Path $source) {
              Copy-Item $source -Destination "dist\" -ErrorAction SilentlyContinue
            }
          }

      - name: Create Final Package
        run: |
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\dist\*" -DestinationPath "bff-viewer-windows.zip"

      - name: Upload BFF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bff-viewer-windows
          path: bff-viewer-windows.zip
          retention-days: 7

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: bff-viewer-windows.zip
          draft: false
          prerelease: false
