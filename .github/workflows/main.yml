name: Build BFF for Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [created]
  workflow_dispatch:

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-windows

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install vcpkg and dependencies
      shell: powershell
      run: |
        # Install vcpkg
        git clone https://github.com/Microsoft/vcpkg.git $env:VCPKG_ROOT
        & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"
        
        # Install required dependencies
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET eigen3
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET libigl
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glfw3
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glew
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET freeglut
        & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET glm

    - name: Download SuiteSparse-METIS
      shell: powershell
      run: |
        Write-Host "Downloading SuiteSparse-METIS..."
        
        # Create directories
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse"
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse\include"
        New-Item -ItemType Directory -Force -Path "C:\SuiteSparse\lib"
        
        # Download from GitHub releases
        $url = "https://github.com/jlblancoc/suitesparse-metis-for-windows/releases/download/v1.4.0/SuiteSparse-4.5.1-METIS-5.1.0-Win-x64.zip"
        $output = "C:\SuiteSparse.zip"
        
        Write-Host "Downloading from: $url"
        Invoke-WebRequest -Uri $url -OutFile $output
        
        # Extract
        Expand-Archive -Path $output -DestinationPath "C:\SuiteSparseTemp\" -Force
        
        # Find and copy files
        Write-Host "Looking for files..."
        
        # Copy all header files
        Get-ChildItem -Path "C:\SuiteSparseTemp" -Recurse -Filter "*.h" | ForEach-Object {
          Copy-Item -Path $_.FullName -Destination "C:\SuiteSparse\include\" -Force
        }
        
        # Copy all library files
        Get-ChildItem -Path "C:\SuiteSparseTemp" -Recurse -Filter "*.lib" | ForEach-Object {
          Copy-Item -Path $_.FullName -Destination "C:\SuiteSparse\lib\" -Force
        }
        
        Write-Host "SuiteSparse installation complete"

    - name: Clone BFF source
      shell: powershell
      run: |
        Write-Host "Cloning BFF v1.6..."
        git clone --recursive --branch v1.6 https://github.com/GeometryCollective/boundary-first-flattening.git bff-source
        
        # Copy to current directory
        Copy-Item -Path "bff-source\*" -Destination "." -Recurse -Force
        
        Write-Host "BFF files copied to current directory"

    - name: Modify CMakeLists.txt
      shell: powershell
      run: |
        # Read the original CMakeLists.txt line by line
        $lines = Get-Content -Path "CMakeLists.txt"
        $newLines = @()
        
        foreach ($line in $lines) {
          if ($line -match 'find_package\(SuiteSparse REQUIRED\)') {
            # Replace with our custom SuiteSparse setup
            $newLines += "# Use our SuiteSparse installation"
            $newLines += 'set(SuiteSparse_DIR "C:/SuiteSparse")'
            $newLines += 'set(SuiteSparse_INCLUDE_DIR "C:/SuiteSparse/include")'
            $newLines += 'set(SuiteSparse_LIBRARY_DIR "C:/SuiteSparse/lib")'
            $newLines += ""
            $newLines += "# Manually set the libraries"
            $newLines += 'set(SuiteSparse_CHOLMOD_LIBRARY "C:/SuiteSparse/lib/cholmod.lib")'
            $newLines += 'set(SuiteSparse_AMD_LIBRARY "C:/SuiteSparse/lib/amd.lib")'
            $newLines += 'set(SuiteSparse_CAMD_LIBRARY "C:/SuiteSparse/lib/camd.lib")'
            $newLines += 'set(SuiteSparse_COLAMD_LIBRARY "C:/SuiteSparse/lib/colamd.lib")'
            $newLines += 'set(SuiteSparse_CCOLAMD_LIBRARY "C:/SuiteSparse/lib/ccolamd.lib")'
            $newLines += 'set(SuiteSparse_METIS_LIBRARY "C:/SuiteSparse/lib/metis.lib")'
            $newLines += ""
            $newLines += "# Set that SuiteSparse was found"
            $newLines += "set(SuiteSparse_FOUND ON)"
            $newLines += "set(SuiteSparse_CHOLMOD_FOUND ON)"
            $newLines += "set(SuiteSparse_AMD_FOUND ON)"
            $newLines += "set(SuiteSparse_CAMD_FOUND ON)"
            $newLines += "set(SuiteSparse_COLAMD_FOUND ON)"
            $newLines += "set(SuiteSparse_CCOLAMD_FOUND ON)"
            $newLines += "set(SuiteSparse_METIS_FOUND ON)"
          } else {
            $newLines += $line
          }
        }
        
        # Write the modified content back
        $newLines | Out-File -FilePath "CMakeLists.txt" -Encoding UTF8
        Write-Host "Modified CMakeLists.txt to use local SuiteSparse"

    - name: Configure CMake
      shell: powershell
      run: |
        # Create build directory
        New-Item -ItemType Directory -Force -Path "build"
        
        Write-Host "Configuring CMake..."
        
        # Configure with CMake
        cmake -B build `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=$env:VCPKG_DEFAULT_TRIPLET `
          -DSuiteSparse_DIR="C:/SuiteSparse" `
          -G "Visual Studio 17 2022" `
          -A x64

    - name: Build BFF
      shell: powershell
      run: |
        Write-Host "Building project..."
        cmake --build build --config Release --parallel 4

    - name: Find and copy executables
      shell: powershell
      run: |
        # Create distribution directory
        New-Item -ItemType Directory -Force -Path "dist"
        
        Write-Host "Searching for executables..."
        
        # Search for executables
        $exes = Get-ChildItem -Path "build" -Filter "*.exe" -Recurse
        foreach ($exe in $exes) {
          Write-Host "Found executable: $($exe.FullName)"
          Copy-Item -Path $exe.FullName -Destination "dist\" -Force
        }
        
        # Copy DLLs from vcpkg
        $vcpkgBinPath = "$env:VCPKG_ROOT\installed\$env:VCPKG_DEFAULT_TRIPLET\bin"
        if (Test-Path $vcpkgBinPath) {
          Write-Host "Copying DLLs from vcpkg..."
          Get-ChildItem -Path $vcpkgBinPath -Filter "*.dll" | Copy-Item -Destination "dist\" -Force
        }
        
        # Copy DLLs from SuiteSparse
        $suiteSparseLibPath = "C:\SuiteSparse\lib"
        if (Test-Path $suiteSparseLibPath) {
          Write-Host "Copying DLLs from SuiteSparse..."
          Get-ChildItem -Path $suiteSparseLibPath -Filter "*.dll" | Copy-Item -Destination "dist\" -Force
        }
        
        # List what we have
        Write-Host "`nFiles in dist directory:"
        Get-ChildItem -Path "dist"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BFF-Windows-Binaries
        path: dist/

    - name: Create release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/**
        generate_release_notes: true
